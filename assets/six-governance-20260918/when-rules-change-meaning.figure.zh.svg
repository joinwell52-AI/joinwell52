<svg xmlns="http://www.w3.org/2000/svg" width="800" height="830" viewBox="0 0 800 830" role="img" aria-labelledby="title"><title id="title">同一动作在三种历史下的决定</title><g font-family="Microsoft YaHei, Arial, sans-serif"><rect x="0" y="0" width="800" height="830" rx="20" fill="#faf9f5"/><text x="40" y="65" font-size="36" fill="#103da8" font-weight="700">编号相同，不代表历史已经恢复</text><text x="40" y="111" font-size="28" fill="#17335b" font-weight="400">相同 Agent、任务编号与发送动作</text><rect x="40" y="149" width="720" height="153" rx="20" fill="#eef3ff"/><text x="65" y="197" font-size="29" fill="#17335b" font-weight="700">完整历史</text><text x="65" y="250" font-size="28" fill="#17335b" font-weight="400">敏感读取 ＋ 审查记录</text><text x="575" y="250" font-size="33" fill="#103da8" font-weight="700">拒绝</text><rect x="40" y="327" width="720" height="153" rx="20" fill="#fff0dc"/><text x="65" y="375" font-size="29" fill="#17335b" font-weight="700">新引擎：只提供部分历史</text><text x="65" y="428" font-size="28" fill="#17335b" font-weight="400">只有审查记录</text><text x="575" y="428" font-size="33" fill="#88500b" font-weight="700">允许</text><rect x="40" y="505" width="720" height="153" rx="20" fill="#eef3ff"/><text x="65" y="553" font-size="29" fill="#17335b" font-weight="700">新引擎：补回敏感历史</text><text x="65" y="606" font-size="28" fill="#17335b" font-weight="400">敏感读取 ＋ 审查记录</text><text x="575" y="606" font-size="33" fill="#103da8" font-weight="700">拒绝</text><text x="40" y="729" font-size="27" fill="#17335b" font-weight="400">刻意遗漏历史的本地对照；没有真实发送。</text><text x="40" y="771" font-size="27" fill="#17335b" font-weight="400">kyvvu-engine 0.11.0 · 原策略判断结果</text><text x="40" y="812" font-size="27" fill="#17335b" font-weight="400">不能据此声称托管平台恢复失败。</text></g></svg>
