<svg xmlns="http://www.w3.org/2000/svg" width="800" height="780" viewBox="0 0 800 780" role="img" aria-labelledby="title"><title id="title">Two synthetic samples scored two ways</title><g font-family="Microsoft YaHei, Arial, sans-serif"><rect x="0" y="0" width="800" height="780" rx="20" fill="#faf9f5"/><text x="40" y="66" font-size="36" fill="#103da8" font-weight="700">Same predictions. Different scores.</text><text x="40" y="111" font-size="27" fill="#17335b" font-weight="400">Synthetic controls · original command-line entry</text><rect x="40" y="143" width="720" height="133" rx="20" fill="#eef3ff"/><text x="66" y="190" font-size="32" fill="#17335b" font-weight="600">One exact match</text><text x="66" y="237" font-size="28" fill="#17335b" font-weight="400">One false match: reference 1, prediction 10</text><rect x="40" y="304" width="720" height="167" rx="20" fill="#edf2ff"/><text x="66" y="351" font-size="31" fill="#103da8" font-weight="700">Substring membership</text><text x="66" y="399" font-size="27" fill="#17335b" font-weight="400">“1” occurs in “10” → counted as correct</text><text x="66" y="443" font-size="28" fill="#17335b" font-weight="400">2 / 2 counted correct</text><text x="565" y="447" font-size="44" fill="#103da8" font-weight="700">100%</text><rect x="40" y="494" width="720" height="167" rx="20" fill="#f0ecfa"/><text x="66" y="541" font-size="31" fill="#6944a4" font-weight="700">Integer equality</text><text x="66" y="589" font-size="27" fill="#17335b" font-weight="400">1 and 10 differ → counted as incorrect</text><text x="66" y="633" font-size="28" fill="#17335b" font-weight="400">1 / 2 counted correct</text><text x="595" y="637" font-size="44" fill="#6944a4" font-weight="700">50%</text><text x="40" y="713" font-size="27" fill="#17335b" font-weight="400">Shows the scoring effect on these two inputs.</text><text x="40" y="754" font-size="27" fill="#17335b" font-weight="400">Not a paper-wide rescore or a model error rate.</text></g></svg>
