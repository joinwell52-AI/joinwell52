<svg xmlns="http://www.w3.org/2000/svg" width="800" height="780" viewBox="0 0 800 780" role="img" aria-labelledby="title"><title id="title">两个合成样本的评分对照</title><g font-family="Microsoft YaHei, Arial, sans-serif"><rect x="0" y="0" width="800" height="780" rx="20" fill="#faf9f5"/><text x="40" y="66" font-size="36" fill="#103da8" font-weight="700">同样两道题，为什么得到两个分数？</text><text x="40" y="111" font-size="27" fill="#17335b" font-weight="400">已知答案的合成对照 · 原命令行入口</text><rect x="40" y="143" width="720" height="133" rx="20" fill="#eef3ff"/><text x="66" y="190" font-size="32" fill="#17335b" font-weight="600">一道正确匹配</text><text x="66" y="237" font-size="28" fill="#17335b" font-weight="400">一道误匹配：正确步骤 1，预测 10</text><rect x="40" y="304" width="720" height="167" rx="20" fill="#edf2ff"/><text x="66" y="351" font-size="31" fill="#103da8" font-weight="700">字符串包含判断</text><text x="66" y="399" font-size="27" fill="#17335b" font-weight="400">“1” 在 “10” 里面，也算答对</text><text x="66" y="443" font-size="28" fill="#17335b" font-weight="400">2 / 2 计为正确</text><text x="565" y="447" font-size="44" fill="#103da8" font-weight="700">100%</text><rect x="40" y="494" width="720" height="167" rx="20" fill="#f0ecfa"/><text x="66" y="541" font-size="31" fill="#6944a4" font-weight="700">整数相等判断</text><text x="66" y="589" font-size="27" fill="#17335b" font-weight="400">1 与 10 不相等，算答错</text><text x="66" y="633" font-size="28" fill="#17335b" font-weight="400">1 / 2 计为正确</text><text x="595" y="637" font-size="44" fill="#6944a4" font-weight="700">50%</text><text x="40" y="713" font-size="27" fill="#17335b" font-weight="400">只证明评分规则对这两个输入的影响。</text><text x="40" y="754" font-size="27" fill="#17335b" font-weight="400">不是原论文成绩重算；不是模型真实错误率。</text></g></svg>
