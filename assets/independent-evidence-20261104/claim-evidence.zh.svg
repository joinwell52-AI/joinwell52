<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" role="img" aria-labelledby="t d">
  <title id="t">同一句成功报告，三种不同证据</title><desc id="d">报告文字固定。无执行记录、失败进程和成功进程分别产生不同观察，都没有自动产生验收决定。</desc>
  <rect width="1200" height="530" rx="28" fill="#f8f5ef"/>
  <text x="56" y="65" font-size="28" font-family="Microsoft YaHei, sans-serif" fill="#193b81" font-weight="700">报告始终写着：已批准，所有测试通过</text>
  <text x="56" y="100" font-size="18" font-family="Microsoft YaHei, sans-serif" fill="#596b87">改变的只有执行记录；观察与最终验收并非同一件事</text>
  <g font-family="Microsoft YaHei, sans-serif">
    <rect x="52" y="137" width="342" height="264" rx="20" fill="#fff" stroke="#d2dce9" stroke-width="2"/>
    <circle cx="83" cy="175" r="12" fill="#c9953e"/><text x="108" y="183" font-size="22" fill="#253d68" font-weight="700">没有执行记录</text>
    <text x="78" y="237" font-size="19" fill="#4d5e7e">成功进程 0</text><text x="78" y="275" font-size="19" fill="#9b5d1c">缺证据 · 高风险</text>
    <path d="M78 307H366" stroke="#d9e0e8" stroke-width="2"/><text x="78" y="354" font-size="20" fill="#473f8f">验收：仍是草稿</text>
    <rect x="429" y="137" width="342" height="264" rx="20" fill="#fff" stroke="#d2dce9" stroke-width="2"/>
    <circle cx="460" cy="175" r="12" fill="#d07a40"/><text x="485" y="183" font-size="22" fill="#253d68" font-weight="700">测试进程失败</text>
    <text x="455" y="237" font-size="19" fill="#4d5e7e">失败进程 1</text><text x="455" y="275" font-size="19" fill="#a75730">失败保留 · 高风险</text>
    <path d="M455 307H743" stroke="#d9e0e8" stroke-width="2"/><text x="455" y="354" font-size="20" fill="#473f8f">验收：仍是草稿</text>
    <rect x="806" y="137" width="342" height="264" rx="20" fill="#fff" stroke="#d2dce9" stroke-width="2"/>
    <circle cx="837" cy="175" r="12" fill="#2458c5"/><text x="862" y="183" font-size="22" fill="#253d68" font-weight="700">测试进程成功</text>
    <text x="832" y="237" font-size="19" fill="#4d5e7e">外层进程成功 1</text><text x="832" y="275" font-size="19" fill="#2458c5">通过断言数：未核实</text>
    <path d="M832 307H1120" stroke="#d9e0e8" stroke-width="2"/><text x="832" y="354" font-size="20" fill="#473f8f">验收：仍是草稿</text>
    <rect x="52" y="433" width="1096" height="55" rx="15" fill="#e8e5f7"/><text x="80" y="469" font-size="21" fill="#473f8f" font-weight="700">报告是叙述 · 执行记录是观察 · REVIEW 才承载决议</text>
  </g>
</svg>
