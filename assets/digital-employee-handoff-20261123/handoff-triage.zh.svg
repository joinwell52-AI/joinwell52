<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 641 399" role="img" aria-labelledby="title" xml:lang="zh">
  <title id="title">从「等报告」找到下一位负责人</title>
  <rect width="641" height="399" rx="20" fill="#fffdf8"/>
  <g font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="19">
    <text x="26" y="49" font-size="26" font-weight="700" fill="#172942">从「等报告」找到下一位负责人</text>
    <text x="42" y="95" font-weight="650" fill="#435369">原始证据</text>
    <text x="381" y="95" font-weight="650" fill="#435369">可以接手的人</text>
    <path d="M26 311h589" stroke="#cbd0d9" stroke-dasharray="4 5"/>
    <rect x="26" y="117" width="271" height="50" rx="11" fill="#edf3ff"/>
    <path d="M313 143h35m-8-7 8 7-8 7" fill="none" stroke="#2450a9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="365" y="117" width="250" height="50" rx="11" fill="#edf3ff"/>
    <text x="42" y="149" fill="#2450a9">找不到收件岗位</text>
    <text x="381" y="149" fill="#2450a9">派工人</text>
    <rect x="26" y="184" width="271" height="50" rx="11" fill="#fff4dd"/>
    <path d="M313 210h35m-8-7 8 7-8 7" fill="none" stroke="#94600a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="365" y="184" width="250" height="50" rx="11" fill="#fff4dd"/>
    <text x="42" y="216" fill="#94600a">审批单仍待处理</text>
    <text x="381" y="216" fill="#94600a">有权审批的人</text>
    <rect x="26" y="251" width="271" height="50" rx="11" fill="#f4efff"/>
    <path d="M313 277h35m-8-7 8 7-8 7" fill="none" stroke="#61429a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="365" y="251" width="250" height="50" rx="11" fill="#f4efff"/>
    <text x="42" y="283" fill="#61429a">结果文件可核验</text>
    <text x="381" y="283" fill="#61429a">负责交付的人</text>
    <rect x="26" y="328" width="271" height="50" rx="11" fill="#f3f5f7"/>
    <path d="M313 354h35m-8-7 8 7-8 7" fill="none" stroke="#596477" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="365" y="328" width="250" height="50" rx="11" fill="#f3f5f7"/>
    <text x="42" y="360" fill="#596477">关键证据暂缺</text>
    <text x="381" y="360" fill="#596477">负责核实的人</text>
  </g>
</svg>
