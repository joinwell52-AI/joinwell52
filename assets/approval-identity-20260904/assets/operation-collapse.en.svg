<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#245dd5" stroke-width="1.5"/></marker></defs><rect width="1600" height="900" fill="#f5f8fd"/><text x="70" y="62" font-family="Microsoft YaHei, Arial" font-size="20" fill="#245dd5" font-weight="700">01 / OPERATION IDENTITY</text><text x="70" y="120" font-family="Microsoft YaHei, Arial" font-size="40" fill="#142746" font-weight="700">Different commands. The same approval identity.</text><text x="70" y="165" font-family="Microsoft YaHei, Arial" font-size="23" fill="#596d8d" font-weight="400">Observed decision path · controlled trials, not executed Git operations</text><rect x="70" y="225" width="590" height="145" rx="18" fill="#ffffff" stroke="#d6e0ef" stroke-width="2"/><text x="95" y="266" font-family="Microsoft YaHei, Arial" font-size="26" fill="#245dd5" font-weight="700">A · Originally approved</text><text x="95" y="310" font-family="Consolas" font-size="25" fill="#182d52" font-weight="400">git push origin</text><text x="95" y="346" font-family="Consolas" font-size="25" fill="#182d52" font-weight="400">codex/research-probe</text><rect x="70" y="415" width="590" height="145" rx="18" fill="#fffaf0" stroke="#e8c475" stroke-width="2"/><text x="95" y="456" font-family="Microsoft YaHei, Arial" font-size="26" fill="#a26609" font-weight="700">B · Target branch changed</text><text x="95" y="500" font-family="Consolas" font-size="25" fill="#182d52" font-weight="400">git push origin</text><text x="95" y="536" font-family="Consolas" font-size="25" fill="#a26609" font-weight="700">codex/another-target</text><path d="M660,298 L728,298" fill="none" stroke="#245dd5" stroke-width="3" marker-end="url(#arrow)"/><path d="M660,488 L728,488" fill="none" stroke="#245dd5" stroke-width="3" marker-end="url(#arrow)"/><rect x="750" y="225" width="780" height="335" rx="18" fill="#edf3ff" stroke="#b4c9f2" stroke-width="2"/><text x="785" y="272" font-family="Microsoft YaHei, Arial" font-size="30" fill="#245dd5" font-weight="700">Extracted operation facts</text><text x="785" y="322" font-family="Consolas" font-size="29" fill="#182d52" font-weight="400">kind: remote_git</text><text x="785" y="367" font-family="Consolas" font-size="29" fill="#a26609" font-weight="700">exact_targets: []</text><text x="785" y="412" font-family="Consolas" font-size="29" fill="#182d52" font-weight="400">confidence.complete: true</text><text x="785" y="465" font-family="Microsoft YaHei, Arial" font-size="25" fill="#596d8d" font-weight="400">Branch distinction is absent from the request.</text><text x="785" y="513" font-family="Microsoft YaHei, Arial" font-size="27" fill="#6542a7" font-weight="700">Fingerprint A = B   ·   Digest A = B</text><path d="M1140,560 L1140,611" fill="none" stroke="#245dd5" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="640" width="1460" height="136" rx="18" fill="#ffffff" stroke="#b4c9f2" stroke-width="2"/><text x="100" y="687" font-family="Microsoft YaHei, Arial" font-size="31" fill="#245dd5" font-weight="700">B matches A’s approval → allowed → approval consumed once</text><text x="100" y="737" font-family="Microsoft YaHei, Arial" font-size="25" fill="#596d8d" font-weight="400">Replay is rejected. Single consumption does not prove the correct operation consumed it.</text><text x="70" y="837" font-family="Microsoft YaHei, Arial" font-size="22" fill="#596d8d" font-weight="400">Evidence: changed-branch gate + local Codex resolution. No actual push was performed.</text></svg>