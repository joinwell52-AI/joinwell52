<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#245dd5" stroke-width="1.5"/></marker></defs><rect width="1600" height="900" fill="#f5f8fd"/><text x="70" y="62" font-family="Microsoft YaHei, Arial" font-size="20" fill="#245dd5" font-weight="700">02 / NESTED SESSION</text><text x="70" y="120" font-family="Microsoft YaHei, Arial" font-size="38" fill="#142746" font-weight="700">顶层排除了 Session，快照又把它带了回来</text><text x="70" y="165" font-family="Microsoft YaHei, Arial" font-size="24" fill="#596d8d" font-weight="400">命令相同 · 只改变 Session 输入</text><rect x="70" y="220" width="700" height="375" rx="18" fill="#ffffff" stroke="#d6e0ef" stroke-width="2"/><text x="98" y="267" font-family="Microsoft YaHei, Arial" font-size="28" fill="#245dd5" font-weight="700">请求 A · 原会话</text><text x="98" y="320" font-family="Consolas" font-size="25" fill="#7e8b9e" font-weight="400">subject.session_id: S1</text><text x="98" y="359" font-family="Microsoft YaHei, Arial" font-size="22" fill="#7e8b9e" font-weight="400">不进入摘要</text><rect x="92" y="390" width="656" height="170" rx="18" fill="#fff8ea" stroke="#e8c475" stroke-width="2"/><text x="110" y="431" font-family="Consolas" font-size="25" fill="#182d52" font-weight="400">snapshot.operation_facts</text><text x="110" y="475" font-family="Consolas" font-size="25" fill="#a26609" font-weight="700">  .subject.session_id: S1</text><text x="110" y="527" font-family="Microsoft YaHei, Arial" font-size="24" fill="#a26609" font-weight="700">仍进入摘要输入</text><rect x="830" y="220" width="700" height="375" rx="18" fill="#ffffff" stroke="#d6e0ef" stroke-width="2"/><text x="858" y="267" font-family="Microsoft YaHei, Arial" font-size="28" fill="#245dd5" font-weight="700">请求 B · 新会话</text><text x="858" y="320" font-family="Consolas" font-size="25" fill="#7e8b9e" font-weight="400">subject.session_id: S2</text><text x="858" y="359" font-family="Microsoft YaHei, Arial" font-size="22" fill="#7e8b9e" font-weight="400">不进入摘要</text><rect x="852" y="390" width="656" height="170" rx="18" fill="#fff8ea" stroke="#e8c475" stroke-width="2"/><text x="870" y="431" font-family="Consolas" font-size="25" fill="#182d52" font-weight="400">snapshot.operation_facts</text><text x="870" y="475" font-family="Consolas" font-size="25" fill="#a26609" font-weight="700">  .subject.session_id: S2</text><text x="870" y="527" font-family="Microsoft YaHei, Arial" font-size="24" fill="#a26609" font-weight="700">仍进入摘要输入</text><path d="M420,595 L420,638" fill="none" stroke="#245dd5" stroke-width="3" marker-end="url(#arrow)"/><path d="M1180,595 L1180,638" fill="none" stroke="#245dd5" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="662" width="1460" height="134" rx="18" fill="#edf3ff" stroke="#b4c9f2" stroke-width="2"/><text x="100" y="707" font-family="Microsoft YaHei, Arial" font-size="30" fill="#6542a7" font-weight="700">操作指纹相同 · 请求摘要不同</text><text x="100" y="755" font-family="Microsoft YaHei, Arial" font-size="27" fill="#245dd5" font-weight="700">再次要求审批；原批准仍为 available，没有被消费。</text><text x="70" y="845" font-family="Microsoft YaHei, Arial" font-size="22" fill="#596d8d" font-weight="400">机制示意，不是修复方案。S1 / S2 为示意会话标识，不是真实会话编号。</text></svg>