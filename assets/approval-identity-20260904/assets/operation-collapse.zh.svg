<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#245dd5" stroke-width="1.5"/></marker></defs><rect width="1600" height="900" fill="#f5f8fd"/><text x="70" y="62" font-family="Microsoft YaHei, Arial" font-size="20" fill="#245dd5" font-weight="700">01 / OPERATION IDENTITY</text><text x="70" y="120" font-family="Microsoft YaHei, Arial" font-size="40" fill="#142746" font-weight="700">不同命令，被压成了同一个批准对象</text><text x="70" y="165" font-family="Microsoft YaHei, Arial" font-size="23" fill="#596d8d" font-weight="400">实际审批链观察 · 受控对照，不是真实 Git 操作执行</text><rect x="70" y="225" width="590" height="145" rx="18" fill="#ffffff" stroke="#d6e0ef" stroke-width="2"/><text x="95" y="266" font-family="Microsoft YaHei, Arial" font-size="26" fill="#245dd5" font-weight="700">A · 原批准命令</text><text x="95" y="310" font-family="Consolas" font-size="25" fill="#182d52" font-weight="400">git push origin</text><text x="95" y="346" font-family="Consolas" font-size="25" fill="#182d52" font-weight="400">codex/research-probe</text><rect x="70" y="415" width="590" height="145" rx="18" fill="#fffaf0" stroke="#e8c475" stroke-width="2"/><text x="95" y="456" font-family="Microsoft YaHei, Arial" font-size="26" fill="#a26609" font-weight="700">B · 只改目标分支</text><text x="95" y="500" font-family="Consolas" font-size="25" fill="#182d52" font-weight="400">git push origin</text><text x="95" y="536" font-family="Consolas" font-size="25" fill="#a26609" font-weight="700">codex/another-target</text><path d="M660,298 L728,298" fill="none" stroke="#245dd5" stroke-width="3" marker-end="url(#arrow)"/><path d="M660,488 L728,488" fill="none" stroke="#245dd5" stroke-width="3" marker-end="url(#arrow)"/><rect x="750" y="225" width="780" height="335" rx="18" fill="#edf3ff" stroke="#b4c9f2" stroke-width="2"/><text x="785" y="272" font-family="Microsoft YaHei, Arial" font-size="30" fill="#245dd5" font-weight="700">提取后的操作事实</text><text x="785" y="322" font-family="Consolas" font-size="29" fill="#182d52" font-weight="400">kind: remote_git</text><text x="785" y="367" font-family="Consolas" font-size="29" fill="#a26609" font-weight="700">exact_targets: []</text><text x="785" y="412" font-family="Consolas" font-size="29" fill="#182d52" font-weight="400">confidence.complete: true</text><text x="785" y="465" font-family="Microsoft YaHei, Arial" font-size="25" fill="#596d8d" font-weight="400">审批请求没有保留分支区别。</text><text x="785" y="513" font-family="Microsoft YaHei, Arial" font-size="27" fill="#6542a7" font-weight="700">操作指纹 A = B   ·   请求摘要 A = B</text><path d="M1140,560 L1140,611" fill="none" stroke="#245dd5" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="640" width="1460" height="136" rx="18" fill="#ffffff" stroke="#b4c9f2" stroke-width="2"/><text x="100" y="687" font-family="Microsoft YaHei, Arial" font-size="31" fill="#245dd5" font-weight="700">B 匹配 A 的批准 → 允许 → 批准被一次消费</text><text x="100" y="737" font-family="Microsoft YaHei, Arial" font-size="25" fill="#596d8d" font-weight="400">再次消费仍被拒绝：一次消费有效，不等于批准对象正确。</text><text x="70" y="837" font-family="Microsoft YaHei, Arial" font-size="22" fill="#596d8d" font-weight="400">证据：改分支审批门及本地 Codex resolution；没有执行实际推送。</text></svg>