<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="同一个 A，两次不同的访问">
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#3554a6"/></marker></defs>
<rect width="1200" height="640" rx="24" fill="#faf8f3"/>
<g font-family="Arial,Microsoft YaHei,sans-serif" fill="#172d58">
<text x="52" y="70" font-size="32" font-weight="700">同一个 A，两次不同的访问</text><text x="52" y="112" font-size="20" fill="#53657c">固定原模块 + 可控异步顺序 · 非手机现场截图</text>
<path d="M367 255H426" fill="none" stroke="#3554a6" stroke-width="3" marker-end="url(#a)"/><path d="M671 255H730" fill="none" stroke="#3554a6" stroke-width="3" marker-end="url(#a)"/>
<rect x="52" y="175" width="315" height="160" rx="18" fill="#e7efff" stroke="#2856ad" stroke-width="2"/><text x="76" y="214" font-size="24" font-weight="700">第一次访问 A</text><text x="76" y="251" font-size="20">请求持有旧代际凭证</text><text x="76" y="281" font-size="20">结果仍在路上</text><rect x="441" y="175" width="230" height="160" rx="18" fill="#e7efff" stroke="#2856ad" stroke-width="2"/><text x="465" y="214" font-size="24" font-weight="700">切到 B</text><text x="465" y="251" font-size="20">范围改变</text><text x="465" y="281" font-size="20">旧代际退休</text><rect x="745" y="175" width="385" height="160" rx="18" fill="#e7efff" stroke="#2856ad" stroke-width="2"/><text x="769" y="214" font-size="24" font-weight="700">再次回到 A</text><text x="769" y="251" font-size="20">名字相同，代际已变</text><text x="769" y="281" font-size="20">旧结果提交：拒绝</text><rect x="52" y="385" width="1078" height="130" rx="18" fill="#fff1db" stroke="#b87812" stroke-width="2"/><text x="76" y="424" font-size="24" font-weight="700">边界：调用方未声明身份变化时</text><text x="76" y="461" font-size="20">受测对象无法自行感知变化；构造场景中旧值仍可读。不是已证实的登录漏洞。</text>
<text x="52" y="581" font-size="20" fill="#53657c">显示层仍需自己的顺序检查；缓存拒绝不等于所有页面都不会显示旧结果。</text></g></svg>
