<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">文件状态机的当前状态与迁移历史</title>
  <desc id="desc">路径保存当前阶段，迁移事件只追加；报告存在不等于业务验收。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#F9FCFF"/><stop offset="1" stop-color="#F6F1FF"/></linearGradient>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#0986D5"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#173D66" flood-opacity=".13"/></filter>
  </defs>
  <rect width="1200" height="680" rx="34" fill="url(#bg)"/>
  <text x="600" y="62" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="30" font-weight="700" fill="#123860">文件状态机：当前状态与迁移历史要分开保存</text>
  <text x="600" y="99" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#54718B">路径回答“现在在哪里”；只追加事件回答“怎样来到这里”</text>
  <text x="94" y="161" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#0877AC">当前路径（唯一阶段事实）</text>
  <g filter="url(#shadow)" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">
    <rect x="88" y="190" width="150" height="78" rx="20" fill="#EAF8FF" stroke="#83CFF2" stroke-width="2"/><text x="163" y="236" fill="#0877AC">inbox</text>
    <rect x="310" y="190" width="150" height="78" rx="20" fill="#DDF7FF" stroke="#48BAE6" stroke-width="2"/><text x="385" y="236" fill="#0877AC">active</text>
    <rect x="532" y="190" width="150" height="78" rx="20" fill="#EEEAFE" stroke="#9D86EE" stroke-width="2"/><text x="607" y="236" fill="#5740B8">review</text>
    <rect x="754" y="190" width="150" height="78" rx="20" fill="#E6FBF4" stroke="#59CBAE" stroke-width="2"/><text x="829" y="236" fill="#087A65">done</text>
    <rect x="976" y="190" width="150" height="78" rx="20" fill="#F0F4F8" stroke="#B4C1CB" stroke-width="2"/><text x="1051" y="236" fill="#496273">archive</text>
  </g>
  <g stroke="#0986D5" stroke-width="4" marker-end="url(#blueArrow)"><path d="M244 229 H300"/><path d="M466 229 H522"/><path d="M688 229 H744"/><path d="M910 229 H966"/></g>
  <rect x="74" y="330" width="1052" height="156" rx="24" fill="#FFF" stroke="#C8D8E8" stroke-width="2"/>
  <text x="104" y="372" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#5B2BA9">只追加迁移历史（因果顺序，不依赖目录时间戳）</text>
  <path d="M163 427 H1040" stroke="#7E67D8" stroke-width="5" stroke-linecap="round"/>
  <g font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" text-anchor="middle"><circle cx="163" cy="427" r="13" fill="#7E67D8"/><text x="163" y="460" fill="#42357F">创建</text><circle cx="385" cy="427" r="13" fill="#7E67D8"/><text x="385" y="460" fill="#42357F">领取</text><circle cx="607" cy="427" r="13" fill="#7E67D8"/><text x="607" y="460" fill="#42357F">提交</text><circle cx="829" cy="427" r="13" fill="#7E67D8"/><text x="829" y="460" fill="#42357F">审查决定</text><circle cx="1040" cy="427" r="13" fill="#7E67D8"/><text x="1040" y="460" fill="#42357F">归档</text></g>
  <g filter="url(#shadow)" font-family="Microsoft YaHei, Arial, sans-serif"><rect x="120" y="542" width="432" height="84" rx="20" fill="#F4F7FB" stroke="#C8D8E8"/><text x="148" y="577" font-size="18" font-weight="700" fill="#365675">REPORT：执行者提交的事实与证据</text><text x="148" y="606" font-size="15" fill="#54718B">它不能独自把任务变成“已验收”</text><rect x="648" y="542" width="432" height="84" rx="20" fill="#FFF5E7" stroke="#F0B661"/><text x="676" y="577" font-size="18" font-weight="700" fill="#A85B00">REVIEW / Acceptance：有权角色的决定</text><text x="676" y="606" font-size="15" fill="#786047">决定必须绑定当前修订和可检查证据</text></g>
</svg>
