<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">多 Agent 团队的三层分工</title>
  <desc id="desc">TMPA 定义治理语义，FCoP 固定文件状态与事件，CodeFlowMu 负责执行、派工和恢复。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#F7FBFF"/><stop offset="1" stop-color="#F1F0FF"/></linearGradient>
    <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#0679D8"/><stop offset="1" stop-color="#27C5E7"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#103B66" flood-opacity=".14"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#167DD2"/></marker>
  </defs>
  <rect width="1200" height="620" rx="34" fill="url(#bg)"/>
  <text x="600" y="66" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="30" font-weight="700" fill="#123860">让多个 Agent 成为团队的三层分工</text>
  <text x="600" y="103" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#54718B">不是三个同义词：理论定边界，协议留事实，工程轨道负责把任务跑起来</text>
  <g filter="url(#shadow)">
    <rect x="115" y="146" width="970" height="104" rx="22" fill="#F2EBFF" stroke="#B89CFF" stroke-width="2"/>
    <rect x="115" y="286" width="970" height="104" rx="22" fill="#EAF8FF" stroke="#83CFF2" stroke-width="2"/>
    <rect x="115" y="426" width="970" height="104" rx="22" fill="#EAFBF7" stroke="#6ED4C1" stroke-width="2"/>
  </g>
  <g font-family="Microsoft YaHei, Arial, sans-serif">
    <text x="160" y="190" font-size="24" font-weight="700" fill="#5B2BA9">TMPA</text>
    <text x="160" y="221" font-size="18" fill="#3D2B68">治理语义：身份、角色、生命周期与决定归属</text>
    <text x="160" y="330" font-size="24" font-weight="700" fill="#0877AC">FCoP</text>
    <text x="160" y="361" font-size="18" fill="#1C5572">文件事实：路径给出当前阶段，追加事件保留迁移历史</text>
    <text x="160" y="470" font-size="24" font-weight="700" fill="#007C69">CodeFlowMu</text>
    <text x="160" y="501" font-size="18" fill="#205D56">工程执行：派工、工具调用、报告归属、技术恢复</text>
  </g>
  <g font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700">
    <rect x="770" y="173" width="122" height="48" rx="24" fill="#FFF" stroke="#B89CFF"/><text x="831" y="204" text-anchor="middle" fill="#5B2BA9">谁可决定</text>
    <rect x="915" y="173" width="122" height="48" rx="24" fill="#FFF" stroke="#B89CFF"/><text x="976" y="204" text-anchor="middle" fill="#5B2BA9">何时成立</text>
    <rect x="770" y="313" width="122" height="48" rx="24" fill="#FFF" stroke="#83CFF2"/><text x="831" y="344" text-anchor="middle" fill="#0877AC">当前路径</text>
    <rect x="915" y="313" width="122" height="48" rx="24" fill="#FFF" stroke="#83CFF2"/><text x="976" y="344" text-anchor="middle" fill="#0877AC">追加事件</text>
    <rect x="770" y="453" width="122" height="48" rx="24" fill="#FFF" stroke="#6ED4C1"/><text x="831" y="484" text-anchor="middle" fill="#007C69">谁去执行</text>
    <rect x="915" y="453" width="122" height="48" rx="24" fill="#FFF" stroke="#6ED4C1"/><text x="976" y="484" text-anchor="middle" fill="#007C69">如何恢复</text>
  </g>
  <path d="M600 251 L600 282" stroke="#167DD2" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M600 391 L600 422" stroke="#167DD2" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M360 565 H840" stroke="url(#blue)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="430" cy="565" r="11" fill="#077FD5"/><circle cx="600" cy="565" r="11" fill="#7352D6"/><circle cx="770" cy="565" r="11" fill="#00A988"/>
  <text x="600" y="602" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#365675">同一稳定身份把 TASK、REPORT 与 REVIEW 的责任链连接起来</text>
</svg>
