<text x="148" y="135" fill="#f2f7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="56" font-weight="700">DEFERRED INTENTION ≠ MEMORY ENTRY</text><text x="151" y="187" fill="#9ac8df" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26">Prospective memory becomes reliable only when future authority has a lifecycle.</text><text x="151" y="780" fill="#72dff4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" letter-spacing="3">ACADEMIC OBSERVATION 006 · PM-BENCH</text>
