<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Durable event identity and terminal evidence figure</title><desc id="desc">One logical occurrence keeps the same event identity across delivery retries and ends in explicit success or failure evidence.</desc><rect width="1600" height="900" fill="#fff"/><text x="110" y="105" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="700" fill="#172033">Stable identity survives retries; terminal evidence closes the occurrence / 稳定身份跨越重试，终态证据关闭一次发生</text><g font-family="Arial,Helvetica,sans-serif" text-anchor="middle"><rect x="120" y="275" width="300" height="155" rx="26" fill="#eef1ff" stroke="#596be3" stroke-width="4"/><text x="270" y="335" font-size="27" fill="#172033">Create occurrence</text><text x="270" y="375" font-size="24" fill="#4d5a73">先创建 event_id</text><rect x="520" y="275" width="300" height="155" rx="26" fill="#fff7df" stroke="#d49a25" stroke-width="4"/><text x="670" y="335" font-size="27" fill="#172033">Async delivery / retry</text><text x="670" y="375" font-size="24" fill="#4d5a73">异步交付 / 重试复用 ID</text><rect x="920" y="200" width="300" height="125" rx="24" fill="#eefaf7" stroke="#35aa90" stroke-width="4"/><text x="1070" y="255" font-size="26" fill="#172033">Terminal success</text><text x="1070" y="292" font-size="23" fill="#4d5a73">显式成功终态</text><rect x="920" y="380" width="300" height="125" rx="24" fill="#fff0f0" stroke="#cc5a5a" stroke-width="4"/><text x="1070" y="435" font-size="26" fill="#172033">Terminal error</text><text x="1070" y="472" font-size="23" fill="#4d5a73">显式失败终态</text><rect x="1320" y="275" width="190" height="155" rx="26" fill="#f4f6f9" stroke="#64748b" stroke-width="4"/><text x="1415" y="335" font-size="25" fill="#172033">Reconcile</text><text x="1415" y="375" font-size="22" fill="#4d5a73">去重 / 对账</text></g><g stroke="#7a8598" stroke-width="6" fill="none" stroke-linecap="round"><path d="M420 352h100"/><path d="M820 352h65c40 0 60-25 60-65v-25"/><path d="M820 352h65c40 0 60 25 60 65v25"/><path d="M1220 262h50c40 0 50 30 50 80v10"/><path d="M1220 442h50c40 0 50-30 50-80v-10"/></g><g fill="#7a8598"><path d="M512 340l24 12-24 12z"/><path d="M933 274l12-24 12 24z"/><path d="M933 430l12 24 12-24z"/><path d="M1310 340l24 12-24 12z"/></g><rect x="240" y="610" width="1120" height="105" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><text x="800" y="653" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#172033">Deduplication identity is a reconciliation primitive, not proof of system-wide exactly-once delivery.</text><text x="800" y="689" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#4d5a73">去重身份是对账原语，不是端到端 exactly-once 的证明。</text><text x="110" y="820" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#5f6b7c">Research Center synthesis based on Google ADK commit 04b8b727… and Research Object Q-20260811-03.</text></svg>
