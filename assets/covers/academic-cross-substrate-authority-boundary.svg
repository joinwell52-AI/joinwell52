<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cross-substrate authority boundary</title>
  <desc id="desc">Four distinct state layers converge toward a narrow mutation boundary; only a validated relation crosses into an external effect.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#102846"/>
      <stop offset="1" stop-color="#071019"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#64d8ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8df5ca" stop-opacity="0.92"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity="0.18" stroke="#b9d5ee" stroke-width="1">
    <path d="M0 150H1600M0 300H1600M0 450H1600M0 600H1600M0 750H1600"/>
    <path d="M200 0V900M400 0V900M600 0V900M800 0V900M1000 0V900M1200 0V900M1400 0V900"/>
  </g>

  <g transform="translate(120 175)">
    <g>
      <rect x="0" y="0" width="690" height="105" rx="24" fill="#122e4a" stroke="#5bbce8" stroke-width="2"/>
      <circle cx="55" cy="52" r="20" fill="#72d7ff"/>
      <path d="M95 52H625" stroke="#72d7ff" stroke-width="4" stroke-linecap="round" opacity="0.65"/>
      <circle cx="300" cy="52" r="9" fill="#07111f" stroke="#72d7ff" stroke-width="3"/>
      <circle cx="485" cy="52" r="9" fill="#07111f" stroke="#72d7ff" stroke-width="3"/>
    </g>
    <g transform="translate(0 135)">
      <rect x="0" y="0" width="690" height="105" rx="24" fill="#163247" stroke="#61c8c8" stroke-width="2"/>
      <rect x="35" y="27" width="46" height="50" rx="6" fill="#7ee6d0"/>
      <path d="M110 36H615M110 68H530" stroke="#7ee6d0" stroke-width="4" stroke-linecap="round" opacity="0.62"/>
    </g>
    <g transform="translate(0 270)">
      <rect x="0" y="0" width="690" height="105" rx="24" fill="#18333f" stroke="#76d6a8" stroke-width="2"/>
      <path d="M42 54L70 28L98 54L70 80Z" fill="#86e6af"/>
      <path d="M125 52H615" stroke="#86e6af" stroke-width="4" stroke-linecap="round" opacity="0.62"/>
      <circle cx="250" cy="52" r="8" fill="#18333f" stroke="#86e6af" stroke-width="3"/>
      <circle cx="410" cy="52" r="8" fill="#18333f" stroke="#86e6af" stroke-width="3"/>
    </g>
    <g transform="translate(0 405)">
      <rect x="0" y="0" width="690" height="105" rx="24" fill="#21323a" stroke="#b4e587" stroke-width="2"/>
      <path d="M42 53h54M69 26v54" stroke="#c0f08d" stroke-width="5" stroke-linecap="round"/>
      <path d="M125 52H615" stroke="#c0f08d" stroke-width="4" stroke-linecap="round" opacity="0.62"/>
      <circle cx="338" cy="52" r="8" fill="#21323a" stroke="#c0f08d" stroke-width="3"/>
    </g>
  </g>

  <path d="M845 230C975 230 980 450 1080 450" fill="none" stroke="url(#flow)" stroke-width="14" stroke-linecap="round"/>
  <path d="M845 365C985 365 995 450 1080 450" fill="none" stroke="url(#flow)" stroke-width="14" stroke-linecap="round"/>
  <path d="M845 500C985 500 995 450 1080 450" fill="none" stroke="url(#flow)" stroke-width="14" stroke-linecap="round"/>
  <path d="M845 635C975 635 980 450 1080 450" fill="none" stroke="url(#flow)" stroke-width="14" stroke-linecap="round"/>

  <g filter="url(#glow)">
    <rect x="1080" y="220" width="20" height="460" rx="10" fill="#9bf4c4"/>
  </g>
  <circle cx="1090" cy="450" r="42" fill="#07111f" stroke="#b7ffd7" stroke-width="7"/>
  <path d="M1071 450l14 15l27-34" fill="none" stroke="#b7ffd7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M1140 450H1445" stroke="#b7ffd7" stroke-width="12" stroke-linecap="round"/>
  <path d="M1410 415L1465 450L1410 485" fill="none" stroke="#b7ffd7" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1510" cy="450" r="42" fill="#b7ffd7" opacity="0.95"/>

  <g fill="#d6ecff" font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="120" y="105" font-size="28" letter-spacing="6" opacity="0.82">ACADEMIC OBSERVATION 008</text>
    <text x="1135" y="710" font-size="24" letter-spacing="3" opacity="0.72">VALIDATED RELATION → EFFECT</text>
  </g>
</svg>
