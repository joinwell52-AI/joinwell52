<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Weekly 009 — Typed Closure</title>
  <desc id="desc">Editorial cover showing four independent closure gates for state, authority, effect and coverage.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#13243a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity="0.18" stroke="#b9d7ff" stroke-width="1">
    <path d="M0 150H1600M0 300H1600M0 450H1600M0 600H1600M0 750H1600"/>
    <path d="M200 0V900M400 0V900M600 0V900M800 0V900M1000 0V900M1200 0V900M1400 0V900"/>
  </g>
  <text x="120" y="130" fill="#d9e8fb" font-family="system-ui,Segoe UI,sans-serif" font-size="34" letter-spacing="8">WEEKLY RESEARCH 009</text>
  <text x="120" y="230" fill="#ffffff" font-family="system-ui,Segoe UI,sans-serif" font-size="72" font-weight="700">TYPED CLOSURE</text>
  <text x="120" y="286" fill="#b8c8dc" font-family="system-ui,Segoe UI,sans-serif" font-size="28">One green check cannot close the whole system.</text>
  <g font-family="system-ui,Segoe UI,sans-serif" font-size="28" font-weight="650">
    <rect x="120" y="390" rx="22" width="290" height="170" fill="#102d45" stroke="#8dd5ff" stroke-width="3"/>
    <text x="165" y="460" fill="#dff5ff">STATE</text>
    <text x="165" y="505" fill="#8dd5ff" font-size="22" font-weight="400">integrity / continuity</text>
    <circle cx="365" cy="445" r="14" fill="#8dd5ff" filter="url(#glow)"/>

    <rect x="470" y="390" rx="22" width="290" height="170" fill="#172640" stroke="#c7a7ff" stroke-width="3"/>
    <text x="515" y="460" fill="#f0e7ff">AUTHORITY</text>
    <text x="515" y="505" fill="#c7a7ff" font-size="22" font-weight="400">current admission</text>
    <circle cx="715" cy="445" r="14" fill="#c7a7ff" filter="url(#glow)"/>

    <rect x="820" y="390" rx="22" width="290" height="170" fill="#16303a" stroke="#8fe3c0" stroke-width="3"/>
    <text x="865" y="460" fill="#e1fff3">EFFECT</text>
    <text x="865" y="505" fill="#8fe3c0" font-size="22" font-weight="400">external reconciliation</text>
    <circle cx="1065" cy="445" r="14" fill="#8fe3c0" filter="url(#glow)"/>

    <rect x="1170" y="390" rx="22" width="290" height="170" fill="#342b1d" stroke="#ffd68a" stroke-width="3"/>
    <text x="1215" y="460" fill="#fff4dc">COVERAGE</text>
    <text x="1215" y="505" fill="#ffd68a" font-size="22" font-weight="400">scope / residual unknown</text>
    <circle cx="1415" cy="445" r="14" fill="#ffd68a" filter="url(#glow)"/>
  </g>
  <path d="M410 475H470M760 475H820M1110 475H1170" stroke="#6f839b" stroke-width="4" stroke-dasharray="10 12"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="23" fill="#cbd8e8">
    <text x="120" y="690">Closed ≠ globally closed</text>
    <text x="120" y="735">Unknown is a durable state, not a missing Boolean.</text>
  </g>
  <text x="120" y="835" fill="#7f96af" font-family="system-ui,Segoe UI,sans-serif" font-size="22">Research Center · 2026-09-13</text>
</svg>
