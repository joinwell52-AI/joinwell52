<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Waiting Is a Runtime State</title>
  <desc id="desc">A quiet sentinel tower holds position while one external signal crosses a luminous threshold in a dark field.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="0.55" stop-color="#10243a"/>
      <stop offset="1" stop-color="#071522"/>
    </linearGradient>
    <radialGradient id="signalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d6fff0" stop-opacity="1"/>
      <stop offset="0.25" stop-color="#69f0c2" stop-opacity="0.95"/>
      <stop offset="0.65" stop-color="#2ec9a5" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2ec9a5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ee7ff" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#6ee7ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#a7fff0" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <g opacity="0.18" fill="none" stroke="#7bd6ff" stroke-width="2">
    <path d="M110 690 C430 590 690 610 965 510 S1320 315 1540 365"/>
    <path d="M80 760 C415 660 690 690 1000 565 S1320 390 1570 440"/>
  </g>

  <line x1="1015" y1="140" x2="1015" y2="760" stroke="#65f0c7" stroke-width="3" stroke-dasharray="14 18" opacity="0.62"/>
  <circle cx="1015" cy="450" r="78" fill="none" stroke="#65f0c7" stroke-width="2" opacity="0.28"/>
  <circle cx="1015" cy="450" r="132" fill="none" stroke="#65f0c7" stroke-width="2" opacity="0.14"/>

  <g transform="translate(330 210)">
    <path d="M135 500 L185 220 L275 220 L325 500 Z" fill="#0b1727" stroke="#4b7089" stroke-width="4"/>
    <rect x="188" y="180" width="84" height="58" rx="12" fill="#18364a" stroke="#6b9bb5" stroke-width="4"/>
    <path d="M210 182 L230 135 L250 182" fill="#153347" stroke="#6b9bb5" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="230" cy="210" r="13" fill="#94e7ff"/>
    <circle cx="230" cy="210" r="38" fill="#62d7ff" opacity="0.18" filter="url(#softGlow)"/>
    <path d="M274 203 L745 366 L745 430 L274 221 Z" fill="url(#beam)" opacity="0.9"/>
    <path d="M132 500 H328" stroke="#52758c" stroke-width="6" stroke-linecap="round"/>
  </g>

  <g>
    <circle cx="1235" cy="450" r="105" fill="url(#signalGlow)" opacity="0.9" filter="url(#softGlow)"/>
    <circle cx="1235" cy="450" r="34" fill="#baffeb"/>
    <circle cx="1235" cy="450" r="12" fill="#ffffff"/>
    <path d="M1170 450 H1030" stroke="#84ffe0" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
    <path d="M1276 385 A90 90 0 0 1 1322 450" fill="none" stroke="#89ffe2" stroke-width="5" stroke-linecap="round" opacity="0.48"/>
    <path d="M1296 350 A135 135 0 0 1 1360 450" fill="none" stroke="#89ffe2" stroke-width="4" stroke-linecap="round" opacity="0.25"/>
  </g>

  <circle cx="1015" cy="450" r="9" fill="#c8fff1"/>
  <circle cx="1015" cy="450" r="30" fill="#65f0c7" opacity="0.25" filter="url(#softGlow)"/>

  <g opacity="0.45" fill="#8bb2c8">
    <circle cx="164" cy="145" r="3"/>
    <circle cx="1410" cy="172" r="4"/>
    <circle cx="1325" cy="720" r="3"/>
    <circle cx="735" cy="110" r="3"/>
    <circle cx="842" cy="738" r="4"/>
  </g>
</svg>
