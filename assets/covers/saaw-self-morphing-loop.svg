<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="940" viewBox="0 0 1500 940" role="img" aria-labelledby="t d">
  <title id="t">Self-Morphing Digital Employee Loop</title>
  <desc id="d">Bilingual diagram of the loop from Meta-Dev Runtime to Digital Employee Package, validation, deployment, work evidence and next development cycle.</desc>
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07101d"/>
      <stop offset="1" stop-color="#12172d"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#59d8ff"/>
      <stop offset="1" stop-color="#a889ff"/>
    </linearGradient>
  </defs>

  <rect width="1500" height="940" rx="36" fill="url(#b)"/>
  <text x="100" y="105" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="48" font-weight="800">Self-Morphing: Development Runtime → Work Runtime</text>
  <text x="100" y="155" fill="#9fb0cc" font-family="Noto Sans SC,Microsoft YaHei,Arial,sans-serif" font-size="27">“自己开发自己”不是无限自改，而是受治理地开发、验证、部署新的数字员工形态</text>

  <g font-family="Inter,Noto Sans SC,Microsoft YaHei,Arial,sans-serif">
    <rect x="80" y="285" width="310" height="170" rx="28" fill="#142941" stroke="#5fdcff" stroke-width="2"/>
    <text x="235" y="335" text-anchor="middle" fill="#65ddff" font-size="22" font-weight="700">META-DEV RUNTIME</text>
    <text x="235" y="385" text-anchor="middle" fill="#fff" font-size="29" font-weight="800">PM · DEV · QA · OPS</text>
    <text x="235" y="425" text-anchor="middle" fill="#bdcce1" font-size="21">元开发团队</text>

    <path d="M390 370h95" stroke="url(#g)" stroke-width="6"/>
    <polygon points="505,370 478,354 478,386" fill="#69d8ff"/>

    <rect x="505" y="285" width="350" height="170" rx="28" fill="#17213a" stroke="#8d9cff" stroke-width="2"/>
    <text x="680" y="333" text-anchor="middle" fill="#a8afff" font-size="22" font-weight="700">WORKER PACKAGE</text>
    <text x="680" y="378" text-anchor="middle" fill="#fff" font-size="26" font-weight="800">Role · Workflow · Skills</text>
    <text x="680" y="414" text-anchor="middle" fill="#bdcce1" font-size="20">Permissions · Policies</text>
    <text x="680" y="441" text-anchor="middle" fill="#9faec4" font-size="20">Human Decision Gates</text>

    <path d="M855 370h100" stroke="url(#g)" stroke-width="6"/>
    <polygon points="975,370 948,354 948,386" fill="#909aff"/>

    <rect x="975" y="285" width="445" height="170" rx="28" fill="#211d39" stroke="#aa8cff" stroke-width="2"/>
    <text x="1197" y="333" text-anchor="middle" fill="#c0a6ff" font-size="22" font-weight="700">VALIDATE + DECISION</text>
    <text x="1197" y="378" text-anchor="middle" fill="#fff" font-size="25" font-weight="800">QA · Governance</text>
    <text x="1197" y="412" text-anchor="middle" fill="#fff" font-size="25" font-weight="800">Human Authorization Gate</text>
    <text x="1197" y="441" text-anchor="middle" fill="#bdcce1" font-size="20">验证 · 治理 · 授权</text>

    <path d="M1197 455v105" stroke="url(#g)" stroke-width="6"/>
    <polygon points="1197,580 1181,552 1213,552" fill="#a88fff"/>

    <rect x="910" y="580" width="510" height="175" rx="28" fill="#152842" stroke="#61d9ff" stroke-width="2"/>
    <text x="1165" y="630" text-anchor="middle" fill="#67ddff" font-size="22" font-weight="700">DOMAIN WORKER RUNTIME</text>
    <text x="1165" y="675" text-anchor="middle" fill="#fff" font-size="27" font-weight="800">Contract · Finance · Operations</text>
    <text x="1165" y="715" text-anchor="middle" fill="#bdcce1" font-size="21">领域数字员工团队持续履职</text>

    <path d="M910 668H770" stroke="url(#g)" stroke-width="6"/>
    <polygon points="750,668 778,652 778,684" fill="#76cfff"/>

    <rect x="380" y="580" width="370" height="175" rx="28" fill="#172239" stroke="#8b9aff" stroke-width="2"/>
    <text x="565" y="630" text-anchor="middle" fill="#a7b1ff" font-size="22" font-weight="700">WORK EVIDENCE</text>
    <text x="565" y="675" text-anchor="middle" fill="#fff" font-size="27" font-weight="800">Reports · Issues · Results</text>
    <text x="565" y="715" text-anchor="middle" fill="#bdcce1" font-size="21">工作事实 · 问题 · 成果</text>

    <path d="M380 668H235V475" stroke="url(#g)" stroke-width="6" fill="none"/>
    <polygon points="235,455 219,483 251,483" fill="#65d9ff"/>

    <text x="130" y="850" fill="#dce8f7" font-size="27" font-weight="700">Develop → Validate → Deploy → Work → Observe → Improve</text>
    <text x="130" y="892" fill="#9fafc8" font-size="22">软件开发与软件履职开始进入同一个可治理生命周期。</text>
  </g>
</svg>