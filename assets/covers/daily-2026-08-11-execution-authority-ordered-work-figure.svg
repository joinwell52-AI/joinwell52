<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Ordered work execution-authority figure</title>
  <desc id="desc">Received work is queued, explicitly claimed, runs under one lane, and releases the next item only after terminal evidence.</desc>
  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="120" y="110" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#182238">Ordered lane: intent is not execution authority / 顺序通道：意图不等于执行权</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle">
    <rect x="120" y="280" width="260" height="150" rx="28" fill="#edf0ff" stroke="#5661f6" stroke-width="4"/>
    <text x="250" y="345" fill="#182238">Received / Scheduled</text><text x="250" y="385" fill="#44506a">已接收 / 已排程</text>
    <rect x="470" y="280" width="260" height="150" rx="28" fill="#eefaf7" stroke="#42bca5" stroke-width="4"/>
    <text x="600" y="345" fill="#182238">Queued</text><text x="600" y="385" fill="#44506a">排队</text>
    <rect x="820" y="280" width="260" height="150" rx="28" fill="#fff6df" stroke="#d49a25" stroke-width="4"/>
    <text x="950" y="345" fill="#182238">Worker Claimed</text><text x="950" y="385" fill="#44506a">Worker 已认领</text>
    <rect x="1170" y="280" width="260" height="150" rx="28" fill="#f0f3f7" stroke="#64748b" stroke-width="4"/>
    <text x="1300" y="345" fill="#182238">Running</text><text x="1300" y="385" fill="#44506a">执行中</text>
    <rect x="820" y="570" width="610" height="150" rx="28" fill="#eefaf7" stroke="#42bca5" stroke-width="4"/>
    <text x="1125" y="635" fill="#182238">Terminal evidence releases the lane</text><text x="1125" y="675" fill="#44506a">终态证据释放执行通道</text>
  </g>
  <g stroke="#7c879e" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M380 355h90"/><path d="M730 355h90"/><path d="M1080 355h90"/><path d="M1300 430v90c0 70-55 125-125 125h-95"/>
  </g>
  <g fill="#7c879e"><path d="M462 343l24 12-24 12z"/><path d="M812 343l24 12-24 12z"/><path d="M1162 343l24 12-24 12z"/><path d="M1088 633l-24 12 24 12z"/></g>
  <text x="120" y="820" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#5f6b7c">Research Center synthesis based on GitHub Copilot CLI 1.0.79 maintainer changelog and same-day Research Object Q-20260811-01.</text>
</svg>
