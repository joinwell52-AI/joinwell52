<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Session rebinding and execution continuity</title>
  <desc id="desc">A continuous luminous thread crosses a dark interruption and enters a new orbital binding, while a faded fragment remains behind.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070b18"/><stop offset=".56" stop-color="#111a35"/><stop offset="1" stop-color="#25335b"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#9be7ff" stop-opacity=".95"/><stop offset=".34" stop-color="#608dff" stop-opacity=".44"/><stop offset="1" stop-color="#4255d8" stop-opacity="0"/></radialGradient>
    <linearGradient id="thread" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6e7cff"/><stop offset=".42" stop-color="#b5d8ff"/><stop offset=".51" stop-color="#26304f"/><stop offset=".61" stop-color="#9be7ff"/><stop offset="1" stop-color="#f5fbff"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1150" cy="450" r="330" fill="url(#halo)" filter="url(#blur)" opacity=".72"/>
  <circle cx="1150" cy="450" r="190" fill="none" stroke="#aeeaff" stroke-width="4" opacity=".34"/>
  <circle cx="1150" cy="450" r="124" fill="#0e1730" stroke="#d6f6ff" stroke-width="15"/>
  <circle cx="1150" cy="450" r="48" fill="#dff9ff"/>
  <path d="M150 450C360 450 405 302 600 302C718 302 738 420 810 450" fill="none" stroke="url(#thread)" stroke-width="18" stroke-linecap="round"/>
  <path d="M886 450C962 450 1000 450 1101 450" fill="none" stroke="url(#thread)" stroke-width="18" stroke-linecap="round"/>
  <circle cx="848" cy="450" r="20" fill="#090d1a" stroke="#7585aa" stroke-width="3"/>
  <path d="M640 535C720 560 760 618 720 710" fill="none" stroke="#7382ad" stroke-width="8" stroke-linecap="round" opacity=".28"/>
  <circle cx="712" cy="732" r="31" fill="#7f8baa" opacity=".17"/>
  <path d="M1030 292A190 190 0 0 1 1282 364" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity=".28"/>
  <rect x="100" y="94" width="1400" height="712" rx="44" fill="none" stroke="#d9e8ff" stroke-opacity=".10" stroke-width="2"/>
  <text x="126" y="164" font-family="Inter,Arial,sans-serif" font-size="29" letter-spacing="7" fill="#e6edff" opacity=".84">SESSION / BINDING / GENERATION</text>
  <text x="126" y="790" font-family="Inter,Arial,sans-serif" font-size="21" letter-spacing="4" fill="#b4c0dc" opacity=".64">RECONNECTED ≠ RECOVERED WORK</text>
</svg>
