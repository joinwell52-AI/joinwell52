<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
  <title id="title">Recovery evidence coverage by fact axis</title>
  <desc id="desc">A matrix showing partial evidence for service health and activity, direct evidence for lifecycle repair, and unresolved causal proof for acceptance ordering.</desc>
  <rect width="1200" height="570" fill="#ffffff"/>
  <text x="80" y="76" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#172033">What the recovery evidence covers—and leaves open</text>
  <text x="80" y="114" font-family="Arial, sans-serif" font-size="20" fill="#5f6b7a">Do not merge health, liveness, lifecycle, and acceptance into one green status</text>
  <text x="80" y="184" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#172033">Service health</text>
  <rect x="360" y="154" width="240" height="48" rx="8" fill="#93c5fd"/>
  <text x="625" y="185" font-family="Arial, sans-serif" font-size="21" fill="#172033">External liveness slice only</text>
  <text x="80" y="274" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#172033">Session/job activity</text>
  <rect x="360" y="244" width="170" height="48" rx="8" fill="#fde68a"/>
  <text x="555" y="275" font-family="Arial, sans-serif" font-size="21" fill="#172033">Partial: stalled work recorded</text>
  <text x="80" y="364" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#172033">Task lifecycle</text>
  <rect x="360" y="334" width="360" height="48" rx="8" fill="#34d399"/>
  <text x="745" y="365" font-family="Arial, sans-serif" font-size="21" fill="#172033">Repair + 3/3 case replay + 5/5 routing regression</text>
  <text x="80" y="454" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#172033">Formal acceptance</text>
  <rect x="360" y="424" width="150" height="48" rx="8" fill="#fca5a5"/>
  <text x="535" y="455" font-family="Arial, sans-serif" font-size="21" fill="#172033">Causal order remains unproven</text>
  <text x="80" y="530" font-family="Arial, sans-serif" font-size="18" fill="#5f6b7a">Evidence labels describe scope, not a quality score. Case results are first-party and access-controlled.</text>
</svg>
