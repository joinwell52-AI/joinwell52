<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">TMPA four-rule architecture</title>
  <desc id="desc">Durable text, local single-writer streams, asynchronous parallel collaboration and reader-side reconstruction of governance state.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071225"/><stop offset="1" stop-color="#161b38"/></linearGradient>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#59d8e8"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#8175ff"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="64" y="62" fill="#69ddea" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="4">TMPA · TEXTUAL MULTI-AGENT PROCESS ARCHITECTURE</text>
  <text x="64" y="110" fill="#fff" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="40" font-weight="800">四条规则，把异步协作重建为可治理的工作事实</text>

  <g font-family="Arial,'Microsoft YaHei',sans-serif">
    <g transform="translate(64 150)">
      <g><rect width="342" height="116" rx="22" fill="#171b3d" stroke="#8175ff"/><text x="24" y="34" fill="#b5adff" font-size="15" font-weight="700">01 · DURABLE TEXT</text><text x="24" y="68" fill="#fff" font-size="22" font-weight="800">文本承载消息与状态</text><text x="24" y="96" fill="#94a3bc" font-size="15">事实独立于 Agent 会话</text></g>
      <g transform="translate(382)"><rect width="342" height="116" rx="22" fill="#10263b" stroke="#5aaeff"/><text x="24" y="34" fill="#79b9ff" font-size="15" font-weight="700">02 · LOCAL SERIALITY</text><text x="24" y="68" fill="#fff" font-size="22" font-weight="800">每个写者保持局部串行流</text><text x="24" y="96" fill="#94a3bc" font-size="15">责任来源明确，不覆盖他人历史</text></g>
      <g transform="translate(764)"><rect width="342" height="116" rx="22" fill="#0d2935" stroke="#55d8e8"/><text x="24" y="34" fill="#66ddea" font-size="15" font-weight="700">03 · ASYNC PARALLELISM</text><text x="24" y="68" fill="#fff" font-size="22" font-weight="800">多条串行流异步并行</text><text x="24" y="96" fill="#94a3bc" font-size="15">引用形成偏序，不伪造全局时间线</text></g>
      <g transform="translate(1146)"><rect width="342" height="116" rx="22" fill="#30231f" stroke="#efa64a"/><text x="24" y="34" fill="#f1b35d" font-size="15" font-weight="700">04 · READER RECONSTRUCTION</text><text x="24" y="68" fill="#fff" font-size="22" font-weight="800">读端聚合现有证据</text><text x="24" y="96" fill="#ad9b8b" font-size="15">重建流程、责任、冲突与审计</text></g>
    </g>

    <text x="64" y="326" fill="#9daec7" font-size="16" font-weight="700" letter-spacing="2">LOCAL SINGLE-WRITER STREAMS · 每个主体只追加自己的事实</text>
    <g transform="translate(64 358)">
      <g><rect width="900" height="96" rx="18" fill="#121936" stroke="#756ee0"/><text x="22" y="34" fill="#b5adff" font-size="15" font-weight="700">PM STREAM</text><g fill="#27234f" stroke="#7269d0"><rect x="168" y="20" width="155" height="56" rx="12"/><rect x="392" y="20" width="155" height="56" rx="12"/><rect x="616" y="20" width="155" height="56" rx="12"/></g><g fill="#fff" font-size="16" text-anchor="middle"><text x="245" y="54">TASK-001</text><text x="469" y="54">REVIEW-001</text><text x="693" y="54">DECISION-001</text></g><g stroke="#8175ff" stroke-width="3" marker-end="url(#p)"><path d="M329 48H382"/><path d="M553 48H606"/></g></g>
      <g transform="translate(0 116)"><rect width="900" height="96" rx="18" fill="#0b2833" stroke="#55d8e8"/><text x="22" y="34" fill="#66ddea" font-size="15" font-weight="700">DEV STREAM</text><g fill="#123d49" stroke="#3fa8b8"><rect x="168" y="20" width="155" height="56" rx="12"/><rect x="392" y="20" width="155" height="56" rx="12"/><rect x="616" y="20" width="155" height="56" rx="12"/></g><g fill="#fff" font-size="16" text-anchor="middle"><text x="245" y="54">ACCEPT-001</text><text x="469" y="54">REPORT-001</text><text x="693" y="54">CORRECT-001</text></g><g stroke="#59d8e8" stroke-width="3" marker-end="url(#a)"><path d="M329 48H382"/><path d="M553 48H606"/></g></g>
      <g transform="translate(0 232)"><rect width="900" height="96" rx="18" fill="#10213a" stroke="#5a9be0"/><text x="22" y="34" fill="#79b9ff" font-size="15" font-weight="700">QA STREAM</text><g fill="#193454" stroke="#477cb0"><rect x="168" y="20" width="155" height="56" rx="12"/><rect x="392" y="20" width="155" height="56" rx="12"/><rect x="616" y="20" width="155" height="56" rx="12"/></g><g fill="#fff" font-size="16" text-anchor="middle"><text x="245" y="54">ACCEPT-002</text><text x="469" y="54">REPORT-002</text><text x="693" y="54">ISSUE-001</text></g><g stroke="#5a9be0" stroke-width="3" marker-end="url(#a)"><path d="M329 48H382"/><path d="M553 48H606"/></g></g>
      <g stroke="#efa64a" stroke-width="2.5" stroke-dasharray="8 7" fill="none" marker-end="url(#a)"><path d="M245 96C245 135 365 135 430 136"/><path d="M469 212C535 225 585 240 642 252"/><path d="M469 328C540 310 610 230 676 96"/></g>
      <text x="814" y="170" fill="#f1b35d" font-size="14" font-weight="700">REFERENCES</text><text x="814" y="193" fill="#8999b2" font-size="13">跨流引用形成偏序</text>
    </g>

    <g transform="translate(1030 350)">
      <rect width="510" height="350" rx="30" fill="#0c172b" stroke="#66799a" stroke-width="2"/>
      <circle cx="115" cy="174" r="78" fill="#142b45" stroke="#59d8e8" stroke-width="3"/>
      <text x="115" y="162" text-anchor="middle" fill="#66ddea" font-size="17" font-weight="700">READER</text><text x="115" y="194" text-anchor="middle" fill="#fff" font-size="23" font-weight="800">聚合证据</text><text x="115" y="220" text-anchor="middle" fill="#93a2b9" font-size="14">不覆盖冲突</text>
      <path d="M204 174H252" stroke="#59d8e8" stroke-width="4" marker-end="url(#a)"/>
      <g fill="#142039" stroke="#4d6689"><rect x="270" y="50" width="204" height="46" rx="11"/><rect x="270" y="108" width="204" height="46" rx="11"/><rect x="270" y="166" width="204" height="46" rx="11"/><rect x="270" y="224" width="204" height="46" rx="11"/><rect x="270" y="282" width="204" height="46" rx="11"/></g>
      <g fill="#e0e8f4" font-size="16"><text x="290" y="79">PROCESS · 流程</text><text x="290" y="137">RESPONSIBILITY · 责任</text><text x="290" y="195">LIFECYCLE · 生命周期</text><text x="290" y="253">ISSUE SET · 冲突与缺口</text><text x="290" y="311">AUDIT STATE · 审计状态</text></g>
    </g>
    <g stroke="#59d8e8" stroke-width="3.5" fill="none" marker-end="url(#a)"><path d="M972 406C1005 406 1005 462 1030 462"/><path d="M972 522H1030"/><path d="M972 638C1005 638 1005 578 1030 578"/></g>
  </g>
  <rect x="64" y="818" width="1476" height="48" rx="13" fill="#0a1121" stroke="#4b5d79"/>
  <text x="802" y="849" text-anchor="middle" fill="#dbe4f1" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18">文本持久化 + 局部串行 + 异步并行 + 读端重建 = 可恢复、可争议、可审计的工作事实</text>
</svg>
