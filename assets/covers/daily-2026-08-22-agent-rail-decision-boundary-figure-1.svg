<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">轨道机的自动化边界</title>
  <desc id="desc">事实、建议、机械拒绝和业务决定分别由不同主体处理，轨道机不能把技术条件升级为业务结论。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#F7FCFF"/><stop offset="1" stop-color="#FFF9EF"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#173D66" flood-opacity=".13"/></filter>
  </defs>
  <rect width="1200" height="650" rx="34" fill="url(#bg)"/>
  <text x="600" y="64" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="30" font-weight="700" fill="#123860">轨道机的自动化边界：记录、建议、拒绝与决定</text>
  <text x="600" y="101" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#54718B">自动化可以处理可复核事实；业务结论必须留在有权角色手里</text>
  <g font-family="Microsoft YaHei, Arial, sans-serif" filter="url(#shadow)">
    <rect x="84" y="153" width="1032" height="86" rx="20" fill="#EAF8FF" stroke="#83CFF2" stroke-width="2"/>
    <rect x="84" y="263" width="1032" height="86" rx="20" fill="#F1ECFF" stroke="#B89CFF" stroke-width="2"/>
    <rect x="84" y="373" width="1032" height="86" rx="20" fill="#FFF5E7" stroke="#F0B661" stroke-width="2"/>
    <rect x="84" y="483" width="1032" height="86" rx="20" fill="#FFF0EC" stroke="#EEA48C" stroke-width="2"/>
  </g>
  <g font-family="Microsoft YaHei, Arial, sans-serif">
    <text x="120" y="190" font-size="21" font-weight="700" fill="#0877AC">事实</text><text x="260" y="190" font-size="18" fill="#1C5572">任务在哪个目录？当前修订是什么？报告是否存在？</text><rect x="917" y="174" width="157" height="42" rx="21" fill="#FFF" stroke="#83CFF2"/><text x="996" y="201" text-anchor="middle" font-size="16" font-weight="700" fill="#0877AC">轨道：记录与展示</text>
    <text x="120" y="300" font-size="21" font-weight="700" fill="#5B2BA9">建议</text><text x="260" y="300" font-size="18" fill="#49356E">证据可能不足，是否补测？是否提示风险？</text><rect x="917" y="284" width="157" height="42" rx="21" fill="#FFF" stroke="#B89CFF"/><text x="996" y="311" text-anchor="middle" font-size="16" font-weight="700" fill="#5B2BA9">轨道：说明与建议</text>
    <text x="120" y="410" font-size="21" font-weight="700" fill="#A85B00">机械负面条件</text><text x="320" y="410" font-size="18" fill="#786047">身份冲突、作用域不符、已终态、明示依赖未满足</text><rect x="917" y="394" width="157" height="42" rx="21" fill="#FFF" stroke="#F0B661"/><text x="996" y="421" text-anchor="middle" font-size="16" font-weight="700" fill="#A85B00">轨道：拒绝当前动作</text>
    <text x="120" y="520" font-size="21" font-weight="700" fill="#AE4A31">业务决定</text><text x="260" y="520" font-size="18" fill="#7A4034">是否验收？是否返工？是否继续投入？</text><rect x="903" y="504" width="171" height="42" rx="21" fill="#FFF" stroke="#EEA48C"/><text x="989" y="531" text-anchor="middle" font-size="16" font-weight="700" fill="#AE4A31">Agent / PM / ADMIN</text>
  </g>
  <path d="M100 603 H1100" stroke="#D9E6F1" stroke-width="2"/>
  <text x="600" y="628" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#365675">关键检查：技术超时、冷却和重试只能改变技术状态，不能悄悄变成业务结论。</text>
</svg>
