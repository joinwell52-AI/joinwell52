<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="940" viewBox="0 0 1500 940" role="img" aria-labelledby="t d">
  <title id="t">SaaW Governance Stack</title>
  <desc id="d">A bilingual diagram showing SaaW, CodeFlowMu, FCoP and TMPA as product, runtime, protocol and governance architecture layers.</desc>
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#08101d"/>
      <stop offset="1" stop-color="#111a31"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#61d9ff"/>
      <stop offset="1" stop-color="#a18cff"/>
    </linearGradient>
  </defs>

  <rect width="1500" height="940" rx="36" fill="url(#b)"/>
  <text x="100" y="100" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="50" font-weight="800">SaaW Governance &amp; Runtime Stack</text>
  <text x="100" y="150" fill="#9eb0ce" font-family="Noto Sans SC,Microsoft YaHei,Arial,sans-serif" font-size="28">数字员工不是一个 Agent，而是一套可运行、可治理、可恢复的工作系统</text>

  <g font-family="Inter,Noto Sans SC,Microsoft YaHei,Arial,sans-serif">
    <rect x="170" y="220" width="1160" height="130" rx="26" fill="#132844" stroke="#62d8ff" stroke-width="2"/>
    <text x="230" y="270" fill="#70e0ff" font-size="24" font-weight="700">PRODUCT / 产品范式</text>
    <text x="230" y="318" fill="#fff" font-size="36" font-weight="800">SaaW — Software as an Agent Worker</text>
    <text x="1080" y="290" fill="#b9c9df" font-size="21" text-anchor="middle">Role · Work · Outcome</text>
    <text x="1080" y="320" fill="#8fa3bf" font-size="20" text-anchor="middle">岗位 · 工作 · 结果</text>

    <path d="M750 350v45" stroke="url(#g)" stroke-width="5"/>
    <polygon points="750,414 736,390 764,390" fill="#79cfff"/>

    <rect x="170" y="415" width="1160" height="130" rx="26" fill="#17213b" stroke="#8f92ff" stroke-width="2"/>
    <text x="230" y="465" fill="#a9a7ff" font-size="24" font-weight="700">RUNTIME / 工程运行体</text>
    <text x="230" y="515" fill="#fff" font-size="36" font-weight="800">CodeFlowMu</text>
    <text x="720" y="482" fill="#c7d1e6" font-size="22">Orchestration · Skills · Agent PC</text>
    <text x="720" y="516" fill="#aebbd0" font-size="22">PWA · Recovery · Runtime Governance</text>

    <path d="M750 545v45" stroke="url(#g)" stroke-width="5"/>
    <polygon points="750,609 736,585 764,585" fill="#8fc1ff"/>

    <rect x="170" y="610" width="1160" height="130" rx="26" fill="#171f36" stroke="#8a9cff" stroke-width="2"/>
    <text x="230" y="660" fill="#a9b5ff" font-size="24" font-weight="700">COORDINATION PROTOCOL / 协作协议</text>
    <text x="230" y="710" fill="#fff" font-size="36" font-weight="800">FCoP</text>
    <text x="600" y="675" fill="#c7d1e6" font-size="22">File-driven lifecycle · custody · reports</text>
    <text x="600" y="709" fill="#aebbd0" font-size="22">issues · handoff · observable state</text>

    <path d="M750 740v40" stroke="url(#g)" stroke-width="5"/>
    <polygon points="750,799 736,775 764,775" fill="#9b9cff"/>

    <rect x="170" y="800" width="1160" height="110" rx="26" fill="#211c38" stroke="#a78cff" stroke-width="2"/>
    <text x="230" y="855" fill="#fff" font-size="34" font-weight="800">TMPA</text>
    <text x="430" y="840" fill="#d0c8e8" font-size="22">Textual work facts · single-writer streams · references</text>
    <text x="430" y="875" fill="#b7aecf" font-size="22">partial-order reconstruction · Issue Set · governance</text>
  </g>
</svg>