<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Connector action authority-handoff figure</title><desc id="desc">A governed connector action progresses from observed availability through eligibility, authorization, submission, confirmation and provider custody.</desc><rect width="1600" height="900" fill="#fff"/><text x="110" y="105" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="700" fill="#172033">Connector action is a multi-authority handoff / Connector 动作是多权威交接</text><g font-family="Arial,Helvetica,sans-serif" font-size="24" text-anchor="middle"><rect x="80" y="300" width="210" height="140" rx="26" fill="#eef1ff" stroke="#5267d8" stroke-width="4"/><text x="185" y="355" fill="#172033">Availability</text><text x="185" y="390" fill="#4d5a73">可用性观察</text><rect x="335" y="300" width="210" height="140" rx="26" fill="#eefaf7" stroke="#33a88f" stroke-width="4"/><text x="440" y="355" fill="#172033">Eligibility</text><text x="440" y="390" fill="#4d5a73">动作资格</text><rect x="590" y="300" width="210" height="140" rx="26" fill="#fff7df" stroke="#d59b29" stroke-width="4"/><text x="695" y="355" fill="#172033">Authorization</text><text x="695" y="390" fill="#4d5a73">用户/角色授权</text><rect x="845" y="300" width="210" height="140" rx="26" fill="#f4efff" stroke="#8c62cc" stroke-width="4"/><text x="950" y="355" fill="#172033">Submission</text><text x="950" y="390" fill="#4d5a73">Provider 提交</text><rect x="1100" y="300" width="210" height="140" rx="26" fill="#eefaf7" stroke="#33a88f" stroke-width="4"/><text x="1205" y="355" fill="#172033">Confirmed</text><text x="1205" y="390" fill="#4d5a73">Provider 确认</text><rect x="1355" y="300" width="170" height="140" rx="26" fill="#edf0f4" stroke="#64748b" stroke-width="4"/><text x="1440" y="355" fill="#172033">Custody</text><text x="1440" y="390" fill="#4d5a73">Provider 记录</text></g><g stroke="#7a8598" stroke-width="5" fill="none"><path d="M290 370h45"/><path d="M545 370h45"/><path d="M800 370h45"/><path d="M1055 370h45"/><path d="M1310 370h45"/></g><g fill="#7a8598"><path d="M327 358l20 12-20 12z"/><path d="M582 358l20 12-20 12z"/><path d="M837 358l20 12-20 12z"/><path d="M1092 358l20 12-20 12z"/><path d="M1347 358l20 12-20 12z"/></g><rect x="250" y="555" width="1100" height="105" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><text x="800" y="600" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#172033">Observation is not commitment; provider-confirmed state becomes transaction truth.</text><text x="800" y="637" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#4d5a73">观察不等于承诺；Provider 确认后的状态才是交易事实。</text><text x="110" y="820" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#5f6b7c">Research Center synthesis based on official OpenAI restaurant-reservation documentation and Research Object Q-20260811-02.</text></svg>
