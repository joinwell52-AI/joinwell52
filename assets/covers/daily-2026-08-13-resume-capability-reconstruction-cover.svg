<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Execution capability reconstruction after resume</title>
  <desc id="desc">An editorial scene in which a paused execution token faces a luminous authority threshold while a key-shaped capability is reconstructed from current policy signals.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101e"/>
      <stop offset="0.55" stop-color="#101a31"/>
      <stop offset="1" stop-color="#17394a"/>
    </linearGradient>
    <linearGradient id="threshold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d7f7ff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#75dfff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#36b7d8" stop-opacity="0.12"/>
    </linearGradient>
    <radialGradient id="capabilityGlow">
      <stop offset="0" stop-color="#fff4c2" stop-opacity="0.98"/>
      <stop offset="0.32" stop-color="#ffc95f" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#ff9c3e" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <path d="M800 128V772" stroke="url(#threshold)" stroke-width="48" stroke-linecap="round"/>
  <path d="M765 170H585C492 170 430 232 430 325V575C430 668 492 730 585 730H765" fill="none" stroke="#b9c9e8" stroke-opacity="0.16" stroke-width="3"/>
  <circle cx="515" cy="450" r="116" fill="#7383ff" opacity="0.12"/>
  <circle cx="515" cy="450" r="54" fill="#7988ff" opacity="0.78"/>
  <path d="M515 395V505M460 450H570" stroke="#edf2ff" stroke-width="13" stroke-linecap="round" opacity="0.78"/>
  <circle cx="1080" cy="450" r="230" fill="url(#capabilityGlow)" filter="url(#softGlow)" opacity="0.86"/>
  <circle cx="1075" cy="450" r="86" fill="none" stroke="#ffe09a" stroke-width="28"/>
  <path d="M1155 450H1340M1264 450V510M1320 450V492" fill="none" stroke="#ffe09a" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M915 286C990 235 1154 220 1250 284M915 614C990 665 1154 680 1250 616" fill="none" stroke="#75dfff" stroke-opacity="0.28" stroke-width="3" stroke-dasharray="12 18"/>
  <circle cx="902" cy="292" r="7" fill="#75dfff"/><circle cx="902" cy="608" r="7" fill="#75dfff"/>
  <rect x="104" y="104" width="1392" height="692" rx="42" fill="none" stroke="#e4f4ff" stroke-opacity="0.1" stroke-width="2"/>
  <text x="124" y="166" font-family="Inter,Arial,sans-serif" font-size="30" letter-spacing="7" fill="#dce9ff" opacity="0.82">RESUME / RECONSTRUCT / REAUTHORIZE</text>
  <text x="124" y="790" font-family="Inter,Arial,sans-serif" font-size="21" letter-spacing="4" fill="#b8c7e2" opacity="0.62">RESEARCH CENTER · EXECUTION CAPABILITY</text>
</svg>
