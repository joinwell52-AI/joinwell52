<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">CodeFlowMu runtime boundary</title>
  <desc id="desc">Models reason, tools act, FCoP carries project-visible coordination facts, and CodeFlowMu orchestrates roles, lifecycle, recovery, review and human decisions without becoming a giant central agent.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071122"/><stop offset="1" stop-color="#131c38"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#59d8e8"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#efa64a"/></marker></defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="66" y="62" fill="#65dcea" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="4">CODEFLOWMU · ENGINEERING RUNTIME BOUNDARY</text>
  <text x="66" y="110" fill="#fff" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="40" font-weight="800">不是一个巨大的中央 Agent，而是让角色、工具与治理进入真实运行</text>
  <g font-family="Arial,'Microsoft YaHei',sans-serif">
    <g transform="translate(66 174)">
      <text x="0" y="0" fill="#9dafc8" font-size="16" font-weight="700" letter-spacing="2">EXTERNAL CAPABILITY · 可替换能力</text>
      <g transform="translate(0 32)"><rect width="330" height="132" rx="22" fill="#171b3d" stroke="#8175ff"/><text x="25" y="40" fill="#b5adff" font-size="15" font-weight="700">MODEL ECOSYSTEM</text><text x="25" y="78" fill="#fff" font-size="25" font-weight="800">推理与规划</text><text x="25" y="108" fill="#91a2ba" font-size="15">不同模型可以替换</text></g>
      <g transform="translate(0 192)"><rect width="330" height="132" rx="22" fill="#0d2935" stroke="#55d8e8"/><text x="25" y="40" fill="#66ddea" font-size="15" font-weight="700">RUNTIME TOOLS</text><text x="25" y="78" fill="#fff" font-size="25" font-weight="800">Browser · API · CLI · MCP</text><text x="25" y="108" fill="#91a2ba" font-size="15">真实环境执行动作</text></g>
      <g transform="translate(0 352)"><rect width="330" height="132" rx="22" fill="#10213b" stroke="#5a9be0"/><text x="25" y="40" fill="#79b9ff" font-size="15" font-weight="700">AGENT PC</text><text x="25" y="78" fill="#fff" font-size="25" font-weight="800">工作环境</text><text x="25" y="108" fill="#91a2ba" font-size="15">文件、凭证、进程与外部系统</text></g>
    </g>
    <g stroke="#59d8e8" stroke-width="4" marker-end="url(#a)"><path d="M408 272H476"/><path d="M408 432H476"/><path d="M408 592H476"/></g>

    <g transform="translate(494 160)">
      <rect width="690" height="578" rx="34" fill="#0a172a" stroke="#5a9be0" stroke-width="2.5"/>
      <text x="345" y="54" text-anchor="middle" fill="#79b9ff" font-size="17" font-weight="700" letter-spacing="2">CODEFLOWMU · GOVERNED WORK RUNTIME</text>
      <text x="345" y="92" text-anchor="middle" fill="#fff" font-size="28" font-weight="800">把模型能力组织成有责任边界的工作</text>
      <g fill="#132542" stroke="#4c6e95"><rect x="38" y="130" width="286" height="92" rx="17"/><rect x="366" y="130" width="286" height="92" rx="17"/><rect x="38" y="246" width="286" height="92" rx="17"/><rect x="366" y="246" width="286" height="92" rx="17"/><rect x="38" y="362" width="286" height="92" rx="17"/><rect x="366" y="362" width="286" height="92" rx="17"/></g>
      <g><text x="60" y="164" fill="#fff" font-size="18" font-weight="700">ROLE ORCHESTRATION</text><text x="60" y="193" fill="#91a2ba" font-size="15">PM / DEV / QA / OPS 责任边界</text><text x="388" y="164" fill="#fff" font-size="18" font-weight="700">SKILL ROUTING</text><text x="388" y="193" fill="#91a2ba" font-size="15">能力调用、权限与风险约束</text><text x="60" y="280" fill="#fff" font-size="18" font-weight="700">LIFECYCLE &amp; RECOVERY</text><text x="60" y="309" fill="#91a2ba" font-size="15">暂停、重启、恢复与失败处理</text><text x="388" y="280" fill="#fff" font-size="18" font-weight="700">REPORT / REVIEW / ISSUE</text><text x="388" y="309" fill="#91a2ba" font-size="15">交付证据、复核与问题集</text><text x="60" y="396" fill="#fff" font-size="18" font-weight="700">FCOP ADAPTER</text><text x="60" y="425" fill="#91a2ba" font-size="15">项目可见的协作协议接入</text><text x="388" y="396" fill="#fff" font-size="18" font-weight="700">HUMAN DECISION</text><text x="388" y="425" fill="#91a2ba" font-size="15">高影响行动的人类授权门</text></g>
      <rect x="38" y="490" width="614" height="56" rx="14" fill="#102b37" stroke="#55d8e8"/>
      <text x="345" y="525" text-anchor="middle" fill="#c3edf2" font-size="18" font-weight="700">TMPA 指导语义 · FCoP 承载事实 · CodeFlowMu 运行工作</text>
    </g>

    <path d="M1196 450H1252" stroke="#59d8e8" stroke-width="4" marker-end="url(#a)"/>
    <g transform="translate(1270 190)">
      <rect width="264" height="500" rx="30" fill="#0c1729" stroke="#efa64a" stroke-width="2"/>
      <text x="132" y="48" text-anchor="middle" fill="#f1b35d" font-size="16" font-weight="700">DURABLE WORK OUTPUT</text>
      <g fill="#152440" stroke="#4e6688"><rect x="26" y="80" width="212" height="58" rx="13"/><rect x="26" y="154" width="212" height="58" rx="13"/><rect x="26" y="228" width="212" height="58" rx="13"/><rect x="26" y="302" width="212" height="58" rx="13"/><rect x="26" y="376" width="212" height="58" rx="13"/></g>
      <g fill="#e0e8f4" font-size="16"><text x="46" y="116">TASK STATE</text><text x="46" y="190">WORK EVIDENCE</text><text x="46" y="264">REVIEW / ISSUE</text><text x="46" y="338">DECISION</text><text x="46" y="412">RECOVERY POINT</text></g>
      <text x="132" y="468" text-anchor="middle" fill="#ad9b89" font-size="15">可继续 · 可复核 · 可恢复</text>
    </g>
  </g>
  <rect x="66" y="786" width="1468" height="72" rx="18" fill="#271e20" stroke="#efa64a"/>
  <text x="96" y="817" fill="#f1b35d" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2">HUMAN AUTHORITY BOUNDARY</text>
  <text x="96" y="844" fill="#e4ebf5" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18">运行时可以组织工作，但不能替代人对发布、不可逆修改、资金、凭证、隐私和策略例外的最终决定</text>
</svg>
