<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Source-reported advisory audit filtering</title>
  <desc id="desc">A source-reported change reduced 359 historical findings to 2 relevant findings while reviewing 34 transcripts and 2227 advisories.</desc>
  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="80" y="76" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#172033">One advisory audit: noise filtered before review</text>
  <text x="80" y="114" font-family="Arial, sans-serif" font-size="20" fill="#5f6b7a">Source-reported by Anywhere Agents; not independently reproduced here</text>
  <line x1="170" y1="480" x2="1070" y2="480" stroke="#aab4c2" stroke-width="2"/>
  <rect x="310" y="166" width="220" height="314" rx="10" fill="#1f6feb"/>
  <text x="420" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#172033">359</text>
  <text x="420" y="522" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#172033">Historical findings</text>
  <rect x="710" y="458" width="220" height="22" rx="8" fill="#d97706"/>
  <text x="820" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#172033">2</text>
  <text x="820" y="522" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#172033">Relevant findings</text>
  <text x="80" y="582" font-family="Arial, sans-serif" font-size="19" fill="#5f6b7a">Context reported in the same change: 34 session transcripts and 2,227 advisories.</text>
</svg>
