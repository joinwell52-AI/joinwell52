<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Historical managed job snapshot</title>
  <desc id="desc">A first-party historical snapshot contains 21 managed jobs: 9 completed, 2 failed, and 10 running.</desc>
  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="80" y="76" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#172033">Historical managed-job snapshot</text>
  <text x="80" y="114" font-family="Arial, sans-serif" font-size="20" fill="#5f6b7a">First-party snapshot, n = 21; counts are not a failure-rate estimate</text>
  <text x="80" y="206" font-family="Arial, sans-serif" font-size="25" fill="#172033">Completed</text>
  <rect x="320" y="174" width="540" height="48" rx="8" fill="#1f6feb"/>
  <text x="890" y="210" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#172033">9</text>
  <text x="80" y="316" font-family="Arial, sans-serif" font-size="25" fill="#172033">Failed</text>
  <rect x="320" y="284" width="120" height="48" rx="8" fill="#c2410c"/>
  <text x="470" y="320" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#172033">2</text>
  <text x="80" y="426" font-family="Arial, sans-serif" font-size="25" fill="#172033">Running at snapshot time</text>
  <rect x="320" y="394" width="600" height="48" rx="8" fill="#ca8a04"/>
  <text x="950" y="430" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#172033">10</text>
  <text x="80" y="510" font-family="Arial, sans-serif" font-size="19" fill="#5f6b7a">The snapshot preserves two explicit failures; it does not establish the eventual outcome of the 10 running jobs.</text>
</svg>
