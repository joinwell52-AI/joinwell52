<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Weekly 006 — Authority Needs Lineage</title>
  <desc id="desc">A chain of evidence nodes shows provenance surviving transformations from source to current authority.</desc>
  <rect width="1600" height="900" fill="#111827"/>
  <g fill="none" stroke="#64748b" stroke-width="8">
    <path d="M220 470 H1380"/>
  </g>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">
    <g fill="#0f172a" stroke="#e2e8f0" stroke-width="5">
      <circle cx="260" cy="470" r="82" fill="#f8fafc"/>
      <circle cx="620" cy="470" r="82" fill="#f8fafc"/>
      <circle cx="980" cy="470" r="82" fill="#f8fafc"/>
      <circle cx="1340" cy="470" r="82" fill="#f8fafc"/>
    </g>
    <g fill="#0f172a" font-size="28" font-weight="700">
      <text x="260" y="480">SOURCE</text>
      <text x="620" y="480">SCOPE</text>
      <text x="980" y="480">TRANSFORM</text>
      <text x="1340" y="480">AUTHORITY</text>
    </g>
    <text x="150" y="150" fill="#f8fafc" font-size="34" font-weight="700" text-anchor="start">WEEKLY RESEARCH · 006</text>
    <text x="150" y="245" fill="#f8fafc" font-size="76" font-weight="800" text-anchor="start">Authority Needs Lineage</text>
    <text x="150" y="315" fill="#cbd5e1" font-size="30" text-anchor="start">A value can survive resume, cache, delegation, or normalization</text>
    <text x="150" y="355" fill="#cbd5e1" font-size="30" text-anchor="start">without carrying the authority that originally made it valid.</text>
    <text x="150" y="760" fill="#94a3b8" font-size="25" text-anchor="start">SOURCE → SCOPE → TRANSFORMATION → CURRENT ADMISSION</text>
  </g>
</svg>
