<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="768" viewBox="0 0 1376 768" role="img" aria-labelledby="title desc">
  <title id="title">Completion is a claim, not an accepted state</title>
  <desc id="desc">A completion claim passes through process, outcome, failure and evidence checks before independent acceptance.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f"/>
      <stop offset="0.55" stop-color="#132148"/>
      <stop offset="1" stop-color="#281c52"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1376" height="768" fill="url(#bg)"/>
  <circle cx="1160" cy="90" r="260" fill="#7c3aed" opacity="0.12"/>
  <circle cx="110" cy="700" r="300" fill="#0ea5e9" opacity="0.10"/>
  <g opacity="0.17" stroke="#c4b5fd">
    <path d="M70 128H1306M70 640H1306"/>
    <path d="M210 64V704M1166 64V704"/>
  </g>
  <text x="86" y="98" fill="#93c5fd" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="4">ACADEMIC OBSERVATION 002</text>
  <text x="86" y="182" fill="#ffffff" font-family="Arial, sans-serif" font-size="58" font-weight="800">COMPLETION IS A CLAIM</text>
  <text x="86" y="246" fill="url(#accent)" font-family="Arial, sans-serif" font-size="58" font-weight="800">NOT AN ACCEPTED STATE</text>
  <text x="88" y="302" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="24">Independent verification for computer-use Digital Employees</text>

  <g filter="url(#shadow)">
    <rect x="90" y="390" width="230" height="132" rx="22" fill="#111c35" stroke="#60a5fa" stroke-width="2"/>
    <text x="205" y="438" text-anchor="middle" fill="#93c5fd" font-family="Arial, sans-serif" font-size="18" font-weight="700">COMPLETION CLAIM</text>
    <text x="205" y="475" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="15">worker assertion</text>
    <text x="205" y="501" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14">trajectory + evidence</text>

    <rect x="404" y="350" width="260" height="214" rx="24" fill="#151d3d" stroke="#a78bfa" stroke-width="2"/>
    <text x="534" y="395" text-anchor="middle" fill="#c4b5fd" font-family="Arial, sans-serif" font-size="18" font-weight="700">INDEPENDENT VERIFIER</text>
    <g fill="#e2e8f0" font-family="Arial, sans-serif" font-size="16">
      <text x="438" y="438">01  Process</text>
      <text x="438" y="472">02  Outcome</text>
      <text x="438" y="506">03  Failure class</text>
      <text x="438" y="540">04  Side effects</text>
    </g>

    <rect x="750" y="390" width="230" height="132" rx="22" fill="#111c35" stroke="#f59e0b" stroke-width="2"/>
    <text x="865" y="438" text-anchor="middle" fill="#fbbf24" font-family="Arial, sans-serif" font-size="18" font-weight="700">ACCEPTANCE GATE</text>
    <text x="865" y="475" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="15">policy + authority</text>
    <text x="865" y="501" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14">conflicts may escalate</text>

    <rect x="1064" y="390" width="222" height="132" rx="22" fill="#102c2c" stroke="#34d399" stroke-width="2"/>
    <text x="1175" y="438" text-anchor="middle" fill="#6ee7b7" font-family="Arial, sans-serif" font-size="18" font-weight="700">ACCEPTED STATE</text>
    <text x="1175" y="475" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="15">durable completion</text>
    <text x="1175" y="501" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14">versioned receipt</text>
  </g>

  <g stroke="url(#accent)" stroke-width="4" fill="none" stroke-linecap="round">
