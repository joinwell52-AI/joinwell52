<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Five boundaries around a dynamic extension point</title>
  <desc id="desc">A luminous integration core is held inside five translucent sculptural boundaries, each with a distinct material and depth.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08110f"/><stop offset=".52" stop-color="#10231f"/><stop offset="1" stop-color="#173442"/></linearGradient>
    <radialGradient id="core"><stop stop-color="#fff8d3"/><stop offset=".25" stop-color="#7ef4d1"/><stop offset=".65" stop-color="#25bca3" stop-opacity=".42"/><stop offset="1" stop-color="#25bca3" stop-opacity="0"/></radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d8fff7" stop-opacity=".32"/><stop offset="1" stop-color="#45a9c6" stop-opacity=".06"/></linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="820" cy="450" r="310" fill="url(#core)" filter="url(#glow)" opacity=".5"/>
  <g fill="url(#glass)" stroke-linejoin="round">
    <path d="M820 170L1050 300L1010 600L820 730L630 600L590 300Z" stroke="#c9fff1" stroke-width="3" opacity=".16"/>
    <path d="M820 218L1001 324L970 576L820 680L670 576L639 324Z" stroke="#9ee8ff" stroke-width="4" opacity=".22"/>
    <path d="M820 270L950 345L930 555L820 628L710 555L690 345Z" stroke="#7ff0d2" stroke-width="5" opacity=".30"/>
    <path d="M820 320L902 368L887 532L820 578L753 532L738 368Z" stroke="#ffc96d" stroke-width="6" opacity=".42"/>
    <path d="M820 365L860 390L856 510L820 535L784 510L780 390Z" stroke="#fff5be" stroke-width="7" opacity=".62"/>
  </g>
  <circle cx="820" cy="450" r="72" fill="url(#core)"/>
  <circle cx="820" cy="450" r="25" fill="#fffbea"/>
  <path d="M360 640C520 570 560 440 590 300M1240 242C1090 286 1068 434 1010 600" fill="none" stroke="#76d5ce" stroke-opacity=".18" stroke-width="3"/>
  <circle cx="353" cy="643" r="8" fill="#72e0cf"/><circle cx="1247" cy="240" r="8" fill="#72e0cf"/>
  <rect x="100" y="94" width="1400" height="712" rx="44" fill="none" stroke="#e2fff8" stroke-opacity=".10" stroke-width="2"/>
  <text x="126" y="164" font-family="Inter,Arial,sans-serif" font-size="29" letter-spacing="7" fill="#e8fff8" opacity=".84">SCOPE / OWNERSHIP / LIFETIME</text>
  <text x="126" y="790" font-family="Inter,Arial,sans-serif" font-size="21" letter-spacing="4" fill="#b5d7d1" opacity=".67">RESOURCE BOUNDS · OBSERVABILITY</text>
</svg>
