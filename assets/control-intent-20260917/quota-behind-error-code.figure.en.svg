<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img"><title>A waiting time needs a reason</title><rect width="1200" height="650" rx="24" fill="#faf8f2"/><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#17243b}.title{font-size:34px;font-weight:700}.sub{font-size:22px;fill:#526178}.label{font-size:26px;font-weight:600}.body{font-size:22px}.small{font-size:19px}.blue{fill:#174dc8}.violet{fill:#7455c8}.amber{fill:#a96710}</style><text x="48" y="65" class="title">A waiting time needs a reason</text><text x="48" y="105" class="sub">The same quota message through two original classifier revisions</text><rect x="48" y="143" width="1104" height="94" rx="16" fill="#edf1ff"/><text x="74" y="180" class="body">Message arrives as a failed turn</text><text x="74" y="216" class="body">Message content: quota exhausted, with a reset time</text><text x="48" y="295" class="label">Before</text><text x="310" y="295" class="body">No classification returned</text><text x="48" y="358" class="label blue">Candidate</text><text x="310" y="358" class="body">Quota recognized; reset time returned</text><text x="310" y="400" class="small violet">Basis: parsed from the provider message</text><rect x="48" y="433" width="1104" height="110" rx="16" fill="#fff0d9"/><text x="75" y="474" class="body">Without a reset time: default one-hour wait</text><text x="75" y="514" class="small">Basis: a fallback rule, not a promise that service will resume in one hour.</text><line x1="48" y1="573" x2="1152" y2="573" stroke="#d5dce7"/><text x="48" y="612" class="small">Classifier output only. Whether execution actually waits needs another test.</text></svg>
