<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img"><title>等待时间，也需要说明依据</title><rect width="1200" height="650" rx="24" fill="#faf8f2"/><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#17243b}.title{font-size:34px;font-weight:700}.sub{font-size:22px;fill:#526178}.label{font-size:26px;font-weight:600}.body{font-size:22px}.small{font-size:19px}.blue{fill:#174dc8}.violet{fill:#7455c8}.amber{fill:#a96710}</style><text x="48" y="65" class="title">等待时间，也需要说明依据</text><text x="48" y="105" class="sub">相同额度消息，分别交给修改前后的分类代码</text><rect x="48" y="143" width="1104" height="94" rx="16" fill="#edf1ff"/><text x="74" y="180" class="body">消息以“本轮执行失败”到达</text><text x="74" y="216" class="body">消息内容：额度耗尽，并附有恢复时间</text><text x="48" y="295" class="label">旧版</text><text x="310" y="295" class="body">没有给出分类</text><text x="48" y="358" class="label blue">候选版</text><text x="310" y="358" class="body">识别为额度限制；给出恢复时间</text><text x="310" y="400" class="small violet">依据：从服务消息中解析</text><rect x="48" y="433" width="1104" height="110" rx="16" fill="#fff0d9"/><text x="75" y="474" class="body">如果消息没有时间：给出默认一小时等待</text><text x="75" y="514" class="small">依据：程序的备用规则；服务并未承诺一小时后恢复。</text><line x1="48" y1="573" x2="1152" y2="573" stroke="#d5dce7"/><text x="48" y="612" class="small">只验证分类输出；后续执行是否真的等待，还需要另做实验。</text></svg>
