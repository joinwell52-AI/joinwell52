<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#57709b"/></marker></defs><rect width="1600" height="680" rx="24" fill="#f7f9ff"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="60" y="80" font-size="36" font-weight="700" fill="#143367">Swapping notes flips the surviving result</text><text x="60" y="127" font-size="24" fill="#536078">Both rows retain ID A, one pass and one fail.</text><rect x="60" y="205" width="329" height="113" rx="15" fill="white" stroke="#c8d3e6" stroke-width="2"/><text x="224.5" y="270" text-anchor="middle" font-size="22" font-weight="500" fill="#18355c">Pass record: note=a</text><text x="415" y="271" text-anchor="middle" font-size="32" fill="#57709b">+</text><rect x="443" y="205" width="329" height="113" rx="15" fill="white" stroke="#c8d3e6" stroke-width="2"/><text x="607.5" y="270" text-anchor="middle" font-size="22" font-weight="500" fill="#18355c">Fail record: note=b</text><path d="M780,261 L816,261" stroke="#57709b" stroke-width="3" marker-end="url(#arrow)"/><rect x="826" y="205" width="329" height="113" rx="15" fill="white" stroke="#c8d3e6" stroke-width="2"/><text x="990.5" y="270" text-anchor="middle" font-size="22" font-weight="500" fill="#18355c">Select pass</text><path d="M1163,261 L1199,261" stroke="#57709b" stroke-width="3" marker-end="url(#arrow)"/><rect x="1209" y="205" width="329" height="113" rx="15" fill="#eaf0ff" stroke="#0047ab" stroke-width="2"/><text x="1373.5" y="270" text-anchor="middle" font-size="22" font-weight="700" fill="#18355c">Pass-rate field: 100%</text><rect x="60" y="382" width="329" height="113" rx="15" fill="white" stroke="#c8d3e6" stroke-width="2"/><text x="224.5" y="447" text-anchor="middle" font-size="22" font-weight="500" fill="#18355c">Pass record: note=b</text><text x="415" y="448" text-anchor="middle" font-size="32" fill="#57709b">+</text><rect x="443" y="382" width="329" height="113" rx="15" fill="white" stroke="#c8d3e6" stroke-width="2"/><text x="607.5" y="447" text-anchor="middle" font-size="22" font-weight="500" fill="#18355c">Fail record: note=a</text><path d="M780,438 L816,438" stroke="#57709b" stroke-width="3" marker-end="url(#arrow)"/><rect x="826" y="382" width="329" height="113" rx="15" fill="white" stroke="#c8d3e6" stroke-width="2"/><text x="990.5" y="447" text-anchor="middle" font-size="22" font-weight="500" fill="#18355c">Select fail</text><path d="M1163,438 L1199,438" stroke="#57709b" stroke-width="3" marker-end="url(#arrow)"/><rect x="1209" y="382" width="329" height="113" rx="15" fill="#eaf0ff" stroke="#0047ab" stroke-width="2"/><text x="1373.5" y="447" text-anchor="middle" font-size="22" font-weight="700" fill="#18355c">Pass-rate field: 0%</text><text x="60" y="575" font-size="22" fill="#536078">The original aggregator compares canonicalized full records. Notes participate in selection. Constructed cases, not </text><text x="60" y="609" font-size="22" fill="#536078">model reliability.</text></g></svg>
