<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#57709b"/></marker></defs><rect width="1600" height="680" rx="24" fill="#f7f9ff"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="60" y="80" font-size="36" font-weight="700" fill="#143367">Execution and output blocking are different stages</text><text x="60" y="127" font-size="24" fill="#536078">Enforce mode: successful text result contains a synthetic sensitive value.</text><rect x="60" y="205" width="329" height="113" rx="15" fill="white" stroke="#c8d3e6" stroke-width="2"/><text x="224.5" y="270" text-anchor="middle" font-size="22" font-weight="500" fill="#18355c">Tool invocation</text><path d="M397,261 L433,261" stroke="#57709b" stroke-width="3" marker-end="url(#arrow)"/><rect x="443" y="205" width="329" height="113" rx="15" fill="white" stroke="#c8d3e6" stroke-width="2"/><text x="607.5" y="270" text-anchor="middle" font-size="22" font-weight="500" fill="#18355c">Counter reaches 1</text><path d="M780,261 L816,261" stroke="#57709b" stroke-width="3" marker-end="url(#arrow)"/><rect x="826" y="205" width="329" height="113" rx="15" fill="white" stroke="#c8d3e6" stroke-width="2"/><text x="990.5" y="270" text-anchor="middle" font-size="22" font-weight="500" fill="#18355c">Scan returned content</text><path d="M1163,261 L1199,261" stroke="#57709b" stroke-width="3" marker-end="url(#arrow)"/><rect x="1209" y="205" width="329" height="113" rx="15" fill="#eaf0ff" stroke="#0047ab" stroke-width="2"/><text x="1373.5" y="270" text-anchor="middle" font-size="22" font-weight="700" fill="#18355c">Returned value blocked</text><rect x="60" y="382" width="329" height="113" rx="15" fill="white" stroke="#c8d3e6" stroke-width="2"/><text x="224.5" y="447" text-anchor="middle" font-size="22" font-weight="500" fill="#18355c">Invocation receipt</text><path d="M397,438 L433,438" stroke="#57709b" stroke-width="3" marker-end="url(#arrow)"/><rect x="443" y="382" width="329" height="113" rx="15" fill="white" stroke="#c8d3e6" stroke-width="2"/><text x="607.5" y="447" text-anchor="middle" font-size="22" font-weight="500" fill="#18355c">executed</text><path d="M780,438 L816,438" stroke="#57709b" stroke-width="3" marker-end="url(#arrow)"/><rect x="826" y="382" width="329" height="113" rx="15" fill="white" stroke="#c8d3e6" stroke-width="2"/><text x="990.5" y="447" text-anchor="middle" font-size="22" font-weight="500" fill="#18355c">Output receipt</text><path d="M1163,438 L1199,438" stroke="#57709b" stroke-width="3" marker-end="url(#arrow)"/><rect x="1209" y="382" width="329" height="113" rx="15" fill="#eaf0ff" stroke="#0047ab" stroke-width="2"/><text x="1373.5" y="447" text-anchor="middle" font-size="22" font-weight="700" fill="#18355c">blocked</text><text x="60" y="575" font-size="22" fill="#536078">Two receipts do not mean two calls. Blocked output does not mean unexecuted work. This fixture only increments a </text><text x="60" y="609" font-size="22" fill="#536078">counter.</text></g></svg>

