hite" stroke="#c8d3e6" stroke-width="2"/><text x="607.5" y="447" text-anchor="middle" font-size="26" font-weight="500" fill="#18355c">失败记录 note=a</text><path d="M780,438 L816,438" stroke="#57709b" stroke-width="3" marker-end="url(#arrow)"/><rect x="826" y="382" width="329" height="113" rx="15" fill="white" stroke="#c8d3e6" stroke-width="2"/><text x="990.5" y="447" text-anchor="middle" font-size="26" font-weight="500" fill="#18355c">选择 fail</text><path d="M1163,438 L1199,438" stroke="#57709b" stroke-width="3" marker-end="url(#arrow)"/><rect x="1209" y="382" width="329" height="113" rx="15" fill="#eaf0ff" stroke="#0047ab" stroke-width="2"/><text x="1373.5" y="447" text-anchor="middle" font-size="26" font-weight="700" fill="#18355c">输出通过率 0%</text><text x="60" y="575" font-size="22" fill="#536078">原聚合函数比较整条记录的规范化 JSON；备注参与选择。示意来自两组构造输入，不是模型可靠率。</text><text x="60" y="609" font-size="22" fill="#536078"></text></g></svg>
