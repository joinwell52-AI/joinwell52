<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img"><title>两道不同的检查</title><rect width="1120" height="560" rx="24" fill="#faf8f3"/><style>text{font-family:'Microsoft YaHei','Segoe UI',sans-serif;fill:#172744}.title{font-size:32px;font-weight:700}.head{font-size:25px;font-weight:600}.body{font-size:23px}.note{font-size:22px;fill:#6143a8}</style><text x="48" y="64" class="title">两道不同的检查</text><rect x="48" y="110" width="496" height="332" rx="18" fill="white" stroke="#cad4e8"/><text x="72" y="155" class="head">设置写对了吗？</text><rect x="72" y="186" width="448" height="64" rx="10" fill="#edf1ff"/><text x="90" y="227" class="body">字符串 “always”</text><text x="72" y="307" class="body">改动前：执行一次</text><text x="72" y="377" class="body">候选改动：报错，未执行</text><rect x="576" y="110" width="496" height="332" rx="18" fill="white" stroke="#cad4e8"/><text x="600" y="155" class="head">检查程序给出答案了吗？</text><rect x="600" y="186" width="448" height="64" rx="10" fill="#edf1ff"/><text x="618" y="227" class="body">没有返回答案（None）</text><text x="600" y="307" class="body">改动前后：都执行一次</text><text x="48" y="510" class="note">设置写对了，还要检查判断程序是否给出了有效答案</text></svg>
