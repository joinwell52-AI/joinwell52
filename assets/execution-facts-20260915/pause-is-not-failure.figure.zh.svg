<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img"><title>保留当次原因，避免事后误判</title><rect width="1120" height="560" rx="24" fill="#faf8f3"/><style>text{font-family:'Microsoft YaHei','Segoe UI',sans-serif;fill:#172744}.title{font-size:32px;font-weight:700}.head{font-size:25px;font-weight:600}.body{font-size:23px}.note{font-size:22px;fill:#6143a8}</style><text x="48" y="64" class="title">保留当次原因，避免事后误判</text><rect x="48" y="120" width="324" height="158" rx="18" fill="#e8efff"/><text x="68" y="165" class="head">最初检查：正常运行</text><text x="68" y="223" class="body">随后团队被暂停</text><path d="M374 198h18" stroke="#294fca" stroke-width="3"/><rect x="396" y="120" width="324" height="158" rx="18" fill="#ede8fa"/><text x="416" y="165" class="head">记住无法继续的原因</text><text x="416" y="223" class="body">团队处于暂停状态</text><path d="M722 198h18" stroke="#294fca" stroke-width="3"/><rect x="744" y="120" width="324" height="158" rx="18" fill="#e8efff"/><text x="764" y="165" class="head">随后团队恢复</text><text x="764" y="223" class="body">这一次仍按暂停跳过</text><rect x="48" y="335" width="1020" height="108" rx="16" fill="white" stroke="#cad4e8"/><text x="72" y="376" class="head">正在运行的团队确实超出额度</text><text x="72" y="417" class="body">仍按额度问题处理</text><text x="48" y="511" class="note">不能用后来恢复的状态，抹去刚才暂停的原因</text></svg>
