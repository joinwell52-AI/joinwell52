<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><title>接管判断</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#3263c4"/></marker></defs><rect width="1600" height="1000" fill="#f6f8fd"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="70" y="67" fill="#163c84" font-size="39" font-weight="700"><tspan x="70" dy="0">中断之后，先判断能不能接管</tspan></text><text x="70" y="110" fill="#637186" font-size="23" font-weight="400"><tspan x="70" dy="0">冻结合同的语义摘要 · 不是已交付产品流程</tspan></text><rect x="70" y="155" width="780" height="138" rx="18" fill="#fff" stroke="#d3dce8" stroke-width="2"/><text x="100" y="197" fill="#173e87" font-size="29" font-weight="700"><tspan x="100" dy="0">同一 TASK 的技术中断</tspan></text><text x="100" y="246" fill="#19334f" font-size="25" font-weight="400"><tspan x="100" dy="0">先核验：外部执行是否仍活 / 原 owner 是否仍有效</tspan></text><path d="M850 225H1000" fill="none" stroke="#3263c4" stroke-width="3"  marker-end="url(#arrow)"/><rect x="1020" y="155" width="510" height="138" rx="18" fill="#fff4df" stroke="#e1b35d" stroke-width="2"/><text x="1050" y="197" fill="#895b0c" font-size="30" font-weight="700"><tspan x="1050" dy="0">not_admitted</tspan></text><text x="1050" y="243" fill="#19334f" font-size="21" font-weight="400"><tspan x="1050" dy="0">条件仍有效：保留 owner，不创建 successor</tspan></text><path d="M455 293V345" fill="none" stroke="#3263c4" stroke-width="3"  marker-end="url(#arrow)"/><rect x="70" y="360" width="780" height="122" rx="18" fill="#eaf1ff" stroke="#8eafe5" stroke-width="2"/><text x="100" y="404" fill="#173e87" font-size="27" font-weight="700"><tspan x="100" dy="0">执行权已释放 → 读取可信效果事实</tspan></text><text x="100" y="447" fill="#19334f" font-size="23" font-weight="400"><tspan x="100" dy="0">未知、缺失或无法解释的证据不能当作“未发生”</tspan></text><text x="1000" y="393" fill="#667588" font-size="24" font-weight="400"><tspan x="1000" dy="0">正常授权 rework / reassign</tspan><tspan x="1000" dy="35.519999999999996">或新 round retry 保持原路径</tspan><tspan x="1000" dy="35.519999999999996">不创建 interruption case</tspan></text><path d="M455 482V523H292V568" fill="none" stroke="#3263c4" stroke-width="3"  marker-end="url(#arrow)"/><path d="M455 523H800V568" fill="none" stroke="#3263c4" stroke-width="3"  marker-end="url(#arrow)"/><path d="M800 523H1300V568" fill="none" stroke="#3263c4" stroke-width="3"  marker-end="url(#arrow)"/><rect x="70" y="585" width="460" height="225" rx="18" fill="#eaf1ff" stroke="#8eafe5" stroke-width="2"/><text x="94" y="625" fill="#194ca0" font-size="29" font-weight="700"><tspan x="94" dy="0">reexecute</tspan></text><text x="94" y="669" fill="#19334f" font-size="21" font-weight="400"><tspan x="94" dy="0">效果确认未发生</tspan><tspan x="94" dy="31.08">none_verified：当前接管授权 + ownership</tspan><tspan x="94" dy="31.08">single_verified：再核验动作绑定与授权</tspan><tspan x="94" dy="31.08">真正 tool call 时核验动作授权</tspan></text><rect x="570" y="585" width="460" height="225" rx="18" fill="#f1edfa" stroke="#b6a2d6" stroke-width="2"/><text x="594" y="625" fill="#67459d" font-size="29" font-weight="700"><tspan x="594" dy="0">reconcile_only</tspan></text><text x="594" y="669" fill="#19334f" font-size="21" font-weight="400"><tspan x="594" dy="0">效果确认已发生</tspan><tspan x="594" dy="31.08">只对账、补记已有结果</tspan><tspan x="594" dy="31.08">不得重做原动作</tspan><tspan x="594" dy="31.08">受控完成引用支持 case 关闭</tspan></text><rect x="1070" y="585" width="460" height="225" rx="18" fill="#fff5e5" stroke="#e1b35d" stroke-width="2"/><text x="1094" y="625" fill="#895b0c" font-size="29" font-weight="700"><tspan x="1094" dy="0">hold_for_review</tspan></text><text x="1094" y="669" fill="#19334f" font-size="21" font-weight="400"><tspan x="1094" dy="0">效果未知 / 不支持的证据</tspan><tspan x="1094" dy="31.08">阻断自动重执行</tspan><tspan x="1094" dy="31.08">PM/ADMIN 按现有权限处理</tspan><tspan x="1094" dy="31.08">显式重新准入；观察者不自动 wake</tspan></text><rect x="70" y="853" width="1460" height="85" rx="18" fill="#fff" stroke="#d3dce8" stroke-width="2"/><text x="96" y="888" fill="#19334f" font-size="23" font-weight="400"><tspan x="96" dy="0">独立 fencing 事件：拒绝旧 owner 迟到终态；不得覆盖当前 recovery disposition。</tspan></text><text x="96" y="920" fill="#6b7587" font-size="19" font-weight="400"><tspan x="96" dy="0">来源：RUN-002 RA-7/RA-8 + 冻结合同 Rev.2。研究没有证明线上重复副作用。</tspan></text></g></svg>
