<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#718398"/></marker></defs><rect width="1440" height="720" fill="#f8fafc"/><g font-family="Microsoft YaHei, sans-serif"><text x="64" y="70" fill="#2468b4" font-size="18" font-weight="700">414 / 02</text><text x="64" y="130" fill="#152a3e" font-size="40" font-weight="700">四个时间节点，两类行动要求</text><text x="64" y="178" fill="#64758a" font-size="23" font-weight="400">2026—2027：先报送，再看年底目标；不能把目标门槛当成实际增长曲线。</text><path d="M112 358H1325V358" fill="none" stroke="#b7c8db" stroke-width="3"/><circle cx="110" cy="358" r="10" fill="#a56b28"/><text x="80" y="290" fill="#9b6324" font-size="26" font-weight="700">2026.12.01 前</text><text x="80" y="427" fill="#152a3e" font-size="25" font-weight="400">报送地方资源池</text><text x="80" y="476" fill="#152a3e" font-size="25" font-weight="700">与服务团信息</text><circle cx="444" cy="358" r="10" fill="#236abb"/><text x="414" y="290" fill="#236abb" font-size="26" font-weight="700">2026 年底</text><text x="414" y="427" fill="#152a3e" font-size="25" font-weight="400">全国资源池</text><text x="414" y="476" fill="#236abb" font-size="32" font-weight="700">超过 2000 家</text><circle cx="778" cy="358" r="10" fill="#a56b28"/><text x="748" y="290" fill="#9b6324" font-size="26" font-weight="700">2027.12.01 前</text><text x="748" y="427" fill="#152a3e" font-size="25" font-weight="400">报送地方</text><text x="748" y="476" fill="#152a3e" font-size="25" font-weight="700">行动总结报告</text><circle cx="1112" cy="358" r="10" fill="#236abb"/><text x="1082" y="290" fill="#236abb" font-size="26" font-weight="700">2027 年底</text><text x="1082" y="427" fill="#152a3e" font-size="25" font-weight="400">全国资源池</text><text x="1082" y="476" fill="#236abb" font-size="32" font-weight="700">不少于 3000 家</text><rect x="64" y="535" width="1312" height="70" rx="16" fill="#edf2f6"/><text x="88" y="579" fill="#152a3e" font-size="25" font-weight="400">报送节点与年底目标是两类要求；资源池目标不代表实际入池数量或收入。</text><path d="M64 644H1376" stroke="#d4dee7"/><text x="64" y="682" fill="#64758a" font-size="18" font-weight="400">依据：工信厅科函〔2026〕414号“行动目标”与“工作要求”。</text></g></svg>
