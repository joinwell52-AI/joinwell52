<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#718398"/></marker></defs><rect width="1440" height="760" fill="#f8fafc"/><g font-family="Microsoft YaHei, sans-serif"><text x="64" y="70" fill="#2468b4" font-size="18" font-weight="700">414 / 05</text><text x="64" y="130" fill="#152a3e" font-size="40" font-weight="700">产品承载运行，协议定义协作事实</text><text x="64" y="178" fill="#64758a" font-size="23" font-weight="400">把数字员工交付到企业现场，并让长期工作可运营、可治理、可审查。</text><rect x="64" y="230" width="1312" height="93" rx="16" fill="#eaf1f8"/><text x="96" y="287" fill="#152a3e" font-size="30" font-weight="700">应用服务商</text><path d="M330 277H952V277" fill="none" stroke="#718398" stroke-width="3" marker-end="url(#arrow)"/><text x="519" y="267" fill="#64758a" font-size="22" font-weight="400">交付与持续服务</text><text x="1004" y="287" fill="#152a3e" font-size="30" font-weight="700">企业现场</text><rect x="64" y="350" width="1312" height="143" rx="16" fill="#173750"/><text x="95" y="401" fill="#fff" font-size="34" font-weight="700">CodeFlowMu</text><text x="398" y="401" fill="#fff" font-size="27" font-weight="400">本地化数字员工工作站与运行管理底座</text><text x="95" y="454" fill="#d4e6f6" font-size="25" font-weight="400">交付实施：安装与配置          运营管理：监测与恢复          安全治理：授权与审计</text><rect x="64" y="520" width="1312" height="108" rx="16" fill="#e4edf5"/><text x="95" y="566" fill="#2468b4" font-size="30" font-weight="700">FCoP</text><text x="260" y="564" fill="#152a3e" font-size="26" font-weight="400">开放协议层：让工作事实与协作边界可交换、可审查</text><text x="260" y="603" fill="#64758a" font-size="22" font-weight="400">任务 · 报告 · 问题 · 审查 · 授权关系 · 并发与恢复</text><path d="M64 684H1376" stroke="#d4dee7"/><text x="64" y="722" fill="#64758a" font-size="18" font-weight="400">依据：作者的产品与研究定位分析；不表示政策指定或认可具体产品。</text></g></svg>
