<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="770" viewBox="0 0 1440 770"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#718398"/></marker></defs><rect width="1440" height="770" fill="#f8fafc"/><g font-family="Microsoft YaHei, sans-serif"><text x="64" y="70" fill="#2468b4" font-size="18" font-weight="700">414 / 04</text><text x="64" y="130" fill="#152a3e" font-size="40" font-weight="700">五个附件，把政策方向转为可记录的事实</text><text x="64" y="178" fill="#64758a" font-size="23" font-weight="400">从单个主体，到服务网络，再到地方行动评估。</text><rect x="64" y="238" width="1312" height="70" rx="8" fill="#e7eff7"/><text x="88" y="284" fill="#2468b4" font-size="22" font-weight="700">01</text><text x="157" y="284" fill="#152a3e" font-size="26" font-weight="700">服务商档案</text><text x="574" y="284" fill="#152a3e" font-size="25" font-weight="400">记录主体、团队、服务与案例事实</text><rect x="64" y="321" width="1312" height="70" rx="8" fill="#eef3f7"/><text x="88" y="367" fill="#2468b4" font-size="22" font-weight="700">02</text><text x="157" y="367" fill="#152a3e" font-size="26" font-weight="700">资源池模板</text><text x="574" y="367" fill="#152a3e" font-size="25" font-weight="400">把服务能力整理成可检索的索引</text><rect x="64" y="404" width="1312" height="70" rx="8" fill="#e7eff7"/><text x="88" y="450" fill="#2468b4" font-size="22" font-weight="700">03</text><text x="157" y="450" fill="#152a3e" font-size="26" font-weight="700">信息报送要求</text><text x="574" y="450" fill="#152a3e" font-size="25" font-weight="400">明确报送条件与相应证明材料</text><rect x="64" y="487" width="1312" height="70" rx="8" fill="#eef3f7"/><text x="88" y="533" fill="#2468b4" font-size="22" font-weight="700">04</text><text x="157" y="533" fill="#152a3e" font-size="26" font-weight="700">服务团信息表</text><text x="574" y="533" fill="#152a3e" font-size="25" font-weight="400">列明牵头单位、成员与综合能力</text><rect x="64" y="570" width="1312" height="70" rx="8" fill="#e7eff7"/><text x="88" y="616" fill="#2468b4" font-size="22" font-weight="700">05</text><text x="157" y="616" fill="#152a3e" font-size="26" font-weight="700">总结报告模板</text><text x="574" y="616" fill="#152a3e" font-size="25" font-weight="400">汇总地方行动成效、经验与问题</text><path d="M64 694H1376" stroke="#d4dee7"/><text x="64" y="732" fill="#64758a" font-size="18" font-weight="400">依据：政策发布页附件目录与本文对附件的解读整理。</text></g></svg>
