<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#718398"/></marker></defs><rect width="1440" height="720" fill="#f8fafc"/><g font-family="Microsoft YaHei, sans-serif"><text x="64" y="70" fill="#2468b4" font-size="18" font-weight="700">414 / 01</text><text x="64" y="130" fill="#152a3e" font-size="40" font-weight="700">“上线”只是中点，服务要覆盖完整生命周期</text><text x="64" y="178" fill="#64758a" font-size="23" font-weight="400">从用户单位的智能化需求出发，咨询、交付和运营共同形成应用服务。</text><rect x="64" y="250" width="416" height="235" rx="16" fill="#eaf1f8"/><text x="92" y="294" fill="#2468b4" font-size="20" font-weight="700">01</text><text x="92" y="344" fill="#152a3e" font-size="32" font-weight="700">咨询规划</text><text x="92" y="399" fill="#152a3e" font-size="23" font-weight="400">识别业务需求</text><text x="92" y="443" fill="#152a3e" font-size="23" font-weight="400">界定目标与实施路径</text><path d="M486 367H504V367" fill="none" stroke="#718398" stroke-width="3" marker-end="url(#arrow)"/><rect x="512" y="250" width="416" height="235" rx="16" fill="#eaf1f8"/><text x="540" y="294" fill="#2468b4" font-size="20" font-weight="700">02</text><text x="540" y="344" fill="#152a3e" font-size="32" font-weight="700">交付实施</text><text x="540" y="399" fill="#152a3e" font-size="23" font-weight="400">接入模型、数据与系统</text><text x="540" y="443" fill="#152a3e" font-size="23" font-weight="400">完成部署、适配与验收</text><path d="M934 367H952V367" fill="none" stroke="#718398" stroke-width="3" marker-end="url(#arrow)"/><rect x="960" y="250" width="416" height="235" rx="16" fill="#eaf1f8"/><text x="988" y="294" fill="#2468b4" font-size="20" font-weight="700">03</text><text x="988" y="344" fill="#152a3e" font-size="32" font-weight="700">运营管理</text><text x="988" y="399" fill="#152a3e" font-size="23" font-weight="400">监测运行与应用效果</text><text x="988" y="443" fill="#152a3e" font-size="23" font-weight="400">持续维护、优化与恢复</text><rect x="64" y="521" width="1312" height="87" rx="16" fill="#152f4a"/><text x="91" y="574" fill="#fff" font-size="28" font-weight="700">安全治理</text><text x="272" y="574" fill="#d7e7f7" font-size="25" font-weight="400">网络安全 · 数据安全 · 伦理与业务合规，贯穿服务全过程</text><path d="M64 644H1376" stroke="#d4dee7"/><text x="64" y="682" fill="#64758a" font-size="18" font-weight="400">依据：414号文服务商定义及重点任务；图中环节说明为本文整理。</text></g></svg>
