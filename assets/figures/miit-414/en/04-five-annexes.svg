<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="770" viewBox="0 0 1440 770"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#718398"/></marker></defs><rect width="1440" height="770" fill="#f8fafc"/><g font-family="Microsoft YaHei, sans-serif"><text x="64" y="70" fill="#2468b4" font-size="18" font-weight="700">414 / 04</text><text x="64" y="130" fill="#152a3e" font-size="40" font-weight="700">Five annexes turn policy into recorded evidence</text><text x="64" y="178" fill="#64758a" font-size="23" font-weight="400">From individual providers, to service networks, to evaluation of local implementation.</text><rect x="64" y="238" width="1312" height="70" rx="8" fill="#e7eff7"/><text x="88" y="284" fill="#2468b4" font-size="22" font-weight="700">01</text><text x="157" y="284" fill="#152a3e" font-size="26" font-weight="700">Provider profile</text><text x="574" y="284" fill="#152a3e" font-size="25" font-weight="400">Record the entity, team, services, and actual cases</text><rect x="64" y="321" width="1312" height="70" rx="8" fill="#eef3f7"/><text x="88" y="367" fill="#2468b4" font-size="22" font-weight="700">02</text><text x="157" y="367" fill="#152a3e" font-size="26" font-weight="700">Pool template</text><text x="574" y="367" fill="#152a3e" font-size="25" font-weight="400">Create a searchable index of service capabilities</text><rect x="64" y="404" width="1312" height="70" rx="8" fill="#e7eff7"/><text x="88" y="450" fill="#2468b4" font-size="22" font-weight="700">03</text><text x="157" y="450" fill="#152a3e" font-size="26" font-weight="700">Reporting requirements</text><text x="574" y="450" fill="#152a3e" font-size="25" font-weight="400">Specify conditions and supporting evidence</text><rect x="64" y="487" width="1312" height="70" rx="8" fill="#eef3f7"/><text x="88" y="533" fill="#2468b4" font-size="22" font-weight="700">04</text><text x="157" y="533" fill="#152a3e" font-size="26" font-weight="700">Consortium information</text><text x="574" y="533" fill="#152a3e" font-size="25" font-weight="400">Identify the lead, members, and combined capabilities</text><rect x="64" y="570" width="1312" height="70" rx="8" fill="#e7eff7"/><text x="88" y="616" fill="#2468b4" font-size="22" font-weight="700">05</text><text x="157" y="616" fill="#152a3e" font-size="26" font-weight="700">Summary report</text><text x="574" y="616" fill="#152a3e" font-size="25" font-weight="400">Review local results, lessons, and problems</text><path d="M64 694H1376" stroke="#d4dee7"/><text x="64" y="732" fill="#64758a" font-size="18" font-weight="400">Source: official annex list and the article's analysis of the annexes.</text></g></svg>
