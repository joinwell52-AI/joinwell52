<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#718398"/></marker></defs><rect width="1440" height="720" fill="#f8fafc"/><g font-family="Microsoft YaHei, sans-serif"><text x="64" y="70" fill="#2468b4" font-size="18" font-weight="700">414 / 01</text><text x="64" y="130" fill="#152a3e" font-size="40" font-weight="700">Going live is not the finish line</text><text x="64" y="178" fill="#64758a" font-size="23" font-weight="400">Start with customer needs; connect planning, implementation, and continuing operations.</text><rect x="64" y="250" width="416" height="235" rx="16" fill="#eaf1f8"/><text x="92" y="294" fill="#2468b4" font-size="20" font-weight="700">01</text><text x="92" y="344" fill="#152a3e" font-size="26" font-weight="700">Consulting &amp; planning</text><text x="92" y="399" fill="#152a3e" font-size="23" font-weight="400">Identify business needs</text><text x="92" y="443" fill="#152a3e" font-size="20" font-weight="400">Define goals and a delivery plan</text><path d="M486 367H504V367" fill="none" stroke="#718398" stroke-width="3" marker-end="url(#arrow)"/><rect x="512" y="250" width="416" height="235" rx="16" fill="#eaf1f8"/><text x="540" y="294" fill="#2468b4" font-size="20" font-weight="700">02</text><text x="540" y="344" fill="#152a3e" font-size="26" font-weight="700">Delivery &amp; implementation</text><text x="540" y="399" fill="#152a3e" font-size="20" font-weight="400">Connect models, data, and systems</text><text x="540" y="443" fill="#152a3e" font-size="21" font-weight="400">Deploy, integrate, and validate</text><path d="M934 367H952V367" fill="none" stroke="#718398" stroke-width="3" marker-end="url(#arrow)"/><rect x="960" y="250" width="416" height="235" rx="16" fill="#eaf1f8"/><text x="988" y="294" fill="#2468b4" font-size="20" font-weight="700">03</text><text x="988" y="344" fill="#152a3e" font-size="26" font-weight="700">Operations management</text><text x="988" y="399" fill="#152a3e" font-size="22" font-weight="400">Monitor operation and outcomes</text><text x="988" y="443" fill="#152a3e" font-size="22" font-weight="400">Maintain, improve, and recover</text><rect x="64" y="521" width="1312" height="87" rx="16" fill="#152f4a"/><text x="91" y="574" fill="#fff" font-size="16" font-weight="700">Security governance</text><text x="272" y="574" fill="#d7e7f7" font-size="25" font-weight="400">Cybersecurity, data security, ethics, and compliance throughout the lifecycle</text><path d="M64 644H1376" stroke="#d4dee7"/><text x="64" y="682" fill="#64758a" font-size="18" font-weight="400">Source: Document No. 414, provider definition and key tasks; explanatory synthesis.</text></g></svg>
