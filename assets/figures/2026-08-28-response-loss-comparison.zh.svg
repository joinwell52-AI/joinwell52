<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">V2.0.4 历史实验：同一响应丢失窗口，两个结果</title>
  <desc id="desc">旧基线 write_report 重试后报告一份，任务创建产生两张 TASK；这是历史对照，V2.1.2 的持久回执修复见正文。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaf7"/>
      <stop offset="1" stop-color="#f1f5fb"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#155eef"/>
      <stop offset="1" stop-color="#31b9ff"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#12305a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2478f2"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
    <style>
      text { font-family: 'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; fill:#16263f; }
      .h1 { font-size:42px; font-weight:700; }
      .sub { font-size:22px; fill:#52657d; }
      .lane { font-size:29px; font-weight:700; }
      .step { font-size:22px; font-weight:650; }
      .small { font-size:19px; fill:#52657d; }
      .result { font-size:27px; font-weight:750; }
      .tag { font-size:18px; font-weight:700; letter-spacing:1px; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="90" y="86" class="h1">V2.0.4 历史实验：同一响应丢失窗口，两个结果</text>
  <text x="90" y="126" class="sub">旧基线对照，不是 V2.1.2 行为；故障窗口：第一次动作已落盘，调用方未确认结果后再次提交。</text>

  <g filter="url(#shadow)">
    <rect x="80" y="180" width="1440" height="260" rx="30" fill="#ffffff" stroke="#b9d4ff" stroke-width="2"/>
    <rect x="80" y="180" width="240" height="260" rx="30" fill="#edf5ff"/>
    <rect x="80" y="180" width="12" height="260" rx="6" fill="url(#blue)"/>
    <text x="125" y="245" class="tag" fill="#155eef">实测路径 A</text>
    <text x="125" y="293" class="lane">提交报告</text>
    <text x="125" y="330" class="small">write_report</text>
    <text x="125" y="382" class="small">已有持久去重</text>

    <circle cx="430" cy="300" r="38" fill="#e8f2ff" stroke="#2478f2" stroke-width="3"/>
    <text x="430" y="308" text-anchor="middle" class="step">1</text>
    <text x="430" y="365" text-anchor="middle" class="step">报告落盘</text>
    <line x1="473" y1="300" x2="630" y2="300" stroke="#2478f2" stroke-width="5" marker-end="url(#arrowBlue)"/>

    <circle cx="690" cy="300" r="38" fill="#fff3df" stroke="#f59e0b" stroke-width="3"/>
    <path d="M676 284 L704 316 M704 284 L676 316" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
    <text x="690" y="365" text-anchor="middle" class="step">响应丢失</text>
    <line x1="733" y1="300" x2="890" y2="300" stroke="#2478f2" stroke-width="5" stroke-dasharray="12 10" marker-end="url(#arrowBlue)"/>

    <circle cx="950" cy="300" r="38" fill="#e8f2ff" stroke="#2478f2" stroke-width="3"/>
    <text x="950" y="308" text-anchor="middle" class="step">2</text>
    <text x="950" y="365" text-anchor="middle" class="step">相同请求重试</text>
    <line x1="993" y1="300" x2="1145" y2="300" stroke="#2478f2" stroke-width="5" marker-end="url(#arrowBlue)"/>

    <rect x="1190" y="237" width="255" height="126" rx="22" fill="#e8f2ff" stroke="#2478f2" stroke-width="3"/>
    <rect x="1230" y="270" width="50" height="63" rx="8" fill="#2478f2" opacity="0.2" stroke="#2478f2" stroke-width="2"/>
    <path d="M1243 289 H1268 M1243 301 H1268 M1243 313 H1260" stroke="#2478f2" stroke-width="4" stroke-linecap="round"/>
    <text x="1290" y="288" class="result" fill="#155eef">报告 1 份</text>
    <text x="1210" y="395" class="small">deduplicated = true</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="80" y="480" width="1440" height="260" rx="30" fill="#ffffff" stroke="#ffd39a" stroke-width="2"/>
    <rect x="80" y="480" width="240" height="260" rx="30" fill="#fff7eb"/>
    <rect x="80" y="480" width="12" height="260" rx="6" fill="url(#amber)"/>
    <text x="125" y="545" class="tag" fill="#d97706">实测路径 B</text>
    <text x="125" y="593" class="lane">创建任务</text>
    <text x="125" y="630" class="small">write_task</text>
    <text x="125" y="682" class="small">提交标识未绑定结果</text>

    <circle cx="430" cy="600" r="38" fill="#fff3df" stroke="#f59e0b" stroke-width="3"/>
    <text x="430" y="608" text-anchor="middle" class="step">1</text>
    <text x="430" y="665" text-anchor="middle" class="step">任务 A 落盘</text>
    <line x1="473" y1="600" x2="630" y2="600" stroke="#f59e0b" stroke-width="5" marker-end="url(#arrowAmber)"/>

    <circle cx="690" cy="600" r="38" fill="#fff3df" stroke="#f59e0b" stroke-width="3"/>
    <path d="M676 584 L704 616 M704 584 L676 616" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
    <text x="690" y="665" text-anchor="middle" class="step">响应丢失</text>
    <line x1="733" y1="600" x2="890" y2="600" stroke="#f59e0b" stroke-width="5" stroke-dasharray="12 10" marker-end="url(#arrowAmber)"/>

    <circle cx="950" cy="600" r="38" fill="#fff3df" stroke="#f59e0b" stroke-width="3"/>
    <text x="950" y="608" text-anchor="middle" class="step">2</text>
    <text x="950" y="665" text-anchor="middle" class="step">相同请求重试</text>
    <line x1="993" y1="600" x2="1145" y2="600" stroke="#f59e0b" stroke-width="5" marker-end="url(#arrowAmber)"/>

    <rect x="1180" y="526" width="280" height="148" rx="22" fill="#fff3df" stroke="#f59e0b" stroke-width="3"/>
    <rect x="1212" y="560" width="50" height="63" rx="8" fill="#f59e0b" opacity="0.18" stroke="#f59e0b" stroke-width="2"/>
    <rect x="1242" y="579" width="50" height="63" rx="8" fill="#f59e0b" opacity="0.28" stroke="#f59e0b" stroke-width="2"/>
    <text x="1300" y="581" class="result" fill="#d97706">任务 2 张</text>
    <text x="1210" y="709" class="small">A 与 B 身份不同</text>
  </g>

  <rect x="80" y="790" width="1440" height="64" rx="18" fill="#16263f"/>
  <text x="115" y="831" font-size="23" font-weight="700" style="fill:#ffffff">后续 V2.1.2：稳定提交 ID + 同一摘要 → 复用一个权威 TASK；未提供 ID 的旧调用仍走兼容路径。</text>
</svg>
