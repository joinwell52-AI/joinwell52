08</text><text x="25" y="112" fill="#fff" font-size="29" font-weight="700">应用服务商</text><text x="25" y="158" fill="#a9c1cc" font-size="20">建立交付体系</text></g><g transform="translate(1235 270)"><rect width="250" height="370" rx="18" fill="url(#g)"/><text x="25" y="60" fill="#fff4df" font-size="22">2026.09</text><text x="25" y="120" fill="white" font-size="30" font-weight="700">创业支持计划</text><text x="25" y="168" fill="#fff0db" font-size="20">扩大创业企业供给</text><circle cx="125" cy="270" r="56" fill="#fff" opacity=".16"/><path d="M95 292c18-4 24-23 30-49 8 25 17 43 38 49-25 7-33 16-39 38-7-22-13-32-29-38z" fill="#fff"/></g></g><text x="115" y="730" fill="#d9e5e8" font-size="27" font-family="Microsoft YaHei,sans-serif">战略 → 基础设施 → 产品 → 交付 → 创业主体</text><text x="115" y="780" fill="#e9b867" font-size="23" font-family="Microsoft YaHei,sans-serif">政策重点从“有没有 AI”转向“谁把 AI 带进真实产业”</text></svg>
