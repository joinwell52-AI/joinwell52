<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#102c3d"/></linearGradient><linearGradient id="g"><stop stop-color="#e9b867"/><stop offset="1" stop-color="#b94738"/></linearGradient></defs><rect width="1600" height="900" fill="url(#b)"/><text x="110" y="125" fill="#f4ead8" font-size="44" font-family="Arial" font-weight="700">From national strategy to a startup supply layer</text><text x="110" y="175" fill="#8fa9b8" font-size="23" font-family="Arial">Five policy moves form an implementation sequence for AI adoption</text><path d="M165 473H1435" stroke="#426276" stroke-width="6"/><path d="M1435 473l-26-15v30z" fill="#e9b867"/><g font-family="Arial"><g transform="translate(115 300)"><rect width="250" height="310" rx="18" fill="#102f42" stroke="#3d7187"/><text x="25" y="55" fill="#69d4eb" font-size="22">Aug 2025</text><text x="25" y="112" fill="#fff" font-size="27" font-weight="700">AI Plus</text><text x="25" y="158" fill="#a9c1cc" font-size="19">Set adoption goals</text></g><g transform="translate(395 300)"><rect width="250" height="310" rx="18" fill="#102f42" stroke="#3d7187"/><text x="25" y="55" fill="#69d4eb" font-size="22">Apr 2026</text><text x="25" y="112" fill="#fff" font-size="27" font-weight="700">Inclusive compute</text><text x="25" y="158" fill="#a9c1cc" font-size="19">Lower access costs</text></g><g transform="translate(675 300)"><rect width="250" height="310" rx="18" fill="#102f42" stroke="#3d7187"/><text x="25" y="55" fill="#69d4eb" font-size="22">Jul 2026</text><text x="25" y="112" fill="#fff" font-size="27" font-weight="700">Lightweight tools</text><text x="25" y="158" fill="#a9c1cc" font-size="19">Define SME products</text></g><g transform="translate(955 300)"><rect width="250" height="310" rx="18" fill="#102f42" stroke="#3d7187"/><text x="25" y="55" fill="#69d4eb" font-size="22">Aug 2026</text><text x="25" y="112" fill="#fff" font-size="27" font-weight="700">Service providers</text><text x="25" y="158" fill="#a9c1cc" font-size="19">Build delivery capacity</text></g><g transform="translate(1235 270)"><rect width="250" height="370" rx="18" fill="url(#g)"/><text x="25" y="60" fill="#fff4df" font-size="22">Sep 2026</text><text x="25" y="115" fill="white" font-size="25" font-weight="700">Startup support</text><text x="25" y="150" fill="white" font-size="25" font-weight="700">plan</text><text x="25" y="198" fill="#fff0db" font-size="19">Expand startup supply</text><circle cx="125" cy="280" r="50" fill="#fff" opacity=".16"/></g></g><text x="115" y="730" fill="#d9e5e8" font-size="27" font-family="Arial">Strategy → Infrastructure → Products → Delivery → Startups</text><text x="115" y="780" fill="#e9b867" font-size="23" font-family="Arial">The question shifts from “Do we have AI?” to “Who brings AI into industry?”</text></svg>
