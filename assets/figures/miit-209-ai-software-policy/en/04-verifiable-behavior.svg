 font-weight="700" fill="#202B3B">Who accepts the</text><text x="1420.00" y="490.40" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#202B3B">business result?</text><text x="1420.00" y="600.00" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#596575">Review and business</text><text x="1420.00" y="635.50" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#596575">judgment</text><path d="M72 695L1728 695" fill="none" stroke="#B58A3A" stroke-width="3"/><text x="72.00" y="765.92" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="34" font-weight="700" fill="#9B2229">Before recovery or retry</text><text x="680.00" y="759.64" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="400" fill="#202B3B">Does the same task and state remain continuous?</text><text x="680.00" y="832.64" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="400" fill="#202B3B">Is authorization still valid?</text><text x="680.00" y="905.64" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="400" fill="#202B3B">Did an external effect occur, and is retry safe?</text><text x="72.00" y="993.00" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#596575">A model’s explanation is not proof of effects; execution is not business acceptance.</text></svg>