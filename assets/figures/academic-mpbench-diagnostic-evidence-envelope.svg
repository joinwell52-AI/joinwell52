<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Diagnostic evidence envelope</title>
  <desc id="desc">Four layers separate immutable trace facts, plural failure hypotheses, consensus and salience, and one governed repair decision.</desc>
  <rect width="1400" height="760" rx="36" fill="#0f1526"/>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="110" y="540" width="1180" height="130" rx="24" fill="#1b2742" stroke="#8198ef" stroke-width="3"/>
    <text x="155" y="590" fill="#eef2ff" font-size="30" font-weight="700">1 · Trace Facts</text>
    <text x="155" y="630" fill="#aeb9d8" font-size="23">immutable actions · tool outputs · receipts · timestamps</text>

    <rect x="180" y="360" width="1040" height="140" rx="24" fill="#22213c" stroke="#a58be8" stroke-width="3"/>
    <text x="225" y="410" fill="#eef2ff" font-size="30" font-weight="700">2 · Failure Hypotheses</text>
    <text x="225" y="452" fill="#bdb2d9" font-size="23">several causal explanations · rationale · perspective · provenance</text>
    <circle cx="1010" cy="425" r="23" fill="#f4bf65"/><circle cx="1075" cy="425" r="18" fill="#8da7ff"/><circle cx="1135" cy="425" r="14" fill="#a785e8"/>

    <rect x="250" y="205" width="900" height="115" rx="24" fill="#173238" stroke="#70e6d0" stroke-width="3"/>
    <text x="295" y="252" fill="#eef2ff" font-size="30" font-weight="700">3 · Consensus / Salience</text>
    <text x="295" y="290" fill="#a8d5cf" font-size="23">rank attention without pretending agreement = independent proof</text>

    <rect x="420" y="70" width="560" height="95" rx="24" fill="#273329" stroke="#a5e079" stroke-width="3"/>
    <text x="465" y="118" fill="#eef2ff" font-size="30" font-weight="700">4 · Governed Repair Decision</text>
    <text x="465" y="150" fill="#c9deb9" font-size="21">one bounded action can coexist with plural diagnosis</text>

    <g stroke="#8796ba" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M700 540V500"/><path d="M700 360V320"/><path d="M700 205V165"/>
    </g>
  </g>
</svg>
