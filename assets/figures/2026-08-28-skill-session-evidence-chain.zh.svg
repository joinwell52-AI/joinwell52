<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">技能已经生效至少包含四种不同事实</title>
  <desc id="desc">配置存在、会话装载、调用发生、结果验证四层事实各有独立证据；V2.1.2 以 SessionStore 核验补齐普通调用的持久会话归属，不替代结果验证。</desc>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfaf7"/><stop offset="1" stop-color="#f0f4fb"/></linearGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#122a50" flood-opacity="0.12"/></filter>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#7c3aed"/></marker>
    <style>
      text { font-family:'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; fill:#17263e; }
      .h1 { font-size:42px; font-weight:700; }
      .sub { font-size:21px; fill:#52657d; }
      .num { font-size:22px; font-weight:800; }
      .cardh { font-size:27px; font-weight:750; }
      .label { font-size:19px; font-weight:700; }
      .body { font-size:18px; fill:#4d6178; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg3)"/>
  <text x="80" y="84" class="h1">“技能已经生效”至少包含四种不同事实</text>
  <text x="80" y="124" class="sub">每一层只能证明本层；文件存在不能替会话绑定作证，调用完成也不能替工程结果作证。</text>

  <line x1="325" y1="420" x2="470" y2="420" stroke="#7c3aed" stroke-width="5" marker-end="url(#arrow3)"/>
  <line x1="705" y1="420" x2="850" y2="420" stroke="#7c3aed" stroke-width="5" marker-end="url(#arrow3)"/>
  <line x1="1085" y1="420" x2="1230" y2="420" stroke="#7c3aed" stroke-width="5" marker-end="url(#arrow3)"/>

  <g filter="url(#shadow3)">
    <rect x="70" y="210" width="280" height="420" rx="28" fill="#ffffff" stroke="#9ec5ff" stroke-width="2"/>
    <circle cx="120" cy="260" r="26" fill="#e8f2ff"/><text x="120" y="268" text-anchor="middle" class="num" fill="#155eef">1</text>
    <text x="105" y="330" class="cardh">配置存在</text>
    <rect x="105" y="370" width="210" height="54" rx="16" fill="#edf5ff"/>
    <text x="210" y="404" text-anchor="middle" class="label" fill="#155eef">证据：文件 / 注册项</text>
    <text x="105" y="478" class="body">能证明：</text>
    <text x="105" y="510" class="body">能力可以被发现</text>
    <text x="105" y="560" class="body">不能证明：</text>
    <text x="105" y="592" class="body">已进入本次会话</text>
  </g>

  <g filter="url(#shadow3)">
    <rect x="450" y="210" width="280" height="420" rx="28" fill="#ffffff" stroke="#9ec5ff" stroke-width="2"/>
    <circle cx="500" cy="260" r="26" fill="#e8f2ff"/><text x="500" y="268" text-anchor="middle" class="num" fill="#155eef">2</text>
    <text x="485" y="330" class="cardh">会话装载</text>
    <rect x="485" y="370" width="210" height="54" rx="16" fill="#edf5ff"/>
    <text x="590" y="404" text-anchor="middle" class="label" fill="#155eef">证据：启动上下文</text>
    <text x="485" y="478" class="body">能证明：</text>
    <text x="485" y="510" class="body">当前 session 已装载</text>
    <text x="485" y="560" class="body">不能证明：</text>
    <text x="485" y="592" class="body">技能真实被调用</text>
  </g>

  <g filter="url(#shadow3)">
    <rect x="830" y="180" width="280" height="510" rx="28" fill="#ffffff" stroke="#b69cf8" stroke-width="3"/>
    <circle cx="880" cy="230" r="26" fill="#f0eaff"/><text x="880" y="238" text-anchor="middle" class="num" fill="#7c3aed">3</text>
    <text x="865" y="300" class="cardh">调用发生</text>
    <rect x="865" y="340" width="210" height="54" rx="16" fill="#f3edff"/>
    <text x="970" y="374" text-anchor="middle" font-size="17" font-weight="700" fill="#7c3aed">证据：invocation event</text>
    <text x="865" y="448" class="body">有上下文时核验并保存：</text>
    <text x="865" y="480" class="body">task · thread · session</text>
    <rect x="865" y="520" width="210" height="84" rx="16" fill="#fff2dc" stroke="#f59e0b"/>
    <text x="970" y="554" text-anchor="middle" class="label" fill="#b96500">V2.1.2 已实现</text>
    <text x="970" y="583" text-anchor="middle" class="body" fill="#8c5200">可信 session 持久绑定</text>
    <text x="865" y="650" class="body">不能证明：建议正确</text>
  </g>

  <g filter="url(#shadow3)">
    <rect x="1210" y="210" width="320" height="420" rx="28" fill="#ffffff" stroke="#e1bf68" stroke-width="2"/>
    <circle cx="1260" cy="260" r="26" fill="#fff5d8"/><text x="1260" y="268" text-anchor="middle" class="num" fill="#9a6800">4</text>
    <text x="1245" y="330" class="cardh">结果验证</text>
    <rect x="1245" y="370" width="250" height="54" rx="16" fill="#fff7e5"/>
    <text x="1370" y="404" text-anchor="middle" class="label" fill="#9a6800">证据：测试 / REVIEW / EVAL</text>
    <text x="1245" y="478" class="body">能证明：</text>
    <text x="1245" y="510" class="body">具体工程结论成立</text>
    <text x="1245" y="560" class="body">不能由：</text>
    <text x="1245" y="592" class="body">调用日志单独推出</text>
  </g>

  <rect x="70" y="735" width="1460" height="94" rx="22" fill="#17263e"/>
  <text x="105" y="778" font-size="22" font-weight="700" style="fill:#ffffff">独立 QA C1：task / thread / session 三键匹配 3/3；SessionStore 绑定与记录完整性验证均通过。</text>
  <text x="105" y="810" font-size="18" style="fill:#cbd7e8">已核验调用归属 ≠ 建议正确 ≠ 任务完成；历史缺失不会被猜测回填。</text>
</svg>
