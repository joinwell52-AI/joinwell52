<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="t d">
<title id="t">Proposal horizon and commitment horizon</title><desc id="d">A conceptual diagram showing a multi-step provisional route, one-step commitment, boundary evidence, Retain Insert Replace decisions, and a separate effect authority gate.</desc>
<rect width="1440" height="900" fill="#f7f9fc"/>
<text x="90" y="92" fill="#102038" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="38" font-weight="700">Proposal Horizon ≠ Commitment Horizon</text>
<text x="90" y="132" fill="#53657a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">Research Center synthesis grounded in TROVE's provisional-route and one-step-commitment mechanism</text>
<g transform="translate(90 205)" font-family="Inter,Segoe UI,Arial,sans-serif">
<text x="0" y="0" fill="#53657a" font-size="18" font-weight="700">PROVISIONAL ROUTE</text>
<path d="M0 70H1100" stroke="#9aa8b8" stroke-width="5" stroke-dasharray="14 12"/>
<g fill="#ffffff" stroke="#73869b" stroke-width="3"><rect x="20" y="32" width="160" height="76" rx="18"/><rect x="245" y="32" width="160" height="76" rx="18"/><rect x="470" y="32" width="160" height="76" rx="18"/><rect x="695" y="32" width="160" height="76" rx="18"/><rect x="920" y="32" width="160" height="76" rx="18"/></g>
<g fill="#26394f" font-size="20" text-anchor="middle"><text x="100" y="80">Skill 1</text><text x="325" y="80">Skill 2</text><text x="550" y="80">Skill 3</text><text x="775" y="80">Skill 4</text><text x="1000" y="80">…</text></g>
<rect x="12" y="24" width="176" height="92" rx="22" fill="none" stroke="#1f9ec2" stroke-width="7"/><text x="100" y="145" fill="#167d9a" font-size="17" text-anchor="middle" font-weight="700">COMMIT ONE TOP-LEVEL SKILL</text>
<path d="M100 165V245" stroke="#1f9ec2" stroke-width="5"/><path d="M85 230l15 28 15-28z" fill="#1f9ec2"/>
<rect x="0" y="260" width="390" height="115" rx="22" fill="#e8f7fb" stroke="#1f9ec2" stroke-width="3"/><text x="28" y="300" fill="#143b4a" font-size="20" font-weight="700">Boundary Evidence</text><text x="28" y="334" fill="#31576a" font-size="17">status · artifacts · completion · no-progress signals</text><text x="28" y="360" fill="#31576a" font-size="17">bind outcome to the executed prefix</text>
<path d="M390 318H505" stroke="#62778e" stroke-width="4"/><path d="M490 304l28 14-28 14z" fill="#62778e"/>
<rect x="520" y="240" width="320" height="155" rx="22" fill="#ffffff" stroke="#62778e" stroke-width="3"/><text x="550" y="282" fill="#26394f" font-size="20" font-weight="700">Pending continuation</text><text x="550" y="320" fill="#31576a" font-size="18">Retain — still valid</text><text x="550" y="350" fill="#31576a" font-size="18">Insert — local repair</text><text x="550" y="380" fill="#31576a" font-size="18">Replace — invalid suffix</text>
<path d="M840 318H960" stroke="#62778e" stroke-width="4"/><path d="M945 304l28 14-28 14z" fill="#62778e"/>
<rect x="975" y="240" width="280" height="155" rx="22" fill="#eefbf5" stroke="#35a273" stroke-width="3"/><text x="1005" y="282" fill="#1f5a42" font-size="20" font-weight="700">Next commitment</text><text x="1005" y="320" fill="#356752" font-size="18">freshly admitted unit</text><text x="1005" y="350" fill="#356752" font-size="18">future suffix stays provisional</text>
<path d="M1115 395V480" stroke="#35a273" stroke-width="5"/><path d="M1100 465l15 28 15-28z" fill="#35a273"/>
<rect x="845" y="500" width="410" height="145" rx="22" fill="#fff7e9" stroke="#d9962b" stroke-width="3"/><text x="875" y="540" fill="#775114" font-size="20" font-weight="700">Separate Effect Authority</text><text x="875" y="575" fill="#775c30" font-size="17">route valid ≠ call authorized</text><text x="875" y="603" fill="#775c30" font-size="17">authorization · idempotency · provider receipt</text><text x="875" y="628" fill="#775c30" font-size="17">remain independent gates</text>
<rect x="0" y="500" width="700" height="145" rx="22" fill="#f1f4f8" stroke="#a7b2c0" stroke-width="2"/><text x="28" y="540" fill="#33465b" font-size="20" font-weight="700">Preserve completed work</text><text x="28" y="575" fill="#53657a" font-size="17">Executed prefix and artifacts survive route revision.</text><text x="28" y="604" fill="#53657a" font-size="17">Only the unresolved continuation is retained, inserted into, replaced or pruned.</text>
</g>
<text x="90" y="844" fill="#687b90" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">TROVE supports provisional routes and one-step commitment; the Effect Authority gate is a separate Research Center governance boundary.</text>
</svg>