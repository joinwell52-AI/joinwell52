<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="t d"><title id="t">Four-boundary prospective-intention runtime</title><desc id="d">Versioned intention state feeds observation policy, due and action admission, and effect evidence. Active is explicitly distinct from due.</desc><rect width="1400" height="820" rx="30" fill="#08111f"/><text x="90" y="90" fill="#eef7ff" font-family="Inter,Segoe UI,Arial" font-size="42" font-weight="700">Prospective Intention Runtime</text><text x="90" y="132" fill="#91b9cc" font-family="Inter,Segoe UI,Arial" font-size="22">Research Center synthesis · PM-Bench evidence does not itself propose this architecture</text><g font-family="Inter,Segoe UI,Arial"><g transform="translate(90 205)"><rect width="280" height="360" rx="24" fill="#10253a" stroke="#66dff3" stroke-width="2"/><text x="28" y="58" fill="#a8f1ff" font-size="27" font-weight="700">1 · INTENTION STATE</text><text x="28" y="105" fill="#e8f3f8" font-size="20"><tspan x="28" dy="0">id + version</tspan><tspan x="28" dy="35">active / cancelled</tspan><tspan x="28" dy="35">superseded / completed</tspan><tspan x="28" dy="35">trigger + timezone</tspan><tspan x="28" dy="35">dependencies</tspan></text></g><g transform="translate(405 205)"><rect width="280" height="360" rx="24" fill="#10253a" stroke="#66dff3" stroke-width="2"/><text x="28" y="58" fill="#a8f1ff" font-size="27" font-weight="700">2 · OBSERVATION</text><text x="28" y="105" fill="#e8f3f8" font-size="20"><tspan x="28" dy="0">event or poll?</tspan><tspan x="28" dy="35">which channel?</tspan><tspan x="28" dy="35">freshness?</tspan><tspan x="28" dy="35">monitoring cost?</tspan><tspan x="28" dy="35">evidence receipt</tspan></text></g><g transform="translate(720 205)"><rect width="280" height="360" rx="24" fill="#10253a" stroke="#66dff3" stroke-width="2"/><text x="28" y="58" fill="#a8f1ff" font-size="27" font-weight="700">3 · DUE / ADMIT</text><text x="28" y="105" fill="#e8f3f8" font-size="20"><tspan x="28" dy="0">latest version?</tspan><tspan x="28" dy="35">active now?</tspan><tspan x="28" dy="35">trigger satisfied?</tspan><tspan x="28" dy="35">deps satisfied?</tspan><tspan x="28" dy="35">not already done?</tspan></text><text x="28" y="308" fill="#ffcf7a" font-size="23" font-weight="700">ACTIVE ≠ DUE</text></g><g transform="translate(1035 205)"><rect width="280" height="360" rx="24" fill="#10253a" stroke="#66dff3" stroke-width="2"/><text x="28" y="58" fill="#a8f1ff" font-size="27" font-weight="700">4 · EFFECT</text><text x="28" y="105" fill="#e8f3f8" font-size="20"><tspan x="28" dy="0">provider result</tspan><tspan x="28" dy="35">effect identity</tspan><tspan x="28" dy="35">intention version</tspan><tspan x="28" dy="35">completion receipt</tspan><tspan x="28" dy="35">retry boundary</tspan></text></g></g><g stroke="#7be7fa" stroke-width="5" fill="none"><path d="M370 385H405"/><path d="M685 385H720"/><path d="M1000 385H1035"/></g><g fill="#7be7fa"><path d="M398 373l18 12-18 12z"/><path d="M713 373l18 12-18 12z"/><path d="M1028 373l18 12-18 12z"/></g><rect x="250" y="640" width="900" height="92" rx="46" fill="#10283c" stroke="#4fc8df"/><text x="700" y="679" text-anchor="middle" fill="#dff8ff" font-family="Inter,Segoe UI,Arial" font-size="24" font-weight="700">MEMORY HELPS RETRIEVAL · RUNTIME GOVERNS FUTURE AUTHORITY</text><text x="700" y="713" text-anchor="middle" fill="#93c5d6" font-family="Inter,Segoe UI,Arial" font-size="19">Preserve history; execute only the latest valid intention against current evidence.</text></svg>