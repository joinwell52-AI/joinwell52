<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Saying a skill is active contains at least four different facts</title>
  <desc id="desc">Configuration presence, session loading, invocation, and result verification require independent evidence. V2.1.2 adds SessionStore verification for persistent session attribution of ordinary invocations; it does not replace result verification.</desc>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfaf7"/><stop offset="1" stop-color="#f0f4fb"/></linearGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#122a50" flood-opacity="0.12"/></filter>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#7c3aed"/></marker>
    <style>
      text { font-family:Arial,sans-serif; fill:#17263e; }
      .h1 { font-size:42px; font-weight:700; }
      .sub { font-size:21px; fill:#52657d; }
      .num { font-size:22px; font-weight:800; }
      .cardh { font-size:27px; font-weight:750; }
      .label { font-size:19px; font-weight:700; }
      .body { font-size:18px; fill:#4d6178; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg3)"/>
  <text x="80" y="84" class="h1">“The skill is active” contains at least four different facts</text>
  <text x="80" y="124" class="sub">Each layer proves only itself: file presence cannot prove session binding, and invocation cannot prove engineering correctness.</text>

  <line x1="325" y1="420" x2="470" y2="420" stroke="#7c3aed" stroke-width="5" marker-end="url(#arrow3)"/>
  <line x1="705" y1="420" x2="850" y2="420" stroke="#7c3aed" stroke-width="5" marker-end="url(#arrow3)"/>
  <line x1="1085" y1="420" x2="1230" y2="420" stroke="#7c3aed" stroke-width="5" marker-end="url(#arrow3)"/>

  <g filter="url(#shadow3)">
    <rect x="70" y="210" width="280" height="420" rx="28" fill="#ffffff" stroke="#9ec5ff" stroke-width="2"/>
    <circle cx="120" cy="260" r="26" fill="#e8f2ff"/><text x="120" y="268" text-anchor="middle" class="num" fill="#155eef">1</text>
    <text x="105" y="330" class="cardh">Config exists</text>
    <rect x="105" y="370" width="210" height="54" rx="16" fill="#edf5ff"/>
    <text x="210" y="404" text-anchor="middle" class="label" fill="#155eef">Evidence: file / registry</text>
    <text x="105" y="478" class="body">Can prove:</text><text x="105" y="510" class="body">capability is discoverable</text>
    <text x="105" y="560" class="body">Cannot prove:</text><text x="105" y="592" class="body">loaded into this session</text>
  </g>

  <g filter="url(#shadow3)">
    <rect x="450" y="210" width="280" height="420" rx="28" fill="#ffffff" stroke="#9ec5ff" stroke-width="2"/>
    <circle cx="500" cy="260" r="26" fill="#e8f2ff"/><text x="500" y="268" text-anchor="middle" class="num" fill="#155eef">2</text>
    <text x="485" y="330" class="cardh">Session loaded</text>
    <rect x="485" y="370" width="210" height="54" rx="16" fill="#edf5ff"/>
    <text x="590" y="404" text-anchor="middle" class="label" fill="#155eef">Evidence: start context</text>
    <text x="485" y="478" class="body">Can prove:</text><text x="485" y="510" class="body">current session loaded</text>
    <text x="485" y="560" class="body">Cannot prove:</text><text x="485" y="592" class="body">skill was invoked</text>
  </g>

  <g filter="url(#shadow3)">
    <rect x="830" y="180" width="280" height="510" rx="28" fill="#ffffff" stroke="#b69cf8" stroke-width="3"/>
    <circle cx="880" cy="230" r="26" fill="#f0eaff"/><text x="880" y="238" text-anchor="middle" class="num" fill="#7c3aed">3</text>
    <text x="865" y="300" class="cardh">Invocation happened</text>
    <rect x="865" y="340" width="210" height="54" rx="16" fill="#f3edff"/>
    <text x="970" y="374" text-anchor="middle" font-size="17" font-weight="700" fill="#7c3aed">Evidence: invocation event</text>
    <text x="865" y="448" class="body">With context, verify &amp; persist:</text>
    <text x="865" y="480" class="body">task · thread · session</text>
    <rect x="865" y="520" width="210" height="84" rx="16" fill="#fff2dc" stroke="#f59e0b"/>
    <text x="970" y="554" text-anchor="middle" class="label" fill="#b96500">Implemented in V2.1.2</text>
    <text x="970" y="583" text-anchor="middle" class="body" fill="#8c5200">verified session binding</text>
    <text x="865" y="650" class="body">Cannot prove: advice correct</text>
  </g>

  <g filter="url(#shadow3)">
    <rect x="1210" y="210" width="320" height="420" rx="28" fill="#ffffff" stroke="#e1bf68" stroke-width="2"/>
    <circle cx="1260" cy="260" r="26" fill="#fff5d8"/><text x="1260" y="268" text-anchor="middle" class="num" fill="#9a6800">4</text>
    <text x="1245" y="330" class="cardh">Result verified</text>
    <rect x="1245" y="370" width="250" height="54" rx="16" fill="#fff7e5"/>
    <text x="1370" y="404" text-anchor="middle" class="label" fill="#9a6800">Evidence: tests / REVIEW / EVAL</text>
    <text x="1245" y="478" class="body">Can prove:</text><text x="1245" y="510" class="body">specific engineering claim</text>
    <text x="1245" y="560" class="body">Cannot be inferred from:</text><text x="1245" y="592" class="body">invocation log alone</text>
  </g>

  <rect x="70" y="735" width="1460" height="94" rx="22" fill="#17263e"/>
  <text x="105" y="778" font-size="22" font-weight="700" style="fill:#ffffff">Independent QA C1: task / thread / session matched 3/3; SessionStore binding and record-integrity verification both passed.</text>
  <text x="105" y="810" font-size="18" style="fill:#cbd7e8">Verified invocation attribution ≠ correct advice ≠ completed task; historical missing identity is not guessed back into place.</text>
</svg>
