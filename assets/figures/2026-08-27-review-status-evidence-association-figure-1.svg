<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc">
  <title id="title">十条 REPORT 关联记录的固定分类</title>
  <desc id="desc">十条脱敏记录中，四条 linked、四条 missing、两条 conflict。分类只使用动作日志与账本中的显式任务键。</desc>
  <style>
    .bg{fill:#fbfaf7}.title{font:600 31px 'Microsoft YaHei','Noto Sans SC',Arial,sans-serif;fill:#102a43}.sub{font:400 17px 'Microsoft YaHei','Noto Sans SC',Arial,sans-serif;fill:#526577}.k{font:600 19px 'Microsoft YaHei','Noto Sans SC',Arial,sans-serif;fill:#102a43}.en{font:400 14px Arial,sans-serif;fill:#526577}.mono{font:500 18px Consolas,'Courier New',monospace;fill:#102a43}.small{font:400 14px 'Microsoft YaHei','Noto Sans SC',Arial,sans-serif;fill:#526577}.linked{fill:#e6f8fb;stroke:#1695b7;stroke-width:3}.missing{fill:#fff3dc;stroke:#d9901f;stroke-width:3}.conflict{fill:#f1eaff;stroke:#7551bd;stroke-width:3}.neutral{fill:#f4f7f9;stroke:#bac7d0;stroke-width:2}
  </style>
  <rect class="bg" width="1600" height="840"/>
  <text class="title" x="90" y="72">十条 REPORT 关联记录：位置不是归属证明</text>
  <text class="sub" x="90" y="105">Ten de-identified records — classify explicit task keys, never infer from names or time</text>
  <rect x="90" y="142" rx="16" ry="16" width="1420" height="78" class="neutral"/>
  <text class="mono" x="126" y="188">action.task_id = ledger.task_id → linked</text>
  <text class="mono" x="640" y="188">action.task_id missing → missing</text>
  <text class="mono" x="1090" y="188">two keys differ → conflict</text>
  <text class="k" x="90" y="267">固定十条样本 / Fixed ten-record slice</text>
  <g>
    <rect x="90" y="295" rx="18" ry="18" width="250" height="132" class="linked"/><text class="mono" x="118" y="337">R01  T01 = T01</text><text class="k" x="118" y="379">linked / 可直接关联</text>
    <rect x="370" y="295" rx="18" ry="18" width="250" height="132" class="conflict"/><text class="mono" x="398" y="337">R02  T02 ≠ T04</text><text class="k" x="398" y="379">conflict / 保留两边</text>
    <rect x="650" y="295" rx="18" ry="18" width="250" height="132" class="conflict"/><text class="mono" x="678" y="337">R03  T02 ≠ T03</text><text class="k" x="678" y="379">conflict / 保留两边</text>
    <rect x="930" y="295" rx="18" ry="18" width="250" height="132" class="missing"/><text class="mono" x="958" y="337">R04  — / T02</text><text class="k" x="958" y="379">missing / 不补猜</text>
    <rect x="1210" y="295" rx="18" ry="18" width="250" height="132" class="linked"/><text class="mono" x="1238" y="337">R05  T01 = T01</text><text class="k" x="1238" y="379">linked / 可直接关联</text>
    <rect x="90" y="455" rx="18" ry="18" width="250" height="132" class="missing"/><text class="mono" x="118" y="497">R06  — / T04</text><text class="k" x="118" y="539">missing / 不补猜</text>
    <rect x="370" y="455" rx="18" ry="18" width="250" height="132" class="missing"/><text class="mono" x="398" y="497">R07  — / T03</text><text class="k" x="398" y="539">missing / 不补猜</text>
    <rect x="650" y="455" rx="18" ry="18" width="250" height="132" class="linked"/><text class="mono" x="678" y="497">R08  T01 = T01</text><text class="k" x="678" y="539">linked / 可直接关联</text>
    <rect x="930" y="455" rx="18" ry="18" width="250" height="132" class="missing"/><text class="mono" x="958" y="497">R09  — / T09</text><text class="k" x="958" y="539">missing / 不补猜</text>
    <rect x="1210" y="455" rx="18" ry="18" width="250" height="132" class="linked"/><text class="mono" x="1238" y="497">R10  T08 = T08</text><text class="k" x="1238" y="539">linked / 可直接关联</text>
  </g>
  <text class="k" x="90" y="650">汇总 / Reproducible result</text>
  <rect x="90" y="678" width="552" height="42" fill="#1695b7"/><rect x="642" y="678" width="552" height="42" fill="#d9901f"/><rect x="1194" y="678" width="276" height="42" fill="#7551bd"/>
  <text class="k" x="90" y="757">4 linked</text><text class="k" x="642" y="757">4 missing</text><text class="k" x="1194" y="757">2 conflict</text>
  <text class="small" x="90" y="807">来源：候选公开证据包 R2｜这是固定历史切片，不是故障率、报告真实性或业务验收统计。</text>
</svg>
