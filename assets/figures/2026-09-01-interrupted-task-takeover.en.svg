<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><title>Takeover eligibility</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#3263c4"/></marker></defs><rect width="1600" height="1000" fill="#f6f8fd"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="70" y="67" fill="#163c84" font-size="39" font-weight="700"><tspan x="70" dy="0">After interruption: establish takeover eligibility</tspan></text><text x="70" y="110" fill="#637186" font-size="23" font-weight="400"><tspan x="70" dy="0">Frozen-contract summary · not an implemented product flow</tspan></text><rect x="70" y="155" width="780" height="138" rx="18" fill="#fff" stroke="#d3dce8" stroke-width="2"/><text x="100" y="197" fill="#173e87" font-size="29" font-weight="700"><tspan x="100" dy="0">Technical interruption of the same TASK</tspan></text><text x="100" y="246" fill="#19334f" font-size="25" font-weight="400"><tspan x="100" dy="0">First check: live external work / valid prior owner</tspan></text><path d="M850 225H1000" fill="none" stroke="#3263c4" stroke-width="3"  marker-end="url(#arrow)"/><rect x="1020" y="155" width="510" height="138" rx="18" fill="#fff4df" stroke="#e1b35d" stroke-width="2"/><text x="1050" y="197" fill="#895b0c" font-size="30" font-weight="700"><tspan x="1050" dy="0">not_admitted</tspan></text><text x="1050" y="243" fill="#19334f" font-size="21" font-weight="400"><tspan x="1050" dy="0">If either holds: retain owner; no successor</tspan></text><path d="M455 293V345" fill="none" stroke="#3263c4" stroke-width="3"  marker-end="url(#arrow)"/><rect x="70" y="360" width="780" height="122" rx="18" fill="#eaf1ff" stroke="#8eafe5" stroke-width="2"/><text x="100" y="404" fill="#173e87" font-size="27" font-weight="700"><tspan x="100" dy="0">Ownership released → resolve trusted effect facts</tspan></text><text x="100" y="447" fill="#19334f" font-size="23" font-weight="400"><tspan x="100" dy="0">Unknown, missing, or unreadable does not mean absent</tspan></text><text x="1000" y="393" fill="#667588" font-size="24" font-weight="400"><tspan x="1000" dy="0">Normal authorized rework / reassign</tspan><tspan x="1000" dy="35.519999999999996">and new-round retry keep their path</tspan><tspan x="1000" dy="35.519999999999996">No interruption case is created</tspan></text><path d="M455 482V523H292V568" fill="none" stroke="#3263c4" stroke-width="3"  marker-end="url(#arrow)"/><path d="M455 523H800V568" fill="none" stroke="#3263c4" stroke-width="3"  marker-end="url(#arrow)"/><path d="M800 523H1300V568" fill="none" stroke="#3263c4" stroke-width="3"  marker-end="url(#arrow)"/><rect x="70" y="585" width="460" height="225" rx="18" fill="#eaf1ff" stroke="#8eafe5" stroke-width="2"/><text x="94" y="625" fill="#194ca0" font-size="29" font-weight="700"><tspan x="94" dy="0">reexecute</tspan></text><text x="94" y="669" fill="#19334f" font-size="19" font-weight="400"><tspan x="94" dy="0">Effect confirmed absent</tspan><tspan x="94" dy="28.12">none: recovery authority + ownership</tspan><tspan x="94" dy="28.12">single: also binding + operation authority</tspan><tspan x="94" dy="28.12">Operation checks at the actual tool call</tspan></text><rect x="570" y="585" width="460" height="225" rx="18" fill="#f1edfa" stroke="#b6a2d6" stroke-width="2"/><text x="594" y="625" fill="#67459d" font-size="29" font-weight="700"><tspan x="594" dy="0">reconcile_only</tspan></text><text x="594" y="669" fill="#19334f" font-size="19" font-weight="400"><tspan x="594" dy="0">Effect confirmed present</tspan><tspan x="594" dy="28.12">Reconcile and record existing results</tspan><tspan x="594" dy="28.12">Do not repeat the original action</tspan><tspan x="594" dy="28.12">Controlled completion can resolve case</tspan></text><rect x="1070" y="585" width="460" height="225" rx="18" fill="#fff5e5" stroke="#e1b35d" stroke-width="2"/><text x="1094" y="625" fill="#895b0c" font-size="29" font-weight="700"><tspan x="1094" dy="0">hold_for_review</tspan></text><text x="1094" y="669" fill="#19334f" font-size="19" font-weight="400"><tspan x="1094" dy="0">Effect unknown / unsupported evidence</tspan><tspan x="1094" dy="28.12">Block automatic re-execution</tspan><tspan x="1094" dy="28.12">PM/ADMIN acts within existing authority</tspan><tspan x="1094" dy="28.12">Explicit re-admission; observers do not wake</tspan></text><rect x="70" y="853" width="1460" height="85" rx="18" fill="#fff" stroke="#d3dce8" stroke-width="2"/><text x="96" y="888" fill="#19334f" font-size="23" font-weight="400"><tspan x="96" dy="0">Separate fencing event: reject late old-owner finalization without superseding the current recovery disposition.</tspan></text><text x="96" y="920" fill="#6b7587" font-size="19" font-weight="400"><tspan x="96" dy="0">Source: RUN-002 RA-7/RA-8 + frozen contract Rev.2. The study does not establish production duplicate effects.</tspan></text></g></svg>
