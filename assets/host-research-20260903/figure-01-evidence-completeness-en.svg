Type exports</text><rect x="920" y="284" width="370" height="115" rx="18" fill="#edf3ff" stroke="#c6d7fb" stroke-width="2"/><text x="945" y="326" font-size="23" font-weight="700" text-anchor="start" fill="#1451d8">03</text><text x="945" y="371" font-size="32" font-weight="600" text-anchor="start" fill="#10234b">Agent listing</text><rect x="1330" y="284" width="370" height="115" rx="18" fill="#edf3ff" stroke="#c6d7fb" stroke-width="2"/><text x="1355" y="326" font-size="23" font-weight="700" text-anchor="start" fill="#1451d8">04</text><text x="1355" y="371" font-size="32" font-weight="600" text-anchor="start" fill="#10234b">Live send</text><text x="92" y="463" font-size="23" font-weight="600" text-anchor="start" fill="#52627b">Results actually returned</text><rect x="100" y="496" width="390" height="220" rx="18" fill="#f6f8fc" stroke="#cad6e8" stroke-width="2"/><text x="295" y="574" font-size="66" font-weight="700" text-anchor="middle" fill="#1451d8">[ ]</text><text x="295" y="632" font-size="32" font-weight="600" text-anchor="middle" fill="#10234b">Empty array</text><text x="295" y="678" font-size="26" font-weight="400" text-anchor="middle" fill="#52627b">Completed: 0 / 4</text><path d="M510,604 H650" stroke="#1451d8" stroke-width="5" fill="none" marker-end="url(#blueArrow)" stroke-linejoin="round"/><rect x="680" y="496" width="490" height="220" rx="18" fill="#edf3ff" stroke="#bfd2fa" stroke-width="2"/><text x="925" y="553" font-size="29" font-weight="600" text-anchor="middle" fill="#10234b">Aggregation searches for</text><text x="925" y="605" font-size="35" font-weight="700" text-anchor="middle" fill="#1451d8">FAIL  /  BLOCKED</text><text x="925" y="660" font-size="27" font-weight="400" text-anchor="middle" fill="#10234b">Neither found → PASS</text><path d="M1190,604 H1300" stroke="#1451d8" stroke-width="5" fill="none" marker-end="url(#blueArrow)" stroke-linejoin="round"/><rect x="1330" y="496" width="370" height="220" rx="18" fill="#e8f5ee" stroke="#92c4a9" stroke-