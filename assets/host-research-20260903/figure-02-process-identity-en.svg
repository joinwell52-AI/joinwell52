6" stroke="#cad6e8" stroke-width="3" fill="none"/><text x="132" y="621" font-size="24" font-weight="700" text-anchor="start" fill="#b76318">Process created after the old record</text><text x="132" y="665" font-size="23" font-weight="700" text-anchor="start" fill="#b76318">→ Not the original executor from 2000</text><path d="M690,465 H750 V339 H850" stroke="#1451d8" stroke-width="5" fill="none" marker-end="url(#blueArrow)" stroke-linejoin="round"/><path d="M750,465 V598 H850" stroke="#7651bd" stroke-width="5" fill="none" marker-end="url(#purpleArrow)" stroke-linejoin="round"/><rect x="880" y="240" width="820" height="211" rx="18" fill="#f7f9fd" stroke="#cad6e8" stroke-width="2"/><text x="912" y="291" font-size="29" font-weight="700" text-anchor="start" fill="#10234b">Approval record read path</text><text x="912" y="344" font-size="25" font-weight="400" text-anchor="start" fill="#52627b">Same PID skips death check; no generation comparison</text><text x="912" y="405" font-size="35" font-weight="700" text-anchor="start" fill="#b76318">Remains executing</text><rect x="880" y="490" width="820" height="211" rx="18" fill="#f4f0fc" stroke="#d7c9ed" stroke-width="2"/><text x="912" y="542" font-size="29" font-weight="700" text-anchor="start" fill="#7651bd">Existing writer-lock function (legacy format)</text><text x="912" y="595" font-size="25" font-weight="400" text-anchor="start" fill="#52627b">OS creation time is later than synthetic acquired_at</text><text x="912" y="656" font-size="35" font-weight="700" text-anchor="start" fill="#7651bd">Recognized as stale</text><rect x="100" y="753" width="1600" height="100" rx="15" fill="#fff2e5" stroke="#efd1af" stroke-width="2"/><text x="136" y="798" font-size="34" font-weight="700" text-anchor="start" fill="#b76318">Identity mismatch ≠ effect absent ≠ retry authorized</text><text x="136" y="833" font-size="24" font-weight="400" text-anchor="start" fill="#52627b">Even after identifying a stale owner, inspect effect facts and current 