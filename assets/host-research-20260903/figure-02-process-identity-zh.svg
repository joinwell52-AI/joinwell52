<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1020" viewBox="0 0 1800 1020"><defs><marker id="blueArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#1451d8" stroke-width="2"/></marker><marker id="purpleArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#7651bd" stroke-width="2"/></marker><marker id="amberArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#b76318" stroke-width="2"/></marker></defs><rect width="1800" height="1020" fill="#f7f9fd"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="38" y="34" width="1724" height="952" rx="24" fill="#ffffff" stroke="#e0e7f1" stroke-width="2"/><text x="90" y="113" font-size="50" font-weight="700" text-anchor="start" fill="#10234b">进程号相同，不代表执行者身份连续</text><text x="92" y="165" font-size="26" font-weight="400" text-anchor="start" fill="#52627b">CodeFlowMu V2.2.6 · 受控持久记录比较 · 不是线上事故或跨进程重启实验</text><path d="M90,196 L1710,196" stroke="#cad6e8" stroke-width="3" fill="none"/><rect x="100" y="240" width="570" height="460" rx="18" fill="#edf3ff" stroke="#bed2f7" stroke-width="2"/><text x="132" y="297" font-size="32" font-weight="700" text-anchor="start" fill="#1451d8">同一组受控 owner 条件</text><text x="132" y="367" font-size="28" font-weight="400" text-anchor="start" fill="#10234b">旧记录：开始于 2000 年</text><text x="132" y="423" font-size="28" font-weight="400" text-anchor="start" fill="#10234b">PID：当前研究进程号</text><text x="132" y="479" font-size="28" font-weight="400" text-anchor="start" fill="#10234b">OS：该进程真实存活</text><text x="132" y="535" font-size="26" font-weight="400" text-anchor="start" fill="#10234b">创建时间：本轮实验（2026 年）</text><path d="M133,576 L636,576" stroke="#cad6e8" stroke-width="3" fill="none"/><text x="132" y="621" font-size="27" font-weight="700" text-anchor="start" fill="#b76318">当前进程出生晚于旧记录</text><text x="132" y="665" font-size="27" font-weight="700" text-anchor="start" fill="#b76318">→ 不是当年的原执行者</text><path d="M690,465 H750 V339 H850" stroke="#1451d8" stroke-width="5" fill="none" marker-end="url(#blueArrow)" stroke-linejoin="round"/><path d="M750,465 V598 H850" stroke="#7651bd" stroke-width="5" fill="none" marker-end="url(#purpleArrow)" stroke-linejoin="round"/><rect x="880" y="240" width="820" height="211" rx="18" fill="#f7f9fd" stroke="#cad6e8" stroke-width="2"/><text x="912" y="291" font-size="29" font-weight="700" text-anchor="start" fill="#10234b">审批记录读取路径</text><text x="912" y="344" font-size="25" font-weight="400" text-anchor="start" fill="#52627b">同 PID 跳过死亡检查；未比较进程代次</text><text x="912" y="405" font-size="35" font-weight="700" text-anchor="start" fill="#b76318">仍保留 executing</text><rect x="880" y="490" width="820" height="211" rx="18" fill="#f4f0fc" stroke="#d7c9ed" stroke-width="2"/><text x="912" y="542" font-size="29" font-weight="700" text-anchor="start" fill="#7651bd">既有写锁函数（旧格式对照）</text><text x="912" y="595" font-size="26" font-weight="400" text-anchor="start" fill="#52627b">OS 创建时间晚于合成 acquired_at</text><text x="912" y="656" font-size="35" font-weight="700" text-anchor="start" fill="#7651bd">识别为 stale</text><rect x="100" y="753" width="1600" height="100" rx="15" fill="#fff2e5" stroke="#efd1af" stroke-width="2"/><text x="136" y="798" font-size="34" font-weight="700" text-anchor="start" fill="#b76318">身份失配 ≠ 效果未发生 ≠ 获准重试</text><text x="136" y="833" font-size="24" font-weight="400" text-anchor="start" fill="#52627b">识别原 owner 不在以后，仍需检查原动作的效果事实与当前权限。</text><text x="105" y="912" font-size="24" font-weight="700" text-anchor="start" fill="#1451d8">实验边界</text><text x="290" y="912" font-size="25" font-weight="400" text-anchor="start" fill="#10234b">合成旧记录 + 真实 OS 查询；未诱发真实 PID 复用；执行器调用为 0。</text><text x="105" y="963" font-size="23" font-weight="400" text-anchor="start" fill="#52627b">来源：E2；两条路径职责不同，此图只比较对同一时间矛盾的识别。</text></g></svg>
