<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080"><defs><marker id="blueArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#1451d8" stroke-width="2"/></marker><marker id="purpleArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#7651bd" stroke-width="2"/></marker><marker id="amberArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#b76318" stroke-width="2"/></marker></defs><rect width="1800" height="1080" fill="#f7f9fd"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="38" y="34" width="1724" height="1012" rx="24" fill="#ffffff" stroke="#e0e7f1" stroke-width="2"/><text x="90" y="113" font-size="50" font-weight="700" text-anchor="start" fill="#10234b">机器在企业，Agent 循环仍可在云端</text><text x="92" y="165" font-size="26" font-weight="400" text-anchor="start" fill="#52627b">Self-Hosted Machines · 执行位置、数据流向与业务责任需要分别回答</text><path d="M90,196 L1710,196" stroke="#cad6e8" stroke-width="3" fill="none"/><rect x="95" y="243" width="585" height="488" rx="18" fill="#edf3ff" stroke="#bad0f7" stroke-width="2"/><text x="130" y="301" font-size="38" font-weight="700" text-anchor="start" fill="#1451d8">Cursor 云端</text><text x="130" y="348" font-size="26" font-weight="400" text-anchor="start" fill="#52627b">组织 Agent 的下一步</text><rect x="130" y="382" width="510" height="68" rx="12" fill="#ffffff" stroke="#d3e0f7" stroke-width="2"/><text x="155" y="427" font-size="30" font-weight="600" text-anchor="start" fill="#10234b">Agent 循环</text><rect x="130" y="476" width="510" height="68" rx="12" fill="#ffffff" stroke="#d3e0f7" stroke-width="2"/><text x="155" y="521" font-size="30" font-weight="600" text-anchor="start" fill="#10234b">推理与规划</text><rect x="130" y="570" width="510" height="68" rx="12" fill="#ffffff" stroke="#d3e0f7" stroke-width="2"/><text x="155" y="615" font-size="30" font-weight="600" text-anchor="start" fill="#10234b">接收执行结果</text><rect x="1120" y="243" width="585" height="488" rx="18" fill="#f0f7f8" stroke="#bfd9de" stroke-width="2"/><text x="1155" y="301" font-size="36" font-weight="700" text-anchor="start" fill="#10234b">企业内网 / 自有机器</text><text x="1155" y="348" font-size="26" font-weight="400" text-anchor="start" fill="#52627b">Worker 执行工具</text><rect x="1155" y="382" width="510" height="68" rx="12" fill="#ffffff" stroke="#cee0e3" stroke-width="2"/><text x="1180" y="427" font-size="28" font-weight="600" text-anchor="start" fill="#10234b">文件编辑 · 终端命令</text><rect x="1155" y="476" width="510" height="68" rx="12" fill="#ffffff" stroke="#cee0e3" stroke-width="2"/><text x="1180" y="521" font-size="28" font-weight="600" text-anchor="start" fill="#10234b">本地 MCP · 桌面操作</text><rect x="1155" y="570" width="510" height="68" rx="12" fill="#ffffff" stroke="#cee0e3" stroke-width="2"/><text x="1180" y="615" font-size="28" font-weight="600" text-anchor="start" fill="#10234b">本地工作区与构建环境</text><text x="900" y="333" font-size="27" font-weight="700" text-anchor="middle" fill="#1451d8">工具调用</text><path d="M703,368 H1094" stroke="#1451d8" stroke-width="5" fill="none" marker-end="url(#blueArrow)" stroke-linejoin="round"/><text x="900" y="465" font-size="27" font-weight="700" text-anchor="middle" fill="#7651bd">按需回传内容</text><text x="900" y="509" font-size="23" font-weight="400" text-anchor="middle" fill="#52627b">文件 · 输出 · 差异</text><text x="900" y="548" font-size="23" font-weight="400" text-anchor="middle" fill="#52627b">截图 · MCP 结果</text><path d="M1094,588 H703" stroke="#7651bd" stroke-width="5" fill="none" marker-end="url(#purpleArrow)" stroke-linejoin="round"/><text x="900" y="654" font-size="22" font-weight="400" text-anchor="middle" fill="#52627b">连接由 worker 发起</text><text x="900" y="687" font-size="22" font-weight="400" text-anchor="middle" fill="#52627b">出站 HTTPS</text><rect x="95" y="770" width="1610" height="87" rx="15" fill="#fff2e5" stroke="#efd1af" stroke-width="2"/><text x="130" y="824" font-size="31" font-weight="600" text-anchor="start" fill="#b76318">本地执行不等于零数据外传；Privacy Mode 不等于离线运行。</text><text x="105" y="920" font-size="25" font-weight="700" text-anchor="start" fill="#1451d8">作者提出的产品问题</text><text x="420" y="920" font-size="29" font-weight="600" text-anchor="start" fill="#10234b">谁授权工作？谁验收结果？证据能否脱离单个平台解释？</text><text x="105" y="981" font-size="23" font-weight="400" text-anchor="start" fill="#52627b">来源：Cursor 官方 Self-Hosted Machines 文档，截至 2026-09-03。</text><text x="105" y="1019" font-size="23" font-weight="400" text-anchor="start" fill="#52627b">这是职责与数据流示意，不是产品界面、部署实测或 CodeFlowMu 已有适配能力。</text></g></svg>
