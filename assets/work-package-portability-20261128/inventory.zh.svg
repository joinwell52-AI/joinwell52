<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 570" role="img" lang="zh">
<title>同一份岗位说明，两种交付</title>
<rect width="1160" height="570" rx="24" fill="#f5f6fc"/>
<g font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif">
<text x="55" y="77" fill="#193054" font-size="47" font-weight="700">同一份岗位说明，两种交付</text>
<path d="M580 108v23 M300 147v-16h560v16" fill="none" stroke="#b5c4e4" stroke-width="3"/>
<g transform="translate(52 150)">
<rect width="510" height="366" rx="18" fill="white" stroke="#dbe2f1"/>
<text x="26" y="58" fill="#193054" font-size="31" font-weight="650">两个读取工具都可用</text>
<text x="26" y="114" fill="#405674" font-size="24" font-weight="500">设备台账</text>
<text x="26" y="150" fill="#193054" font-size="29" font-weight="600">D-01 · D-02 · D-03</text>
<text x="26" y="200" fill="#405674" font-size="24" font-weight="500">现场盘点表</text>
<text x="26" y="236" fill="#193054" font-size="29" font-weight="600">D-01 · D-03</text>
<path d="M26 261h458" stroke="#e2e8f4"/>
<text x="26" y="304" fill="#214caf" font-size="31" font-weight="700">差异报告待审</text>
<text x="26" y="337" fill="#405674" font-size="24" font-weight="500">D-02 未出现在盘点表</text>
</g>
<g transform="translate(598 150)">
<rect width="510" height="366" rx="18" fill="white" stroke="#dbe2f1"/>
<text x="26" y="58" fill="#193054" font-size="31" font-weight="650">只提供台账工具</text>
<text x="26" y="114" fill="#405674" font-size="24" font-weight="500">设备台账</text>
<text x="26" y="150" fill="#193054" font-size="29" font-weight="600">D-01 · D-02 · D-03</text>
<text x="26" y="200" fill="#405674" font-size="24" font-weight="500">现场盘点表</text>
<text x="26" y="236" fill="#934617" font-size="29" font-weight="600">未提供读取工具</text>
<path d="M26 261h458" stroke="#e2e8f4"/>
<text x="26" y="304" fill="#934617" font-size="31" font-weight="700">对照受阻，已记录</text>
<text x="26" y="337" fill="#405674" font-size="24" font-weight="500">需接入盘点表读取工具</text>
</g>
</g></svg>