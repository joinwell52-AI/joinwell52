<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180"><style>text{font-family:"Microsoft YaHei","Segoe UI",sans-serif}</style><rect x="0" y="0" width="1800" height="1180" rx="0" fill="#F3F6FC" stroke="none"/><rect x="0" y="0" width="1800" height="14" rx="0" fill="#164CCC" stroke="none"/><text x="76" y="94" font-size="48" fill="#102A54" font-weight="700">检查之后，什么发生了变化？</text><text x="76" y="153" font-size="29" fill="#172D50" font-weight="400">两组均允许覆盖（overwrite=true）；只比较源内容变化与摘要检查的先后。</text><rect x="76" y="190" width="1648" height="70" rx="20" fill="#E6EEFF" stroke="none"/><text x="102" y="236" font-size="28" fill="#174AAD" font-weight="400">蓝色＝原内容 A · 琥珀色＝新内容 B · 从左到右阅读</text><text x="78" y="335" font-size="34" fill="#172D50" font-weight="700">E4 · 在检查之前变化</text><rect x="76" y="366" width="288" height="134" rx="20" fill="#fff" stroke="#DCE4F2"/><text x="98" y="419" font-size="30" fill="#1853CC" font-weight="700">取得批准</text><text x="98" y="466" font-size="28" fill="#243B5D" font-weight="400">源内容 A</text><path d="M376,433 h32 l-9,-7 m9,7 l-9,7" fill="none" stroke="#7188B0" stroke-width="3"/><rect x="416" y="366" width="288" height="134" rx="20" fill="#fff" stroke="#DCE4F2"/><text x="438" y="419" font-size="30" fill="#AC680A" font-weight="700">源内容变化</text><text x="438" y="466" font-size="28" fill="#243B5D" font-weight="400">A → B</text><path d="M716,433 h32 l-9,-7 m9,7 l-9,7" fill="none" stroke="#7188B0" stroke-width="3"/><rect x="756" y="366" width="288" height="134" rx="20" fill="#fff" stroke="#DCE4F2"/><text x="778" y="419" font-size="30" fill="#1853CC" font-weight="700">摘要检查</text><text x="778" y="466" font-size="28" fill="#243B5D" font-weight="400">不匹配</text><path d="M1056,433 h32 l-9,-7 m9,7 l-9,7" fill="none" stroke="#7188B0" stroke-width="3"/><rect x="1096" y="366" width="288" height="134" rx="20" fill="#fff" stroke="#DCE4F2"/><text x="1118" y="419" font-size="30" fill="#1853CC" font-weight="700">未调用复制</text><text x="1118" y="466" font-size="28" fill="#243B5D" font-weight="400">回调次数：0</text><path d="M1396,433 h32 l-9,-7 m9,7 l-9,7" fill="none" stroke="#7188B0" stroke-width="3"/><rect x="1436" y="366" width="288" height="134" rx="20" fill="#fff" stroke="#DCE4F2"/><text x="1458" y="419" font-size="30" fill="#1853CC" font-weight="700">目标未变</text><text x="1458" y="466" font-size="28" fill="#243B5D" font-weight="400">旧内容保留</text><text x="78" y="549" font-size="27" fill="#1853CC" font-weight="400">APPROVAL_STALE（旧批准失效） · 既有保护有效。</text><text x="78" y="650" font-size="34" fill="#172D50" font-weight="700">E5 · 在检查之后变化</text><rect x="76" y="681" width="288" height="134" rx="20" fill="#fff" stroke="#DCE4F2"/><text x="98" y="734" font-size="30" fill="#1853CC" font-weight="700">取得批准</text><text x="98" y="781" font-size="28" fill="#243B5D" font-weight="400">源内容 A</text><path d="M376,748 h32 l-9,-7 m9,7 l-9,7" fill="none" stroke="#7188B0" stroke-width="3"/><rect x="416" y="681" width="288" height="134" rx="20" fill="#fff" stroke="#DCE4F2"/><text x="438" y="734" font-size="30" fill="#1853CC" font-weight="700">摘要检查</text><text x="438" y="781" font-size="28" fill="#243B5D" font-weight="400">与 A 匹配</text><path d="M716,748 h32 l-9,-7 m9,7 l-9,7" fill="none" stroke="#7188B0" stroke-width="3"/><rect x="756" y="681" width="288" height="134" rx="20" fill="#fff" stroke="#DCE4F2"/><text x="778" y="734" font-size="30" fill="#AC680A" font-weight="700">研究代码注入</text><text x="778" y="781" font-size="28" fill="#243B5D" font-weight="400">A → B</text><path d="M1056,748 h32 l-9,-7 m9,7 l-9,7" fill="none" stroke="#7188B0" stroke-width="3"/><rect x="1096" y="681" width="288" height="134" rx="20" fill="#fff" stroke="#DCE4F2"/><text x="1118" y="734" font-size="30" fill="#AC680A" font-weight="700">真实复制</text><text x="1118" y="781" font-size="28" fill="#243B5D" font-weight="400">读取 B</text><path d="M1396,748 h32 l-9,-7 m9,7 l-9,7" fill="none" stroke="#7188B0" stroke-width="3"/><rect x="1436" y="681" width="288" height="134" rx="20" fill="#fff" stroke="#DCE4F2"/><text x="1458" y="734" font-size="30" fill="#AC680A" font-weight="700">目标被替换</text><text x="1458" y="781" font-size="28" fill="#243B5D" font-weight="400">收到 B</text><text x="78" y="864" font-size="27" fill="#9C5E06" font-weight="400">操作记录成功 · 检查后的变化由研究代码明确注入。</text><rect x="76" y="940" width="1648" height="96" rx="20" fill="#FFF1DD" stroke="none"/><text x="103" y="979" font-size="30" fill="#86500B" font-weight="700">这是受控时序对照，不是已复现的生产竞态。</text><text x="103" y="1018" font-size="27" fill="#86500B" font-weight="400">被检查的快照，不能仅靠自身冻结随后读取的源字节。</text><text x="76" y="1090" font-size="25" fill="#536987" font-weight="400">E4/E5 · 每组两轮 · 共四条观测 · 证据：observations.json</text><text x="76" y="1136" font-size="23" fill="#536987" font-weight="400">实验解释图 · 使用真实审批服务和文件执行器；操作合成源文件。</text></svg>
