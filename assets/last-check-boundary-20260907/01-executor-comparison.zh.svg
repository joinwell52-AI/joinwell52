<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120"><style>text{font-family:"Microsoft YaHei","Segoe UI",sans-serif}</style><rect x="0" y="0" width="1800" height="1120" rx="0" fill="#F3F6FC" stroke="none"/><rect x="0" y="0" width="1800" height="14" rx="0" fill="#164CCC" stroke="none"/><text x="76" y="94" font-size="48" fill="#102A54" font-weight="700">限制被记录，不等于限制被执行</text><text x="76" y="153" font-size="29" fill="#172D50" font-weight="400">共同输入：overwrite=false（不覆盖） · 三个受测分支的批准记录均保留该字段</text><rect x="76" y="192" width="1648" height="68" rx="20" fill="#E6EEFF" stroke="none"/><text x="102" y="237" font-size="28" fill="#174AAD" font-weight="400">E1–E3 的目标原本均已存在；使用真实产品组件与隔离合成文件。</text><text x="105" y="316" font-size="23" fill="#536987" font-weight="700">操作</text><text x="514" y="316" font-size="23" fill="#536987" font-weight="700">观测结果</text><text x="1070" y="316" font-size="23" fill="#536987" font-weight="700">文件读回</text><rect x="76" y="341" width="1648" height="162" rx="20" fill="#fff" stroke="#DCE4F2"/><rect x="101" y="369" width="83" height="45" rx="20" fill="#EAF0FD" stroke="none"/><text x="119" y="402" font-size="28" fill="#174AAD" font-weight="700">E1</text><text x="216" y="407" font-size="38" fill="#172D50" font-weight="700">写入</text><text x="514" y="409" font-size="31" fill="#172D50" font-weight="400">拒绝；操作记录为失败</text><text x="514" y="454" font-size="26" fill="#5C6E87" font-weight="400">既有写入保护有效</text><path d="M1071,368 h70 l24,24 v86 h-94 z" fill="#1853CC" opacity=".12" stroke="#1853CC" stroke-width="3"/><path d="M1141,368 v24 h24 M1089,416 h55 M1089,435 h55 M1089,454 h40" fill="none" stroke="#1853CC" stroke-width="4"/><text x="1200" y="427" font-size="29" fill="#1853CC" font-weight="700">目标原内容保留</text><rect x="76" y="524" width="1648" height="162" rx="20" fill="#fff" stroke="#DCE4F2"/><rect x="101" y="552" width="83" height="45" rx="20" fill="#EAF0FD" stroke="none"/><text x="119" y="585" font-size="28" fill="#174AAD" font-weight="700">E2</text><text x="216" y="590" font-size="38" fill="#172D50" font-weight="700">复制</text><text x="514" y="592" font-size="31" fill="#172D50" font-weight="400">操作记录为成功</text><text x="514" y="637" font-size="26" fill="#5C6E87" font-weight="400">源文件仍在</text><path d="M1071,551 h70 l24,24 v86 h-94 z" fill="#AE690A" opacity=".12" stroke="#AE690A" stroke-width="3"/><path d="M1141,551 v24 h24 M1089,599 h55 M1089,618 h55 M1089,637 h40" fill="none" stroke="#AE690A" stroke-width="4"/><text x="1200" y="610" font-size="29" fill="#AE690A" font-weight="700">目标被源内容替换</text><rect x="76" y="707" width="1648" height="162" rx="20" fill="#fff" stroke="#DCE4F2"/><rect x="101" y="735" width="83" height="45" rx="20" fill="#EAF0FD" stroke="none"/><text x="119" y="768" font-size="28" fill="#174AAD" font-weight="700">E3</text><text x="216" y="773" font-size="38" fill="#172D50" font-weight="700">移动</text><text x="514" y="775" font-size="31" fill="#172D50" font-weight="400">操作记录为成功</text><text x="514" y="820" font-size="26" fill="#5C6E87" font-weight="400">源文件已移动</text><path d="M1071,734 h70 l24,24 v86 h-94 z" fill="#AE690A" opacity=".12" stroke="#AE690A" stroke-width="3"/><path d="M1141,734 v24 h24 M1089,782 h55 M1089,801 h55 M1089,820 h40" fill="none" stroke="#AE690A" stroke-width="4"/><text x="1200" y="793" font-size="29" fill="#AE690A" font-weight="700">目标被源内容替换</text><rect x="76" y="911" width="1648" height="70" rx="20" fill="#E6EEFF" stroke="none"/><text x="100" y="957" font-size="27" fill="#174AAD" font-weight="400">E0 正对照：写入不存在的目标成功。“不覆盖”并不禁止合法创建。</text><text x="76" y="1032" font-size="25" fill="#536987" font-weight="400">E0–E3 · 每组两轮 · 共八条观测 · 不是生产事故发生率</text><text x="76" y="1078" font-size="23" fill="#536987" font-weight="400">实验解释图 · 证据：observations.json · 公开入口适用性仍待核查。</text></svg>
