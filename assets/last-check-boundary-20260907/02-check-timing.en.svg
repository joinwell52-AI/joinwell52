<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180"><style>text{font-family:"Microsoft YaHei","Segoe UI",sans-serif}</style><rect x="0" y="0" width="1800" height="1180" rx="0" fill="#F3F6FC" stroke="none"/><rect x="0" y="0" width="1800" height="14" rx="0" fill="#164CCC" stroke="none"/><text x="76" y="94" font-size="48" fill="#102A54" font-weight="700">What changed after the check?</text><text x="76" y="153" font-size="29" fill="#172D50" font-weight="400">Both cases allow overwrite. Only the source-change timing differs.</text><rect x="76" y="190" width="1648" height="70" rx="20" fill="#E6EEFF" stroke="none"/><text x="102" y="236" font-size="28" fill="#174AAD" font-weight="400">Blue = original content A · Amber = changed content B · Read from left to right</text><text x="78" y="335" font-size="34" fill="#172D50" font-weight="700">E4 · Change BEFORE validation</text><rect x="76" y="366" width="288" height="134" rx="20" fill="#fff" stroke="#DCE4F2"/><text x="98" y="419" font-size="26" fill="#1853CC" font-weight="700">Approved</text><text x="98" y="466" font-size="25" fill="#243B5D" font-weight="400">Source A</text><path d="M376,433 h32 l-9,-7 m9,7 l-9,7" fill="none" stroke="#7188B0" stroke-width="3"/><rect x="416" y="366" width="288" height="134" rx="20" fill="#fff" stroke="#DCE4F2"/><text x="438" y="419" font-size="26" fill="#AC680A" font-weight="700">Source changes</text><text x="438" y="466" font-size="25" fill="#243B5D" font-weight="400">A → B</text><path d="M716,433 h32 l-9,-7 m9,7 l-9,7" fill="none" stroke="#7188B0" stroke-width="3"/><rect x="756" y="366" width="288" height="134" rx="20" fill="#fff" stroke="#DCE4F2"/><text x="778" y="419" font-size="26" fill="#1853CC" font-weight="700">Digest check</text><text x="778" y="466" font-size="25" fill="#243B5D" font-weight="400">Mismatch</text><path d="M1056,433 h32 l-9,-7 m9,7 l-9,7" fill="none" stroke="#7188B0" stroke-width="3"/><rect x="1096" y="366" width="288" height="134" rx="20" fill="#fff" stroke="#DCE4F2"/><text x="1118" y="419" font-size="26" fill="#1853CC" font-weight="700">Copy not called</text><text x="1118" y="466" font-size="25" fill="#243B5D" font-weight="400">Callback: 0</text><path d="M1396,433 h32 l-9,-7 m9,7 l-9,7" fill="none" stroke="#7188B0" stroke-width="3"/><rect x="1436" y="366" width="288" height="134" rx="20" fill="#fff" stroke="#DCE4F2"/><text x="1458" y="419" font-size="26" fill="#1853CC" font-weight="700">Target unchanged</text><text x="1458" y="466" font-size="25" fill="#243B5D" font-weight="400">Old bytes retained</text><text x="78" y="549" font-size="27" fill="#1853CC" font-weight="400">APPROVAL_STALE · Existing stale-approval protection works.</text><text x="78" y="650" font-size="34" fill="#172D50" font-weight="700">E5 · Change AFTER validation</text><rect x="76" y="681" width="288" height="134" rx="20" fill="#fff" stroke="#DCE4F2"/><text x="98" y="734" font-size="26" fill="#1853CC" font-weight="700">Approved</text><text x="98" y="781" font-size="25" fill="#243B5D" font-weight="400">Source A</text><path d="M376,748 h32 l-9,-7 m9,7 l-9,7" fill="none" stroke="#7188B0" stroke-width="3"/><rect x="416" y="681" width="288" height="134" rx="20" fill="#fff" stroke="#DCE4F2"/><text x="438" y="734" font-size="26" fill="#1853CC" font-weight="700">Digest check</text><text x="438" y="781" font-size="25" fill="#243B5D" font-weight="400">Matches A</text><path d="M716,748 h32 l-9,-7 m9,7 l-9,7" fill="none" stroke="#7188B0" stroke-width="3"/><rect x="756" y="681" width="288" height="134" rx="20" fill="#fff" stroke="#DCE4F2"/><text x="778" y="734" font-size="26" fill="#AC680A" font-weight="700">Research injection</text><text x="778" y="781" font-size="25" fill="#243B5D" font-weight="400">A → B</text><path d="M1056,748 h32 l-9,-7 m9,7 l-9,7" fill="none" stroke="#7188B0" stroke-width="3"/><rect x="1096" y="681" width="288" height="134" rx="20" fill="#fff" stroke="#DCE4F2"/><text x="1118" y="734" font-size="26" fill="#AC680A" font-weight="700">Real copy</text><text x="1118" y="781" font-size="25" fill="#243B5D" font-weight="400">Reads B</text><path d="M1396,748 h32 l-9,-7 m9,7 l-9,7" fill="none" stroke="#7188B0" stroke-width="3"/><rect x="1436" y="681" width="288" height="134" rx="20" fill="#fff" stroke="#DCE4F2"/><text x="1458" y="734" font-size="26" fill="#AC680A" font-weight="700">Target replaced</text><text x="1458" y="781" font-size="25" fill="#243B5D" font-weight="400">Receives B</text><text x="78" y="864" font-size="27" fill="#9C5E06" font-weight="400">Succeeded · Post-check mutation was explicitly injected by the study.</text><rect x="76" y="940" width="1648" height="96" rx="20" fill="#FFF1DD" stroke="none"/><text x="103" y="979" font-size="30" fill="#86500B" font-weight="700">A controlled timing comparison — not a reproduced production race.</text><text x="103" y="1018" font-size="27" fill="#86500B" font-weight="400">The checked snapshot does not, by itself, freeze the source bytes.</text><text x="76" y="1090" font-size="25" fill="#536987" font-weight="400">E4/E5 · 2 rounds each · 4 observations · Evidence: observations.json</text><text x="76" y="1136" font-size="23" fill="#536987" font-weight="400">Explanatory figure · Real approval service and file executor; synthetic source files.</text></svg>
