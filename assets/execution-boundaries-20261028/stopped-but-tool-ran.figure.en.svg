<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-label="Stopping boundary for queued tools after a function failure">
<rect width="960" height="280" rx="18" fill="#f7f8fb"/>
<text x="36" y="42" font-size="22" font-family="sans-serif" fill="#20324b" font-weight="700">After a failure is selected, active and queued tools need separate handling</text>
<path d="M176 142H295 M566 142H682" stroke="#6478ee" stroke-width="4" stroke-linecap="round"/>
<path d="M285 132l12 10-12 10 M672 132l12 10-12 10" fill="none" stroke="#6478ee" stroke-width="4"/>
<rect x="36" y="91" width="140" height="102" rx="14" fill="#e9a855"/>
<text x="106" y="134" text-anchor="middle" font-size="20" font-family="sans-serif" fill="#34291e" font-weight="700">Function fails</text>
<text x="106" y="162" text-anchor="middle" font-size="15" font-family="sans-serif" fill="#34291e">selected error</text>
<rect x="298" y="75" width="265" height="135" rx="18" fill="#1450cc"/>
<text x="430" y="119" text-anchor="middle" font-size="22" font-family="sans-serif" fill="white" font-weight="700">Execution boundary</text>
<text x="430" y="153" text-anchor="middle" font-size="16" font-family="sans-serif" fill="white">Cancel active tool</text>
<text x="430" y="180" text-anchor="middle" font-size="16" font-family="sans-serif" fill="white">Close queued calls</text>
<rect x="685" y="91" width="238" height="102" rx="14" fill="#e5e9f8" stroke="#9aa8d1" stroke-width="2"/>
<text x="804" y="134" text-anchor="middle" font-size="20" font-family="sans-serif" fill="#20324b" font-weight="700">Queued tool stays off</text>
<text x="804" y="162" text-anchor="middle" font-size="15" font-family="sans-serif" fill="#53627d">Past effects need review</text>
<text x="36" y="249" font-size="15" font-family="sans-serif" fill="#53627d">Before: 16/16 failed → merge: 16/16 passed · synthetic tools, controlled schedules</text>
</svg>
