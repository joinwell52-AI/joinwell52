<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
  <title id="title">Three checks across an agent handoff</title>
  <desc id="desc">Task data follows an explicit scope, prior decisions require current authority, and reports require review before they prove delivery.</desc>
  <rect width="1200" height="450" rx="28" fill="#fbf8f1"/>
  <path d="M225 106H1000M225 225H1000M225 344H1000" stroke="#d7dfe7" stroke-width="2"/>
  <rect x="40" y="52" width="166" height="344" rx="22" fill="#e8efff" stroke="#c7d7fc"/>
  <text x="123" y="172" text-anchor="middle" font-size="22" font-weight="700" fill="#17305b" font-family="Arial, sans-serif">Handoff</text>
  <text x="123" y="211" text-anchor="middle" font-size="15" fill="#475b76" font-family="Arial, sans-serif">next agent</text>
  <text x="251" y="82" font-size="19" font-weight="700" fill="#1746b5" font-family="Arial, sans-serif">Data</text>
  <text x="335" y="82" font-size="17" fill="#243955" font-family="Arial, sans-serif">Local / copied / shared</text>
  <path d="M726 75h77" stroke="#285dcc" stroke-width="4" stroke-linecap="round"/>
  <path d="m801 68 12 7-12 7" fill="none" stroke="#285dcc" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="835" y="52" width="290" height="48" rx="13" fill="#e7efff"/>
  <text x="980" y="83" text-anchor="middle" font-size="16" font-weight="600" fill="#1746b5" font-family="Arial, sans-serif">Pass by declared scope</text>
  <text x="251" y="201" font-size="19" font-weight="700" fill="#ad6519" font-family="Arial, sans-serif">Decision</text>
  <text x="355" y="201" font-size="17" fill="#243955" font-family="Arial, sans-serif">Old answer or approval</text>
  <path d="M726 194h77" stroke="#be7629" stroke-width="4" stroke-linecap="round"/>
  <path d="m801 187 12 7-12 7" fill="none" stroke="#be7629" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="835" y="171" width="290" height="48" rx="13" fill="#fff0da"/>
  <text x="980" y="202" text-anchor="middle" font-size="16" font-weight="600" fill="#955216" font-family="Arial, sans-serif">Check current authority</text>
  <text x="251" y="320" font-size="19" font-weight="700" fill="#6546a8" font-family="Arial, sans-serif">Outcome</text>
  <text x="355" y="320" font-size="17" fill="#243955" font-family="Arial, sans-serif">Report / completion / memory</text>
  <path d="M726 313h77" stroke="#795ac0" stroke-width="4" stroke-linecap="round"/>
  <path d="m801 306 12 7-12 7" fill="none" stroke="#795ac0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="835" y="290" width="290" height="48" rx="13" fill="#f0eafe"/>
  <text x="980" y="321" text-anchor="middle" font-size="16" font-weight="600" fill="#6242a8" font-family="Arial, sans-serif">Use by review and source</text>
  <text x="40" y="428" font-size="14" fill="#697b8f" font-family="Arial, sans-serif">Research synthesis: separate checks, not a newly deployed workflow.</text>
</svg>
