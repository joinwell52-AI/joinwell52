<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 820" role="img" aria-labelledby="title desc">
  <title id="title">Three checks across an agent handoff</title>
  <desc id="desc">Data passes by scope, decisions require current authority, and outcomes require review and source.</desc>
  <rect width="720" height="820" rx="26" fill="#fbf8f1"/>
  <rect x="42" y="34" width="636" height="92" rx="22" fill="#e8efff" stroke="#c7d7fc"/>
  <text x="360" y="90" text-anchor="middle" font-size="30" font-weight="700" fill="#17305b" font-family="Arial, sans-serif">Handoff · next agent</text>
  <rect x="42" y="154" width="636" height="170" rx="22" fill="#eef3ff"/>
  <text x="73" y="204" font-size="28" font-weight="700" fill="#1746b5" font-family="Arial, sans-serif">Data</text>
  <text x="73" y="249" font-size="25" fill="#243955" font-family="Arial, sans-serif">Local / copied / shared</text>
  <text x="73" y="294" font-size="23" fill="#1746b5" font-family="Arial, sans-serif">→ Pass by declared scope</text>
  <rect x="42" y="348" width="636" height="170" rx="22" fill="#fff2df"/>
  <text x="73" y="398" font-size="28" font-weight="700" fill="#a65c16" font-family="Arial, sans-serif">Decision</text>
  <text x="73" y="443" font-size="25" fill="#243955" font-family="Arial, sans-serif">Old answer or approval</text>
  <text x="73" y="488" font-size="23" fill="#a65c16" font-family="Arial, sans-serif">→ Check current authority</text>
  <rect x="42" y="542" width="636" height="170" rx="22" fill="#f1eafd"/>
  <text x="73" y="592" font-size="28" font-weight="700" fill="#6546a8" font-family="Arial, sans-serif">Outcome</text>
  <text x="73" y="637" font-size="25" fill="#243955" font-family="Arial, sans-serif">Report / completion / memory</text>
  <text x="73" y="682" font-size="23" fill="#6546a8" font-family="Arial, sans-serif">→ Use by review and source</text>
  <text x="42" y="765" font-size="19" fill="#697b8f" font-family="Arial, sans-serif">Research synthesis, not a deployed workflow.</text>
</svg>
