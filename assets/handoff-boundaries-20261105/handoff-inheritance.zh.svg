<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
  <title id="title">多 Agent 交接的三种核验</title>
  <desc id="desc">任务资料按范围传递，旧决定按当前主体与轮次核验，工作报告按审查与依赖条件判断。</desc>
  <rect width="1200" height="450" rx="28" fill="#fbf8f1"/>
  <path d="M225 106H1000M225 225H1000M225 344H1000" stroke="#d7dfe7" stroke-width="2"/>
  <rect x="40" y="52" width="166" height="344" rx="22" fill="#e8efff" stroke="#c7d7fc"/>
  <text x="123" y="172" text-anchor="middle" font-size="23" font-weight="700" fill="#17305b" font-family="Arial, sans-serif">任务交接</text>
  <text x="123" y="211" text-anchor="middle" font-size="16" fill="#475b76" font-family="Arial, sans-serif">下一位 Agent</text>
  <text x="251" y="82" font-size="19" font-weight="700" fill="#1746b5" font-family="Arial, sans-serif">资料</text>
  <text x="335" y="82" font-size="18" fill="#243955" font-family="Arial, sans-serif">只留本地 / 复制 / 共享</text>
  <path d="M726 75h77" stroke="#285dcc" stroke-width="4" stroke-linecap="round"/>
  <path d="m801 68 12 7-12 7" fill="none" stroke="#285dcc" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="835" y="52" width="290" height="48" rx="13" fill="#e7efff"/>
  <text x="980" y="83" text-anchor="middle" font-size="17" font-weight="600" fill="#1746b5" font-family="Arial, sans-serif">按声明范围传递</text>
  <text x="251" y="201" font-size="19" font-weight="700" fill="#ad6519" font-family="Arial, sans-serif">决定</text>
  <text x="335" y="201" font-size="18" fill="#243955" font-family="Arial, sans-serif">旧答复、批准或授权</text>
  <path d="M726 194h77" stroke="#be7629" stroke-width="4" stroke-linecap="round"/>
  <path d="m801 187 12 7-12 7" fill="none" stroke="#be7629" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="835" y="171" width="290" height="48" rx="13" fill="#fff0da"/>
  <text x="980" y="202" text-anchor="middle" font-size="17" font-weight="600" fill="#955216" font-family="Arial, sans-serif">按当前主体与轮次核验</text>
  <text x="251" y="320" font-size="19" font-weight="700" fill="#6546a8" font-family="Arial, sans-serif">结果</text>
  <text x="335" y="320" font-size="18" fill="#243955" font-family="Arial, sans-serif">报告、完成与经验</text>
  <path d="M726 313h77" stroke="#795ac0" stroke-width="4" stroke-linecap="round"/>
  <path d="m801 306 12 7-12 7" fill="none" stroke="#795ac0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="835" y="290" width="290" height="48" rx="13" fill="#f0eafe"/>
  <text x="980" y="321" text-anchor="middle" font-size="17" font-weight="600" fill="#6242a8" font-family="Arial, sans-serif">按审查与来源使用</text>
  <text x="40" y="428" font-size="14" fill="#697b8f" font-family="Arial, sans-serif">研究归纳图：三个问题分别核验；不是已上线的新流程。</text>
</svg>
