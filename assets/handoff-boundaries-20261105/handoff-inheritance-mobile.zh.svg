<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 820" role="img" aria-labelledby="title desc">
  <title id="title">多 Agent 交接的三种核验</title>
  <desc id="desc">资料按范围传递，决定按当前主体核验，结果按审查与来源使用。</desc>
  <rect width="720" height="820" rx="26" fill="#fbf8f1"/>
  <rect x="42" y="34" width="636" height="92" rx="22" fill="#e8efff" stroke="#c7d7fc"/>
  <text x="360" y="90" text-anchor="middle" font-size="31" font-weight="700" fill="#17305b" font-family="Arial, sans-serif">任务交接 · 下一位 Agent</text>
  <rect x="42" y="154" width="636" height="170" rx="22" fill="#eef3ff"/>
  <text x="73" y="204" font-size="28" font-weight="700" fill="#1746b5" font-family="Arial, sans-serif">资料</text>
  <text x="73" y="249" font-size="25" fill="#243955" font-family="Arial, sans-serif">本地 / 复制 / 共享</text>
  <text x="73" y="294" font-size="23" fill="#1746b5" font-family="Arial, sans-serif">→ 按声明范围传递</text>
  <rect x="42" y="348" width="636" height="170" rx="22" fill="#fff2df"/>
  <text x="73" y="398" font-size="28" font-weight="700" fill="#a65c16" font-family="Arial, sans-serif">决定</text>
  <text x="73" y="443" font-size="25" fill="#243955" font-family="Arial, sans-serif">旧答复、批准或授权</text>
  <text x="73" y="488" font-size="23" fill="#a65c16" font-family="Arial, sans-serif">→ 按当前主体与轮次核验</text>
  <rect x="42" y="542" width="636" height="170" rx="22" fill="#f1eafd"/>
  <text x="73" y="592" font-size="28" font-weight="700" fill="#6546a8" font-family="Arial, sans-serif">结果</text>
  <text x="73" y="637" font-size="25" fill="#243955" font-family="Arial, sans-serif">报告、完成与经验</text>
  <text x="73" y="682" font-size="23" fill="#6546a8" font-family="Arial, sans-serif">→ 按审查与来源使用</text>
  <text x="42" y="765" font-size="19" fill="#697b8f" font-family="Arial, sans-serif">研究归纳，不是已上线的新流程。</text>
</svg>
