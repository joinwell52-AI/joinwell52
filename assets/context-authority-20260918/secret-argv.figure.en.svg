<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="t d">
  <title id="t">Command-line visibility of one synthetic token over three paths</title><desc id="d">The argv path is visible to a same-account command-line observer; environment and stdin paths do not appear in that view.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#f3f5ff"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".12"/></filter></defs>
  <rect width="1200" height="610" rx="32" fill="url(#bg)"/>
  <text x="70" y="66" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#17213d">Same origin, different command-line visibility</text>
  <rect x="70" y="110" width="280" height="390" rx="28" fill="#173fbf" filter="url(#s)"/><text x="210" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#fff">Synthetic token</text><circle cx="210" cy="290" r="70" fill="#5f85ff" stroke="#fff" stroke-width="4"/><path d="M210 240c45 62 45 85 0 105-45-20-45-43 0-105z" fill="#fff" opacity=".9"/><text x="210" y="422" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#dfe7ff">No real credential</text>
  <g font-family="Arial, sans-serif" filter="url(#s)">
    <path d="M350 230H455" stroke="#173fbf" stroke-width="7"/><path d="m447 218 18 12-18 12" fill="none" stroke="#173fbf" stroke-width="7"/>
    <rect x="475" y="132" width="280" height="100" rx="22" fill="#fff" stroke="#173fbf" stroke-width="3"/><text x="615" y="174" text-anchor="middle" font-size="23" font-weight="700" fill="#17213d">argv</text><text x="615" y="205" text-anchor="middle" font-size="18" fill="#59627a">--token SYNTHETIC…</text>
    <rect x="475" y="255" width="280" height="100" rx="22" fill="#fff" stroke="#173fbf" stroke-width="3"/><text x="615" y="297" text-anchor="middle" font-size="23" font-weight="700" fill="#17213d">Environment</text><text x="615" y="328" text-anchor="middle" font-size="18" fill="#59627a">SYNTHETIC_TOKEN=…</text>
    <rect x="475" y="378" width="280" height="100" rx="22" fill="#fff" stroke="#173fbf" stroke-width="3"/><text x="615" y="420" text-anchor="middle" font-size="23" font-weight="700" fill="#17213d">stdin</text><text x="615" y="451" text-anchor="middle" font-size="18" fill="#59627a">Written after launch</text>
    <path d="M770 182H850" stroke="#e39b22" stroke-width="7"/><path d="m842 170 18 12-18 12" fill="none" stroke="#e39b22" stroke-width="7"/>
    <path d="M770 305H850M770 428H850" stroke="#173fbf" stroke-width="7"/>
    <rect x="870" y="132" width="260" height="346" rx="28" fill="#fff" stroke="#d9dfef"/><text x="1000" y="184" text-anchor="middle" font-size="22" font-weight="700" fill="#17213d">Command-line view</text>
    <circle cx="1000" cy="251" r="39" fill="#fff3d8" stroke="#e39b22" stroke-width="4"/><text x="1000" y="260" text-anchor="middle" font-size="24" font-weight="700" fill="#9a5a00">Seen</text>
    <circle cx="1000" cy="333" r="39" fill="#eaf0ff" stroke="#173fbf" stroke-width="4"/><text x="1000" y="342" text-anchor="middle" font-size="23" font-weight="700" fill="#173fbf">Not seen</text>
    <circle cx="1000" cy="415" r="39" fill="#eaf0ff" stroke="#173fbf" stroke-width="4"/><text x="1000" y="424" text-anchor="middle" font-size="23" font-weight="700" fill="#173fbf">Not seen</text>
  </g>
  <text x="70" y="558" font-family="Arial, sans-serif" font-size="18" fill="#59627a">Observer: Win32_Process.CommandLine under the same Windows account. “Not seen” is limited to this observation surface.</text>
</svg>
