<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="t d">
  <title id="t">同一合成 token 通过三种路径的命令行可见性</title><desc id="d">argv 路径被同账户进程命令行观察器看到，环境变量和标准输入路径没有出现在该观察面。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#f3f5ff"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".12"/></filter></defs>
  <rect width="1200" height="610" rx="32" fill="url(#bg)"/>
  <text x="70" y="66" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#17213d">来源相同，传递路径改变了命令行可见性</text>
  <rect x="70" y="110" width="280" height="390" rx="28" fill="#173fbf" filter="url(#s)"/><text x="210" y="182" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#fff">合成 token</text><circle cx="210" cy="290" r="70" fill="#5f85ff" stroke="#fff" stroke-width="4"/><path d="M210 240c45 62 45 85 0 105-45-20-45-43 0-105z" fill="#fff" opacity=".9"/><text x="210" y="422" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#dfe7ff">不使用真实凭证</text>
  <g font-family="Microsoft YaHei, sans-serif" filter="url(#s)">
    <path d="M350 230H455" stroke="#173fbf" stroke-width="7"/><path d="m447 218 18 12-18 12" fill="none" stroke="#173fbf" stroke-width="7"/>
    <rect x="475" y="132" width="280" height="100" rx="22" fill="#fff" stroke="#173fbf" stroke-width="3"/><text x="615" y="174" text-anchor="middle" font-size="23" font-weight="700" fill="#17213d">argv</text><text x="615" y="205" text-anchor="middle" font-size="18" fill="#59627a">--token SYNTHETIC…</text>
    <rect x="475" y="255" width="280" height="100" rx="22" fill="#fff" stroke="#173fbf" stroke-width="3"/><text x="615" y="297" text-anchor="middle" font-size="23" font-weight="700" fill="#17213d">环境变量</text><text x="615" y="328" text-anchor="middle" font-size="18" fill="#59627a">SYNTHETIC_TOKEN=…</text>
    <rect x="475" y="378" width="280" height="100" rx="22" fill="#fff" stroke="#173fbf" stroke-width="3"/><text x="615" y="420" text-anchor="middle" font-size="23" font-weight="700" fill="#17213d">标准输入</text><text x="615" y="451" text-anchor="middle" font-size="18" fill="#59627a">启动后写入</text>
    <path d="M770 182H850" stroke="#e39b22" stroke-width="7"/><path d="m842 170 18 12-18 12" fill="none" stroke="#e39b22" stroke-width="7"/>
    <path d="M770 305H850M770 428H850" stroke="#173fbf" stroke-width="7"/>
    <rect x="870" y="132" width="260" height="346" rx="28" fill="#fff" stroke="#d9dfef"/><text x="1000" y="184" text-anchor="middle" font-size="22" font-weight="700" fill="#17213d">进程命令行观察</text>
    <circle cx="1000" cy="251" r="39" fill="#fff3d8" stroke="#e39b22" stroke-width="4"/><text x="1000" y="260" text-anchor="middle" font-size="27" font-weight="700" fill="#9a5a00">可见</text>
    <circle cx="1000" cy="333" r="39" fill="#eaf0ff" stroke="#173fbf" stroke-width="4"/><text x="1000" y="342" text-anchor="middle" font-size="27" font-weight="700" fill="#173fbf">未见</text>
    <circle cx="1000" cy="415" r="39" fill="#eaf0ff" stroke="#173fbf" stroke-width="4"/><text x="1000" y="424" text-anchor="middle" font-size="27" font-weight="700" fill="#173fbf">未见</text>
  </g>
  <text x="70" y="558" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#59627a">观察面：同一 Windows 账户下的 Win32_Process.CommandLine；“未见”不代表其他通道不可访问。</text>
</svg>
