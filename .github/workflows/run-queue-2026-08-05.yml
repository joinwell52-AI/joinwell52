name: One-time Research Runtime Queue 2026-08-05

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/run-queue-2026-08-05.yml

permissions:
  contents: write

concurrency:
  group: runtime-queue-2026-08-05
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Produce Queue artifacts
        id: artifact
        shell: bash
        run: |
          git config user.name "joinwell52 Research Runtime"
          git config user.email "actions@users.noreply.github.com"

          success=0
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')

          const date = '2026-08-05'
          const startedAt = '2026-08-05T10:01:51+08:00'
          const intelligencePath = 'research/intelligence/runs/2026/08/2026-08-05-intelligence.json'
          const recordPath = 'research/runtime/records/daily/2026/08/2026-08-05-daily-runtime.json'
          const planPath = 'research/runtime/plans/2026/08/2026-08-05-plan.json'

          const read = (file) => JSON.parse(fs.readFileSync(file, 'utf8'))
          const write = (file, value) => {
            fs.mkdirSync(path.dirname(file), { recursive: true })
            fs.writeFileSync(file, `${JSON.stringify(value, null, 2)}\n`)
          }
          const shanghaiNow = () => {
            const parts = Object.fromEntries(new Intl.DateTimeFormat('en-CA', {
              timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit',
              hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23'
            }).formatToParts(new Date()).map((part) => [part.type, part.value]))
            return `${parts.year}-${parts.month}-${parts.day}T${parts.hour}:${parts.minute}:${parts.second}+08:00`
          }
          const now = shanghaiNow()

          const intelligence = read(intelligencePath)
          const record = read(recordPath)
          const discoveryComplete = record.results?.discovery?.status === 'Completed'
          const pipelinesComplete = intelligence.pipelines?.length === 3 && intelligence.pipelines.every((item) => item.status === 'Completed')
          if (!discoveryComplete || !pipelinesComplete) {
            throw new Error('Discovery input gate is incomplete; Queue must not invent a plan.')
          }

          const signalById = new Map(intelligence.signals.map((signal) => [signal.id, signal]))
          const selected = [
            {
              id: 'digital-employee', label: 'Digital Employee', label_zh: '数字员工',
              itemId: 'Q-20260805-12', signalId: 'SIG-20260805-R-003', priority: 'P0',
              title: 'Verifiable completion for computer-use Digital Employees',
              title_zh: '计算机操作型数字员工的可验证完成机制',
              lifecycle: 'Selected', pipelineOrigin: 'published-research',
              source: 'Microsoft Research — The Art of Building Verifiers for Computer-Use Agents',
              source_zh: 'Microsoft Research《为计算机操作 Agent 构建验证器的艺术》',
              sourceUrl: 'https://www.microsoft.com/en-us/research/publication/the-art-of-building-verifiers-for-computer-use-agents/',
              evidenceLevels: ['peer_reviewed_or_primary_research'],
              secondaryColumns: ['open-source-engineering'],
              researchQuestion: 'How should a Digital Employee runtime separate process verification, outcome verification, and controllable versus uncontrollable failure so that completion is independently auditable and false positives remain bounded?',
              researchQuestion_zh: '数字员工运行时应如何分离过程验证、结果验证以及可控与不可控失败，使完成结果可独立审计并限制误报？',
              reason: 'The primary research exposes a bounded completion-governance problem at the core of Digital Employee work: independent verification, process/outcome separation, failure attribution and false-positive control. It directly informs TMPA evidence envelopes and CodeFlowMu completion gates.',
              reason_zh: '该主要研究揭示了数字员工工作的核心完成治理问题：独立验证、过程与结果分离、失败归因及误报控制。它可直接支撑 TMPA 证据封装与 CodeFlowMu 完成门禁。',
              next: 'Execute Skill 03 Deep Reading on the verifier methodology, evaluation set, agreement and false-positive measurements, process/outcome separation, failure taxonomy and applicability limits.',
              next_zh: '执行 Skill 03 深度阅读，核查验证器方法、评估集、一致性与误报指标、过程/结果分离、失败分类及适用边界。',
              proposedCategory: 'Digital Employee Evaluation and Completion Governance',
              nextSkill: '03 Deep Reading',
              scores: { columnRelevance: 5, directionRelevance: 5, tmpaRelevance: 5, digitalEmployeeRelevance: 5, codeFlowMuRelevance: 4, engineeringValue: 4, novelInformation: 4, sourceQuality: 5, crossSourceSupport: 3, boundedQuestion: 5 },
              totalScore: 45
            },
            {
              id: 'industry-architecture', label: 'Industry Architecture', label_zh: '行业架构',
              itemId: 'Q-20260805-13', signalId: 'SIG-20260805-P-004', priority: 'P1',
              title: 'Governed task-aware model routing for enterprise agent runtimes',
              title_zh: '企业 Agent 运行时的受治理任务感知模型路由',
              lifecycle: 'Selected', pipelineOrigin: 'ai-platform',
              source: 'Cursor Router official changelog',
              source_zh: 'Cursor Router 官方更新日志',
              sourceUrl: 'https://cursor.com/changelog/router',
              evidenceLevels: ['official_announcement'],
              secondaryColumns: ['digital-employee', 'open-source-engineering'],
              crossSourceSupport: ['SIG-20260805-P-001', 'SIG-20260805-P-006', 'SIG-20260805-P-007'],
              researchQuestion: 'How should an enterprise agent runtime route models by task type, complexity, cost and intelligence while preserving team defaults, allow/block policy, enforceable restrictions and migration under model retirement?',
              researchQuestion_zh: '企业 Agent 运行时应如何依据任务类型、复杂度、成本与智能水平进行模型路由，同时保持团队默认值、允许/阻止策略、可执行限制以及模型退役时的迁移能力？',
              reason: 'Cursor Router provides a concrete and testable architecture for task classification, model routing and enterprise controls. Official model-retirement and managed-settings signals provide cross-source support, turning the object into a bounded runtime-governance question rather than a product announcement.',
              reason_zh: 'Cursor Router 提供了任务分类、模型路由与企业控制的具体可测试架构；官方模型退役和托管设置证据形成跨来源支持，使其成为边界明确的运行时治理问题，而非普通产品公告。',
              next: 'Execute Skill 03 Deep Reading on routing inputs, policy precedence, enforcement boundaries, observability, fallback and migration behavior using the primary Router source and supporting official controls.',
              next_zh: '执行 Skill 03 深度阅读，基于 Router 主要来源及相关官方控制证据，核查路由输入、策略优先级、执行边界、可观测性、回退与迁移行为。',
              proposedCategory: 'Enterprise Agent Runtime Architecture',
              nextSkill: '03 Deep Reading',
              scores: { columnRelevance: 5, directionRelevance: 5, tmpaRelevance: 4, digitalEmployeeRelevance: 4, codeFlowMuRelevance: 5, engineeringValue: 5, novelInformation: 4, sourceQuality: 5, crossSourceSupport: 4, boundedQuestion: 5 },
              totalScore: 46
            },
            {
              id: 'open-source-engineering', label: 'Open-source Engineering', label_zh: '开源工程',
              itemId: 'Q-20260805-14', signalId: 'SIG-20260805-G-002', priority: 'P0',
              title: 'Persist governed session state only after output guardrails complete',
              title_zh: '仅在输出门禁完成后持久化受治理会话状态',
              lifecycle: 'Selected', pipelineOrigin: 'github-engineering',
              source: 'openai/openai-agents-python commit 69e26269f52a1fde684154376d77e5a21b507c19',
              source_zh: 'openai/openai-agents-python 提交 69e26269f52a1fde684154376d77e5a21b507c19',
              sourceUrl: 'https://github.com/openai/openai-agents-python/commit/69e26269f52a1fde684154376d77e5a21b507c19',
              evidenceLevels: ['merged_maintainer_change'],
              secondaryColumns: ['digital-employee'],
              crossSourceSupport: ['SIG-20260805-G-001', 'SIG-20260805-G-004', 'SIG-20260805-R-003'],
              researchQuestion: 'What completion-ordering invariant should an agent runtime enforce so that durable session state is written only after output guardrails accept the outcome, including interruption and resume behavior?',
              researchQuestion_zh: 'Agent 运行时应执行怎样的完成顺序不变量，确保只有输出门禁接受结果后才写入持久会话状态，并覆盖中断与恢复行为？',
              reason: 'The maintainer change exposes a precise implementation invariant: durable state must represent the governed outcome, not a provisional result. The mechanism is directly reproducible and relevant to TMPA evidence order, CodeFlowMu completion semantics and Digital Employee recovery.',
              reason_zh: '该维护者变更揭示了精确的实现不变量：持久状态必须代表受治理的最终结果，而非临时结果。该机制可直接复现，并关联 TMPA 证据顺序、CodeFlowMu 完成语义与数字员工恢复。',
              next: 'Execute Skill 03 Deep Reading on the commit diff, tests, non-stream and stream ordering, output-guardrail failure paths, persistence semantics and recovery implications.',
              next_zh: '执行 Skill 03 深度阅读，核查提交差异、测试、非流式与流式顺序、输出门禁失败路径、持久化语义及恢复影响。',
              proposedCategory: 'Agent Runtime State and Guardrail Ordering',
              nextSkill: '03 Deep Reading',
              scores: { columnRelevance: 5, directionRelevance: 5, tmpaRelevance: 5, digitalEmployeeRelevance: 4, codeFlowMuRelevance: 5, engineeringValue: 5, novelInformation: 5, sourceQuality: 5, crossSourceSupport: 4, boundedQuestion: 5 },
              totalScore: 48
            }
          ]

          for (const decision of selected) {
            if (!signalById.has(decision.signalId)) throw new Error(`Missing selected signal ${decision.signalId}`)
          }

          const plan = {
            schema: 'runtime-column-plan/v1', date, timezone: 'Asia/Shanghai', status: 'Completed',
            sourceTask: 'Research Runtime Queue', sourceRecord: recordPath, updatedAt: now,
            githubCommit: 'pending',
            columns: selected.map((item) => ({ selectionStatus: 'Selected', ...item }))
          }
          write(planPath, plan)

          const selectedIds = new Set(selected.map((item) => item.signalId))
          const rejectedIds = new Set(['SIG-20260805-P-002'])
          intelligence.signals = intelligence.signals.map((signal) => ({
            ...signal,
            triageStatus: selectedIds.has(signal.id) ? 'selected' : rejectedIds.has(signal.id) ? 'rejected' : 'candidate',
            ...(selectedIds.has(signal.id) ? { queueItemId: selected.find((item) => item.signalId === signal.id).itemId } : {})
          }))
          for (const pipeline of intelligence.pipelines) {
            const signals = intelligence.signals.filter((signal) => signal.pipeline === pipeline.id)
            pipeline.candidates = signals.filter((signal) => signal.triageStatus === 'candidate').length
            pipeline.selected = signals.filter((signal) => signal.triageStatus === 'selected').length
            pipeline.rejected = signals.filter((signal) => signal.triageStatus === 'rejected').length
          }
          const candidateCounts = { 'digital-employee': 3, 'industry-architecture': 4, 'open-source-engineering': 5 }
          const signalCounts = { 'digital-employee': 5, 'industry-architecture': 5, 'open-source-engineering': 6 }
          intelligence.columns = selected.map((item) => ({
            id: item.id, label: item.label, label_zh: item.label_zh, decision: 'Selected',
            signals: signalCounts[item.id], candidates: candidateCounts[item.id],
            selectedItemId: item.itemId, selectedTitle: item.title, selectedTitle_zh: item.title_zh,
            reason: item.reason, reason_zh: item.reason_zh,
            priority: item.priority, signalId: item.signalId, source: item.sourceUrl,
            next: item.next, next_zh: item.next_zh
          }))
          intelligence.status = 'Completed'
          intelligence.sourceTask = 'Research Runtime Queue'
          intelligence.updatedAt = now
          intelligence.githubCommit = 'pending'
          intelligence.commitVerify = 'Waiting'
          intelligence.verifiedAt = ''
          intelligence.reason = 'Queue completed Skill 02 triage: three bounded objects were selected, one for each column; remaining signals were retained as candidates or rejected without performing research.'
          intelligence.reason_zh = 'Queue 已完成 Skill 02 筛选：三个栏目各选出一个边界明确的对象；其余信号保留为候选或被拒绝，未开展研究。'
          write(intelligencePath, intelligence)

          const queueResult = {
            schema: 'runtime-shift-result/v2', task: 'queue', status: 'Completed',
            input: 'The completed 2026-08-05 Signal Pool containing 16 deduplicated signals: 7 AI-platform, 6 GitHub-engineering and 3 published-research signals.',
            input_zh: '已完成的 2026-08-05 Signal Pool，共 16 个去重信号：7 个 AI 平台、6 个 GitHub 工程及 3 个论文研究信号。',
            workResult: 'Executed Skill 02 only. Scored and classified all 16 signals, retained 12 as candidates or cross-source support, rejected 1 weak standalone object, and selected exactly one bounded primary object for each of the three columns.',
            workResult_zh: '仅执行 Skill 02。已对 16 个信号完成评分与分类，保留 12 个候选或跨来源支持信号，拒绝 1 个独立研究价值不足的对象，并为三个栏目各选出 1 个边界明确的主要对象。',
            output: "Today's Research Plan with three Selected decisions: verifiable completion for computer-use Digital Employees; governed task-aware model routing; and guardrail-before-persistence session ordering.",
            output_zh: '已形成今日研究计划，三个栏目均为 Selected：计算机操作型数字员工的可验证完成机制、受治理的任务感知模型路由，以及输出门禁先于会话持久化的顺序机制。',
            next: 'Research Runtime Reading at 11:00 may consume only Q-20260805-12, Q-20260805-13 and Q-20260805-14 and must execute Skill 03 Deep Reading without analysis or article drafting.',
            next_zh: '11:00 Research Runtime Reading 只能消费 Q-20260805-12、Q-20260805-13 与 Q-20260805-14，并仅执行 Skill 03 深度阅读，不得分析或撰写文章。',
            metrics: [
              { label: 'Signal Pool', label_zh: '信号池', value: '16' },
              { label: 'Column decisions', label_zh: '栏目决定', value: '3 / 3' },
              { label: 'Selected objects', label_zh: '已选对象', value: '3' },
              { label: 'Candidate/supporting signals', label_zh: '候选/支持信号', value: '12' },
              { label: 'Rejected standalone signals', label_zh: '拒绝的独立信号', value: '1' },
              { label: 'No Selection decisions', label_zh: '未选题决定', value: '0' }
            ],
            evidence: [
              { label: 'Scheduler V3.0', label_zh: 'Scheduler V3.0', source: 'research/runtime/SCHEDULER.json' },
              { label: '2026-08-05 Signal Pool', label_zh: '2026-08-05 信号池', source: intelligencePath },
              { label: 'Skill 02 Three-Column Research Triage', label_zh: 'Skill 02 三栏研究筛选', source: 'research/skills/02-research-triage.md' },
              { label: 'Runtime Column Plan Contract', label_zh: 'Runtime 栏目计划契约', source: 'research/runtime/COLUMN-PLAN-SCHEMA.md' }
            ],
            artifacts: [
              { label: "Today's Research Plan", label_zh: '今日研究计划', path: planPath },
              { label: 'Triaged Research Intelligence run', label_zh: '已筛选的研究情报运行记录', path: intelligencePath }
            ]
          }

          record.status = 'Running'
          record.taskStatus.queue = 'Completed'
          record.results.queue = queueResult
          if (!record.timeline.some((entry) => entry.task === 'queue' && entry.event === 'Execution Slot Opened')) {
            record.timeline.push({ time: startedAt, task: 'queue', event: 'Execution Slot Opened', status: 'Running', detail: 'Research Runtime Queue execution started.' })
          }
          record.timeline = record.timeline.filter((entry) => !(entry.task === 'queue' && ['Queue Completed', 'GitHub Commit Verified'].includes(entry.event)))
          record.timeline.push({ time: now, task: 'queue', event: 'Queue Completed', status: 'Completed', detail: "Skill 02 completed; three explicit Selected decisions and Today's Research Plan were persisted." })
          const queueMetricLabels = new Set(queueResult.metrics.map((item) => item.label))
          record.metrics = [...(record.metrics || []).filter((item) => !queueMetricLabels.has(item.label)), ...queueResult.metrics]
          const evidenceSources = new Set(queueResult.evidence.map((item) => item.source))
          record.evidence = [...(record.evidence || []).filter((item) => !evidenceSources.has(item.source)), ...queueResult.evidence]
          const artifactPaths = new Set(queueResult.artifacts.map((item) => item.path))
          record.artifacts = [...(record.artifacts || []).filter((item) => !artifactPaths.has(item.path)), ...queueResult.artifacts]
          record.githubCommit = 'pending'
          record.commitVerify = 'Waiting'
          record.updatedAt = now
          write(recordPath, record)
          NODE

            node scripts/runtime-v5.mjs validate
            node scripts/research-intelligence.mjs validate
            git add research/runtime/plans/2026/08/2026-08-05-plan.json \
                    research/intelligence/runs/2026/08/2026-08-05-intelligence.json \
                    research/runtime/records/daily/2026/08/2026-08-05-daily-runtime.json
            git commit -m "runtime(queue): complete 2026-08-05 three-column triage"
            if git push origin HEAD:main; then
              artifact_sha=$(git rev-parse HEAD)
              echo "artifact_sha=$artifact_sha" >> "$GITHUB_OUTPUT"
              success=1
              break
            fi
            sleep $((attempt * 5))
          done

          if [[ "$success" -ne 1 ]]; then
            echo "Unable to publish Queue artifacts after three attempts."
            exit 1
          fi

      - name: Verify commit and record verification
        shell: bash
        env:
          ARTIFACT_SHA: ${{ steps.artifact.outputs.artifact_sha }}
        run: |
          git cat-file -e "$ARTIFACT_SHA^{commit}"
          changed=$(git show --name-only --format='' "$ARTIFACT_SHA")
          grep -q 'research/runtime/plans/2026/08/2026-08-05-plan.json' <<< "$changed"
          grep -q 'research/intelligence/runs/2026/08/2026-08-05-intelligence.json' <<< "$changed"
          grep -q 'research/runtime/records/daily/2026/08/2026-08-05-daily-runtime.json' <<< "$changed"

          success=0
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            node <<'NODE'
          const fs = require('node:fs')
          const artifactSha = process.env.ARTIFACT_SHA
          const intelligencePath = 'research/intelligence/runs/2026/08/2026-08-05-intelligence.json'
          const recordPath = 'research/runtime/records/daily/2026/08/2026-08-05-daily-runtime.json'
          const planPath = 'research/runtime/plans/2026/08/2026-08-05-plan.json'
          const read = (file) => JSON.parse(fs.readFileSync(file, 'utf8'))
          const write = (file, value) => fs.writeFileSync(file, `${JSON.stringify(value, null, 2)}\n`)
          const parts = Object.fromEntries(new Intl.DateTimeFormat('en-CA', {
            timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit',
            hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23'
          }).formatToParts(new Date()).map((part) => [part.type, part.value]))
          const now = `${parts.year}-${parts.month}-${parts.day}T${parts.hour}:${parts.minute}:${parts.second}+08:00`

          const plan = read(planPath)
          plan.githubCommit = artifactSha
          plan.updatedAt = now
          write(planPath, plan)

          const intelligence = read(intelligencePath)
          intelligence.githubCommit = artifactSha
          intelligence.commitVerify = 'Completed'
          intelligence.verifiedAt = now
          intelligence.updatedAt = now
          write(intelligencePath, intelligence)

          const record = read(recordPath)
          const commitArtifact = { label: 'Verified Queue commit', label_zh: '已验证的 Queue 提交', commit: artifactSha }
          record.results.queue.artifacts = [...record.results.queue.artifacts.filter((item) => item.label !== commitArtifact.label), commitArtifact]
          record.artifacts = [...record.artifacts.filter((item) => item.label !== commitArtifact.label), commitArtifact]
          record.githubCommit = artifactSha
          record.commitVerify = 'Completed'
          record.updatedAt = now
          record.timeline = record.timeline.filter((entry) => !(entry.task === 'queue' && entry.event === 'GitHub Commit Verified'))
          record.timeline.push({ time: now, task: 'queue', event: 'GitHub Commit Verified', status: 'Completed', detail: `Fetched and verified commit ${artifactSha} containing the Queue result, triaged intelligence and Today's Research Plan.` })
          write(recordPath, record)
          NODE

            rm -f .github/workflows/run-queue-2026-08-05.yml
            node scripts/runtime-v5.mjs validate
            node scripts/research-intelligence.mjs validate
            git add -A
            git commit -m "runtime(queue): verify 2026-08-05 Queue artifacts"
            if git push origin HEAD:main; then
              echo "final_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              success=1
              break
            fi
            sleep $((attempt * 5))
          done

          if [[ "$success" -ne 1 ]]; then
            echo "Unable to publish Queue verification after three attempts."
            exit 1
          fi
