name: Consolidate Runtime Styles

on:
  push:
    branches:
      - runtime-style-consolidation

permissions:
  contents: write

jobs:
  consolidate-verify-capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: runtime-style-consolidation
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Consolidate styles
        run: python scripts/consolidate-runtime-styles.py

      - name: Install dependencies
        run: npm install

      - name: Validate and build
        run: |
          npm run runtime:validate
          npm run docs:build

      - name: Install visual test browser
        run: npm install --no-save playwright@1.55.0 && npx playwright install --with-deps chromium

      - name: Capture visual checks
        run: |
          mkdir -p /tmp/runtime-site
          ln -s "$GITHUB_WORKSPACE/docs/.vitepress/dist" /tmp/runtime-site/joinwell52
          nohup python3 -m http.server 4173 --directory /tmp/runtime-site >/tmp/runtime-style-server.log 2>&1 &
          sleep 2
          cat > runtime-style-check.mjs <<'JS'
          import { chromium } from 'playwright'
          const browser = await chromium.launch({ headless: true })
          for (const mode of ['light','dark']) {
            const page = await browser.newPage({ viewport: { width: 1440, height: 1200 }, colorScheme: mode })
            await page.goto('http://127.0.0.1:4173/joinwell52/zh/runtime/', { waitUntil: 'networkidle' })
            await page.evaluate((value) => document.documentElement.classList.toggle('dark', value === 'dark'), mode)
            await page.waitForTimeout(300)
            const runtime = page.locator('.runtime-classic')
            const radar = page.locator('.intel-radar')
            if (await runtime.count() !== 1 || await radar.count() !== 1) throw new Error('Runtime or Radar missing')
            const runtimePanel = await runtime.locator('.panel').first().evaluate((el) => getComputedStyle(el).backgroundImage)
            const radarPanel = await radar.locator('.panel').first().evaluate((el) => getComputedStyle(el).backgroundImage)
            if (runtimePanel !== radarPanel) throw new Error(`panel theme mismatch in ${mode}`)
            const timeBox = await runtime.locator('.shift-head time').first().boundingBox()
            if (!timeBox || timeBox.height < 34) throw new Error(`shift time not emphasized in ${mode}`)
            await page.screenshot({ path: `runtime-consolidated-${mode}.png`, fullPage: true })
            await page.close()
          }
          await browser.close()
          JS
          node runtime-style-check.mjs

      - name: Upload visual checks
        uses: actions/upload-artifact@v4
        with:
          name: runtime-style-consolidation-previews
          path: runtime-consolidated-*.png

      - name: Commit verified consolidation
        run: |
          git config user.name "joinwell52 Research Runtime"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/consolidate-runtime-styles.yml scripts/consolidate-runtime-styles.py
          git add docs/.vitepress/theme/components/RuntimeOperationsCenterClassic.vue \
                  docs/.vitepress/theme/components/ResearchIntelligenceRadar.vue \
                  docs/.vitepress/theme/runtime-operations.css \
                  docs/zh/runtime/index.md docs/en/runtime/index.md
          git add -u docs/.vitepress/theme/runtime-bilingual-title.css
          git commit -m "refactor(runtime): consolidate operations and radar styling"
          git push origin HEAD:runtime-style-consolidation
