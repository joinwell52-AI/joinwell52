name: Validate Research Center 3.0

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate Runtime Center
        run: npm run runtime:validate

      - name: Enforce Runtime publication gate
        if: github.event_name == 'pull_request'
        env:
          RUNTIME_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run runtime:gate -- --base "$RUNTIME_BASE_SHA"

      - name: Build VitePress site
        run: npm run docs:build
