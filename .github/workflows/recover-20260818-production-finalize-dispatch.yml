name: Recover 2026-08-18 Production Finalization Dispatch

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: recover-20260818-production-finalize-dispatch
  cancel-in-progress: true

jobs:
  dispatch:
    if: github.repository == 'joinwell52-AI/joinwell52'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Refresh main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Dispatch official finalization when recovery proof is durable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$(TZ=Asia/Shanghai date +%F)" != "2026-08-18" ]]; then exit 0; fi
          needed="$(node - <<'NODE'
          const fs = require('fs')
          const record = JSON.parse(fs.readFileSync('research/runtime/records/daily/2026/08/2026-08-18-daily-runtime.json','utf8'))
          let checkpoint = null
          let result = null
          try { checkpoint = JSON.parse(fs.readFileSync('research/runtime/checkpoints/2026/08/2026-08-18-production.json','utf8')) } catch {}
          try { result = JSON.parse(fs.readFileSync('research/runtime/results/2026/08/2026-08-18-production-result.json','utf8')) } catch {}
          process.stdout.write(String(record.taskStatus?.production === 'Running' && checkpoint?.node === 'validators-passed' && checkpoint?.status === 'Completed' && result?.status === 'Completed' && result?.runtimeDate === '2026-08-18'))
          NODE
          )"
          if [[ "$needed" != "true" ]]; then
            echo "Official finalization not yet needed or already closed."
            exit 0
          fi
          node --input-type=module <<'NODE'
          const url = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/actions/workflows/research-runtime-shift-completion.yml/dispatches`
          const response = await fetch(url, {
            method: 'POST',
            headers: {
              authorization: `Bearer ${process.env.GH_TOKEN}`,
              accept: 'application/vnd.github+json',
              'x-github-api-version': '2022-11-28',
              'content-type': 'application/json'
            },
            body: JSON.stringify({
              ref: 'main',
              inputs: {
                runtime_task: 'production',
                runtime_date: '2026-08-18',
                result_path: 'research/runtime/results/2026/08/2026-08-18-production-result.json',
                allow_historical: 'false'
              }
            })
          })
          if (!response.ok) throw new Error(`Finalization dispatch failed ${response.status}: ${await response.text()}`)
          console.log('Dispatched Research Runtime Shift Finalization V2.1.')
          NODE
