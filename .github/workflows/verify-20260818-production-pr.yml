name: Verify 2026-08-18 Production via PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: verify-20260818-production-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    if: startsWith(github.event.pull_request.head.ref, 'recovery/2026-08-18-production-verify')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify durable terminal commit exists on main
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          COMPLETION_COMMIT=2b7d7959e747fbefe887d5092ffbe2336400ec59
          git fetch origin main
          git merge-base --is-ancestor "$COMPLETION_COMMIT" origin/main
          node <<'NODE'
          const fs = require('fs')
          const record = JSON.parse(fs.readFileSync('research/runtime/records/daily/2026/08/2026-08-18-daily-runtime.json','utf8'))
          const result = record.results?.production
          const needed = record.taskStatus?.production === 'Completed' && result?.status === 'Completed' && record.commitVerify !== 'Completed'
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `needed=${needed}\n`)
          console.log(`needed=${needed}; production=${record.taskStatus?.production}; commitVerify=${record.commitVerify}`)
          NODE

      - name: Install validation dependencies
        if: steps.guard.outputs.needed == 'true'
        run: npm ci

      - name: Record GitHub Commit Verified and revalidate runtime
        if: steps.guard.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          COMPLETION_COMMIT=2b7d7959e747fbefe887d5092ffbe2336400ec59
          node scripts/runtime-shift-verify.mjs --task production --date 2026-08-18 --commit "$COMPLETION_COMMIT" --allow-historical false
          node scripts/runtime-markdown.mjs render --date 2026-08-18
          npm run runtime:validate
          node scripts/runtime-markdown.mjs validate --date 2026-08-18

      - name: Commit verification to PR branch
        if: steps.guard.outputs.needed == 'true'
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'joinwell52 Research Runtime'
          git config user.email 'actions@users.noreply.github.com'
          git add research/runtime/records research/runtime/[0-9][0-9][0-9][0-9] || true
          if git diff --cached --quiet; then
            echo 'No verification changes to commit.'
            exit 1
          fi
          git commit -m 'runtime(production): verify recovered 2026-08-18 main commit'
          git push origin "HEAD:${HEAD_BRANCH}"
