name: Runtime Publication Start 2026-08-07 Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/runtime-publication-start-20260807-once.yml

permissions:
  contents: write

jobs:
  persist-start:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Persist exactly one Publication start state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          DATE = '2026-08-07'
          path = Path('research/runtime/records/daily/2026/08/2026-08-07-daily-runtime.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          timeline = data.setdefault('timeline', [])
          starts = [
              event for event in timeline
              if event.get('task') == 'publication'
              and event.get('event') == 'Execution Slot Opened'
              and event.get('status') == 'Running'
              and str(event.get('time', '')).startswith(f'{DATE}T')
          ]
          if len(starts) != 0:
              raise SystemExit(f'expected zero existing publication start events before fallback, found {len(starts)}')
          if data.get('status') != 'Waiting':
              raise SystemExit(f"unexpected overall status: {data.get('status')}")
          if data.get('taskStatus', {}).get('publication') != 'Waiting':
              raise SystemExit(f"unexpected publication status: {data.get('taskStatus', {}).get('publication')}")
          if data.get('results', {}).get('production', {}).get('status') != 'Completed':
              raise SystemExit('Production is not Completed')

          now = datetime.now(ZoneInfo('Asia/Shanghai')).isoformat(timespec='seconds')
          data['status'] = 'Running'
          data['taskStatus']['publication'] = 'Running'
          timeline.append({
              'time': now,
              'task': 'publication',
              'event': 'Execution Slot Opened',
              'status': 'Running',
              'detail': 'Scheduler fallback: Research Runtime Publication opened because the durable control-plane Running state was absent; release work may begin only after this synchronized JSON and Markdown state is committed and verified.'
          })
          data['githubCommit'] = 'pending'
          data['commitVerify'] = 'Waiting'
          data['updatedAt'] = now
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          node scripts/runtime-markdown.mjs render --date 2026-08-07
          node scripts/runtime-markdown.mjs validate --date 2026-08-07

          python - <<'PY'
          import json
          from pathlib import Path
          DATE = '2026-08-07'
          data = json.loads(Path('research/runtime/records/daily/2026/08/2026-08-07-daily-runtime.json').read_text(encoding='utf-8'))
          starts = [e for e in data['timeline'] if e.get('task') == 'publication' and e.get('event') == 'Execution Slot Opened' and e.get('status') == 'Running' and str(e.get('time', '')).startswith(f'{DATE}T')]
          assert data['status'] == 'Running'
          assert data['taskStatus']['publication'] == 'Running'
          assert len(starts) == 1
          assert 'publication' not in data.get('results', {})
          markdown = Path('research/runtime/2026/08/2026-08-07-runtime.md').read_text(encoding='utf-8')
          assert 'overall_status: "Running"' in markdown
          assert '| 20:00 | 研究运行发布 | Research Runtime Publication | daily | 工作中 / Running |' in markdown
          assert markdown.count('Research Runtime Publication | daily | Execution Slot Opened | 工作中 / Running') == 1
          PY

      - name: Commit fallback start state and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/runtime-publication-start-20260807-once.yml
          git config user.name "joinwell52 Research Runtime"
          git config user.email "actions@users.noreply.github.com"
          git add research/runtime/records/daily/2026/08/2026-08-07-daily-runtime.json \
            research/runtime/2026/08/2026-08-07-runtime.md \
            .github/workflows/runtime-publication-start-20260807-once.yml
          git commit -m "runtime(publication): open 2026-08-07 execution slot by scheduler fallback"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
