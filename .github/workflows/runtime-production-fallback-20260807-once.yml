name: Runtime Production Fallback 2026-08-07 Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/runtime-production-fallback-20260807-once.yml

permissions:
  contents: write

concurrency:
  group: runtime-production-fallback-20260807
  cancel-in-progress: false

jobs:
  persist-running:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Synchronize with main and inspect control-plane state
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          node <<'NODE'
          const fs = require('fs')
          const recordPath = 'research/runtime/records/daily/2026/08/2026-08-07-daily-runtime.json'
          const record = JSON.parse(fs.readFileSync(recordPath, 'utf8'))
          const opened = (record.timeline || []).filter((event) =>
            event.task === 'production' &&
            event.event === 'Execution Slot Opened' &&
            event.status === 'Running' &&
            String(event.time || '').startsWith('2026-08-07')
          )
          if (opened.length > 1) throw new Error(`Duplicate Production start events: ${opened.length}`)
          const valid = record.status === 'Running' && record.taskStatus?.production === 'Running' && opened.length === 1
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `fallback_needed=${valid ? 'false' : 'true'}\n`)
          console.log(valid
            ? 'Scheduler Running state is already durable; fallback will not append a start event.'
            : `Scheduler fallback required: status=${record.status}, production=${record.taskStatus?.production}, opened=${opened.length}`)
          NODE

      - name: Persist missing Production Running state
        if: steps.inspect.outputs.fallback_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/runtime-v5.mjs schedule --task production
          node scripts/runtime-markdown.mjs render --date 2026-08-07
          npm run runtime:validate
          node scripts/runtime-markdown.mjs validate --date 2026-08-07

      - name: Verify exactly one durable start event in worktree
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs')
          const record = JSON.parse(fs.readFileSync('research/runtime/records/daily/2026/08/2026-08-07-daily-runtime.json', 'utf8'))
          const opened = (record.timeline || []).filter((event) =>
            event.task === 'production' &&
            event.event === 'Execution Slot Opened' &&
            event.status === 'Running' &&
            String(event.time || '').startsWith('2026-08-07')
          )
          if (record.status !== 'Running') throw new Error(`Expected overall Running, got ${record.status}`)
          if (record.taskStatus?.production !== 'Running') throw new Error(`Expected taskStatus.production=Running, got ${record.taskStatus?.production}`)
          if (opened.length !== 1) throw new Error(`Expected exactly one Production start event, got ${opened.length}`)
          const md = fs.readFileSync('research/runtime/2026/08/2026-08-07-runtime.md', 'utf8')
          if (!md.includes('Production') || !md.includes('Running')) throw new Error('Markdown ledger does not expose Production Running state')
          console.log('Verified synchronized JSON and Markdown Production Running state.')
          NODE

      - name: Commit fallback state once and remove workflow
        shell: bash
        env:
          FALLBACK_NEEDED: ${{ steps.inspect.outputs.fallback_needed }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/runtime-production-fallback-20260807-once.yml
          git config user.name "joinwell52 Research Runtime"
          git config user.email "actions@users.noreply.github.com"
          git add research/runtime/records/daily/2026/08/2026-08-07-daily-runtime.json \
            research/runtime/2026/08/2026-08-07-runtime.md \
            .github/workflows/runtime-production-fallback-20260807-once.yml
          if [[ "$FALLBACK_NEEDED" == "true" ]]; then
            git commit -m "runtime(v5): scheduler fallback opens Production for 2026-08-07"
          else
            git commit -m "chore(runtime): remove unused Production fallback workflow"
          fi
          git push origin HEAD:main
