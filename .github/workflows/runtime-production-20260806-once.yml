      - name: Validate candidates, Runtime and site build
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs')
          const batch = JSON.parse(fs.readFileSync('research/runtime/candidates/2026/08/2026-08-06-candidates.json', 'utf8'))
          if (batch.status !== 'Completed' || batch.candidates.length !== 3) throw new Error('Candidate batch must be Completed with exactly three candidates')
          for (const candidate of batch.candidates) {
            for (const key of ['zhPath', 'enPath', 'coverPath']) {
              if (!fs.existsSync(candidate[key])) throw new Error(`Missing ${key}: ${candidate[key]}`)
            }
            if (candidate.evidenceStatus !== 'Completed' || candidate.editingStatus !== 'Completed') throw new Error(`Candidate gate incomplete: ${candidate.itemId}`)
            for (const p of [candidate.zhPath, candidate.enPath]) {
              const text = fs.readFileSync(p, 'utf8')
              for (const required of ['publication_authorized: false', 'evidence_status: "Completed"', 'citation_status: "Completed"', 'editing_status: "Completed"']) {
                if (!text.includes(required)) throw new Error(`${p} missing ${required}`)
              }
            }
          }
          const record = JSON.parse(fs.readFileSync('research/runtime/records/daily/2026/08/2026-08-06-daily-runtime.json', 'utf8'))
          if (record.taskStatus.production !== 'Completed' || record.results.production?.schema !== 'runtime-shift-result/v2') throw new Error('Production result is incomplete')
          const opened = record.timeline.filter((e) => e.task === 'production' && e.event === 'Execution Slot Opened' && e.status === 'Running')
          if (opened.length !== 1) throw new Error(`Expected one Production start event, got ${opened.length}`)
          console.log('Candidate and Runtime contracts validated.')
          NODE
          npm ci
          npm run runtime:validate
          node scripts/runtime-markdown.mjs validate --date 2026-08-06
          npm run docs:build
          git restore docs/.vitepress/generated || true
          git diff --check

