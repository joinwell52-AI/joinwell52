            research/runtime/records/daily/2026/08/2026-08-06-daily-runtime.json \
            research/runtime/2026/08/2026-08-06-runtime.md \
            .github/workflows/runtime-production-20260806-once.yml
          git commit -m "runtime(production): verify 2026-08-06 durable artifacts"
          verification_sha="$(git rev-parse HEAD)"
          git push origin HEAD:main
          echo "verification_sha=$verification_sha" >> "$GITHUB_OUTPUT"

      - name: Fetch and verify final verification commit
        shell: bash
        env:
          VERIFICATION_SHA: ${{ steps.verification.outputs.verification_sha }}
          DURABLE_SHA: ${{ steps.durable.outputs.durable_sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$VERIFICATION_SHA" origin/main
          git show "$VERIFICATION_SHA:research/runtime/records/daily/2026/08/2026-08-06-daily-runtime.json" >/tmp/runtime-final.json
          git show "$VERIFICATION_SHA:research/runtime/2026/08/2026-08-06-runtime.md" >/tmp/runtime-final.md
          git show "$VERIFICATION_SHA:research/runtime/candidates/2026/08/2026-08-06-candidates.json" >/tmp/candidates-final.json
          DURABLE_SHA="$DURABLE_SHA" node <<'NODE'
          const fs = require('fs')
          const record = JSON.parse(fs.readFileSync('/tmp/runtime-final.json', 'utf8'))
          const batch = JSON.parse(fs.readFileSync('/tmp/candidates-final.json', 'utf8'))
          const opened = record.timeline.filter((e) => e.task === 'production' && e.event === 'Execution Slot Opened' && e.status === 'Running')
          const completed = record.timeline.filter((e) => e.task === 'production' && e.event === 'Production Completed' && e.status === 'Completed')
          const verified = record.timeline.filter((e) => e.task === 'production' && e.event === 'GitHub Commit Verified' && e.status === 'Completed')
          if (record.taskStatus.production !== 'Completed' || record.results.production?.status !== 'Completed') throw new Error('Final Production status is not Completed')
          if (record.commitVerify !== 'Completed' || record.githubCommit !== process.env.DURABLE_SHA) throw new Error('Final commit verification fields are incorrect')
          if (opened.length !== 1 || completed.length !== 1 || verified.length !== 1) throw new Error('Final Production timeline cardinality is incorrect')
          if (batch.status !== 'Completed' || batch.githubCommit !== process.env.DURABLE_SHA || batch.candidates.length !== 3) throw new Error('Final candidate batch is incorrect')
          const md = fs.readFileSync('/tmp/runtime-final.md', 'utf8')
          if (!md.includes('Research Runtime Production') || !md.includes('Completed')) throw new Error('Final Markdown ledger is not synchronized')
          console.log('Final verification commit confirmed: Production Completed with verified artifacts and no duplicate start event.')
          NODE
