name: Complete Research Runtime Production 2026-08-06 Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/runtime-production-20260806-once.yml

permissions:
  contents: write

concurrency:
  group: runtime-production-20260806
  cancel-in-progress: false

jobs:
  production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Synchronize and verify Production control-plane gate
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          node <<'NODE'
          const fs = require('fs')
          const record = JSON.parse(fs.readFileSync('research/runtime/records/daily/2026/08/2026-08-06-daily-runtime.json', 'utf8'))
          const opened = (record.timeline || []).filter((event) =>
            event.task === 'production' && event.event === 'Execution Slot Opened' && event.status === 'Running' && String(event.time || '').startsWith('2026-08-06')
          )
          if (record.status !== 'Running') throw new Error(`Expected overall Running, got ${record.status}`)
          if (record.taskStatus?.production !== 'Running') throw new Error(`Expected taskStatus.production=Running, got ${record.taskStatus?.production}`)
          if (opened.length !== 1) throw new Error(`Expected exactly one Production start event, got ${opened.length}`)
          const objects = [
            'research/analysis/Q-20260806-01-revisable-dag-computer-use.md',
            'research/analysis/Q-20260806-02-enterprise-agent-control-plane.md',
            'research/analysis/Q-20260806-03-rollout-migration-recovery.md'
          ]
          for (const path of objects) {
            const text = fs.readFileSync(path, 'utf8')
            if (!text.includes('status: "ReadyForProduction"')) throw new Error(`${path} is not ReadyForProduction`)
            if (!text.includes('production_input_authorized: true')) throw new Error(`${path} is not authorized for Production`)
            if (!text.includes('publication_authorized: false')) throw new Error(`${path} unexpectedly authorizes Publication`)
          }
          console.log('Production gate verified: durable Running state, one start event, three authorized Research Objects.')
          NODE

      - name: Execute Skills 05 through 08 and create bilingual candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging/publication-candidates research/runtime/candidates/2026/08
