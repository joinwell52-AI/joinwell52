name: Reading Result 2026-08-07 Once

on:
  push:
    branches:
      - reading-result-20260807
    paths:
      - .github/workflows/reading-result-20260807-once.yml

permissions:
  contents: write

jobs:
  persist-result:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reading-result-20260807
          fetch-depth: 0
      - name: Persist Reading result and regenerate ledger
        run: node scripts/automation-reading-result-20260807.mjs
      - name: Commit durable Reading result tree
        shell: bash
        run: |
          rm -f .github/workflows/reading-result-20260807-once.yml scripts/automation-reading-result-20260807.mjs
          git config user.name "joinwell52 Research Runtime"
          git config user.email "actions@users.noreply.github.com"
          git add research/reading/Q-20260807-01-argus-verification-gated-runtime.md \
            research/reading/Q-20260807-02-agentic-workflow-server-architecture.md \
            research/reading/Q-20260807-03-deferred-environment-provisioning.md \
            research/runtime/records/daily/2026/08/2026-08-07-daily-runtime.json \
            research/runtime/2026/08/2026-08-07-runtime.md \
            .github/workflows/reading-result-20260807-once.yml \
            scripts/automation-reading-result-20260807.mjs
          git commit -m "runtime(reading): complete 2026-08-07 Deep Reading"
          git push origin HEAD:reading-result-20260807
