name: Recover 2026-08-18 Publication via PR

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/recover-20260818-publication-pr.yml"
      - "recovery/2026-08-18-publication-final.marker"

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify fresh recovered Publication authority
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs')
          const record = JSON.parse(fs.readFileSync('research/runtime/records/daily/2026/08/2026-08-18-daily-runtime.json','utf8'))
          if (record.taskStatus?.production !== 'Completed' || record.taskStatus?.publication !== 'Running') throw new Error('Publication is not the active recovered task')
          const timeline = record.timeline || []
          let start = -1
          for (let i = timeline.length - 1; i >= 0; i--) {
            const e = timeline[i]
            if (e.task === 'publication' && e.event === 'Execution Slot Opened' && e.status === 'Running') { start = i; break }
          }
          if (start < 0) throw new Error('Missing recovered Publication execution start')
          const claim = timeline.slice(start + 1).find(e => e.task === 'publication' && e.event === 'Worker Claimed' && e.status === 'Running' && String(e.detail || '').includes('publication-203316.json'))
          if (!claim) throw new Error('Missing fresh recovered Worker Claim')
          console.log(`Recovered Publication authority verified: start=${timeline[start].time}; claim=${claim.time}`)
          NODE
      - name: Materialize recovered Publication release
        run: node scripts/runtime-publication-release-current.mjs --date 2026-08-18 --wake research/runtime/wakes/2026/08/2026-08-18/publication-203316.json
      - name: Run governed Publication validators
        run: |
          npm run publication:layout:validate
          npm run publication:editorial:validate
          npm run runtime:validate
          npm run docs:build
          node scripts/publication-visibility.mjs
      - name: Finalize Publication Runtime shift
        run: |
          node scripts/runtime-shift-complete.mjs --task publication --date 2026-08-18 --result research/runtime/results/2026/08/2026-08-18-publication-result.json
          node scripts/runtime-markdown.mjs render --date 2026-08-18
          npm run runtime:validate
          node scripts/runtime-markdown.mjs validate --date 2026-08-18
      - name: Commit recovered release and terminal state to PR branch
        id: persist
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'joinwell52 Research Runtime'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            docs/en/digital-employee docs/zh/digital-employee \
            docs/en/industry docs/zh/industry \
            docs/en/engineering docs/zh/engineering \
            docs/public/assets/covers docs/public/assets/figures \
            research/runtime/releases/2026-08-18-publication.json \
            research/runtime/results/2026/08/2026-08-18-publication-result.json \
            research/runtime/records/daily/2026/08/2026-08-18-daily-runtime.json \
            research/runtime/2026/08/2026-08-18-runtime.md
          git commit -m 'runtime(publication): recover and finalize 2026-08-18 release'
          sha="$(git rev-parse HEAD)"
          git push origin HEAD:${GITHUB_HEAD_REF}
          echo "commit_sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Re-fetch and verify recovery branch
        shell: bash
        env:
          RECOVERY_SHA: ${{ steps.persist.outputs.commit_sha }}
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_HEAD_REF}"
          git merge-base --is-ancestor "$RECOVERY_SHA" "origin/${GITHUB_HEAD_REF}"
          git reset --hard "origin/${GITHUB_HEAD_REF}"
          node - <<'NODE'
          const fs = require('fs')
          const record = JSON.parse(fs.readFileSync('research/runtime/records/daily/2026/08/2026-08-18-daily-runtime.json','utf8'))
          const release = JSON.parse(fs.readFileSync('research/runtime/releases/2026-08-18-publication.json','utf8'))
          const result = JSON.parse(fs.readFileSync('research/runtime/results/2026/08/2026-08-18-publication-result.json','utf8'))
          if (record.taskStatus?.publication !== 'Completed') throw new Error('Publication terminal state not durable on recovery branch')
          if (release.status !== 'Released' || result.status !== 'Completed') throw new Error('Release/result not durable')
          console.log('Recovered Publication is terminal and released on the PR branch.')
          NODE
          npm run runtime:validate
          npm run docs:build
          node scripts/publication-visibility.mjs
