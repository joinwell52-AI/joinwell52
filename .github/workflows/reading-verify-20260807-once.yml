name: Reading Verify 2026-08-07 Once

on:
  push:
    branches:
      - reading-verify-20260807
    paths:
      - .github/workflows/reading-verify-20260807-once.yml

permissions:
  contents: write

jobs:
  verify-result:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reading-verify-20260807
          fetch-depth: 0
      - name: Persist verified Reading commit state
        run: node scripts/automation-reading-verify-20260807.mjs
      - name: Commit verification state and synchronized ledger
        shell: bash
        run: |
          rm -f .github/workflows/reading-verify-20260807-once.yml scripts/automation-reading-verify-20260807.mjs
          git config user.name "joinwell52 Research Runtime"
          git config user.email "actions@users.noreply.github.com"
          git add research/runtime/records/daily/2026/08/2026-08-07-daily-runtime.json \
            research/runtime/2026/08/2026-08-07-runtime.md \
            .github/workflows/reading-verify-20260807-once.yml \
            scripts/automation-reading-verify-20260807.mjs
          git commit -m "runtime(reading): verify 2026-08-07 durable artifacts"
          git push origin HEAD:reading-verify-20260807
