name: Apply Runtime Live Status Sync

on:
  push:
    branches: [fix-runtime-live-status-sync]

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Apply live status synchronization patch
        shell: python
        run: |
          from pathlib import Path

          runtime_path = Path('scripts/runtime-v5.mjs')
          source = runtime_path.read_text(encoding='utf-8')
          old = """function appendScheduledEvent(record, task, now) {
            const duplicate = record.timeline.some((entry) =>
              entry.task === task.id && entry.event === 'Execution Slot Opened' && entry.time?.startsWith(now.date)
            )
            if (!duplicate) {
              record.timeline.push({
                time: `${now.date}T${now.time}+08:00`,
                task: task.id,
                event: 'Execution Slot Opened',
                status: 'Waiting',
                detail: `${task.name} scheduled by Research Runtime Scheduler V3.0.`
              })
            }
            record.updatedAt = `${now.date}T${now.time}+08:00`
          }
          """
          new = """function appendScheduledEvent(record, task, now) {
            const currentStatus = record.taskStatus?.[task.id] || 'Waiting'
            const duplicate = currentStatus === 'Running' && record.timeline.some((entry) =>
              entry.task === task.id &&
              entry.event === 'Execution Slot Opened' &&
              entry.status === 'Running' &&
              entry.time?.startsWith(now.date)
            )

            record.taskStatus[task.id] = 'Running'
            delete record.results[task.id]
            record.status = 'Running'
            record.githubCommit = 'pending'
            record.commitVerify = 'Waiting'

            if (!duplicate) {
              record.timeline.push({
                time: `${now.date}T${now.time}+08:00`,
                task: task.id,
                event: 'Execution Slot Opened',
                status: 'Running',
                detail: `${task.name} started by Research Runtime Scheduler V3.0.`
              })
            }
            record.updatedAt = `${now.date}T${now.time}+08:00`
          }
          """
          if old not in source:
            raise SystemExit('runtime-v5.mjs appendScheduledEvent block not found')
          runtime_path.write_text(source.replace(old, new, 1), encoding='utf-8')

          component_path = Path('docs/.vitepress/theme/components/RuntimeOperationsCenterClassic.vue')
          component = component_path.read_text(encoding='utf-8')

          replacements = [
            ("import { computed } from 'vue'", "import { computed, onBeforeUnmount, onMounted, ref } from 'vue'"),
            (
              "const record = computed(() => runtime.todayDaily)",
              """const liveRecord = ref<RecordItem | null>(null)
          const record = computed(() => liveRecord.value || runtime.todayDaily)

          const refreshLiveRecord = async () => {
            if (typeof window === 'undefined') return
            const [year, month] = runtime.today.split('-')
            const path = `research/runtime/records/daily/${year}/${month}/${runtime.today}-daily-runtime.json`
            const url = `https://raw.githubusercontent.com/joinwell52-AI/joinwell52/main/${path}?t=${Date.now()}`
            try {
              const response = await fetch(url, { cache: 'no-store' })
              if (!response.ok) return
              const next = await response.json() as RecordItem
              if (next.date === runtime.today) liveRecord.value = next
            } catch {
              // Preserve the build-time projection while GitHub is temporarily unavailable.
            }
          }

          let liveRefreshTimer: ReturnType<typeof setInterval> | undefined
          onMounted(() => {
            void refreshLiveRecord()
            liveRefreshTimer = setInterval(() => void refreshLiveRecord(), 15_000)
          })
          onBeforeUnmount(() => {
            if (liveRefreshTimer) clearInterval(liveRefreshTimer)
          })"""
            ),
            (
              "const history = computed(() => (runtime.records?.daily || []).slice().sort((a, b) => b.date.localeCompare(a.date)).slice(0, 7))",
              """const history = computed(() => {
            const current = record.value
            return [current, ...(runtime.records?.daily || []).filter((item) => item.date !== current.date)]
              .sort((a, b) => b.date.localeCompare(a.date))
              .slice(0, 7)
          })"""
            ),
            ("pending: '任务尚未执行；完成后自动显示工作成果。',", "pending: '任务尚未执行；完成后自动显示工作成果。',\n  working: '任务正在执行，查询与成果整理尚未完成。',"),
            ("pending: 'The task has not run. Its work result will appear here after execution.',", "pending: 'The task has not run. Its work result will appear here after execution.',\n  working: 'The task is working; retrieval and artifact preparation are still in progress.',"),
            ("status: { Running: '运行中', Completed: '已完成'", "status: { Running: '工作中', Completed: '已完成'"),
            ("<small>{{ record.status }}</small>", "<small>{{ statusLabel(record.status) }}</small>"),
            ("<p v-else class=\"pending\">{{ copy.pending }}</p>", "<p v-else class=\"pending\">{{ row.status === 'Running' ? copy.working : copy.pending }}</p>"),
            ("<div v-else class=\"empty-state\"><strong>{{ copy.noCandidate }}</strong><p>{{ copy.productionLead }}</p></div>", "<div v-else class=\"empty-state\"><strong>{{ record.taskStatus?.production === 'Running' ? copy.working : copy.noCandidate }}</strong><p>{{ copy.productionLead }}</p></div>"),
            ("<div v-else class=\"empty-state\"><strong>{{ copy.noRelease }}</strong><p>{{ copy.releaseLead }}</p></div>", "<div v-else class=\"empty-state\"><strong>{{ record.taskStatus?.publication === 'Running' ? copy.working : copy.noRelease }}</strong><p>{{ copy.releaseLead }}</p></div>")
          ]

          for old_text, new_text in replacements:
            if old_text not in component:
              raise SystemExit(f'component target not found: {old_text[:80]}')
            component = component.replace(old_text, new_text, 1)

          component_path.write_text(component, encoding='utf-8')

      - name: Verify Running-state behavior
        shell: bash
        run: |
          npm run runtime:validate
          node scripts/runtime-v5.mjs schedule --task queue
          node - <<'NODE'
          const fs = require('fs')
          const now = Object.fromEntries(new Intl.DateTimeFormat('en-CA', {
            timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit'
          }).formatToParts(new Date()).map((item) => [item.type, item.value]))
          const date = `${now.year}-${now.month}-${now.day}`
          const path = `research/runtime/records/daily/${now.year}/${now.month}/${date}-daily-runtime.json`
          const record = JSON.parse(fs.readFileSync(path, 'utf8'))
          if (record.taskStatus.queue !== 'Running') throw new Error('Queue did not enter Running')
          if (record.status !== 'Running') throw new Error('Daily record did not enter Running')
          const opened = record.timeline.findLast((item) => item.task === 'queue' && item.event === 'Execution Slot Opened')
          if (!opened || opened.status !== 'Running') throw new Error('Execution Slot Opened is not Running')
          console.log('Runtime Running-state behavior verified.')
          NODE
          git checkout -- research/runtime/records research/intelligence || true
          npm run docs:build
          git checkout -- docs/.vitepress/generated research/runtime/records research/intelligence || true

      - name: Commit verified fix
        shell: bash
        run: |
          rm .github/workflows/apply-runtime-live-status-sync.yml
          git config user.name "joinwell52 Runtime Fix"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/runtime-v5.mjs docs/.vitepress/theme/components/RuntimeOperationsCenterClassic.vue .github/workflows/apply-runtime-live-status-sync.yml
          git commit -m "fix(runtime): synchronize live Working status"
          git pull --rebase origin fix-runtime-live-status-sync
          git push origin HEAD:fix-runtime-live-status-sync
