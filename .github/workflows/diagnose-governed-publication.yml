name: Diagnose and Execute Governed Publication

on:
  push:
    branches: [main]
    paths:
      - "research/runtime/manual-execution-requests/publication-diagnostic.json"

permissions:
  contents: write

concurrency:
  group: diagnose-governed-publication-v1
  cancel-in-progress: false

jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authoritative main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Execute governed release with durable diagnostics
        shell: bash
        env:
          REQUEST_PATH: research/runtime/manual-execution-requests/publication-diagnostic.json
        run: |
          set -u
          git fetch origin main
          git reset --hard origin/main

          date_value="$(node -e "const r=require('./${REQUEST_PATH}'); if(r.schema!=='runtime-publication-execution-request/v1') process.exit(2); process.stdout.write(r.date)")"
          wake_value="$(node -e "const r=require('./${REQUEST_PATH}'); process.stdout.write(r.wakeReceipt)")"
          IFS=- read -r year month day <<< "$date_value"
          release_path="research/runtime/releases/${date_value}-publication.json"
          result_path="research/runtime/results/${year}/${month}/${date_value}-publication-result.json"
          diag="research/runtime/diagnostics/${date_value}-publication-release-diagnostic.json"
          log="/tmp/publication-release-${date_value}.log"
          : > "$log"
          failed_step=""
          failed_code=0

          run_step() {
            local label="$1"
            shift
            echo "===== ${label} =====" >> "$log"
            "$@" >> "$log" 2>&1
            local code=$?
            echo "exit=${code}" >> "$log"
            if [[ "$code" -ne 0 && -z "$failed_step" ]]; then
              failed_step="$label"
              failed_code="$code"
            fi
            return "$code"
          }

          run_step "npm ci" npm ci || true
          if [[ -z "$failed_step" ]]; then run_step "publication materialization" node scripts/runtime-publication-release-current.mjs --date "$date_value" --wake "$wake_value" || true; fi

          # Freeze the exact authorized release candidate set in the Git index immediately
          # after materialization. Validators/build may normalize or restore the worktree, but
          # nothing is committed or pushed unless every governed gate below passes.
          if [[ -z "$failed_step" ]]; then
            git add docs/en/digital-employee docs/zh/digital-employee docs/en/industry docs/zh/industry docs/en/engineering docs/zh/engineering docs/public/assets/covers docs/public/assets/figures "$release_path" "$result_path" >> "$log" 2>&1 || true
            echo "===== staged release after materialization =====" >> "$log"
            git diff --cached --stat >> "$log" 2>&1 || true
            if git diff --cached --quiet; then
              failed_step="materialization produced no staged release changes"
              failed_code=3
            fi
          fi

          if [[ -z "$failed_step" ]]; then run_step "publication layout validation" npm run publication:layout:validate || true; fi
          if [[ -z "$failed_step" ]]; then run_step "publication editorial validation" npm run publication:editorial:validate || true; fi
          if [[ -z "$failed_step" ]]; then run_step "runtime validation" npm run runtime:validate || true; fi
          if [[ -z "$failed_step" ]]; then run_step "VitePress build" npm run docs:build || true; fi
          if [[ -z "$failed_step" ]]; then run_step "publication visibility" node scripts/publication-visibility.mjs || true; fi

          git config user.name "joinwell52 Research Runtime"
          git config user.email "actions@users.noreply.github.com"

          if [[ -z "$failed_step" ]]; then
            echo "===== final staged release before commit =====" >> "$log"
            git diff --cached --stat >> "$log" 2>&1 || true
            if git diff --cached --quiet; then
              failed_step="validated release lost staged changes"
              failed_code=4
            else
              git commit -m "runtime(publication): release ${date_value} research"
              if git pull --rebase origin main && git push origin HEAD:main; then
                exit 0
              fi
              git rebase --abort || true
              failed_step="release push"
              failed_code=5
            fi
          fi

          cp "$log" /tmp/publication-release-log.txt
          git fetch origin main
          git reset --hard origin/main
          git clean -fd
          mkdir -p "$(dirname "$diag")"
          DIAG_PATH="$diag" DATE_VALUE="$date_value" WAKE_VALUE="$wake_value" FAILED_STEP="$failed_step" FAILED_CODE="$failed_code" node <<'NODE'
          const fs=require('fs')
          const log=fs.readFileSync('/tmp/publication-release-log.txt','utf8')
          const value={
            schema:'runtime-publication-release-diagnostic/v1',
            date:process.env.DATE_VALUE,
            timezone:'Asia/Shanghai',
            wakeReceipt:process.env.WAKE_VALUE,
            status:'Failed',
            failedStep:process.env.FAILED_STEP,
            exitCode:Number(process.env.FAILED_CODE||1),
            capturedAt:new Date().toISOString(),
            log
          }
          fs.writeFileSync(process.env.DIAG_PATH, JSON.stringify(value,null,2)+'\n')
          NODE
          git add "$diag"
          git commit -m "runtime(publication): record ${date_value} release diagnostic"
          git pull --rebase origin main
          git push origin HEAD:main
          exit "$failed_code"
