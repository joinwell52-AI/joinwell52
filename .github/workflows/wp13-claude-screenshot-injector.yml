name: Inject WP-13 Claude screenshots

on:
  push:
    paths:
      - .github/workflows/wp13-claude-screenshot-injector.yml

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Insert bilingual screenshot evidence
        run: |
          python - <<'PY'
          from pathlib import Path

          zh = Path('docs/zh/engineering/2026-08-06-codeflowmu-multi-agent-fact-checking.md')
          en = Path('docs/en/engineering/2026-08-06-codeflowmu-multi-agent-fact-checking.md')

          zh_marker = '> **我把“调用完成”直接当成了“结果就是最新事实”。**'
          zh_block = r'''

          ### 四张现场截图：同一工具自证，直到独立观察介入

          **截图 1：Claude 坚持每次 `web_fetch` 都是“全新的、独立的网络请求”，并把六次相同结果解释为站点服务端或 CDN 返回旧版本。**

          ![Claude 彩蛋截图 1：把重复抓取解释为独立网络请求](/assets/covers/wp13-claude-easter-01.png)

          **截图 2：在看到新版页面截图后，Claude 承认新版真实存在，但仍继续用“CDN 边缘节点不同步”解释自己的旧结果。**

          ![Claude 彩蛋截图 2：承认新版存在后仍推断 CDN 边缘差异](/assets/covers/wp13-claude-easter-02.png)

          **截图 3：Claude 开始承认方法错误——它反复使用同一个工具、同一个信息源自证，没有像 PM 或 QA 那样主动切换到独立来源交叉核验。**

          ![Claude 彩蛋截图 3：承认没有引入独立信息源](/assets/covers/wp13-claude-easter-03.png)

          **截图 4：在两台电脑都显示新版后，Claude 最终明确承认，它把“工具调用完成”直接当成了“结果就是最新事实”。**

          ![Claude 彩蛋截图 4：承认把调用完成误当成最新事实](/assets/covers/wp13-claude-easter-04.png)
          '''

          en_marker = '> **I treated “the call completed” as “the result is the latest fact.”**'
          en_block = r'''

          ### Four screenshots: one tool kept validating itself until independent observations intervened

          **Screenshot 1 — repeated retrieval was mistaken for independent verification.** Claude insists that every `web_fetch` call is a fresh, independent network request. Because six calls returned the same old page, it attributes the result to the site, server, or CDN rather than questioning the shared retrieval path.

          ![Claude easter egg screenshot 1: repeated retrieval presented as independent network requests](/assets/covers/wp13-claude-easter-01.png)

          **Screenshot 2 — new evidence appears, but the explanation remains overconfident.** After the user supplies a screenshot showing the revised article, Claude accepts that the new version exists, yet continues to explain its stale result as CDN edge-node inconsistency. That explanation is plausible, but it has not been independently established.

          ![Claude easter egg screenshot 2: the new version is acknowledged while CDN inconsistency is inferred](/assets/covers/wp13-claude-easter-02.png)

          **Screenshot 3 — the methodological error is recognized.** Claude acknowledges that it kept using one tool and one information path to validate itself. It did not switch to an independent source in the way a PM or QA role would cross-check a disputed fact.

          ![Claude easter egg screenshot 3: acknowledgement that no independent information source was introduced](/assets/covers/wp13-claude-easter-03.png)

          **Screenshot 4 — two-device observation forces the claim back into review.** Once the user confirms the revised page on two computers, Claude explicitly admits the core failure: it treated “the call completed” as “the result is the latest fact.” The screenshot also records the distinction between repeated use of one tool and genuinely independent verification.

          ![Claude easter egg screenshot 4: acknowledgement that tool completion was mistaken for latest truth](/assets/covers/wp13-claude-easter-04.png)
          '''

          def inject(path, marker, block, sentinel):
              text = path.read_text(encoding='utf-8')
              if sentinel in text:
                  return False
              if marker not in text:
                  raise SystemExit(f'marker not found in {path}')
              text = text.replace(marker, marker + block, 1)
              path.write_text(text, encoding='utf-8')
              return True

          inject(zh, zh_marker, zh_block, 'wp13-claude-easter-04.png')
          inject(en, en_marker, en_block, 'wp13-claude-easter-04.png')
          PY
          rm -f docs/public/assets/covers/wp13-claude-easter-01.webp.b64.txt
          rm -f docs/public/assets/covers/wp13-claude-easter-01.svg
          rm -f docs/public/assets/covers/wp13-claude-easter-02.svg
          rm -f .github/workflows/wp13-claude-screenshot-injector.yml
      - name: Commit article and cleanup
        run: |
          git config user.name joinwell52
          git config user.email joinwell52@gmail.com
          git add -A
          git commit -m "docs: embed Claude screenshots in WP-13 bilingual article"
          git push
