name: Research Production Rework V1.0

on:
  push:
    branches: [main]
    paths:
      - "research/runtime/rework-requests/*.json"

permissions:
  contents: write

concurrency:
  group: research-production-rework-v1
  cancel-in-progress: false

jobs:
  cover-rework:
    name: Apply and verify governed Production cover rework
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authoritative repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch latest durable facts
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Resolve and validate rework request
        id: request
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          request_path="$(git diff --name-only "$BEFORE_SHA" "$EVENT_SHA" -- 'research/runtime/rework-requests/*.json' | tail -n 1)"
          if [[ -z "$request_path" ]]; then
            request_path="$(git show --pretty='' --name-only "$EVENT_SHA" -- 'research/runtime/rework-requests/*.json' | tail -n 1)"
          fi
          if [[ -z "$request_path" || ! -f "$request_path" ]]; then
            echo "No durable Production rework request found."
            exit 1
          fi
          REQUEST_PATH="$request_path" node <<'NODE'
          const fs = require('fs')
          const r = JSON.parse(fs.readFileSync(process.env.REQUEST_PATH, 'utf8'))
          if (r.schema !== 'runtime-production-rework-request/v1') throw new Error('Invalid rework request schema')
          if (r.task !== 'production' || r.kind !== 'Production Rework' || r.scope !== 'cover-only') throw new Error('Only cover-only Production Rework is accepted')
          if (!/^\d{4}-\d{2}-\d{2}$/.test(r.date || '')) throw new Error('Invalid rework date')
          if (r.timezone !== 'Asia/Shanghai') throw new Error('Invalid timezone')
          if (!/^[0-9a-f]{40}$/.test(r.sourceCompletionCommit || '') || !/^[0-9a-f]{40}$/.test(r.sourceVerificationCommit || '')) throw new Error('Invalid source commit evidence')
          if (!Array.isArray(r.covers) || r.covers.length !== 3) throw new Error('Exactly three cover replacements are required')
          const ids = r.covers.map(x => x.itemId)
          if (JSON.stringify(ids) !== JSON.stringify(['Q-20260810-01','Q-20260810-02','Q-20260810-03'])) throw new Error(`Unexpected rework objects: ${ids.join(',')}`)
          for (const c of r.covers) {
            for (const field of ['coverPath','figurePath','enPath','zhPath']) {
              if (!c[field] || !fs.existsSync(c[field])) throw new Error(`Missing ${field}: ${c[field]}`)
            }
            if (c.coverPath === c.figurePath) throw new Error(`Cover and figure must be separate assets for ${c.itemId}`)
          }
          NODE
          source_completion="$(node -e "const r=require('./$request_path');process.stdout.write(r.sourceCompletionCommit)")"
          source_verification="$(node -e "const r=require('./$request_path');process.stdout.write(r.sourceVerificationCommit)")"
          git merge-base --is-ancestor "$source_completion" origin/main
          git merge-base --is-ancestor "$source_verification" origin/main
          echo "request_path=$request_path" >> "$GITHUB_OUTPUT"
          echo "runtime_date=$(node -e "const r=require('./$request_path');process.stdout.write(r.date)")" >> "$GITHUB_OUTPUT"

      - name: Apply Cover Gate rework
        env:
          REQUEST_PATH: ${{ steps.request.outputs.request_path }}
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')
          const r = JSON.parse(fs.readFileSync(process.env.REQUEST_PATH, 'utf8'))
          const batch = JSON.parse(fs.readFileSync(r.candidateBatch, 'utf8'))
          if (batch.schema !== 'runtime-publication-candidate/v1' || batch.date !== r.date || batch.status !== 'Completed') throw new Error('Candidate batch is not the completed same-date Production batch')
          const priorCandidateCommit = batch.githubCommit
          const parts = Object.fromEntries(new Intl.DateTimeFormat('en-CA', { timeZone: r.timezone, year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit', hourCycle:'h23' }).formatToParts(new Date()).map(p => [p.type,p.value]))
          const now = `${parts.year}-${parts.month}-${parts.day}T${parts.hour}:${parts.minute}:${parts.second}+08:00`
          if (`${parts.year}-${parts.month}-${parts.day}` !== r.date) throw new Error('Cover rework must remain on the active Shanghai runtime date')

          function applyArticle(entry, file, zh) {
            let body = fs.readFileSync(file, 'utf8')
            const coverLine = `cover: "${entry.coverPath}"`
            const visualizationLine = `visualization: "${entry.figurePath}"`
            if (!body.includes(visualizationLine)) throw new Error(`${file}: expected original explanatory visualization path is missing`)
            if (!body.includes(coverLine)) body = body.replace(visualizationLine, `${coverLine}\n${visualizationLine}`)
            body = body.replace(/^visualization_decision:.*$/m, 'visualization_decision: "Required — editorial Article Cover plus a contextually embedded explanatory figure"')
            const coverName = path.basename(entry.coverPath)
            const figureName = path.basename(entry.figurePath)
            const forbiddenHeading = /^(## (Cover|Figure|Visualization|题图|文中图|解释图|可视化))\s*$/m
            if (forbiddenHeading.test(body)) throw new Error(`${file}: fixed image-container heading is forbidden; place the cover before H1 and the figure in its semantic section`)
            const h1Index = body.search(/^# /m)
            if (h1Index < 0) throw new Error(`${file}: H1 title is missing`)
            const coverImage = `![${zh ? entry.coverAlt_zh : entry.coverAlt}](./${coverName})`
            const preTitle = body.slice(0, h1Index)
            const preTitleImage = /!\[[^\]]*\]\(\.\/[^)]+\)/
            if (preTitleImage.test(preTitle)) {
              body = preTitle.replace(preTitleImage, coverImage) + body.slice(h1Index)
            } else {
              body = `${preTitle}${coverImage}\n\n${body.slice(h1Index)}`
            }
            const escapedFigureName = figureName.replaceAll('.', '\\.')
            const figureImageRe = new RegExp(`!\\[[^\\]]*\\]\\(\\./${escapedFigureName}\\)`)
            const figureMatch = body.match(figureImageRe)
            if (!figureMatch) throw new Error(`${file}: explanatory figure must already be placed in its semantic section`)
            const figureIndex = figureMatch.index
            const firstSectionIndex = body.search(/^## /m)
            if (firstSectionIndex < 0 || figureIndex < firstSectionIndex) throw new Error(`${file}: explanatory figure is not contextually embedded after a semantic section`)
            const figureImage = `![${zh ? entry.figureAlt_zh : entry.figureAlt}](./${figureName})`
            body = body.replace(figureImageRe, figureImage)
            const afterFigure = body.slice(body.indexOf(figureImage) + figureImage.length)
            const captionRe = zh
              ? /^\s*\*图\s+\d+[:：][^\n]*来源[:：][^\n]*\*/
              : /^\s*\*Figure\s+\d+\.[^\n]*Source:[^\n]*\*/
            if (!captionRe.test(afterFigure)) throw new Error(`${file}: explanatory figure requires an adjacent bilingual caption and source`)
            fs.writeFileSync(file, body)
          }

          for (const entry of r.covers) {
            const candidate = batch.candidates.find(c => c.itemId === entry.itemId)
            if (!candidate) throw new Error(`Candidate not found: ${entry.itemId}`)
            applyArticle(entry, entry.enPath, false)
            applyArticle(entry, entry.zhPath, true)
            candidate.coverPath = entry.coverPath
            candidate.figurePath = entry.figurePath
            candidate.inlineFigures = [{ path: entry.figurePath, placement: 'observation', caption: entry.figureAlt, caption_zh: entry.figureAlt_zh, source: 'Research Center synthesis based on cited primary sources.', source_zh: 'Research Center 基于文中引用的一手资料综合绘制。' }]
            candidate.coverGate = 'PASS'
            candidate.figureGate = 'PASS'
            candidate.inlineVisualGate = 'PASS'
            candidate.layoutGate = 'PASS'
            candidate.editingStatus = 'Completed'
          }

          batch.updatedAt = now
          batch.githubCommit = 'pending'
          batch.rework = {
            schema: 'runtime-production-rework/v1',
            kind: 'Production Rework',
            scope: 'cover-only',
            status: 'Completed',
            reason: r.reason,
            reason_zh: r.reason_zh,
            sourceCompletionCommit: r.sourceCompletionCommit,
            sourceVerificationCommit: r.sourceVerificationCommit,
            sourceCandidateCommit: priorCandidateCommit,
            researchChanged: false,
            analysisChanged: false,
            articleClaimsChanged: false,
            publicationPerformed: false,
            publicationAuthorized: false,
            coverGate: 'PASS',
            figureGate: 'PASS',
            inlineVisualGate: 'PASS',
            layoutGate: 'PASS',
            thumbnailQaWidth: 320,
            githubCommit: 'pending',
            commitVerify: 'Waiting',
            completedAt: now
          }
          fs.writeFileSync(r.candidateBatch, `${JSON.stringify(batch, null, 2)}\n`)

          const [year, month] = r.date.split('-')
          const recordPath = `research/runtime/rework/${year}/${month}/${r.date}-production-cover-rework.json`
          fs.mkdirSync(path.dirname(recordPath), { recursive: true })
          const record = {
            schema: 'runtime-production-rework/v1',
            date: r.date,
            timezone: r.timezone,
            task: 'production',
            kind: 'Production Rework',
            scope: 'cover-only',
            status: 'Completed',
            reason: r.reason,
            reason_zh: r.reason_zh,
            sourceCompletionCommit: r.sourceCompletionCommit,
            sourceVerificationCommit: r.sourceVerificationCommit,
            sourceCandidateCommit: priorCandidateCommit,
            governanceBasis: ['research/skills/06-research-visualization.md','research/skills/08-publication-editing.md'],
            objects: r.covers.map(c => ({ itemId:c.itemId, coverPath:c.coverPath, inlineFigures:[{ path:c.figurePath, placement:'observation' }], coverGate:'PASS', inlineVisualGate:'PASS', layoutGate:'PASS', thumbnailQaWidth:320 })),
            substantiveResearchChanged: false,
            analysisChanged: false,
            articleClaimsChanged: false,
            publicationPerformed: false,
            publicationAuthorized: false,
            githubCommit: 'pending',
            commitVerify: 'Waiting',
            completedAt: now
          }
          fs.writeFileSync(recordPath, `${JSON.stringify(record, null, 2)}\n`)

          console.log(`Applied cover-only Production Rework to ${r.covers.length} candidates.`)
          NODE

      - name: Commit governed Production rework
        id: rework
        shell: bash
        env:
          RUNTIME_DATE: ${{ steps.request.outputs.runtime_date }}
        run: |
          set -euo pipefail
          git config user.name "joinwell52 Research Runtime"
          git config user.email "actions@users.noreply.github.com"
          git add staging/publication-candidates research/runtime/candidates research/runtime/rework
          git commit -m "production(rework): apply ${RUNTIME_DATE} cover-gate repair"
          for attempt in 1 2 3; do
            if git pull --rebase origin main; then
              rework_sha="$(git rev-parse HEAD)"
              if git push origin HEAD:main; then
                echo "rework_sha=$rework_sha" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            git rebase --abort || true
            if [[ "$attempt" -eq 3 ]]; then exit 1; fi
            sleep $((attempt * 5))
          done

      - name: Verify reworked candidates from main
        env:
          REQUEST_PATH: ${{ steps.request.outputs.request_path }}
          REWORK_SHA: ${{ steps.rework.outputs.rework_sha }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$REWORK_SHA" origin/main
          git reset --hard origin/main
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')
          const r = JSON.parse(fs.readFileSync(process.env.REQUEST_PATH, 'utf8'))
          const batch = JSON.parse(fs.readFileSync(r.candidateBatch, 'utf8'))
          for (const entry of r.covers) {
            const c = batch.candidates.find(x => x.itemId === entry.itemId)
            if (!c || c.coverPath !== entry.coverPath || c.figurePath !== entry.figurePath) throw new Error(`Candidate visual roles not durable: ${entry.itemId}`)
            if (c.coverGate !== 'PASS' || c.inlineVisualGate !== 'PASS' || c.layoutGate !== 'PASS') throw new Error(`Visual/layout gate not PASS: ${entry.itemId}`)
            if (!fs.existsSync(entry.coverPath) || !fs.existsSync(entry.figurePath)) throw new Error(`Visual asset missing: ${entry.itemId}`)
            for (const file of [entry.enPath, entry.zhPath]) {
              const body = fs.readFileSync(file, 'utf8')
              if (!body.includes(path.basename(entry.coverPath)) || !body.includes(path.basename(entry.figurePath))) throw new Error(`Candidate article roles not durable: ${file}`)
              if (/^(## (Cover|Figure|Visualization|题图|文中图|解释图|可视化))\s*$/m.test(body)) throw new Error(`Forbidden fixed image-container heading is durable: ${file}`)
            }
          }
          if (batch.rework?.commitVerify !== 'Waiting' || batch.rework?.publicationPerformed !== false) throw new Error('Unexpected pre-verification or publication state')
          console.log('Verified three dedicated covers plus three retained explanatory figures on main.')
          NODE
          node scripts/research-publication-layout-validate.mjs

      - name: Record durable rework verification
        env:
          REQUEST_PATH: ${{ steps.request.outputs.request_path }}
          REWORK_SHA: ${{ steps.rework.outputs.rework_sha }}
        run: |
          node <<'NODE'
          const fs = require('fs')
          const r = JSON.parse(fs.readFileSync(process.env.REQUEST_PATH, 'utf8'))
          const parts = Object.fromEntries(new Intl.DateTimeFormat('en-CA', { timeZone:r.timezone, year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit', hourCycle:'h23' }).formatToParts(new Date()).map(p => [p.type,p.value]))
          const now = `${parts.year}-${parts.month}-${parts.day}T${parts.hour}:${parts.minute}:${parts.second}+08:00`
          const batch = JSON.parse(fs.readFileSync(r.candidateBatch, 'utf8'))
          batch.githubCommit = process.env.REWORK_SHA
          batch.rework.githubCommit = process.env.REWORK_SHA
          batch.rework.commitVerify = 'Completed'
          batch.rework.verifiedAt = now
          batch.updatedAt = now
          fs.writeFileSync(r.candidateBatch, `${JSON.stringify(batch, null, 2)}\n`)
          const [year, month] = r.date.split('-')
          const recordPath = `research/runtime/rework/${year}/${month}/${r.date}-production-cover-rework.json`
          const record = JSON.parse(fs.readFileSync(recordPath, 'utf8'))
          record.githubCommit = process.env.REWORK_SHA
          record.commitVerify = 'Completed'
          record.verifiedAt = now
          fs.writeFileSync(recordPath, `${JSON.stringify(record, null, 2)}\n`)
          NODE

      - name: Commit durable rework verification
        id: verification
        shell: bash
        env:
          RUNTIME_DATE: ${{ steps.request.outputs.runtime_date }}
        run: |
          set -euo pipefail
          git config user.name "joinwell52 Research Runtime"
          git config user.email "actions@users.noreply.github.com"
          git add research/runtime/candidates research/runtime/rework
          git commit -m "production(rework): verify ${RUNTIME_DATE} cover-gate repair"
          for attempt in 1 2 3; do
            if git pull --rebase origin main; then
              verification_sha="$(git rev-parse HEAD)"
              if git push origin HEAD:main; then
                echo "verification_sha=$verification_sha" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            git rebase --abort || true
            if [[ "$attempt" -eq 3 ]]; then exit 1; fi
            sleep $((attempt * 5))
          done

      - name: Verify terminal rework evidence
        env:
          REQUEST_PATH: ${{ steps.request.outputs.request_path }}
          REWORK_SHA: ${{ steps.rework.outputs.rework_sha }}
          VERIFICATION_SHA: ${{ steps.verification.outputs.verification_sha }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$REWORK_SHA" origin/main
          git merge-base --is-ancestor "$VERIFICATION_SHA" origin/main
          git reset --hard origin/main
          node <<'NODE'
          const fs = require('fs')
          const r = JSON.parse(fs.readFileSync(process.env.REQUEST_PATH, 'utf8'))
          const batch = JSON.parse(fs.readFileSync(r.candidateBatch, 'utf8'))
          const [year, month] = r.date.split('-')
          const record = JSON.parse(fs.readFileSync(`research/runtime/rework/${year}/${month}/${r.date}-production-cover-rework.json`, 'utf8'))
          if (batch.githubCommit !== process.env.REWORK_SHA || batch.rework?.commitVerify !== 'Completed') throw new Error('Candidate batch rework verification is not durable')
          if (record.githubCommit !== process.env.REWORK_SHA || record.commitVerify !== 'Completed') throw new Error('Rework audit record is not verified')
          if (record.publicationPerformed !== false || record.articleClaimsChanged !== false || record.analysisChanged !== false) throw new Error('Cover-only boundary was violated')
          console.log(`Verified governed Production Rework ${process.env.REWORK_SHA}; verification commit ${process.env.VERIFICATION_SHA}; no early Publication performed.`)
          NODE
