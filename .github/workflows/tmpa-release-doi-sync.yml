name: One-shot TMPA release DOI metadata sync

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmpa-release-doi-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Update TMPA V1.0 release DOI status
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: "368462210"
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq '.body' > /tmp/release-body.txt
          python <<'PY'
          from pathlib import Path
          p = Path('/tmp/release-body.txt')
          body = p.read_text(encoding='utf-8')
          old = 'DOI status: pending archival deposit. No DOI is asserted by this release.'
          new = ('DOI status at GitHub Release publication (2026-08-11): pending archival deposit. '
                 'The archival deposit was subsequently published as DOI '
                 '10.5281/zenodo.21888488. This metadata update does not change the release artifacts or checksums.')
          if new in body:
              raise SystemExit('release DOI metadata is already synchronized')
          if body.count(old) != 1:
              raise SystemExit(f'expected exactly one historical DOI-status sentence; found {body.count(old)}')
          p.write_text(body.replace(old, new, 1), encoding='utf-8')
          PY
          jq -Rs '{body: .}' /tmp/release-body.txt > /tmp/release-patch.json
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --input /tmp/release-patch.json >/tmp/release-result.json
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq '.body' | grep -F '10.5281/zenodo.21888488'
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq '.body' | grep -F 'This metadata update does not change the release artifacts or checksums.'
