name: Load final three-column palette

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/load-column-palette-final.yml'

permissions:
  contents: write

jobs:
  load-palette:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add final palette stylesheet
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/.vitepress/theme/index.ts')
          text = path.read_text(encoding='utf-8')
          anchor = "import './homepage-frame-fix.css'\n"
          addition = anchor + "import './column-palette-final.css'\n"
          if "import './column-palette-final.css'" not in text:
              if anchor not in text:
                  raise SystemExit('stylesheet anchor not found')
              text = text.replace(anchor, addition, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - run: npm install --no-audit --no-fund
      - run: npm run docs:build
      - name: Commit
        shell: bash
        run: |
          rm .github/workflows/load-column-palette-final.yml
          git config user.name 'joinwell52-AI Runtime'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/.vitepress/theme/index.ts .github/workflows/load-column-palette-final.yml package-lock.json
          git commit -m 'style: load exact three-column publication palette'
          git pull --rebase origin main
          git push origin HEAD:main
