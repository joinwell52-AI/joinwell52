name: Apply approved homepage refinement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/homepage-copy-and-alignment.yml'

permissions:
  contents: write

jobs:
  apply-homepage-refinement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Apply approved homepage copy, brand, and alignment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          component_path = Path('docs/.vitepress/theme/components/ResearchCenterHome.vue')
          component = component_path.read_text(encoding='utf-8')

          replacements = [
              (
                  "  heroLabel: '持续生产可核验的数字员工工作成果',\n  heroWide: ['持续生产', '可核验的数字员工', '工作成果'],\n  heroCompact: ['持续生产', '可核验的', '数字员工成果'],\n  heroMobile: ['持续生产', '可核验的', '数字员工', '工作成果'],\n  heroLead: '工场把岗位、任务、能力、Runtime 与交付门禁组织成持续产线。每一项成果都保留来源、过程、证据、提交与发布状态，能够检查、恢复并继续生产。',",
                  "  heroLabel: '让通用 AI 成为数字员工',\n  heroWide: ['让通用 AI', '成为数字员工'],\n  heroCompact: ['让通用 AI', '成为数字员工'],\n  heroMobile: ['让通用 AI', '成为数字员工'],\n  heroLead: '让 AI 拥有岗位、职责、技能和工作流程，持续完成真实任务，并留下可核验的工作成果。',",
                  'Chinese hero copy',
              ),
              (
                  "  ledger: '工场生产总账', live: '正在生产', ledgerRows: [",
                  "  ledger: '运行状态', live: '正在生产', ledgerRows: [",
                  'Chinese runtime status heading',
              ),
              (
                  "  footerAbout: '持续生产可核验数字员工工作成果的开放工场。观察笔记记录外部动态与工作判断，TMPA 论文体系独立维护。',",
                  "  footerAbout: '让通用 AI 成为数字员工，持续完成真实任务，并留下可核验的工作成果。观察笔记记录外部动态与工作判断，TMPA 论文体系独立维护。',",
                  'Chinese footer copy',
              ),
              (
                  "  heroLabel: 'We continuously produce verifiable Digital Employee work',\n  heroWide: ['We continuously', 'produce verifiable', 'Digital Employee', 'work'],\n  heroCompact: ['We continuously', 'produce verifiable', 'Digital Employee', 'work'],\n  heroMobile: ['We continuously', 'produce', 'verifiable', 'Digital Employee', 'work'],\n  heroLead: 'The Works organizes positions, tasks, capabilities, Runtime, and delivery gates as a continuing production line. Every output retains its sources, process, evidence, commits, and release state so work can be inspected, recovered, and continued.',",
                  "  heroLabel: 'Turn general-purpose AI into Digital Employees',\n  heroWide: ['Turn general-purpose AI', 'into Digital Employees'],\n  heroCompact: ['Turn general-purpose AI', 'into Digital', 'Employees'],\n  heroMobile: ['Turn general-purpose AI', 'into Digital', 'Employees'],\n  heroLead: 'Give AI a position, responsibilities, skills, and a workflow so it can continuously complete real tasks and leave verifiable work results.',",
                  'English hero copy',
              ),
              (
                  "  ledger: 'Factory production ledger', live: 'PRODUCING', ledgerRows: [",
                  "  ledger: 'Runtime status', live: 'IN PRODUCTION', ledgerRows: [",
                  'English runtime status heading',
              ),
              (
                  "  footerAbout: 'An open Works continuously producing verifiable Digital Employee work. Observation Notes record external developments and working judgments; the TMPA publication suite is maintained independently.',",
                  "  footerAbout: 'A Works that turns general-purpose AI into Digital Employees, continuously completing real tasks and leaving verifiable work results. Observation Notes record external developments and working judgments; the TMPA publication suite is maintained independently.',",
                  'English footer copy',
              ),
              (
                  ":global(.portal-v5-page .VPNavBarTitle .title) { font-weight: 760; letter-spacing: -.02em; }",
                  ":global(.portal-v5-page .VPNavBar .container) { width: min(1340px, calc(100% - 48px)); max-width: none; margin-inline: auto; }\n:global(.portal-v5-page .VPNavBarTitle .title) { display: grid; align-content: center; gap: 3px; min-width: max-content; color: transparent; background: linear-gradient(105deg, #111827 0%, #334155 52%, #4f46e5 100%); background-clip: text; -webkit-background-clip: text; font-size: 18px; font-weight: 900; line-height: 1; letter-spacing: -.055em; }\n:global(.portal-v5-page .VPNavBarTitle .title::after) { content: \\\"DIGITAL EMPLOYEE WORKS\\\"; color: #69748a; -webkit-text-fill-color: #69748a; font: 760 7px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: .14em; }",
                  'Navbar brand lockup',
              ),
              (
                  ":global(.dark .portal-v5-page .VPNavBar) { border-bottom-color: rgba(255,255,255,.1); background: rgba(8, 11, 22, .94); }",
                  ":global(.dark .portal-v5-page .VPNavBar) { border-bottom-color: rgba(255,255,255,.1); background: rgba(8, 11, 22, .94); }\n:global(.dark .portal-v5-page .VPNavBarTitle .title) { background: linear-gradient(105deg, #ffffff 0%, #b8c6e5 52%, #8b7cff 100%); background-clip: text; -webkit-background-clip: text; }\n:global(.dark .portal-v5-page .VPNavBarTitle .title::after) { color: #8d9ab5; -webkit-text-fill-color: #8d9ab5; }",
                  'Dark navbar brand lockup',
              ),
              (
                  ".rc-controls { position: fixed; z-index: 100; top: 11px; right: 82px; display: flex;",
                  ".rc-controls { position: fixed; z-index: 100; top: 11px; right: max(24px, calc((100vw - 1340px) / 2)); display: flex;",
                  'Desktop controls alignment',
              ),
          ]

          for old, new, label in replacements:
              component = replace_once(component, old, new, label)

          component_path.write_text(component, encoding='utf-8')

          config_path = Path('docs/.vitepress/config.mts')
          config = config_path.read_text(encoding='utf-8')
          config_replacements = [
              (
                  "  description: 'Digital Employee Works — continuously producing verifiable Digital Employee work through a governed runtime',",
                  "  description: 'Digital Employee Works — turning general-purpose AI into Digital Employees with positions, responsibilities, skills, workflows, and verifiable work results',",
                  'Global site description',
              ),
              (
                  "      description: 'A governed production line for verifiable Digital Employee work, observation notes, runtime evidence and formal publications'",
                  "      description: 'Turn general-purpose AI into Digital Employees with positions, responsibilities, skills, workflows, and verifiable work results'",
                  'English locale description',
              ),
              (
                  "      description: '数字员工工场——持续生产可核验的数字员工工作成果，公开运行证据、观察笔记与独立 TMPA 论文体系'",
                  "      description: '让通用 AI 成为数字员工，让 AI 拥有岗位、职责、技能和工作流程，持续完成真实任务，并留下可核验的工作成果'",
                  'Chinese locale description',
              ),
          ]
          for old, new, label in config_replacements:
              config = replace_once(config, old, new, label)
          config_path.write_text(config, encoding='utf-8')

          og_path = Path('docs/public/og-cover.svg')
          og = og_path.read_text(encoding='utf-8')
          og = replace_once(
              og,
              '<text x="92" y="358" fill="#f8fafc" font-size="42" font-family="Arial, sans-serif" font-weight="600">数字员工工场 · 持续生产可核验工作成果</text>',
              '<text x="92" y="358" fill="#f8fafc" font-size="42" font-family="Arial, sans-serif" font-weight="600">让通用 AI 成为数字员工</text>',
              'Open Graph cover slogan',
          )
          og_path.write_text(og, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build site
        run: npm run docs:build

      - name: Commit homepage refinement
        shell: bash
        run: |
          git config user.name 'joinwell52-AI Runtime'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/.vitepress/theme/components/ResearchCenterHome.vue docs/.vitepress/config.mts docs/public/og-cover.svg package-lock.json
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'feat(home): refine digital employee positioning and header alignment'
          git push origin HEAD:main
