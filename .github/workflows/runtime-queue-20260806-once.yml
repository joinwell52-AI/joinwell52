name: Execute Research Runtime Queue 2026-08-06 Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/runtime-queue-20260806-once.yml

permissions:
  contents: write

concurrency:
  group: runtime-queue-20260806
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Git
        run: |
          git config user.name "joinwell52 Research Runtime"
          git config user.email "actions@users.noreply.github.com"

      - name: Verify or persist durable Queue Running state
        id: control
        shell: bash
        run: |
          set -euo pipefail
          date_key="2026-08-06"
          daily="research/runtime/records/daily/2026/08/2026-08-06-daily-runtime.json"
          ledger="research/runtime/2026/08/2026-08-06-runtime.md"

          git fetch origin main
          git reset --hard origin/main

          node <<'NODE'
          const fs = require('fs')
          const { execFileSync } = require('child_process')
          const date = '2026-08-06'
          const dailyPath = 'research/runtime/records/daily/2026/08/2026-08-06-daily-runtime.json'
          const record = JSON.parse(fs.readFileSync(dailyPath, 'utf8'))
          const now = new Intl.DateTimeFormat('sv-SE', {
            timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit',
            hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
          }).format(new Date()).replace(' ', 'T') + '+08:00'
          record.timeline ||= []
          record.taskStatus ||= {}
          const starts = record.timeline.filter(e =>
            e.task === 'queue' && e.event === 'Execution Slot Opened' &&
            e.status === 'Running' && String(e.time || '').startsWith(date)
          )
          if (starts.length > 1) throw new Error(`Duplicate Queue start events already exist: ${starts.length}`)
          const durable = record.status === 'Running' && record.taskStatus.queue === 'Running' && starts.length === 1
          let fallback = false
          if (!durable) {
            fallback = true
            record.status = 'Running'
            record.taskStatus.queue = 'Running'
            if (starts.length === 0) {
              record.timeline.push({
                time: now,
                task: 'queue',
                event: 'Execution Slot Opened',
                status: 'Running',
                detail: 'Scheduler fallback: Research Runtime Queue opened because the durable control-plane start state was absent; Skill 02 triage may begin only after this synchronized JSON and Markdown state is committed and verified.'
              })
            }
            record.commitVerify = 'Pending'
            record.updatedAt = now
            fs.writeFileSync(dailyPath, JSON.stringify(record, null, 2) + '\n')
          }
          fs.writeFileSync('.queue-control.json', JSON.stringify({ fallback, now }, null, 2))
          NODE

          fallback="$(node -p "require('./.queue-control.json').fallback")"
          if [ "$fallback" = "true" ]; then
            node scripts/runtime-markdown.mjs render --date "$date_key"
            node scripts/runtime-markdown.mjs validate --date "$date_key"
            git add "$daily" "$ledger"
            git commit -m "runtime(queue): persist 2026-08-06 fallback Running state"
            git push origin HEAD:main
          fi

          start_commit="$(git rev-parse HEAD)"
          git fetch origin main
          start_commit="$(git rev-parse origin/main)"
          git show "$start_commit:$daily" > /tmp/queue-start.json
          git show "$start_commit:$ledger" > /tmp/queue-start.md
          node <<'NODE'
          const fs = require('fs')
          const date = '2026-08-06'
          const r = JSON.parse(fs.readFileSync('/tmp/queue-start.json', 'utf8'))
          const starts = (r.timeline || []).filter(e => e.task === 'queue' && e.event === 'Execution Slot Opened' && e.status === 'Running' && String(e.time || '').startsWith(date))
          if (r.status !== 'Running') throw new Error(`overall status is ${r.status}, expected Running`)
          if (r.taskStatus?.queue !== 'Running') throw new Error(`taskStatus.queue is ${r.taskStatus?.queue}, expected Running`)
          if (starts.length !== 1) throw new Error(`expected exactly one Queue start event, found ${starts.length}`)
          const md = fs.readFileSync('/tmp/queue-start.md', 'utf8')
          if (!md.includes('Research Runtime Queue') || !md.includes('Running')) throw new Error('Markdown ledger does not expose Queue Running state')
          NODE

          echo "fallback=$fallback" >> "$GITHUB_OUTPUT"
          echo "start_commit=$start_commit" >> "$GITHUB_OUTPUT"
          rm -f .queue-control.json

      - name: Execute Skill 02 Three-Column Research Triage only
        id: triage
        shell: bash
        env:
          START_MODE: ${{ steps.control.outputs.fallback == 'true' && 'scheduler-fallback' || 'scheduler-control-plane' }}
          START_COMMIT: ${{ steps.control.outputs.start_commit }}
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

          node <<'NODE'
          const fs = require('fs')
          const schedulerPath = 'research/runtime/SCHEDULER.json'
          const runPath = 'research/intelligence/runs/2026/08/2026-08-06-intelligence.json'
          const dailyPath = 'research/runtime/records/daily/2026/08/2026-08-06-daily-runtime.json'
          const planPath = 'research/runtime/plans/2026/08/2026-08-06-plan.json'
          const date = '2026-08-06'
          const now = new Intl.DateTimeFormat('sv-SE', {
            timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit',
            hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
          }).format(new Date()).replace(' ', 'T') + '+08:00'
          const scheduler = JSON.parse(fs.readFileSync(schedulerPath, 'utf8'))
          const intelligence = JSON.parse(fs.readFileSync(runPath, 'utf8'))
          const daily = JSON.parse(fs.readFileSync(dailyPath, 'utf8'))
          const starts = (daily.timeline || []).filter(e => e.task === 'queue' && e.event === 'Execution Slot Opened' && e.status === 'Running' && String(e.time || '').startsWith(date))
          if (daily.status !== 'Running' || daily.taskStatus?.queue !== 'Running' || starts.length !== 1) throw new Error('Durable Queue Running control-plane state was not verified')
          const discoveryComplete = daily.taskStatus?.discovery === 'Completed' && daily.results?.discovery?.status === 'Completed' &&
            Array.isArray(intelligence.pipelines) && intelligence.pipelines.length === 3 && intelligence.pipelines.every(p => p.status === 'Completed') &&
            Array.isArray(intelligence.signals) && intelligence.signals.length === 10
          if (!discoveryComplete) {
            daily.status = 'Blocked'
            daily.taskStatus.queue = 'Blocked'
            daily.results ||= {}
            daily.results.queue = {
              schema: 'runtime-shift-result/v2', task: 'queue', status: 'Blocked',
              input: 'The current-day Signal Pool, Research Intelligence run and completed Discovery result.',
              input_zh: '当日 Signal Pool、Research Intelligence Run 与已完成的 Discovery 结果。',
              workResult: 'Queue was blocked because Discovery did not provide the exact required completed input: three completed formal pipelines and ten durable same-day signals.',
              workResult_zh: 'Queue 已阻塞，因为 Discovery 未提供精确所需的完整输入：三项已完成正式流水线及十个持久化同日信号。',
              output: 'No Research Plan was created.', output_zh: '未创建研究计划。',
              next: 'Repair and verify Discovery artifacts before rerunning Queue.', next_zh: '修复并核验 Discovery 成果后再重新执行 Queue。',
              metrics: [{label:'Selected objects',label_zh:'已选对象',value:'0'}],
              evidence: [{label:'Daily Runtime Record',label_zh:'每日运行记录',source:dailyPath},{label:'Research Intelligence run',label_zh:'研究情报运行记录',source:runPath}],
              artifacts: []
            }
            daily.timeline.push({time:now,task:'queue',event:'Queue Blocked',status:'Blocked',detail:'Discovery input was incomplete; no plan was invented.'})
            daily.updatedAt = now
            fs.writeFileSync(dailyPath, JSON.stringify(daily, null, 2) + '\n')
            process.exit(0)
          }

          if (scheduler.resultContract !== 'runtime-shift-result/v2') throw new Error('Unexpected Scheduler result contract')
          const selections = [
            {
              selectionStatus:'Selected', id:'digital-employee', label:'Digital Employee', label_zh:'数字员工',
              itemId:'Q-20260806-01', signalId:'SIG-20260806-R-002', priority:'P0',
              title:'Revisable DAG orchestration for multi-agent computer-use Digital Employees',
              title_zh:'面向计算机操作型数字员工的可修订 DAG 多 Agent 编排', lifecycle:'Selected', pipelineOrigin:'published-research',
              source:'arXiv — Multi-Agent Computer Use', source_zh:'arXiv《Multi-Agent Computer Use》',
              sourceUrl:'https://arxiv.org/abs/2606.01533', evidenceLevels:['peer_reviewed_or_primary_research'],
              secondaryColumns:['open-source-engineering'],
              researchQuestion:'How should a Digital Employee manager decompose long-horizon computer work into a revisable dependency DAG, dispatch ready nodes in parallel, absorb new findings, and preserve accountable completion across workers?',
              researchQuestion_zh:'数字员工管理者应如何把长程计算机操作拆解为可修订依赖 DAG，并行派发就绪节点、吸收新发现，同时在多个执行者之间保持可问责的完成语义？',
              reason:'This is the strongest bounded Digital Employee object in the pool: it directly studies manager-worker decomposition, parallel computer-use execution, dynamic replanning and measured wall-clock effects using primary research rather than a product announcement.',
              reason_zh:'这是信号池中边界最清晰的数字员工对象：它以主要研究直接讨论管理者—执行者拆解、并行计算机操作、动态图修订及墙钟时间测量，而非普通产品公告。',
              next:'Execute Skill 03 Deep Reading on the task decomposition algorithm, DAG revision rules, worker coordination, benchmark design, reported gains, failure cases and limits of transferring the method into governed Digital Employee runtimes.',
              next_zh:'执行 Skill 03 深度阅读，核查任务拆解算法、DAG 修订规则、执行者协调、基准设计、报告收益、失败案例及迁移到受治理数字员工运行时的边界。',
              proposedCategory:'Digital Employee Workflow and Multi-Agent Orchestration', nextSkill:'03 Deep Reading',
              scores:{columnRelevance:5,directionRelevance:5,tmpaRelevance:4,digitalEmployeeRelevance:5,codeFlowMuRelevance:4,engineeringValue:4,novelInformation:5,sourceQuality:4,crossSourceSupport:2,boundedQuestion:5}, totalScore:43
            },
            {
              selectionStatus:'Selected', id:'industry-architecture', label:'Industry Architecture', label_zh:'行业架构',
              itemId:'Q-20260806-02', signalId:'SIG-20260806-P-001', priority:'P0',
              title:'Managed policy, sandbox and resume boundaries in enterprise coding-agent runtimes',
              title_zh:'企业编码 Agent 运行时的托管策略、沙箱与恢复边界', lifecycle:'Selected', pipelineOrigin:'ai-platform',
              source:'Anthropic Claude Code v2.1.223 official release', source_zh:'Anthropic Claude Code v2.1.223 官方发布',
              sourceUrl:'https://github.com/anthropics/claude-code/releases/tag/v2.1.223', evidenceLevels:['official_announcement'],
              secondaryColumns:['open-source-engineering','digital-employee'],
              researchQuestion:'What enterprise control-plane architecture is implied when organization-wide marketplace policy, bypass-permission enforcement, subagent-model fallback disclosure, workflow sandbox boundaries and resumed-session recovery must operate together?',
              researchQuestion_zh:'当组织级 Marketplace 策略、绕过权限强制、子 Agent 模型回退披露、工作流沙箱边界与会话恢复必须协同运行时，它们共同要求怎样的企业控制平面架构？',
              reason:'The release concentrates several enterprise architecture controls in one authoritative object: policy distribution, permission enforcement, sandbox containment, fallback observability and resume recovery. The combination is more valuable than treating each fix as isolated product news.',
              reason_zh:'该官方发布在一个权威对象中集中呈现多项企业架构控制：策略分发、权限强制、沙箱隔离、回退可观测性与恢复治理；其组合价值高于把各项修复视为零散产品新闻。',
              next:'Execute Skill 03 Deep Reading on the exact managed-policy surface, precedence and enforcement points, sandbox escape fixes, fallback disclosure, resume failure modes and what remains undocumented.',
              next_zh:'执行 Skill 03 深度阅读，核查托管策略表面、优先级与执行点、沙箱逃逸修复、回退披露、恢复失败模式及仍未公开的边界。',
              proposedCategory:'Enterprise Agent Runtime Control Plane', nextSkill:'03 Deep Reading',
              scores:{columnRelevance:5,directionRelevance:5,tmpaRelevance:5,digitalEmployeeRelevance:4,codeFlowMuRelevance:5,engineeringValue:5,novelInformation:5,sourceQuality:5,crossSourceSupport:3,boundedQuestion:5}, totalScore:47
            },
            {
              selectionStatus:'Selected', id:'open-source-engineering', label:'Open-source Engineering', label_zh:'开源工程',
              itemId:'Q-20260806-03', signalId:'SIG-20260806-G-001', priority:'P0',
              title:'Atomic legacy rollout migration with semantic replay and recoverable journaling',
              title_zh:'基于语义重放、原子发布与可恢复日志的旧版 Rollout 迁移', lifecycle:'Selected', pipelineOrigin:'github-engineering',
              source:'openai/codex commit aac9f842473ac6a05d417dd76ce8b89bdb3b707d', source_zh:'openai/codex 提交 aac9f842473ac6a05d417dd76ce8b89bdb3b707d',
              sourceUrl:'https://github.com/openai/codex/commit/aac9f842473ac6a05d417dd76ce8b89bdb3b707d', evidenceLevels:['merged_maintainer_change'],
              secondaryColumns:['digital-employee'],
              researchQuestion:'How should an agent runtime migrate active historical execution records while preserving semantic replay, rollback, compaction and subagent history, with atomic publication, idempotency, journaling and crash recovery?',
              researchQuestion_zh:'Agent 运行时应如何迁移活跃历史执行记录，同时保留语义重放、回滚、压缩与子 Agent 历史，并实现原子发布、幂等、日志与崩溃恢复？',
              reason:'The maintainer change exposes a reproducible migration-and-recovery design with strong engineering boundaries: semantic preservation, active-writer exclusion, dry-run, idempotency, journaled recovery and atomic replacement. It directly informs durable agent-runtime history evolution.',
              reason_zh:'该维护者变更给出可复现且边界清晰的迁移恢复设计：语义保持、活跃写入者排除、dry-run、幂等、日志恢复与原子替换，可直接支撑 Agent 运行时历史存储演进。',
              next:'Execute Skill 03 Deep Reading on the commit series, migration state machine, journal format, recovery tests, active-writer detection, atomic replacement and compatibility limits.',
              next_zh:'执行 Skill 03 深度阅读，核查提交链、迁移状态机、日志格式、恢复测试、活跃写入者检测、原子替换及兼容性限制。',
              proposedCategory:'Agent Runtime Migration and Recovery Engineering', nextSkill:'03 Deep Reading',
              scores:{columnRelevance:5,directionRelevance:5,tmpaRelevance:5,digitalEmployeeRelevance:4,codeFlowMuRelevance:5,engineeringValue:5,novelInformation:5,sourceQuality:5,crossSourceSupport:3,boundedQuestion:5}, totalScore:47
            }
          ]

          const selectedIds = new Set(selections.map(s => s.signalId))
          intelligence.signals = intelligence.signals.map(signal => ({
            ...signal,
            triageStatus: selectedIds.has(signal.id) ? 'selected' : 'candidate',
            ...(selectedIds.has(signal.id) ? { selectedItemId: selections.find(s => s.signalId === signal.id).itemId } : {})
          }))
          for (const pipeline of intelligence.pipelines) {
            const sigs = intelligence.signals.filter(s => s.pipeline === pipeline.id)
            pipeline.selected = sigs.filter(s => s.triageStatus === 'selected').length
            pipeline.candidates = sigs.filter(s => s.triageStatus === 'candidate').length
            pipeline.rejected = 0
          }
          intelligence.status = 'Completed'
          intelligence.sourceTask = 'Research Runtime Queue'
          intelligence.updatedAt = now
          intelligence.reason = 'Queue completed Skill 02 only: all ten signals were triaged, exactly one bounded primary object was selected for each column, and the remaining seven signals were retained as candidates. No Deep Reading, analysis, writing or publication was performed.'
          intelligence.reason_zh = 'Queue 仅完成 Skill 02：十个信号均已筛选，三个栏目各选出一个边界明确的主要对象，其余七个信号保留为候选。未开展 Deep Reading、分析、写作或发布。'
          intelligence.controlPlane ||= {}
          intelligence.controlPlane.queueStartStateMode = process.env.START_MODE
          intelligence.controlPlane.queueStartStateCommit = process.env.START_COMMIT
          intelligence.controlPlane.queueStartEventCount = 1
          intelligence.controlPlane.queueVerifiedBeforeSubstantiveWork = true
          intelligence.controlPlane.queueResultCommit = ''
          intelligence.controlPlane.queueResultCommitVerified = false
          intelligence.columns = selections.map(s => ({
            id:s.id,label:s.label,label_zh:s.label_zh,decision:'Selected',
            signals: intelligence.signals.filter(x => x.primaryColumn === s.id).length,
            candidates: intelligence.signals.filter(x => x.primaryColumn === s.id && x.id !== s.signalId).length,
            selectedItemId:s.itemId, selectedTitle:s.title, selectedTitle_zh:s.title_zh,
            reason:s.reason, reason_zh:s.reason_zh, priority:s.priority, signalId:s.signalId,
            source:s.sourceUrl, next:s.next, next_zh:s.next_zh
          }))

          const plan = {
            schema:'runtime-column-plan/v1', date, timezone:'Asia/Shanghai', status:'Completed',
            sourceTask:'Research Runtime Queue', sourceRecord:dailyPath, updatedAt:now, githubCommit:'', columns:selections
          }
          fs.mkdirSync('research/runtime/plans/2026/08', {recursive:true})
          fs.writeFileSync(planPath, JSON.stringify(plan, null, 2) + '\n')
          fs.writeFileSync(runPath, JSON.stringify(intelligence, null, 2) + '\n')

          const queueResult = {
            schema:'runtime-shift-result/v2', task:'queue', status:'Completed',
            input:'The completed 2026-08-06 Signal Pool containing 10 deduplicated signals: 1 AI-platform, 6 GitHub-engineering and 3 published-research signals.',
            input_zh:'已完成的 2026-08-06 Signal Pool，共 10 个去重信号：1 个 AI 平台、6 个 GitHub 工程及 3 个论文研究信号。',
            workResult:'Executed Skill 02 only. Triaged all 10 signals, retained 7 as candidates, rejected 0, and selected exactly one bounded primary object for each of the three columns. No Deep Reading, Analysis, writing or publication was performed.',
            workResult_zh:'仅执行 Skill 02。已筛选全部 10 个信号，保留 7 个候选、拒绝 0 个，并为三个栏目各选出一个边界明确的主要对象。未开展 Deep Reading、Analysis、写作或发布。',
            output:'Today\'s Research Plan with three Selected decisions: revisable DAG orchestration for computer-use Digital Employees; managed policy, sandbox and resume boundaries in enterprise coding-agent runtimes; and atomic recoverable migration of legacy agent rollouts.',
            output_zh:'已形成今日研究计划，三个栏目均为 Selected：计算机操作型数字员工的可修订 DAG 编排、企业编码 Agent 运行时的托管策略/沙箱/恢复边界，以及旧版 Agent Rollout 的原子可恢复迁移。',
            next:'Research Runtime Reading at 11:00 may consume only Q-20260806-01, Q-20260806-02 and Q-20260806-03 and must execute Skill 03 Deep Reading without analysis or article drafting.',
            next_zh:'11:00 Research Runtime Reading 只能消费 Q-20260806-01、Q-20260806-02 与 Q-20260806-03，并仅执行 Skill 03 深度阅读，不得分析或撰写文章。',
            metrics:[
              {label:'Signal Pool',label_zh:'信号池',value:'10'},
              {label:'Column decisions',label_zh:'栏目决定',value:'3 / 3'},
              {label:'Selected objects',label_zh:'已选对象',value:'3'},
              {label:'Candidate signals',label_zh:'候选信号',value:'7'},
              {label:'Rejected signals',label_zh:'拒绝信号',value:'0'},
              {label:'No Selection decisions',label_zh:'未选题决定',value:'0'}
            ],
            evidence:[
              {label:'Scheduler V3.0',label_zh:'Scheduler V3.0',source:schedulerPath},
              {label:'Verified Queue start-state commit',label_zh:'已核验的 Queue 启动状态提交',commit:process.env.START_COMMIT,source:`https://github.com/joinwell52-AI/joinwell52/commit/${process.env.START_COMMIT}`},
              {label:'2026-08-06 Signal Pool',label_zh:'2026-08-06 信号池',source:runPath},
              {label:'Skill 02 Three-Column Research Triage',label_zh:'Skill 02 三栏研究筛选',source:'research/skills/02-research-triage.md'},
              {label:'Runtime Column Plan Contract',label_zh:'Runtime 栏目计划契约',source:'research/runtime/COLUMN-PLAN-SCHEMA.md'}
            ],
            artifacts:[
              {label:'Today\'s Research Plan',label_zh:'今日研究计划',path:planPath},
              {label:'Triaged Research Intelligence run',label_zh:'已筛选的研究情报运行记录',path:runPath},
              {label:'Daily Runtime Record',label_zh:'每日运行机器记录',path:dailyPath},
              {label:'Human-readable Runtime ledger',label_zh:'人类可读运行账本',path:'research/runtime/2026/08/2026-08-06-runtime.md'}
            ]
          }
          daily.results ||= {}
          daily.results.queue = queueResult
          daily.status = 'Waiting'
          daily.taskStatus.queue = 'Completed'
          daily.timeline ||= []
          daily.timeline.push({time:now,task:'queue',event:'Queue Completed',status:'Completed',detail:`Skill 02 triaged all 10 signals after verified ${process.env.START_MODE} start commit ${process.env.START_COMMIT}; exactly one object was selected for each column and no Deep Reading, analysis, writing or publication was performed.`})
          daily.metrics = queueResult.metrics
          daily.evidence = queueResult.evidence
          daily.artifacts = queueResult.artifacts
          daily.githubCommit = ''
          daily.commitVerify = 'Pending'
          daily.updatedAt = now
          fs.writeFileSync(dailyPath, JSON.stringify(daily, null, 2) + '\n')
          NODE

          node scripts/runtime-markdown.mjs render --date 2026-08-06
          node scripts/runtime-markdown.mjs validate --date 2026-08-06
          git diff --check
          git add research/intelligence/runs/2026/08/2026-08-06-intelligence.json \
            research/runtime/plans/2026/08/2026-08-06-plan.json \
            research/runtime/records/daily/2026/08/2026-08-06-daily-runtime.json \
            research/runtime/2026/08/2026-08-06-runtime.md
          git commit -m "runtime(queue): complete 2026-08-06 three-column triage"
          git push origin HEAD:main
          result_commit="$(git rev-parse HEAD)"
          echo "result_commit=$result_commit" >> "$GITHUB_OUTPUT"

      - name: Fetch and verify Queue result commit
        shell: bash
        env:
          RESULT_COMMIT: ${{ steps.triage.outputs.result_commit }}
        run: |
          set -euo pipefail
          daily="research/runtime/records/daily/2026/08/2026-08-06-daily-runtime.json"
          ledger="research/runtime/2026/08/2026-08-06-runtime.md"
          run="research/intelligence/runs/2026/08/2026-08-06-intelligence.json"
          plan="research/runtime/plans/2026/08/2026-08-06-plan.json"
          git fetch origin main
          git cat-file -e "$RESULT_COMMIT^{commit}"
          for path in "$daily" "$ledger" "$run" "$plan"; do
            git cat-file -e "$RESULT_COMMIT:$path"
          done
          git show "$RESULT_COMMIT:$daily" > /tmp/queue-result.json
          git show "$RESULT_COMMIT:$ledger" > /tmp/queue-result.md
          git show "$RESULT_COMMIT:$run" > /tmp/intelligence-result.json
          git show "$RESULT_COMMIT:$plan" > /tmp/plan-result.json
          node <<'NODE'
          const fs = require('fs')
          const daily = JSON.parse(fs.readFileSync('/tmp/queue-result.json','utf8'))
          const intel = JSON.parse(fs.readFileSync('/tmp/intelligence-result.json','utf8'))
          const plan = JSON.parse(fs.readFileSync('/tmp/plan-result.json','utf8'))
          if (daily.taskStatus?.queue !== 'Completed' || daily.results?.queue?.status !== 'Completed') throw new Error('Queue result is not Completed')
          if (daily.results.queue.schema !== 'runtime-shift-result/v2') throw new Error('Queue result contract mismatch')
          if (!Array.isArray(plan.columns) || plan.columns.length !== 3 || plan.columns.some(c => c.selectionStatus !== 'Selected')) throw new Error('Plan does not contain exactly three explicit Selected decisions')
          if (!Array.isArray(intel.columns) || intel.columns.length !== 3 || intel.columns.some(c => c.decision !== 'Selected')) throw new Error('Intelligence run decisions are incomplete')
          const selected = (intel.signals || []).filter(s => s.triageStatus === 'selected')
          if (selected.length !== 3) throw new Error(`Expected three selected signals, found ${selected.length}`)
          const md = fs.readFileSync('/tmp/queue-result.md','utf8')
          if (!md.includes('Research Runtime Queue') || !md.includes('Today') || !md.includes('Q-20260806-01')) throw new Error('Markdown ledger did not preserve Queue result')
          NODE

      - name: Record verified result commit and remove one-time workflow
        id: verify
        shell: bash
        env:
          RESULT_COMMIT: ${{ steps.triage.outputs.result_commit }}
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          node <<'NODE'
          const fs = require('fs')
          const resultCommit = process.env.RESULT_COMMIT
          const date = '2026-08-06'
          const now = new Intl.DateTimeFormat('sv-SE', {
            timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit',
            hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
          }).format(new Date()).replace(' ', 'T') + '+08:00'
          const dailyPath = 'research/runtime/records/daily/2026/08/2026-08-06-daily-runtime.json'
          const runPath = 'research/intelligence/runs/2026/08/2026-08-06-intelligence.json'
          const planPath = 'research/runtime/plans/2026/08/2026-08-06-plan.json'
          const daily = JSON.parse(fs.readFileSync(dailyPath,'utf8'))
          const intel = JSON.parse(fs.readFileSync(runPath,'utf8'))
          const plan = JSON.parse(fs.readFileSync(planPath,'utf8'))
          daily.githubCommit = resultCommit
          daily.commitVerify = 'Completed'
          daily.updatedAt = now
          daily.timeline ||= []
          const verified = daily.timeline.filter(e => e.task === 'queue' && e.event === 'GitHub Commit Verified' && String(e.time||'').startsWith(date))
          if (verified.length === 0) daily.timeline.push({time:now,task:'queue',event:'GitHub Commit Verified',status:'Completed',detail:`Fetched and verified commit ${resultCommit} containing Today's Research Plan, the triaged Research Intelligence run, the Queue-only runtime-shift-result/v2 record and the synchronized Markdown ledger.`})
          else if (verified.length > 1) throw new Error('Duplicate Queue verification events')
          intel.githubCommit = resultCommit
          intel.updatedAt = now
          intel.controlPlane ||= {}
          intel.controlPlane.queueResultCommit = resultCommit
          intel.controlPlane.queueResultCommitVerified = true
          plan.githubCommit = resultCommit
          plan.updatedAt = now
          fs.writeFileSync(dailyPath, JSON.stringify(daily,null,2)+'\n')
          fs.writeFileSync(runPath, JSON.stringify(intel,null,2)+'\n')
          fs.writeFileSync(planPath, JSON.stringify(plan,null,2)+'\n')
          NODE
          node scripts/runtime-markdown.mjs render --date 2026-08-06
          node scripts/runtime-markdown.mjs validate --date 2026-08-06
          rm -f .github/workflows/runtime-queue-20260806-once.yml
          git diff --check
          git add research/intelligence/runs/2026/08/2026-08-06-intelligence.json \
            research/runtime/plans/2026/08/2026-08-06-plan.json \
            research/runtime/records/daily/2026/08/2026-08-06-daily-runtime.json \
            research/runtime/2026/08/2026-08-06-runtime.md \
            .github/workflows/runtime-queue-20260806-once.yml
          git commit -m "runtime(queue): verify 2026-08-06 durable artifacts"
          git push origin HEAD:main
          verification_commit="$(git rev-parse HEAD)"
          echo "verification_commit=$verification_commit" >> "$GITHUB_OUTPUT"

      - name: Verify final main-branch state
        shell: bash
        env:
          RESULT_COMMIT: ${{ steps.triage.outputs.result_commit }}
          VERIFICATION_COMMIT: ${{ steps.verify.outputs.verification_commit }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$VERIFICATION_COMMIT"
          daily="research/runtime/records/daily/2026/08/2026-08-06-daily-runtime.json"
          ledger="research/runtime/2026/08/2026-08-06-runtime.md"
          run="research/intelligence/runs/2026/08/2026-08-06-intelligence.json"
          plan="research/runtime/plans/2026/08/2026-08-06-plan.json"
          for path in "$daily" "$ledger" "$run" "$plan"; do
            git cat-file -e "$VERIFICATION_COMMIT:$path"
          done
          git show "$VERIFICATION_COMMIT:$daily" > /tmp/final-daily.json
          git show "$VERIFICATION_COMMIT:$run" > /tmp/final-intel.json
          git show "$VERIFICATION_COMMIT:$plan" > /tmp/final-plan.json
          git show "$VERIFICATION_COMMIT:$ledger" > /tmp/final-ledger.md
          node <<'NODE'
          const fs = require('fs')
          const result = process.env.RESULT_COMMIT
          const d = JSON.parse(fs.readFileSync('/tmp/final-daily.json','utf8'))
          const i = JSON.parse(fs.readFileSync('/tmp/final-intel.json','utf8'))
          const p = JSON.parse(fs.readFileSync('/tmp/final-plan.json','utf8'))
          const starts = (d.timeline||[]).filter(e=>e.task==='queue'&&e.event==='Execution Slot Opened'&&e.status==='Running'&&String(e.time||'').startsWith('2026-08-06'))
          const verifies = (d.timeline||[]).filter(e=>e.task==='queue'&&e.event==='GitHub Commit Verified'&&String(e.time||'').startsWith('2026-08-06'))
          if (starts.length !== 1) throw new Error(`final Queue start events: ${starts.length}`)
          if (verifies.length !== 1) throw new Error(`final Queue verification events: ${verifies.length}`)
          if (d.githubCommit !== result || d.commitVerify !== 'Completed') throw new Error('Daily commit verification fields are incorrect')
          if (i.githubCommit !== result || i.controlPlane?.queueResultCommitVerified !== true) throw new Error('Intelligence commit verification is incorrect')
          if (p.githubCommit !== result || p.columns.length !== 3) throw new Error('Plan verification is incorrect')
          if (d.taskStatus.queue !== 'Completed' || d.results.queue.status !== 'Completed') throw new Error('Final Queue status is not Completed')
          const md = fs.readFileSync('/tmp/final-ledger.md','utf8')
          if (!md.includes(result) || !md.includes('Q-20260806-03')) throw new Error('Final Markdown ledger is not synchronized')
          NODE
