name: Runtime Analysis 2026-08-07 Verify Once

on:
  push:
    branches:
      - runtime-analysis-20260807-verify
    paths:
      - .github/workflows/runtime-analysis-20260807-verify-once.yml

permissions:
  contents: write

jobs:
  verify-result:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify result artifacts and persist verification state
        shell: bash
        run: |
          set -euo pipefail
          result_commit="238dd8078dffab1c0d1c5a07a21577acdb3de43b"
          git cat-file -e "${result_commit}^{commit}"
          test -f research/analysis/Q-20260807-01-verification-gated-durable-state-admission.md
          test -f research/analysis/Q-20260807-02-role-aware-heterogeneous-agent-resource-plane.md
          test -f research/analysis/Q-20260807-03-stable-identity-provisioning-gate.md
          node scripts/runtime-markdown.mjs validate --date 2026-08-07

          node <<'NODE'
          const fs = require('fs')
          const path = 'research/runtime/records/daily/2026/08/2026-08-07-daily-runtime.json'
          const record = JSON.parse(fs.readFileSync(path, 'utf8'))
          const starts = record.timeline.filter(e => e.task === 'analysis' && e.event === 'Execution Slot Opened' && e.status === 'Running' && e.time.startsWith('2026-08-07T'))
          const completes = record.timeline.filter(e => e.task === 'analysis' && e.event === 'Analysis Completed' && e.status === 'Completed' && e.time.startsWith('2026-08-07T'))
          const verifies = record.timeline.filter(e => e.task === 'analysis' && e.event === 'GitHub Commit Verified' && e.time.startsWith('2026-08-07T'))
          if (starts.length !== 1) throw new Error(`expected one Analysis start, found ${starts.length}`)
          if (completes.length !== 1) throw new Error(`expected one Analysis completion, found ${completes.length}`)
          if (verifies.length !== 0) throw new Error(`Analysis verification already exists: ${verifies.length}`)
          if (record.taskStatus.analysis !== 'Completed') throw new Error('Analysis is not Completed')
          if (record.results.analysis?.status !== 'Completed') throw new Error('Analysis result is not Completed')
          if (record.results.analysis?.schema !== 'runtime-shift-result/v2') throw new Error('Analysis result schema invalid')
          if ((record.results.analysis.artifacts || []).filter(a => /Research Object/.test(a.label || '')).length !== 3) throw new Error('expected 3 Research Object artifacts')
          record.githubCommit = '238dd8078dffab1c0d1c5a07a21577acdb3de43b'
          record.commitVerify = 'Completed'
          record.updatedAt = '2026-08-07T13:14:00+08:00'
          record.timeline.push({
            time: '2026-08-07T13:14:00+08:00',
            task: 'analysis',
            event: 'GitHub Commit Verified',
            status: 'Completed',
            detail: 'Fetched and verified durable Analysis result commit 238dd8078dffab1c0d1c5a07a21577acdb3de43b; all three Research Objects, the Analysis runtime-shift-result/v2 record and regenerated Markdown ledger are present and synchronized, with Discovery, Queue and Reading results preserved.'
          })
          fs.writeFileSync(path, JSON.stringify(record, null, 2) + '\n')
          NODE

          node scripts/runtime-markdown.mjs render --date 2026-08-07
          node scripts/runtime-markdown.mjs validate --date 2026-08-07

          node <<'NODE'
          const fs = require('fs')
          const r = JSON.parse(fs.readFileSync('research/runtime/records/daily/2026/08/2026-08-07-daily-runtime.json','utf8'))
          const starts = r.timeline.filter(e => e.task === 'analysis' && e.event === 'Execution Slot Opened' && e.status === 'Running' && e.time.startsWith('2026-08-07T'))
          const completes = r.timeline.filter(e => e.task === 'analysis' && e.event === 'Analysis Completed' && e.status === 'Completed' && e.time.startsWith('2026-08-07T'))
          const verifies = r.timeline.filter(e => e.task === 'analysis' && e.event === 'GitHub Commit Verified' && e.status === 'Completed' && e.time.startsWith('2026-08-07T'))
          if (starts.length !== 1 || completes.length !== 1 || verifies.length !== 1) throw new Error(`event counts start=${starts.length}, complete=${completes.length}, verify=${verifies.length}`)
          if (r.githubCommit !== '238dd8078dffab1c0d1c5a07a21577acdb3de43b') throw new Error('githubCommit does not point to verified Analysis result')
          if (r.commitVerify !== 'Completed') throw new Error('commitVerify not Completed')
          if (r.status !== 'Waiting' || r.taskStatus.production !== 'Waiting' || r.taskStatus.publication !== 'Waiting') throw new Error('post-Analysis waiting state invalid')
          NODE

      - name: Commit verification state
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/runtime-analysis-20260807-verify-once.yml
          git config user.name "joinwell52 Research Runtime"
          git config user.email "actions@users.noreply.github.com"
          git add research/runtime/records/daily/2026/08/2026-08-07-daily-runtime.json \
            research/runtime/2026/08/2026-08-07-runtime.md \
            .github/workflows/runtime-analysis-20260807-verify-once.yml
          git diff --cached --check
          git commit -m "runtime(analysis): verify 2026-08-07 durable artifacts"
          git push origin HEAD:runtime-analysis-20260807-verify
