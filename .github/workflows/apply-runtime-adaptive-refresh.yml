name: Apply Runtime Adaptive Refresh

on:
  push:
    branches: [runtime-adaptive-refresh]

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: runtime-adaptive-refresh
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply adaptive refresh policy
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/.vitepress/theme/components/RuntimeOperationsCenterClassic.vue')
          text = path.read_text(encoding='utf-8')
          old = """let liveRefreshTimer: ReturnType<typeof setInterval> | undefined
          onMounted(() => {
            void refreshLiveRecord()
            liveRefreshTimer = setInterval(() => void refreshLiveRecord(), 15_000)
          })
          onBeforeUnmount(() => {
            if (liveRefreshTimer) clearInterval(liveRefreshTimer)
          })"""
          new = """const RUNNING_REFRESH_MS = 60_000
          const IDLE_REFRESH_MS = 300_000
          let liveRefreshTimer: ReturnType<typeof setTimeout> | undefined

          const scheduleLiveRefresh = () => {
            if (typeof document === 'undefined') return
            if (liveRefreshTimer) clearTimeout(liveRefreshTimer)
            if (document.hidden) {
              liveRefreshTimer = undefined
              return
            }
            const isWorking = Object.values(record.value.taskStatus || {}).includes('Running')
            const delay = isWorking ? RUNNING_REFRESH_MS : IDLE_REFRESH_MS
            liveRefreshTimer = setTimeout(async () => {
              await refreshLiveRecord()
              scheduleLiveRefresh()
            }, delay)
          }

          const handleVisibilityChange = () => {
            if (typeof document === 'undefined') return
            if (document.hidden) {
              if (liveRefreshTimer) clearTimeout(liveRefreshTimer)
              liveRefreshTimer = undefined
              return
            }
            void refreshLiveRecord().finally(scheduleLiveRefresh)
          }

          onMounted(() => {
            void refreshLiveRecord().finally(scheduleLiveRefresh)
            document.addEventListener('visibilitychange', handleVisibilityChange)
          })
          onBeforeUnmount(() => {
            if (liveRefreshTimer) clearTimeout(liveRefreshTimer)
            if (typeof document !== 'undefined') {
              document.removeEventListener('visibilitychange', handleVisibilityChange)
            }
          })"""
          if old not in text:
              raise SystemExit('Expected fixed 15-second refresh block was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify adaptive policy
        run: |
          grep -q "RUNNING_REFRESH_MS = 60_000" docs/.vitepress/theme/components/RuntimeOperationsCenterClassic.vue
          grep -q "IDLE_REFRESH_MS = 300_000" docs/.vitepress/theme/components/RuntimeOperationsCenterClassic.vue
          grep -q "visibilitychange" docs/.vitepress/theme/components/RuntimeOperationsCenterClassic.vue
          ! grep -q "15_000" docs/.vitepress/theme/components/RuntimeOperationsCenterClassic.vue

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run docs:build

      - name: Commit verified change
        run: |
          rm .github/workflows/apply-runtime-adaptive-refresh.yml
          git config user.name "joinwell52 Runtime Maintainer"
          git config user.email "actions@users.noreply.github.com"
          git add docs/.vitepress/theme/components/RuntimeOperationsCenterClassic.vue .github/workflows/apply-runtime-adaptive-refresh.yml
          git commit -m "fix(runtime): use adaptive dashboard refresh intervals"
          git push origin HEAD:runtime-adaptive-refresh
