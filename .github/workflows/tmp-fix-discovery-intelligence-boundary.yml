name: Temporary Discovery Intelligence Boundary Repair

on:
  push:
    branches: [main]
    paths:
      - 'research/runtime/maintenance-requests/discovery-intelligence-boundary-20260815.json'

permissions:
  contents: write

concurrency:
  group: tmp-discovery-intelligence-boundary-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair Discovery-owned Intelligence completion boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/research-intelligence.mjs')
          text = path.read_text(encoding='utf-8')
          old = """  if (run.status === 'Completed') {
            if (!run.pipelines.every((pipeline) => pipeline.status === 'Completed')) {
              die(`${path}: completed run requires all pipelines Completed`)
            }
            if (!run.columns.every((column) => ['Selected', 'No Selection'].includes(column.decision))) {
              die(`${path}: completed run requires a decision for all three columns`)
            }
          }
          """
          new = """  if (run.status === 'Completed') {
            if (!run.pipelines.every((pipeline) => pipeline.status === 'Completed')) {
              die(`${path}: completed run requires all pipelines Completed`)
            }
            // Discovery owns the Intelligence run and may complete with column
            // decisions still Waiting. Queue owns Selected / No Selection and
            // is validated separately through the same-day plan linkage below.
          }
          """
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one legacy Completed-column gate')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Validate repaired Intelligence contract
        run: |
          npm ci
          npm run intelligence:validate
      - name: Commit and push repair
        run: |
          git config user.name "joinwell52 Research Runtime"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/research-intelligence.mjs
          if git diff --cached --quiet; then
            echo "Repair already applied."
            exit 0
          fi
          git commit -m "fix(runtime): align Discovery Intelligence completion boundary"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
