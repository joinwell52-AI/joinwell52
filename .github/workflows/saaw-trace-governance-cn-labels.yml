name: SaaW Trace Governance Chinese Labels

on:
  push:
    branches:
      - saaw-trace-governance-cn-labels

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: saaw-trace-governance-cn-labels

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply Chinese terminology labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/zh/industry/2026-08-10-saaw-software-as-an-agent-worker.md')
          s = p.read_text(encoding='utf-8')
          replacements = {
              '## 3. 企业真正的难题：Trace 不等于 Governance': '## 3. 企业真正的难题：Trace（执行轨迹）≠ Governance（治理）',
              '> **Trace ≠ Governance**': '> **Trace（执行轨迹）≠ Governance（治理）**',
              '今天许多多智能体系统已经能够生成复杂的执行轨迹（Execution Trace）：': '今天许多多智能体系统已经能够生成复杂的 Trace（执行轨迹）：',
          }
          for old, new in replacements.items():
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}, found {count}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify terminology
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('docs/zh/industry/2026-08-10-saaw-software-as-an-agent-worker.md').read_text(encoding='utf-8')
          assert '## 3. 企业真正的难题：Trace（执行轨迹）≠ Governance（治理）' in s
          assert '> **Trace（执行轨迹）≠ Governance（治理）**' in s
          assert '今天许多多智能体系统已经能够生成复杂的 Trace（执行轨迹）：' in s
          assert 'Trace 不等于 Governance' not in s
          PY

      - name: Build VitePress site
        run: |
          npm ci
          npm run docs:build

      - name: Commit article change and remove temporary workflow
        run: |
          rm .github/workflows/saaw-trace-governance-cn-labels.yml
          git config user.name "joinwell52 Research Runtime"
          git config user.email "actions@users.noreply.github.com"
          git add docs/zh/industry/2026-08-10-saaw-software-as-an-agent-worker.md .github/workflows/saaw-trace-governance-cn-labels.yml
          git commit -m "docs: label Trace and Governance in Chinese"
          git push origin HEAD:saaw-trace-governance-cn-labels
