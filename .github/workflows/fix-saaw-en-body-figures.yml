name: Fix SaaW English Body Figures

on:
  push:
    branches: [saaw-en-sync-from-zh]
    paths:
      - '.github/workflows/fix-saaw-en-body-figures.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: saaw-en-sync-from-zh
          fetch-depth: 0

      - name: Insert synchronized body figures
        run: python3 scripts/fix_saaw_en_body_figures.py

      - name: Verify and build
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('docs/en/industry/2026-08-10-saaw-software-as-an-agent-worker.md').read_text(encoding='utf-8')
          assert s.count('![SaaW governance and runtime architecture: SaaW, CodeFlowMu, FCoP, and TMPA]') == 1
          assert s.count('![Self-Morphing: from meta-development runtime to the digital-worker work loop]') == 1
          PY
          npm ci
          npm run docs:build

      - name: Commit article only
        shell: bash
        run: |
          rm -f scripts/fix_saaw_en_body_figures.py .github/workflows/fix-saaw-en-body-figures.yml
          git config user.name 'joinwell52 Research Runtime'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'docs: align SaaW English body figures with Chinese mother edition'
          git push origin HEAD:saaw-en-sync-from-zh
