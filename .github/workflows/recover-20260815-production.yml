name: Recover 2026-08-15 Production Baselines

on:
  push:
    branches: [main]
    paths:
      - "research/runtime/manual-recovery-requests/2026-08-15-production.json"

permissions:
  contents: write

concurrency:
  group: recover-20260815-production
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authoritative main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Build same-date candidates and deterministic baseline covers
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs')
          const cp = require('child_process')
          const path = require('path')
          const date = '2026-08-15'
          const preparedPath = 'research/runtime/production-work/2026/08/15/prepared-bundle.json'
          const prepared = JSON.parse(fs.readFileSync(preparedPath, 'utf8'))
          if (prepared.runDate !== date || !Array.isArray(prepared.items) || prepared.items.length !== 3) throw new Error('Prepared bundle is not the expected same-date three-item set')
          const expected = ['Q-20260815-01','Q-20260815-02','Q-20260815-03']
          if (JSON.stringify(prepared.items.map(x => x.itemId)) !== JSON.stringify(expected)) throw new Error('Unexpected prepared item identities')
          const now = new Date().toISOString()
          const prompts = {
            'Q-20260815-01': 'Minimal geometric editorial landscape about layered trust, with separated luminous gates and a calm archival field in violet and cyan.',
            'Q-20260815-02': 'Minimal geometric editorial landscape about delegated work returning through a clear terminal contract, with linked forms in teal and mint.',
            'Q-20260815-03': 'Minimal geometric editorial landscape about handoff and effect ownership, with separated routes and warm amber accents on deep blue.'
          }
          const candidates = []
          const coverEvidence = []
          const artifacts = []
          for (const item of prepared.items) {
            const c = structuredClone(item.candidate)
            c.zhPath = item.targetZhPath
            c.enPath = item.targetEnPath
            c.coverPath = item.targetCoverPath
            c.coverGate = 'PASS'
            c.inlineVisualGate = 'PASS'
            c.layoutGate = 'PASS'
            c.lifecycle = 'Publication Candidate'
            c.evidenceStatus = 'Completed'
            c.editingStatus = 'Completed'
            fs.mkdirSync(path.dirname(item.targetEnPath), { recursive: true })
            for (const [source, target, alt] of [
              [item.enDraftPath, item.targetEnPath, `${c.title} cover`],
              [item.zhDraftPath, item.targetZhPath, `${c.title_zh}题图`]
            ]) {
              let body = fs.readFileSync(source, 'utf8')
              const image = `![${alt}](${item.targetCoverPath})`
              const fm = body.match(/^---\r?\n[\s\S]*?\r?\n---\r?\n/)
              if (!fm) throw new Error(`Missing frontmatter: ${source}`)
              if (!body.includes(image)) body = `${fm[0]}\n${image}\n\n${body.slice(fm[0].length)}`
              fs.writeFileSync(target, body)
            }
            cp.execFileSync('node', ['scripts/generate-baseline-cover.mjs','--output',item.targetCoverPath,'--item',item.itemId,'--column',c.column,'--title',c.title], { stdio:'inherit' })
            candidates.push(c)
            coverEvidence.push({
              itemId: item.itemId,
              briefId: `${date}:${item.itemId}-baseline-cover`,
              coverPath: item.targetCoverPath,
              sanitizedPrompt: prompts[item.itemId],
              generationAttempts: 1,
              semanticReview: 'PASS',
              coverRole: 'baseline',
              generator: 'deterministic-baseline-v1'
            })
            artifacts.push(item.targetZhPath, item.targetEnPath, item.targetCoverPath)
          }
          const batchPath = 'research/runtime/candidates/2026/08/2026-08-15-candidates.json'
          fs.mkdirSync(path.dirname(batchPath), { recursive: true })
          const batch = {
            schema: 'runtime-publication-candidate/v2',
            date,
            timezone: 'Asia/Shanghai',
            status: 'Completed',
            sourceTask: 'Research Runtime Production',
            sourceRecord: 'research/runtime/records/daily/2026/08/2026-08-15-daily-runtime.json',
            updatedAt: now,
            githubCommit: 'pending',
            reason: 'Same-date terminal recovery reused the durable bilingual drafts and produced deterministic baseline raster covers under Production Prompt v2.11.0.',
            reason_zh: '同日终态恢复复用已持久化的双语草稿，并按 Production Prompt v2.11.0 生成确定性基础栅格题图。',
            candidates
          }
          fs.writeFileSync(batchPath, `${JSON.stringify(batch, null, 2)}\n`)

          const checkpointPath = 'research/runtime/checkpoints/2026/08/2026-08-15-production.json'
          const checkpoint = JSON.parse(fs.readFileSync(checkpointPath, 'utf8'))
          checkpoint.node = 'validators-passed'
          checkpoint.status = 'Completed'
          checkpoint.lastCompletedNode = 'validators-passed'
          checkpoint.sourceCommit = cp.execFileSync('git', ['rev-parse','HEAD'], { encoding:'utf8' }).trim()
          checkpoint.updatedAt = now
          checkpoint.artifacts = Array.from(new Set([...(checkpoint.artifacts || []), batchPath, ...artifacts]))
          checkpoint.evidence = [
            ...(checkpoint.evidence || []),
            { type:'baseline-cover-recovery', generator:'deterministic-baseline-v1', promptVersion:'2.11.0', itemIds:expected }
          ]
          fs.writeFileSync(checkpointPath, `${JSON.stringify(checkpoint, null, 2)}\n`)

          const resultPath = 'research/runtime/results/2026/08/2026-08-15-production-result.json'
          fs.mkdirSync(path.dirname(resultPath), { recursive:true })
          const result = {
            schema:'runtime-shift-result/v2',
            task:'production',
            family:'daily',
            runtimeDate:date,
            status:'Completed',
            productionMode:'candidate-batch',
            input:{ recoveryType:'explicit-same-day-terminal-recovery', promptVersion:'2.11.0', researchObjects:expected },
            workResult:{ summary:'Recovered the stale Production execution by reusing six durable bilingual drafts, generating three deterministic baseline PNG covers, assembling the V2 candidate batch, and preparing governed finalization.', summary_zh:'从陈旧 Production 执行中恢复：复用六份已持久化双语草稿，生成三张确定性基础 PNG 题图，组装 V2 Candidate Batch，并准备受治理终态收口。' },
            output:{ type:'Publication Candidates', candidateBatch:batchPath, candidateCount:3, bilingualArticleFiles:6, coverAssets:3, inlineFigureAssets:0 },
            next:{ task:'publication', instruction:'Publication may proceed only after this Production completion is durably finalized and GitHub-verified.', instruction_zh:'仅在本次 Production 完成状态持久化并完成 GitHub 核验后，Publication 才可继续。' },
            coverEvidence,
            metrics:[
              {name:'research_objects_consumed',value:3},
              {name:'publication_candidates',value:3},
              {name:'bilingual_article_files',value:6},
              {name:'cover_assets',value:3},
              {name:'direct_image_generation_calls',value:0},
              {name:'direct_publication_actions',value:0}
            ],
            evidence:[preparedPath,'research/runtime/worker-prompts/generated/production.prompt.md'],
            artifacts:[batchPath,...artifacts]
          }
          fs.writeFileSync(resultPath, `${JSON.stringify(result, null, 2)}\n`)
          NODE

      - name: Validate publication candidates and Production proof
        run: |
          set -euo pipefail
          npm run publication:bundle:staged
          npm run publication:layout:validate
          npm run publication:editorial:validate
          npm run runtime:validate
          npm run runtime:production:proof -- --date 2026-08-15 --result research/runtime/results/2026/08/2026-08-15-production-result.json

      - name: Persist artifacts and governed completion request
        run: |
          set -euo pipefail
          cat > research/runtime/completion-requests/2026-08-15-production-baseline-recovery.json <<'JSON'
          {
            "schema": "runtime-shift-completion-request/v1",
            "task": "production",
            "date": "2026-08-15",
            "resultPath": "research/runtime/results/2026/08/2026-08-15-production-result.json",
            "allowHistorical": false
          }
          JSON
          git config user.name "joinwell52 Research Runtime"
          git config user.email "actions@users.noreply.github.com"
          git add staging/publication-candidates research/runtime/candidates research/runtime/checkpoints research/runtime/results research/runtime/completion-requests
          git commit -m "runtime(production): stage 2026-08-15 baseline recovery candidates"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            if [[ "$attempt" -eq 3 ]]; then exit 1; fi
            sleep $((attempt * 5))
          done
