name: Execute Current Governed Publication Release

on:
  push:
    branches: [main]
    paths:
      - "research/runtime/manual-execution-requests/2026-08-18-publication-retry.json"

permissions:
  contents: write

concurrency:
  group: execute-current-governed-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and release 2026-08-18 Publication
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authoritative main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Sync and install
        run: |
          git fetch origin main
          git reset --hard origin/main
          npm ci

      - name: Materialize only currently authorized Publication candidates
        run: node scripts/runtime-publication-release-current.mjs --date 2026-08-18 --wake research/runtime/wakes/2026/08/2026-08-18/publication-200522.json

      - name: Run authoritative Publication validators and build
        run: |
          npm run publication:layout:validate
          npm run publication:editorial:validate
          npm run runtime:validate
          npm run docs:build
          node scripts/publication-visibility.mjs

      - name: Commit and push durable release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "joinwell52 Research Runtime"
          git config user.email "actions@users.noreply.github.com"
          git add docs/en/digital-employee docs/zh/digital-employee docs/en/industry docs/zh/industry docs/en/engineering docs/zh/engineering docs/public/assets/covers docs/public/assets/figures research/runtime/releases/2026-08-18-publication.json research/runtime/results/2026/08/2026-08-18-publication-result.json || true
          if git diff --cached --quiet; then
            echo "No governed release content staged."
            exit 1
          fi
          git commit -m "runtime(publication): release 2026-08-18 research"
          git restore --worktree .
          for attempt in 1 2 3; do
            if git pull --rebase origin main; then
              sha="$(git rev-parse HEAD)"
              if git push origin HEAD:main; then
                echo "release_sha=$sha" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            git rebase --abort || true
            if [[ "$attempt" -eq 3 ]]; then exit 1; fi
            sleep $((attempt * 5))
          done

      - name: Verify durable release on main
        env:
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          git reset --hard origin/main
          node <<'NODE'
          const fs=require('fs')
          const release=JSON.parse(fs.readFileSync('research/runtime/releases/2026-08-18-publication.json','utf8'))
          const result=JSON.parse(fs.readFileSync('research/runtime/results/2026/08/2026-08-18-publication-result.json','utf8'))
          if(release.status!=='Released'||release.date!=='2026-08-18'||release.releasedItems?.length>3)throw new Error('Release manifest invalid')
          if(result.status!=='Completed'||result.runtimeDate!=='2026-08-18'||result.output?.releasedItems!==release.releasedItems.length)throw new Error('Publication result invalid')
          for(const item of release.releasedItems)for(const key of ['zh','en','cover'])if(!fs.existsSync(item[key]))throw new Error(`Missing durable ${item[key]}`)
          console.log(`Verified ${release.releasedItems.length} released items on origin/main.`)
          NODE
