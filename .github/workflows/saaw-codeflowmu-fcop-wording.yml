name: SaaW CodeFlowMu FCoP Wording
on:
  push:
    branches: [saaw-section4-roadmap-wording]
    paths: ['.github/workflows/saaw-codeflowmu-fcop-wording.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: saaw-section4-roadmap-wording
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply bilingual wording correction
        run: |
          python - <<'PY'
          from pathlib import Path
          pairs = [
              (
                  Path('docs/zh/industry/2026-08-10-saaw-software-as-an-agent-worker.md'),
                  '- CodeFlowMu 位于 FCoP 之上的**应用 / 运行层**，使用 FCoP 作为协作协议；',
                  '- **CodeFlowMu 是使用 FCoP 作为协作协议的应用 / 运行系统。**'
              ),
              (
                  Path('docs/en/industry/2026-08-10-saaw-software-as-an-agent-worker.md'),
                  '- CodeFlowMu sits above FCoP in the **Application / Runtime layer** and uses FCoP as its coordination protocol;',
                  '- **CodeFlowMu is an application/runtime system that uses FCoP as its coordination protocol.**'
              ),
          ]
          for p, old, new in pairs:
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'expected text not found in {p}: {old}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify correction
        run: |
          grep -F '**CodeFlowMu 是使用 FCoP 作为协作协议的应用 / 运行系统。**' docs/zh/industry/2026-08-10-saaw-software-as-an-agent-worker.md
          grep -F '**CodeFlowMu is an application/runtime system that uses FCoP as its coordination protocol.**' docs/en/industry/2026-08-10-saaw-software-as-an-agent-worker.md
          ! grep -F '位于 FCoP 之上的' docs/zh/industry/2026-08-10-saaw-software-as-an-agent-worker.md
          ! grep -F 'sits above FCoP' docs/en/industry/2026-08-10-saaw-software-as-an-agent-worker.md
      - name: Build VitePress
        run: |
          npm ci
          npm run docs:build
      - name: Commit article-only correction
        run: |
          rm .github/workflows/saaw-codeflowmu-fcop-wording.yml
          git config user.name 'joinwell52 Research Runtime'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/zh/industry/2026-08-10-saaw-software-as-an-agent-worker.md docs/en/industry/2026-08-10-saaw-software-as-an-agent-worker.md .github/workflows/saaw-codeflowmu-fcop-wording.yml
          git commit -m 'docs: clarify CodeFlowMu relation to FCoP'
          git push origin HEAD:saaw-section4-roadmap-wording
