name: Load homepage frame fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/load-homepage-frame-fix.yml'

permissions:
  contents: write

jobs:
  load-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Load final homepage override
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/.vitepress/theme/index.ts')
          text = path.read_text(encoding='utf-8')
          needle = "import './production-engine-v1.3.css'\n"
          replacement = needle + "import './homepage-frame-fix.css'\n"
          if "import './homepage-frame-fix.css'" not in text:
              if needle not in text:
                  raise SystemExit('import anchor not found')
              text = text.replace(needle, replacement, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - run: npm install --no-audit --no-fund
      - run: npm run docs:build
      - name: Commit
        shell: bash
        run: |
          rm .github/workflows/load-homepage-frame-fix.yml
          git config user.name 'joinwell52-AI Runtime'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/.vitepress/theme/index.ts .github/workflows/load-homepage-frame-fix.yml package-lock.json
          git commit -m 'fix(home): load final header frame override'
          git pull --rebase origin main
          git push origin HEAD:main
