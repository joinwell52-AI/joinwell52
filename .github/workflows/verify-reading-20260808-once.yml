name: Verify Reading 2026-08-08 Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-reading-20260808-once.yml

permissions:
  contents: write

jobs:
  verify-reading:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Reading artifacts and persist commit verification
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          result_commit="fb3e3b069651e82bcd044fc1561b6e90dc8e849b"
          record="research/runtime/records/daily/2026/08/2026-08-08-daily-runtime.json"
          ledger="research/runtime/2026/08/2026-08-08-runtime.md"
          reading1="research/reading/Q-20260808-01-session-budget-governance.md"
          reading2="research/reading/Q-20260808-02-managed-model-auto-review.md"
          reading3="research/reading/Q-20260808-03-code-mode-grpc-host-protocol.md"

          git cat-file -e "${result_commit}^{commit}"
          for p in "$record" "$ledger" "$reading1" "$reading2" "$reading3"; do
            test -f "$p"
            git cat-file -e "${result_commit}:${p}"
          done
          git diff --exit-code "$result_commit" -- "$reading1" "$reading2" "$reading3"

          verify_time="$(TZ=Asia/Shanghai date '+%Y-%m-%dT%H:%M:%S+08:00')"
          VERIFY_TIME="$verify_time" RESULT_COMMIT="$result_commit" RECORD="$record" node <<'NODE'
          const fs = require('fs');
          const p = process.env.RECORD;
          const r = JSON.parse(fs.readFileSync(p, 'utf8'));
          const start = (r.timeline || []).filter(e => e.task === 'reading' && e.event === 'Execution Slot Opened' && e.status === 'Running' && String(e.time || '').startsWith('2026-08-08'));
          const completed = (r.timeline || []).filter(e => e.task === 'reading' && e.event === 'Reading Completed' && e.status === 'Completed' && String(e.time || '').startsWith('2026-08-08'));
          const verified = (r.timeline || []).filter(e => e.task === 'reading' && e.event === 'GitHub Commit Verified' && e.status === 'Completed' && String(e.time || '').startsWith('2026-08-08'));
          if (r.taskStatus?.queue !== 'Completed') throw new Error(`Queue status is ${r.taskStatus?.queue}`);
          if (r.taskStatus?.reading !== 'Completed') throw new Error(`Reading status is ${r.taskStatus?.reading}`);
          if (r.results?.reading?.schema !== 'runtime-shift-result/v2' || r.results?.reading?.status !== 'Completed') throw new Error('Reading result contract/status missing');
          if (r.results.reading.input?.controlPlane?.startCommit !== '959e14a2cae8279bb21d31b6b815440a0b977b75') throw new Error('Unexpected Reading start commit');
          if (r.results.reading.input?.controlPlane?.verifiedBeforeSubstantiveWork !== true) throw new Error('Control plane was not verified before substantive work');
          if (start.length !== 1) throw new Error(`Expected exactly one Reading start event, got ${start.length}`);
          if (completed.length !== 1) throw new Error(`Expected exactly one Reading completed event, got ${completed.length}`);
          if (verified.length > 1) throw new Error(`Duplicate Reading verification events: ${verified.length}`);
          const artifacts = r.results.reading.output?.artifacts || [];
          const expected = [
            'research/reading/Q-20260808-01-session-budget-governance.md',
            'research/reading/Q-20260808-02-managed-model-auto-review.md',
            'research/reading/Q-20260808-03-code-mode-grpc-host-protocol.md'
          ];
          if (expected.some(x => !artifacts.includes(x))) throw new Error('Reading output artifact list incomplete');
          if (r.results.reading.metrics?.find(m => m.name === 'reading_results')?.value !== 3) throw new Error('Reading result count != 3');
          if (r.results.reading.metrics?.find(m => m.name === 'research_analysis_objects')?.value !== 0) throw new Error('Unexpected Analysis objects');
          if (r.results.reading.metrics?.find(m => m.name === 'article_drafts')?.value !== 0) throw new Error('Unexpected article drafts');
          if (verified.length === 0) {
            r.timeline.push({
              time: process.env.VERIFY_TIME,
              task: 'reading',
              event: 'GitHub Commit Verified',
              status: 'Completed',
              detail: `Fetched and verified Reading result commit ${process.env.RESULT_COMMIT}: all three same-day Reading Records, the Reading runtime-shift-result/v2 object, Daily Runtime JSON and synchronized detailed Markdown are present; exactly one current-day Reading Execution Slot Opened / Running event remains. No Research Analysis or article drafting was performed.`
            });
          }
          r.status = 'Waiting';
          r.taskStatus.reading = 'Completed';
          r.githubCommit = process.env.RESULT_COMMIT;
          r.commitVerify = 'Completed';
          r.updatedAt = process.env.VERIFY_TIME;
          fs.writeFileSync(p, JSON.stringify(r, null, 2) + '\n');
          NODE

          # Restore the source-complete detailed projection written with the Reading result,
          # then project the verification metadata/event without collapsing structured result fields.
          git show "${result_commit}:${ledger}" > "$ledger"
          VERIFY_TIME="$verify_time" RESULT_COMMIT="$result_commit" LEDGER="$ledger" node <<'NODE'
          const fs = require('fs');
          const p = process.env.LEDGER;
          let s = fs.readFileSync(p, 'utf8');
          const t = process.env.VERIFY_TIME;
          const c = process.env.RESULT_COMMIT;
          s = s.replace('github_commit: "pending"', `github_commit: "${c}"`)
               .replace('commit_verify: "Running"', 'commit_verify: "Completed"')
               .replace('updated_at: "2026-08-08T11:25:30+08:00"', `updated_at: "${t}"`)
               .replace('- **GitHub Commit:** pending', `- **GitHub Commit:** ${c}`)
               .replace('- **Commit Verify:** 工作中 / Running', '- **Commit Verify:** 已完成 / Completed')
               .replace('- **最后更新 / Updated:** 2026-08-08T11:25:30+08:00', `- **最后更新 / Updated:** ${t}`);
          if (!s.includes('| 2026-08-08T11:25:30+08:00 | 研究运行阅读 / Research Runtime Reading | daily | Reading Completed |')) throw new Error('Reading Completed timeline row missing');
          if (!s.includes('| 研究运行阅读 / Research Runtime Reading | daily | GitHub Commit Verified |')) {
            const marker = '| 2026-08-08T11:25:30+08:00 | 研究运行阅读 / Research Runtime Reading | daily | Reading Completed | 已完成 / Completed | Skill 03 Deep Reading completed for all three same-day Selected objects after verified fallback start commit 959e14a2cae8279bb21d31b6b815440a0b977b75; three durable source-traceable Reading Records were produced. No Research Analysis, architecture recommendation or article drafting was performed. |';
            const row = `| ${t} | 研究运行阅读 / Research Runtime Reading | daily | GitHub Commit Verified | 已完成 / Completed | Fetched and verified Reading result commit ${c}: all three same-day Reading Records, the Reading runtime-shift-result/v2 object, Daily Runtime JSON and synchronized detailed Markdown are present; exactly one current-day Reading Execution Slot Opened / Running event remains. No Research Analysis or article drafting was performed. |`;
            s = s.replace(marker, `${marker}\n${row}`);
          }
          const readingHeader = '- **Completed:** 2026-08-08T11:25:30+08:00';
          if (s.includes(readingHeader) && !s.includes(`- **Result Commit:** \`${c}\``)) {
            s = s.replace(readingHeader, `${readingHeader}\n- **Result Commit:** \`${c}\`\n- **Commit Verify:** \`Completed\``);
          }
          if (s.includes('[object Object]')) throw new Error('Structured Runtime result fields collapsed in Markdown');
          fs.writeFileSync(p, s.endsWith('\n') ? s : s + '\n');
          NODE

          npm run runtime:validate
          node scripts/runtime-markdown.mjs validate --date 2026-08-08
          grep -q 'Result Contract.*runtime-shift-result/v2' "$ledger"
          grep -q 'Q-20260808-01' "$ledger"
          grep -q 'Q-20260808-02' "$ledger"
          grep -q 'Q-20260808-03' "$ledger"
          test "$(grep -c '| 研究运行阅读 / Research Runtime Reading | daily | Execution Slot Opened | 工作中 / Running |' "$ledger")" -eq 1
          test "$(grep -c '| 研究运行阅读 / Research Runtime Reading | daily | GitHub Commit Verified | 已完成 / Completed |' "$ledger")" -eq 1
          git diff --check

          rm -f .github/workflows/verify-reading-20260808-once.yml
          git config user.name "joinwell52 Research Runtime"
          git config user.email "actions@users.noreply.github.com"
          git add "$record" "$ledger" .github/workflows/verify-reading-20260808-once.yml
          if git diff --cached --quiet; then
            echo "No verification delta to persist."
            exit 0
          fi
          git commit -m "runtime(reading): verify 2026-08-08 durable artifacts"
          git pull --rebase origin main
          git push origin HEAD:main
