name: SaaW Section 4 Roadmap Wording
on:
  push:
    branches: [saaw-section4-roadmap-wording]
    paths: ['.github/workflows/saaw-section4-roadmap-wording.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: saaw-section4-roadmap-wording
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply bilingual wording correction
        run: |
          python - <<'PY'
          from pathlib import Path
          files = {
              Path('docs/zh/industry/2026-08-10-saaw-software-as-an-agent-worker.md'): (
                  '**以下第 4—7 节逐条展开这四条规则：第 4 节讨论文本承载持久消息与状态；第 5 节讨论单写者的局部串行流；第 6 节讨论多条串行流的异步并行协作；第 7 节讨论读端重建与问题集（Issue Set）。**',
                  '**本节与第 5—7 节逐条展开这四条规则：本节讨论文本承载持久消息与状态；第 5 节讨论单写者的局部串行流；第 6 节讨论多条串行流的异步并行协作；第 7 节讨论读端重建与问题集（Issue Set）。**'
              ),
              Path('docs/en/industry/2026-08-10-saaw-software-as-an-agent-worker.md'): (
                  '**Sections 4–7 expand these four rules in order: Section 4 covers durable messages and state in text; Section 5 covers local Single-Writer serial streams; Section 6 covers asynchronous parallel collaboration across streams; Section 7 covers read-side reconstruction and the Issue Set.**',
                  '**This section and Sections 5–7 expand these four rules in order: this section covers durable messages and state in text; Section 5 covers local Single-Writer serial streams; Section 6 covers asynchronous parallel collaboration across streams; Section 7 covers read-side reconstruction and the Issue Set.**'
              ),
          }
          for path, (old, new) in files.items():
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one target, got {text.count(old)}')
              path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Verify correction
        run: |
          grep -F '本节与第 5—7 节逐条展开这四条规则：本节讨论文本承载持久消息与状态' docs/zh/industry/2026-08-10-saaw-software-as-an-agent-worker.md
          grep -F 'This section and Sections 5–7 expand these four rules in order: this section covers durable messages and state in text' docs/en/industry/2026-08-10-saaw-software-as-an-agent-worker.md
          ! grep -F '以下第 4—7 节逐条展开' docs/zh/industry/2026-08-10-saaw-software-as-an-agent-worker.md
      - name: Build VitePress
        run: |
          npm ci
          npm run docs:build
      - name: Commit article-only correction
        run: |
          git config user.name 'joinwell52 Research Runtime'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/saaw-section4-roadmap-wording.yml
          git add docs/zh/industry/2026-08-10-saaw-software-as-an-agent-worker.md docs/en/industry/2026-08-10-saaw-software-as-an-agent-worker.md
          git commit -m 'docs: correct section 4 roadmap wording'
          git push origin HEAD:saaw-section4-roadmap-wording
