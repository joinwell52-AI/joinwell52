name: Fix Runtime Light Hero Contrast

on:
  push:
    branches:
      - fix-runtime-light-hero-contrast

permissions:
  contents: write

jobs:
  fix-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix-runtime-light-hero-contrast
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply light-mode contrast fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/.vitepress/theme/runtime-operations.css')
          text = path.read_text(encoding='utf-8')
          marker = '/* Light-mode hero contrast correction. */'
          block = r'''

/* Light-mode hero contrast correction. */
.runtime-center-page:not(.dark) .runtime-classic .hero h1 {
  color: #202544;
  text-shadow: none;
}
.runtime-center-page:not(.dark) .runtime-classic .hero p {
  color: #3f4961;
}
.runtime-center-page:not(.dark) .runtime-classic .kicker {
  color: #5548df;
}
.runtime-center-page:not(.dark) .runtime-classic .hero-actions b {
  color: #5649d8;
  font-weight: 850;
}
.runtime-center-page:not(.dark) .runtime-classic .hero-actions a {
  color: #3f38c6;
  font-weight: 750;
}
.dark .runtime-center-page .runtime-classic .hero h1 {
  color: var(--rt-text);
}
.dark .runtime-center-page .runtime-classic .hero p {
  color: var(--rt-copy);
}
.dark .runtime-center-page .runtime-classic .hero-actions b {
  color: #d8d4ff;
}
'''
          if marker in text:
              text = text[:text.index(marker)].rstrip() + block
          else:
              text = text.rstrip() + block
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm install

      - name: Validate and build
        run: |
          npm run runtime:validate
          npm run docs:build

      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "joinwell52 Research Runtime"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/fix-runtime-light-hero-contrast.yml
          git add docs/.vitepress/theme/runtime-operations.css
          git commit -m "fix(runtime): increase light hero contrast"
          git push origin HEAD:fix-runtime-light-hero-contrast
