name: One-time P2 run artifact reference repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-fix-p2-run-artifact-ref.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Repair top-level P2 artifact reference
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs')
          const file = 'research/intelligence/p2-runs/2026/09/2026-09-06-p2-special.json'
          const data = JSON.parse(fs.readFileSync(file, 'utf8'))
          const selected = data.objects.find(x => x.objectId === data.selection?.selectedObjectId)
          if (!selected) throw new Error('Selected P2 object not found')
          const studies = (selected.artifacts || []).filter(x => typeof x === 'string' && x.startsWith('research/intelligence/p2-studies/'))
          if (studies.length !== 1) throw new Error(`Expected exactly one selected study artifact, got ${studies.length}`)
          if (!fs.existsSync(studies[0])) throw new Error(`Selected study artifact does not exist: ${studies[0]}`)
          data.artifacts = studies
          fs.writeFileSync(file, JSON.stringify(data, null, 2) + '\n')
          console.log(`Bound run.artifacts to ${studies[0]}`)
          NODE
      - name: Validate P2 and self-remove workflow
        shell: bash
        run: |
          node scripts/p2-special-study.mjs validate
          rm .github/workflows/tmp-fix-p2-run-artifact-ref.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/intelligence/p2-runs/2026/09/2026-09-06-p2-special.json .github/workflows/tmp-fix-p2-run-artifact-ref.yml
          git commit -m "fix(p2): bind selected study artifact to completed run"
          git push origin HEAD:main
