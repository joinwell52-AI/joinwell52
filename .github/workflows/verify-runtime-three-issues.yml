name: Verify Runtime History and Contrast Repairs

on:
  push:
    branches:
      - fix-runtime-history-card-text-header-dark

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix-runtime-history-card-text-header-dark
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply focused repairs
        run: python scripts/fix-runtime-history-card-text-header.py

      - name: Install dependencies
        run: npm install

      - name: Validate and build
        run: |
          npm run runtime:validate
          npm run runtime:markdown:validate
          npm run docs:build

      - name: Verify actual Runtime page
        shell: bash
        run: |
          npm install --no-save playwright-core@1.55.0
          mkdir -p /tmp/runtime-three-fix-site
          ln -s "$GITHUB_WORKSPACE/docs/.vitepress/dist" /tmp/runtime-three-fix-site/joinwell52
          nohup python3 -m http.server 4173 --directory /tmp/runtime-three-fix-site >/tmp/runtime-three-fix-server.log 2>&1 &
          sleep 2
          export CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          cat > runtime-three-fix-check.mjs <<'JS'
          import { chromium } from 'playwright-core'

          const browser = await chromium.launch({
            headless: true,
            executablePath: process.env.CHROME,
            args: ['--no-sandbox']
          })
          const page = await browser.newPage({ viewport: { width: 1440, height: 1200 }, colorScheme: 'light' })
          await page.goto('http://127.0.0.1:4173/joinwell52/zh/runtime/', { waitUntil: 'networkidle' })
          await page.evaluate(() => document.documentElement.classList.remove('dark'))
          await page.waitForTimeout(300)

          if (await page.locator('.runtime-classic').count() !== 1) {
            throw new Error('Current V5 page did not remain on Runtime Classic')
          }

          const history = page.locator('.history-list')
          const historyText = await history.innerText()
          if (!historyText.includes('2026-08-03')) throw new Error(`2026-08-03 missing from history: ${historyText}`)
          const oldRecordHref = await history.locator('a', { hasText: '2026-08-03' }).getAttribute('href')
          if (!oldRecordHref?.endsWith('/research/runtime/2026/08/2026-08-03-runtime.md')) {
            throw new Error(`2026-08-03 link is not the Markdown ledger: ${oldRecordHref}`)
          }
          const currentRecordHref = await history.locator('a', { hasText: '2026-08-05' }).getAttribute('href')
          if (!currentRecordHref?.endsWith('/research/runtime/2026/08/2026-08-05-runtime.md')) {
            throw new Error(`2026-08-05 link is not the Markdown ledger: ${currentRecordHref}`)
          }

          const color = async (selector) => page.locator(selector).first().evaluate((el) => getComputedStyle(el).color)
          const bodyColor = await color('.runtime-classic .column-card dd')
          const idColor = await color('.runtime-classic .column-card .topic small')
          const metricLabelColor = await color('.runtime-classic .column-card .mini-metrics span')
          if (bodyColor !== 'rgb(226, 232, 240)') throw new Error(`Column body contrast failed: ${bodyColor}`)
          if (idColor !== 'rgb(203, 213, 225)') throw new Error(`Column ID contrast failed: ${idColor}`)
          if (metricLabelColor !== 'rgb(51, 65, 85)') throw new Error(`Metric label contrast failed: ${metricLabelColor}`)

          await page.evaluate(() => document.documentElement.classList.add('dark'))
          await page.waitForTimeout(200)
          const wordmarkGradient = await page.locator('.VPNavBarTitle .title span').evaluate((el) => getComputedStyle(el, '::before').backgroundImage)
          const wordmarkSubtitle = await page.locator('.VPNavBarTitle .title').evaluate((el) => getComputedStyle(el, '::after').color)
          if (!wordmarkGradient.includes('rgb(255, 255, 255)')) {
            throw new Error(`Dark wordmark did not switch to a light gradient: ${wordmarkGradient}`)
          }
          if (wordmarkSubtitle !== 'rgb(170, 181, 202)') {
            throw new Error(`Dark wordmark subtitle is not readable: ${wordmarkSubtitle}`)
          }

          await page.screenshot({ path: 'runtime-three-fixes-light.png', fullPage: true })
          await page.close()
          await browser.close()
          JS
          node runtime-three-fix-check.mjs

      - name: Upload visual verification
        uses: actions/upload-artifact@v4
        with:
          name: runtime-three-fixes-preview
          path: runtime-three-fixes-light.png

      - name: Commit verified repairs
        shell: bash
        run: |
          git config user.name "joinwell52 Research Runtime"
          git config user.email "actions@users.noreply.github.com"
          git rm scripts/fix-runtime-history-card-text-header.py
          rm -f runtime-three-fix-check.mjs runtime-three-fixes-light.png
          git add scripts/runtime-legacy-compat.mjs
          git add docs/.vitepress/theme/components/RuntimeOperationsCenterClassic.vue
          git add docs/.vitepress/theme/column-palette-final.css
          git commit -m "fix(runtime): restore full history and readable column/header colors [skip ci]"
          git push origin HEAD:fix-runtime-history-card-text-header-dark
