name: Diagnose 2026-08-18 Publication

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-20260818-publication.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Materialize current governed Publication
        run: node scripts/runtime-publication-release-current.mjs --date 2026-08-18 --wake research/runtime/wakes/2026/08/2026-08-18/publication-200522.json
      - name: Validate layout
        run: npm run publication:layout:validate
      - name: Validate editorial
        run: npm run publication:editorial:validate
      - name: Validate runtime
        run: npm run runtime:validate
      - name: Build site
        run: npm run docs:build
      - name: Validate public visibility
        run: node scripts/publication-visibility.mjs
