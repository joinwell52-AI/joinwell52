name: Execute Runtime V5 Publication 2026-08-05

on:
  push:
    branches:
      - runtime-publication-exec-20260805

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: mainrepo

      - name: Checkout execution control
        uses: actions/checkout@v4
        with:
          ref: runtime-publication-exec-20260805
          fetch-depth: 0
          path: control

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare governed executor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('control/scripts/execute-runtime-publication-20260805.mjs')
          text = path.read_text(encoding='utf-8')
          text, count = re.subn(r"function sha256\(text\) \{\n  return \(await import\('node:crypto'\)\)\.createHash\('sha256'\)\.update\(text\)\.digest\('hex'\)\n\}\n", '', text)
          if count != 1:
              raise SystemExit(f'Executor patch count was {count}, expected 1')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install repository dependencies
        working-directory: mainrepo
        run: npm install

      - name: Execute and persist publication result
        shell: bash
        run: |
          set +e
          cd mainrepo
          node ../control/scripts/execute-runtime-publication-20260805.mjs "$PWD" ../control/runtime-publication-result.json 2>&1 | tee ../control/runtime-publication-execution.log
          status=${PIPESTATUS[0]}
          set -e
          cd ../control
          if [ ! -f runtime-publication-result.json ]; then
            printf '{\n  "date": "2026-08-05",\n  "outcome": "Failed",\n  "error": "Executor ended without a result file"\n}\n' > runtime-publication-result.json
          fi
          git config user.name 'Research Runtime Publication'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase origin runtime-publication-exec-20260805
          git add runtime-publication-result.json runtime-publication-execution.log
          git commit -m 'runtime(publication): persist execution result [skip ci]'
          git push origin HEAD:runtime-publication-exec-20260805
          exit "$status"
