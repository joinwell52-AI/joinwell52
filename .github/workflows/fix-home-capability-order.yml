name: Fix homepage brand and capability order

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-home-capability-order.yml'

permissions:
  contents: write

jobs:
  fix-home:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Correct capability order and redesign wordmark
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/.vitepress/theme/components/ResearchCenterHome.vue')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          zh_old = """  systems: [
    { no:'01', kind:'产品', role:'工场直接生产的数字劳动力', name:['Digital','Employee'], description:'面向组织岗位、权限、工作流、成果与评价的受治理数字劳动力，是工场的产品与交付对象。', path:'/zh/digital-employee/', tone:'employee', cta:'查看产品层' },
    { no:'02', kind:'运行', role:'数字员工开发与工作 Runtime', name:['CodeFlowMu'], description:'承载数字员工开发、受治理执行、恢复与持久工作证据，是工场能力的运行层与开源参考环境。', path:'https://github.com/joinwell52-AI/CodeFlowMu-open', logo:'/assets/logos/codeflowmu.png', tone:'codeflow', cta:'打开 GitHub' },
    { no:'03', kind:'协议', role:'基于文件的协同协议', name:['FCoP'], description:'以项目可见文件承载任务、报告、审阅与生命周期证据，为 CodeFlowMu 与数字员工提供可重建的协同事实。', path:'https://joinwell52-ai.github.io/FCoP/', logo:'https://raw.githubusercontent.com/joinwell52-AI/FCoP/main/assets/fcop-logo-256.png', tone:'fcop', cta:'打开 FCoP 官网' },
    { no:'04', kind:'理论', role:'文本多智能体流程架构', name:['TMPA'], description:'独立记录治理理论、规范对象与 Reader 行为，为协议与运行层提供理论基础，但不把工场日常产出自动当作论文证据。', path:'/zh/publications/tmpa-architecture-paper-a0.5', logo:'/logo.svg?v=tmpa-20260803-3', tone:'tmpa', cta:'论文与规范' }
  ],"""
          zh_new = """  systems: [
    { no:'01', kind:'理论', role:'文本多智能体流程架构', name:['TMPA'], description:'独立记录治理理论、规范对象与 Reader 行为，为协议与运行层提供理论基础，但不把工场日常产出自动当作论文证据。', path:'/zh/publications/tmpa-architecture-paper-a0.5', logo:'/logo.svg?v=tmpa-20260803-3', tone:'tmpa', cta:'论文与规范' },
    { no:'02', kind:'协议', role:'基于文件的协同协议', name:['FCoP'], description:'以项目可见文件承载任务、报告、审阅与生命周期证据，为 CodeFlowMu 与数字员工提供可重建的协同事实。', path:'https://joinwell52-ai.github.io/FCoP/', logo:'https://raw.githubusercontent.com/joinwell52-AI/FCoP/main/assets/fcop-logo-256.png', tone:'fcop', cta:'打开 FCoP 官网' },
    { no:'03', kind:'运行', role:'数字员工开发与工作 Runtime', name:['CodeFlowMu'], description:'承载数字员工开发、受治理执行、恢复与持久工作证据，是工场能力的运行层与开源参考环境。', path:'https://github.com/joinwell52-AI/CodeFlowMu-open', logo:'/assets/logos/codeflowmu.png', tone:'codeflow', cta:'打开 GitHub' },
    { no:'04', kind:'产品', role:'工场直接生产的数字劳动力', name:['Digital','Employee'], description:'面向组织岗位、权限、工作流、成果与评价的受治理数字劳动力，是工场的产品与交付对象。', path:'/zh/digital-employee/', tone:'employee', cta:'查看产品层' }
  ],"""
          replace_once(zh_old, zh_new, 'Chinese capability order')

          en_old = """  systems: [
    { no:'01', kind:'PRODUCT', role:'DIGITAL WORKFORCE PRODUCED BY THE WORKS', name:['Digital','Employee'], description:'Governed digital labor organized around positions, authority, workflows, deliverables, and evaluation—the product and delivery object of the Works.', path:'/en/digital-employee/', tone:'employee', cta:'View product layer' },
    { no:'02', kind:'RUNTIME', role:'DIGITAL EMPLOYEE DEVELOPMENT AND WORK RUNTIME', name:['CodeFlowMu'], description:'The runtime layer for Digital Employee development, governed execution, recovery, and durable work evidence, with an open-source reference environment.', path:'https://github.com/joinwell52-AI/CodeFlowMu-open', logo:'/assets/logos/codeflowmu.png', tone:'codeflow', cta:'Open GitHub' },
    { no:'03', kind:'PROTOCOL', role:'FILE-BASED COORDINATION PROTOCOL', name:['FCoP'], description:'Project-visible files carry tasks, reports, reviews, and lifecycle evidence, providing reconstructable coordination facts for CodeFlowMu and Digital Employees.', path:'https://joinwell52-ai.github.io/FCoP/', logo:'https://raw.githubusercontent.com/joinwell52-AI/FCoP/main/assets/fcop-logo-256.png', tone:'fcop', cta:'Open FCoP site' },
    { no:'04', kind:'THEORY', role:'TEXTUAL MULTI-AGENT PROCESS ARCHITECTURE', name:['TMPA'], description:'Independently records governance theory, normative objects, and Reader behavior. It underpins the protocol and runtime layers without treating daily factory output as automatic paper evidence.', path:'/en/publications/tmpa-architecture-paper-a0.5', logo:'/logo.svg?v=tmpa-20260803-3', tone:'tmpa', cta:'Paper & specification' }
  ],"""
          en_new = """  systems: [
    { no:'01', kind:'THEORY', role:'TEXTUAL MULTI-AGENT PROCESS ARCHITECTURE', name:['TMPA'], description:'Independently records governance theory, normative objects, and Reader behavior. It underpins the protocol and runtime layers without treating daily factory output as automatic paper evidence.', path:'/en/publications/tmpa-architecture-paper-a0.5', logo:'/logo.svg?v=tmpa-20260803-3', tone:'tmpa', cta:'Paper & specification' },
    { no:'02', kind:'PROTOCOL', role:'FILE-BASED COORDINATION PROTOCOL', name:['FCoP'], description:'Project-visible files carry tasks, reports, reviews, and lifecycle evidence, providing reconstructable coordination facts for CodeFlowMu and Digital Employees.', path:'https://joinwell52-ai.github.io/FCoP/', logo:'https://raw.githubusercontent.com/joinwell52-AI/FCoP/main/assets/fcop-logo-256.png', tone:'fcop', cta:'Open FCoP site' },
    { no:'03', kind:'RUNTIME', role:'DIGITAL EMPLOYEE DEVELOPMENT AND WORK RUNTIME', name:['CodeFlowMu'], description:'The runtime layer for Digital Employee development, governed execution, recovery, and durable work evidence, with an open-source reference environment.', path:'https://github.com/joinwell52-AI/CodeFlowMu-open', logo:'/assets/logos/codeflowmu.png', tone:'codeflow', cta:'Open GitHub' },
    { no:'04', kind:'PRODUCT', role:'DIGITAL WORKFORCE PRODUCED BY THE WORKS', name:['Digital','Employee'], description:'Governed digital labor organized around positions, authority, workflows, deliverables, and evaluation—the product and delivery object of the Works.', path:'/en/digital-employee/', tone:'employee', cta:'View product layer' }
  ],"""
          replace_once(en_old, en_new, 'English capability order')

          old_css = ''':global(.portal-v5-page .VPNavBar .container) { width: min(1220px, calc(100% - 72px)); max-width: none; margin-inline: auto; padding-inline: 0; }
:global(.portal-v5-page .VPNavBarTitle .title) { display: grid; align-content: center; gap: 3px; min-width: max-content; color: transparent; background: linear-gradient(112deg, #090d18 0%, #293653 42%, #5b4cf0 76%, #31b8d4 100%); background-clip: text; -webkit-background-clip: text; font-family: "Arial Black", "Noto Sans SC", "Microsoft YaHei", ui-sans-serif, system-ui, sans-serif; font-size: 20px; font-weight: 950; line-height: .92; letter-spacing: -.085em; text-shadow: 0 1px 0 rgba(255,255,255,.5); filter: drop-shadow(0 4px 9px rgba(79,70,229,.15)); transform: skewX(-4deg); transform-origin: left center; }
:global(.portal-v5-page .VPNavBarTitle .title::after) { content: \"DIGITAL EMPLOYEE WORKS\"; color: #69748a; -webkit-text-fill-color: #69748a; font: 800 7px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: .16em; transform: skewX(4deg); transform-origin: left center; }'''
          new_css = ''':global(.portal-v5-page .VPNavBar .container) { width: 100%; max-width: none; margin: 0; padding: 0; }
:global(.portal-v5-page .VPNavBarTitle) { position: fixed; top: 0; left: max(36px, calc((100vw - 1220px) / 2)); z-index: 102; width: auto !important; height: 64px; padding: 0 !important; }
:global(.portal-v5-page .VPNavBarTitle .title) { position: relative; display: flex; align-items: center; height: 64px; min-width: max-content; padding: 0; color: transparent; background: none; font-size: 0; line-height: 1; letter-spacing: normal; text-shadow: none; filter: none; transform: none; }
:global(html[lang="zh-CN"] .portal-v5-page .VPNavBarTitle .title span) { display: inline-flex; align-items: center; gap: 9px; font-size: 0; }
:global(html[lang="zh-CN"] .portal-v5-page .VPNavBarTitle .title span::before) { content: "数字员工"; color: transparent; background: linear-gradient(105deg, #0a1020 0%, #27385e 46%, #5b4cf0 78%, #22a9c7 100%); background-clip: text; -webkit-background-clip: text; font-family: "Microsoft YaHei UI", "PingFang SC", "Noto Sans SC", sans-serif; font-size: 21px; font-weight: 950; line-height: 1; letter-spacing: -.085em; }
:global(html[lang="zh-CN"] .portal-v5-page .VPNavBarTitle .title span::after) { content: "工场"; display: inline-grid; min-height: 24px; padding: 0 7px; place-items: center; color: #fff; background: linear-gradient(135deg, #5b4cf0, #287edb 68%, #22b7c8); border-radius: 5px 11px 5px 11px; box-shadow: 0 6px 14px rgba(79,70,229,.24), inset 0 0 0 1px rgba(255,255,255,.2); font-family: "Microsoft YaHei UI", "PingFang SC", "Noto Sans SC", sans-serif; font-size: 11px; font-weight: 900; line-height: 1; letter-spacing: .08em; }
:global(html[lang="zh-CN"] .portal-v5-page .VPNavBarTitle .title::after) { position: absolute; top: 43px; left: 1px; content: "DIGITAL EMPLOYEE WORKS"; color: #7b879d; -webkit-text-fill-color: #7b879d; font: 800 6.5px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: .17em; }
:global(html:not([lang="zh-CN"]) .portal-v5-page .VPNavBarTitle .title span) { color: transparent; background: linear-gradient(105deg, #0a1020 0%, #33456d 56%, #5b4cf0 100%); background-clip: text; -webkit-background-clip: text; font: 900 18px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: -.045em; }
:global(.portal-v5-page .VPNavBarSearch) { position: fixed; top: 11px; left: max(226px, calc((100vw - 1220px) / 2 + 196px)); z-index: 101; }'''
          replace_once(old_css, new_css, 'Homepage navbar wordmark')

          old_dark = ''':global(.dark .portal-v5-page .VPNavBarTitle .title) { background: linear-gradient(105deg, #ffffff 0%, #b8c6e5 52%, #8b7cff 100%); background-clip: text; -webkit-background-clip: text; }
:global(.dark .portal-v5-page .VPNavBarTitle .title::after) { color: #8d9ab5; -webkit-text-fill-color: #8d9ab5; }'''
          new_dark = ''':global(.dark html[lang="zh-CN"] .portal-v5-page .VPNavBarTitle .title span::before),
:global(html[lang="zh-CN"].dark .portal-v5-page .VPNavBarTitle .title span::before) { background: linear-gradient(105deg, #ffffff 0%, #c8d3eb 48%, #9b8cff 78%, #62deed 100%); background-clip: text; -webkit-background-clip: text; }
:global(.dark html[lang="zh-CN"] .portal-v5-page .VPNavBarTitle .title::after),
:global(html[lang="zh-CN"].dark .portal-v5-page .VPNavBarTitle .title::after) { color: #8d9ab5; -webkit-text-fill-color: #8d9ab5; }
:global(.dark html:not([lang="zh-CN"]) .portal-v5-page .VPNavBarTitle .title span),
:global(html.dark:not([lang="zh-CN"]) .portal-v5-page .VPNavBarTitle .title span) { background: linear-gradient(105deg, #fff 0%, #c8d3eb 55%, #9b8cff 100%); background-clip: text; -webkit-background-clip: text; }'''
          replace_once(old_dark, new_dark, 'Dark navbar wordmark')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build site
        run: npm run docs:build

      - name: Commit update and remove workflow
        shell: bash
        run: |
          rm .github/workflows/fix-home-capability-order.yml
          git config user.name 'joinwell52-AI Runtime'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/.vitepress/theme/components/ResearchCenterHome.vue .github/workflows/fix-home-capability-order.yml package-lock.json
          git commit -m 'fix(home): align header and redesign Chinese wordmark'
          git pull --rebase origin main
          git push origin HEAD:main

