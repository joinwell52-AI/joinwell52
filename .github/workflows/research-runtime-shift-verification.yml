name: Research Runtime Shift Verification V1.0

on:
  push:
    branches: [main]
    paths:
      - "research/runtime/verification-requests/*.json"
  workflow_dispatch:
    inputs:
      runtime_task:
        description: Completed Runtime task to verify
        required: true
        type: choice
        options:
          - discovery
          - queue
          - reading
          - analysis
          - production
          - publication
          - weekly
          - academic
          - program
      runtime_date:
        description: Runtime date (YYYY-MM-DD)
        required: true
        type: string
      completion_commit:
        description: Durable completion commit SHA
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: research-runtime-shift-verification-v1
  cancel-in-progress: false

jobs:
  verify:
    name: Record and persist durable Runtime verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authoritative repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch latest durable facts
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Resolve verification request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TASK: ${{ inputs.runtime_task }}
          INPUT_DATE: ${{ inputs.runtime_date }}
          INPUT_COMMIT: ${{ inputs.completion_commit }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            task="$INPUT_TASK"
            date="$INPUT_DATE"
            commit="$INPUT_COMMIT"
          else
            request_path="$(git diff --name-only "$BEFORE_SHA" "$EVENT_SHA" -- 'research/runtime/verification-requests/*.json' | tail -n 1)"
            if [[ -z "$request_path" ]]; then
              request_path="$(git show --pretty='' --name-only "$EVENT_SHA" -- 'research/runtime/verification-requests/*.json' | tail -n 1)"
            fi
            if [[ -z "$request_path" || ! -f "$request_path" ]]; then
              echo "No durable verification request found in triggering commit."
              exit 1
            fi
            readarray -t fields < <(REQUEST_PATH="$request_path" node <<'NODE'
          const fs = require('fs')
          const request = JSON.parse(fs.readFileSync(process.env.REQUEST_PATH, 'utf8'))
          if (request.schema !== 'runtime-shift-verification-request/v1') throw new Error(`Invalid verification request schema: ${request.schema}`)
          if (!/^[a-z][a-z0-9-]*$/.test(request.task || '')) throw new Error('Invalid request.task')
          if (!/^\d{4}-\d{2}-\d{2}$/.test(request.date || '')) throw new Error('Invalid request.date')
          if (!/^[0-9a-f]{40}$/.test(request.completionCommit || '')) throw new Error('Invalid request.completionCommit')
          console.log(request.task)
          console.log(request.date)
          console.log(request.completionCommit)
          NODE
            )
            task="${fields[0]}"
            date="${fields[1]}"
            commit="${fields[2]}"
          fi
          [[ "$date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "Invalid runtime date"; exit 1; }
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid completion commit"; exit 1; }
          git merge-base --is-ancestor "$commit" origin/main
          echo "runtime_task=$task" >> "$GITHUB_OUTPUT"
          echo "runtime_date=$date" >> "$GITHUB_OUTPUT"
          echo "completion_commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Record durable verification
        env:
          RUNTIME_TASK: ${{ steps.request.outputs.runtime_task }}
          RUNTIME_DATE: ${{ steps.request.outputs.runtime_date }}
          COMPLETION_COMMIT: ${{ steps.request.outputs.completion_commit }}
        run: node scripts/runtime-shift-verify.mjs --task "$RUNTIME_TASK" --date "$RUNTIME_DATE" --commit "$COMPLETION_COMMIT"

      - name: Render and validate synchronized ledger
        env:
          RUNTIME_DATE: ${{ steps.request.outputs.runtime_date }}
        run: |
          node scripts/runtime-markdown.mjs render --date "$RUNTIME_DATE"
          npm run runtime:validate
          node scripts/runtime-markdown.mjs validate --date "$RUNTIME_DATE"

      - name: Commit durable verification record
        id: commit
        shell: bash
        env:
          RUNTIME_TASK: ${{ steps.request.outputs.runtime_task }}
          RUNTIME_DATE: ${{ steps.request.outputs.runtime_date }}
        run: |
          git config user.name "joinwell52 Research Runtime"
          git config user.email "actions@users.noreply.github.com"
          git add research/runtime/records research/runtime/[0-9][0-9][0-9][0-9] research/runtime/verification-requests
          if git diff --cached --quiet; then
            echo "Verification record already durable."
            echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "runtime(${RUNTIME_TASK}): record verified completion for ${RUNTIME_DATE}"
          verification_sha="$(git rev-parse HEAD)"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "commit_sha=$verification_sha" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort || true
            if [[ "$attempt" -eq 3 ]]; then exit 1; fi
            sleep $((attempt * 5))
          done

      - name: Verify durable verification record
        env:
          VERIFICATION_SHA: ${{ steps.commit.outputs.commit_sha }}
          RUNTIME_TASK: ${{ steps.request.outputs.runtime_task }}
          RUNTIME_DATE: ${{ steps.request.outputs.runtime_date }}
          COMPLETION_COMMIT: ${{ steps.request.outputs.completion_commit }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$VERIFICATION_SHA" origin/main
          git reset --hard origin/main
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')
          const manifest = JSON.parse(fs.readFileSync('research/runtime/SCHEDULER.json','utf8'))
          const task = manifest.tasks.find(t => t.id === process.env.RUNTIME_TASK)
          if (!task) throw new Error('Unknown runtime task')
          const [y,m] = process.env.RUNTIME_DATE.split('-')
          const file = path.join(manifest.recordRoots[task.family], y, m, `${process.env.RUNTIME_DATE}-${task.family}-runtime.json`)
          const record = JSON.parse(fs.readFileSync(file,'utf8'))
          const starts = (record.timeline || []).filter(e => e.task === task.id && e.event === 'Execution Slot Opened' && e.status === 'Running' && String(e.time || '').startsWith(process.env.RUNTIME_DATE))
          if (starts.length !== 1) throw new Error(`Expected exactly one start event, got ${starts.length}`)
          const verified = (record.timeline || []).some(e => e.task === task.id && e.event === 'GitHub Commit Verified' && e.status === 'Completed' && String(e.time || '').startsWith(process.env.RUNTIME_DATE) && String(e.detail || '').includes(process.env.COMPLETION_COMMIT))
          if (!verified) throw new Error('Missing durable GitHub Commit Verified event')
          if (record.taskStatus?.[task.id] !== 'Completed' || record.results?.[task.id]?.status !== 'Completed') throw new Error('Runtime completion regressed')
          if (record.results?.[task.id]?.runtimeDate !== process.env.RUNTIME_DATE) throw new Error('Runtime result date mismatch')
          console.log(`Verified durable completion evidence for ${task.id} ${process.env.RUNTIME_DATE}.`)
          NODE
