name: Runtime Recovery Hotfix

on:
  push:
    paths:
      - '.github/workflows/runtime-recovery-hotfix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply dependency-aware recovery repair
        run: node scripts/runtime-recovery-hotfix.mjs
      - name: Validate Runtime V5
        run: node scripts/runtime-v5.mjs validate
      - name: Reopen today's overdue Reading slot
        shell: bash
        run: |
          status="$(node -e "const r=require('./research/runtime/records/daily/2026/08/2026-08-09-daily-runtime.json');process.stdout.write(r.taskStatus.reading)")"
          if [[ "$status" == "Waiting" ]]; then
            node scripts/runtime-v5.mjs schedule --task reading
          else
            echo "Reading is $status; no forced reopen required."
          fi
      - name: Regenerate and validate readable Runtime ledger
        shell: bash
        run: |
          node scripts/runtime-markdown.mjs render --date 2026-08-09
          node scripts/runtime-markdown.mjs validate --date 2026-08-09
          if grep -Fq '[object Object]' research/runtime/2026/08/2026-08-09-runtime.md; then
            echo 'Readable ledger still contains [object Object].'
            exit 1
          fi
      - name: Validate full runtime after recovery state
        run: node scripts/runtime-v5.mjs validate
      - name: Commit repair and recovered control-plane state
        shell: bash
        run: |
          git config user.name "joinwell52 Runtime Recovery"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/runtime-recovery-hotfix.yml scripts/runtime-recovery-hotfix.mjs
          git add .github/workflows/research-runtime-scheduler.yml scripts/runtime-v5.mjs scripts/runtime-markdown.mjs research/runtime/records/daily/2026/08/2026-08-09-daily-runtime.json research/runtime/2026/08/2026-08-09-runtime.md .github/workflows/runtime-recovery-hotfix.yml scripts/runtime-recovery-hotfix.mjs
          git commit -m "fix(runtime): recover dependency-aware scheduled execution"
          git pull --rebase origin main
          git push origin HEAD:main
