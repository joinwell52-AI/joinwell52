name: Runtime Analysis 2026-08-07 Result Once

on:
  push:
    branches:
      - runtime-analysis-20260807-result
    paths:
      - .github/workflows/runtime-analysis-20260807-result-once.yml

permissions:
  contents: write

jobs:
  persist-result:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout result branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Persist Analysis result and synchronized ledger
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs')
          const path = 'research/runtime/records/daily/2026/08/2026-08-07-daily-runtime.json'
          const record = JSON.parse(fs.readFileSync(path, 'utf8'))
          const starts = (record.timeline || []).filter((e) => e.task === 'analysis' && e.event === 'Execution Slot Opened' && e.status === 'Running' && String(e.time || '').startsWith('2026-08-07T'))
          const completes = (record.timeline || []).filter((e) => e.task === 'analysis' && e.event === 'Analysis Completed' && String(e.time || '').startsWith('2026-08-07T'))
          if (record.status !== 'Running') throw new Error(`expected overall Running before Analysis, got ${record.status}`)
          if (record.taskStatus?.analysis !== 'Running') throw new Error(`expected taskStatus.analysis Running, got ${record.taskStatus?.analysis}`)
          if (starts.length !== 1) throw new Error(`expected exactly one Analysis start event, found ${starts.length}`)
          if (completes.length !== 0) throw new Error(`Analysis completion event already exists: ${completes.length}`)
          if (record.results?.analysis) throw new Error('results.analysis already exists')
          if (record.results?.reading?.status !== 'Completed') throw new Error('Reading is not Completed')

          const objectPaths = [
            'research/analysis/Q-20260807-01-verification-gated-durable-state-admission.md',
            'research/analysis/Q-20260807-02-role-aware-heterogeneous-agent-resource-plane.md',
            'research/analysis/Q-20260807-03-stable-identity-provisioning-gate.md'
          ]
          for (const p of objectPaths) if (!fs.existsSync(p)) throw new Error(`missing Research Object ${p}`)

          record.results.analysis = {
            schema: 'runtime-shift-result/v2',
            task: 'analysis',
            status: 'Completed',
            input: 'The durably verified Scheduler-fallback Analysis start state in commit 52e063b91251aae0a0ec8412a02ed7787927172e, Research Runtime Scheduler V3.0, Skill 04 Research Analysis, and exactly three completed 2026-08-07 Reading Results: Q-20260807-01, Q-20260807-02 and Q-20260807-03.',
            input_zh: '提交 52e063b91251aae0a0ec8412a02ed7787927172e 中已完成持久化核验的 Analysis Scheduler 回退启动状态、Research Runtime Scheduler V3.0、Skill 04 Research Analysis，以及且仅有三份已完成的 2026-08-07 Reading Result：Q-20260807-01、Q-20260807-02 与 Q-20260807-03。',
            workResult: 'Executed Skill 04 only after the durable Analysis Running state was fetched and verified. Consumed only the three completed Reading Results and performed observation, cross-comparison, causal and architectural discussion, research judgment, uncertainty, counter-evidence, engineering impact, limitations and future questions. Produced three durable Research Objects and introduced no unread source material, publication copy, Production work or release action.',
            workResult_zh: '仅在持久化 Analysis Running 状态完成拉取与核验后执行 Skill 04。只消费三份已完成 Reading Result，并完成观察、交叉比较、因果与架构讨论、研究判断、不确定性、反证、工程影响、限制与未来问题。已生成三份持久化 Research Object；未引入未读材料，未撰写出版文案，未执行 Production 或发布。',
            output: 'Three Production-ready Research Objects: Verification-Gated Durable State Admission for Digital Employees; Role-Aware Heterogeneous Agent Resource Plane; and Stable-Identity Provisioning Gate for Deferred Agent Environments.',
            output_zh: '已生成三份可作为 Production 唯一合法输入的 Research Object：数字员工的 Verification-Gated Durable State Admission、Role-Aware Heterogeneous Agent Resource Plane，以及延迟 Agent 环境的 Stable-Identity Provisioning Gate。',
            next: 'Research Runtime Production at 15:00 may consume only these three Research Objects. It must preserve their evidence boundaries, uncertainty, negative operating points and counter-evidence, and must not write directly from Discovery signals or Reading Results.',
            next_zh: '15:00 Research Runtime Production 只能消费这三份 Research Object。必须保留其证据边界、不确定性、负向运行点与反证，不得直接从 Discovery 信号或 Reading Result 写作。',
            metrics: [
              { label: 'Reading Results consumed', label_zh: '已消费 Reading Result', value: '3' },
              { label: 'Research Objects produced', label_zh: '已生成 Research Object', value: '3' },
              { label: 'Columns completed', label_zh: '已完成栏目', value: '3 / 3' },
              { label: 'Explicit research judgments', label_zh: '明确研究判断', value: '12' },
              { label: 'Uncertainty statements', label_zh: '不确定性陈述', value: '9' },
              { label: 'Counter-evidence items', label_zh: '反证条目', value: '12' },
              { label: 'Unread external sources introduced', label_zh: '引入未读外部来源', value: '0' },
              { label: 'Publication drafts', label_zh: '出版草稿', value: '0' }
            ],
            evidence: [
              { label: 'Scheduler V3.0', label_zh: 'Scheduler V3.0', source: 'research/runtime/SCHEDULER.json' },
              { label: 'Verified Analysis fallback start commit', label_zh: '已核验的 Analysis 回退启动提交', commit: '52e063b91251aae0a0ec8412a02ed7787927172e', source: 'https://github.com/joinwell52-AI/joinwell52/commit/52e063b91251aae0a0ec8412a02ed7787927172e' },
              { label: 'Skill 04 Research Analysis', label_zh: 'Skill 04 Research Analysis', source: 'research/skills/04-research-analysis.md' },
              { label: 'Digital Employee Reading Result', label_zh: '数字员工 Reading Result', source: 'research/reading/Q-20260807-01-argus-verification-gated-runtime.md' },
              { label: 'Industry Architecture Reading Result', label_zh: '行业架构 Reading Result', source: 'research/reading/Q-20260807-02-agentic-workflow-server-architecture.md' },
              { label: 'Open-source Engineering Reading Result', label_zh: '开源工程 Reading Result', source: 'research/reading/Q-20260807-03-deferred-environment-provisioning.md' }
            ],
            artifacts: [
              { label: 'Digital Employee Research Object', label_zh: '数字员工 Research Object', path: objectPaths[0] },
              { label: 'Industry Architecture Research Object', label_zh: '行业架构 Research Object', path: objectPaths[1] },
              { label: 'Open-source Engineering Research Object', label_zh: '开源工程 Research Object', path: objectPaths[2] },
              { label: 'Daily Runtime Record', label_zh: '每日运行机器记录', path },
              { label: 'Human-readable Runtime ledger', label_zh: '人类可读运行账本', path: 'research/runtime/2026/08/2026-08-07-runtime.md' }
            ]
          }

          record.taskStatus.analysis = 'Completed'
          record.status = 'Waiting'
          record.timeline.push({
            time: '2026-08-07T13:10:00+08:00',
            task: 'analysis',
            event: 'Analysis Completed',
            status: 'Completed',
            detail: 'Skill 04 completed the three same-day Reading Results after verified Scheduler-fallback start commit 52e063b91251aae0a0ec8412a02ed7787927172e; three Research Objects were persisted with explicit uncertainty and counter-evidence, and no unread material or publication copy was introduced.'
          })
          record.githubCommit = 'pending'
          record.commitVerify = 'Waiting'
          record.updatedAt = '2026-08-07T13:10:00+08:00'
          fs.writeFileSync(path, JSON.stringify(record, null, 2) + '\n')
          NODE

          node scripts/runtime-markdown.mjs render --date 2026-08-07
          node scripts/runtime-markdown.mjs validate --date 2026-08-07

          node <<'NODE'
          const fs = require('fs')
          const r = JSON.parse(fs.readFileSync('research/runtime/records/daily/2026/08/2026-08-07-daily-runtime.json','utf8'))
          const starts = r.timeline.filter(e => e.task === 'analysis' && e.event === 'Execution Slot Opened' && e.status === 'Running' && e.time.startsWith('2026-08-07T'))
          const completes = r.timeline.filter(e => e.task === 'analysis' && e.event === 'Analysis Completed' && e.status === 'Completed' && e.time.startsWith('2026-08-07T'))
          if (starts.length !== 1) throw new Error(`Analysis starts=${starts.length}`)
          if (completes.length !== 1) throw new Error(`Analysis completes=${completes.length}`)
          if (r.taskStatus.analysis !== 'Completed') throw new Error('Analysis status not Completed')
          if (r.status !== 'Waiting') throw new Error(`overall status should be Waiting, got ${r.status}`)
          if (r.results.analysis?.schema !== 'runtime-shift-result/v2') throw new Error('invalid Analysis result schema')
          if ((r.results.analysis?.artifacts || []).filter(a => /Research Object/.test(a.label || '')).length !== 3) throw new Error('expected three Research Object artifacts')
          if (r.results.discovery?.status !== 'Completed' || r.results.queue?.status !== 'Completed' || r.results.reading?.status !== 'Completed') throw new Error('prior results not preserved')
          NODE

      - name: Commit durable Analysis result
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/runtime-analysis-20260807-result-once.yml
          git config user.name "joinwell52 Research Runtime"
          git config user.email "actions@users.noreply.github.com"
          git add research/runtime/records/daily/2026/08/2026-08-07-daily-runtime.json \
            research/runtime/2026/08/2026-08-07-runtime.md \
            .github/workflows/runtime-analysis-20260807-result-once.yml
          git diff --cached --check
          git commit -m "runtime(analysis): complete 2026-08-07 Research Analysis"
          git push origin HEAD:runtime-analysis-20260807-result
