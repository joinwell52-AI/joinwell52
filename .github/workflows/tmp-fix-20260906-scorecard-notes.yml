name: One-time 2026-09-06 scorecard note fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-fix-20260906-scorecard-notes.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Shorten only overlong editorial notes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')
          const root = 'research/editorial/reviews/2026/09'
          const notes = {
            '/engineering/2026-08-22-agent-task-file-state-machine': { zh: '把 TASK 的路径状态、事件、REPORT、验收和并发 claim 分层得很清楚，也诚实指出多 Runtime TOCTOU 边界；不足是 V1.9.7 部分证据来自私有候选实现，公共复现仍不完整。' },
            '/engineering/2026-08-27-review-status-evidence-association': { zh: '从 10 条 REPORT 的关联异常推进到 V2.0.4 动态诊断，并用同一 QA TASK 的 active→review 变化验证语义；不足是产品证据仍以作者方复现为主，缺第三方验证。' },
            '/engineering/2026-08-27-trusted-path-proves-provenance-not-approval': { zh: '把 skill 证据拆成调用发生、可信根来源、内容身份、语义安全和当前批准五层；不足是 canonical path 不是加密 provenance，也不能证明当时执行的确切 bytes。' },
            '/engineering/2026-08-28-response-loss-idempotency': { zh: '用 response-loss 对比把重试收敛为 submission ID、request digest 和三阶段 receipt，并以 8 路并发验证单一 task_id；不足是强保证仅覆盖稳定 submission ID 的任务创建。' },
            '/engineering/2026-08-29-timeouts-must-close-the-lifecycle-they-own': { zh: '把 timeout 从单 PID 扩展到 invocation-owned process group，并让取消共享有界 teardown；不足是 setsid 逃逸、Windows、容器、远程任务和外部副作用仍未覆盖。' },
            '/engineering/2026-08-30-a-durable-checkpoint-can-still-be-unrecoverable': { zh: '把 DeltaChannel 的省空间收益与 seed、ordered writes、reducer identity、write-before-checkpoint 四个恢复不变量并列；不足是性能数据主要来自厂商 workload，跨 backend 恢复成本未独立验证。' },
            '/engineering/2026-08-31-a-successful-rerun-does-not-prove-the-repair': { zh: '用 536 个失败样本区分 rerun 重采样与 controlled replay 的因果修复证据，并要求固定前缀和 intervention anchor；不足是逻辑重放仍不能恢复真实外部状态。' },
            '/engineering/2026-08-31-audit-failure-retry': { zh: '通过 P0–P3 精确切开 audit 故障位置，并在新进程恢复中观察 non-idempotent executor 从一个 effect 变成两个；不足是副作用仍是隔离本地 marker，未覆盖真实远端服务。' },
            '/engineering/2026-08-31-session-principal-continuity': { zh: '把对话、操作授权、执行 principal 与证据归因四种 continuity 分开，并用 11+8 个条件限定换 Session 语义；不足是 provider account 的可信身份链尚未做双账号实测。' },
            '/engineering/2026-09-01-decision-evidence-continuity': { zh: '在 fact check、diagnostic、EVAL 与 takeover 均已存在时，准确指出缺的是同一 interruption case 的引用链，并保持 observer 无 dispatch 权；不足是合同尚未完成持久化、并发和独立 QA。' },
            '/engineering/2026-09-01-interrupted-task-takeover': { zh: '抓住 TASK 连续不等于执行权连续，并用 RA-7/RA-8 证明 confirmed 与 unknown effect 当前进入同一恢复前状态；不足是尚未制造真实外部副作用或完成独立验收。' },
            '/engineering/2026-09-02-a-smaller-skill-is-not-the-same-skill': { zh: '把 SkillZip Pro 从 token 压缩问题提升为 public entry、route、resource 与 behavior 的能力身份问题；不足是结果仍属作者报告，授权和外部 effect 语义未被实验覆盖。' },
            '/engineering/2026-09-03-discovery-must-not-redefine-credential-authority': { zh: 'MCP Python SDK 与 Gemini CLI 分别覆盖 discovery 和 callback 的 issuer binding，形成 identity-before-indirection；不足是 normalization 仍不一致，缺跨语言 test vectors 与迁移验证。' },
            '/engineering/2026-09-03-empty-test-results-verified': { zh: '通过真实 Host admission service 让 empty、partial、duplicate、unknown-ID 四类不完整证据进入 VERIFIED，并保留 FAIL/BLOCKED 控制；不足是没有生产发生率，也未在研究中实施修复。' },
            '/engineering/2026-09-03-process-alive-owner-identity': { zh: '回查发现 writer lock 已验证 process generation，而 approval recovery 主要看 PID liveness，并用旧时间戳对照暴露语义差异；不足是未真正诱发 PID reuse 或执行外部恢复。' },
            '/engineering/2026-09-04-approval-operation-identity': { zh: '真实 gate 与跨进程 approval 实验显示：换 Git branch 仍复用批准，只换 Session 却失配；字段对比证明问题发生在 hash 前的信息折叠与 nested Session 回流。不足是 remote/force/delete 主要验证到 digest 层。', en: 'Real gate and cross-process approval tests show a Git branch change reuses approval while a session-only change misses it. Field diffs locate the cause before hashing and in nested session data; remote/force/delete variants were mainly checked at digest equality.' },
            '/engineering/2026-09-04-recovery-evidence-is-not-replay-authority': { zh: 'Codex OAuth 与 Google ADK confirmation 两个中断点共同说明 recovery evidence、current authority、effect evidence 必须分开；不足是三维模型仍是综合判断，未形成跨系统协议或 exactly-once 证明。' },
            '/engineering/2026-09-05-acceptance-order-replay': { zh: '七组 allow/revoke 场景把 acceptance order 与 persistence order 分离，并用双向翻转、同值、未接受输入和异常序列限定结论；不足是 inversion 为人为注入，未证明 CodeFlowMu Host 真实存在该缺陷。' },
            '/engineering/2026-09-05-get-request-effect-boundary': { zh: '真实 Native gate + loopback curl 显示 effect knowledge 不完整时 GET 仍可 ALLOW，环境随后发生 business write；不足是尚未覆盖完整 Codex/Cursor/Gemini Host、代理与真实服务。' },
            '/engineering/2026-09-05-passing-tests-is-not-operational-capability': { zh: '借 agentic Julia/HPC 研究把功能正确、开发过程、failure envelope、scaling、reproducibility 分成五层；不足是每个条件仅生成一次，生成环境与目标超算环境也不完全一致。' },
            '/engineering/2026-09-06-stable-identity-does-not-authorize-destination': { zh: 'Agents SDK 与 Codex restore 样本把 principal identity、state continuity、destination compatibility、current authority 分成四门；不足是两项证据来自同一组织，跨厂商 portable identity 仍未建立。' }
          }
          let touched = 0
          for (const name of fs.readdirSync(root)) {
            if (!name.startsWith('2026-09-06-') || !name.endsWith('.json')) continue
            const file = path.join(root, name)
            let data
            try { data = JSON.parse(fs.readFileSync(file, 'utf8')) } catch { continue }
            let changed = false
            for (const item of data.items || []) {
              const patch = notes[item.path]
              if (!patch) continue
              item.editorialNote ||= {}
              if (patch.zh) item.editorialNote.zh = patch.zh
              if (patch.en) item.editorialNote.en = patch.en
              changed = true
            }
            if (changed) {
              fs.writeFileSync(file, JSON.stringify(data, null, 2) + '\n')
              touched++
            }
          }
          if (!touched) throw new Error('No review shards were updated.')
          console.log(`Updated ${touched} review shard files.`)
          NODE
      - name: Remove one-time workflow and commit fixes
        shell: bash
        run: |
          rm .github/workflows/tmp-fix-20260906-scorecard-notes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/editorial/reviews/2026/09 .github/workflows/tmp-fix-20260906-scorecard-notes.yml
          git commit -m "fix(editorial): shorten 2026-09-06 scorecard notes"
          git push origin HEAD:main
