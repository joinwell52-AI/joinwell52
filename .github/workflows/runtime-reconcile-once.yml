name: Runtime Ordered Reconcile Once

on:
  push:
    branches: [main]
    paths:
      - "research/runtime/RECONCILE-NOW"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconcile ordered state
        id: reconcile
        run: node scripts/runtime-reconcile.mjs

      - name: Render and validate
        if: steps.reconcile.outputs.state_changed == 'true'
        env:
          RUNTIME_DATE: ${{ steps.reconcile.outputs.runtime_date }}
        run: |
          node scripts/runtime-markdown.mjs render --date "$RUNTIME_DATE"
          npm run runtime:validate
          node scripts/runtime-markdown.mjs validate --date "$RUNTIME_DATE"

      - name: Commit corrected state
        if: steps.reconcile.outputs.state_changed == 'true'
        env:
          RUNTIME_DATE: ${{ steps.reconcile.outputs.runtime_date }}
        run: |
          git config user.name "joinwell52 Research Runtime"
          git config user.email "actions@users.noreply.github.com"
          git add research/runtime/records research/runtime/[0-9][0-9][0-9][0-9]
          git commit -m "runtime(v5): correct ordered state for ${RUNTIME_DATE}"
          git pull --rebase origin main
          git push origin HEAD:main
