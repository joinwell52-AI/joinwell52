name: Runtime Discovery Fallback 20260809 Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/runtime-discovery-fallback-20260809-once.yml

permissions:
  contents: write

jobs:
  persist-start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Persist exactly one Discovery Running state
        shell: bash
        run: |
          set -euo pipefail
          json='research/runtime/records/daily/2026/08/2026-08-09-daily-runtime.json'
          md='research/runtime/2026/08/2026-08-09-runtime.md'
          if [ -e "$json" ]; then
            echo "Daily Runtime Record already exists; refusing to create a duplicate fallback start state." >&2
            exit 1
          fi
          mkdir -p "$(dirname "$json")"
          cat > "$json" <<'JSON'
          {
            "schema": "daily-runtime-record/v1",
            "runtimeVersion": "5.0",
            "schedulerVersion": "3.0",
            "runtimeFamily": "daily",
            "runtimeFamilyName": "Daily Runtime",
            "runtimeFamilyName_zh": "每日运行",
            "date": "2026-08-09",
            "timezone": "Asia/Shanghai",
            "repository": "joinwell52-AI/joinwell52",
            "status": "Running",
            "taskStatus": {
              "discovery": "Running",
              "queue": "Waiting",
              "reading": "Waiting",
              "analysis": "Waiting",
              "production": "Waiting",
              "publication": "Waiting"
            },
            "results": {},
            "timeline": [
              {
                "time": "2026-08-09T09:03:17+08:00",
                "task": "discovery",
                "event": "Execution Slot Opened",
                "status": "Running",
                "detail": "Scheduler fallback: Research Runtime Discovery opened because the durable control-plane start state was absent; substantive work may begin only after this synchronized JSON and Markdown state is committed and verified."
              }
            ],
            "githubCommit": "pending",
            "commitVerify": "Waiting",
            "updatedAt": "2026-08-09T09:03:17+08:00",
            "metrics": [],
            "evidence": [],
            "artifacts": []
          }
          JSON
          node scripts/runtime-markdown.mjs render --date 2026-08-09
          node scripts/runtime-markdown.mjs validate --date 2026-08-09
          node - <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('research/runtime/records/daily/2026/08/2026-08-09-daily-runtime.json','utf8'));
          const starts = (r.timeline || []).filter(e => e.task === 'discovery' && e.event === 'Execution Slot Opened' && e.status === 'Running');
          if (r.status !== 'Running' || r.taskStatus.discovery !== 'Running' || starts.length !== 1) process.exit(1);
          NODE
          rm -f .github/workflows/runtime-discovery-fallback-20260809-once.yml
          git config user.name 'joinwell52 Research Runtime'
          git config user.email 'actions@users.noreply.github.com'
          git add "$json" "$md" .github/workflows/runtime-discovery-fallback-20260809-once.yml
          git commit -m 'runtime(discovery): persist 2026-08-09 fallback Running state'
          git push origin HEAD:main
