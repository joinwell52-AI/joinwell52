name: WP13 attachment notify

on:
  push:
    paths:
      - '.github/workflows/wp13-attachment-notify.yml'

permissions:
  issues: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post transfer request to issue and subscribed PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/issues/64/comments \
            -f body='@joinwell52-AI Please reply to this GitHub notification with the four original PNG attachments.'
          gh api repos/${{ github.repository }}/issues/51/comments \
            -f body='@joinwell52-AI Temporary binary transfer request: please reply to this notification with the four original WP-13 PNG attachments.'
