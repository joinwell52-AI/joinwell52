name: SaaW Exact Manifesto Pass

on:
  push:
    branches:
      - saaw-exact-manifesto-pass

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: saaw-exact-manifesto-pass
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply exact bilingual manifesto passages
        run: python scripts/saaw_exact_manifesto_patch.py
      - name: Verify exact passages
        run: python -c "from pathlib import Path; z=Path('docs/zh/industry/2026-08-10-saaw-software-as-an-agent-worker.md').read_text(encoding='utf-8'); assert all(x in z for x in ['传统的 SaaS 和多智能体系统，本质上是一场精巧的幻觉','TMPA 的底层铁律是：文本即事实','企业级协同的毒瘤，在于‘谁都可以改状态’的混沌','企图在异步的多智能体世界里强行捏造一条全局统一的时间线，是架构上的自大'])"
      - name: Build VitePress
        run: npm ci && npm run docs:build
      - name: Commit article-only changes
        shell: bash
        run: |
          git config user.name 'joinwell52'
          git config user.email 'joinwell52@gmail.com'
          git add docs/zh/industry/2026-08-10-saaw-software-as-an-agent-worker.md docs/en/industry/2026-08-10-saaw-software-as-an-agent-worker.md
          git commit -m 'use exact manifesto wording in SaaW sections 3-7'
          git rm .github/workflows/saaw-exact-manifesto-pass.yml scripts/saaw_exact_manifesto_patch.py
          git commit -m 'remove temporary SaaW manifesto patch files'
          git push origin HEAD:saaw-exact-manifesto-pass
