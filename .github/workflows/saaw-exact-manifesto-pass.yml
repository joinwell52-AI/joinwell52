name: SaaW Exact Manifesto Pass

on:
  push:
    branches:
      - saaw-exact-manifesto-pass

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: saaw-exact-manifesto-pass
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply exact bilingual manifesto passages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          zh_path = Path('docs/zh/industry/2026-08-10-saaw-software-as-an-agent-worker.md')
          en_path = Path('docs/en/industry/2026-08-10-saaw-software-as-an-agent-worker.md')
          zh = zh_path.read_text(encoding='utf-8')
          en = en_path.read_text(encoding='utf-8')

          zh_intro_anchor = "Agent 能够执行工具，并不意味着 Agent 可以进入企业生产环境。\n"
          zh_intro_quote = "\n> **“传统的 SaaS 和多智能体系统，本质上是一场精巧的幻觉：它们把业务事实死死铐在数据库的中央状态机和文件系统的拓扑结构上。一旦进程崩溃或目录微调，记忆与权限当场殉葬。** **真正的 SaaW 绝不依赖中央服务器的施舍。状态不因物理拓扑的变动而编码，事实永远独立于运行实例之外。”**\n"
          if zh_intro_quote.strip() not in zh:
              if zh_intro_anchor not in zh:
                  raise SystemExit('ZH intro anchor missing')
              zh = zh.replace(zh_intro_anchor, zh_intro_anchor + zh_intro_quote, 1)

          zh_old4 = """TMPA 的 **SME-first** 不是“只能服务于中小企业”，而是一条更强的架构约束：**治理语义不应被内生锁死在某个模型会话、某个进程、某个中央状态机，或某一种物理存储拓扑中。**

传统 Agent 系统的常见弱点，并不是它们没有状态，而是把可信状态与运行实例绑得过紧：状态可能困在模型上下文、进程内存、中央数据库内部状态、消息代理或持续膨胀的会话里。实例一旦退出，系统就必须额外依赖某个中心组件去解释“现在到底发生到哪里”。

TMPA 拒绝把治理真相交给这种偶然的运行连续性。它要求：**工作事实能够脱离具体运行实例而持续存在，并能够被重新聚合和重建。**

这里必须区分“治理语义”和“物理投影”。TMPA 本身不要求状态由目录位置或某一种存储拓扑来定义；在 FCoP 这样的文件系统 Profile 中，目录可以投影生命周期状态，但那是 Profile 的具体表达，不是 TMPA 对所有实现的物理绑定。

> **文本承载事实；拓扑承载投影。事实不应因运行实例或物理布局的变化而失去可重建性。**"""
          zh_new4 = "> **“当多个异构智能体与人类在同一个代码库里长期博弈时，最荒谬的事莫过于把可信状态托付给模型的挥发性记忆。** **TMPA 的底层铁律是：文本即事实。文件与目录的物理拓扑只负责合规投影，不可变的文本对象才是跨越周期的唯一硬通货。”**"
          if zh_old4 not in zh:
              raise SystemExit('ZH section 4 block missing')
          zh = zh.replace(zh_old4, zh_new4, 1)

          zh_old5 = """每一个动作都拥有自己的作者和引用关系。谁写下 `Acceptance`，谁追加 `Report`，谁发布 `Correction`，都会沿着作者、引用与局部顺序进入同一条可追溯的事实链。

**责任不是从一个最终状态字段里“算”出来的，而是从单写者追加流中“长”出来的。**

Single-Writer 的关键不是宣称文本天然不可篡改，而是禁止一个主体静默重写另一个主体已经发布的事实。需要纠正时，应通过新的 `Correction`、`supersedes` 或其他受治理对象追加新事实；如果需要密码学层面的防篡改，还必须叠加完整性、签名与可信身份机制。"""
          zh_new5 = "> **“企业级协同的毒瘤，在于‘谁都可以改状态’的混沌。** **在 TMPA 的单写者串行流中：每一个主体——无论人还是 Agent——都是绝对隔离的单写者。你只能追加自己的事实，休想污染他人的历史。** **责任不是靠数据库的事务锁‘算’出来的，而是由单写者不可篡改的引用链‘长’出来的。”**"
          if zh_old5 not in zh:
              raise SystemExit('ZH section 5 block missing')
          zh = zh.replace(zh_old5, zh_new5, 1)

          zh_old6 = """不同的单写者串行流可以独立推进。每个写者只负责维护自己的局部顺序，不需要抢占一个全局可变状态来证明“谁先谁后”。

> **异步世界不需要伪造全局总序：写端保持局部串行，读端重建偏序关系。**

真正的关系由 Reader 在聚合时根据引用、因果、状态迁移、责任与治理规则动态重构。最后得到的不是被中央调度器强行排平的日志列表，而是一张**偏序图（Partial-Order Graph）**。

这也是它能够落到本地代码库和文件协调实践里的原因：不同 Agent、不同宿主甚至不同 SDK 可以异步地产生各自的工作事实；系统不要求它们共享同一块可变内存，而是在 Reader 端把已经出现的证据重新拼成可解释的工作关系。"""
          zh_new6 = "> **“企图在异步的多智能体世界里强行捏造一条全局统一的时间线，是架构上的自大。** **写端只管无锁追加，偏序图在读端动态重建。没有中央调度器的瞎指挥，多智能体在本地文本流中天然错落、野蛮生长，这才是高并发数字劳动的残酷真相。”**"
          if zh_old6 not in zh:
              raise SystemExit('ZH section 6 block missing')
          zh = zh.replace(zh_old6, zh_new6, 1)

          en_intro_anchor = "An Agent that can call tools is not automatically ready for production.\n"
          en_intro_quote = "\n> **“Traditional SaaS and multi-agent systems are, at their core, an exquisitely engineered illusion: they shackle business facts to central database state machines and filesystem topology. The moment a process crashes or a directory layout shifts, memory and permissions die with it.** **A real SaaW never lives on the charity of a central server. State is not encoded by changes in physical topology; facts remain forever independent of runtime instances.”**\n"
          if en_intro_quote.strip() not in en:
              if en_intro_anchor not in en:
                  raise SystemExit('EN intro anchor missing')
              en = en.replace(en_intro_anchor, en_intro_anchor + en_intro_quote, 1)

          en_old4 = """TMPA being **SME-first** is not a statement that it is limited to SMEs. It is a stronger architectural constraint: **governance semantics should not be intrinsically locked to one model session, one process, one central state machine, or one physical storage topology.**

A common weakness in traditional Agent systems is not the absence of state, but excessive coupling between trustworthy state and runtime instances. State may be trapped inside model context, process memory, database internals, brokers, or ever-growing conversations. When an instance disappears, an external center is then required to explain what the work currently means.

TMPA rejects dependence on that accidental runtime continuity. Work facts must persist independently of a particular runtime instance and remain reconstructable from the available evidence.

This requires a distinction between **governance semantics** and **physical projection**. TMPA does not require lifecycle meaning to be universally encoded by directory location or any single storage topology. A filesystem profile such as FCoP may project lifecycle state into directories, but that is a profile-level representation rather than a universal physical binding in TMPA.

> **Text carries facts; topology carries projection. Facts must remain reconstructable across changes in runtime instance or physical layout.**"""
          en_new4 = "> **“When heterogeneous Agents and humans wrestle with long-running work inside the same codebase, the most absurd choice is to entrust trustworthy state to the volatile memory of a model.** **TMPA has an iron law: text is fact. The physical topology of files and directories exists only to provide a compliant projection; immutable text objects are the only hard currency that survives across cycles.”**"
          if en_old4 not in en:
              raise SystemExit('EN section 4 block missing')
          en = en.replace(en_old4, en_new4, 1)

          en_old5 = """Every action has its own author and reference relationships. Whoever writes an `Acceptance`, appends a `Report`, or publishes a `Correction` enters an attributable chain through authorship, references, and local order.

**Responsibility is not calculated from one final state field; it grows out of the Single-Writer append stream.**

Single-Writer does not mean that plain text is magically tamper-proof. It means one actor must not silently rewrite facts already published by another actor. Corrections appear as new governed objects such as `Correction`, `supersedes`, or equivalent profile mechanisms; cryptographic tamper resistance still requires integrity, signatures, and trusted identity mechanisms."""
          en_new5 = "> **“The cancer of enterprise collaboration is the chaos of ‘anyone can change state.’** **In TMPA Single-Writer Serial Streams, every actor—human or Agent—is an absolutely isolated Single Writer. You may append only your own facts; you do not get to contaminate someone else’s history.** **Responsibility is not ‘calculated’ by database transaction locks; it ‘grows’ out of the tamper-proof reference chain of Single-Writer streams.”**"
          if en_old5 not in en:
              raise SystemExit('EN section 5 block missing')
          en = en.replace(en_old5, en_new5, 1)

          en_old6 = """Single-Writer Streams can advance independently. Each writer maintains only its own local order instead of competing to mutate one global state merely to establish “who came first.”

> **An asynchronous world does not need a fabricated total order: writers preserve local serial order; readers reconstruct the partial order.**

The Reader dynamically reconstructs relationships from Reference, Causality, Transition, Responsibility, and Governance Rules. The result is not a central scheduler flattening everything into one log, but a **Partial-Order Graph**.

This is also why the architecture can live directly in local repositories and file-based coordination practice: different Agents, hosts, or SDK integrations can emit work facts asynchronously without sharing one mutable memory region, while the Reader reconstructs an interpretable work relationship from the evidence that exists."""
          en_new6 = "> **“Trying to fabricate a single global timeline in an asynchronous multi-agent world is architectural arrogance.** **Writers do nothing but lock-free appends; the Partial-Order Graph is rebuilt dynamically on the read side. Without the blind commands of a central scheduler, multi-agent work grows wild and staggered through local text streams. That is the brutal truth of high-concurrency digital labor.”**"
          if en_old6 not in en:
              raise SystemExit('EN section 6 block missing')
          en = en.replace(en_old6, en_new6, 1)

          zh_path.write_text(zh, encoding='utf-8')
          en_path.write_text(en, encoding='utf-8')
          PY
      - name: Verify exact Chinese passages
        shell: bash
        run: |
          grep -F '传统的 SaaS 和多智能体系统，本质上是一场精巧的幻觉' docs/zh/industry/2026-08-10-saaw-software-as-an-agent-worker.md
          grep -F 'TMPA 的底层铁律是：文本即事实' docs/zh/industry/2026-08-10-saaw-software-as-an-agent-worker.md
          grep -F '企业级协同的毒瘤，在于‘谁都可以改状态’的混沌' docs/zh/industry/2026-08-10-saaw-software-as-an-agent-worker.md
          grep -F '企图在异步的多智能体世界里强行捏造一条全局统一的时间线，是架构上的自大' docs/zh/industry/2026-08-10-saaw-software-as-an-agent-worker.md
      - name: Build VitePress
        run: npm ci && npm run docs:build
      - name: Commit article-only changes
        shell: bash
        run: |
          git config user.name 'joinwell52'
          git config user.email 'joinwell52@gmail.com'
          git add docs/zh/industry/2026-08-10-saaw-software-as-an-agent-worker.md docs/en/industry/2026-08-10-saaw-software-as-an-agent-worker.md
          git commit -m 'use exact manifesto wording in SaaW sections 3-7'
          git rm .github/workflows/saaw-exact-manifesto-pass.yml
          git commit -m 'remove temporary SaaW manifesto workflow'
          git push origin HEAD:saaw-exact-manifesto-pass
