name: Apply Runtime Composite Day Schedule

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-runtime-composite-day-schedule.yml

permissions:
  contents: write

jobs:
  patch-runtime-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Merge daily and weekday-specific Runtime tasks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/.vitepress/theme/components/RuntimeOperationsCenterClassic.vue')
          source = path.read_text(encoding='utf-8')

          def replace_once(before: str, after: str, label: str) -> None:
              global source
              count = source.count(before)
              if count != 1:
                  raise RuntimeError(f'{label}: expected exactly one match, found {count}')
              source = source.replace(before, after, 1)

          replace_once(
              '  todayDaily: RecordItem\n'
              '  records: { daily: RecordItem[] }\n'
              '  columns: Array<{ id: string; name: string; name_zh: string }>\n',
              '  todayDaily: RecordItem\n'
              '  latest: Record<string, RecordItem | null>\n'
              '  records: Record<string, RecordItem[]>\n'
              '  columns: Array<{ id: string; name: string; name_zh: string }>\n',
              'RuntimeData records contract'
          )

          replace_once(
              'const liveRecord = ref<RecordItem | null>(null)\n'
              'const staticRecord = computed(() => (runtime.records?.daily || []).find((item) => item.date === selectedDate.value)\n'
              '  || (runtime.todayDaily.date === selectedDate.value ? runtime.todayDaily : runtime.todayDaily))\n'
              'const record = computed(() => isToday.value && liveRecord.value ? liveRecord.value : staticRecord.value)\n',
              'const liveRecords = ref<Record<string, RecordItem>>({})\n'
              'const staticRecordForFamily = (family: string) => (runtime.records?.[family] || [])\n'
              '  .find((item) => item.date === selectedDate.value) || null\n'
              'const recordForFamily = (family: string) => isToday.value && liveRecords.value[family]\n'
              '  ? liveRecords.value[family]\n'
              '  : staticRecordForFamily(family)\n'
              "const record = computed(() => recordForFamily('daily') || runtime.todayDaily)\n",
              'family record lookup'
          )

          replace_once(
              'const refreshLiveRecord = async () => {\n'
              "  if (typeof window === 'undefined' || !isToday.value) return\n"
              "  const [year, month] = selectedDate.value.split('-')\n"
              '  const path = `research/runtime/records/daily/${year}/${month}/${selectedDate.value}-daily-runtime.json`\n'
              '  const url = `https://raw.githubusercontent.com/joinwell52-AI/joinwell52/main/${path}?t=${Date.now()}`\n'
              '  try {\n'
              "    const response = await fetch(url, { cache: 'no-store' })\n"
              '    if (!response.ok) return\n'
              '    const next = await response.json() as RecordItem\n'
              '    if (next.date === selectedDate.value) liveRecord.value = next\n'
              '  } catch {\n'
              '    // Preserve the build-time projection while GitHub is temporarily unavailable.\n'
              '  }\n'
              '}\n',
              'const refreshLiveRecord = async () => {\n'
              "  if (typeof window === 'undefined' || !isToday.value) return\n"
              "  const [year, month] = selectedDate.value.split('-')\n"
              "  const families = ['daily', 'weekly', 'academic', 'program']\n"
              '  const refreshed = await Promise.all(families.map(async (family) => {\n'
              '    const recordPath = `research/runtime/records/${family}/${year}/${month}/${selectedDate.value}-${family}-runtime.json`\n'
              '    const url = `https://raw.githubusercontent.com/joinwell52-AI/joinwell52/main/${recordPath}?t=${Date.now()}`\n'
              '    try {\n'
              "      const response = await fetch(url, { cache: 'no-store' })\n"
              '      if (!response.ok) return null\n'
              '      const next = await response.json() as RecordItem\n'
              '      return next.date === selectedDate.value ? [family, next] as const : null\n'
              '    } catch {\n'
              '      return null\n'
              '    }\n'
              '  }))\n'
              '  const available = refreshed.filter((item): item is readonly [string, RecordItem] => Boolean(item))\n'
              '  if (available.length) liveRecords.value = { ...liveRecords.value, ...Object.fromEntries(available) }\n'
              '}\n',
              'multi-family live refresh'
          )

          replace_once(
              "  const isWorking = Object.values(record.value.taskStatus || {}).includes('Running')\n",
              "  const isWorking = Object.values(liveRecords.value).some((item) => Object.values(item.taskStatus || {}).includes('Running'))\n"
              "    || Object.values(record.value.taskStatus || {}).includes('Running')\n",
              'multi-family running refresh'
          )

          replace_once(
              'const tasks = computed(() => runtime.schedule\n'
              "  .filter((task) => task.family === 'daily')\n"
              '  .sort((a, b) => a.schedule.time.localeCompare(b.schedule.time)))\n',
              "const weekdayForDate = (date: string) => ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][\n"
              '  new Date(`${date}T12:00:00Z`).getUTCDay()\n'
              ']\n'
              "const taskRunsOnDate = (task: Task, date: string) => task.schedule.kind === 'daily'\n"
              "  || (task.schedule.kind === 'weekly' && (task.schedule.days || []).includes(weekdayForDate(date)))\n"
              'const tasks = computed(() => runtime.schedule\n'
              '  .filter((task) => taskRunsOnDate(task, selectedDate.value))\n'
              '  .sort((a, b) => a.schedule.time.localeCompare(b.schedule.time)))\n',
              'composite task schedule'
          )

          replace_once(
              'const rows = computed(() => tasks.value.map((task) => ({\n'
              '  task,\n'
              "  status: record.value.taskStatus?.[task.id] || 'Waiting',\n"
              '  result: record.value.results?.[task.id] || null\n'
              '})))\n',
              'const rows = computed(() => tasks.value.map((task) => {\n'
              '  const familyRecord = recordForFamily(task.family)\n'
              '  return {\n'
              '    task,\n'
              "    status: familyRecord?.taskStatus?.[task.id] || 'Waiting',\n"
              '    result: familyRecord?.results?.[task.id] || null\n'
              '  }\n'
              '}))\n',
              'family-aware task rows'
          )

          path.write_text(source, encoding='utf-8')
          PY

      - name: Remove obsolete one-time Production workflow
        run: rm -f .github/workflows/runtime-production-start-once.yml

      - name: Install dependencies
        run: npm ci

      - name: Validate Runtime and build site
        run: |
          npm run runtime:validate
          npm run docs:build
          git diff --check
          grep -q "taskRunsOnDate" docs/.vitepress/theme/components/RuntimeOperationsCenterClassic.vue
          grep -q "recordForFamily(task.family)" docs/.vitepress/theme/components/RuntimeOperationsCenterClassic.vue

      - name: Commit repair and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-runtime-composite-day-schedule.yml
          git config user.name "joinwell52 Runtime Repair"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(runtime): include weekday-specific tasks in daily timeline"
          git pull --rebase origin main
          git push origin HEAD:main
