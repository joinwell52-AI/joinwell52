name: Publish WP-13 Case Assets Once

on:
  push:
    branches:
      - publish/wp13-codeflowmu-fact-check-case
    paths:
      - .github/workflows/publish-wp13-case-assets-once.yml

permissions:
  contents: write

jobs:
  publish-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract the real CodeFlowMu scene and attach the evidence package
        shell: bash
        run: |
          set -euo pipefail
          source_zip="docs/public/evidence/tmpa/i0.5/wp13-multi-agent-fact-check-publication-evidence-v3.zip"
          source_sha="docs/public/evidence/tmpa/i0.5/wp13-multi-agent-fact-check-publication-evidence-v3.zip.sha256"
          test -f "$source_zip"
          test -f "$source_sha"

          mkdir -p docs/public/assets/covers
          unzip -p "$source_zip" pm-fact-check.png > docs/public/assets/covers/wp13-codeflowmu-fact-check-live.png
          test -s docs/public/assets/covers/wp13-codeflowmu-fact-check-live.png

          mkdir -p docs/public/evidence/wp13-multi-agent-fact-checking
          cp "$source_zip" docs/public/evidence/wp13-multi-agent-fact-checking/wp13-multi-agent-fact-check-publication-evidence-v3.zip
          cp "$source_sha" docs/public/evidence/wp13-multi-agent-fact-checking/wp13-multi-agent-fact-check-publication-evidence-v3.zip.sha256
          echo "5b5eda3034c822f13421783244b1d0c76a9fa79950bfad0ce61bb8d2e404131c  docs/public/evidence/wp13-multi-agent-fact-checking/wp13-multi-agent-fact-check-publication-evidence-v3.zip" | sha256sum -c -

      - name: Commit the durable publication assets
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/publish-wp13-case-assets-once.yml
          git config user.name "joinwell52 Publication"
          git config user.email "actions@users.noreply.github.com"
          git add docs/public/assets/covers/wp13-codeflowmu-fact-check-live.png \
            docs/public/evidence/wp13-multi-agent-fact-checking \
            .github/workflows/publish-wp13-case-assets-once.yml
          git commit -m "docs(assets): attach WP-13 live evidence and package"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
