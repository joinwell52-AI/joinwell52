name: Fix Discovery Evidence Source 2026-08-06 Once

on:
  push:
    branches:
      - runtime/discovery-20260806-final
    paths:
      - .github/workflows/fix-discovery-evidence-source-20260806-once.yml

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add required evidence source fields
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'research/runtime/records/daily/2026/08/2026-08-06-daily-runtime.json';
          const record = JSON.parse(fs.readFileSync(path, 'utf8'));
          const normalize = (item) => ({
            ...item,
            source: item.source || item.url || (item.commit
              ? `https://github.com/joinwell52-AI/joinwell52/commit/${item.commit}`
              : item.path)
          });
          record.results.discovery.evidence = record.results.discovery.evidence.map(normalize);
          record.evidence = record.evidence.map(normalize);
          fs.writeFileSync(path, JSON.stringify(record, null, 2) + '\n');
          NODE
          node scripts/runtime-markdown.mjs render --date 2026-08-06
          node scripts/runtime-markdown.mjs validate --date 2026-08-06
          npm install
          npm run runtime:validate
          git diff --check

      - name: Commit synchronized fix and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-discovery-evidence-source-20260806-once.yml
          git config user.name "joinwell52 Research Runtime"
          git config user.email "actions@users.noreply.github.com"
          git add research/runtime/records/daily/2026/08/2026-08-06-daily-runtime.json \
            research/runtime/2026/08/2026-08-06-runtime.md \
            .github/workflows/fix-discovery-evidence-source-20260806-once.yml
          git commit -m "runtime(discovery): normalize evidence source fields"
          git push origin "HEAD:$GITHUB_REF_NAME"
