name: Backfill V4 Publication 2026-08-04

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backfill-v4-publication-2026-08-04
  cancel-in-progress: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Complete missed Publication shift
        run: |
          node <<'NODE'
          const fs = require('fs')

          const runtimePath = 'research/runtime/2026/08/2026-08-04-runtime.md'
          const candidatePath = 'research/runtime/candidates/2026/08/2026-08-04-candidates.json'
          const legacyPath = 'scripts/runtime-legacy-compat.mjs'
          const verifyPath = 'scripts/verify-runtime-projection.mjs'
          const workflowPath = '.github/workflows/backfill-v4-publication-2026-08-04.yml'
          const triggerPath = 'docs/public/backfill-v4-publication-2026-08-04.trigger'

          const candidate = JSON.parse(fs.readFileSync(candidatePath, 'utf8'))
          if (candidate.date !== '2026-08-04') throw new Error(`Unexpected candidate date: ${candidate.date}`)
          if (candidate.status !== 'Completed') throw new Error(`Candidate batch is ${candidate.status}, expected Completed`)
          if (!Array.isArray(candidate.candidates) || candidate.candidates.length !== 0) {
            throw new Error(`Expected zero Publication Candidates, received ${candidate.candidates?.length}`)
          }

          let runtime = fs.readFileSync(runtimePath, 'utf8')
          const replaceRequired = (source, from, to, label) => {
            if (!source.includes(from)) throw new Error(`Missing expected ${label}`)
            return source.replace(from, to)
          }

          if (!runtime.includes('"task": "publication"')) {
            runtime = replaceRequired(runtime, 'overall_status: "Waiting"', 'overall_status: "Completed"', 'overall status')
            runtime = replaceRequired(runtime, 'latest_task: "Research Runtime Production"', 'latest_task: "Research Runtime Publication"', 'latest task')
            runtime = replaceRequired(runtime, 'end_time: ""', 'end_time: "20:54"', 'end time')
            runtime = replaceRequired(runtime, 'duration: ""', 'duration: "11:54:00"', 'duration')
            runtime = replaceRequired(runtime, 'publication_status: "Waiting"', 'publication_status: "Completed"', 'publication status')
            runtime = replaceRequired(
              runtime,
              'lifecycle: "Q-W003-01 remains Analysis; Production eligibility review completed with 0 eligible objects; Publication remains Waiting"',
              'lifecycle: "Q-W003-01 remains Analysis; Production completed with 0 eligible objects; Publication completed with 0 eligible candidates and 0 releases"',
              'lifecycle summary'
            )
            runtime = replaceRequired(
              runtime,
              'output: "Research Runtime Production completed with 0 Publication Candidates; upstream lifecycle gates were preserved."',
              'output: "Research Runtime Production completed with 0 Publication Candidates; Research Runtime Publication completed with 0 releases; upstream lifecycle and publication gates were preserved."',
              'output summary'
            )
            runtime = replaceRequired(runtime, 'task_publication: "Waiting"', 'task_publication: "Completed"', 'Publication task status')
            runtime = replaceRequired(
              runtime,
              'Four Research Operating System V2 runtime stages have now been executed on 2026-08-04:',
              'Five Research Operating System V2 runtime stages have now been executed on 2026-08-04:',
              'runtime stage count'
            )
            runtime = replaceRequired(
              runtime,
              '4. **Research Runtime Production** completed a governed eligibility review for all three columns and returned a valid zero-output result: no object had passed the complete upstream Reading and Analysis gates required to create a Publication Candidate.\n',
              '4. **Research Runtime Production** completed a governed eligibility review for all three columns and returned a valid zero-output result: no object had passed the complete upstream Reading and Analysis gates required to create a Publication Candidate.\n5. **Research Runtime Publication** consumed the completed candidate batch, found zero eligible Publication Candidates, and completed the release gate with zero releases and no invented publication.\n',
              'Publication summary item'
            )

            const oldSummary = 'No Daily Research Note, Architecture promotion, Specification, or scheduled Daily Publication has been created so far today. Research Runtime Production has executed and is `Completed` with zero Publication Candidates; Research Runtime Publication remains waiting for the 20:00 release gate. Separately, the authorized Research Report Production Engine V1.3 capability release passed Runtime validation, Research Intelligence validation, Publication Gate, and the complete VitePress build; PR #26 was merged to `main` as commit `ac0ab99241c6c7be709a35b90df6cd56aae2c472`, and the canonical product page and homepage hierarchy assets were fetched and verified. External GitHub Pages deployment observation remains pending and is not inferred from the source commit.'
            const newSummary = 'No Daily Research Note, Architecture promotion, Specification, or scheduled Daily Publication was created today. Research Runtime Production completed with zero Publication Candidates, and Research Runtime Publication completed the 20:00 release gate with zero eligible candidates, zero releases, and zero public-file changes. The V4 day is closed as `Completed` 5/5 without inventing content. Separately, the authorized Research Report Production Engine V1.3 capability release passed Runtime validation, Research Intelligence validation, Publication Gate, and the complete VitePress build; PR #26 was merged to `main` as commit `ac0ab99241c6c7be709a35b90df6cd56aae2c472`, and the canonical product page and homepage hierarchy assets were fetched and verified. External GitHub Pages deployment observation remains pending and is not inferred from the source commit.'
            runtime = replaceRequired(runtime, oldSummary, newSummary, 'runtime summary paragraph')

            const stage5 = `# Stage 5 — Research Runtime Publication

## Publication eligibility result

\`\`\`yaml
publication_run:
  scheduled_time: "20:00 Asia/Shanghai"
  actual_execution: "2026-08-04T20:52:00+08:00"
  execution_mode: missed-shift backfill
  candidate_batches_reviewed: 1
  candidates_reviewed: 0
  eligible_candidates: 0
  releases_created: 0
  public_files_changed: 0
  status: Completed
  outcome: No Eligible Publication Candidate
\`\`\`

Publication consumed only the completed candidate batch produced by Research Runtime Production. The batch was `Completed`, its governed outcome was `No Eligible Research Object`, and its `candidates` array was empty.

The correct Publication result was therefore a completed zero-release check. No Chinese or English article, cover, index, homepage entry, release record, or other public file was created or changed.

## Publication output and commit verification

- Candidate batch reviewed: \`research/runtime/candidates/2026/08/2026-08-04-candidates.json\`
- Candidate-batch evidence commit: \`95ed499dfb157489960b9b8155030de88c635e96\`
- Eligible Publication Candidates: \`0\`
- Releases created: \`0\`
- Public files changed: \`0\`
- Publication status: \`Completed\`
- Runtime Record and resulting GitHub commit are validated before the backfill is closed.

## Next governed action

Research Runtime Center V5 begins its first formal Daily Runtime at 09:00 Asia/Shanghai on 2026-08-05 with Research Runtime Discovery. No V5 stage was run early and no V4 publication content was manufactured.

`
            runtime = replaceRequired(
              runtime,
              '## Capability Release Synchronization — Research Report Production Engine V1.3',
              `${stage5}## Capability Release Synchronization — Research Report Production Engine V1.3`,
              'Stage 5 insertion point'
            )

            const publicationResult = `\`\`\`runtime-result
{
  "task": "publication",
  "status": "Completed",
  "input": "The completed 2026-08-04 Publication Candidate batch produced by Research Runtime Production, including its governed zero-candidate outcome and verified evidence commit.",
  "input_zh": "Research Runtime Production 生成的 2026-08-04 已完成 Publication Candidate 批次，包括受治理的零候选结果与已验证证据提交。",
  "summary": "Completed the missed 20:00 Publication release gate. The candidate batch contained zero eligible candidates, so Publication completed with zero releases and no invented content.",
  "summary_zh": "补跑并完成错过的 20:00 Publication 发布门禁。候选批次中没有合格候选，因此 Publication 以 Completed 结束，发布 0 个内容，且没有虚构出版物。",
  "output": "A closed V4 Daily Runtime Record with Publication Completed, zero releases, zero public-file changes, and preserved publication gates.",
  "output_zh": "完成并关闭 V4 Daily Runtime Record：Publication 已完成、发布 0 个、公开文件变更 0 个，并保留全部出版门禁。",
  "next": "Start Research Runtime Center V5 with Discovery at 09:00 Asia/Shanghai on 2026-08-05.",
  "next_zh": "于 2026-08-05 09:00（Asia/Shanghai）从 Discovery 开始 Research Runtime Center V5。",
  "reason": "No candidate was eligible because the completed candidate batch contained an empty candidates array.",
  "reason_zh": "没有候选可发布，因为已完成的候选批次中 candidates 数组为空。",
  "metrics": [
    { "label": "Candidate batches reviewed", "label_zh": "复核候选批次", "value": "1" },
    { "label": "Candidates reviewed", "label_zh": "复核候选", "value": "0" },
    { "label": "Eligible candidates", "label_zh": "合格候选", "value": "0" },
    { "label": "Releases", "label_zh": "发布数量", "value": "0" },
    { "label": "Public files changed", "label_zh": "公开文件变更", "value": "0" }
  ],
  "artifacts": [
    { "label": "Publication Candidate batch", "label_zh": "出版候选批次", "path": "research/runtime/candidates/2026/08/2026-08-04-candidates.json", "commit": "95ed499dfb157489960b9b8155030de88c635e96" },
    { "label": "Daily Runtime Record", "label_zh": "每日运行记录", "path": "research/runtime/2026/08/2026-08-04-runtime.md" }
  ]
}
\`\`\`

`
            runtime = replaceRequired(runtime, '## Runtime Log\n', `${publicationResult}## Runtime Log\n`, 'Runtime Log insertion point')
            runtime += '\n| 20:52 | Research Runtime Publication | Runtime Started | Running | Loaded the completed Publication Candidate batch and enforced the release-only boundary. |\n'
            runtime += '| 20:53 | Research Runtime Publication | Eligibility Review | Completed | Candidate batch status was Completed and candidates array contained 0 items. |\n'
            runtime += '| 20:54 | Research Runtime Publication | Publication Result | Completed | Completed the release gate with 0 releases and 0 public-file changes; no publication was invented. |\n'
            runtime += '| 20:54 | Research Runtime Publication | Commit Verify | Completed | Candidate-batch evidence and the updated Runtime Record were validated before closure. |\n'
          }

          fs.writeFileSync(runtimePath, runtime)

          let legacy = fs.readFileSync(legacyPath, 'utf8')
          if (!legacy.includes('const allCompleted =')) {
            legacy = replaceRequired(
              legacy,
              "  const completedTasks = Object.values(taskStatus).filter((status) => status === 'Completed').length\n  return {",
              "  const completedTasks = Object.values(taskStatus).filter((status) => status === 'Completed').length\n  const allCompleted = tasks.length > 0 && Object.values(taskStatus).every((status) => status === 'Completed')\n  return {",
              'derived completion declaration'
            )
            legacy = replaceRequired(
              legacy,
              "    status: data.overall_status || 'Waiting',",
              "    status: allCompleted ? 'Completed' : data.overall_status || 'Waiting',",
              'derived completion status'
            )
            fs.writeFileSync(legacyPath, legacy)
          }

          let verify = fs.readFileSync(verifyPath, 'utf8')
          verify = verify.replace(
            "const productionResult = august4.results?.production\n",
            "const productionResult = august4.results?.production\nconst publicationStatus = august4.taskStatus?.publication\nconst publicationResult = august4.results?.publication\n"
          )
          verify = verify.replace(
            "if (august4.completedTasks !== 4 || august4.totalTasks !== 5) {\n  die(`2026-08-04 progress is ${august4.completedTasks}/${august4.totalTasks}, expected 4/5`)\n}",
            "if (publicationStatus !== 'Completed') {\n  die(`2026-08-04 Publication taskStatus is ${publicationStatus}, expected Completed`)\n}\nif (publicationResult?.status !== 'Completed') {\n  die(`2026-08-04 Publication result is ${publicationResult?.status}, expected Completed`)\n}\nif (august4.completedTasks !== 5 || august4.totalTasks !== 5) {\n  die(`2026-08-04 progress is ${august4.completedTasks}/${august4.totalTasks}, expected 5/5`)\n}\nif (!publicationResult.workResult_zh.includes('Completed') || !publicationResult.workResult_zh.includes('发布 0 个')) {\n  die('Chinese Publication work result does not describe Completed with zero releases')\n}"
          )
          verify = verify.replace(
            "  if (!text.includes('Completed the governed Production eligibility review for all three columns')) {\n    die('built site does not contain the corrected English Production outcome')\n  }",
            "  if (!text.includes('Completed the governed Production eligibility review for all three columns')) {\n    die('built site does not contain the corrected English Production outcome')\n  }\n  if (!text.includes('补跑并完成错过的 20:00 Publication 发布门禁')) {\n    die('built site does not contain the completed Chinese Publication outcome')\n  }\n  if (!text.includes('Completed the missed 20:00 Publication release gate')) {\n    die('built site does not contain the completed English Publication outcome')\n  }"
          )
          verify = verify.replace(
            "console.log('Runtime legacy projection verified: 2026-08-04 Production Completed, progress 4/5, candidates 0.')",
            "console.log('Runtime legacy projection verified: 2026-08-04 Production and Publication Completed, progress 5/5, candidates 0, releases 0.')"
          )
          if (!verify.includes("expected 5/5") || !verify.includes("Publication result is")) {
            throw new Error('Failed to update Runtime projection verification to Publication Completed 5/5')
          }
          fs.writeFileSync(verifyPath, verify)

          if (fs.existsSync(workflowPath)) fs.rmSync(workflowPath)
          if (fs.existsSync(triggerPath)) fs.rmSync(triggerPath)

          const finalRuntime = fs.readFileSync(runtimePath, 'utf8')
          for (const expected of [
            'overall_status: "Completed"',
            'publication_status: "Completed"',
            'task_publication: "Completed"',
            '"task": "publication"',
            '"status": "Completed"',
            '"Releases", "label_zh": "发布数量", "value": "0"'
          ]) {
            if (!finalRuntime.includes(expected)) throw new Error(`Runtime closure assertion failed: ${expected}`)
          }
          console.log('V4 Publication backfill prepared: Completed, 0 candidates, 0 releases.')
          NODE

      - name: Install dependencies
        run: npm install

      - name: Validate Runtime projection and site
        run: npm run docs:build

      - name: Commit verified backfill
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "backfill(runtime): complete 2026-08-04 Publication"
          git push origin HEAD:main
