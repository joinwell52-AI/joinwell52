name: Research Production Cover Finalization V1

on:
  push:
    branches: [main]
    paths:
      - 'research/runtime/production-work/**/cover-generation-receipt.json'

permissions:
  contents: write

concurrency:
  group: research-production-cover-finalization
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve receipt dates and prepare deterministic finalization
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          mapfile -t dates < <(git diff --name-only "$BEFORE_SHA" "$EVENT_SHA" -- 'research/runtime/production-work/**/cover-generation-receipt.json' \
            | awk -F/ 'NF>=8 {print $4"-"$5"-"$6}' | sort -u)
          for d in "${dates[@]}"; do
            node scripts/runtime-production-cover-finalize.mjs --date "$d"
          done
      - name: Detect ready batch
        id: ready
        run: |
          if git diff --quiet; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Stage atomic candidate bundle
        if: steps.ready.outputs.ready == 'true'
        run: git add staging/publication-candidates research/runtime/candidates research/runtime/checkpoints research/runtime/results research/runtime/completion-requests
      - name: Validate atomic bundle and publication gates
        if: steps.ready.outputs.ready == 'true'
        run: |
          npm run publication:bundle:staged
          npm run publication:layout:validate
          npm run publication:editorial:validate
          for result in research/runtime/results/*/*/*-production-result.json; do
            date="$(basename "$result" -production-result.json)"
            if git diff --cached --name-only | grep -qx "$result"; then
              node scripts/runtime-production-proof.mjs --date "$date" --result "$result"
            fi
          done
          npm run runtime:validate
      - name: Commit deterministic Production candidate completion
        if: steps.ready.outputs.ready == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'runtime(production): finalize isolated cover receipts'
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            git fetch origin main
            git reset --hard origin/main
            sleep $((attempt * 5))
          done
          exit 1
