name: Runtime Discovery Fallback 2026-08-07 Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/runtime-discovery-fallback-20260807-once.yml

permissions:
  contents: write

jobs:
  persist-running:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Synchronize latest main
        shell: bash
        run: git pull --rebase origin main

      - name: Persist exactly one Discovery start state if missing
        shell: bash
        run: |
          set -euo pipefail
          record="research/runtime/records/daily/2026/08/2026-08-07-daily-runtime.json"
          ledger="research/runtime/2026/08/2026-08-07-runtime.md"

          already_ok="false"
          if [ -f "$record" ]; then
            already_ok=$(node - <<'NODE'
          const fs = require('fs')
          const p = 'research/runtime/records/daily/2026/08/2026-08-07-daily-runtime.json'
          const r = JSON.parse(fs.readFileSync(p, 'utf8'))
          const starts = (r.timeline || []).filter(e => e.task === 'discovery' && e.event === 'Execution Slot Opened' && e.status === 'Running' && String(e.time || '').startsWith('2026-08-07'))
          process.stdout.write(String(r.status === 'Running' && r.taskStatus?.discovery === 'Running' && starts.length === 1))
          NODE
          )
          fi

          if [ "$already_ok" != "true" ]; then
            node scripts/runtime-v5.mjs schedule --task discovery
            node - <<'NODE'
          const fs = require('fs')
          const p = 'research/runtime/records/daily/2026/08/2026-08-07-daily-runtime.json'
          const r = JSON.parse(fs.readFileSync(p, 'utf8'))
          const starts = (r.timeline || []).filter(e => e.task === 'discovery' && e.event === 'Execution Slot Opened' && e.status === 'Running' && String(e.time || '').startsWith('2026-08-07'))
          if (starts.length !== 1) throw new Error(`expected exactly one current-day Discovery start event, got ${starts.length}`)
          starts[0].detail = 'Scheduler fallback: Research Runtime Discovery opened because the durable control-plane start state was absent; substantive work may begin only after this synchronized JSON and Markdown state is committed and verified.'
          r.status = 'Running'
          r.taskStatus.discovery = 'Running'
          r.githubCommit = 'pending'
          r.commitVerify = 'Running'
          fs.writeFileSync(p, JSON.stringify(r, null, 2) + '\n')
          NODE
            node scripts/runtime-markdown.mjs render --date 2026-08-07
            node scripts/runtime-markdown.mjs validate --date 2026-08-07
            node scripts/runtime-v5.mjs validate
          fi

          node - <<'NODE'
          const fs = require('fs')
          const p = 'research/runtime/records/daily/2026/08/2026-08-07-daily-runtime.json'
          const r = JSON.parse(fs.readFileSync(p, 'utf8'))
          const starts = (r.timeline || []).filter(e => e.task === 'discovery' && e.event === 'Execution Slot Opened' && e.status === 'Running' && String(e.time || '').startsWith('2026-08-07'))
          if (r.status !== 'Running') throw new Error(`overall status is ${r.status}`)
          if (r.taskStatus?.discovery !== 'Running') throw new Error(`discovery status is ${r.taskStatus?.discovery}`)
          if (starts.length !== 1) throw new Error(`expected exactly one start event, got ${starts.length}`)
          if (!fs.existsSync('research/runtime/2026/08/2026-08-07-runtime.md')) throw new Error('Markdown ledger missing')
          NODE

      - name: Commit fallback state and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/runtime-discovery-fallback-20260807-once.yml
          git config user.name "joinwell52 Research Runtime"
          git config user.email "actions@users.noreply.github.com"
          git add research/runtime/records/daily/2026/08/2026-08-07-daily-runtime.json \
            research/runtime/2026/08/2026-08-07-runtime.md \
            .github/workflows/runtime-discovery-fallback-20260807-once.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "runtime(discovery): persist 2026-08-07 Running fallback"
          git push origin HEAD:main
