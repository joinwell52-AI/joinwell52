          const intelPath = 'research/intelligence/runs/2026/08/2026-08-07-intelligence.json'
          const r = JSON.parse(fs.readFileSync(recordPath, 'utf8'))
          const intel = JSON.parse(fs.readFileSync(intelPath, 'utf8'))

          const shanghaiIso = () => {
            const now = new Date()
            const parts = new Intl.DateTimeFormat('en-CA', {timeZone:'Asia/Shanghai', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit', hourCycle:'h23'}).formatToParts(now)
            const x = Object.fromEntries(parts.map(p => [p.type,p.value]))
            return `${x.year}-${x.month}-${x.day}T${x.hour}:${x.minute}:${x.second}+08:00`
          }
          const completedAt = shanghaiIso()
          const starts = (r.timeline || []).filter(e => e.task === 'discovery' && e.event === 'Execution Slot Opened' && e.status === 'Running' && String(e.time || '').startsWith('2026-08-07'))
          if (starts.length !== 1) throw new Error(`expected exactly one Discovery start event, got ${starts.length}`)
          if ((r.timeline || []).some(e => e.task === 'discovery' && e.event === 'Discovery Completed')) throw new Error('Discovery Completed event already exists')

          const metrics = [
            {label:'Due source objects',label_zh:'应检查来源对象',value:'48'},
            {label:'Checked source objects',label_zh:'已检查来源对象',value:'45'},
            {label:'Authentication-required sources',label_zh:'需要认证的来源',value:'1'},
            {label:'Recorded retrieval failures',label_zh:'已记录抓取失败',value:'2'},
