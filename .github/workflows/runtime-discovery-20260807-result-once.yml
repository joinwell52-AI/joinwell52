name: Runtime Discovery 2026-08-07 Result Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/runtime-discovery-20260807-result-once.yml

permissions:
  contents: write

jobs:
  persist-discovery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Synchronize latest main
        shell: bash
        run: git pull --rebase origin main

      - name: Persist Discovery result and Signal Pool
        shell: bash
        run: |
          set -euo pipefail
          record="research/runtime/records/daily/2026/08/2026-08-07-daily-runtime.json"
          ledger="research/runtime/2026/08/2026-08-07-runtime.md"
          intel="research/intelligence/runs/2026/08/2026-08-07-intelligence.json"
          start_commit="2e7b74217cc2c7f201755e8be227978eecca4862"

          node - <<'NODE'
          const fs = require('fs')
          const p = 'research/runtime/records/daily/2026/08/2026-08-07-daily-runtime.json'
          const r = JSON.parse(fs.readFileSync(p, 'utf8'))
          const starts = (r.timeline || []).filter(e => e.task === 'discovery' && e.event === 'Execution Slot Opened' && e.status === 'Running' && String(e.time || '').startsWith('2026-08-07'))
          if (r.status !== 'Running') throw new Error(`overall status must still be Running before Discovery result, got ${r.status}`)
          if (r.taskStatus?.discovery !== 'Running') throw new Error(`Discovery must still be Running, got ${r.taskStatus?.discovery}`)
          if (starts.length !== 1) throw new Error(`expected exactly one current-day Discovery start event, got ${starts.length}`)
          if (Object.keys(r.results || {}).length !== 0) throw new Error('unexpected pre-existing result fields before Discovery result')
          NODE

          mkdir -p "$(dirname "$intel")"
          cat > "$intel" <<'JSON'
