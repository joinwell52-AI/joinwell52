                "observedChange": "Active-SWE expands coding-agent evaluation beyond reactive issue-driven repair to 1,663 proactive bug-fixing tasks across six bug categories and eight languages, using a difficulty-aware construction pipeline and dual-track evaluation.",
                "observedChange_zh": "Active-SWE 将 Coding Agent 评测从依赖 Issue 的被动修复扩展到 1,663 个主动 Bug 修复任务，覆盖 6 类 Bug 与 8 种语言，并使用难度感知构造与双轨评测。",
