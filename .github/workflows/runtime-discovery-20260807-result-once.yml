          fs.writeFileSync(intelPath, JSON.stringify(intel, null, 2) + '\n')
          NODE

          node scripts/runtime-markdown.mjs render --date 2026-08-07
          node scripts/runtime-markdown.mjs validate --date 2026-08-07
          node scripts/runtime-v5.mjs validate
          git diff --check

      - name: Commit durable Discovery result
        id: result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "joinwell52 Research Runtime"
          git config user.email "actions@users.noreply.github.com"
          git add research/intelligence/runs/2026/08/2026-08-07-intelligence.json \
            research/runtime/records/daily/2026/08/2026-08-07-daily-runtime.json \
            research/runtime/2026/08/2026-08-07-runtime.md
          git commit -m "runtime(discovery): persist 2026-08-07 Signal Pool"
          result_commit=$(git rev-parse HEAD)
          echo "result_commit=$result_commit" >> "$GITHUB_OUTPUT"
          git push origin HEAD:main
          git fetch origin main
          git merge-base --is-ancestor "$result_commit" origin/main

      - name: Persist commit verification and remove one-time workflow
        shell: bash
        env:
          RESULT_COMMIT: ${{ steps.result.outputs.result_commit }}
        run: |
          set -euo pipefail
          record="research/runtime/records/daily/2026/08/2026-08-07-daily-runtime.json"
          intel="research/intelligence/runs/2026/08/2026-08-07-intelligence.json"

          node - <<'NODE'
          const fs = require('fs')
          const resultCommit = process.env.RESULT_COMMIT
          if (!/^[0-9a-f]{40}$/.test(resultCommit || '')) throw new Error('invalid RESULT_COMMIT')
          const shanghaiIso = () => {
            const now = new Date()
            const parts = new Intl.DateTimeFormat('en-CA', {timeZone:'Asia/Shanghai', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit', hourCycle:'h23'}).formatToParts(now)
            const x = Object.fromEntries(parts.map(p => [p.type,p.value]))
            return `${x.year}-${x.month}-${x.day}T${x.hour}:${x.minute}:${x.second}+08:00`
          }
          const verifiedAt = shanghaiIso()
          const recordPath = 'research/runtime/records/daily/2026/08/2026-08-07-daily-runtime.json'
          const intelPath = 'research/intelligence/runs/2026/08/2026-08-07-intelligence.json'
          const r = JSON.parse(fs.readFileSync(recordPath, 'utf8'))
          const intel = JSON.parse(fs.readFileSync(intelPath, 'utf8'))
          const starts = (r.timeline || []).filter(e => e.task === 'discovery' && e.event === 'Execution Slot Opened' && e.status === 'Running' && String(e.time || '').startsWith('2026-08-07'))
          const completed = (r.timeline || []).filter(e => e.task === 'discovery' && e.event === 'Discovery Completed' && e.status === 'Completed')
          if (starts.length !== 1) throw new Error(`start event count changed: ${starts.length}`)
          if (completed.length !== 1) throw new Error(`Discovery Completed event count is ${completed.length}`)
          if (r.taskStatus?.discovery !== 'Completed' || !r.results?.discovery) throw new Error('Discovery result missing before verification')
          r.githubCommit = resultCommit
          r.commitVerify = 'Completed'
          r.timeline.push({
            time: verifiedAt,
            task:'discovery',
            event:'GitHub Commit Verified',
            status:'Completed',
            detail:`Fetched and verified durable Discovery result commit ${resultCommit}; Research Intelligence JSON, Daily Runtime JSON and regenerated Markdown ledger are present and consistent.`
          })
          r.updatedAt = verifiedAt
          intel.githubCommit = resultCommit
          intel.controlPlane.resultCommit = resultCommit
          intel.controlPlane.resultCommitVerified = true
          intel.updatedAt = verifiedAt
          fs.writeFileSync(recordPath, JSON.stringify(r, null, 2) + '\n')
          fs.writeFileSync(intelPath, JSON.stringify(intel, null, 2) + '\n')
          NODE

          node scripts/runtime-markdown.mjs render --date 2026-08-07
          node scripts/runtime-markdown.mjs validate --date 2026-08-07
          node scripts/runtime-v5.mjs validate
          git diff --check
          rm -f .github/workflows/runtime-discovery-20260807-result-once.yml
          git add research/intelligence/runs/2026/08/2026-08-07-intelligence.json \
            research/runtime/records/daily/2026/08/2026-08-07-daily-runtime.json \
            research/runtime/2026/08/2026-08-07-runtime.md \
            .github/workflows/runtime-discovery-20260807-result-once.yml
          git commit -m "runtime(discovery): verify 2026-08-07 durable result"
          git pull --rebase origin main
          git push origin HEAD:main
