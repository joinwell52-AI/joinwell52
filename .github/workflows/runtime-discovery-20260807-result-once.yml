            {label:'AI-platform signals',label_zh:'AI 平台信号',value:'3'},
            {label:'GitHub-engineering signals',label_zh:'GitHub 工程信号',value:'8'},
            {label:'Published-research signals',label_zh:'论文研究信号',value:'4'},
            {label:'Topics selected',label_zh:'已选主题',value:'0'}
          ]
          const evidence = [
            {label:'Scheduler V3.0',label_zh:'Scheduler V3.0',path:'research/runtime/SCHEDULER.json',source:'research/runtime/SCHEDULER.json'},
            {label:'Verified fallback start-state commit',label_zh:'已核验的回退启动状态提交',commit:'2e7b74217cc2c7f201755e8be227978eecca4862',source:'https://github.com/joinwell52-AI/joinwell52/commit/2e7b74217cc2c7f201755e8be227978eecca4862'},
            {label:'Research Intelligence Registry',label_zh:'研究情报注册表',path:'research/intelligence/REGISTRY.json',source:'research/intelligence/REGISTRY.json'},
            {label:'AI Platform profile',label_zh:'AI 平台情报 Profile',path:'research/skills/profiles/01p-ai-platform-change-intelligence.md',source:'research/skills/profiles/01p-ai-platform-change-intelligence.md'},
            {label:'GitHub Engineering profile',label_zh:'GitHub 工程情报 Profile',path:'research/skills/profiles/01g-github-engineering-intelligence.md',source:'research/skills/profiles/01g-github-engineering-intelligence.md'},
            {label:'Published Research profile',label_zh:'论文研究情报 Profile',path:'research/skills/profiles/01r-published-research-intelligence.md',source:'research/skills/profiles/01r-published-research-intelligence.md'},
            {label:'ChatGPT release notes',label_zh:'ChatGPT 发布说明',url:'https://help.openai.com/en/articles/6825453-chatgpt-release-notes',source:'https://help.openai.com/en/articles/6825453-chatgpt-release-notes'},
            {label:'GitHub Copilot changelog',label_zh:'GitHub Copilot 更新日志',url:'https://github.blog/changelog/label/copilot/',source:'https://github.blog/changelog/label/copilot/'},
            {label:'Gemini CLI v0.54.0',label_zh:'Gemini CLI v0.54.0',url:'https://github.com/google-gemini/gemini-cli/releases/tag/v0.54.0',source:'https://github.com/google-gemini/gemini-cli/releases/tag/v0.54.0'},
            {label:'arXiv Computer Science new listings',label_zh:'arXiv Computer Science 新上架',url:'https://arxiv.org/list/cs/new',source:'https://arxiv.org/list/cs/new'},
            {label:'OpenReview',label_zh:'OpenReview',url:'https://openreview.net/',source:'https://openreview.net/'},
            {label:'OpenAI Research',label_zh:'OpenAI Research',url:'https://openai.com/research/',source:'https://openai.com/research/'},
            {label:'Anthropic Research',label_zh:'Anthropic Research',url:'https://www.anthropic.com/research',source:'https://www.anthropic.com/research'},
            {label:'Google DeepMind Research',label_zh:'Google DeepMind Research',url:'https://deepmind.google/research/',source:'https://deepmind.google/research/'},
            {label:'Microsoft Research',label_zh:'Microsoft Research',url:'https://www.microsoft.com/en-us/research/',source:'https://www.microsoft.com/en-us/research/'}
          ]
          const artifacts = [
            {label:'2026-08-07 Research Intelligence Run and Signal Pool',label_zh:'2026-08-07 研究情报运行与 Signal Pool',path:'research/intelligence/runs/2026/08/2026-08-07-intelligence.json'},
            {label:'Daily Runtime Record',label_zh:'每日运行机器记录',path:'research/runtime/records/daily/2026/08/2026-08-07-daily-runtime.json'},
            {label:'Human-readable Runtime ledger',label_zh:'人类可读运行账本',path:'research/runtime/2026/08/2026-08-07-runtime.md'}
          ]

          r.status = 'Waiting'
          r.taskStatus.discovery = 'Completed'
          r.results.discovery = {
            schema:'runtime-shift-result/v2',
            task:'discovery',
            status:'Completed',
            input:'The durably verified Scheduler-fallback start state in commit 2e7b74217cc2c7f201755e8be227978eecca4862, Research Runtime Scheduler V3.0, Research Intelligence Registry V1.0, three formal Discovery profiles, 33 platform channels, 9 P0 repositories, and 6 P0 research sources.',
            input_zh:'提交 2e7b74217cc2c7f201755e8be227978eecca4862 中已完成持久化核验的 Scheduler 回退启动状态、Research Runtime Scheduler V3.0、Research Intelligence Registry V1.0、三项正式 Discovery Profile、33 个平台渠道、9 个 P0 仓库及 6 个 P0 研究来源。',
            workResult:'Completed all three formal intelligence profiles only after the durable Running control-plane state was fetched and verified. Resolved all 48 due source objects as 45 checked, 1 authentication-required and 2 explicitly failed; normalized and deduplicated 15 signals without selecting topics, performing Deep Reading, analysis or article writing.',
            workResult_zh:'仅在持久化 Running 控制面状态完成拉取与核验后，才完成三项正式情报 Profile。48 个应检查来源对象全部得到明确结果：45 个已检查、1 个需要认证、2 个明确失败；共规范化并去重 15 个信号，未选题、未开展 Deep Reading、分析或文章写作。',
            output:'A durable 2026-08-07 Research Intelligence run containing the Signal Pool: 3 AI-platform signals, 8 GitHub-engineering signals and 4 published-research signals, with explicit inaccessible and failed-source records.',
