name: Deploy Research Center Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "research/runtime/**"
      - "research/intelligence/**"
      - "research/editorial/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-research-center-pages.yml"
  workflow_run:
    workflows:
      - "Research Runtime Scheduler V3.0"
      - "Research Runtime Shift Completion V2.0"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-publish
  cancel-in-progress: true

jobs:
  build:
    # A failed upstream Runtime workflow must not publish an unverified state.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Build Research Center
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # workflow_run executes in the context of the default branch. Always build current
          # authoritative main so a GITHUB_TOKEN-authored Runtime commit is included.
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Finalize eligible weekly editorial scorecard
        run: node scripts/editorial-scorecard-finalize-current.mjs

      - name: Validate and build editorial scorecard projection
        run: |
          npm run editorial:scorecard:validate
          npm run editorial:scorecard:build

      - name: Persist weekly scorecard and public projection
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- docs/public/_scorecard-inventory-run.txt || true
          if git diff --quiet -- research/editorial/scorecards docs/.vitepress/generated/editorial-scorecard.json; then
            echo "No weekly scorecard/projection changes to persist."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/editorial/scorecards docs/.vitepress/generated/editorial-scorecard.json
          git commit -m "editorial: finalize weekly scorecard projection"
          git push origin HEAD:main

      - name: Build VitePress site
        run: npm run docs:build

      - name: Verify generated site
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')

          const dist = path.join('docs', '.vitepress', 'dist')
          const requiredRoutes = [
            'index.html',
            'zh/index.html',
            'en/index.html',
            'zh/runtime/index.html',
            'en/runtime/index.html',
            'zh/research/index.html',
            'en/research/index.html',
            'zh/publications/index.html',
            'en/publications/index.html'
          ]

          const missing = requiredRoutes.filter((file) => !fs.existsSync(path.join(dist, file)))
          if (missing.length) throw new Error(`Missing generated routes: ${missing.join(', ')}`)

          const shanghaiToday = new Intl.DateTimeFormat('en-CA', {
            timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit'
          }).format(new Date())
          const [year, month] = shanghaiToday.split('-')
          const currentRuntimeRecord = path.join('research', 'runtime', 'records', 'daily', year, month, `${shanghaiToday}-daily-runtime.json`)

          const runtimeDataPath = path.join('docs', '.vitepress', 'generated', 'runtime-records.json')
          if (!fs.existsSync(runtimeDataPath)) throw new Error('Missing generated Runtime data.')

          const runtimeData = JSON.parse(fs.readFileSync(runtimeDataPath, 'utf8'))
          if (runtimeData.schema !== 'research-runtime-center-data/v5') {
            throw new Error(`Unexpected Runtime schema: ${runtimeData.schema}`)
          }

          // Cross-day freshness invariant: once today's durable Runtime record exists, Pages may
          // never publish yesterday as "today". This is a data contract, not a UI-panel contract.
          if (fs.existsSync(currentRuntimeRecord) && runtimeData.todayDaily?.date !== shanghaiToday) {
            throw new Error(`Runtime freshness violation: durable ${shanghaiToday} record exists but generated todayDaily=${runtimeData.todayDaily?.date || '(missing)'}.`)
          }

          const statuses = runtimeData.todayDaily?.taskStatus || {}
          const dependencyOf = {
            queue: 'discovery',
            reading: 'queue',
            analysis: 'reading',
            production: 'analysis',
            publication: 'production'
          }
          for (const [task, dependency] of Object.entries(dependencyOf)) {
            if (['Running', 'Completed'].includes(statuses[task]) && statuses[dependency] !== 'Completed') {
              throw new Error(`Runtime order violation: ${task}=${statuses[task]} while ${dependency}=${statuses[dependency]}. Refusing to publish an inconsistent Runtime page.`)
            }
          }

          const zhRuntimeHtml = fs.readFileSync(path.join(dist, 'zh/runtime/index.html'), 'utf8')
          const enRuntimeHtml = fs.readFileSync(path.join(dist, 'en/runtime/index.html'), 'utf8')
          if (!zhRuntimeHtml.includes('runtime-center-page') || !enRuntimeHtml.includes('runtime-center-page')) {
            throw new Error('Runtime page shell marker missing from generated HTML.')
          }

          const scorecardProjection = JSON.parse(fs.readFileSync(path.join('docs', '.vitepress', 'generated', 'editorial-scorecard.json'), 'utf8'))
          if (scorecardProjection.status !== 'Completed') throw new Error('Editorial scorecard projection is not Completed.')
          if (scorecardProjection.reviewDate === shanghaiToday && scorecardProjection.coverageRate !== 1) {
            throw new Error(`Current-day editorial scorecard coverage is ${scorecardProjection.coverageRate}; refusing partial publication.`)
          }
          const zhResearchHtml = fs.readFileSync(path.join(dist, 'zh/research/index.html'), 'utf8')
          const enResearchHtml = fs.readFileSync(path.join(dist, 'en/research/index.html'), 'utf8')
          if (!zhResearchHtml.includes(`AI 编辑评分 · ${scorecardProjection.reviewDate}`) || !enResearchHtml.includes(scorecardProjection.reviewDate)) {
            throw new Error(`Research scorecard page does not render reviewDate=${scorecardProjection.reviewDate}.`)
          }

          console.log(`Verified ${requiredRoutes.length} public routes, Runtime V5 ordering, Shanghai freshness=${shanghaiToday}, and editorial scorecard=${scorecardProjection.reviewDate}.`)
          NODE

          # Released articles must remain publicly routable and discoverable through
          # Research and their corresponding column indexes. Homepage promotion is optional UI.
          node scripts/publication-visibility.mjs

      - name: Publish gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"

          cd docs/.vitepress/dist
          touch .nojekyll

          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "deploy: ${source_sha}"

          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages

# Runtime state may be committed by GITHUB_TOKEN. Scheduler and generic completion workflow_run
# events are therefore first-class synchronization paths, not merely push fallbacks.
