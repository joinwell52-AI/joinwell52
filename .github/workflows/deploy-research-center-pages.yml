name: Deploy Research Center Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "research/runtime/**"
      - "research/intelligence/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-research-center-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-publish
  cancel-in-progress: true

jobs:
  build:
    name: Build Research Center
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build VitePress site
        run: npm run docs:build

      - name: Verify generated site
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')

          const dist = path.join('docs', '.vitepress', 'dist')
          const requiredRoutes = [
            'index.html',
            'zh/index.html',
            'en/index.html',
            'zh/runtime/index.html',
            'en/runtime/index.html',
            'zh/research/index.html',
            'en/research/index.html',
            'zh/publications/index.html',
            'en/publications/index.html'
          ]

          const missing = requiredRoutes.filter((file) => !fs.existsSync(path.join(dist, file)))
          if (missing.length) {
            throw new Error(`Missing generated routes: ${missing.join(', ')}`)
          }

          const runtimeDataPath = path.join('docs', '.vitepress', 'generated', 'runtime-records.json')
          if (!fs.existsSync(runtimeDataPath)) {
            throw new Error('Missing generated Runtime data.')
          }

          const runtimeData = JSON.parse(fs.readFileSync(runtimeDataPath, 'utf8'))
          if (runtimeData.schema !== 'research-runtime-center-data/v5') {
            throw new Error(`Unexpected Runtime schema: ${runtimeData.schema}`)
          }

          console.log(`Verified ${requiredRoutes.length} public routes and Runtime V5 data.`)
          NODE

      - name: Publish gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          cd docs/.vitepress/dist
          touch .nojekyll

          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "deploy: ${GITHUB_SHA}"

          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages

# Keep this workflow path-sensitive so a maintenance commit can explicitly retrigger Pages.
