name: Deploy Research Center Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Research Center
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build VitePress site
        run: npm run docs:build

      - name: Verify generated site
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')

          const dist = path.join('docs', '.vitepress', 'dist')
          const requiredRoutes = [
            'index.html',
            'zh/index.html',
            'en/index.html',
            'zh/runtime/index.html',
            'en/runtime/index.html',
            'zh/research/index.html',
            'en/research/index.html',
            'zh/publications/index.html',
            'en/publications/index.html'
          ]

          const missing = requiredRoutes.filter((file) => !fs.existsSync(path.join(dist, file)))
          if (missing.length) {
            throw new Error(`Missing generated routes: ${missing.join(', ')}`)
          }

          const runtimeDataPath = path.join('docs', '.vitepress', 'generated', 'runtime-records.json')
          if (!fs.existsSync(runtimeDataPath)) {
            throw new Error('Missing generated Runtime data.')
          }

          const runtimeData = JSON.parse(fs.readFileSync(runtimeDataPath, 'utf8'))
          if (runtimeData.schema !== 'research-runtime-center-data/v5') {
            throw new Error(`Unexpected Runtime schema: ${runtimeData.schema}`)
          }

          console.log(`Verified ${requiredRoutes.length} public routes and Runtime V5 data.`)
          NODE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
