name: Run Runtime V5 Production 2026-08-05

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/run-production-2026-08-05.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runtime-production-2026-08-05
  cancel-in-progress: false

jobs:
  production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Make executor resume-safe after durable start verification
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('scripts/run-production-2026-08-05.mjs')
          s = p.read_text()
          s = s.replace("research/skills/06-visualization.md", "research/skills/06-research-visualization.md")
          start = r'''// 1. Durable Running state before substantive Production work.
          let startTime
          let startSha
          if (record.taskStatus?.production === 'Waiting') {
            startTime = isoShanghai()
            record.status = 'Running'
            record.taskStatus.production = 'Running'
            appendEvent(record, 'Execution Slot Opened', 'Running', 'Research Runtime Production opened by Scheduler V3.0; Skills 05–08 may begin only after this start state is committed and verified.', startTime)
            record.githubCommit = 'pending'
            record.commitVerify = 'Waiting'
            writeJson(RECORD, record)
            renderLedger()
            startSha = commitAndPush(`runtime(production): open ${DATE} execution slot`, [RECORD, LEDGER])
          } else if (record.taskStatus?.production === 'Running') {
            const opened = [...(record.timeline || [])].reverse().find((item) => item.task === 'production' && item.event === 'Execution Slot Opened')
            if (!opened) throw new Error('Production is Running without an Execution Slot Opened event')
            startTime = opened.time
            startSha = record.githubCommit && record.githubCommit !== 'pending'
              ? record.githubCommit
              : sh('git', 'log', '-1', '--format=%H', '--', RECORD)
          } else if (record.taskStatus?.production === 'Completed') {
            process.exit(0)
          } else {
            throw new Error(`Production cannot resume from ${record.taskStatus?.production}`)
          }
          verifyProjection(startSha, [startTime, 'Execution Slot Opened', 'Running'])

          // 2. Persist the verified start checkpoint, still before substantive work.'''
          s, n = re.subn(r'// 1\. Durable Running state before substantive Production work\.[\s\S]*?// 2\. Persist the verified start checkpoint, still before substantive work\.', start, s, count=1)
          if n != 1:
              raise SystemExit('failed to patch resume block')
          checkpoint = r'''// 2. Persist the verified start checkpoint, still before substantive work.
          record = readJson(RECORD)
          let checkpointSha
          const existingStartVerification = [...(record.timeline || [])].reverse().find((item) => item.task === 'production' && item.event === 'GitHub Commit Verified' && item.detail.includes(startSha))
          if (existingStartVerification) {
            checkpointSha = sh('git', 'log', '-1', '--format=%H', '--', RECORD)
            verifyProjection(checkpointSha, [existingStartVerification.time, startSha, 'GitHub Commit Verified'])
          } else {
            const verifiedStartTime = appendEvent(record, 'GitHub Commit Verified', 'Running', `Fetched and verified start-state commit ${startSha} containing synchronized Daily Runtime JSON and Markdown ledger.`)
            record.githubCommit = startSha
            record.commitVerify = 'Completed'
            writeJson(RECORD, record)
            renderLedger()
            checkpointSha = commitAndPush(`runtime(production): verify ${DATE} start state`, [RECORD, LEDGER])
            verifyProjection(checkpointSha, [verifiedStartTime, startSha, 'GitHub Commit Verified'])
          }

          // Substantive work begins only here.'''
          s, n = re.subn(r'// 2\. Persist the verified start checkpoint, still before substantive work\.[\s\S]*?// Substantive work begins only here\.', checkpoint, s, count=1)
          if n != 1:
              raise SystemExit('failed to patch checkpoint block')
          p.write_text(s)
          PY
      - name: Execute governed Production
        run: node scripts/run-production-2026-08-05.mjs
