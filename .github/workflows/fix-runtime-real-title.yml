name: Fix Runtime Real Title

on:
  push:
    branches:
      - fix-runtime-real-title

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix-runtime-real-title
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Replace real Runtime titles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/.vitepress/theme/components/RuntimeOperationsCenterClassic.vue')
          text = path.read_text(encoding='utf-8')
          old_zh = "title: '今天研究什么，下午生产什么，晚上发布什么。',"
          old_en = "title: 'What is researched today, produced at 15:00, and released at 20:00.',"
          if old_zh not in text or old_en not in text:
              raise SystemExit('expected Runtime titles not found')
          text = text.replace(old_zh, "title: '数字工场运营中心',", 1)
          text = text.replace(old_en, "title: 'Digital Works Operations Center',", 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm install

      - name: Validate and build
        run: |
          npm run runtime:validate
          npm run docs:build

      - name: Commit verified title fix
        shell: bash
        run: |
          git config user.name "joinwell52 Research Runtime"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/fix-runtime-real-title.yml
          git add docs/.vitepress/theme/components/RuntimeOperationsCenterClassic.vue
          git commit -m "fix(runtime): use operations center as real title"
          git push origin HEAD:fix-runtime-real-title
