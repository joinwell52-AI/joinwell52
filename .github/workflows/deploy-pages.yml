name: Deploy Research Center

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build Research Center
        run: npm run docs:build

      - name: Verify public routes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')

          const root = path.join('docs', '.vitepress', 'dist')
          const required = [
            'index.html',
            'zh/index.html',
            'en/index.html',
            'zh/runtime/index.html',
            'en/runtime/index.html',
            'zh/research/index.html',
            'en/research/index.html',
            'zh/publications/index.html',
            'en/publications/index.html'
          ]

          const missing = required.filter((file) => !fs.existsSync(path.join(root, file)))
          if (missing.length) {
            throw new Error(`Missing built routes: ${missing.join(', ')}`)
          }

          const zhRuntime = fs.readFileSync(path.join(root, 'zh/runtime/index.html'), 'utf8')
          const enRuntime = fs.readFileSync(path.join(root, 'en/runtime/index.html'), 'utf8')

          if (!zhRuntime.includes('数字工场运营中心')) {
            throw new Error('Chinese Runtime title was not generated correctly.')
          }
          if (!enRuntime.includes('Digital Works Operations Center')) {
            throw new Error('English Runtime title was not generated correctly.')
          }

          console.log(`Verified ${required.length} public routes and bilingual Runtime titles.`)
          NODE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy site
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
