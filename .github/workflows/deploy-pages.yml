name: Deploy Research Center 3.0

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install

      - name: Validate Runtime Center
        run: npm run runtime:validate

      - name: Regenerate Runtime Center data
        run: npm run runtime:build

      - name: Verify V5 Runtime projection
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const path = 'docs/.vitepress/generated/runtime-records.json'
          const data = JSON.parse(fs.readFileSync(path, 'utf8'))
          if (data.schema !== 'research-runtime-center-data/v5') throw new Error(`Unexpected schema: ${data.schema}`)
          if (data.centerVersion !== '5.0') throw new Error(`Unexpected center version: ${data.centerVersion}`)
          if (data.schedulerVersion !== '3.0') throw new Error(`Unexpected scheduler version: ${data.schedulerVersion}`)
          const families = data.runtimeFamilies.map((item) => item.id).join(',')
          if (families !== 'daily,weekly,academic,program') throw new Error(`Unexpected Runtime families: ${families}`)
          const daily = data.schedule.filter((task) => task.family === 'daily').map((task) => `${task.id}@${task.schedule.time}`).join(',')
          const expected = 'discovery@09:00,queue@10:00,reading@11:00,analysis@13:00,production@15:00,publication@20:00'
          if (daily !== expected) throw new Error(`Unexpected Daily Runtime: ${daily}`)
          console.log('Runtime V5 projection verified.')
          NODE

      - name: Build VitePress site
        run: npm run docs:build

      - name: Verify primary public routes
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const root = 'docs/.vitepress/dist'
          const required = [
            'index.html',
            'zh/index.html',
            'zh/runtime/index.html',
            'zh/research/index.html',
            'zh/digital-employee/index.html',
            'zh/industry/index.html',
            'zh/engineering/index.html',
            'zh/publications/index.html',
            'zh/about.html',
            'en/runtime/index.html',
            'en/research/index.html',
            'en/digital-employee/index.html',
            'en/industry/index.html',
            'en/engineering/index.html',
            'en/publications/index.html',
            'en/about.html'
          ]
          const missing = required.filter((item) => !fs.existsSync(`${root}/${item}`))
          if (missing.length) throw new Error(`Missing Pages routes: ${missing.join(', ')}`)
          console.log(`Verified ${required.length} primary Pages routes.`)
          NODE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
