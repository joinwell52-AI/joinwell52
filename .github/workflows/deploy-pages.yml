name: Deploy Research Center 3.0

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install

      - name: Validate Runtime Center
        run: npm run runtime:validate

      - name: Regenerate Runtime Center data
        run: npm run runtime:build

      - name: Verify Production backfill projection
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const path = 'docs/.vitepress/generated/runtime-records.json'
          const data = JSON.parse(fs.readFileSync(path, 'utf8'))
          const record = data.records.find((item) => item.date === '2026-08-04')
          if (!record) throw new Error('Missing 2026-08-04 Runtime projection')
          if (record.tasks.production !== 'Skipped') {
            throw new Error(`Expected production=Skipped, got ${record.tasks.production}`)
          }
          if (record.tasks.publication !== 'Waiting') {
            throw new Error(`Expected publication=Waiting, got ${record.tasks.publication}`)
          }
          console.log('Runtime projection verified: Production=Skipped, Publication=Waiting')
          NODE

      - name: Build VitePress site
        run: npm run docs:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
