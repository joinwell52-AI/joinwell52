name: Research Runtime Shift Completion V2.0

on:
  workflow_dispatch:
    inputs:
      runtime_task:
        description: Running Runtime task to complete
        required: true
        type: choice
        options:
          - discovery
          - queue
          - reading
          - analysis
          - production
          - publication
          - weekly
          - academic
          - program
      runtime_date:
        description: Runtime date (YYYY-MM-DD)
        required: true
        type: string
      result_path:
        description: Repository path to runtime-shift-result/v2 JSON
        required: true
        type: string
      allow_historical:
        description: Explicit governed recovery for a prior Runtime date
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "research/runtime/completion-requests/*.json"

permissions:
  contents: write

# Completion is serialized because every completion can immediately unlock the next
# overdue stage. One durable transition must finish before another is evaluated.
concurrency:
  group: research-runtime-shift-completion-v2
  cancel-in-progress: false

jobs:
  complete:
    name: Complete, validate and persist Runtime shift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authoritative repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch latest durable facts
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Resolve completion request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TASK: ${{ inputs.runtime_task }}
          INPUT_DATE: ${{ inputs.runtime_date }}
          INPUT_RESULT: ${{ inputs.result_path }}
          INPUT_ALLOW_HISTORICAL: ${{ inputs.allow_historical }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "runtime_task=$INPUT_TASK" >> "$GITHUB_OUTPUT"
            echo "runtime_date=$INPUT_DATE" >> "$GITHUB_OUTPUT"
            echo "result_path=$INPUT_RESULT" >> "$GITHUB_OUTPUT"
            echo "allow_historical=${INPUT_ALLOW_HISTORICAL:-false}" >> "$GITHUB_OUTPUT"
            echo "request_path=workflow_dispatch" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          request_path="$(git diff --name-only "$BEFORE_SHA" "$EVENT_SHA" -- 'research/runtime/completion-requests/*.json' | tail -n 1)"
          if [[ -z "$request_path" ]]; then
            request_path="$(git show --pretty='' --name-only "$EVENT_SHA" -- 'research/runtime/completion-requests/*.json' | tail -n 1)"
          fi
          if [[ -z "$request_path" || ! -f "$request_path" ]]; then
            echo "No durable completion request found in triggering commit."
            exit 1
          fi

          REQUEST_PATH="$request_path" node <<'NODE'
          const fs = require('fs')
          const request = JSON.parse(fs.readFileSync(process.env.REQUEST_PATH, 'utf8'))
          if (request.schema !== 'runtime-shift-completion-request/v1') {
            throw new Error(`Invalid completion request schema: ${request.schema}`)
          }
          if (!/^[a-z][a-z0-9-]*$/.test(request.task || '')) throw new Error('Invalid request.task')
          if (!/^\d{4}-\d{2}-\d{2}$/.test(request.date || '')) throw new Error('Invalid request.date')
          if (!/^research\/runtime\/results\/.+\.json$/.test(request.resultPath || '')) {
            throw new Error('request.resultPath must be a Runtime result JSON path')
          }
          if (!fs.existsSync(request.resultPath)) throw new Error(`Result file does not exist: ${request.resultPath}`)
          if (request.allowHistorical !== undefined && typeof request.allowHistorical !== 'boolean') {
            throw new Error('request.allowHistorical must be boolean when present')
          }
          const output = process.env.GITHUB_OUTPUT
          fs.appendFileSync(output, `runtime_task=${request.task}\n`)
          fs.appendFileSync(output, `runtime_date=${request.date}\n`)
          fs.appendFileSync(output, `result_path=${request.resultPath}\n`)
          fs.appendFileSync(output, `allow_historical=${request.allowHistorical === true}\n`)
          fs.appendFileSync(output, `request_path=${process.env.REQUEST_PATH}\n`)
          NODE

      - name: Complete governed shift
        env:
          RUNTIME_TASK: ${{ steps.request.outputs.runtime_task }}
          RUNTIME_DATE: ${{ steps.request.outputs.runtime_date }}
          RESULT_PATH: ${{ steps.request.outputs.result_path }}
          ALLOW_HISTORICAL: ${{ steps.request.outputs.allow_historical }}
        run: node scripts/runtime-shift-complete.mjs --task "$RUNTIME_TASK" --date "$RUNTIME_DATE" --result "$RESULT_PATH" --allow-historical "${ALLOW_HISTORICAL:-false}"

      - name: Render and validate
        env:
          RUNTIME_DATE: ${{ steps.request.outputs.runtime_date }}
        run: |
          node scripts/runtime-markdown.mjs render --date "$RUNTIME_DATE"
          npm run runtime:validate
          node scripts/runtime-markdown.mjs validate --date "$RUNTIME_DATE"

      - name: Commit durable completion
        id: commit
        env:
          RUNTIME_TASK: ${{ steps.request.outputs.runtime_task }}
          RUNTIME_DATE: ${{ steps.request.outputs.runtime_date }}
          REQUEST_PATH: ${{ steps.request.outputs.request_path }}
        run: |
          git config user.name "joinwell52 Research Runtime"
          git config user.email "actions@users.noreply.github.com"
          git add research/runtime/records research/runtime/[0-9][0-9][0-9][0-9] research/runtime/results research/runtime/completion-requests research/analysis research/reading staging docs || true
          if git diff --cached --quiet; then
            echo "No completion changes to persist."
            exit 1
          fi
          git commit -m "runtime(${RUNTIME_TASK}): complete governed shift for ${RUNTIME_DATE}"
          commit_sha="$(git rev-parse HEAD)"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort || true
            if [[ "$attempt" -eq 3 ]]; then exit 1; fi
            sleep $((attempt * 5))
          done

      - name: Verify durable completion
        env:
          COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}
          RUNTIME_TASK: ${{ steps.request.outputs.runtime_task }}
          RUNTIME_DATE: ${{ steps.request.outputs.runtime_date }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$COMMIT_SHA" origin/main
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')
          const manifest = JSON.parse(fs.readFileSync('research/runtime/SCHEDULER.json','utf8'))
          const task = manifest.tasks.find(t => t.id === process.env.RUNTIME_TASK)
          if (!task) throw new Error('Unknown runtime task')
          const [y,m] = process.env.RUNTIME_DATE.split('-')
          const file = path.join(manifest.recordRoots[task.family], y, m, `${process.env.RUNTIME_DATE}-${task.family}-runtime.json`)
          const record = JSON.parse(fs.readFileSync(file,'utf8'))
          if (record.taskStatus?.[task.id] !== 'Completed') throw new Error(`Expected ${task.id}=Completed`)
          if (record.results?.[task.id]?.status !== 'Completed') throw new Error(`Missing durable Completed result for ${task.id}`)
          if (record.results?.[task.id]?.runtimeDate !== process.env.RUNTIME_DATE) throw new Error(`Completed result runtimeDate mismatch for ${task.id}`)
          console.log(`Verified ${task.id}=Completed for ${process.env.RUNTIME_DATE}. Scheduler workflow_run will immediately reconcile the next overdue stage.`)
          NODE
