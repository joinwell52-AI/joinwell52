name: Temporary Two-Wake Cover Patch

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: temporary-two-wake-cover-patch
  cancel-in-progress: false

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[two-wake-cover]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check patch script syntax
        run: node --check scripts/tmp-two-wake-cover.mjs
      - name: Apply durable two-wake cover patch
        run: node scripts/tmp-two-wake-cover.mjs
      - name: Rebuild generated Production prompt bundle
        run: npm run worker-prompts:build
      - name: Syntax-check deterministic finalizer
        run: node --check scripts/runtime-production-cover-finalize.mjs
      - name: Validate worker prompts and Runtime gates
        run: |
          npm run worker-prompts:validate
          npm run worker-control:test
          npm run runtime:terminal:test
          npm run runtime:recovery:test
          npm run publication:layout:validate
          npm run publication:editorial:validate
          npm run runtime:validate
      - name: Remove temporary patch machinery
        run: git rm .github/workflows/tmp-two-wake-cover.yml scripts/tmp-two-wake-cover.mjs
      - name: Commit durable two-wake Production architecture
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/research-production-cover-finalization.yml \
                  package.json \
                  research/runtime/SCHEDULER.json \
                  research/runtime/COVER-WORKER-INPUT-V1.json \
                  research/runtime/COVER-GENERATION-RECEIPT-V1.md \
                  research/runtime/worker-prompts/CONFIG.json \
                  research/runtime/worker-prompts/templates/production.prompt.md \
                  research/runtime/worker-prompts/isolated-cover-worker.prompt.md \
                  research/runtime/worker-prompts/generated \
                  scripts/runtime-production-cover-finalize.mjs
          git commit -m 'fix(production): finalize two-wake isolated cover architecture'
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            git fetch origin main
            git reset --hard origin/main
            sleep $((attempt * 5))
          done
          exit 1
