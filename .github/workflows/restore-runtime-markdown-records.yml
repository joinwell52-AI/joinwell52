name: Restore Runtime Markdown Records

on:
  push:
    branches:
      - restore-runtime-markdown-records

permissions:
  contents: write

jobs:
  restore-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout restoration branch
        uses: actions/checkout@v4
        with:
          ref: restore-runtime-markdown-records
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply dual-record restoration
        run: python scripts/restore-runtime-markdown-records.py

      - name: Render readable Runtime ledgers
        run: |
          node scripts/runtime-markdown.mjs render --all
          node scripts/runtime-markdown.mjs validate --all

      - name: Install dependencies
        run: npm install

      - name: Validate Runtime and build site
        run: |
          npm run runtime:validate
          npm run runtime:markdown:validate
          npm run docs:build

      - name: Verify restored contracts and links
        shell: bash
        run: |
          test -f research/runtime/2026/08/2026-08-05-runtime.md
          grep -F '## 完整事件时间线 / Complete Event Timeline' research/runtime/2026/08/2026-08-05-runtime.md
          grep -F '2026-08-05T09:00:40+08:00' research/runtime/2026/08/2026-08-05-runtime.md
          grep -F 'return `research/runtime/${year}/${month}/${item.date}-runtime.md`' docs/.vitepress/theme/components/RuntimeOperationsCenterClassic.vue
          grep -F 'node scripts/runtime-markdown.mjs render --date' .github/workflows/research-runtime-scheduler.yml
          test -f .github/workflows/runtime-markdown-sync.yml

      - name: Commit verified restoration
        shell: bash
        run: |
          git config user.name "joinwell52 Research Runtime"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/restore-runtime-markdown-records.yml scripts/restore-runtime-markdown-records.py
          git add scripts/runtime-markdown.mjs package.json package-lock.json
          git add .github/workflows/research-runtime-scheduler.yml .github/workflows/runtime-markdown-sync.yml
          git add docs/.vitepress/theme/components/RuntimeOperationsCenterClassic.vue
          git add research/runtime/README.md research/runtime/README.zh-CN.md research/runtime/2026
          git commit -m "fix(runtime): restore mandatory human-readable Runtime ledgers"
          git push origin HEAD:restore-runtime-markdown-records
