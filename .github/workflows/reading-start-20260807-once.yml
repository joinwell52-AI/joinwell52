name: Reading Start 2026-08-07 Once

on:
  push:
    branches:
      - reading-start-20260807
    paths:
      - .github/workflows/reading-start-20260807-once.yml

permissions:
  contents: write

jobs:
  persist-start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reading-start-20260807
          fetch-depth: 0
      - name: Persist and render Reading start state
        run: node scripts/automation-reading-start-20260807.mjs
      - name: Commit durable start-state tree
        shell: bash
        run: |
          rm -f .github/workflows/reading-start-20260807-once.yml scripts/automation-reading-start-20260807.mjs
          git config user.name "joinwell52 Research Runtime"
          git config user.email "actions@users.noreply.github.com"
          git add research/runtime/records/daily/2026/08/2026-08-07-daily-runtime.json research/runtime/2026/08/2026-08-07-runtime.md .github/workflows/reading-start-20260807-once.yml scripts/automation-reading-start-20260807.mjs
          git commit -m "runtime(reading): persist 2026-08-07 Running fallback"
          git push origin HEAD:reading-start-20260807
