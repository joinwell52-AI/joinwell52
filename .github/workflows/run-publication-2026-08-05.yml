name: Run Runtime V5 Publication 2026-08-05

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/run-publication-2026-08-05.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runtime-publication-2026-08-05
  cancel-in-progress: false

jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Execute governed Publication
        run: node scripts/run-publication-2026-08-05.mjs

# explicit retrigger after workflow registration
