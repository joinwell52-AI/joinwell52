name: Restore SaaW V1.1 Enhancements

on:
  push:
    paths:
      - '.github/workflows/restore-saaw-v11-enhancements.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore manifesto enhancements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          zh = root / 'docs/zh/industry/2026-08-10-saaw-software-as-an-agent-worker.md'
          en = root / 'docs/en/industry/2026-08-10-saaw-software-as-an-agent-worker.md'
          fig = root / 'docs/public/assets/covers/saaw-research-worker-loop.svg'

          zh_text = zh.read_text(encoding='utf-8')
          en_text = en.read_text(encoding='utf-8')

          day_zh = r'''

### 一个数字员工的一天：应收账款数字员工

抽象地谈“数字员工”，很容易让人想到一个更聪明的聊天机器人。真正的 SaaW 更像一个正在上班的工作主体。设想一个风险边界清晰、容易工程验证的岗位：**应收账款数字员工（Accounts Receivable Worker）**。

每天 08:30，它从正式任务队列接收“今日应收检查”任务，并首先形成任务接受事实。随后，它按照已授权的工作流登录 ERP，读取到期与逾期账户，依据企业规则筛选需要跟进的客户。对于正常逾期，它调用企业邮件 Skill 发送标准提醒，并把发送结果、账户、时间和证据写入工作记录；如果客户回复“金额有争议”或“发票信息不一致”，它不会继续催收，也不会自行决定如何处理，而是创建一个正式 Issue，将该账户从自动流程中暂停。

这个 Issue 随即进入人类控制面。主管在 PWA 中看到争议原因、相关发票、历史沟通和建议处理方式，作出正式 Decision。批准补开发票、延后付款或转人工复核后，这个决定成为新的治理事实，数字员工从暂停点继续工作，而不是重新开始整个会话。

当天结束前，它汇总所有已处理、待处理和争议账户，生成应收账龄报告（Aging Report），提交 Report；QA 或预设验证规则检查账户总额、异常项、邮件证据和未关闭 Issue。验证通过后，任务进入 Done，并最终归档。

这条链路的重点不在“AI 会不会写催款邮件”，而在于一项工作能否被持续、可恢复、可审计地完成：

**TASK → ACCEPTANCE → ACTION → REPORT → ISSUE → HUMAN DECISION → CONTINUE → REVIEW → DONE**

到了这里，SaaW 不再只是一个软件哲学概念。它开始像一个真正上班的人：领取任务、使用工具、遇到异常时停下来请示、留下工作证据，再从被批准的位置继续完成职责。
'''

          engine_zh = r'''

### 现实工程锚点：Research Report Production Engine V1.3

SaaW 不应该只靠虚构岗位证明自己。我们已经有一个更接近现实的工程锚点：**Research Report Production Engine V1.3**。

它把研究工作拆成可以被治理的连续工作对象：从 Research Question 形成 Research Object，进入 Evidence / Reading、Analysis、Report、Evidence Gate、Visualization、Human Authorization，最终到 Publication。每一步都有明确输入、输出、证据和授权边界。

![Research Report Production Engine V1.3 与 SaaW 工作结构对应关系](/assets/covers/saaw-research-worker-loop.svg)

*图 3：Research Report Production Engine V1.3 与 SaaW 的结构对应。上层是研究报告生产流程，下层是数字员工的岗位结构；两者通过证据、治理与人类授权连接。*

更有意思的是，**这篇 SaaW Manifesto 本身就是这个递归关系中的一个研究成果**。我们不是先写一篇文章宣称 SaaW 存在，再找一个虚构例子证明它；而是用已经运行的研究报告生产机来解释 SaaW，同时 SaaW Manifesto 又成为这台生产机所管理、审查和发布的一个研究对象。

> **这不是 AI 写作工具，而是一个受治理的研究型数字员工。**  
> **This is not an AI writing tool. It is a governed research worker.**
'''

          status_zh = r'''

### What exists today / What comes next

为了避免把研究方向包装成已经完成的产品能力，我们把边界明确写在这里。

**Today / 已验证：** FCoP 生命周期与文件化协作；PM / DEV / QA / OPS 四角色 Agent 协作；Report / Review / Decision；人类审批与 PWA 控制面；恢复治理；TMPA Reader、规范测试与工作事实重构；CodeFlowMu 的真实工程协作案例；Research Report Production Engine V1.3 的研究生产与发布链路。

**Next / 正在探索：** Digital Employee Package 的标准化；Agent PC 的标准化；岗位 Runtime；Legacy SOP Extraction；Meta-Dev Runtime 向 Domain Worker Runtime 的转换；以及受治理的 Self-Morphing 闭环。

这里的区分非常重要：**已经验证的，就用证据说话；尚在探索的，就保留为研究命题。** Self-Morphing 的可信度，不来自夸大，而来自它能够明确建立在已经存在的治理、恢复、工作事实与工程运行能力之上。
'''

          if '### 一个数字员工的一天：应收账款数字员工' not in zh_text:
              zh_text = zh_text.replace('\n## 9. CodeFlowMu：TMPA 从理论进入运行世界', day_zh + '\n\n---\n\n## 9. CodeFlowMu：TMPA 从理论进入运行世界', 1)
          if '### 现实工程锚点：Research Report Production Engine V1.3' not in zh_text:
              zh_text = zh_text.replace('\n## 16. Self-Morphing：当代码库开始“自己开发自己”', engine_zh + '\n\n---\n\n## 16. Self-Morphing：当代码库开始“自己开发自己”', 1)
          if '### What exists today / What comes next' not in zh_text:
              zh_text = zh_text.replace('\n## 23. 从 SaaS 到 SaaW', status_zh + '\n\n---\n\n## 23. 从 SaaS 到 SaaW', 1)

          day_en = r'''

### A Day in the Life of an Accounts Receivable Worker

It is easy to hear “digital employee” and imagine a smarter chatbot. A SaaW worker should look much more like a persistent work subject. Consider a bounded, auditable role: an **Accounts Receivable Worker**.

At 08:30 it receives the daily receivables task and records acceptance. It opens the ERP through an approved workflow, reads due and overdue accounts, and applies enterprise rules to decide which customers require follow-up. For ordinary overdue accounts it uses an approved enterprise-mail skill, sends the standard reminder, and records the account, time, action, and evidence. If a customer disputes the amount or invoice, the worker does not keep escalating and does not invent a resolution. It creates a formal Issue and pauses automation for that account.

The Issue appears in the human control plane. A supervisor sees the dispute, invoice evidence, communication history, and proposed options, then makes a formal Decision. Once an option is authorized, that decision becomes a governance fact and the worker continues from the paused point rather than reconstructing the work from conversation memory.

Before the day closes, the worker produces an Aging Report covering processed, pending, and disputed accounts. QA or validation rules check totals, exceptions, mail evidence, and unresolved Issues. When the evidence passes, the task can move to Done and later Archive.

The important chain is not “AI can write a collection email.” It is whether work can be completed continuously, recoverably, and audibly:

**TASK → ACCEPTANCE → ACTION → REPORT → ISSUE → HUMAN DECISION → CONTINUE → REVIEW → DONE**
'''

          engine_en = r'''

### A Real Engineering Anchor: Research Report Production Engine V1.3

SaaW should not depend on invented job stories. A real engineering anchor already exists in the **Research Report Production Engine V1.3**.

Its work path is explicit: Research Question → Research Object → Evidence / Reading → Analysis → Report → Evidence Gate → Visualization → Human Authorization → Publication. Each stage has inputs, outputs, evidence, and authority boundaries.

![Research Report Production Engine V1.3 mapped to the SaaW worker model](/assets/covers/saaw-research-worker-loop.svg)

*Figure 3. The research-production workflow mapped to the SaaW worker structure. Evidence, governance, and human authority connect work execution to an accountable outcome.*

The recursive part matters: **this SaaW Manifesto is itself one of the research outputs managed and published through that production system**. We are not writing a manifesto first and then inventing a case to justify it. We use an operating research-production engine to explain SaaW, while the manifesto itself becomes an object governed by that engine.

> **This is not an AI writing tool. It is a governed research worker.**
'''

          status_en = r'''

### What Exists Today / What Comes Next

The boundary must remain explicit.

**Today / validated:** FCoP lifecycle and file-driven coordination; four-role PM / DEV / QA / OPS agent collaboration; Report / Review / Decision; human approval and PWA control plane; recovery governance; TMPA Reader, specification tests, and reconstruction of work facts; real CodeFlowMu engineering cases; and the Research Report Production Engine V1.3 research-to-publication workflow.

**Next / under exploration:** standardized Digital Employee Packages; standardized Agent PC; role-specific runtimes; Legacy SOP Extraction; Meta-Dev Runtime → Domain Worker Runtime transformation; and governed Self-Morphing.

The distinction is deliberate: validated capabilities should be stated with evidence; research frontiers should remain research frontiers. That makes Self-Morphing more credible, not less, because it is grounded in governance, recovery, persistent work facts, and runtime capabilities that already exist.
'''

          if '### A Day in the Life of an Accounts Receivable Worker' not in en_text:
              for marker in ['\n## 9. CodeFlowMu:', '\n## 9. CodeFlowMu —']:
                  if marker in en_text:
                      en_text = en_text.replace(marker, day_en + '\n\n---\n' + marker, 1)
                      break
          if '### A Real Engineering Anchor: Research Report Production Engine V1.3' not in en_text:
              for marker in ['\n## 16. Self-Morphing:', '\n## 16. Self-Morphing —']:
                  if marker in en_text:
                      en_text = en_text.replace(marker, engine_en + '\n\n---\n' + marker, 1)
                      break
          if '### What Exists Today / What Comes Next' not in en_text:
              for marker in ['\n## 23. From SaaS to SaaW', '\n## 23. From SaaS to SaaW:']:
                  if marker in en_text:
                      en_text = en_text.replace(marker, status_en + '\n\n---\n' + marker, 1)
                      break

          zh.write_text(zh_text, encoding='utf-8')
          en.write_text(en_text, encoding='utf-8')

          fig.write_text(r'''<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="t d">
<title id="t">Research Report Production Engine V1.3 mapped to SaaW</title>
<desc id="d">Two aligned flows: research report production above and SaaW worker structure below, connected by evidence, governance and human authority.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101d"/><stop offset="1" stop-color="#11182c"/></linearGradient><linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#59d8ff"/><stop offset="1" stop-color="#a889ff"/></linearGradient></defs>
<rect width="1500" height="900" rx="36" fill="url(#bg)"/>
<g font-family="Inter,Noto Sans SC,Microsoft YaHei,Arial,sans-serif">
<text x="90" y="85" fill="#fff" font-size="42" font-weight="800">Research Report Production Engine V1.3 × SaaW</text>
<text x="90" y="130" fill="#9fb0cc" font-size="24">真实研究生产流程，对应一个受治理数字员工的工作结构</text>

<text x="90" y="205" fill="#62d8ff" font-size="24" font-weight="700">RESEARCH PRODUCTION</text>
<g fill="#142941" stroke="#62d8ff" stroke-width="2"><rect x="90" y="235" width="140" height="88" rx="18"/><rect x="250" y="235" width="140" height="88" rx="18"/><rect x="410" y="235" width="150" height="88" rx="18"/><rect x="580" y="235" width="135" height="88" rx="18"/><rect x="735" y="235" width="145" height="88" rx="18"/><rect x="900" y="235" width="150" height="88" rx="18"/><rect x="1070" y="235" width="145" height="88" rx="18"/><rect x="1235" y="235" width="175" height="88" rx="18"/></g>
<g fill="#fff" font-size="20" text-anchor="middle"><text x="160" y="271"><tspan x="160" dy="0">Research</tspan><tspan x="160" dy="26">Question</tspan></text><text x="320" y="271"><tspan x="320">Research</tspan><tspan x="320" dy="26">Object</tspan></text><text x="485" y="271"><tspan x="485">Evidence</tspan><tspan x="485" dy="26">/ Reading</tspan></text><text x="647" y="287">Analysis</text><text x="807" y="287">Report</text><text x="975" y="271"><tspan x="975">Evidence</tspan><tspan x="975" dy="26">Gate</tspan></text><text x="1142" y="287">Visualization</text><text x="1322" y="271"><tspan x="1322">Human Authorization</tspan><tspan x="1322" dy="26">→ Publication</tspan></text></g>
<g stroke="url(#a)" stroke-width="4"><path d="M230 279h20"/><path d="M390 279h20"/><path d="M560 279h20"/><path d="M715 279h20"/><path d="M880 279h20"/><path d="M1050 279h20"/><path d="M1215 279h20"/></g>

<path d="M750 355v95" stroke="url(#a)" stroke-width="5"/><polygon points="750,468 737,445 763,445" fill="#86b7ff"/>
<text x="785" y="400" fill="#c8d4e8" font-size="22">Evidence · Governance · Human Authority</text>

<text x="90" y="530" fill="#a889ff" font-size="24" font-weight="700">SaaW WORKER STRUCTURE</text>
