name: Polish SaaW Manifesto Body

on:
  push:
    branches:
      - saaw-body-polish-final
    paths:
      - scripts/restore_saaw_v11_enhancements.py

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: saaw-body-polish-final
          fetch-depth: 0

      - name: Complete and polish bilingual manifesto body
        run: python3 scripts/restore_saaw_v11_enhancements.py

      - name: Commit polished article body
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "joinwell52 Research Runtime"
          git config user.email "actions@users.noreply.github.com"
          git add docs/zh/industry/2026-08-10-saaw-software-as-an-agent-worker.md \
                  docs/en/industry/2026-08-10-saaw-software-as-an-agent-worker.md
          if git diff --cached --quiet; then
            echo "No article changes to commit."
            exit 0
          fi
          git commit -m "polish SaaW manifesto V1.1 body and boundaries"
          git push origin HEAD:saaw-body-polish-final
