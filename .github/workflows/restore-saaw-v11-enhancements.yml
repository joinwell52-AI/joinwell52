<g fill="#1b2039" stroke="#9a91ff" stroke-width="2"><rect x="410" y="560" width="140" height="88" rx="18"/><rect x="570" y="560" width="145" height="88" rx="18"/><rect x="735" y="560" width="145" height="88" rx="18"/><rect x="900" y="560" width="145" height="88" rx="18"/><rect x="1065" y="560" width="155" height="88" rx="18"/><rect x="1240" y="560" width="170" height="88" rx="18"/></g>
<g fill="#fff" font-size="21" text-anchor="middle"><text x="160" y="612">Role</text><text x="320" y="612">Workflow</text><text x="480" y="612">Skills</text><text x="642" y="600"><tspan x="642">Work</tspan><tspan x="642" dy="26">State</tspan></text><text x="807" y="612">Evidence</text><text x="972" y="612">Governance</text><text x="1142" y="600"><tspan x="1142">Human</tspan><tspan x="1142" dy="26">Authority</tspan></text><text x="1325" y="600"><tspan x="1325">Work</tspan><tspan x="1325" dy="26">Outcome</tspan></text></g>
<g stroke="url(#a)" stroke-width="4"><path d="M230 604h20"/><path d="M390 604h20"/><path d="M550 604h20"/><path d="M715 604h20"/><path d="M880 604h20"/><path d="M1045 604h20"/><path d="M1220 604h20"/></g>

<rect x="215" y="725" width="1070" height="100" rx="24" fill="#101b31" stroke="#62d8ff" stroke-width="2"/>
<text x="750" y="768" fill="#fff" font-size="28" font-weight="800" text-anchor="middle">这不是 AI 写作工具，而是一个受治理的研究型数字员工。</text>
<text x="750" y="804" fill="#9fc9e8" font-size="22" text-anchor="middle">This is not an AI writing tool. It is a governed research worker.</text>
</g></svg>''', encoding='utf-8')
          PY

      - name: Commit restored enhancements
        shell: bash
        run: |
          git config user.name "joinwell52 Research Runtime"
          git config user.email "actions@users.noreply.github.com"
          git add docs/zh/industry/2026-08-10-saaw-software-as-an-agent-worker.md \
                  docs/en/industry/2026-08-10-saaw-software-as-an-agent-worker.md \
                  docs/public/assets/covers/saaw-research-worker-loop.svg
          git diff --cached --quiet && exit 0
          git commit -m "restore SaaW V1.1 worker case and evidence boundary"
          git push origin HEAD:main
