name: Finalize Reading Verify 2026-08-08 Once

on:
  push:
    branches:
      - runtime-reading-verify-20260808
    paths:
      - .github/workflows/finalize-reading-verify-20260808-once.yml

permissions:
  contents: write

jobs:
  finalize-ledger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
        with:
          ref: runtime-reading-verify-20260808
          fetch-depth: 0

      - name: Restore detailed result projection and apply verified state
        shell: bash
        run: |
          set -euo pipefail
          ledger="research/runtime/2026/08/2026-08-08-runtime.md"
          result_commit="fb3e3b069651e82bcd044fc1561b6e90dc8e849b"
          git show "${result_commit}:${ledger}" > "$ledger"
          python - <<'PY'
          from pathlib import Path
          p = Path('research/runtime/2026/08/2026-08-08-runtime.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('github_commit: "pending"', 'github_commit: "fb3e3b069651e82bcd044fc1561b6e90dc8e849b"', 1)
          s = s.replace('commit_verify: "Running"', 'commit_verify: "Completed"', 1)
          s = s.replace('updated_at: "2026-08-08T11:25:30+08:00"', 'updated_at: "2026-08-08T11:31:30+08:00"', 1)
          s = s.replace('- **GitHub Commit:** pending', '- **GitHub Commit:** fb3e3b069651e82bcd044fc1561b6e90dc8e849b', 1)
          s = s.replace('- **Commit Verify:** 工作中 / Running', '- **Commit Verify:** 已完成 / Completed', 1)
          s = s.replace('- **最后更新 / Updated:** 2026-08-08T11:25:30+08:00', '- **最后更新 / Updated:** 2026-08-08T11:31:30+08:00', 1)
          anchor = '| 2026-08-08T11:25:30+08:00 | 研究运行阅读 / Research Runtime Reading | daily | Reading Completed | 已完成 / Completed | Skill 03 Deep Reading completed for all three same-day Selected objects after verified fallback start commit 959e14a2cae8279bb21d31b6b815440a0b977b75; three durable source-traceable Reading Records were produced. No Research Analysis, architecture recommendation or article drafting was performed. |'
          verify = '| 2026-08-08T11:31:30+08:00 | 研究运行阅读 / Research Runtime Reading | daily | GitHub Commit Verified | 已完成 / Completed | Fetched and verified Reading result commit fb3e3b069651e82bcd044fc1561b6e90dc8e849b: all three Reading Records, the Reading runtime-shift-result/v2 object, Daily Runtime JSON and synchronized detailed Markdown ledger are present; exactly one current-day Reading Execution Slot Opened / Running event remains. No Research Analysis or article drafting was performed. |'
          if verify not in s:
              if anchor not in s:
                  raise SystemExit('Reading Completed timeline anchor missing')
              s = s.replace(anchor, anchor + '\n' + verify, 1)
          p.write_text(s, encoding='utf-8')
          PY
          grep -q '^github_commit: "fb3e3b069651e82bcd044fc1561b6e90dc8e849b"$' "$ledger"
          grep -q '^commit_verify: "Completed"$' "$ledger"
          grep -q '2026-08-08T11:31:30+08:00.*GitHub Commit Verified' "$ledger"
          grep -q '### Work Result' "$ledger"
          grep -q 'Q-20260808-03' "$ledger"

      - name: Commit branch-only finalized ledger and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-reading-verify-20260808-once.yml
          git config user.name "joinwell52 Research Runtime"
          git config user.email "actions@users.noreply.github.com"
          git add research/runtime/2026/08/2026-08-08-runtime.md .github/workflows/finalize-reading-verify-20260808-once.yml
          git commit -m "runtime(reading): finalize verified 2026-08-08 ledger"
          git push origin HEAD:runtime-reading-verify-20260808
