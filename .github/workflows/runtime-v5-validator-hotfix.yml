name: Runtime V5 Validator Hotfix

on:
  push:
    paths:
      - '.github/workflows/runtime-v5-validator-hotfix.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch Runtime V5 validator compatibility
        run: node scripts/runtime-v5-hotfix.mjs
      - name: Validate repaired Runtime V5 contract
        run: node scripts/runtime-v5.mjs validate
      - name: Commit validator hotfix and remove one-time repair files
        shell: bash
        run: |
          git config user.name "joinwell52 Runtime Hotfix"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/runtime-v5-validator-hotfix.yml scripts/runtime-v5-hotfix.mjs
          git add scripts/runtime-v5.mjs .github/workflows/runtime-v5-validator-hotfix.yml scripts/runtime-v5-hotfix.mjs
          git commit -m "fix(runtime): accept established V5 shift result shapes"
          git pull --rebase origin main
          git push origin HEAD:main
# retrigger evidence-compatible hotfix
