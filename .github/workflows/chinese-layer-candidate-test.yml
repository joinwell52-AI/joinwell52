name: Chinese Layer Candidate Test

on:
  push:
    branches:
      - chinese-layer-0.5.3-candidate
    paths:
      - "docs/public/chinese-layer/**"
      - "scripts/chinese-layer-smoke.mjs"
      - ".github/workflows/chinese-layer-candidate-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Chinese Layer Candidate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check candidate patch
        run: node --check docs/public/chinese-layer/dev-live-refresh-0.5.2.js
      - name: Run real DEV/CORS smoke test
        run: node scripts/chinese-layer-smoke.mjs
