name: Sync SaaW English from Chinese Mother

on:
  push:
    branches: [saaw-en-sync-from-zh]
    paths:
      - '.github/workflows/sync-saaw-en-from-zh.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: saaw-en-sync-from-zh
          fetch-depth: 0

      - name: Synchronize English article
        run: python3 scripts/sync_saaw_en_from_zh_mother.py

      - name: Verify mother-edition invariants
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('docs/en/industry/2026-08-10-saaw-software-as-an-agent-worker.md')
          s = p.read_text(encoding='utf-8')
          sections = re.findall(r'^##\s+(\d+)\.', s, flags=re.M)
          assert sections == [str(i) for i in range(1, 24)], sections
          assert '09:00 · Research Discovery' in s
          assert '10:00 · Research Queue' in s
          assert '11:00 · Research Reading' in s
          assert '13:00 · Research Analysis' in s
          assert '15:00 · Research Production' in s
          assert '20:00 · Formal Publication' in s
          assert s.count('> **Author / Publisher:**') == 1
          assert s.index('> **Author / Publisher:**') > s.index('## 23. From SaaS to SaaW')
          assert '/assets/covers/saaw-governance-stack.svg' in s
          assert '/assets/covers/saaw-self-morphing-loop.svg' in s
          assert '### Validated (Today)' in s and '### Under Exploration (Next)' in s
          print('English mother-edition structural synchronization verified.')
          PY

      - name: Build VitePress site
        run: |
          npm ci
          npm run docs:build

      - name: Commit synchronized English article only
        shell: bash
        run: |
          rm -f scripts/sync_saaw_en_from_zh_mother.py .github/workflows/sync-saaw-en-from-zh.yml
          git config user.name 'joinwell52 Research Runtime'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'docs: synchronize SaaW English with Chinese mother edition'
          git push origin HEAD:saaw-en-sync-from-zh
