name: Apply Runtime Schedule Window Refresh

on:
  push:
    branches:
      - fix-runtime-schedule-window-refresh

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix-runtime-schedule-window-refresh
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply patch
        run: python scripts/apply-runtime-schedule-window-refresh.py

      - name: Install dependencies
        run: npm install

      - name: Validate and build
        run: |
          npm run runtime:validate
          npm run docs:build

      - name: Commit verified change
        shell: bash
        run: |
          git config user.name "joinwell52 Research Runtime"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-runtime-schedule-window-refresh.yml
          git rm scripts/apply-runtime-schedule-window-refresh.py
          git add docs/.vitepress/theme/components/RuntimeOperationsCenterClassic.vue
          git commit -m "fix(runtime): refresh around scheduled shift windows"
          git push origin HEAD:fix-runtime-schedule-window-refresh
