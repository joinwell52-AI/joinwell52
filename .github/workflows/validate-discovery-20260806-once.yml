name: Validate Discovery 2026-08-06 Once

on:
  push:
    branches:
      - runtime/discovery-20260806-result
    paths:
      - .github/workflows/validate-discovery-20260806-once.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout result branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate and validate synchronized Runtime ledger
        shell: bash
        run: |
          set -euo pipefail
          node scripts/runtime-markdown.mjs render --date 2026-08-06
          node scripts/runtime-markdown.mjs validate --date 2026-08-06
          node -e "const fs=require('fs'); const p='research/runtime/records/daily/2026/08/2026-08-06-daily-runtime.json'; const x=JSON.parse(fs.readFileSync(p,'utf8')); if(x.status!=='Waiting'||x.taskStatus.discovery!=='Completed'||x.timeline.filter(e=>e.event==='Execution Slot Opened'&&e.status==='Running').length!==1||x.results.discovery.schema!=='runtime-shift-result/v2') process.exit(1);"
          node -e "const fs=require('fs'); const p='research/intelligence/runs/2026/08/2026-08-06-intelligence.json'; const x=JSON.parse(fs.readFileSync(p,'utf8')); if(x.status!=='Completed'||x.signals.length!==10||x.pipelines.length!==3||x.columns.some(c=>c.selectedItemId!==null)) process.exit(1);"
          git diff --check

      - name: Commit authoritative generated ledger and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/validate-discovery-20260806-once.yml
          git config user.name "joinwell52 Research Runtime"
          git config user.email "actions@users.noreply.github.com"
          git add research/runtime/2026/08/2026-08-06-runtime.md .github/workflows/validate-discovery-20260806-once.yml
          git commit -m "runtime(discovery): validate synchronized 2026-08-06 artifacts"
          git push origin "HEAD:$GITHUB_REF_NAME"
