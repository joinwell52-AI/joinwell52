name: Restore Runtime Layout

on:
  push:
    branches:
      - restore-runtime-layout

permissions:
  contents: write

jobs:
  restore-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: restore-runtime-layout
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore stable Runtime component
        run: |
          git show 62802891303a6f41e6d234fcfc0bd3f3d97b1338:docs/.vitepress/theme/components/RuntimeOperationsCenterClassic.vue > docs/.vitepress/theme/components/RuntimeOperationsCenterClassic.vue

      - name: Install dependencies
        run: npm install

      - name: Validate and build
        run: |
          npm run runtime:validate
          npm run docs:build

      - name: Commit restored layout
        run: |
          git config user.name "joinwell52 Research Runtime"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/restore-runtime-layout.yml
          git add docs/.vitepress/theme/components/RuntimeOperationsCenterClassic.vue
          git commit -m "fix(runtime): restore stable operations-center layout"
          git push origin HEAD:restore-runtime-layout
