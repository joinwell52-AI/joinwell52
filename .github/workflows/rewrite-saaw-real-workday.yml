name: Rewrite SaaW Real Workday Example

on:
  push:
    branches: [saaw-real-workday-example]
    paths:
      - '.github/workflows/rewrite-saaw-real-workday.yml'

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: saaw-real-workday-example
          fetch-depth: 0

      - name: Rewrite workday example
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          zh = Path('docs/zh/industry/2026-08-10-saaw-software-as-an-agent-worker.md')
          en = Path('docs/en/industry/2026-08-10-saaw-software-as-an-agent-worker.md')

          z = zh.read_text(encoding='utf-8')
          e = en.read_text(encoding='utf-8')

          z_start = z.index('### 一个数字员工的一天：Research Report Production Engine V1.3')
          z_end = z.index('\n\n---\n\n## 9. CodeFlowMu：TMPA 从理论进入运行世界', z_start)
          z_new = '''### 一个数字员工的一天：Research Report Production Engine V1.3

不用再想象一个虚构的数字员工。我们每天运行的 **Research Report Production Engine V1.3**，本身就是一个可以观察的研究型数字员工。

**09:00 · 研究发现（Discovery）**  
扫描当天值得研究的信号、工程变化与研究问题，形成 **Signal Pool**。这相当于一个研究员工早上先看“今天有什么值得做”。

**10:00 · 研究队列（Queue）**  
从候选信号中确定当天真正要推进的研究对象，形成 **Today's Research Plan**。不是所有发现都会立刻写成文章，系统先决定“今天具体做哪一件”。

**11:00 · 研究阅读（Reading）**  
围绕已选研究对象读取来源、证据和已有材料，形成 **Reading Result**。证据不足就留下缺口，不用流畅文字把未知内容补出来。

**13:00 · 研究分析（Analysis）**  
把阅读结果整理成可验证的判断、争议点、边界条件和研究对象，形成 **Research Object**。到这里，系统已经知道“这件事到底说明了什么”。

**15:00 · 研究生产（Production）**  
将研究对象转化为正式报告或文章候选，完成结构、证据检查和必要的可视化，形成 **Publication Candidate**。这一步不是“让 AI 随便写一篇”，而是把前面的研究事实加工成可审核的工作成果。

**20:00 · 正式发布（Publication）**  
只有完整候选满足发布条件后，才进入最终发布：写入 GitHub、生成网站页面、完成 Commit Verify 与 Release；如果存在需要人承担责任的事项，就停在人类授权边界等待决定，而不是自行越权发布。

一天结束后留下的不是一段聊天记录，而是一整套可以继续追踪和恢复的工作事实：

```text
09:00 Discovery → Signal Pool
10:00 Queue → Today's Research Plan
11:00 Reading → Reading Result
13:00 Analysis → Research Object
15:00 Production → Publication Candidate
20:00 Publication → GitHub + Website + Commit Verify + Release
```

这就是 SaaW 最直观的样子：**软件不是在回答一个问题，而是在按岗位和班次持续完成工作。**
'''
          z = z[:z_start] + z_new + z[z_end:]

          e_start = e.index('### A Day in the Life of Research Report Production Engine V1.3')
          e_end = e.index('\n\n---\n\n## 9. CodeFlowMu:', e_start)
          e_new = '''### A Day in the Life of Research Report Production Engine V1.3

There is no need to invent a fictional digital employee. The **Research Report Production Engine V1.3** already operates as an observable research worker.

**09:00 · Discovery**  
It scans the day's research signals, engineering changes, and questions, producing a **Signal Pool** — the equivalent of a research worker first deciding what deserves attention.

**10:00 · Queue**  
It selects the research object that should actually move forward that day and produces **Today's Research Plan**. Not every signal becomes an article; the system first decides what work is being accepted.

**11:00 · Reading**  
It reads sources, evidence, and existing material for the selected object and produces a **Reading Result**. Missing evidence remains a visible gap rather than being hidden by fluent prose.

**13:00 · Analysis**  
It turns the reading result into testable claims, disagreements, boundary conditions, and a structured **Research Object**. At this point the system knows what the evidence actually supports.

**15:00 · Production**  
It turns that research object into a formal report or article candidate, completes evidence checks and required visualization, and produces a **Publication Candidate**. This is not "AI writes something"; it is governed transformation of research facts into a reviewable work product.

**20:00 · Publication**  
Only a complete candidate that satisfies publication conditions moves forward: GitHub write, website projection, Commit Verify, and Release. If human authority is required, the workflow stops at that authority boundary instead of publishing autonomously.

The day leaves behind a chain of durable work facts rather than a chat transcript:

```text
09:00 Discovery → Signal Pool
10:00 Queue → Today's Research Plan
11:00 Reading → Reading Result
13:00 Analysis → Research Object
15:00 Production → Publication Candidate
20:00 Publication → GitHub + Website + Commit Verify + Release
```

That is SaaW in concrete form: **software is not merely answering a question; it is continuously performing a job on a governed schedule.**
'''
          e = e[:e_start] + e_new + e[e_end:]

          zh.write_text(z, encoding='utf-8')
          en.write_text(e, encoding='utf-8')
          PY

          rm .github/workflows/rewrite-saaw-real-workday.yml
          git config user.name 'joinwell52 Research Runtime'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'docs: make SaaW workday a real runtime timeline'
          git push origin HEAD:saaw-real-workday-example
