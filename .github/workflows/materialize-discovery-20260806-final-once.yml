name: Materialize Discovery 2026-08-06 Final Once

on:
  push:
    branches:
      - runtime/discovery-20260806-final
    paths:
      - .github/workflows/materialize-discovery-20260806-final-once.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fresh main-based branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy authoritative Discovery machine artifacts
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin runtime/discovery-20260806-result
          mkdir -p research/intelligence/runs/2026/08 research/runtime/records/daily/2026/08
          git show origin/runtime/discovery-20260806-result:research/intelligence/runs/2026/08/2026-08-06-intelligence.json > research/intelligence/runs/2026/08/2026-08-06-intelligence.json
          git show origin/runtime/discovery-20260806-result:research/runtime/records/daily/2026/08/2026-08-06-daily-runtime.json > research/runtime/records/daily/2026/08/2026-08-06-daily-runtime.json

      - name: Regenerate and validate Runtime ledger
        shell: bash
        run: |
          set -euo pipefail
          node scripts/runtime-markdown.mjs render --date 2026-08-06
          node scripts/runtime-markdown.mjs validate --date 2026-08-06
          node -e "const fs=require('fs');const p='research/runtime/records/daily/2026/08/2026-08-06-daily-runtime.json';const x=JSON.parse(fs.readFileSync(p,'utf8'));if(x.status!=='Waiting'||x.taskStatus.discovery!=='Completed'||x.timeline.filter(e=>e.event==='Execution Slot Opened'&&e.status==='Running').length!==1||x.results.discovery.schema!=='runtime-shift-result/v2'||x.results.discovery.metrics.find(m=>m.label==='Topics selected').value!=='0')process.exit(1);"
          node -e "const fs=require('fs');const p='research/intelligence/runs/2026/08/2026-08-06-intelligence.json';const x=JSON.parse(fs.readFileSync(p,'utf8'));if(x.status!=='Completed'||x.signals.length!==10||x.pipelines.length!==3||x.columns.some(c=>c.selectedItemId!==null))process.exit(1);"
          git diff --check

      - name: Commit synchronized final result and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/materialize-discovery-20260806-final-once.yml
          git config user.name "joinwell52 Research Runtime"
          git config user.email "actions@users.noreply.github.com"
          git add research/intelligence/runs/2026/08/2026-08-06-intelligence.json \
            research/runtime/records/daily/2026/08/2026-08-06-daily-runtime.json \
            research/runtime/2026/08/2026-08-06-runtime.md \
            .github/workflows/materialize-discovery-20260806-final-once.yml
          git commit -m "runtime(discovery): materialize verified 2026-08-06 result"
          git push origin "HEAD:$GITHUB_REF_NAME"
