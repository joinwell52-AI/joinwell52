          # Research Object — Lifecycle-Revalidated Managed Policy Plane

          ## Governed scope

          This object performs Skill 04 using only the three completed same-day Reading Results, with `Q-20260808-02` as the primary Industry Architecture input. It does not inspect unread Codex material, write publication copy or authorize release.

          ## Analysis

          ```yaml
          analysis:
            observations:
              - The primary Reading Result shows managed model requirements merged by union across policy layers, normalized to exact model identity and exposed through a requirements-read API.
              - Protected-model policy shapes unsafe startup state into constrained approval/reviewer/sandbox settings, while later attempts to relax those settings are rejected.
              - Resume, fork and model-change paths re-evaluate current managed requirements, preventing persisted historical settings from becoming a permanent policy bypass.
              - MCP reviewer routing gives the protected-model requirement precedence over connector-local reviewer choice, extending central policy across a separate integration path.
              - The implementation contains an intentional trusted in-memory Guardian reviewer exception and does not demonstrate instantaneous asynchronous revocation of continuously active sessions.
            cross_comparison:
              - Compared with session-budget governance, both mechanisms make central authority causal at an admission boundary: one governs economic work admission, the other governs reviewer and permission admission.
              - Compared with the gRPC host protocol, the policy plane supplies authority semantics that the transport contract itself does not define; versioned RPC lifecycle alone is not an authorization system.
              - Startup coercion versus runtime rejection reveals two policy-enforcement modes that should be separately observable because both can satisfy the same invariant while producing different operator evidence.
              - Resume/fork revalidation resembles schema or policy migration at lifecycle boundaries: durable historical state remains, but current authority is re-applied before the state can execute again.
            discussion:
              - The structurally important feature is not automatic review by itself. It is a managed constraint compiler that converts distributed policy into runtime invariants and rechecks those invariants at lifecycle boundaries.
              - Enterprise control planes need explicit precedence. Central requirements must outrank local connector or client preferences when the managed policy is intended to be non-bypassable.
              - Revalidation on resume, fork, model change and settings mutation is a practical compromise between immutable historical state and current governance. Without it, persistence becomes a policy-escape mechanism.
              - Policy shaping and policy rejection should produce different audit evidence. Silent normalization at startup can hide that a client requested Full Access, even though the resulting state is safe.
              - A trusted reviewer exception can be legitimate only when its creation path is itself a stronger trust boundary with inspectable provenance; otherwise it becomes the highest-value bypass target.
            research_judgment:
              - An enterprise agent control plane should compile managed policy into enforceable runtime invariants and revalidate them at every lifecycle transition that can reactivate or materially change execution authority.
              - Central policy precedence must be explicit across client settings, connector-local configuration and persisted historical state; local configuration must not silently win conflict resolution.
              - Coercion, rejection and trusted bypass are distinct governance outcomes and should each emit auditable provenance rather than collapsing into one final configuration snapshot.
              - Model-driven automatic review can be an authority-routing mechanism, but the presence of that mechanism is not evidence that review decisions are semantically correct; reviewer quality requires separate evaluation.
            uncertainty:
              - Confidence is high that lifecycle revalidation closes several persistence-based policy escape paths because the completed Reading Result documents tests for resume, fork, model change and unsafe overrides.
              - Confidence is medium that the same pattern generalizes to all enterprise agent runtimes because third-party wrappers and external integration paths are outside the changed Codex evidence boundary.
              - Confidence is low about live revocation latency, Guardian reviewer trust unforgeability and automatic-review decision quality because those properties are not established by the Reading Result.
            counter_evidence:
              - Continuously active sessions are not shown to receive instantaneous policy mutation when administrators change requirements.
              - The trusted Guardian reviewer intentionally bypasses ordinary protected-session validation, so the system is not exception-free.
              - Automatic review is still model-driven and the Reading Result provides no false-approval or false-denial evaluation.
              - Model matching supports a constrained alias shape and may not directly generalize to environments with different model identity conventions.
            engineering_impact:
              tmpa:
                - Use the case as evidence for policy precedence, revalidation and auditable exception semantics; no TMPA protocol change is justified from one implementation.
              digital_employee:
                - Separate job policy, role policy and local execution preference, with deterministic precedence and an effective-policy projection visible to operators.
                - Revalidate permissions, reviewer requirements and capability boundaries whenever a WorkOrder resumes, forks, changes model/runtime or materially changes settings.
                - Record whether a safe state resulted from original compliance, policy coercion or rejected mutation so governance history remains explainable.
              codeflowmu:
                - Treat PM/QA/ADMIN authority and runtime capability policy as explicit constraints that are reapplied at resume/recovery boundaries rather than trusted from stale session state.
                - Make connector/tool-local settings subordinate to centrally managed task or organizational policy when conflict rules require it.
                - Preserve trusted bypasses only with narrow creation paths and explicit evidence; avoid introducing protocol-level exceptions into FCoP unless repeated Runtime pressure demonstrates need.
            limitations:
              - The analysis is based on merged implementation and tests, not production telemetry or an external security audit.
              - The evidence does not cover every third-party wrapper or integration path around Codex.
              - Live asynchronous revocation of already-running sessions is not demonstrated.
              - Automatic-review semantic accuracy is outside the evidence boundary.
            future_questions:
              - Which lifecycle transitions in CodeFlowMu must force policy revalidation before an Agent can regain execution authority?
              - How should policy provenance show which layer contributed each effective constraint when several layers are unioned?
              - What emergency override can remain governable without turning into a permanent bypass path?
              - How should reviewer-quality evaluation be separated from reviewer-routing policy in enterprise assurance reports?
          ```

          ## Research judgment

          Treat enterprise agent governance as a lifecycle-revalidated managed policy plane: compile policy into runtime invariants, reapply it whenever durable state regains execution authority, make precedence explicit, and audit coercion, rejection and trusted bypass separately.

          ## Production input

          Production may consume this object only if it preserves the distinction between policy enforcement and reviewer correctness, plus the unresolved live-revocation and trusted-Guardian boundaries.

          ## Evidence boundary

          - `research/reading/Q-20260808-01-session-budget-governance.md`
          - `research/reading/Q-20260808-02-managed-model-auto-review.md`
          - `research/reading/Q-20260808-03-code-mode-grpc-host-protocol.md`

