              {label:'Scheduler V3',label_zh:'V3 调度器',source:'research/runtime/SCHEDULER.json'},
              {label:'Skill 04 Research Analysis',label_zh:'Skill 04 研究分析',source:'research/skills/04-research-analysis.md'},
              {label:'Digital Employee Reading Result',label_zh:'数字员工 Reading Result',source:'research/reading/Q-20260808-01-session-budget-governance.md'},
              {label:'Industry Architecture Reading Result',label_zh:'行业架构 Reading Result',source:'research/reading/Q-20260808-02-managed-model-auto-review.md'},
              {label:'Open-source Engineering Reading Result',label_zh:'开源工程 Reading Result',source:'research/reading/Q-20260808-03-code-mode-grpc-host-protocol.md'},
              {label:'Verified Analysis start commit',label_zh:'已核验 Analysis 启动提交',source:`https://github.com/joinwell52-AI/joinwell52/commit/${process.env.START_COMMIT}`}
            ],
            artifacts:[
              {label:'Digital Employee Research Object',label_zh:'数字员工 Research Object',path:'research/analysis/Q-20260808-01-pause-preserving-budget-admission.md'},
              {label:'Industry Architecture Research Object',label_zh:'行业架构 Research Object',path:'research/analysis/Q-20260808-02-lifecycle-revalidated-managed-policy-plane.md'},
              {label:'Open-source Engineering Research Object',label_zh:'开源工程 Research Object',path:'research/analysis/Q-20260808-03-correlated-multistream-agent-host-contract.md'},
              {label:'Daily Runtime JSON',label_zh:'每日 Runtime JSON',path:recordPath},
              {label:'Human-readable Runtime ledger',label_zh:'人类可读 Runtime 账本',path:ledgerPath}
            ]
          }
          r.timeline.push({time:completedAt,task:'analysis',event:'Analysis Completed',status:'Completed',detail:`Skill 04 consumed only three completed same-day Reading Results after verified scheduler-fallback start commit ${process.env.START_COMMIT}; three durable Research Objects were produced with comparison, causal/architectural judgment, uncertainty and counter-evidence. No publication copy or release work was performed.`})
          r.githubCommit='pending'; r.commitVerify='Waiting'; r.updatedAt=completedAt
          fs.writeFileSync(recordPath,JSON.stringify(r,null,2)+'\n')

          let md=fs.readFileSync(ledgerPath,'utf8')
          md=md.replace(/^overall_status: .*$/m,'overall_status: "Waiting"')
          md=md.replace(/^github_commit: .*$/m,'github_commit: "pending"')
          md=md.replace(/^commit_verify: .*$/m,'commit_verify: "Waiting"')
          md=md.replace(/^updated_at: .*$/m,`updated_at: "${completedAt}"`)
          md=md.replace(/^- \*\*全天状态 \/ Overall Status:\*\* .*$/m,'- **全天状态 / Overall Status:** **待执行 / Waiting**')
          md=md.replace(/^- \*\*GitHub Commit:\*\* .*$/m,'- **GitHub Commit:** pending')
          md=md.replace(/^- \*\*Commit Verify:\*\* .*$/m,'- **Commit Verify:** 待执行 / Waiting')
          md=md.replace(/^- \*\*最后更新 \/ Updated:\*\* .*$/m,`- **最后更新 / Updated:** ${completedAt}`)
          md=md.replace(/^\| 13:00 \| 研究运行分析 \| Research Runtime Analysis \| daily \| .*$/m,'| 13:00 | 研究运行分析 | Research Runtime Analysis | daily | 已完成 / Completed | Skill 04 已消费 3 份 Reading Results 并形成 3 份 Research Objects；包含比较、因果与架构判断、不确定性及反证；未写文章或发布。 |')
          const eventRow=`| ${completedAt} | 研究运行分析 / Research Runtime Analysis | daily | Analysis Completed | 已完成 / Completed | Skill 04 consumed only three completed same-day Reading Results after verified scheduler-fallback start commit ${process.env.START_COMMIT}; three durable Research Objects were produced with comparison, causal/architectural judgment, uncertainty and counter-evidence. No publication copy or release work was performed. |`
          const timelineEnd='\n## 09:00 · 研究运行发现 / Research Runtime Discovery'
          if(!md.includes(eventRow)) md=md.replace(timelineEnd,`\n${eventRow}\n${timelineEnd}`)
          const section=`## 13:00 · 研究运行分析 / Research Runtime Analysis\n\n- **Family:** daily\n- **状态 / Status:** **已完成 / Completed**\n- **Result Contract:** \`runtime-shift-result/v2\`\n- **Started:** ${starts[0].time}\n- **Completed:** ${completedAt}\n\n### 输入 / Input\n\n仅在持久化 Analysis Running 状态完成 fetch 与核验后消费当日三份已完成 Reading Results。Scheduler fallback 启动提交：\`${process.env.START_COMMIT}\`。\n\n> Consumed only the three completed 2026-08-08 Reading Results after durable Analysis Running verification. Scheduler fallback start commit: ${process.env.START_COMMIT}.\n\n### 工作成果 / Work Result\n\nSkill 04 形成三份 Research Objects，包含观察、同日交叉比较、因果与架构讨论、每栏四项明确研究判断、不确定性、反证、工程影响、限制与未来问题。未引入未读来源、出版文案或发布工作。\n\n> Skill 04 produced three Research Objects with observations, same-day cross-comparison, causal and architectural discussion, four explicit research judgments per column, uncertainty, counter-evidence, engineering impact, limitations, and future questions. No unread source, publication copy, or release work was introduced.\n\n### 输出 / Output\n\n三份可作为 Production 唯一合法输入的 Research Objects：Pause-Preserving Budget Admission；Lifecycle-Revalidated Managed Policy Plane；Correlated Multi-Stream Agent Host Contract。\n\n> Three Production-authorized Research Objects: Pause-Preserving Budget Admission; Lifecycle-Revalidated Managed Policy Plane; Correlated Multi-Stream Agent Host Contract.\n\n### 下一步 / Next\n\n15:00 Production 只能消费这三份持久化 Research Objects，不得直接从 Signal 或 Reading Result 写作，并必须保留各对象的不确定性与反证边界。\n\n> Production at 15:00 may consume only these durable Research Objects. It must not write from Signals or Reading Results directly and must preserve each object's uncertainty and counter-evidence boundaries.\n\n### 量化结果 / Metrics\n\n| 指标 | Metric | 数值 / Value |\n|---|---|---:|\n| 已消费 Reading Results | Reading Results consumed | 3 |\n| 已产出 Research Objects | Research Objects produced | 3 |\n| 已完成研究栏目 | Research columns completed | 3/3 |\n| 明确研究判断 | Explicit research judgments | 12 |\n| 不确定性陈述 | Uncertainty statements | 9 |\n| 反证条目 | Counter-evidence items | 12 |\n| 引入未读外部来源 | Unread external sources introduced | 0 |\n| 出版草稿 | Publication drafts | 0 |\n| Analysis 启动事件 | Analysis start events | 1 |\n\n### 证据 / Evidence\n\n- \`research/runtime/SCHEDULER.json\`\n- \`research/skills/04-research-analysis.md\`\n- \`research/reading/Q-20260808-01-session-budget-governance.md\`\n- \`research/reading/Q-20260808-02-managed-model-auto-review.md\`\n- \`research/reading/Q-20260808-03-code-mode-grpc-host-protocol.md\`\n- Analysis start commit: \`${process.env.START_COMMIT}\`\n\n### 成果文件 / Artifacts\n\n- \`research/analysis/Q-20260808-01-pause-preserving-budget-admission.md\`\n- \`research/analysis/Q-20260808-02-lifecycle-revalidated-managed-policy-plane.md\`\n- \`research/analysis/Q-20260808-03-correlated-multistream-agent-host-contract.md\`\n- \`research/runtime/records/daily/2026/08/2026-08-08-daily-runtime.json\`\n- \`research/runtime/2026/08/2026-08-08-runtime.md\`\n`
          md=md.replace(/## 13:00 · 研究运行分析 \/ Research Runtime Analysis[\s\S]*?(?=\n## 15:00 · 研究运行生产 \/ Research Runtime Production)/,section)
          fs.writeFileSync(ledgerPath,md)
          NODE

          node -e "JSON.parse(require('fs').readFileSync('$RECORD','utf8')); console.log('Runtime JSON parse OK')"
          git diff --check
          git config user.name "joinwell52 Research Runtime"
          git config user.email "actions@users.noreply.github.com"
          git add research/analysis/Q-20260808-01-pause-preserving-budget-admission.md \
            research/analysis/Q-20260808-02-lifecycle-revalidated-managed-policy-plane.md \
            research/analysis/Q-20260808-03-correlated-multistream-agent-host-contract.md \
            "$RECORD" "$LEDGER"
          git commit -m "research(analysis): produce 2026-08-08 Research Objects"
          git pull --rebase origin main
          git push origin HEAD:main
          result_commit="$(git rev-parse HEAD)"
          echo "result_commit=$result_commit" >> "$GITHUB_OUTPUT"
          echo "Published Analysis result commit $result_commit"

      - name: Fetch and verify result commit before marking commitVerify Completed
        shell: bash
        env:
          RESULT_COMMIT: ${{ steps.result.outputs.result_commit }}
        run: |
          set -euo pipefail
          RECORD="research/runtime/records/daily/2026/08/2026-08-08-daily-runtime.json"
          LEDGER="research/runtime/2026/08/2026-08-08-runtime.md"
          git fetch origin main
          git merge-base --is-ancestor "$RESULT_COMMIT" origin/main
          for path in \
            research/analysis/Q-20260808-01-pause-preserving-budget-admission.md \
            research/analysis/Q-20260808-02-lifecycle-revalidated-managed-policy-plane.md \
            research/analysis/Q-20260808-03-correlated-multistream-agent-host-contract.md; do
            git cat-file -e "$RESULT_COMMIT:$path"
          done
          git show "$RESULT_COMMIT:$RECORD" > /tmp/result.json
          git show "$RESULT_COMMIT:$LEDGER" > /tmp/result.md
          node <<'NODE'
          const fs=require('fs')
          const r=JSON.parse(fs.readFileSync('/tmp/result.json','utf8'))
          const starts=(r.timeline||[]).filter(e=>e.task==='analysis'&&e.event==='Execution Slot Opened'&&e.status==='Running'&&String(e.time||'').startsWith('2026-08-08'))
          if(r.status!=='Waiting'||r.taskStatus?.analysis!=='Completed'||r.taskStatus?.production!=='Waiting') throw new Error('Unexpected terminal/next state in Analysis result commit.')
          if(r.results?.analysis?.schema!=='runtime-shift-result/v2'||r.results?.analysis?.status!=='Completed') throw new Error('Missing canonical Analysis runtime-shift-result/v2.')
          if(starts.length!==1) throw new Error(`Expected exactly one Analysis start event, got ${starts.length}`)
          if((r.results.analysis.artifacts||[]).filter(a=>String(a.path||'').startsWith('research/analysis/')).length!==3) throw new Error('Expected exactly three Research Object artifacts.')
          if(r.results.analysis.metrics.find(m=>m.label==='Unread external sources introduced')?.value!=='0') throw new Error('Unread-source metric is not zero.')
          console.log('Verified result commit: three Research Objects + synchronized Runtime result.')
          NODE
          grep -q '| 13:00 | 研究运行分析 | Research Runtime Analysis | daily | 已完成 / Completed |' /tmp/result.md
          grep -q 'Research Objects produced | 3' /tmp/result.md

      - name: Persist separate verified Runtime commit
        id: verify
        shell: bash
        env:
          RESULT_COMMIT: ${{ steps.result.outputs.result_commit }}
        run: |
          set -euo pipefail
          RECORD="research/runtime/records/daily/2026/08/2026-08-08-daily-runtime.json"
          LEDGER="research/runtime/2026/08/2026-08-08-runtime.md"
          git fetch origin main
          git reset --hard origin/main
          verified_at="$(TZ=Asia/Shanghai date +%Y-%m-%dT%H:%M:%S%:z)"
          export VERIFIED_AT="$verified_at" RESULT_COMMIT
          node <<'NODE'
          const fs=require('fs')
          const recordPath='research/runtime/records/daily/2026/08/2026-08-08-daily-runtime.json'
          const ledgerPath='research/runtime/2026/08/2026-08-08-runtime.md'
          const r=JSON.parse(fs.readFileSync(recordPath,'utf8'))
          const starts=(r.timeline||[]).filter(e=>e.task==='analysis'&&e.event==='Execution Slot Opened'&&e.status==='Running'&&String(e.time||'').startsWith('2026-08-08'))
          const verifies=(r.timeline||[]).filter(e=>e.task==='analysis'&&e.event==='GitHub Commit Verified'&&String(e.time||'').startsWith('2026-08-08'))
          if(r.taskStatus?.analysis!=='Completed'||r.results?.analysis?.status!=='Completed'||starts.length!==1||verifies.length!==0) throw new Error('Unsafe verification precondition.')
          r.githubCommit=process.env.RESULT_COMMIT
          r.commitVerify='Completed'
          r.updatedAt=process.env.VERIFIED_AT
          const detail=`Fetched and verified Analysis result commit ${process.env.RESULT_COMMIT}: all three Research Objects, the Analysis runtime-shift-result/v2 result, Daily Runtime JSON and synchronized Markdown ledger are present and consistent; exactly one current-day Analysis Execution Slot Opened / Running event remains.`
          r.timeline.push({time:process.env.VERIFIED_AT,task:'analysis',event:'GitHub Commit Verified',status:'Completed',detail})
          fs.writeFileSync(recordPath,JSON.stringify(r,null,2)+'\n')
          let md=fs.readFileSync(ledgerPath,'utf8')
          md=md.replace(/^github_commit: .*$/m,`github_commit: "${process.env.RESULT_COMMIT}"`)
          md=md.replace(/^commit_verify: .*$/m,'commit_verify: "Completed"')
          md=md.replace(/^updated_at: .*$/m,`updated_at: "${process.env.VERIFIED_AT}"`)
          md=md.replace(/^- \*\*GitHub Commit:\*\* .*$/m,`- **GitHub Commit:** ${process.env.RESULT_COMMIT}`)
          md=md.replace(/^- \*\*Commit Verify:\*\* .*$/m,'- **Commit Verify:** 已完成 / Completed')
          md=md.replace(/^- \*\*最后更新 \/ Updated:\*\* .*$/m,`- **最后更新 / Updated:** ${process.env.VERIFIED_AT}`)
          const row=`| ${process.env.VERIFIED_AT} | 研究运行分析 / Research Runtime Analysis | daily | GitHub Commit Verified | 已完成 / Completed | ${detail} |`
          const timelineEnd='\n## 09:00 · 研究运行发现 / Research Runtime Discovery'
          if(!md.includes(row)) md=md.replace(timelineEnd,`\n${row}\n${timelineEnd}`)
          fs.writeFileSync(ledgerPath,md)
          NODE
          node -e "JSON.parse(require('fs').readFileSync('$RECORD','utf8')); console.log('Final Runtime JSON parse OK')"
          git diff --check
          git config user.name "joinwell52 Research Runtime"
          git config user.email "actions@users.noreply.github.com"
          git add "$RECORD" "$LEDGER"
          git commit -m "runtime(v5): verify 2026-08-08 Analysis artifacts"
          git pull --rebase origin main
          git push origin HEAD:main
          verify_commit="$(git rev-parse HEAD)"
          echo "verify_commit=$verify_commit" >> "$GITHUB_OUTPUT"
          echo "Published Analysis verification commit $verify_commit"

      - name: Fetch and verify resulting final main commit
        shell: bash
        env:
          RESULT_COMMIT: ${{ steps.result.outputs.result_commit }}
          VERIFY_COMMIT: ${{ steps.verify.outputs.verify_commit }}
        run: |
          set -euo pipefail
          RECORD="research/runtime/records/daily/2026/08/2026-08-08-daily-runtime.json"
          LEDGER="research/runtime/2026/08/2026-08-08-runtime.md"
          git fetch origin main
          git merge-base --is-ancestor "$VERIFY_COMMIT" origin/main
          git show "$VERIFY_COMMIT:$RECORD" > /tmp/final.json
          git show "$VERIFY_COMMIT:$LEDGER" > /tmp/final.md
          node <<'NODE'
          const fs=require('fs')
          const r=JSON.parse(fs.readFileSync('/tmp/final.json','utf8'))
          const starts=(r.timeline||[]).filter(e=>e.task==='analysis'&&e.event==='Execution Slot Opened'&&e.status==='Running'&&String(e.time||'').startsWith('2026-08-08'))
          const verifies=(r.timeline||[]).filter(e=>e.task==='analysis'&&e.event==='GitHub Commit Verified'&&e.status==='Completed'&&String(e.time||'').startsWith('2026-08-08'))
          if(r.status!=='Waiting') throw new Error(`Expected overall Waiting, got ${r.status}`)
          if(r.taskStatus?.analysis!=='Completed') throw new Error(`Expected Analysis Completed, got ${r.taskStatus?.analysis}`)
          if(r.taskStatus?.production!=='Waiting') throw new Error(`Expected Production Waiting, got ${r.taskStatus?.production}`)
          if(r.githubCommit!==process.env.RESULT_COMMIT) throw new Error(`githubCommit ${r.githubCommit} != result ${process.env.RESULT_COMMIT}`)
          if(r.commitVerify!=='Completed') throw new Error(`commitVerify ${r.commitVerify}`)
          if(starts.length!==1) throw new Error(`Analysis start-event count ${starts.length}`)
          if(verifies.length!==1) throw new Error(`Analysis verification-event count ${verifies.length}`)
          if(r.results?.analysis?.metrics?.find(m=>m.label==='Publication drafts')?.value!=='0') throw new Error('Publication draft metric is not zero.')
          console.log(`Final Analysis state verified. result=${process.env.RESULT_COMMIT} verify=${process.env.VERIFY_COMMIT}`)
          NODE
          grep -q '| 13:00 | 研究运行分析 | Research Runtime Analysis | daily | 已完成 / Completed |' /tmp/final.md
          grep -q "GitHub Commit: ${RESULT_COMMIT}" /tmp/final.md
          echo "FINAL_RESULT_COMMIT=$RESULT_COMMIT"
          echo "FINAL_VERIFY_COMMIT=$VERIFY_COMMIT"

      - name: Cleanup ephemeral automation branch
        if: success()
        shell: bash
        run: git push origin --delete automation/analysis-20260808-run3 || true
