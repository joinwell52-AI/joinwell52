      - name: Fetch and verify Analysis result artifacts
        shell: bash
        env:
          RESULT_COMMIT: ${{ steps.result.outputs.result_commit }}
        run: |
          set -euo pipefail
          RECORD="research/runtime/records/daily/2026/08/2026-08-08-daily-runtime.json"
          LEDGER="research/runtime/2026/08/2026-08-08-runtime.md"
          git fetch origin main
          git merge-base --is-ancestor "$RESULT_COMMIT" origin/main
          for path in \
            research/analysis/Q-20260808-01-pause-preserving-budget-admission.md \
            research/analysis/Q-20260808-02-lifecycle-revalidated-managed-policy-plane.md \
            research/analysis/Q-20260808-03-correlated-multistream-agent-host-contract.md; do
            git cat-file -e "$RESULT_COMMIT:$path"
          done
          git show "$RESULT_COMMIT:$RECORD" > /tmp/analysis-result.json
          git show "$RESULT_COMMIT:$LEDGER" > /tmp/analysis-result.md
          node <<'NODE'
          const fs = require('fs')
          const record = JSON.parse(fs.readFileSync('/tmp/analysis-result.json', 'utf8'))
          const starts = (record.timeline || []).filter((e) => e.task === 'analysis' && e.event === 'Execution Slot Opened' && e.status === 'Running' && String(e.time || '').startsWith('2026-08-08'))
          if (record.taskStatus?.analysis !== 'Completed') throw new Error(`Analysis not Completed in result commit: ${record.taskStatus?.analysis}`)
          if (record.results?.analysis?.schema !== 'runtime-shift-result/v2') throw new Error('Missing runtime-shift-result/v2 Analysis result.')
          if (starts.length !== 1) throw new Error(`Expected exactly one Analysis start event, got ${starts.length}`)
          if ((record.results.analysis.artifacts || []).filter((a) => String(a.path || '').startsWith('research/analysis/')).length !== 3) throw new Error('Expected three Research Object artifacts.')
          console.log('Verified Analysis result commit and three Research Objects.')
          NODE
          grep -q '| 13:00 | 研究运行分析 | Research Runtime Analysis | daily | 已完成 / Completed |' /tmp/analysis-result.md

      - name: Persist verified final Runtime commit
        id: verify
        shell: bash
        env:
          RESULT_COMMIT: ${{ steps.result.outputs.result_commit }}
        run: |
          set -euo pipefail
          RECORD="research/runtime/records/daily/2026/08/2026-08-08-daily-runtime.json"
          LEDGER="research/runtime/2026/08/2026-08-08-runtime.md"
          git fetch origin main
          git reset --hard origin/main
          verified_at="$(TZ=Asia/Shanghai date +%Y-%m-%dT%H:%M:%S%:z)"
          export VERIFIED_AT="$verified_at"
          node <<'NODE'
          const fs = require('fs')
          const path = 'research/runtime/records/daily/2026/08/2026-08-08-daily-runtime.json'
          const record = JSON.parse(fs.readFileSync(path, 'utf8'))
          if (record.taskStatus?.analysis !== 'Completed' || record.results?.analysis?.status !== 'Completed') throw new Error('Cannot verify a non-completed Analysis result.')
          const starts = (record.timeline || []).filter((e) => e.task === 'analysis' && e.event === 'Execution Slot Opened' && e.status === 'Running' && String(e.time || '').startsWith('2026-08-08'))
          if (starts.length !== 1) throw new Error(`Expected exactly one Analysis start event, got ${starts.length}`)
          const existing = (record.timeline || []).filter((e) => e.task === 'analysis' && e.event === 'GitHub Commit Verified' && String(e.time || '').startsWith('2026-08-08'))
          if (existing.length) throw new Error(`Unexpected pre-existing Analysis verification event count: ${existing.length}`)
          record.githubCommit = process.env.RESULT_COMMIT
          record.commitVerify = 'Completed'
          record.updatedAt = process.env.VERIFIED_AT
          record.timeline.push({
            time: process.env.VERIFIED_AT,
            task: 'analysis',
            event: 'GitHub Commit Verified',
            status: 'Completed',
            detail: `Fetched and verified Analysis result commit ${process.env.RESULT_COMMIT}: all three Research Objects, the runtime-shift-result/v2 Analysis result, Daily Runtime JSON and synchronized Markdown ledger are present and consistent; exactly one current-day Analysis Execution Slot Opened / Running event remains.`
          })
          fs.writeFileSync(path, JSON.stringify(record, null, 2) + '\n')
          NODE
          node scripts/runtime-markdown.mjs render --date 2026-08-08
          npm run runtime:validate
          node scripts/runtime-markdown.mjs validate --date 2026-08-08
          git diff --check
          git config user.name "joinwell52 Research Runtime"
          git config user.email "actions@users.noreply.github.com"
          git add "$RECORD" "$LEDGER"
          git commit -m "runtime(v5): verify 2026-08-08 Analysis artifacts"

          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              verify_commit="$(git rev-parse HEAD)"
              echo "verify_commit=$verify_commit" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort || true
            if [[ "$attempt" -eq 3 ]]; then
              echo "Unable to publish Analysis verification state after three attempts."
              exit 1
            fi
            sleep $((attempt * 3))
          done

      - name: Fetch and verify resulting final main commit
        shell: bash
        env:
          RESULT_COMMIT: ${{ steps.result.outputs.result_commit }}
          VERIFY_COMMIT: ${{ steps.verify.outputs.verify_commit }}
        run: |
          set -euo pipefail
          RECORD="research/runtime/records/daily/2026/08/2026-08-08-daily-runtime.json"
          LEDGER="research/runtime/2026/08/2026-08-08-runtime.md"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$VERIFY_COMMIT"
          git show "$VERIFY_COMMIT:$RECORD" > /tmp/final-runtime.json
          git show "$VERIFY_COMMIT:$LEDGER" > /tmp/final-runtime.md
          node <<'NODE'
          const fs = require('fs')
          const record = JSON.parse(fs.readFileSync('/tmp/final-runtime.json', 'utf8'))
          const starts = (record.timeline || []).filter((e) => e.task === 'analysis' && e.event === 'Execution Slot Opened' && e.status === 'Running' && String(e.time || '').startsWith('2026-08-08'))
          const verifies = (record.timeline || []).filter((e) => e.task === 'analysis' && e.event === 'GitHub Commit Verified' && e.status === 'Completed' && String(e.time || '').startsWith('2026-08-08'))
          if (record.status !== 'Waiting') throw new Error(`Expected overall Waiting for Production, got ${record.status}`)
          if (record.taskStatus?.analysis !== 'Completed') throw new Error(`Expected Analysis Completed, got ${record.taskStatus?.analysis}`)
          if (record.taskStatus?.production !== 'Waiting') throw new Error(`Expected Production Waiting, got ${record.taskStatus?.production}`)
          if (record.githubCommit !== process.env.RESULT_COMMIT) throw new Error(`githubCommit mismatch: ${record.githubCommit}`)
          if (record.commitVerify !== 'Completed') throw new Error(`commitVerify mismatch: ${record.commitVerify}`)
          if (starts.length !== 1) throw new Error(`Expected exactly one Analysis start event, got ${starts.length}`)
          if (verifies.length !== 1) throw new Error(`Expected exactly one Analysis verification event, got ${verifies.length}`)
          console.log(`Final Runtime verified: result=${process.env.RESULT_COMMIT}, final=${process.env.VERIFY_COMMIT}`)
          NODE
          grep -q '| 13:00 | 研究运行分析 | Research Runtime Analysis | daily | 已完成 / Completed |' /tmp/final-runtime.md

      - name: Remove ephemeral automation branch
        if: success()
        shell: bash
        run: |
          git push origin --delete automation/analysis-20260808-run3 || true
