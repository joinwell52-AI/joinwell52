          # Research Object — Pause-Preserving Budget Admission for Digital Employees

          ## Governed scope

          This object performs Skill 04 using only the three completed same-day Reading Results, with `Q-20260808-01` as the primary column input. It introduces no unread sources and does not draft publication copy or authorize release.

          ## Analysis

          ```yaml
          analysis:
            observations:
              - The primary Reading Result shows a hard session budget implemented as an admission gate before each new model request rather than as a mid-request kill switch.
              - Budget exhaustion maps to durable pause semantics: the session becomes idle with `budget_reached`, history and sandbox state remain preserved, and already-started settlement work may still complete.
              - The platform separates exact enforcement cost from rounded visible usage, so an operator can observe a value that is insufficient to calculate the mathematically smallest valid resume budget.
              - Multiagent threads share one session budget and may converge to pause at different times because already-admitted requests are allowed to finish.
              - A valid policy update or budget removal resumes paused work automatically, making authorization state rather than a fresh execution command the causal resume trigger.
            cross_comparison:
              - Compared with the managed-model Reading Result, both systems compile central policy into runtime admission constraints rather than relying on model self-regulation or client preference.
              - Compared with the gRPC host Reading Result, both distinguish lifecycle state from semantic success: a budget-paused session is durable but not complete, while an execution can be protocol-completed and still carry application error text.
              - The budget settle-only channel is structurally similar to a drain boundary: new generative work is blocked while already-admitted obligations are allowed to reconcile before the runtime becomes quiescent.
              - Shared session budgets resemble other shared control-plane authorities: they simplify one source of truth but couple otherwise independent worker threads unless a higher policy layer partitions authority.
            discussion:
              - The important mechanism is cost-governed work admission, not merely cost reporting. Governance becomes effective only when the runtime can refuse new model work while preserving the work identity and evidence needed to continue later.
              - Pause rather than termination creates a reversible authority boundary. The operator changes policy, and the runtime resumes from preserved state; this is closer to suspended employment authority than to process failure.
              - Because in-flight work may overshoot the cap, the phrase hard budget should be interpreted as a hard boundary on admitting new model requests, not as an exact invoice ceiling.
              - A Digital Employee therefore needs separate concepts for budget policy, observed usage, admissible new work, settlement work and durable work state. Collapsing them into one boolean `active` flag loses the reason and authority for suspension.
              - Shared budgets are appropriate when one work order owns the economic authority, but they are insufficient when independent roles require separate cost accountability; that need should be solved above the session primitive rather than inferred from thread-local usage.
            research_judgment:
              - A managed Digital Employee should model budget exhaustion as a typed, reversible admission state that blocks new generative work while preserving durable work state and permitting narrowly defined settlement actions.
              - Budget authority should be attached to the long-lived WorkOrder/session identity and changed only by an authorized policy owner; resume should be a consequence of an accepted policy transition, not an untracked worker retry.
              - Runtime evidence must distinguish exact enforcement accounting from rounded operator-facing usage and must never promise an exact spend ceiling when already-admitted work can overshoot.
              - Per-role or fleet-wide economic controls, if required, should be explicit higher-level policy objects because a shared per-session cap does not provide independent thread budgets or cumulative deployment governance.
            uncertainty:
              - Confidence is high in the admission-versus-termination distinction because it is directly specified in the completed first-party Reading Result.
              - Confidence is medium that pause-preserving budget governance transfers cleanly to heterogeneous Digital Employee roles because the source describes one managed-agent product rather than a cross-platform implementation study.
              - Confidence is low about exactly-once event delivery, worst-case multi-thread convergence time and organization-level cumulative budget behavior because those guarantees are unresolved in the Reading Result.
            counter_evidence:
              - The documented hard budget can overshoot due to already-admitted requests, so it is not evidence for an exact final-cost ceiling.
              - Public list cost may differ from negotiated billed spend, limiting the feature as a direct financial-accounting control.
              - Multiagent sessions share one cap with no per-thread partition, so the mechanism does not independently govern role budgets.
              - Models without public list prices can make the budget unusable, with removal of the budget documented as the recovery path.
            engineering_impact:
              tmpa:
                - Treat this as research input on typed suspension, policy authority and evidence boundaries; no TMPA Core change is justified from one product mechanism.
              digital_employee:
                - Add a durable budget-policy surface to WorkOrder/runtime state with explicit Active, BudgetPaused and Resumable semantics rather than terminating work at the cap.
                - Preserve an allowlist for settlement actions that can close already-started tool obligations without admitting new model work.
                - Record policy owner, exact enforcement usage, rounded display usage, pause reason and resume authorization as separate evidence fields.
                - Use higher-level role or organizational budget policy when one shared session cap is too coarse for accountability.
              codeflowmu:
                - Keep `unknown`, `running`, `waiting for authority` and `completed` distinct; a budget pause should not be surfaced as failure or completion.
                - Implement budget governance first in Runtime/WorkOrder state and observation surfaces rather than expanding FCoP protocol semantics from this single case.
                - Recovery should reopen execution from preserved accepted state after policy authorization without requiring reuse of the original provider session.
            limitations:
              - Analysis is bounded to completed same-day Reading Results and does not independently reproduce Claude Managed Agents behavior.
              - No organization-level cumulative budget primitive is established by the primary Reading Result.
              - Event retry, reconnect and exactly-once guarantees are not demonstrated.
              - The transfer from product-specific list-cost accounting to SME operational budgets remains an inference.
            future_questions:
              - What minimum WorkOrder budget contract separates cap, exact consumed amount, displayed amount, settlement authority and resume authority?
              - How should role-specific budgets compose with a shared work-order budget without creating contradictory admission decisions?
              - What crash/reconnect tests are required to prove that BudgetPaused state and settlement receipts survive partial failure?
              - Should CodeFlowMu expose budget pause as a dedicated operator decision state or as a generic policy-wait state with typed reason metadata?
          ```

          ## Research judgment

          Treat budget exhaustion as pause-preserving work-admission governance: new generative work stops, accepted state survives, settlement remains possible, and only an authorized policy change reopens execution. Do not equate a hard admission gate with an exact final-cost ceiling.

          ## Production input

          Production may consume this object only with its overshoot, list-cost, shared-budget and unresolved delivery-guarantee boundaries intact.

          ## Evidence boundary

          - `research/reading/Q-20260808-01-session-budget-governance.md`
          - `research/reading/Q-20260808-02-managed-model-auto-review.md`
          - `research/reading/Q-20260808-03-code-mode-grpc-host-protocol.md`

          No unread material was consumed.
