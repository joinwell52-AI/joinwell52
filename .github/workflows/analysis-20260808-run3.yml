name: Execute Research Runtime Analysis 2026-08-08 Run 3

on:
  push:
    branches:
      - automation/analysis-20260808-run3
    paths:
      - .github/workflows/analysis-20260808-run3.yml

permissions:
  contents: write

concurrency:
  group: research-runtime-analysis-20260808
  cancel-in-progress: false

jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authoritative main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify or persist durable Analysis Running state
        id: control
        shell: bash
        run: |
          set -euo pipefail
          RECORD="research/runtime/records/daily/2026/08/2026-08-08-daily-runtime.json"
          LEDGER="research/runtime/2026/08/2026-08-08-runtime.md"
          git config user.name "joinwell52 Research Runtime"
          git config user.email "actions@users.noreply.github.com"

          inspect_state() {
            node <<'NODE'
          const fs = require('fs')
          const record = JSON.parse(fs.readFileSync('research/runtime/records/daily/2026/08/2026-08-08-daily-runtime.json', 'utf8'))
          const starts = (record.timeline || []).filter((e) =>
            e.task === 'analysis' && e.event === 'Execution Slot Opened' && e.status === 'Running' && String(e.time || '').startsWith('2026-08-08')
          )
          console.log(`overall=${record.status}`)
          console.log(`analysis=${record.taskStatus?.analysis || ''}`)
          console.log(`starts=${starts.length}`)
          console.log(`reading=${record.taskStatus?.reading || ''}`)
          NODE
          }

          fallback="false"
          start_commit=""
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            state="$(inspect_state)"
            echo "$state"
            overall="$(printf '%s\n' "$state" | sed -n 's/^overall=//p')"
            analysis="$(printf '%s\n' "$state" | sed -n 's/^analysis=//p')"
            starts="$(printf '%s\n' "$state" | sed -n 's/^starts=//p')"
            reading="$(printf '%s\n' "$state" | sed -n 's/^reading=//p')"

            if [[ "$starts" == "1" && "$overall" == "Running" && "$analysis" == "Running" ]]; then
              start_commit="$(git log -1 --format=%H -- "$RECORD")"
              echo "Scheduler Running state already durable at $start_commit."
              break
            fi
            if [[ "$starts" != "0" ]]; then
              echo "Expected zero or one current-day Analysis start event, found $starts."
              exit 1
            fi
            if [[ "$reading" != "Completed" ]]; then
              echo "Reading dependency is not Completed: $reading"
              exit 1
            fi
            if [[ "$analysis" != "Waiting" ]]; then
              echo "Analysis is neither Waiting nor the required durable Running state: $analysis"
              exit 1
            fi

            echo "Scheduler fallback required: persisting missing Analysis Running state."
            node scripts/runtime-v5.mjs schedule --task analysis
            node <<'NODE'
          const fs = require('fs')
          const path = 'research/runtime/records/daily/2026/08/2026-08-08-daily-runtime.json'
          const record = JSON.parse(fs.readFileSync(path, 'utf8'))
          const starts = (record.timeline || []).filter((e) => e.task === 'analysis' && e.event === 'Execution Slot Opened' && e.status === 'Running' && String(e.time || '').startsWith('2026-08-08'))
          if (starts.length !== 1) throw new Error(`fallback must create exactly one Analysis start event, got ${starts.length}`)
          starts[0].detail = 'Scheduler fallback: Research Runtime Analysis opened because the durable control-plane Running state was absent at automation entry; substantive Skill 04 work may begin only after this synchronized JSON and Markdown state is committed, fetched and verified.'
          fs.writeFileSync(path, JSON.stringify(record, null, 2) + '\n')
          NODE
            node scripts/runtime-markdown.mjs render --date 2026-08-08
            npm run runtime:validate
            node scripts/runtime-markdown.mjs validate --date 2026-08-08
            git add "$RECORD" "$LEDGER"
            git commit -m "runtime(v5): fallback open Analysis control-plane state for 2026-08-08"
            candidate="$(git rev-parse HEAD)"
            if git push origin HEAD:main; then
              fallback="true"
              start_commit="$candidate"
              break
            fi
            echo "Start-state push raced with another main update; retrying from authoritative main."
          done

          if [[ -z "$start_commit" ]]; then
            echo "Unable to establish a durable Analysis Running state."
            exit 1
          fi

          echo "fallback=$fallback" >> "$GITHUB_OUTPUT"
          echo "start_commit=$start_commit" >> "$GITHUB_OUTPUT"

      - name: Fetch and verify durable control-plane state before substantive work
        shell: bash
        env:
          START_COMMIT: ${{ steps.control.outputs.start_commit }}
          FALLBACK: ${{ steps.control.outputs.fallback }}
        run: |
          set -euo pipefail
          RECORD="research/runtime/records/daily/2026/08/2026-08-08-daily-runtime.json"
          LEDGER="research/runtime/2026/08/2026-08-08-runtime.md"
          git fetch origin main
          git merge-base --is-ancestor "$START_COMMIT" origin/main
          git show "origin/main:$RECORD" > /tmp/analysis-start.json
          git show "origin/main:$LEDGER" > /tmp/analysis-start.md
          node <<'NODE'
          const fs = require('fs')
          const record = JSON.parse(fs.readFileSync('/tmp/analysis-start.json', 'utf8'))
          const starts = (record.timeline || []).filter((e) => e.task === 'analysis' && e.event === 'Execution Slot Opened' && e.status === 'Running' && String(e.time || '').startsWith('2026-08-08'))
          if (record.status !== 'Running') throw new Error(`Expected overall Running, got ${record.status}`)
          if (record.taskStatus?.analysis !== 'Running') throw new Error(`Expected taskStatus.analysis=Running, got ${record.taskStatus?.analysis}`)
          if (starts.length !== 1) throw new Error(`Expected exactly one Analysis start event, got ${starts.length}`)
          if (record.taskStatus?.reading !== 'Completed') throw new Error(`Reading dependency must be Completed, got ${record.taskStatus?.reading}`)
          console.log(`Verified Analysis durable Running state; fallback=${process.env.FALLBACK}; startCommit=${process.env.START_COMMIT}`)
          NODE
          grep -q '| 13:00 | 研究运行分析 | Research Runtime Analysis | daily | 运行中 / Running |' /tmp/analysis-start.md

      - name: Execute Skill 04 from completed Reading Results only
        id: result
        shell: bash
        env:
          START_COMMIT: ${{ steps.control.outputs.start_commit }}
          FALLBACK: ${{ steps.control.outputs.fallback }}
        run: |
          set -euo pipefail
          RECORD="research/runtime/records/daily/2026/08/2026-08-08-daily-runtime.json"
          LEDGER="research/runtime/2026/08/2026-08-08-runtime.md"
          R1="research/reading/Q-20260808-01-session-budget-governance.md"
          R2="research/reading/Q-20260808-02-managed-model-auto-review.md"
          R3="research/reading/Q-20260808-03-code-mode-grpc-host-protocol.md"
          A1="research/analysis/Q-20260808-01-pause-preserving-budget-admission.md"
          A2="research/analysis/Q-20260808-02-lifecycle-revalidated-managed-policy-plane.md"
          A3="research/analysis/Q-20260808-03-correlated-multistream-agent-host-contract.md"

          git fetch origin main
          git reset --hard origin/main

          test "$(git rev-parse HEAD:$R1)" = "9f22d00e120e44d5a1ce11e6ac9181bb7d6c9b45"
          test "$(git rev-parse HEAD:$R2)" = "7259795cb7d2a583adbde3315d274ac845176723"
          test "$(git rev-parse HEAD:$R3)" = "f5952a99dd4b8c9d40fc6851f210ee0d92345046"
          test "$(git rev-parse HEAD:research/skills/04-research-analysis.md)" = "fcb04fa2321e4a0707d69aa3a852a8061fe5e718"

          node <<'NODE'
          const fs = require('fs')
          const record = JSON.parse(fs.readFileSync('research/runtime/records/daily/2026/08/2026-08-08-daily-runtime.json', 'utf8'))
          const starts = (record.timeline || []).filter((e) => e.task === 'analysis' && e.event === 'Execution Slot Opened' && e.status === 'Running' && String(e.time || '').startsWith('2026-08-08'))
          if (record.taskStatus?.reading !== 'Completed') throw new Error('Reading is incomplete; Analysis must block.')
          if (record.taskStatus?.analysis !== 'Running' || record.status !== 'Running') throw new Error('Analysis durable Running state was lost before substantive work.')
          if (starts.length !== 1) throw new Error(`Expected exactly one Analysis start event, got ${starts.length}`)
          const readingArtifacts = record.results?.reading?.artifacts || []
          if (readingArtifacts.length && readingArtifacts.length < 3) throw new Error('Reading result does not expose all three durable Reading artifacts.')
          NODE

          mkdir -p research/analysis
          cat > "$A1" <<'EOF'
          ---
          schema: "research-analysis/v1"
          id: "AN-20260808-01"
          date: "2026-08-08"
          timezone: "Asia/Shanghai"
          repository: "joinwell52-AI/joinwell52"
          queue_item: "Q-20260808-01"
          column: "digital-employee"
          transition: "Reading -> Analysis"
          skill: "Skill 04 — Research Analysis"
          input_contract: "Reading Result"
          input_reading: "research/reading/Q-20260808-01-session-budget-governance.md"
          output_contract: "Research Object"
          research_object: "Pause-Preserving Budget Admission"
          status: "ReadyForProduction"
          production_input_authorized: true
          publication_authorized: false
