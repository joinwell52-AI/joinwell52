name: Runtime Discovery Verify 20260809 Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/runtime-discovery-verify-20260809-once.yml

permissions:
  contents: write

jobs:
  verify-result:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify result commit and persist verification receipt
        shell: bash
        run: |
          set -euo pipefail
          result_commit='9bd12d067ea8771e94f23d194964be6e421450b6'
          runtime='research/runtime/records/daily/2026/08/2026-08-09-daily-runtime.json'
          intel='research/intelligence/runs/2026/08/2026-08-09-intelligence.json'
          md='research/runtime/2026/08/2026-08-09-runtime.md'
          verified_at="$(TZ=Asia/Shanghai date '+%Y-%m-%dT%H:%M:%S+08:00')"
          export RESULT_COMMIT="$result_commit" VERIFIED_AT="$verified_at"

          git cat-file -e "$result_commit^{commit}"
          git show "$result_commit:$runtime" >/tmp/runtime-result.json
          git show "$result_commit:$intel" >/tmp/intel-result.json
          git show "$result_commit:$md" >/tmp/runtime-result.md

          node - <<'NODE'
          const fs=require('fs');
          const resultCommit=process.env.RESULT_COMMIT;
          const verifiedAt=process.env.VERIFIED_AT;
          const r0=JSON.parse(fs.readFileSync('/tmp/runtime-result.json','utf8'));
          const i0=JSON.parse(fs.readFileSync('/tmp/intel-result.json','utf8'));
          const md0=fs.readFileSync('/tmp/runtime-result.md','utf8');
          const starts=(r0.timeline||[]).filter(e=>e.task==='discovery'&&e.event==='Execution Slot Opened'&&e.status==='Running');
          if(starts.length!==1) throw new Error(`expected one start event, got ${starts.length}`);
          if(r0.taskStatus.discovery!=='Completed'||Object.keys(r0.results||{}).join(',')!=='discovery'||r0.results.discovery.schema!=='runtime-shift-result/v2') throw new Error('Discovery result contract missing');
          for(const key of ['input','workResult','output','next','metrics','evidence','artifacts']) if(r0.results.discovery[key]===undefined) throw new Error(`missing result field ${key}`);
          if(i0.signals.length!==16||i0.pipelines.length!==3||i0.columns.some(c=>c.decision!=='Waiting'||c.selectedItemId)) throw new Error('Intelligence artifact invariant failed');
          if(i0.pipelines.find(p=>p.id==='ai-platform').failed.length!==3||i0.pipelines.find(p=>p.id==='ai-platform').inaccessible.length!==1||i0.pipelines.find(p=>p.id==='published-research').failed.length!==1) throw new Error('Explicit source outcome invariant failed');
          if((md0.match(/Execution Slot Opened/g)||[]).length!==1||!md0.includes('Discovery Completed')||md0.includes('[object Object]')) throw new Error('Markdown artifact invariant failed');

          const runtimePath='research/runtime/records/daily/2026/08/2026-08-09-daily-runtime.json';
          const intelPath='research/intelligence/runs/2026/08/2026-08-09-intelligence.json';
          const r=JSON.parse(fs.readFileSync(runtimePath,'utf8'));
          const i=JSON.parse(fs.readFileSync(intelPath,'utf8'));
          const existingVerify=(r.timeline||[]).filter(e=>e.task==='discovery'&&e.event==='GitHub Commit Verified');
          if(existingVerify.length) throw new Error('Refusing duplicate verification event');
          r.githubCommit=resultCommit;
          r.commitVerify='Completed';
          r.updatedAt=verifiedAt;
          r.timeline.push({time:verifiedAt,task:'discovery',event:'GitHub Commit Verified',status:'Completed',detail:`Fetched and verified durable Discovery result commit ${resultCommit}: Daily Runtime JSON, Research Intelligence run and regenerated Markdown ledger are present; exactly one start event remains and all runtime-shift-result/v2 fields are preserved.`});
          i.githubCommit=resultCommit;
          i.updatedAt=verifiedAt;
          i.controlPlane.resultCommit=resultCommit;
          i.controlPlane.resultCommitVerified=true;
          fs.writeFileSync(runtimePath,JSON.stringify(r,null,2)+'\n');
          fs.writeFileSync(intelPath,JSON.stringify(i,null,2)+'\n');
          NODE

          node scripts/runtime-markdown.mjs render --date 2026-08-09
          node scripts/runtime-markdown.mjs validate --date 2026-08-09
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('research/runtime/records/daily/2026/08/2026-08-09-daily-runtime.json','utf8'));
          const i=JSON.parse(fs.readFileSync('research/intelligence/runs/2026/08/2026-08-09-intelligence.json','utf8'));
          const md=fs.readFileSync('research/runtime/2026/08/2026-08-09-runtime.md','utf8');
          const starts=r.timeline.filter(e=>e.task==='discovery'&&e.event==='Execution Slot Opened'&&e.status==='Running');
          const verifies=r.timeline.filter(e=>e.task==='discovery'&&e.event==='GitHub Commit Verified'&&e.status==='Completed');
          if(starts.length!==1||verifies.length!==1||r.githubCommit!==process.env.RESULT_COMMIT||r.commitVerify!=='Completed'||!i.controlPlane.resultCommitVerified||i.controlPlane.resultCommit!==process.env.RESULT_COMMIT||md.includes('[object Object]')||(md.match(/Execution Slot Opened/g)||[]).length!==1||!md.includes('GitHub Commit Verified')) process.exit(1);
          NODE

          rm -f .github/workflows/runtime-discovery-verify-20260809-once.yml
          git config user.name 'joinwell52 Research Runtime'
          git config user.email 'actions@users.noreply.github.com'
          git add "$runtime" "$intel" "$md" .github/workflows/runtime-discovery-verify-20260809-once.yml
          git commit -m 'runtime(discovery): verify 2026-08-09 durable result'
          git push origin HEAD:main
