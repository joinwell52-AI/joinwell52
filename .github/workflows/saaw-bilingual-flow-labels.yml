name: Apply SaaW Chinese Cleanup

on:
  push:
    branches:
      - saaw-bilingual-flow-labels
    paths:
      - 'scripts/finalize_saaw_chinese_examples.py'
      - '.github/workflows/saaw-bilingual-flow-labels.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: saaw-bilingual-flow-labels
          fetch-depth: 0
      - name: Apply article cleanup
        run: python3 scripts/finalize_saaw_chinese_examples.py
      - name: Commit final article only
        shell: bash
        run: |
          rm -f scripts/finalize_saaw_chinese_examples.py
          rm -f .github/workflows/saaw-bilingual-flow-labels.yml
          git config user.name "joinwell52 Research Runtime"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "docs: finalize SaaW Chinese workday and bilingual flows"
          git push origin HEAD:saaw-bilingual-flow-labels
