name: Regenerate Composite Runtime Ledger Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/regenerate-composite-runtime-ledger-once.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate and validate composite ledger
        run: |
          node scripts/runtime-markdown.mjs render --date 2026-08-05
          node scripts/runtime-markdown.mjs validate --date 2026-08-05
          grep -q '^| 16:00 | 研究运行学术观察 | Research Runtime Academic | academic | 已完成 / Completed |' research/runtime/2026/08/2026-08-05-runtime.md
          grep -q '^## 16:00 · 研究运行学术观察 / Research Runtime Academic$' research/runtime/2026/08/2026-08-05-runtime.md
          grep -q '2026-08-05T16:00:42+08:00' research/runtime/2026/08/2026-08-05-runtime.md

      - name: Commit regenerated ledger and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/regenerate-composite-runtime-ledger-once.yml
          git config user.name "joinwell52 Research Runtime"
          git config user.email "actions@users.noreply.github.com"
          git add research/runtime/2026/08/2026-08-05-runtime.md .github/workflows/regenerate-composite-runtime-ledger-once.yml
          git commit -m "fix(runtime): include 16:00 Academic in 2026-08-05 ledger"
          git pull --rebase origin main
          git push origin HEAD:main
