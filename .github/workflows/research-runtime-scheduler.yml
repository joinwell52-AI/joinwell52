name: Research Runtime Scheduler V1.0

on:
  schedule:
    # Cron expressions are UTC; formal Runtime times are Asia/Shanghai (UTC+8).
    - cron: '0 1 * * *'     # Daily 09:00 — Runtime Engine
    - cron: '0 2 * * *'     # Daily 10:00 — Runtime Queue; Wednesday also Runtime Academic
    - cron: '0 3 * * *'     # Daily 11:00 — Runtime Knowledge
    - cron: '0 4 * * 1'     # Monday 12:00 — Runtime Architecture
    - cron: '0 12 * * *'    # Daily 20:00 — Runtime Publication
    - cron: '30 12 * * 0'   # Sunday 20:30 — Runtime Weekly
  workflow_dispatch:
    inputs:
      runtime_task:
        description: Formal Runtime task to schedule manually
        required: true
        type: choice
        options:
          - engine
          - queue
          - knowledge
          - architecture
          - publication
          - weekly
          - academic

permissions:
  contents: write

concurrency:
  group: research-runtime-scheduler
  cancel-in-progress: false

jobs:
  schedule-runtime:
    name: Open Runtime execution slot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authoritative repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Schedule Runtime task
        id: runtime
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_CRON: ${{ github.event.schedule }}
          MANUAL_TASK: ${{ inputs.runtime_task }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            node scripts/runtime-center.mjs schedule --cron "$EVENT_CRON"
          else
            node scripts/runtime-center.mjs schedule --task "$MANUAL_TASK"
          fi

      - name: Initialize task result contract
        run: node scripts/runtime-results.mjs initialize --date "${{ steps.runtime.outputs.runtime_date }}"

      - name: Validate Runtime Record and task results
        run: npm run runtime:validate

      - name: Commit Runtime scheduling record
        shell: bash
        env:
          TASK_NAMES: ${{ steps.runtime.outputs.task_names }}
          RUNTIME_DATE: ${{ steps.runtime.outputs.runtime_date }}
        run: |
          git config user.name "joinwell52 Research Runtime"
          git config user.email "actions@users.noreply.github.com"
          git add research/runtime

          if git diff --cached --quiet; then
            echo "Runtime Record already contains this scheduling event."
            exit 0
          fi

          git commit -m "runtime: schedule ${TASK_NAMES} for ${RUNTIME_DATE}"

          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            if [[ "$attempt" -eq 3 ]]; then
              echo "Unable to publish Runtime scheduling record after three attempts."
              exit 1
            fi
            sleep $((attempt * 5))
          done
