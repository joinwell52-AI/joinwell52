name: Research Runtime Scheduler V3.0

on:
  schedule:
    # Offset heartbeat. Time wakes reconciliation; it does not select a stage directly.
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:
    inputs:
      runtime_task:
        description: Formal V5 Runtime task to request manually; ordered reconciliation may deny it
        required: true
        type: choice
        options:
          - discovery
          - queue
          - reading
          - analysis
          - production
          - publication
          - weekly
          - academic
          - program

permissions:
  contents: write

concurrency:
  group: research-runtime-scheduler-v3
  cancel-in-progress: false

jobs:
  schedule-runtime:
    name: Reconcile and open V5 Runtime execution slot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authoritative repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Expire stale Running leases
        id: watchdog
        shell: bash
        run: node scripts/runtime-running-watchdog.mjs

      - name: Report expired Running leases
        if: steps.watchdog.outputs.state_changed == 'true'
        run: |
          echo "Running is an execution lease, not proof of live worker progress."
          echo "Expired tasks: ${{ steps.watchdog.outputs.expired_tasks }}"
          echo "Changed records: ${{ steps.watchdog.outputs.changed_record_paths }}"

      - name: Resolve ordered Runtime work
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_TASK: ${{ inputs.runtime_task }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            node scripts/runtime-reconcile.mjs --manual "$MANUAL_TASK"
          else
            node scripts/runtime-reconcile.mjs
          fi

      - name: Report idle heartbeat
        if: steps.resolve.outputs.has_task != 'true' && steps.resolve.outputs.state_changed != 'true' && steps.watchdog.outputs.state_changed != 'true'
        run: echo "${{ steps.resolve.outputs.reason }}"

      - name: Report repaired order violation
        if: steps.resolve.outputs.state_changed == 'true'
        run: |
          echo "Ordered reconciliation repaired Runtime control-plane state."
          echo "${{ steps.resolve.outputs.reason }}"
          echo "Changed records: ${{ steps.resolve.outputs.changed_record_paths }}"

      - name: Persist Runtime Running state
        if: steps.resolve.outputs.has_task == 'true'
        id: runtime
        shell: bash
        env:
          RUNTIME_TASK: ${{ steps.resolve.outputs.runtime_task }}
          REOPEN_BLOCKED: ${{ steps.resolve.outputs.reopen_blocked }}
        run: |
          if [[ "$REOPEN_BLOCKED" == "true" ]]; then
            node scripts/runtime-v5.mjs schedule --task "$RUNTIME_TASK" --reopen-blocked true
          else
            node scripts/runtime-v5.mjs schedule --task "$RUNTIME_TASK"
          fi

      - name: Initialize same-day Research Intelligence
        if: steps.resolve.outputs.has_task == 'true'
        shell: bash
        env:
          TASK_IDS: ${{ steps.runtime.outputs.task_ids }}
          RUNTIME_DATE: ${{ steps.resolve.outputs.runtime_date }}
        run: |
          if [[ "$TASK_IDS" == *"discovery"* ]]; then
            node scripts/research-intelligence.mjs initialize --date "$RUNTIME_DATE"
          else
            echo "Research Intelligence initialization belongs to Discovery only."
          fi

      - name: Synchronize readable Runtime ledger
        if: steps.resolve.outputs.has_task == 'true' || steps.resolve.outputs.state_changed == 'true' || steps.watchdog.outputs.state_changed == 'true'
        shell: bash
        env:
          RUNTIME_DATE: ${{ steps.resolve.outputs.runtime_date }}
        run: node scripts/runtime-markdown.mjs render --date "$RUNTIME_DATE"

      - name: Validate Runtime and readable ledger
        if: steps.resolve.outputs.has_task == 'true' || steps.resolve.outputs.state_changed == 'true' || steps.watchdog.outputs.state_changed == 'true'
        shell: bash
        env:
          RUNTIME_DATE: ${{ steps.resolve.outputs.runtime_date }}
        run: |
          npm run runtime:validate
          node scripts/runtime-markdown.mjs validate --date "$RUNTIME_DATE"

      - name: Commit reconciled control-plane state
        if: steps.resolve.outputs.has_task == 'true' || steps.resolve.outputs.state_changed == 'true' || steps.watchdog.outputs.state_changed == 'true'
        id: commit
        shell: bash
        env:
          RUNTIME_TASK: ${{ steps.resolve.outputs.runtime_task }}
          RUNTIME_DATE: ${{ steps.resolve.outputs.runtime_date }}
        run: |
          git config user.name "joinwell52 Research Runtime"
          git config user.email "actions@users.noreply.github.com"
          git add research/runtime/records research/runtime/[0-9][0-9][0-9][0-9] research/intelligence

          if git diff --cached --quiet; then
            echo "Runtime control-plane state was already persisted by another scheduler heartbeat."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          label="$RUNTIME_TASK"
          if [[ "$label" == "none" || -z "$label" ]]; then label="lease-or-order-reconciliation"; fi
          git commit -m "runtime(v5): reconcile ${label} control-plane state for ${RUNTIME_DATE}"
          commit_sha="$(git rev-parse HEAD)"

          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "committed=true" >> "$GITHUB_OUTPUT"
              echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort || true
            if [[ "$attempt" -eq 3 ]]; then
              echo "Unable to publish reconciled Runtime state after three attempts."
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Verify durable reconciled state
        if: steps.commit.outputs.committed == 'true'
        shell: bash
        env:
          COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}
          RUNTIME_TASK: ${{ steps.resolve.outputs.runtime_task }}
          TASK_RECORD_PATHS: ${{ steps.runtime.outputs.record_paths }}
          CHANGED_RECORD_PATHS: ${{ steps.resolve.outputs.changed_record_paths }}
          WATCHDOG_RECORD_PATHS: ${{ steps.watchdog.outputs.changed_record_paths }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$COMMIT_SHA" origin/main

          record_paths="$TASK_RECORD_PATHS"
          if [[ -z "$record_paths" ]]; then record_paths="$CHANGED_RECORD_PATHS"; fi
          if [[ -z "$record_paths" ]]; then record_paths="$WATCHDOG_RECORD_PATHS"; fi
          record_path="${record_paths%%,*}"
          git show "$COMMIT_SHA:$record_path" > /tmp/runtime-reconciled-state.json

          node <<'NODE'
          const fs = require('fs')
          const record = JSON.parse(fs.readFileSync('/tmp/runtime-reconciled-state.json', 'utf8'))
          const requestedTask = process.env.RUNTIME_TASK
          const dependencyOf = {
            queue: 'discovery',
            reading: 'queue',
            analysis: 'reading',
            production: 'analysis',
            publication: 'production'
          }

          for (const [task, dependency] of Object.entries(dependencyOf)) {
            if (record.taskStatus?.[task] === 'Running' && record.taskStatus?.[dependency] !== 'Completed') {
              throw new Error(`Order violation remains: ${task}=Running while ${dependency}=${record.taskStatus?.[dependency]}`)
            }
          }

          if (requestedTask && requestedTask !== 'none') {
            if (record.taskStatus?.[requestedTask] !== 'Running') {
              throw new Error(`Expected taskStatus.${requestedTask}=Running, got ${record.taskStatus?.[requestedTask]}`)
            }
            const opened = record.timeline?.some((event) => event.task === requestedTask && event.event === 'Execution Slot Opened' && event.status === 'Running')
            if (!opened) throw new Error(`Missing Execution Slot Opened / Running event for ${requestedTask}`)
          }
          console.log('Verified durable ordered Runtime reconciliation state and Running lease governance.')
          NODE
