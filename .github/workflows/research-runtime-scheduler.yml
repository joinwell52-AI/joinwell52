name: Research Runtime Scheduler V3.0

on:
  schedule:
    # GitHub scheduled events can be delayed or dropped during high load at the top of an hour.
    # Open each execution slot five minutes before the formal Asia/Shanghai shift time.
    - cron: '55 0 * * *'     # Pre-open Daily 09:00 — Discovery
    - cron: '55 1 * * *'     # Pre-open Daily 10:00 — Queue
    - cron: '55 2 * * *'     # Pre-open Daily 11:00 — Reading
    - cron: '55 4 * * *'     # Pre-open Daily 13:00 — Analysis
    - cron: '55 6 * * *'     # Pre-open Daily 15:00 — Production
    - cron: '55 11 * * *'    # Pre-open Daily 20:00 — Publication
    - cron: '25 12 * * 0'    # Pre-open Sunday 20:30 — Weekly Runtime
    - cron: '55 7 * * 3'     # Pre-open Wednesday 16:00 — Academic Runtime
    - cron: '55 3 * * 1'     # Pre-open Monday 12:00 — Research Program Runtime
  workflow_dispatch:
    inputs:
      runtime_task:
        description: Formal V5 Runtime task to schedule manually
        required: true
        type: choice
        options:
          - discovery
          - queue
          - reading
          - analysis
          - production
          - publication
          - weekly
          - academic
          - program

permissions:
  contents: write

concurrency:
  group: research-runtime-scheduler-v3
  cancel-in-progress: false

jobs:
  schedule-runtime:
    name: Open V5 Runtime execution slot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authoritative repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve formal Runtime task
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_CRON: ${{ github.event.schedule }}
          MANUAL_TASK: ${{ inputs.runtime_task }}
        run: |
          if [[ "$EVENT_NAME" != "schedule" ]]; then
            task="$MANUAL_TASK"
          else
            case "$EVENT_CRON" in
              '55 0 * * *') task='discovery' ;;
              '55 1 * * *') task='queue' ;;
              '55 2 * * *') task='reading' ;;
              '55 4 * * *') task='analysis' ;;
              '55 6 * * *') task='production' ;;
              '55 11 * * *') task='publication' ;;
              '25 12 * * 0') task='weekly' ;;
              '55 7 * * 3') task='academic' ;;
              '55 3 * * 1') task='program' ;;
              *)
                echo "Unknown Scheduler V3 pre-open cron: $EVENT_CRON"
                exit 1
                ;;
            esac
          fi

          echo "runtime_task=$task" >> "$GITHUB_OUTPUT"
          echo "Resolved $EVENT_CRON to formal Runtime task: $task"

      - name: Schedule Runtime task
        id: runtime
        shell: bash
        env:
          RUNTIME_TASK: ${{ steps.resolve.outputs.runtime_task }}
        run: node scripts/runtime-v5.mjs schedule --task "$RUNTIME_TASK"

      - name: Initialize same-day Research Intelligence
        shell: bash
        env:
          TASK_IDS: ${{ steps.runtime.outputs.task_ids }}
          RUNTIME_DATE: ${{ steps.runtime.outputs.runtime_date }}
        run: |
          if [[ "$TASK_IDS" == *"discovery"* ]]; then
            node scripts/research-intelligence.mjs initialize --date "$RUNTIME_DATE"
          else
            echo "Research Intelligence initialization belongs to Discovery only."
          fi

      - name: Validate four Runtime systems
        run: npm run runtime:validate

      - name: Commit Runtime scheduling artifacts
        shell: bash
        env:
          TASK_NAMES: ${{ steps.runtime.outputs.task_names }}
          RUNTIME_DATE: ${{ steps.runtime.outputs.runtime_date }}
        run: |
          git config user.name "joinwell52 Research Runtime"
          git config user.email "actions@users.noreply.github.com"
          git add research/runtime/records research/intelligence

          if git diff --cached --quiet; then
            echo "Runtime artifacts already contain this scheduling event."
            exit 0
          fi

          git commit -m "runtime(v5): schedule ${TASK_NAMES} for ${RUNTIME_DATE}"

          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            if [[ "$attempt" -eq 3 ]]; then
              echo "Unable to publish Runtime scheduling artifacts after three attempts."
              exit 1
            fi
            sleep $((attempt * 5))
          done
