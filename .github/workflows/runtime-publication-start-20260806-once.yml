name: Runtime Publication Start 2026-08-06 Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/runtime-publication-start-20260806-once.yml

permissions:
  contents: write

jobs:
  persist-start:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Persist exactly one Publication start state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('research/runtime/records/daily/2026/08/2026-08-06-daily-runtime.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          timeline = data.setdefault('timeline', [])
          starts = [
              event for event in timeline
              if event.get('task') == 'publication'
              and event.get('event') == 'Execution Slot Opened'
              and event.get('status') == 'Running'
              and str(event.get('time', '')).startswith('2026-08-06T')
          ]
          if len(starts) != 0:
              raise SystemExit(f'expected zero existing publication start events before fallback, found {len(starts)}')
          if data.get('taskStatus', {}).get('publication') != 'Waiting':
              raise SystemExit(f"unexpected publication status: {data.get('taskStatus', {}).get('publication')}")

          data['status'] = 'Running'
          data['taskStatus']['publication'] = 'Running'
          timeline.append({
              'time': '2026-08-06T20:04:47+08:00',
              'task': 'publication',
              'event': 'Execution Slot Opened',
              'status': 'Running',
              'detail': 'Scheduler fallback: Research Runtime Publication opened because the durable control-plane Running state was absent; release work may begin only after this synchronized JSON and Markdown state is committed and verified.'
          })
          data['updatedAt'] = '2026-08-06T20:04:47+08:00'
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          node scripts/runtime-markdown.mjs render --date 2026-08-06
          node scripts/runtime-markdown.mjs validate --date 2026-08-06

          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('research/runtime/records/daily/2026/08/2026-08-06-daily-runtime.json').read_text(encoding='utf-8'))
          starts = [
              event for event in data['timeline']
              if event.get('task') == 'publication'
              and event.get('event') == 'Execution Slot Opened'
              and event.get('status') == 'Running'
              and str(event.get('time', '')).startswith('2026-08-06T')
          ]
          assert data['status'] == 'Running'
          assert data['taskStatus']['publication'] == 'Running'
          assert len(starts) == 1
          markdown = Path('research/runtime/2026/08/2026-08-06-runtime.md').read_text(encoding='utf-8')
          assert 'overall_status: "Running"' in markdown
          assert '| 20:00 | 研究运行发布 | Research Runtime Publication | daily | 工作中 / Running |' in markdown
          assert '2026-08-06T20:04:47+08:00' in markdown
          assert markdown.count('Research Runtime Publication | daily | Execution Slot Opened | 工作中 / Running') == 1
          PY

      - name: Commit fallback start state and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/runtime-publication-start-20260806-once.yml
          git config user.name "joinwell52 Research Runtime"
          git config user.email "actions@users.noreply.github.com"
          git add research/runtime/records/daily/2026/08/2026-08-06-daily-runtime.json \
            research/runtime/2026/08/2026-08-06-runtime.md \
            .github/workflows/runtime-publication-start-20260806-once.yml
          git commit -m "runtime(publication): open 2026-08-06 execution slot by scheduler fallback"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
