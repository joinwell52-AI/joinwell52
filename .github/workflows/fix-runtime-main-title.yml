name: Set Runtime main title

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-runtime-main-title.yml'

permissions:
  contents: write

jobs:
  update-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set title
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/.vitepress/theme/components/RuntimeOperationsCenter.vue')
          text = path.read_text(encoding='utf-8')
          old = "  title: '数字研究员今日工作汇报',"
          new = "  title: '数字工场运营中心',"
          if old not in text:
              raise SystemExit('title anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - run: npm install --no-audit --no-fund
      - run: npm run docs:build
      - name: Commit
        shell: bash
        run: |
          rm .github/workflows/fix-runtime-main-title.yml
          git config user.name 'joinwell52-AI Runtime'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/.vitepress/theme/components/RuntimeOperationsCenter.vue .github/workflows/fix-runtime-main-title.yml package-lock.json
          git commit -m 'fix(runtime): set operations center main title'
          git pull --rebase origin main
          git push origin HEAD:main
