name: Verify Discovery 2026-08-10 Once

on:
  push:
    branches:
      - runtime/discovery-20260810-verify
    paths:
      - .github/workflows/verify-discovery-20260810-once.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Persist verification receipt
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs')
          const resultCommit = '17dcb64e2e83173c6f5cbe6709867eb10a4e894b'
          const verifiedAt = '2026-08-10T09:19:35+08:00'
          const intelligencePath = 'research/intelligence/runs/2026/08/2026-08-10-intelligence.json'
          const runtimePath = 'research/runtime/records/daily/2026/08/2026-08-10-daily-runtime.json'

          const intelligence = JSON.parse(fs.readFileSync(intelligencePath, 'utf8'))
          intelligence.githubCommit = resultCommit
          intelligence.updatedAt = verifiedAt
          intelligence.controlPlane = {
            ...(intelligence.controlPlane || {}),
            resultCommit,
            resultCommitVerified: true,
          }
          fs.writeFileSync(intelligencePath, JSON.stringify(intelligence, null, 2) + '\n')

          const runtime = JSON.parse(fs.readFileSync(runtimePath, 'utf8'))
          runtime.githubCommit = resultCommit
          runtime.commitVerify = 'Completed'
          runtime.updatedAt = verifiedAt
          const alreadyVerified = (runtime.timeline || []).some(event =>
            event.task === 'discovery' &&
            event.event === 'GitHub Commit Verified' &&
            event.detail && event.detail.includes(resultCommit)
          )
          if (!alreadyVerified) {
            runtime.timeline.push({
              time: verifiedAt,
              task: 'discovery',
              event: 'GitHub Commit Verified',
              status: 'Completed',
              detail: `Fetched and verified durable Discovery result commit ${resultCommit}: Daily Runtime JSON, Research Intelligence run and regenerated Markdown ledger are present; exactly one Discovery Execution Slot Opened / Running event remains and all runtime-shift-result/v2 fields are preserved.`
            })
          }
          fs.writeFileSync(runtimePath, JSON.stringify(runtime, null, 2) + '\n')
          NODE

          node scripts/runtime-markdown.mjs render --date 2026-08-10
          node scripts/runtime-markdown.mjs validate --date 2026-08-10

          node <<'NODE'
          const fs = require('fs')
          const runtime = JSON.parse(fs.readFileSync('research/runtime/records/daily/2026/08/2026-08-10-daily-runtime.json', 'utf8'))
          const starts = runtime.timeline.filter(event => event.task === 'discovery' && event.event === 'Execution Slot Opened' && event.status === 'Running')
          if (starts.length !== 1) throw new Error(`expected exactly one Discovery start event, found ${starts.length}`)
          if (runtime.taskStatus.discovery !== 'Completed') throw new Error('Discovery is not Completed')
          if (runtime.commitVerify !== 'Completed') throw new Error('commitVerify is not Completed')
          if (Object.keys(runtime.results).join(',') !== 'discovery') throw new Error('unexpected non-Discovery result present')
          const result = runtime.results.discovery
          for (const key of ['input','workResult','output','next','metrics','evidence','artifacts']) {
            if (!(key in result)) throw new Error(`Discovery result missing ${key}`)
          }
          const intelligence = JSON.parse(fs.readFileSync('research/intelligence/runs/2026/08/2026-08-10-intelligence.json', 'utf8'))
          if (intelligence.signals.length !== 12) throw new Error(`expected 12 signals, found ${intelligence.signals.length}`)
          if (intelligence.columns.some(column => column.decision !== 'Waiting' || column.selectedItemId !== '')) {
            throw new Error('Discovery unexpectedly selected a topic')
          }
          NODE

      - name: Commit verification receipt and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/verify-discovery-20260810-once.yml
          git config user.name "joinwell52 Research Runtime"
          git config user.email "actions@users.noreply.github.com"
          git add research/intelligence/runs/2026/08/2026-08-10-intelligence.json \
            research/runtime/records/daily/2026/08/2026-08-10-daily-runtime.json \
            research/runtime/2026/08/2026-08-10-runtime.md \
            .github/workflows/verify-discovery-20260810-once.yml
          git commit -m "runtime(discovery): verify 2026-08-10 durable result"
          git push origin "HEAD:$GITHUB_REF_NAME"
