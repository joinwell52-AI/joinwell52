name: Recover 2026-08-18 Production Scheduled

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: recover-20260818-production-scheduled
  cancel-in-progress: true

jobs:
  recover:
    if: github.repository == 'joinwell52-AI/joinwell52'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authoritative main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fetch latest durable facts
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Stop cleanly unless same-day Production still needs finalization
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          shanghai_date="$(TZ=Asia/Shanghai date +%F)"
          if [[ "$shanghai_date" != "2026-08-18" ]]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node <<'NODE'
          const fs = require('fs')
          const record = JSON.parse(fs.readFileSync('research/runtime/records/daily/2026/08/2026-08-18-daily-runtime.json','utf8'))
          const checkpoint = JSON.parse(fs.readFileSync('research/runtime/checkpoints/2026/08/2026-08-18-production.json','utf8'))
          const needed = record.taskStatus?.production === 'Running' && checkpoint.runDate === '2026-08-18' && ['candidate-bundle-staged','validators-passed'].includes(checkpoint.node)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `needed=${needed}\n`)
          console.log(`Production recovery needed=${needed}; record=${record.taskStatus?.production}; checkpoint=${checkpoint.node}/${checkpoint.status}`)
          NODE

      - name: Install validation dependencies
        if: steps.guard.outputs.needed == 'true'
        run: npm ci

      - name: Validate recovered atomic candidate bundle
        if: steps.guard.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          DATE=2026-08-18
          CHECKPOINT=research/runtime/checkpoints/2026/08/2026-08-18-production.json
          BUNDLE_PARENT=d2aa9bba510f4fc0901a03acc88f9b3d834b8bec

          npm run runtime:production:checkpoint -- --date "$DATE" --checkpoint "$CHECKPOINT"

          tmp_index="$(mktemp)"
          rm -f "$tmp_index"
          export GIT_INDEX_FILE="$tmp_index"
          git read-tree "$BUNDLE_PARENT^{tree}"
          git add \
            research/runtime/candidates/2026/08/2026-08-18-candidates.json \
            staging/publication-candidates/2026-08-18-accountable-human-approval.zh.md \
            staging/publication-candidates/2026-08-18-accountable-human-approval.en.md \
            staging/publication-candidates/2026-08-18-accountable-human-approval-cover.png \
            staging/publication-candidates/2026-08-18-persistence-reconciliation.zh.md \
            staging/publication-candidates/2026-08-18-persistence-reconciliation.en.md \
            staging/publication-candidates/2026-08-18-persistence-reconciliation-cover.png \
            staging/publication-candidates/2026-08-18-trace-effect-evidence.zh.md \
            staging/publication-candidates/2026-08-18-trace-effect-evidence.en.md \
            staging/publication-candidates/2026-08-18-trace-effect-evidence-cover.png
          npm run publication:bundle:staged
          unset GIT_INDEX_FILE
          rm -f "$tmp_index"

          npm run publication:layout:validate
          npm run publication:editorial:validate
          npm run runtime:validate

      - name: Mark validators passed and build governed result
        if: steps.guard.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          DATE=2026-08-18
          RESULT=research/runtime/results/2026/08/2026-08-18-production-result.json
          CHECKPOINT=research/runtime/checkpoints/2026/08/2026-08-18-production.json

          node <<'NODE'
          const fs = require('fs')
          const checkpointPath = 'research/runtime/checkpoints/2026/08/2026-08-18-production.json'
          const checkpoint = JSON.parse(fs.readFileSync(checkpointPath,'utf8'))
          if (checkpoint.node === 'candidate-bundle-staged') {
            const { spawnSync } = require('child_process')
            const run = spawnSync(process.execPath, ['scripts/runtime-production-actions-bridge.mjs','--mark-validated','true','--date','2026-08-18'], {stdio:'inherit'})
            if (run.status !== 0) process.exit(run.status || 1)
          } else if (checkpoint.node !== 'validators-passed') {
            throw new Error(`Unexpected checkpoint node ${checkpoint.node}`)
          }
          NODE

          mkdir -p "$(dirname "$RESULT")"
          node <<'NODE'
          const fs = require('fs')
          const resultPath = 'research/runtime/results/2026/08/2026-08-18-production-result.json'
          const artifacts = [
            'research/runtime/candidates/2026/08/2026-08-18-candidates.json',
            'staging/publication-candidates/2026-08-18-accountable-human-approval.zh.md',
            'staging/publication-candidates/2026-08-18-accountable-human-approval.en.md',
            'staging/publication-candidates/2026-08-18-accountable-human-approval-cover.png',
            'staging/publication-candidates/2026-08-18-persistence-reconciliation.zh.md',
            'staging/publication-candidates/2026-08-18-persistence-reconciliation.en.md',
            'staging/publication-candidates/2026-08-18-persistence-reconciliation-cover.png',
            'staging/publication-candidates/2026-08-18-trace-effect-evidence.zh.md',
            'staging/publication-candidates/2026-08-18-trace-effect-evidence.en.md',
            'staging/publication-candidates/2026-08-18-trace-effect-evidence-cover.png'
          ]
          const result = {
            schema: 'runtime-shift-result/v2',
            task: 'production',
            family: 'daily',
            runtimeDate: '2026-08-18',
            status: 'Completed',
            productionMode: 'candidate-batch',
            input: {
              promptVersion: '2.13.0',
              promptPath: 'research/runtime/worker-prompts/generated/production.prompt.md',
              promptSha256: 'd8b0cd52d22d976d6356558a23c5c2dc28ed5aa8f51793538fa8fbebfb80996f',
              researchObjects: ['Q-20260818-01','Q-20260818-02','Q-20260818-03'],
              stagedCandidateCommit: '513afe38c6f43c54e31ece624dcf13745789e08e'
            },
            workResult: {
              summary: 'Recovered the already-complete 3/3 same-date Production batch at its stranded final stage, validated the canonical bilingual candidate bundle and baseline raster covers through the governed Production validators, and prepared the terminal result without executing Publication.',
              summary_zh: '从此前卡住的最终阶段恢复同日已完成的 3/3 Production 批次，通过受治理的 Production 验证器核验规范双语 Candidate Bundle 与基础栅格题图，并在不执行 Publication 的前提下准备终态结果。'
            },
            output: {
              type: 'Publication Candidates',
              candidateBatch: 'research/runtime/candidates/2026/08/2026-08-18-candidates.json',
              candidateCount: 3,
              bilingualArticleFiles: 6,
              coverAssets: 3,
              inlineFigureAssets: 0
            },
            next: {
              task: 'publication',
              instruction: 'Do not execute Publication in this recovery. Publication may act only at its own governed execution opportunity after this Production result is durably finalized and verified on main.',
              instruction_zh: '本次恢复不执行 Publication。仅在本次 Production 结果完成受治理的持久化并在 main 上核验后，Publication 才可在自己的正式执行机会中行动。'
            },
            coverEvidence: [
              {
                itemId: 'Q-20260818-01',
                briefId: '2026-08-18:Q-20260818-01-baseline-cover',
                coverPath: 'staging/publication-candidates/2026-08-18-accountable-human-approval-cover.png',
                sanitizedPrompt: 'A sealed provenance gate separating delegated origin from accountable human authorization',
                generationAttempts: 1,
                semanticReview: 'PASS',
                coverRole: 'baseline',
                generator: 'deterministic-baseline-v1'
              },
              {
                itemId: 'Q-20260818-02',
                briefId: '2026-08-18:Q-20260818-02-baseline-cover',
                coverPath: 'staging/publication-candidates/2026-08-18-persistence-reconciliation-cover.png',
                sanitizedPrompt: 'Durable state beside a separate reconciliation signal that reactivates pending work',
                generationAttempts: 1,
                semanticReview: 'PASS',
                coverRole: 'baseline',
                generator: 'deterministic-baseline-v1'
              },
              {
                itemId: 'Q-20260818-03',
                briefId: '2026-08-18:Q-20260818-03-baseline-cover',
                coverPath: 'staging/publication-candidates/2026-08-18-trace-effect-evidence-cover.png',
                sanitizedPrompt: 'A closed tracing path beside a separate external effect receipt with stable correlation identity',
                generationAttempts: 1,
                semanticReview: 'PASS',
                coverRole: 'baseline',
                generator: 'deterministic-baseline-v1'
              }
            ],
            metrics: [
              {name:'research_objects_consumed',value:3},
              {name:'publication_candidates',value:3},
              {name:'persisted_article_segments',value:3},
              {name:'planning_artifacts',value:9},
              {name:'bilingual_article_files',value:6},
              {name:'cover_assets',value:3},
              {name:'inline_figure_assets',value:0},
              {name:'revision_rounds',value:0},
              {name:'direct_cloud_image_generation_calls',value:0},
              {name:'direct_publication_actions',value:0}
            ],
            evidence: [
              '513afe38c6f43c54e31ece624dcf13745789e08e',
              'research/runtime/worker-prompts/generated/production.prompt.md',
              'research/runtime/checkpoints/2026/08/2026-08-18-production.json',
              'research/runtime/wakes/2026/08/2026-08-18/production-163854.json'
            ],
            artifacts
          }
          fs.writeFileSync(resultPath, JSON.stringify(result, null, 2) + '\n')
          NODE

          npm run runtime:production:checkpoint -- --date "$DATE" --checkpoint "$CHECKPOINT"
          npm run runtime:production:proof -- --date "$DATE" --result "$RESULT"
          npm run runtime:validate

      - name: Persist validators-passed checkpoint and result
        if: steps.guard.outputs.needed == 'true'
        id: persist
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'joinwell52 Research Runtime'
          git config user.email 'actions@users.noreply.github.com'
          git add research/runtime/checkpoints/2026/08/2026-08-18-production.json research/runtime/results/2026/08/2026-08-18-production-result.json
          if git diff --cached --quiet; then
            echo 'No recovery changes to persist.'
          else
            git commit -m 'runtime(production): validate recovered 2026-08-18 candidate batch'
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                break
              fi
              git rebase --abort || true
              if [[ "$attempt" -eq 3 ]]; then exit 1; fi
              sleep $((attempt * 5))
            done
          fi
          git fetch origin main
          git reset --hard origin/main
          node -e "const c=require('./research/runtime/checkpoints/2026/08/2026-08-18-production.json'); if(c.node!=='validators-passed'||c.status!=='Completed') process.exit(1)"
          node -e "const r=require('./research/runtime/results/2026/08/2026-08-18-production-result.json'); if(r.status!=='Completed'||r.runtimeDate!=='2026-08-18') process.exit(1)"

      - name: Dispatch official Runtime Shift Finalization V2.1
        if: steps.guard.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const url = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/actions/workflows/research-runtime-shift-completion.yml/dispatches`
          const response = await fetch(url, {
            method: 'POST',
            headers: {
              authorization: `Bearer ${process.env.GH_TOKEN}`,
              accept: 'application/vnd.github+json',
              'x-github-api-version': '2022-11-28',
              'content-type': 'application/json'
            },
            body: JSON.stringify({
              ref: 'main',
              inputs: {
                runtime_task: 'production',
                runtime_date: '2026-08-18',
                result_path: 'research/runtime/results/2026/08/2026-08-18-production-result.json',
                allow_historical: 'false'
              }
            })
          })
          if (!response.ok) throw new Error(`Finalization dispatch failed ${response.status}: ${await response.text()}`)
          console.log('Dispatched Research Runtime Shift Finalization V2.1 for production 2026-08-18.')
          NODE
