name: Restore Reading Ledger 2026-08-08 Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/restore-reading-ledger-20260808-once.yml

permissions:
  contents: write

jobs:
  restore-ledger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore verified detailed ledger projection
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          verified_commit="6869fcbaa37c578622403f7b665f4a47aac29771"
          ledger="research/runtime/2026/08/2026-08-08-runtime.md"
          record="research/runtime/records/daily/2026/08/2026-08-08-daily-runtime.json"

          # JSON is already the verified authority. Restore the detailed Markdown
          # projection from the same verified Reading commit after the generic
          # synchronizer collapsed structured fields to [object Object].
          node <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('research/runtime/records/daily/2026/08/2026-08-08-daily-runtime.json','utf8'));
          const starts=(r.timeline||[]).filter(e=>e.task==='reading'&&e.event==='Execution Slot Opened'&&e.status==='Running'&&String(e.time||'').startsWith('2026-08-08'));
          const verified=(r.timeline||[]).filter(e=>e.task==='reading'&&e.event==='GitHub Commit Verified'&&e.status==='Completed'&&String(e.time||'').startsWith('2026-08-08'));
          if(r.taskStatus?.reading!=='Completed') throw new Error('Reading not Completed');
          if(r.results?.reading?.schema!=='runtime-shift-result/v2') throw new Error('Reading result contract missing');
          if(r.githubCommit!=='fb3e3b069651e82bcd044fc1561b6e90dc8e849b') throw new Error(`Unexpected verified result commit ${r.githubCommit}`);
          if(r.commitVerify!=='Completed') throw new Error(`commitVerify=${r.commitVerify}`);
          if(starts.length!==1) throw new Error(`Reading start count=${starts.length}`);
          if(verified.length!==1) throw new Error(`Reading verification count=${verified.length}`);
          NODE

          git cat-file -e "${verified_commit}^{commit}"
          git show "${verified_commit}:${ledger}" > "$ledger"
          grep -q 'github_commit: "fb3e3b069651e82bcd044fc1561b6e90dc8e849b"' "$ledger"
          grep -q 'commit_verify: "Completed"' "$ledger"
          grep -q 'Result Contract.*runtime-shift-result/v2' "$ledger"
          grep -q 'Q-20260808-01' "$ledger"
          grep -q 'Q-20260808-02' "$ledger"
          grep -q 'Q-20260808-03' "$ledger"
          grep -q 'GitHub Commit Verified' "$ledger"
          if grep -q '\[object Object\]' "$ledger"; then
            echo 'Detailed result projection was not restored.' >&2
            exit 1
          fi
          test "$(grep -c '| 研究运行阅读 / Research Runtime Reading | daily | Execution Slot Opened | 工作中 / Running |' "$ledger")" -eq 1
          test "$(grep -c '| 研究运行阅读 / Research Runtime Reading | daily | GitHub Commit Verified | 已完成 / Completed |' "$ledger")" -eq 1
          git diff --check

          rm -f .github/workflows/restore-reading-ledger-20260808-once.yml
          git config user.name "joinwell52 Research Runtime"
          git config user.email "actions@users.noreply.github.com"
          git add "$ledger" .github/workflows/restore-reading-ledger-20260808-once.yml
          git commit -m "runtime(reading): restore detailed 2026-08-08 ledger projection"
          git pull --rebase origin main
          git push origin HEAD:main
