          const completed = record.timeline.filter((event) => event.task === 'analysis' && event.event === 'Analysis Completed' && event.status === 'Completed' && event.time.startsWith('2026-08-06T'))
          if (record.taskStatus.analysis !== 'Completed') throw new Error('analysis is not Completed')
          if (record.results.analysis?.schema !== 'runtime-shift-result/v2') throw new Error('Analysis result contract missing')
          if (starts.length !== 1) throw new Error(`Analysis start event count ${starts.length}`)
          if (completed.length !== 1) throw new Error(`Analysis completed event count ${completed.length}`)
          if (record.results.analysis.artifacts.filter((a) => a.path?.startsWith('research/analysis/')).length !== 3) throw new Error('expected three Research Object artifacts')
          NODE

      - name: Commit final Analysis artifacts to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "joinwell52 Research Runtime"
          git config user.email "actions@users.noreply.github.com"
          git add research/analysis/Q-20260806-01-revisable-dag-computer-use.md \
                  research/analysis/Q-20260806-02-enterprise-agent-control-plane.md \
                  research/analysis/Q-20260806-03-rollout-migration-recovery.md \
                  research/runtime/records/daily/2026/08/2026-08-06-daily-runtime.json \
                  research/runtime/2026/08/2026-08-06-runtime.md
          git commit -m "runtime(analysis): complete 2026-08-06 Research Analysis"
          git pull --rebase origin main
          git push origin HEAD:main
