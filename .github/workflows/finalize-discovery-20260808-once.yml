name: Finalize Discovery 2026-08-08 Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-discovery-20260808-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main with history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify canonical start and result snapshots
        shell: bash
        run: |
          set -euo pipefail
          START_COMMIT="266182de7728b7c3cdb3511b7236e12e8bea95da"
          RESULT_COMMIT="81618569508957fd4cd8517d91ca89e8eac1c093"
          DAILY="research/runtime/records/daily/2026/08/2026-08-08-daily-runtime.json"
          LEDGER="research/runtime/2026/08/2026-08-08-runtime.md"
          INTEL="research/intelligence/runs/2026/08/2026-08-08-intelligence.json"

          git cat-file -e "$START_COMMIT^{commit}"
          git cat-file -e "$RESULT_COMMIT^{commit}"
          git show "$START_COMMIT:$DAILY" > /tmp/start-daily.json
          git show "$START_COMMIT:$LEDGER" > /tmp/start-ledger.md
          git show "$RESULT_COMMIT:$DAILY" > /tmp/result-daily.json
          git show "$RESULT_COMMIT:$LEDGER" > /tmp/result-ledger.md
          git show "$RESULT_COMMIT:$INTEL" > /tmp/result-intel.json

          node <<'NODE'
          const fs = require('fs');
          const start = JSON.parse(fs.readFileSync('/tmp/start-daily.json','utf8'));
          const current = JSON.parse(fs.readFileSync('research/runtime/records/daily/2026/08/2026-08-08-daily-runtime.json','utf8'));
          const result = JSON.parse(fs.readFileSync('/tmp/result-daily.json','utf8'));
          const intel = JSON.parse(fs.readFileSync('/tmp/result-intel.json','utf8'));
          const starts = (start.timeline || []).filter(e => e.task === 'discovery' && e.event === 'Execution Slot Opened' && e.status === 'Running');
          if (start.status !== 'Running') throw new Error('start snapshot overall status is not Running');
          if (start.taskStatus?.discovery !== 'Running') throw new Error('start snapshot discovery is not Running');
          if (starts.length !== 1) throw new Error(`start snapshot has ${starts.length} start events, expected exactly 1`);
          const currentStarts = (current.timeline || []).filter(e => e.task === 'discovery' && e.event === 'Execution Slot Opened' && e.status === 'Running');
          if (currentStarts.length !== 1) throw new Error(`current record has ${currentStarts.length} start events, expected exactly 1`);
          if (current.taskStatus?.discovery !== 'Completed' || current.results?.discovery?.status !== 'Completed') throw new Error('current Discovery result is not Completed');
          if (result.results?.discovery?.schema !== 'runtime-shift-result/v2') throw new Error('result commit is missing runtime-shift-result/v2 Discovery');
          for (const key of ['input','workResult','output','next','metrics','evidence','artifacts']) {
            if (result.results.discovery[key] == null) throw new Error(`result commit Discovery missing ${key}`);
          }
          if (intel.signals?.length !== 16) throw new Error(`result intelligence has ${intel.signals?.length} signals, expected 16`);
          if ((intel.columns || []).some(c => c.decision !== 'Waiting' || c.selectedItemId)) throw new Error('Discovery artifact contains a Queue selection');
          if (!intel.controlPlane?.verifiedBeforeSubstantiveWork || intel.controlPlane?.startEventCount !== 1) throw new Error('intelligence control-plane verification is incomplete');
          NODE

          grep -q 'overall_status: "Running"' /tmp/start-ledger.md
          test "$(grep -c 'Execution Slot Opened | 工作中 / Running' /tmp/start-ledger.md)" -eq 1
          grep -q 'Result Contract.*runtime-shift-result/v2' /tmp/result-ledger.md
          grep -q 'Signal Count.*16' /tmp/result-ledger.md

      - name: Finalize verification state and regenerate readable ledger
        shell: bash
        run: |
          set -euo pipefail
          export RESULT_COMMIT="81618569508957fd4cd8517d91ca89e8eac1c093"
          export NOW="$(TZ=Asia/Shanghai date '+%Y-%m-%dT%H:%M:%S+08:00')"
          export DAILY="research/runtime/records/daily/2026/08/2026-08-08-daily-runtime.json"
          export LEDGER="research/runtime/2026/08/2026-08-08-runtime.md"
          export INTEL="research/intelligence/runs/2026/08/2026-08-08-intelligence.json"

          node <<'NODE'
          const fs = require('fs');
          const {RESULT_COMMIT, NOW, DAILY, INTEL} = process.env;
          const daily = JSON.parse(fs.readFileSync(DAILY, 'utf8'));
          const intel = JSON.parse(fs.readFileSync(INTEL, 'utf8'));

          const startEvents = (daily.timeline || []).filter(e => e.task === 'discovery' && e.event === 'Execution Slot Opened' && e.status === 'Running');
          if (startEvents.length !== 1) throw new Error('Refusing to finalize: start-event count is not exactly one');
          const verifyEvents = (daily.timeline || []).filter(e => e.task === 'discovery' && e.event === 'GitHub Commit Verified');
          if (verifyEvents.length > 1) throw new Error('Refusing to finalize: duplicate verification events already exist');

          daily.githubCommit = RESULT_COMMIT;
          daily.commitVerify = 'Completed';
          daily.updatedAt = NOW;
          if (verifyEvents.length === 0) {
            daily.timeline.push({
              time: NOW,
              task: 'discovery',
              event: 'GitHub Commit Verified',
              status: 'Completed',
              detail: `Fetched and verified Discovery result commit ${RESULT_COMMIT}: the Research Intelligence run, Daily Runtime JSON, and synchronized detailed Markdown ledger are present; exactly one current-day start event remains. This idempotent re-entry did not append a second start event or rerun the already-completed source pass.`
            });
          }

          intel.githubCommit = RESULT_COMMIT;
          intel.updatedAt = NOW;
          intel.controlPlane = intel.controlPlane || {};
          intel.controlPlane.resultCommit = RESULT_COMMIT;
          intel.controlPlane.resultCommitVerified = true;
          intel.controlPlane.idempotentReentry = true;
          intel.controlPlane.idempotentReentryNote = 'A same-day completed Discovery already existed when the later automation invocation entered. The canonical start snapshot and result artifacts were fetched and verified; no duplicate start event, second start-state commit, or second source-retrieval pass was created.';

          fs.writeFileSync(DAILY, JSON.stringify(daily, null, 2) + '\n');
          fs.writeFileSync(INTEL, JSON.stringify(intel, null, 2) + '\n');
          NODE

          # Regenerate from the verified result snapshot that preserves every runtime-shift-result/v2 field.
          git show "$RESULT_COMMIT:$LEDGER" > "$LEDGER"
          python3 - <<'PY'
          import os, pathlib
          p = pathlib.Path(os.environ['LEDGER'])
          s = p.read_text()
          result = os.environ['RESULT_COMMIT']
          now = os.environ['NOW']
          s = s.replace('github_commit: "pending"', f'github_commit: "{result}"', 1)
          s = s.replace('commit_verify: "Running"', 'commit_verify: "Completed"', 1)
          s = s.replace('updated_at: "2026-08-08T09:09:13+08:00"', f'updated_at: "{now}"', 1)
          s = s.replace('- **GitHub Commit:** pending', f'- **GitHub Commit:** {result}', 1)
          s = s.replace('- **Commit Verify:** 工作中 / Running', '- **Commit Verify:** 已完成 / Completed', 1)
          s = s.replace('- **最后更新 / Updated:** 2026-08-08T09:09:13+08:00', f'- **最后更新 / Updated:** {now}', 1)
          needle = '| 2026-08-08T09:09:13+08:00 | 研究运行发现 / Research Runtime Discovery | daily | Discovery Completed | 已完成 / Completed | Three formal intelligence profiles completed with explicit coverage outcomes; 16 normalized signals were written to the Signal Pool. Queue triage, Deep Reading, analysis and article writing were not performed. |'
          row = f'| {now} | 研究运行发现 / Research Runtime Discovery | daily | GitHub Commit Verified | 已完成 / Completed | Fetched and verified Discovery result commit {result}: Research Intelligence run, Daily Runtime JSON, and synchronized detailed Markdown ledger are present; exactly one current-day start event remains. This idempotent re-entry did not append a second start event or rerun the already-completed source pass. |'
          if row not in s:
              if needle not in s:
                  raise SystemExit('Discovery Completed timeline row not found in verified result ledger')
              s = s.replace(needle, needle + '\n' + row, 1)
          p.write_text(s)
          PY

          # Required integrity checks: detailed v2 fields must remain human-readable, not coerced objects.
          grep -q 'Result Contract.*runtime-shift-result/v2' "$LEDGER"
          grep -q '### Input' "$LEDGER"
          grep -q '### Work Result' "$LEDGER"
          grep -q '### Output' "$LEDGER"
          grep -q '### Next' "$LEDGER"
          grep -q '### Metrics' "$LEDGER"
          grep -q '### Evidence' "$LEDGER"
          grep -q '### Artifacts' "$LEDGER"
          ! grep -q '\[object Object\]' "$LEDGER"
          test "$(grep -c 'Execution Slot Opened | 工作中 / Running' "$LEDGER")" -eq 1
          test "$(grep -c 'GitHub Commit Verified | 已完成 / Completed' "$LEDGER")" -eq 1
          node -e "JSON.parse(require('fs').readFileSync(process.env.DAILY,'utf8')); JSON.parse(require('fs').readFileSync(process.env.INTEL,'utf8'));"
          git diff --check

      - name: Commit final durable verification to main
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-discovery-20260808-once.yml
          git config user.name "joinwell52 Research Runtime"
          git config user.email "actions@users.noreply.github.com"
          git add \
            research/intelligence/runs/2026/08/2026-08-08-intelligence.json \
            research/runtime/records/daily/2026/08/2026-08-08-daily-runtime.json \
            research/runtime/2026/08/2026-08-08-runtime.md \
            .github/workflows/finalize-discovery-20260808-once.yml
          git commit -m "runtime(discovery): verify durable 2026-08-08 artifacts"
          git push origin HEAD:main
