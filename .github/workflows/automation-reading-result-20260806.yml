name: Automation Reading Result 2026-08-06

on:
  push:
    branches:
      - automation/reading-20260806-result
    paths:
      - .github/workflows/automation-reading-result-20260806.yml

permissions:
  contents: write

jobs:
  persist-reading-result:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Import durable Reading Records from the automation commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_SHA"
          mkdir -p research/reading
          for path in \
            research/reading/Q-20260806-01-revisable-dag-computer-use.md \
            research/reading/Q-20260806-02-enterprise-agent-control-plane.md \
            research/reading/Q-20260806-03-rollout-migration-recovery.md
          do
            git show "$GITHUB_SHA:$path" > "$path"
            test -s "$path"
          done

      - name: Complete only the Reading shift
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs')
          const recordPath = 'research/runtime/records/daily/2026/08/2026-08-06-daily-runtime.json'
          const planPath = 'research/runtime/plans/2026/08/2026-08-06-plan.json'
          const record = JSON.parse(fs.readFileSync(recordPath, 'utf8'))
          const plan = JSON.parse(fs.readFileSync(planPath, 'utf8'))

          const starts = (record.timeline || []).filter((event) =>
            event.task === 'reading' &&
            event.event === 'Execution Slot Opened' &&
            event.status === 'Running' &&
            String(event.time || '').startsWith('2026-08-06')
          )
          if (record.status !== 'Running' || record.taskStatus?.reading !== 'Running' || starts.length !== 1) {
            throw new Error(`Reading control-plane gate failed: overall=${record.status}, reading=${record.taskStatus?.reading}, starts=${starts.length}`)
          }
          if (record.taskStatus?.queue !== 'Completed' || record.results?.queue?.status !== 'Completed' || plan.status !== 'Completed') {
            throw new Error('Queue is incomplete; Reading must be Blocked rather than executed')
          }
          const selected = (plan.columns || []).filter((column) => column.selectionStatus === 'Selected')
          const expected = ['Q-20260806-01', 'Q-20260806-02', 'Q-20260806-03']
          if (selected.length !== 3 || JSON.stringify(selected.map((column) => column.itemId)) !== JSON.stringify(expected)) {
            throw new Error(`Expected exactly the three selected same-day objects, found ${selected.map((column) => column.itemId).join(',')}`)
          }
          if ((record.timeline || []).some((event) => event.task === 'reading' && event.event === 'Reading Completed')) {
            throw new Error('Reading Completed event already exists; refusing duplicate execution')
          }

          const parts = Object.fromEntries(new Intl.DateTimeFormat('en-CA', {
            timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit',
            hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23'
          }).formatToParts(new Date()).map((part) => [part.type, part.value]))
          const timestamp = `${parts.year}-${parts.month}-${parts.day}T${parts.hour}:${parts.minute}:${parts.second}+08:00`
          if (!timestamp.startsWith('2026-08-06T')) throw new Error(`unexpected runtime date ${timestamp}`)

          record.taskStatus.reading = 'Completed'
          record.results.reading = {
            schema: 'runtime-shift-result/v2',
            task: 'reading',
            status: 'Completed',
            input: 'The durably verified Scheduler-fallback Reading start state in commit 637bfe54751b3aa6363add407deb916615c2135b, Research Runtime Scheduler V3.0, Skill 03 Deep Reading, and the completed 2026-08-06 Research Plan containing exactly three Selected objects: Q-20260806-01, Q-20260806-02 and Q-20260806-03.',
            input_zh: '提交 637bfe54751b3aa6363add407deb916615c2135b 中已持久化核验的 Reading Scheduler 回退启动状态、Research Runtime Scheduler V3.0、Skill 03 深度阅读，以及包含且仅包含三个 Selected 对象 Q-20260806-01、Q-20260806-02 与 Q-20260806-03 的已完成 2026-08-06 Research Plan。',
            workResult: 'Executed Skill 03 only for all three same-day Selected objects. Read primary and authoritative research, product and code sources; extracted facts, research results or vendor claims, mechanisms, evidence, limitations, comparisons, contradictions, unresolved questions and source traceability. One oversized arXiv PDF retrieval limitation was explicitly recorded and supplemented with the arXiv record, indexed full text, author project page and official repository. No Research Analysis, recommendations, article drafting, Production or Publication work was performed.',
            workResult_zh: '仅对三个当日 Selected 对象执行 Skill 03。已阅读主要及权威的研究、产品与代码来源，并提取事实、研究结果或厂商主张、机制、证据、限制、比较、矛盾、未决问题与来源追溯。一个超大 arXiv PDF 抓取限制已明确记录，并以 arXiv 记录、索引全文、作者项目页与官方仓库补充；未开展 Research Analysis、建议、文章撰写、Production 或 Publication。',
            output: 'Three durable Reading Records: revisable DAG orchestration for multi-agent computer use; enterprise policy, permission, sandbox, fallback and resume boundaries in Claude Code v2.1.223; and semantic legacy rollout migration with bounded subagent replay and journaled recovery in openai/codex.',
            output_zh: '已形成三份持久化 Reading Record：多 Agent 计算机操作的可修订 DAG 编排；Claude Code v2.1.223 中的企业策略、权限、沙箱、回退与恢复边界；以及 openai/codex 中采用有界子 Agent 重放和日志恢复的旧版 Rollout 语义迁移。',
            next: 'Research Runtime Analysis may consume only these three Reading Records and must preserve their evidence classes, contradictions, access limitation and unresolved boundaries. Reading itself must not be expanded into analysis or publication text.',
            next_zh: 'Research Runtime Analysis 只能消费这三份 Reading Record，并必须保留其中的证据类别、矛盾、访问限制与未决边界；Reading 本身不得扩展为分析或出版文本。',
            metrics: [
              { label: 'Selected objects consumed', label_zh: '已消费 Selected 对象', value: '3' },
              { label: 'Durable Reading Results', label_zh: '持久化 Reading Result', value: '3' },
              { label: 'Columns completed', label_zh: '已完成栏目', value: '3 / 3' },
              { label: 'Explicit source-access limitations', label_zh: '明确记录的来源访问限制', value: '1' },
              { label: 'Research Analysis objects', label_zh: 'Research Analysis 对象', value: '0' },
              { label: 'Article drafts', label_zh: '文章草稿', value: '0' }
            ],
            evidence: [
              { label: 'Scheduler V3.0', label_zh: 'Scheduler V3.0', source: 'research/runtime/SCHEDULER.json' },
              { label: 'Verified Reading fallback start commit', label_zh: '已核验的 Reading 回退启动提交', commit: '637bfe54751b3aa6363add407deb916615c2135b', source: 'https://github.com/joinwell52-AI/joinwell52/commit/637bfe54751b3aa6363add407deb916615c2135b' },
              { label: "Today's Research Plan", label_zh: '今日研究计划', source: 'research/runtime/plans/2026/08/2026-08-06-plan.json' },
              { label: 'Skill 03 Deep Reading', label_zh: 'Skill 03 深度阅读', source: 'research/skills/03-deep-reading.md' },
              { label: 'Multi-Agent Computer Use arXiv record', label_zh: 'Multi-Agent Computer Use arXiv 记录', source: 'https://arxiv.org/abs/2606.01533' },
              { label: 'Multi-Agent Computer Use official repository', label_zh: 'Multi-Agent Computer Use 官方仓库', source: 'https://github.com/kohjingyu/multi-agent-computer-use' },
              { label: 'Claude Code v2.1.223 official release', label_zh: 'Claude Code v2.1.223 官方发布', source: 'https://github.com/anthropics/claude-code/releases/tag/v2.1.223' },
              { label: 'Claude Code official security and settings documentation', label_zh: 'Claude Code 官方安全与设置文档', source: 'https://docs.anthropic.com/en/docs/claude-code/settings' },
              { label: 'openai/codex semantic migration commit', label_zh: 'openai/codex 语义迁移提交', commit: 'aac9f842473ac6a05d417dd76ce8b89bdb3b707d', source: 'https://github.com/openai/codex/commit/aac9f842473ac6a05d417dd76ce8b89bdb3b707d' },
              { label: 'openai/codex merged migration PR', label_zh: 'openai/codex 已合并迁移 PR', source: 'https://github.com/openai/codex/pull/37191' }
            ],
            artifacts: [
              { label: 'Digital Employee Reading Record', label_zh: '数字员工 Reading Record', path: 'research/reading/Q-20260806-01-revisable-dag-computer-use.md' },
              { label: 'Industry Architecture Reading Record', label_zh: '行业架构 Reading Record', path: 'research/reading/Q-20260806-02-enterprise-agent-control-plane.md' },
              { label: 'Open-source Engineering Reading Record', label_zh: '开源工程 Reading Record', path: 'research/reading/Q-20260806-03-rollout-migration-recovery.md' },
              { label: 'Daily Runtime Record', label_zh: '每日运行机器记录', path: recordPath },
              { label: 'Human-readable Runtime ledger', label_zh: '人类可读运行账本', path: 'research/runtime/2026/08/2026-08-06-runtime.md' }
            ]
          }
          record.timeline.push({
            time: timestamp,
            task: 'reading',
            event: 'Reading Completed',
            status: 'Completed',
            detail: 'Skill 03 completed all three same-day Selected objects after verified Scheduler-fallback start commit 637bfe54751b3aa6363add407deb916615c2135b; three Reading Records were persisted with source traceability and no Research Analysis or article drafting.'
          })
          record.status = 'Waiting'
          record.githubCommit = 'pending'
          record.commitVerify = 'Waiting'
          record.updatedAt = timestamp
          fs.writeFileSync(recordPath, JSON.stringify(record, null, 2) + '\n')
          NODE

          node scripts/runtime-markdown.mjs render --date 2026-08-06
          node scripts/runtime-v5.mjs validate
          node scripts/runtime-markdown.mjs validate --date 2026-08-06
          git diff --check

          node - <<'NODE'
          const fs = require('fs')
          const r = JSON.parse(fs.readFileSync('research/runtime/records/daily/2026/08/2026-08-06-daily-runtime.json', 'utf8'))
          const starts = r.timeline.filter(e => e.task === 'reading' && e.event === 'Execution Slot Opened' && e.status === 'Running' && String(e.time).startsWith('2026-08-06'))
          const completed = r.timeline.filter(e => e.task === 'reading' && e.event === 'Reading Completed' && e.status === 'Completed')
          if (starts.length !== 1 || completed.length !== 1 || r.taskStatus.reading !== 'Completed' || r.results.reading?.schema !== 'runtime-shift-result/v2') {
            throw new Error('post-render Reading verification failed')
          }
          for (const path of r.results.reading.artifacts.slice(0, 3).map(a => a.path)) {
            if (!fs.existsSync(path) || fs.statSync(path).size === 0) throw new Error(`missing Reading artifact ${path}`)
          }
          NODE

      - name: Commit final Reading artifacts separately to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "joinwell52 Research Runtime"
          git config user.email "actions@users.noreply.github.com"
          git add \
            research/reading/Q-20260806-01-revisable-dag-computer-use.md \
            research/reading/Q-20260806-02-enterprise-agent-control-plane.md \
            research/reading/Q-20260806-03-rollout-migration-recovery.md \
            research/runtime/records/daily/2026/08/2026-08-06-daily-runtime.json \
            research/runtime/2026/08/2026-08-06-runtime.md
          git commit -m "runtime(reading): complete 2026-08-06 Deep Reading"
          git push origin HEAD:main
