<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Acceptance and persistence handoff</title>
  <desc id="desc">An editorial visual of a luminous token crossing from an immediate acceptance field toward a deeper durable record, separated by a narrow dark gap.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#172f47"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#f7fbff" stop-opacity=".95"/><stop offset=".35" stop-color="#83d7ff" stop-opacity=".75"/><stop offset="1" stop-color="#2c89be" stop-opacity="0"/></radialGradient>
    <linearGradient id="bridge" x1="0" x2="1"><stop offset="0" stop-color="#7bdcff" stop-opacity=".9"/><stop offset="1" stop-color="#d7f2ff" stop-opacity=".28"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="370" cy="440" r="245" fill="url(#glow)"/>
  <circle cx="365" cy="438" r="62" fill="#f4fbff" opacity=".95"/>
  <path d="M455 438 C650 365 770 365 955 438 C1090 492 1195 520 1325 500" fill="none" stroke="url(#bridge)" stroke-width="24" stroke-linecap="round"/>
  <path d="M970 240 C1135 245 1305 332 1370 470 C1310 630 1130 690 970 662 C1042 570 1043 344 970 240Z" fill="#dcefff" opacity=".12"/>
  <path d="M1008 278 C1150 286 1265 355 1312 472 C1261 582 1145 625 1016 607 C1066 518 1066 370 1008 278Z" fill="#dcefff" opacity=".17"/>
  <rect x="120" y="112" width="1360" height="676" rx="42" fill="none" stroke="#dff5ff" stroke-opacity=".12" stroke-width="2"/>
  <text x="120" y="790" font-family="Inter,Arial,sans-serif" font-size="22" letter-spacing="4" fill="#d7edfb" opacity=".62">RESEARCH CENTER · DURABLE WORK HANDOFF</text>
</svg>
