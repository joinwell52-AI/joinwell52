  <circle cx="438" cy="623" r="28" fill="#e5fff0"/>
  <circle cx="842" cy="665" r="24" fill="#e4f8ff"/>
  <circle cx="1282" cy="570" r="26" fill="#e7fff2"/>
  <rect x="120" y="112" width="1360" height="676" rx="42" fill="none" stroke="#d9fff3" stroke-opacity=".12" stroke-width="2"/>
  <text x="120" y="790" font-family="Inter,Arial,sans-serif" font-size="22" letter-spacing="4" fill="#d9f9f0" opacity=".62">RESEARCH CENTER · SCOPED OWNERSHIP / CONCURRENCY</text>
