    <radialGradient id="g2"><stop offset="0" stop-color="#f1fbff"/><stop offset=".32" stop-color="#8ddcff"/><stop offset="1" stop-color="#399bc8" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="420" cy="410" r="215" fill="url(#g1)" opacity=".55"/>
  <circle cx="820" cy="490" r="180" fill="url(#g2)" opacity=".48"/>
  <circle cx="1190" cy="350" r="195" fill="url(#g1)" opacity=".42"/>
