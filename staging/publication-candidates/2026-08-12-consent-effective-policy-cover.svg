<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Consent and effective policy</title>
  <desc id="desc">An editorial visual of a bright consent seal passing through a dark aperture and emerging as a narrower, durable field, emphasizing the difference between requested intent and effective scope.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#120c24"/><stop offset="1" stop-color="#243451"/></linearGradient>
    <radialGradient id="seal"><stop offset="0" stop-color="#fff6e8"/><stop offset=".38" stop-color="#ffd08a"/><stop offset="1" stop-color="#f39a54" stop-opacity="0"/></radialGradient>
    <linearGradient id="beam" x1="0" x2="1"><stop offset="0" stop-color="#ffcf88" stop-opacity=".9"/><stop offset=".48" stop-color="#e6b9ff" stop-opacity=".42"/><stop offset="1" stop-color="#82d7ff" stop-opacity=".18"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="420" cy="430" r="235" fill="url(#seal)"/>
  <circle cx="420" cy="430" r="72" fill="#fff7ea" opacity=".94"/>
  <path d="M545 355 L910 355 L1015 430 L910 505 L545 505 Z" fill="url(#beam)" opacity=".62"/>
  <path d="M900 190 C1015 238 1074 330 1074 430 C1074 532 1015 625 900 672 C953 591 973 510 973 430 C973 350 953 270 900 190Z" fill="#090b16" opacity=".9"/>
  <path d="M1050 310 C1210 335 1340 385 1430 430 C1340 482 1212 526 1050 548 C1102 492 1102 365 1050 310Z" fill="#9edcff" opacity=".16"/>
  <rect x="120" y="112" width="1360" height="676" rx="42" fill="none" stroke="#f1e7ff" stroke-opacity=".12" stroke-width="2"/>
  <text x="120" y="790" font-family="Inter,Arial,sans-serif" font-size="22" letter-spacing="4" fill="#eadfff" opacity=".62">RESEARCH CENTER · CONSENT / EFFECTIVE SCOPE</text>
</svg>
