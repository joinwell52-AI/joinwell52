<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#eff6ff"/></linearGradient>
    <filter id="s2"><feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#1e3a5f" flood-opacity="0.12"/></filter>
    <marker id="a2" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#64748b"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg2)"/>
  <text x="800" y="74" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="38" font-weight="700" fill="#0f172a">From Governance Semantics to Fault Evidence: Four Layers, Four Claims</text>
  <text x="800" y="116" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="20" fill="#475569">Define what must survive first; then observe what remains after a fault</text>

  <g font-family="Segoe UI, sans-serif" filter="url(#s2)">
    <g transform="translate(180,165)">
      <rect width="1240" height="120" rx="26" fill="#e8efff" stroke="#93b4ff" stroke-width="3"/>
      <circle cx="70" cy="60" r="34" fill="#315fce"/><text x="70" y="69" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">1</text>
      <text x="128" y="48" font-size="28" font-weight="700" fill="#16336f">TMPA Core | Governance semantics</text>
      <text x="128" y="84" font-size="19" fill="#334155">Stable identity · responsibility · lifecycle/acceptance split · immutability · conflict retention · rebuild</text>
      <rect x="990" y="30" width="210" height="60" rx="18" fill="#fff"/><text x="1095" y="67" text-anchor="middle" font-size="18" font-weight="700" fill="#315fce">Defines what holds</text>
    </g>
    <g transform="translate(180,335)">
      <rect width="1240" height="120" rx="26" fill="#e5f8f5" stroke="#5dc9bb" stroke-width="3"/>
      <circle cx="70" cy="60" r="34" fill="#0f9f8f"/><text x="70" y="69" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">2</text>
      <text x="128" y="48" font-size="28" font-weight="700" fill="#075e55">FCoP Profile | File-protocol projection</text>
      <text x="128" y="84" font-size="19" fill="#334155">TASK / REPORT / ISSUE / REVIEW · location is current state · transition events preserve history</text>
      <rect x="990" y="30" width="210" height="60" rx="18" fill="#fff"/><text x="1095" y="67" text-anchor="middle" font-size="18" font-weight="700" fill="#0f9f8f">Defines expression</text>
    </g>
    <g transform="translate(180,505)">
      <rect width="1240" height="120" rx="26" fill="#fff3df" stroke="#f3b44c" stroke-width="3"/>
      <circle cx="70" cy="60" r="34" fill="#d97706"/><text x="70" y="69" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">3</text>
      <text x="128" y="48" font-size="28" font-weight="700" fill="#854d0e">CodeFlowMu | Runtime responsibility</text>
      <text x="128" y="84" font-size="19" fill="#334155">File observation · dependency checks · attempts · session start · bounded authority · recovery policy</text>
      <rect x="990" y="30" width="210" height="60" rx="18" fill="#fff"/><text x="1095" y="67" text-anchor="middle" font-size="18" font-weight="700" fill="#d97706">Defines operation</text>
    </g>
  </g>
  <g stroke="#64748b" stroke-width="4" marker-end="url(#a2)"><line x1="800" y1="286" x2="800" y2="326"/><line x1="800" y1="456" x2="800" y2="496"/></g>

  <g font-family="Segoe UI, sans-serif">
    <rect x="180" y="680" width="590" height="140" rx="26" fill="#fff" stroke="#94a3b8" stroke-width="3"/>
    <text x="475" y="724" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a">TMPA Conformance C01–C14</text>
    <text x="475" y="763" text-anchor="middle" font-size="18" fill="#475569">Governance objects, readers, conflicts, recovery, acceptance</text>
    <text x="475" y="795" text-anchor="middle" font-size="16" fill="#64748b">Author evidence for an exact bundle; not a product fault test</text>
    <rect x="830" y="680" width="590" height="140" rx="26" fill="#fff" stroke="#fb923c" stroke-width="3"/>
    <text x="1125" y="724" text-anchor="middle" font-size="25" font-weight="700" fill="#9a3412">This Article's 12 Fault Scenarios</text>
    <text x="1125" y="763" text-anchor="middle" font-size="18" fill="#475569">Storage, notification, dispatch, and test-oracle faults</text>
    <text x="1125" y="795" text-anchor="middle" font-size="16" fill="#64748b">A test target; report PASS / NOT RUN / open cases separately</text>
    <text x="800" y="864" text-anchor="middle" font-size="15" fill="#64748b">Based on TMPA Core S1.0, FCoP v3, current CodeFlowMu code, and the 2026-08-19 experiment record</text>
  </g>
</svg>
