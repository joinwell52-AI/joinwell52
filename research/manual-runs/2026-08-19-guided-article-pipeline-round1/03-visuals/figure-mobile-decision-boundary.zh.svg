<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#edf8f7"/></linearGradient>
    <filter id="s3"><feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#16324f" flood-opacity="0.12"/></filter>
    <marker id="a3" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#64748b"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg3)"/>
  <text x="800" y="72" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="38" font-weight="700" fill="#0f172a">手机点一次“批准”，服务端真正要做什么？</text>
  <text x="800" y="113" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="20" fill="#475569">手机只是入口；版本、权限、防重复和执行结果都由本地权威服务重新判断</text>

  <g font-family="Microsoft YaHei, Segoe UI, sans-serif" filter="url(#s3)">
    <g transform="translate(90,205)">
      <rect width="310" height="330" rx="38" fill="#ffffff" stroke="#7dd3fc" stroke-width="4"/>
      <rect x="65" y="38" width="180" height="220" rx="28" fill="#e9f7ff" stroke="#0ea5e9" stroke-width="3"/>
      <circle cx="155" cy="226" r="15" fill="#0ea5e9"/>
      <text x="155" y="286" text-anchor="middle" font-size="25" font-weight="700" fill="#075985">Mobile PWA</text>
      <text x="155" y="316" text-anchor="middle" font-size="17" fill="#475569">查看旧/新状态</text>
      <text x="155" y="340" text-anchor="middle" font-size="17" fill="#475569">提交受约束请求</text>
    </g>
    <g transform="translate(510,165)">
      <rect width="580" height="410" rx="34" fill="#ffffff" stroke="#5eead4" stroke-width="4"/>
      <text x="290" y="52" text-anchor="middle" font-size="29" font-weight="700" fill="#0f766e">CodeFlowMu 目标权威边界</text>
      <g font-size="19" fill="#334155">
        <rect x="42" y="88" width="496" height="54" rx="16" fill="#ecfeff"/><text x="70" y="122">① 设备会话仍有效、未被吊销？</text>
        <rect x="42" y="156" width="496" height="54" rx="16" fill="#ecfeff"/><text x="70" y="190">② 当前角色与能力允许这项决定？</text>
        <rect x="42" y="224" width="496" height="54" rx="16" fill="#ecfeff"/><text x="70" y="258">③ 目标版本仍与手机所见一致？</text>
        <rect x="42" y="292" width="496" height="54" rx="16" fill="#ecfeff"/><text x="70" y="326">④ 防重复流水号是否已经处理？</text>
      </g>
      <text x="290" y="382" text-anchor="middle" font-size="18" font-weight="700" fill="#b45309">任一项不确定：保持只读、拒绝或显示“结果未知”</text>
    </g>
    <g transform="translate(1200,205)">
      <rect width="310" height="330" rx="38" fill="#ffffff" stroke="#fbbf24" stroke-width="4"/>
      <rect x="55" y="48" width="200" height="145" rx="28" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/>
      <circle cx="155" cy="120" r="38" fill="#f59e0b"/><path d="M136 120l13 14 27-32" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="155" y="238" text-anchor="middle" font-size="25" font-weight="700" fill="#92400e">人类决定</text>
      <text x="155" y="274" text-anchor="middle" font-size="17" fill="#475569">批准只允许尝试</text>
      <text x="155" y="300" text-anchor="middle" font-size="17" fill="#475569">不等于执行成功</text>
    </g>
  </g>

  <g stroke="#64748b" stroke-width="5" fill="none" marker-end="url(#a3)">
    <path d="M400 370 H500"/><path d="M1090 370 H1190"/>
  </g>
  <text x="450" y="346" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="16" fill="#64748b">带版本与流水号</text>
  <text x="1140" y="346" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="16" fill="#64748b">返回权威裁决</text>

  <g font-family="Microsoft YaHei, Segoe UI, sans-serif">
    <line x1="800" y1="575" x2="800" y2="640" stroke="#64748b" stroke-width="5" marker-end="url(#a3)"/>
    <rect x="270" y="650" width="500" height="130" rx="28" fill="#eaf2ff" stroke="#7299e8" stroke-width="3"/>
    <text x="520" y="698" text-anchor="middle" font-size="25" font-weight="700" fill="#1e3a8a">任务平面：FCoP REVIEW</text>
    <text x="520" y="736" text-anchor="middle" font-size="18" fill="#334155">记录任务复核、驳回或接受关系</text>
    <text x="520" y="765" text-anchor="middle" font-size="16" fill="#64748b">不自动授权 Git 推送或外部写入</text>
    <rect x="830" y="650" width="500" height="130" rx="28" fill="#fff3df" stroke="#f3b44c" stroke-width="3"/>
    <text x="1080" y="698" text-anchor="middle" font-size="25" font-weight="700" fill="#92400e">操作平面：Operation Approval</text>
    <text x="1080" y="736" text-anchor="middle" font-size="18" fill="#334155">只授权绑定摘要的那一次高风险尝试</text>
    <text x="1080" y="765" text-anchor="middle" font-size="16" fill="#64748b">实际结果仍由后续报告与验证记录说明</text>
    <text x="800" y="854" text-anchor="middle" font-size="15" fill="#64748b">目标协议示意；依据：TMPA Core S1.0、FCoP v3 与 CodeFlowMu 当前实现边界</text>
  </g>
</svg>
