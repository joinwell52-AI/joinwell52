<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-label="CodeFlowMu业务支持：执行、核查、验收、观察与诊断留痕">
<style>text{font-family:'Microsoft YaHei','PingFang SC',sans-serif}.title{font-size:24px;font-weight:700;fill:#152b41}.label{font-size:18px;font-weight:700;fill:#087e99}.sub{font-size:13px;fill:#52677c}.lane{font-size:14px;font-weight:700;fill:#52677c}.box{fill:white;stroke:#cddce7;stroke-width:1.2}.arrow{stroke:#087e99;stroke-width:2;marker-end:url(#a)}</style>
<defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#087e99"/></marker></defs>
<rect width="1000" height="460" rx="12" fill="#f0f5f9"/><text x="28" y="40" class="title">Agent工作之后，CodeFlowMu怎样支持判断？</text>
<text x="28" y="66" class="sub">正式文件承载工作过程；程序核验、角色裁决和独立观察各有职责。</text>
<text x="28" y="125" class="lane">执行与交付</text>
<rect x="150" y="92" width="245" height="73" rx="8" class="box"/><text x="170" y="120" class="label">正式任务与角色分工</text><text x="170" y="145" class="sub">TASK · 父子关系 · 会话绑定</text>
<path d="M398 128H428" class="arrow"/><rect x="435" y="92" width="245" height="73" rx="8" class="box"/><text x="455" y="120" class="label">Agent调用工具执行</text><text x="455" y="145" class="sub">动作、结果、错误与时间</text>
<path d="M683 128H713" class="arrow"/><rect x="720" y="92" width="245" height="73" rx="8" class="box"/><text x="740" y="120" class="label">提交正式报告</text><text x="740" y="145" class="sub">REPORT · 投递确认 · 收据</text>
<text x="28" y="240" class="lane">核验与判断</text>
<rect x="150" y="207" width="245" height="80" rx="8" class="box"/><text x="170" y="235" class="label">事实核查记录</text><text x="170" y="260" class="sub">REVIEW-GATE · 证据与待决项</text>
<path d="M398 247H428" class="arrow"/><rect x="435" y="207" width="245" height="80" rx="8" class="box"/><text x="455" y="235" class="label">PM / ADMIN裁决</text><text x="455" y="260" class="sub">子任务验收 / 根任务验收</text>
<rect x="720" y="207" width="245" height="80" rx="8" class="box"/><text x="740" y="235" class="label">独立EVAL观察</text><text x="740" y="260" class="sub">分析过程与资产，不替代裁决</text>
<text x="28" y="355" class="lane">诊断与恢复</text>
<rect x="150" y="322" width="245" height="80" rx="8" class="box"/><text x="170" y="350" class="label">关联任务、会话与日志</text><text x="170" y="375" class="sub">核对时间、身份和完整返回</text>
<path d="M398 362H428" class="arrow"/><rect x="435" y="322" width="245" height="80" rx="8" class="box"/><text x="455" y="350" class="label">记录问题与诊断结论</text><text x="455" y="375" class="sub">ISSUE · 确认项与未验证原因</text>
<path d="M683 362H713" class="arrow"/><rect x="720" y="322" width="245" height="80" rx="8" class="box"/><text x="740" y="350" class="label">授权后的恢复与追踪</text><text x="740" y="375" class="sub">审批 · 取消 · 重跑 · 新回执</text>
<text x="28" y="438" class="sub">各环节留下文件证据；EVAL与诊断是独立支持能力，本图不把它们画成自动批准任务的门禁。</text>
</svg>
