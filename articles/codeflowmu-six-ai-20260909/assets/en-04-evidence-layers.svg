<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="307" viewBox="0 0 1200 307" role="img" aria-labelledby="title desc">
<title id="title">Four levels of evidence for a capability claim</title><desc id="desc">Evidence at one level does not automatically establish the next. </desc>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
<defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#087e99"/></marker></defs>
<rect width="1200" height="307" rx="14" fill="#f3f7fa"/>
<text x="32" y="44.0" font-size="28" fill="#152b41" font-weight="700">Four levels of evidence for a capability claim</text><text x="32" y="77.0" font-size="17" fill="#52677c" font-weight="400">Evidence at one level does not automatically establish the next.</text><rect x="32.0" y="112" width="266.0" height="137" rx="10" fill="white" stroke="#ccdce6"/><rect x="32.0" y="112" width="266.0" height="4" rx="2" fill="#087e99"/><text x="50.0" y="146.0" font-size="21" fill="#087e99" font-weight="700">Configured</text><text x="50.0" y="188.0" font-size="17" fill="#52677c" font-weight="400">Files and manifests show</text><text x="50.0" y="211.8" font-size="17" fill="#52677c" font-weight="400">installation or</text><text x="50.0" y="235.6" font-size="17" fill="#52677c" font-weight="400">declaration.</text><path d="M301.0 181 L319.0 181" fill="none" stroke="#087e99" stroke-width="2" marker-end="url(#a)"/><rect x="322.0" y="112" width="266.0" height="137" rx="10" fill="white" stroke="#ccdce6"/><rect x="322.0" y="112" width="266.0" height="4" rx="2" fill="#087e99"/><text x="340.0" y="146.0" font-size="21" fill="#087e99" font-weight="700">Visible</text><text x="340.0" y="188.0" font-size="17" fill="#52677c" font-weight="400">The session tool catalog</text><text x="340.0" y="211.8" font-size="17" fill="#52677c" font-weight="400">exposes an entry.</text><text x="340.0" y="235.6" font-size="17" fill="#52677c" font-weight="400">Resources ≠ tools.</text><path d="M591.0 181 L609.0 181" fill="none" stroke="#087e99" stroke-width="2" marker-end="url(#a)"/><rect x="612.0" y="112" width="266.0" height="137" rx="10" fill="white" stroke="#ccdce6"/><rect x="612.0" y="112" width="266.0" height="4" rx="2" fill="#087e99"/><text x="630.0" y="146.0" font-size="21" fill="#087e99" font-weight="700">Executed</text><text x="630.0" y="188.0" font-size="17" fill="#52677c" font-weight="400">Arguments and returned</text><text x="630.0" y="211.8" font-size="17" fill="#52677c" font-weight="400">results show a call.</text><text x="630.0" y="235.6" font-size="17" fill="#52677c" font-weight="400">Schema ≠ test.</text><path d="M881.0 181 L899.0 181" fill="none" stroke="#087e99" stroke-width="2" marker-end="url(#a)"/><rect x="902.0" y="112" width="266.0" height="137" rx="10" fill="white" stroke="#ccdce6"/><rect x="902.0" y="112" width="266.0" height="4" rx="2" fill="#087e99"/><text x="920.0" y="146.0" font-size="21" fill="#087e99" font-weight="700">Delivered</text><text x="920.0" y="188.0" font-size="17" fill="#52677c" font-weight="400">Formal receipts establish</text><text x="920.0" y="211.8" font-size="17" fill="#52677c" font-weight="400">delivery. Report text ≠</text><text x="920.0" y="235.6" font-size="17" fill="#52677c" font-weight="400">acceptance.</text>
<text x="32" y="281.0" font-size="16" fill="#52677c" font-weight="400"></text></svg>