<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="307" viewBox="0 0 1200 307" role="img" aria-labelledby="title desc">
<title id="title">From execution records to reviewable conclusions</title><desc id="desc">Written artifacts preserve the work; original sources support later verification. Write it down → preserve it → verify it again in a later session.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
<defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#087e99"/></marker></defs>
<rect width="1200" height="307" rx="14" fill="#f3f7fa"/>
<text x="32" y="44.0" font-size="28" fill="#152b41" font-weight="700">From execution records to reviewable conclusions</text><text x="32" y="77.0" font-size="17" fill="#52677c" font-weight="400">Written artifacts preserve the work; original sources support later verification.</text><rect x="32.0" y="112" width="266.0" height="137" rx="10" fill="white" stroke="#ccdce6"/><rect x="32.0" y="112" width="266.0" height="4" rx="2" fill="#087e99"/><text x="50.0" y="146.0" font-size="21" fill="#087e99" font-weight="700">Record the run</text><text x="50.0" y="188.0" font-size="17" fill="#52677c" font-weight="400">TASK, Session and formal</text><text x="50.0" y="211.8" font-size="17" fill="#52677c" font-weight="400">receipts</text><path d="M301.0 181 L319.0 181" fill="none" stroke="#087e99" stroke-width="2" marker-end="url(#a)"/><rect x="322.0" y="112" width="266.0" height="137" rx="10" fill="white" stroke="#ccdce6"/><rect x="322.0" y="112" width="266.0" height="4" rx="2" fill="#087e99"/><text x="340.0" y="146.0" font-size="21" fill="#087e99" font-weight="700">Preserve each run</text><text x="340.0" y="188.0" font-size="17" fill="#52677c" font-weight="400">Separate ZIP, inventory</text><text x="340.0" y="211.8" font-size="17" fill="#52677c" font-weight="400">and hashes</text><path d="M591.0 181 L609.0 181" fill="none" stroke="#087e99" stroke-width="2" marker-end="url(#a)"/><rect x="612.0" y="112" width="266.0" height="137" rx="10" fill="white" stroke="#ccdce6"/><rect x="612.0" y="112" width="266.0" height="4" rx="2" fill="#087e99"/><text x="630.0" y="146.0" font-size="21" fill="#087e99" font-weight="700">Cross-check sources</text><text x="630.0" y="188.0" font-size="17" fill="#52677c" font-weight="400">Identity, time window and</text><text x="630.0" y="211.8" font-size="17" fill="#52677c" font-weight="400">full results</text><path d="M881.0 181 L899.0 181" fill="none" stroke="#087e99" stroke-width="2" marker-end="url(#a)"/><rect x="902.0" y="112" width="266.0" height="137" rx="10" fill="white" stroke="#ccdce6"/><rect x="902.0" y="112" width="266.0" height="4" rx="2" fill="#087e99"/><text x="920.0" y="146.0" font-size="21" fill="#087e99" font-weight="700">Assess the claims</text><text x="920.0" y="188.0" font-size="17" fill="#52677c" font-weight="400">Supported, disputed or</text><text x="920.0" y="211.8" font-size="17" fill="#52677c" font-weight="400">unverified</text>
<text x="32" y="281.0" font-size="16" fill="#52677c" font-weight="400">Write it down → preserve it → verify it again in a later session.</text></svg>