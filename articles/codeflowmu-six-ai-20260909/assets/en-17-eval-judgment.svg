<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="307" viewBox="0 0 1200 307" role="img" aria-labelledby="title desc">
<title id="title">Two measures, two different assessment targets</title><desc id="desc">The Cursor run illustrates why performance scores and EVAL evidence risk must remain separate. Assess performance with this run’s evidence. Assess material reliability by checking identity and provenance.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
<defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#087e99"/></marker></defs>
<rect width="1200" height="307" rx="14" fill="#f3f7fa"/>
<text x="32" y="44.0" font-size="28" fill="#152b41" font-weight="700">Two measures, two different assessment targets</text><text x="32" y="77.0" font-size="17" fill="#52677c" font-weight="400">The Cursor run illustrates why performance scores and EVAL evidence risk must remain separate.</text><rect x="32.0" y="112" width="556.0" height="137" rx="10" fill="white" stroke="#ccdce6"/><rect x="32.0" y="112" width="556.0" height="4" rx="2" fill="#087e99"/><text x="50.0" y="146.0" font-size="21" fill="#087e99" font-weight="700">Article score: 87 / 100</text><text x="50.0" y="188.0" font-size="17" fill="#52677c" font-weight="400">Completion, quality, efficiency, scope, recovery and</text><text x="50.0" y="211.8" font-size="17" fill="#52677c" font-weight="400">observability.</text><path d="M591.0 181 L609.0 181" fill="none" stroke="#087e99" stroke-width="2" marker-end="url(#a)"/><rect x="612.0" y="112" width="556.0" height="137" rx="10" fill="white" stroke="#ccdce6"/><rect x="612.0" y="112" width="556.0" height="4" rx="2" fill="#087e99"/><text x="630.0" y="146.0" font-size="21" fill="#087e99" font-weight="700">Task EVAL: high / disputed</text><text x="630.0" y="188.0" font-size="17" fill="#52677c" font-weight="400">The record package linked raw material from a different run.</text>
<text x="32" y="281.0" font-size="16" fill="#52677c" font-weight="400">Assess performance with this run’s evidence. Assess material reliability by checking identity and provenance.</text></svg>