<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">TMPA mark</title>
  <desc id="desc">A unified TMPA process mark whose T-shaped carrier flows into two soft responsibility arcs.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d5dfc"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="30" fill="#0b1020"/>

  <!-- One visual system with clear stroke hierarchy -->
