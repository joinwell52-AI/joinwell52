  <path d="M64 95C66 85 68 79 73 79C79 79 78 96 83 96C88 96 88 79 94 79C100 79 100 90 107 96" fill="none" stroke="url(#g)" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round"/>
