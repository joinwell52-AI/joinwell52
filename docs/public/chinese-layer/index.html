<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f5f5f5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="DEV 中文" />
  <title>DEV 中文层</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./styles.css?v=0.2.3" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="dev-logo">DEV</div>
        <div>
          <div class="eyebrow">CHINESE LAYER <span id="versionBadge" class="version-badge">v0.2.3</span></div>
          <h1 id="pageTitle">主页</h1>
        </div>
      </div>
      <button id="langToggle" class="ghost-btn">中文</button>
    </header>

    <div id="updateBanner" class="update-banner hidden" role="status">
      <span id="updateText">发现新版本</span>
      <button id="updateNow" class="update-btn">立即更新</button>
    </div>

    <main>
      <section id="homeView" class="view active">
        <div class="feed-tabs">
          <button class="feed-tab active" data-feed="popular">发现</button>
          <button class="feed-tab" data-feed="latest">最新</button>
        </div>
        <div id="status" class="status">正在载入 DEV…</div>
        <div id="articleList" class="article-list"></div>
      </section>

      <section id="meView" class="view">
        <div id="meSetup" class="panel setup-card">
          <div class="hero-label">我的 DEV</div>
          <h2>打开我的文章</h2>
          <p>已默认绑定你的公开 DEV 账号；如果以后需要切换账号，再改这里。</p>
          <div class="input-stack">
            <input id="devUsername" class="text-input" autocomplete="off" autocapitalize="none" placeholder="DEV 用户名，例如：joinwell52" />
            <button id="saveUsername" class="primary-btn full-btn">进入我的</button>
          </div>
        </div>

        <div id="meContent" class="hidden">
          <div id="profileCard" class="profile-card"></div>
          <div class="my-toolbar">
            <div>
              <div class="hero-label">我的文章</div>
              <h2>最近创建</h2>
            </div>
            <button id="changeUsername" class="ghost-btn">更换账号</button>
          </div>
          <div id="meStatus" class="status"></div>
          <div id="myArticleList" class="article-list my-list"></div>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="主导航">
      <button class="nav-btn active" data-view="homeView" data-title="主页">⌂<span>主页</span></button>
      <button class="nav-btn" data-view="meView" data-title="我的">◉<span>我的</span></button>
    </nav>
  </div>

  <div id="reader" class="reader hidden" aria-hidden="true">
    <div class="reader-bar">
      <button id="readerBack" class="ghost-btn">‹ 返回</button>
      <div class="reader-actions">
        <button id="openOriginal" class="ghost-btn">原站</button>
        <button id="readerLang" class="ghost-btn">中文</button>
      </div>
    </div>
    <article id="readerContent" class="reader-content"></article>
  </div>

  <script src="./app.js?v=0.2.3" defer></script>
</body>
</html>
