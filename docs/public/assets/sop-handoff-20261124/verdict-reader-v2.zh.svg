<svg xmlns="http://www.w3.org/2000/svg" width="707" height="359" viewBox="0 0 707 359" role="img" aria-labelledby="title description" xml:lang="zh">
  <title id="title">同一份报告，换个依据就判反</title>
  <desc id="description">A｜差额 0 元: 按最新版复算, 3/3 通过. 按工单原版复核, 3/3 拒绝. B｜差额 300 元: 按最新版复算, 3/3 拒绝. 按工单原版复核, 3/3 通过.</desc>
  <rect width="707" height="359" rx="18" fill="#fffdf8"/>
  <g font-family="system-ui, 'Microsoft YaHei', sans-serif" fill="#17263e">
    <text x="25" y="45" font-size="31" font-weight="700">同一份报告，换个依据就判反</text>
    <text x="25" y="81" font-size="18" fill="#4d5c71">换班时规程已更新 · 各组合重复三次</text>
    <path d="M25 110h655" stroke="#d8dde5" stroke-width="1.4"/>
    <text x="27" y="149" font-size="18" fill="#4d5c71">报告</text>
    <text x="351" y="149" font-size="19" text-anchor="middle" font-weight="650">按最新版复算</text>
    <text x="575" y="149" font-size="19" text-anchor="middle" font-weight="650">按工单原版复核</text>
    <text x="27" y="211" font-size="20" font-weight="650">A｜差额 0 元</text>
    <text x="27" y="289" font-size="20" font-weight="650">B｜差额 300 元</text>
    <rect x="247" y="174" width="209" height="62" rx="10" fill="#eaf0ff"/>
    <path d="M275 205 m-6 0 4 4 8-9" fill="none" stroke="#3151a3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="295" y="213" fill="#3151a3" font-size="22" font-weight="650">3/3 通过</text>
    <rect x="471" y="174" width="209" height="62" rx="10" fill="#fff0d7"/>
    <path d="M499 205 m-4-4 8 8m0-8-8 8" fill="none" stroke="#874908" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="519" y="213" fill="#874908" font-size="22" font-weight="650">3/3 拒绝</text>
    <rect x="247" y="252" width="209" height="62" rx="10" fill="#fff0d7"/>
    <path d="M275 283 m-4-4 8 8m0-8-8 8" fill="none" stroke="#874908" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="295" y="291" fill="#874908" font-size="22" font-weight="650">3/3 拒绝</text>
    <rect x="471" y="252" width="209" height="62" rx="10" fill="#eaf0ff"/>
    <path d="M499 283 m-6 0 4 4 8-9" fill="none" stroke="#3151a3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="519" y="291" fill="#3151a3" font-size="22" font-weight="650">3/3 通过</text>
    <text x="25" y="339" font-size="17" fill="#4d5c71">工单要求这一轮按派发时的规程完成。</text>
  </g>
</svg>
