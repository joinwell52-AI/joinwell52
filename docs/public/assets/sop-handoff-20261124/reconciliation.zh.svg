<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 656 424" role="img" aria-labelledby="title" xml:lang="zh">
  <title id="title">三百元去哪儿了？</title>
  <rect width="656" height="424" rx="22" fill="#fffdf8"/>
  <g font-family="system-ui, 'Microsoft YaHei', sans-serif" fill="#172942">
    <text x="28" y="49" font-size="29" font-weight="700">三百元去哪儿了？</text>
    <rect x="28" y="71" width="600" height="83" rx="13" fill="#f0f3f8"/>
    <text x="47" y="103" font-size="17" font-weight="700">同一笔租金</text>
    <text x="47" y="132" font-size="18">应收 3,000 元　已到账 2,700 元　暂定减免 300 元</text>
    <path d="M328 155v19H174v16m154-16h154v16" fill="none" stroke="#77859a" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="28" y="192" width="292" height="198" rx="15" fill="#edf3ff"/>
    <rect x="336" y="192" width="292" height="198" rx="15" fill="#fff2dc"/>
    <text x="47" y="229" font-size="23" font-weight="700" fill="#234ca0">工单原版 V1</text>
    <text x="355" y="229" font-size="23" font-weight="700" fill="#854f09">当前新版 V2</text>
    <text x="47" y="267" font-size="18">只计正式批准的减免</text>
    <text x="355" y="267" font-size="18">暂定减免也计入</text>
    <text x="47" y="308" font-size="20" font-weight="600">3,000 − 2,700 − 0</text>
    <text x="355" y="308" font-size="20" font-weight="600">3,000 − 2,700 − 300</text>
    <text x="47" y="359" font-size="29" font-weight="700" fill="#234ca0">仍差 300 元</text>
    <text x="355" y="359" font-size="29" font-weight="700" fill="#854f09">差额 0 元</text>
  </g>
</svg>
