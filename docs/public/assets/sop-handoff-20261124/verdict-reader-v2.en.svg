<svg xmlns="http://www.w3.org/2000/svg" width="707" height="359" viewBox="0 0 707 359" role="img" aria-labelledby="title description" xml:lang="en">
  <title id="title">Same report, opposite verdict</title>
  <desc id="description">A · ¥0 outstanding: Latest procedure, 3/3 passed. Assigned procedure, 3/3 rejected. B · ¥300 outstanding: Latest procedure, 3/3 rejected. Assigned procedure, 3/3 passed.</desc>
  <rect width="707" height="359" rx="18" fill="#fffdf8"/>
  <g font-family="system-ui, 'Microsoft YaHei', sans-serif" fill="#17263e">
    <text x="25" y="45" font-size="31" font-weight="700">Same report, opposite verdict</text>
    <text x="25" y="81" font-size="18" fill="#4d5c71">The procedure changed between shifts · three repeats per case</text>
    <path d="M25 110h655" stroke="#d8dde5" stroke-width="1.4"/>
    <text x="27" y="149" font-size="18" fill="#4d5c71">Report</text>
    <text x="351" y="149" font-size="19" text-anchor="middle" font-weight="650">Latest procedure</text>
    <text x="575" y="149" font-size="19" text-anchor="middle" font-weight="650">Assigned procedure</text>
    <text x="27" y="211" font-size="20" font-weight="650">A · ¥0 outstanding</text>
    <text x="27" y="289" font-size="20" font-weight="650">B · ¥300 outstanding</text>
    <rect x="247" y="174" width="209" height="62" rx="10" fill="#eaf0ff"/>
    <path d="M275 205 m-6 0 4 4 8-9" fill="none" stroke="#3151a3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="295" y="213" fill="#3151a3" font-size="22" font-weight="650">3/3 passed</text>
    <rect x="471" y="174" width="209" height="62" rx="10" fill="#fff0d7"/>
    <path d="M499 205 m-4-4 8 8m0-8-8 8" fill="none" stroke="#874908" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="519" y="213" fill="#874908" font-size="22" font-weight="650">3/3 rejected</text>
    <rect x="247" y="252" width="209" height="62" rx="10" fill="#fff0d7"/>
    <path d="M275 283 m-4-4 8 8m0-8-8 8" fill="none" stroke="#874908" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="295" y="291" fill="#874908" font-size="22" font-weight="650">3/3 rejected</text>
    <rect x="471" y="252" width="209" height="62" rx="10" fill="#eaf0ff"/>
    <path d="M499 283 m-6 0 4 4 8-9" fill="none" stroke="#3151a3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="519" y="291" fill="#3151a3" font-size="22" font-weight="650">3/3 passed</text>
    <text x="25" y="339" font-size="17" fill="#4d5c71">The assignment required the procedure in effect at dispatch.</text>
  </g>
