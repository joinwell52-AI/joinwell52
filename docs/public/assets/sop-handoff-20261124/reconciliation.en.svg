<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 656 424" role="img" aria-labelledby="title" xml:lang="en">
  <title id="title">Where did the ¥300 go?</title>
  <rect width="656" height="424" rx="22" fill="#fffdf8"/>
  <g font-family="system-ui, 'Microsoft YaHei', sans-serif" fill="#172942">
    <text x="28" y="49" font-size="29" font-weight="700">Where did the ¥300 go?</text>
    <rect x="28" y="71" width="600" height="83" rx="13" fill="#f0f3f8"/>
    <text x="47" y="103" font-size="17" font-weight="700">The same rent payment</text>
    <text x="47" y="132" font-size="18">¥3,000 due · ¥2,700 paid · ¥300 provisional waiver</text>
    <path d="M328 155v19H174v16m154-16h154v16" fill="none" stroke="#77859a" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="28" y="192" width="292" height="198" rx="15" fill="#edf3ff"/>
    <rect x="336" y="192" width="292" height="198" rx="15" fill="#fff2dc"/>
    <text x="47" y="229" font-size="23" font-weight="700" fill="#234ca0">Assigned rule V1</text>
    <text x="355" y="229" font-size="23" font-weight="700" fill="#854f09">Current rule V2</text>
    <text x="47" y="267" font-size="18">Approved waivers only</text>
    <text x="355" y="267" font-size="18">Provisional waivers also count</text>
    <text x="47" y="308" font-size="20" font-weight="600">3,000 − 2,700 − 0</text>
    <text x="355" y="308" font-size="20" font-weight="600">3,000 − 2,700 − 300</text>
    <text x="47" y="359" font-size="29" font-weight="700" fill="#234ca0">¥300 outstanding</text>
    <text x="355" y="359" font-size="29" font-weight="700" fill="#854f09">¥0 outstanding</text>
  </g>
</svg>
