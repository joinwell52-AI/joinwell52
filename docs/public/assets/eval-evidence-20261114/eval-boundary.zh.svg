<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">独立验收的证据边界</title>
  <desc id="desc">员工报告说完成；当前事实包括原要求、工件、订单和授权。规则放过 SKU 错误，模型观察指出差别；正式验收另行结算。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#f4f7ff"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="13" flood-color="#1e3a8a" flood-opacity=".10"/></filter></defs>
  <rect width="1200" height="480" rx="26" fill="url(#bg)"/>
  <text x="46" y="56" fill="#172554" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="25" font-weight="700">验收先问：检查者看见了什么？</text>
  <rect x="42" y="128" width="178" height="166" rx="21" fill="#fff7ed" stroke="#fbbf24" stroke-width="2"/>
  <text x="63" y="171" fill="#92400e" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700">员工报告</text>
  <text x="63" y="217" fill="#78350f" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="27" font-weight="700">“已完成”</text>
  <text x="63" y="258" fill="#92400e" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15">一条声明</text>
  <path d="M220 211 H268" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
  <path d="m258 203 10 8-10 8" fill="none" stroke="#d97706" stroke-width="3"/>
  <rect x="268" y="91" width="488" height="286" rx="27" fill="#eef4ff" stroke="#2f5ed7" stroke-width="2" filter="url(#shadow)"/>
  <text x="295" y="135" fill="#173c9b" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="21" font-weight="700">当前可核查事实</text>
  <line x1="296" y1="151" x2="729" y2="151" stroke="#bfd3ff"/>
  <text x="297" y="190" fill="#1e3a8a" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17">原要求</text><text x="455" y="190" fill="#1e3a8a" font-family="Arial,sans-serif" font-size="18" font-weight="700">A-11 + B-22</text>
  <text x="297" y="233" fill="#1e3a8a" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17">当前工件</text><text x="455" y="233" fill="#7c3aed" font-family="Arial,sans-serif" font-size="18" font-weight="700">A-11 + B-23</text>
  <text x="297" y="276" fill="#1e3a8a" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17">业务记录</text><text x="455" y="276" fill="#1e3a8a" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17">一笔订单</text>
  <text x="297" y="319" fill="#1e3a8a" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17">发布授权</text><text x="455" y="319" fill="#1e3a8a" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17">有效</text>
  <path d="M756 215 H797" stroke="#2f5ed7" stroke-width="3" stroke-linecap="round"/>
  <path d="m788 207 10 8-10 8" fill="none" stroke="#2f5ed7" stroke-width="3"/>
  <rect x="798" y="91" width="357" height="126" rx="22" fill="#fff" stroke="#bed0f6" stroke-width="2"/>
  <text x="824" y="130" fill="#173c9b" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700">程序规则</text>
  <text x="824" y="166" fill="#34476f" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16">数量、版本、授权都符合</text>
  <text x="824" y="194" fill="#a16207" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16">这一例被放行</text>
  <rect x="798" y="237" width="357" height="140" rx="22" fill="#f5f0ff" stroke="#9574e8" stroke-width="2"/>
  <text x="824" y="277" fill="#6d28d9" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700">语义核查</text>
  <text x="824" y="314" fill="#5b21b6" font-family="Arial,sans-serif" font-size="24" font-weight="700">B-23 ≠ B-22</text>
  <text x="824" y="346" fill="#5b21b6" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16">模型观察：拒绝</text>
  <text x="42" y="431" fill="#475569" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16">受控七例中的一例 · 观察不等于正式验收 · 事实缺失时保留未知</text>
</svg>
