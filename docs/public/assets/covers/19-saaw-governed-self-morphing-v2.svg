<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Governed Self-Morphing</title>
  <desc id="desc">Production work emits evidence, the isolated meta-development runtime creates a digital employee package, validation and human authority admit deployment, and rollback remains available.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071225"/><stop offset="1" stop-color="#181b38"/></linearGradient><marker id="c" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#59d8e8"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#efa64a"/></marker></defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="66" y="62" fill="#65dcea" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="4">META-DEVELOPMENT RUNTIME · DIGITAL EMPLOYEE PACKAGE · SELF-MORPHING</text>
  <text x="66" y="110" fill="#fff" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="40" font-weight="800">“自己开发自己”不是生产中任意改写，而是受治理的能力演化</text>
  <g font-family="Arial,'Microsoft YaHei',sans-serif">
    <rect x="66" y="158" width="1468" height="260" rx="30" fill="#0a192b" stroke="#55d8e8" stroke-width="2"/>
    <text x="94" y="198" fill="#66ddea" font-size="16" font-weight="700" letter-spacing="2">PRODUCTION WORK RUNTIME · 与元开发隔离</text>
    <g transform="translate(96 232)"><rect width="260" height="126" rx="20" fill="#0d2935" stroke="#55d8e8"/><text x="24" y="38" fill="#66ddea" font-size="15" font-weight="700">DOMAIN WORKER</text><text x="24" y="75" fill="#fff" font-size="24" font-weight="800">持续履职</text><text x="24" y="104" fill="#91a2ba" font-size="15">真实任务、真实边界</text></g>
    <g transform="translate(428 232)"><rect width="260" height="126" rx="20" fill="#10213b" stroke="#5a9be0"/><text x="24" y="38" fill="#79b9ff" font-size="15" font-weight="700">WORK EVIDENCE</text><text x="24" y="75" fill="#fff" font-size="24" font-weight="800">结果与问题</text><text x="24" y="104" fill="#91a2ba" font-size="15">Report · Issue · Metrics</text></g>
    <g transform="translate(760 232)"><rect width="260" height="126" rx="20" fill="#171b3d" stroke="#8175ff"/><text x="24" y="38" fill="#b5adff" font-size="15" font-weight="700">CAPABILITY GAP</text><text x="24" y="75" fill="#fff" font-size="24" font-weight="800">发现能力缺口</text><text x="24" y="104" fill="#91a2ba" font-size="15">失败、返工、策略变化</text></g>
    <g transform="translate(1092 232)"><rect width="410" height="126" rx="20" fill="#25211f" stroke="#b99e68"/><text x="24" y="38" fill="#d6bc83" font-size="15" font-weight="700">CURRENT VERSION</text><text x="24" y="75" fill="#fff" font-size="24" font-weight="800">继续运行，不被在线改写</text><text x="24" y="104" fill="#a99b88" font-size="15">Production remains identifiable and rollback-ready</text></g>
    <g stroke="#59d8e8" stroke-width="4" marker-end="url(#c)"><path d="M366 295H416"/><path d="M698 295H748"/></g>

    <rect x="66" y="470" width="1468" height="272" rx="30" fill="#11142d" stroke="#8175ff" stroke-width="2"/>
    <text x="94" y="510" fill="#b5adff" font-size="16" font-weight="700" letter-spacing="2">ISOLATED META-DEVELOPMENT PATH · 元开发运行体</text>
    <g transform="translate(96 548)"><rect width="286" height="132" rx="22" fill="#181a3e" stroke="#8175ff"/><text x="24" y="37" fill="#b5adff" font-size="15" font-weight="700">META TEAM</text><text x="24" y="72" fill="#fff" font-size="23" font-weight="800">PM · DEV · QA · OPS</text><text x="24" y="103" fill="#91a2ba" font-size="15">设计、开发、测试、恢复</text></g>
    <g transform="translate(438 548)"><rect width="286" height="132" rx="22" fill="#0d2935" stroke="#55d8e8"/><text x="24" y="37" fill="#66ddea" font-size="15" font-weight="700">DIGITAL EMPLOYEE PACKAGE</text><text x="24" y="72" fill="#fff" font-size="23" font-weight="800">数字员工包</text><text x="24" y="103" fill="#91a2ba" font-size="15">Role · Workflow · Skill · Policy</text></g>
    <g transform="translate(780 548)"><rect width="286" height="132" rx="22" fill="#10213b" stroke="#5a9be0"/><text x="24" y="37" fill="#79b9ff" font-size="15" font-weight="700">ISOLATED VALIDATION</text><text x="24" y="72" fill="#fff" font-size="23" font-weight="800">隔离验证</text><text x="24" y="103" fill="#91a2ba" font-size="15">可复现测试、版本与回滚</text></g>
    <g transform="translate(1122 548)"><rect width="380" height="132" rx="22" fill="#34231e" stroke="#efa64a" stroke-width="2"/><text x="24" y="37" fill="#f1b35d" font-size="15" font-weight="700">HUMAN / GOVERNANCE GATE</text><text x="24" y="72" fill="#fff" font-size="23" font-weight="800">授权部署或要求返工</text><text x="24" y="103" fill="#ad9b89" font-size="15">高影响变化必须形成正式决定</text></g>
    <g stroke="#59d8e8" stroke-width="4" marker-end="url(#c)"><path d="M392 614H426"/><path d="M734 614H768"/></g><path d="M1076 614H1110" stroke="#efa64a" stroke-width="4" marker-end="url(#o)"/>
    <path d="M890 470C890 438 890 418 890 385" stroke="#8175ff" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#c)"/>
    <text x="906" y="448" fill="#b5adff" font-size="14">证据进入元开发，不直接修改生产</text>
    <path d="M1312 548C1312 458 1396 458 1396 384" stroke="#efa64a" stroke-width="4" marker-end="url(#o)"/>
    <text x="1408" y="458" fill="#f1b35d" font-size="14">APPROVED DEPLOYMENT</text>
    <path d="M1260 742V790H274V430" fill="none" stroke="#efa64a" stroke-width="4" marker-end="url(#o)"/>
    <text x="800" y="782" text-anchor="middle" fill="#f1b35d" font-size="16" font-weight="700">新版本进入下一轮工作；失败时回滚到可识别的上一版本</text>
  </g>
  <rect x="66" y="824" width="1468" height="48" rx="13" fill="#0a1121" stroke="#4b5d79"/>
  <text x="800" y="855" text-anchor="middle" fill="#dce5f2" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18">工作 → 证据 → 缺口 → 开发改进 → 隔离验证 → 人类/治理授权 → 部署 → 新一轮工作</text>
</svg>
