<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Weekly 005 — Every Handoff Needs a Receipt</title>
  <desc id="desc">An editorial diagram of four bounded execution domains connected by narrow handoff gates, each leaving an evidence receipt.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#24324a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1320" cy="120" r="250" fill="#ffffff" opacity="0.035"/>
  <circle cx="210" cy="790" r="310" fill="#ffffff" opacity="0.025"/>

  <text x="120" y="120" fill="#b8c7dc" font-family="Arial, Helvetica, sans-serif" font-size="28" letter-spacing="7">WEEKLY RESEARCH · 005</text>
  <text x="120" y="205" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="700">Every Handoff Needs a Receipt</text>
  <text x="120" y="260" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="27">Identity, authority, execution and effects must cross boundaries as separate facts.</text>

  <g filter="url(#shadow)" font-family="Arial, Helvetica, sans-serif">
    <rect x="120" y="365" width="270" height="205" rx="28" fill="#f8fafc"/>
    <text x="150" y="420" fill="#0f172a" font-size="25" font-weight="700">INTENT</text>
    <text x="150" y="462" fill="#475569" font-size="21">request · reservation</text>
    <text x="150" y="496" fill="#475569" font-size="21">stored state · policy</text>
    <text x="150" y="540" fill="#0f172a" font-size="18">What is proposed?</text>

    <rect x="515" y="365" width="270" height="205" rx="28" fill="#f8fafc"/>
    <text x="545" y="420" fill="#0f172a" font-size="25" font-weight="700">AUTHORITY</text>
    <text x="545" y="462" fill="#475569" font-size="21">admission · approval</text>
    <text x="545" y="496" fill="#475569" font-size="21">claim · ownership</text>
    <text x="545" y="540" fill="#0f172a" font-size="18">Who may act now?</text>

    <rect x="910" y="365" width="270" height="205" rx="28" fill="#f8fafc"/>
    <text x="940" y="420" fill="#0f172a" font-size="25" font-weight="700">EXECUTION</text>
    <text x="940" y="462" fill="#475569" font-size="21">materialization · work</text>
    <text x="940" y="496" fill="#475569" font-size="21">provider handoff · tool</text>
    <text x="940" y="540" fill="#0f172a" font-size="18">What actually ran?</text>

    <rect x="1305" y="365" width="175" height="205" rx="28" fill="#f8fafc"/>
    <text x="1335" y="420" fill="#0f172a" font-size="25" font-weight="700">EFFECT</text>
    <text x="1335" y="462" fill="#475569" font-size="20">result</text>
    <text x="1335" y="495" fill="#475569" font-size="20">custody</text>
    <text x="1335" y="528" fill="#475569" font-size="20">settlement</text>
  </g>

  <g stroke="#94a3b8" stroke-width="5" fill="none">
    <path d="M390 467 H515"/>
    <path d="M785 467 H910"/>
    <path d="M1180 467 H1305"/>
  </g>
  <g fill="#e2e8f0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle">
    <rect x="415" y="430" width="75" height="74" rx="14" fill="#334155" stroke="#94a3b8"/>
    <text x="452" y="458">RECEIPT</text><text x="452" y="483">01</text>
    <rect x="810" y="430" width="75" height="74" rx="14" fill="#334155" stroke="#94a3b8"/>
    <text x="847" y="458">RECEIPT</text><text x="847" y="483">02</text>
    <rect x="1205" y="430" width="75" height="74" rx="14" fill="#334155" stroke="#94a3b8"/>
    <text x="1242" y="458">RECEIPT</text><text x="1242" y="483">03</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="120" y="690" fill="#f8fafc" font-size="31" font-weight="700">Continuity is not authority.</text>
    <text x="120" y="733" fill="#cbd5e1" font-size="24">A state can persist, a session can reconnect, or a request can be reserved</text>
    <text x="120" y="769" fill="#cbd5e1" font-size="24">without proving that execution, external effects, or acceptance crossed the boundary.</text>
  </g>

  <text x="1475" y="835" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="end">JoinWell52 Research Center · 2026-08-16</text>
</svg>
