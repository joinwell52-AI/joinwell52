<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Reviewed approval records and direct task linkage</title>
  <desc id="desc">Among five reviewed first-party approval records, zero have a direct task or thread link and five require manual reconciliation.</desc>
  <rect width="1200" height="520" fill="#ffffff"/>
  <text x="80" y="74" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#172033">Approval-to-task linkage in reviewed records</text>
  <text x="80" y="112" font-family="Arial, sans-serif" font-size="20" fill="#5f6b7a">First-party sample: 5 approval records reviewed; not a repository-wide rate</text>
  <text x="80" y="190" font-family="Arial, sans-serif" font-size="24" fill="#172033">Direct task/thread link present</text>
  <rect x="80" y="214" width="930" height="64" rx="8" fill="#e8edf3"/>
  <text x="1040" y="258" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#172033">0 / 5</text>
  <text x="80" y="356" font-family="Arial, sans-serif" font-size="24" fill="#172033">Manual reconciliation still required</text>
  <rect x="80" y="380" width="930" height="64" rx="8" fill="#1f6feb"/>
  <text x="1040" y="424" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#172033">5 / 5</text>
  <text x="80" y="488" font-family="Arial, sans-serif" font-size="18" fill="#5f6b7a">Interpretation: approval and action evidence are not yet automatically traceable to one task in this reviewed sample.</text>
</svg>
