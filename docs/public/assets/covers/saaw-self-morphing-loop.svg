<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="940" viewBox="0 0 1500 940" role="img" aria-labelledby="t d">
<title id="t">Self-Morphing Digital Employee Loop</title><desc id="d">Bilingual diagram of the loop from Meta-Dev Runtime to Digital Employee Package, validation, deployment, work evidence and next development cycle.</desc>
<defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101d"/><stop offset="1" stop-color="#12172d"/></linearGradient><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#59d8ff"/><stop offset="1" stop-color="#a889ff"/></linearGradient></defs>
<rect width="1500" height="940" rx="36" fill="url(#b)"/>
<text x="100" y="105" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="50" font-weight="800">Self-Morphing: Development Runtime → Work Runtime</text>
<text x="100" y="155" fill="#9fb0cc" font-family="Noto Sans SC,Microsoft YaHei,Arial,sans-serif" font-size="28">“自己开发自己”不是无限自改，而是受治理地开发、验证、部署新的数字员工形态</text>
<g font-family="Inter,Noto Sans SC,Microsoft YaHei,Arial,sans-serif">
<rect x="90" y="285" width="280" height="165" rx="28" fill="#142941" stroke="#5fdcff" stroke-width="2"/><text x="230" y="335" text-anchor="middle" fill="#65ddff" font-size="24" font-weight="700">META-DEV RUNTIME</text><text x="230" y="385" text-anchor="middle" fill="#fff" font-size="32" font-weight="800">PM · DEV · QA · OPS</text><text x="230" y="425" text-anchor="middle" fill="#bdcce1" font-size="22">元开发团队</text>
<path d="M370 368h130" stroke="url(#g)" stroke-width="6"/><polygon points="520,368 493,352 493,384" fill="#69d8ff"/>
<rect x="520" y="285" width="330" height="165" rx="28" fill="#17213a" stroke="#8d9cff" stroke-width="2"/><text x="685" y="335" text-anchor="middle" fill="#a8afff" font-size="24" font-weight="700">WORKER PACKAGE</text><text x="685" y="382" text-anchor="middle" fill="#fff" font-size="30" font-weight="800">Role · Workflow · Skills</text><text x="685" y="422" text-anchor="middle" fill="#bdcce1" font-size="22">Permissions · Policies · Gates</text>
<path d="M850 368h130" stroke="url(#g)" stroke-width="6"/><polygon points="1000,368 973,352 973,384" fill="#909aff"/>
<rect x="1000" y="285" width="400" height="165" rx="28" fill="#211d39" stroke="#aa8cff" stroke-width="2"/><text x="1200" y="335" text-anchor="middle" fill="#c0a6ff" font-size="24" font-weight="700">VALIDATE + DECISION</text><text x="1200" y="382" text-anchor="middle" fill="#fff" font-size="30" font-weight="800">QA · Governance · Human Gate</text><text x="1200" y="422" text-anchor="middle" fill="#bdcce1" font-size="22">验证、治理与授权</text>
<path d="M1200 450v118" stroke="url(#g)" stroke-width="6"/><polygon points="1200,588 1184,560 1216,560" fill="#a88fff"/>
<rect x="930" y="590" width="470" height="170" rx="28" fill="#152842" stroke="#61d9ff" stroke-width="2"/><text x="1165" y="642" text-anchor="middle" fill="#67ddff" font-size="24" font-weight="700">DOMAIN WORKER RUNTIME</text><text x="1165" y="690" text-anchor="middle" fill="#fff" font-size="31" font-weight="800">Contract · Finance · Operations</text><text x="1165" y="730" text-anchor="middle" fill="#bdcce1" font-size="22">领域数字员工团队持续履职</text>
<path d="M930 676H760" stroke="url(#g)" stroke-width="6"/><polygon points="740,676 768,660 768,692" fill="#76cfff"/>
<rect x="390" y="590" width="350" height="170" rx="28" fill="#172239" stroke="#8b9aff" stroke-width="2"/><text x="565" y="642" text-anchor="middle" fill="#a7b1ff" font-size="24" font-weight="700">WORK EVIDENCE</text><text x="565" y="690" text-anchor="middle" fill="#fff" font-size="31" font-weight="800">Reports · Issues · Results</text><text x="565" y="730" text-anchor="middle" fill="#bdcce1" font-size="22">工作事实、问题与成果</text>
<path d="M390 676H230V470" stroke="url(#g)" stroke-width="6" fill="none"/><polygon points="230,450 214,478 246,478" fill="#65d9ff"/>
<text x="130" y="850" fill="#dce8f7" font-size="28" font-weight="700">Develop → Validate → Deploy → Work → Observe → Improve</text><text x="130" y="892" fill="#9fafc8" font-size="23">软件开发与软件履职开始进入同一个可治理生命周期。</text>
</g>
</svg>