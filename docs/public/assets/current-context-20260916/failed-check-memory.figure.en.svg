<rect x="52" y="185" width="300" height="270" rx="18" fill="#e7efff" stroke="#2856ad" stroke-width="2"/><text x="76" y="224" font-size="24" font-weight="700">Answer generated</text><text x="76" y="261" font-size="20">Prior history retained</text><text x="76" y="291" font-size="20">User input retained</text><text x="76" y="321" font-size="20"></text><text x="76" y="351" font-size="20">The checker throws</text><rect x="440" y="175" width="690" height="150" rx="18" fill="#fff1db" stroke="#b87812" stroke-width="2"/><text x="464" y="214" font-size="24" font-weight="700">Old condition: unvetted answer saved</text><text x="464" y="251" font-size="20">Replayed to the next model call: 4/4</text><text x="464" y="281" font-size="20">Mixed pass + error: also 4/4</text><rect x="440" y="355" width="690" height="150" rx="18" fill="#e7efff" stroke="#2856ad" stroke-width="2"/><text x="464" y="394" font-size="24" font-weight="700">After fix: require the batch to pass</text><text x="464" y="431" font-size="20">Both error cases: 0/4 replayed</text><text x="464" y="461" font-size="20">Normal passing answers: still 4/4</text>
