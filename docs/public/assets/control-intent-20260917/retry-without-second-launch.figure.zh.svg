<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img"><title>没收到回复，先查留下了什么证据</title><rect width="1200" height="650" rx="24" fill="#faf8f2"/><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#17243b}.title{font-size:34px;font-weight:700}.sub{font-size:22px;fill:#526178}.label{font-size:26px;font-weight:600}.body{font-size:22px}.small{font-size:19px}.blue{fill:#174dc8}.violet{fill:#7455c8}.amber{fill:#a96710}</style><text x="48" y="65" class="title">没收到回复，先查留下了什么证据</text><text x="48" y="105" class="sub">真实文件 + 原始准入模块｜成功结果为合成数据</text><rect x="48" y="160" width="1104" height="156" rx="18" fill="#edf1ff"/><text x="76" y="200" class="label">记录：最终成功结果已经保存</text><text x="76" y="248" class="body">相同身份再次请求</text><path d="M 430 241 H 510" stroke="#174dc8" stroke-width="4"/><path d="m 498 232 12 9 -12 9" fill="none" stroke="#174dc8" stroke-width="4"/><text x="547" y="248" class="label violet">找回并返回同一份结果</text><text x="76" y="287" class="small">在同一进程重新打开存储后，仍能读出结果。</text><rect x="48" y="343" width="1104" height="156" rx="18" fill="#fff0d9"/><text x="76" y="383" class="label">记录：已接单，最终结果缺失</text><text x="76" y="431" class="body">相同身份再次请求</text><path d="M 430 424 H 510" stroke="#174dc8" stroke-width="4"/><path d="m 498 415 12 9 -12 9" fill="none" stroke="#174dc8" stroke-width="4"/><text x="547" y="431" class="label amber">保留未知，拒绝再次执行</text><text x="76" y="470" class="small">拒绝重复，不等于已经恢复工作。</text><line x1="48" y1="573" x2="1152" y2="573" stroke="#d5dce7"/><text x="48" y="612" class="small">八并发准入：1 个获准，7 个未知拒绝；上层共享执行与真实启动未测。</text></svg>
