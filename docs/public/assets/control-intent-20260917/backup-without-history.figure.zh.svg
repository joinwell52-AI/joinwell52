<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img"><title>备份数量，不等于历史深度</title><rect width="1200" height="650" rx="24" fill="#faf8f2"/><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#17243b}.title{font-size:34px;font-weight:700}.sub{font-size:22px;fill:#526178}.label{font-size:26px;font-weight:600}.body{font-size:22px}.small{font-size:19px}.blue{fill:#174dc8}.violet{fill:#7455c8}.amber{fill:#a96710}</style><text x="48" y="65" class="title">备份数量，不等于历史深度</text><text x="48" y="105" class="sub">一次真实改变 + 27 次相同合并｜完整原程序、真实临时文件</text><text x="48" y="175" class="label">修改前：10 份备份，旧内容不在</text><rect x="48" y="200" width="90" height="92" rx="12" fill="#174dc8"/><text x="93" y="251" text-anchor="middle" style="fill:white;font-size:21px">当前</text><rect x="154" y="200" width="90" height="92" rx="12" fill="#174dc8"/><text x="199" y="251" text-anchor="middle" style="fill:white;font-size:21px">当前</text><rect x="260" y="200" width="90" height="92" rx="12" fill="#174dc8"/><text x="305" y="251" text-anchor="middle" style="fill:white;font-size:21px">当前</text><rect x="366" y="200" width="90" height="92" rx="12" fill="#174dc8"/><text x="411" y="251" text-anchor="middle" style="fill:white;font-size:21px">当前</text><rect x="472" y="200" width="90" height="92" rx="12" fill="#174dc8"/><text x="517" y="251" text-anchor="middle" style="fill:white;font-size:21px">当前</text><rect x="578" y="200" width="90" height="92" rx="12" fill="#174dc8"/><text x="623" y="251" text-anchor="middle" style="fill:white;font-size:21px">当前</text><rect x="684" y="200" width="90" height="92" rx="12" fill="#174dc8"/><text x="729" y="251" text-anchor="middle" style="fill:white;font-size:21px">当前</text><rect x="790" y="200" width="90" height="92" rx="12" fill="#174dc8"/><text x="835" y="251" text-anchor="middle" style="fill:white;font-size:21px">当前</text><rect x="896" y="200" width="90" height="92" rx="12" fill="#174dc8"/><text x="941" y="251" text-anchor="middle" style="fill:white;font-size:21px">当前</text><rect x="1002" y="200" width="90" height="92" rx="12" fill="#174dc8"/><text x="1047" y="251" text-anchor="middle" style="fill:white;font-size:21px">当前</text><text x="48" y="353" class="label">修改后：1 份备份，旧内容保留</text><rect x="48" y="381" width="144" height="95" rx="12" fill="#7455c8"/><text x="120" y="436" text-anchor="middle" style="fill:white;font-size:24px">旧版本</text><text x="230" y="421" class="body">后续没有变化 → 不再写入，也不再新增备份</text><text x="230" y="463" class="small">人为反例：反复改变 JSON 排版，仍会消耗备份窗口。</text><line x1="48" y1="573" x2="1152" y2="573" stroke="#d5dce7"/><text x="48" y="612" class="small">本地对照结果；不是上游报告的 27 个使用者 / 198 份备份。</text></svg>
