<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img"><title>No reply? Check what was recorded.</title><rect width="1200" height="650" rx="24" fill="#faf8f2"/><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#17243b}.title{font-size:34px;font-weight:700}.sub{font-size:22px;fill:#526178}.label{font-size:26px;font-weight:600}.body{font-size:22px}.small{font-size:19px}.blue{fill:#174dc8}.violet{fill:#7455c8}.amber{fill:#a96710}</style><text x="48" y="65" class="title">No reply? Check what was recorded.</text><text x="48" y="105" class="sub">Original record and launch-check code | Real files, synthetic results</text><rect x="48" y="160" width="1104" height="156" rx="18" fill="#edf1ff"/><text x="76" y="200" class="label">Record: launch completed, result saved</text><text x="76" y="248" class="body">Same number returns</text><path d="M 430 241 H 510" stroke="#174dc8" stroke-width="4"/><path d="m 498 232 12 9 -12 9" fill="none" stroke="#174dc8" stroke-width="4"/><text x="547" y="248" class="label violet">Replay the same saved result</text><text x="76" y="287" class="small">The result survives reopening the store in the same process.</text><rect x="48" y="343" width="1104" height="156" rx="18" fill="#fff0d9"/><text x="76" y="383" class="label">Record: accepted, launch outcome unknown</text><text x="76" y="431" class="body">Same number returns</text><path d="M 430 424 H 510" stroke="#174dc8" stroke-width="4"/><path d="m 498 415 12 9 -12 9" fill="none" stroke="#174dc8" stroke-width="4"/><text x="547" y="431" class="label amber">Unknown; refuse another execution</text><text x="76" y="470" class="small">Preventing duplication does not itself recover the work.</text><line x1="48" y1="573" x2="1152" y2="573" stroke="#d5dce7"/><text x="48" y="612" class="small">An acceptance record does not establish a launch outcome. No real agent ran.</text></svg>
