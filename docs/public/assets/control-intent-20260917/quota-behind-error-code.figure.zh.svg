<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img"><title>同一个失败阶段，可以有不同原因</title><rect width="1200" height="650" rx="24" fill="#faf8f2"/><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#17243b}.title{font-size:34px;font-weight:700}.sub{font-size:22px;fill:#526178}.label{font-size:26px;font-weight:600}.body{font-size:22px}.small{font-size:19px}.blue{fill:#174dc8}.violet{fill:#7455c8}.amber{fill:#a96710}</style><text x="48" y="65" class="title">同一个失败阶段，可以有不同原因</text><text x="48" y="105" class="sub">同一输入，比较修改前后原始分类函数</text><rect x="48" y="143" width="1104" height="94" rx="16" fill="#edf1ff"/><text x="74" y="180" class="body">acpx_turn_failed</text><text x="74" y="216" class="body">额度耗尽；21:20 Pacific/Auckland 恢复</text><text x="48" y="295" class="label">旧版</text><text x="310" y="295" class="body">没有给出分类</text><text x="48" y="358" class="label blue">候选版</text><text x="310" y="358" class="body">额度限制；重试时间 09:20 UTC</text><text x="310" y="400" class="small violet">依据：解析服务消息中的恢复时间</text><rect x="48" y="433" width="1104" height="110" rx="16" fill="#fff0d9"/><text x="75" y="474" class="body">如果消息没有时间：得到 05:50 UTC</text><text x="75" y="514" class="small">依据：实验时钟 04:50 UTC + 默认 1 小时；并非服务承诺。</text><line x1="48" y1="573" x2="1152" y2="573" stroke="#d5dce7"/><text x="48" y="612" class="small">9 输入 × 2 版本；只验证分类输出，没有运行真实重试调度。</text></svg>
