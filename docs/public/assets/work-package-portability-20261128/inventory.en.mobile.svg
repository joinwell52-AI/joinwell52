<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 570 884" role="img" lang="en">
<title>Same instructions, two different outcomes</title>
<rect width="570" height="884" rx="24" fill="#f5f6fc"/>
<g font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif">
<text x="30" y="62" fill="#193054" font-size="26" font-weight="700">Same instructions, two different outcomes</text>
<g transform="translate(30 99)">
<rect width="510" height="366" rx="18" fill="white" stroke="#dbe2f1"/>
<text x="26" y="58" fill="#193054" font-size="31" font-weight="650">Both tools available</text>
<text x="26" y="114" fill="#405674" font-size="24" font-weight="500">Equipment register</text>
<text x="26" y="150" fill="#193054" font-size="29" font-weight="600">D-01 · D-02 · D-03</text>
<text x="26" y="200" fill="#405674" font-size="24" font-weight="500">Physical count sheet</text>
<text x="26" y="236" fill="#193054" font-size="29" font-weight="600">D-01 · D-03</text>
<path d="M26 261h458" stroke="#e2e8f4"/>
<text x="26" y="304" fill="#214caf" font-size="31" font-weight="700">Report awaiting review</text>
<text x="26" y="337" fill="#405674" font-size="24" font-weight="500">D-02 absent from count</text>
</g>
<g transform="translate(30 489)">
<rect width="510" height="366" rx="18" fill="white" stroke="#dbe2f1"/>
<text x="26" y="58" fill="#193054" font-size="31" font-weight="650">Only the register tool available</text>
<text x="26" y="114" fill="#405674" font-size="24" font-weight="500">Equipment register</text>
<text x="26" y="150" fill="#193054" font-size="29" font-weight="600">D-01 · D-02 · D-03</text>
<text x="26" y="200" fill="#405674" font-size="24" font-weight="500">Physical count sheet</text>
<text x="26" y="236" fill="#934617" font-size="29" font-weight="600">No retrieval tool supplied</text>
<path d="M26 261h458" stroke="#e2e8f4"/>
<text x="26" y="304" fill="#934617" font-size="31" font-weight="700">Comparison blocked</text>
<text x="26" y="337" fill="#405674" font-size="24" font-weight="500">Needs a count-sheet retrieval tool</text>
</g>
</g></svg>