<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 650" role="img" aria-label="旧快照覆盖与重新读取对照">
<rect width="640" height="650" rx="28" fill="#f8f5ef"/>
<text x="35" y="60" fill="#1b3159" font-family="Arial, sans-serif" font-size="30" font-weight="700">两次保存都成功</text>
<text x="35" y="100" fill="#475d79" font-family="Arial, sans-serif" font-size="21">A、B 先读同一份旧记录</text>
<rect x="35" y="135" width="570" height="128" rx="19" fill="#fff" stroke="#d5dfed" stroke-width="2"/>
<text x="65" y="185" fill="#184bc0" font-family="Arial, sans-serif" font-size="25" font-weight="700">A 保存恢复状态</text>
<text x="65" y="225" fill="#475d79" font-family="Arial, sans-serif" font-size="21">文件完整 · 恢复状态有 · 次数 0</text>
<path d="M320 275v45" stroke="#b47d2c" stroke-width="5"/><path d="m320 323-11-17h22z" fill="#b47d2c"/>
<rect x="35" y="340" width="570" height="128" rx="19" fill="#fff" stroke="#e6c79b" stroke-width="2"/>
<text x="65" y="390" fill="#9b5826" font-family="Arial, sans-serif" font-size="25" font-weight="700">B 用旧快照保存次数 1</text>
<text x="65" y="430" fill="#9b5826" font-family="Arial, sans-serif" font-size="21">文件完整 · 恢复状态消失</text>
<rect x="35" y="500" width="570" height="110" rx="19" fill="#eef3ff" stroke="#a8bff0" stroke-width="2"/>
<text x="65" y="548" fill="#184bc0" font-family="Arial, sans-serif" font-size="25" font-weight="700">对照：B 先重新读取</text>
<text x="65" y="585" fill="#1b3159" font-family="Arial, sans-serif" font-size="21">恢复状态有 · 次数 1</text>
</svg>
