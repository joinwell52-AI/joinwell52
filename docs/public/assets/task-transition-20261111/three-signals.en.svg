<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" role="img" aria-label="On a blocked submission, the transition record, physical location, and caller response disagree">
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fffdf9"/><stop offset="1" stop-color="#f1eee9"/></linearGradient><linearGradient id="blue" x2="1" y2="1"><stop stop-color="#4d83ed"/><stop offset="1" stop-color="#1645bd"/></linearGradient></defs>
  <rect width="1000" height="350" rx="22" fill="url(#bg)"/>
  <text x="42" y="48" fill="#1e304c" font-family="Arial, sans-serif" font-weight="700" font-size="25">One submission, three observations</text>
  <path d="M350 82v205M680 82v205" stroke="#d6d0c6" stroke-width="2"/>
  <text x="190" y="110" text-anchor="middle" fill="#4d426f" font-family="Arial, sans-serif" font-size="19" font-weight="700">Transition record</text>
  <rect x="75" y="136" width="230" height="116" rx="14" fill="#ece7f6" stroke="#a193c9" stroke-width="3"/>
  <path d="M110 175h150M110 197h115" stroke="#8d7dbb" stroke-width="7" stroke-linecap="round"/>
  <circle cx="266" cy="220" r="14" fill="#7659bb"/>
  <text x="190" y="290" text-anchor="middle" fill="#4d426f" font-family="Arial, sans-serif" font-size="18">Says: entered review</text>
  <text x="515" y="110" text-anchor="middle" fill="#1b4498" font-family="Arial, sans-serif" font-size="19" font-weight="700">Physical location</text>
  <rect x="395" y="136" width="238" height="116" rx="14" fill="url(#blue)"/>
  <path d="M427 171h151M427 195h124" stroke="#dbe9ff" stroke-width="7" stroke-linecap="round"/>
  <text x="515" y="290" text-anchor="middle" fill="#1b4498" font-family="Arial, sans-serif" font-size="18">Still in active folder</text>
  <text x="835" y="110" text-anchor="middle" fill="#93601c" font-family="Arial, sans-serif" font-size="19" font-weight="700">Caller response</text>
  <circle cx="835" cy="193" r="55" fill="#f8e5c7" stroke="#cf933f" stroke-width="4"/>
  <path d="M810 168l50 50m0-50l-50 50" stroke="#ab6c21" stroke-width="7" stroke-linecap="round"/>
  <text x="835" y="290" text-anchor="middle" fill="#93601c" font-family="Arial, sans-serif" font-size="18">Reports an error</text>
  <text x="500" y="330" text-anchor="middle" fill="#68758a" font-family="Arial, sans-serif" font-size="15">Isolated fault injection · blocked after record write, before file move</text>
</svg>
