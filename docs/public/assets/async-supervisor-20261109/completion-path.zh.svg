  <g filter="url(#shade)"><rect x="88" y="95" width="220" height="130" rx="16" fill="url(#cobalt)"/><path d="M116 133h99m-99 20h151m-151 20h123" stroke="#cde3ff" stroke-width="7" stroke-linecap="round" opacity=".9"/><circle cx="272" cy="190" r="13" fill="#92d7fd"/></g>
  <path d="M309 160h170" stroke="#2e63d4" stroke-width="6" stroke-linecap="round"/>
  <path d="M479 160l-14-10v20z" fill="#2e63d4"/>
  <circle cx="506" cy="160" r="28" fill="#f3d7a6" stroke="#d39030" stroke-width="5"/>
  <path d="M493 147l26 26m0-26l-26 26" stroke="#a65f08" stroke-width="6" stroke-linecap="round"/>
  <path d="M535 160h154" stroke="#b8a998" stroke-width="5" stroke-dasharray="12 13"/>
  <path d="M689 160l-14-10v20z" fill="#b8a998"/>
  <g filter="url(#shade)"><rect x="718" y="94" width="195" height="132" rx="16" fill="#e9e4f9" stroke="#7c73b9" stroke-width="3"/><rect x="751" y="122" width="128" height="56" rx="10" fill="#b8ade5"/><path d="M775 151h80" stroke="#fff" stroke-width="7" stroke-linecap="round"/></g>
