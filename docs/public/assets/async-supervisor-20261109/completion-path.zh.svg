  <text x="815" y="262" text-anchor="middle" fill="#564d89" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700">主管仍需验收</text>
  <text x="500" y="304" text-anchor="middle" fill="#657084" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15">概念示意 · 中间断点来自受控模拟，不代表线上故障</text>
