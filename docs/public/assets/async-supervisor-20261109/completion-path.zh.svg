<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-label="后台工作结果、提醒投递和主管验收的三种状态">
  <defs>
    <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#fffdf9"/><stop offset="1" stop-color="#eee9df"/></linearGradient>
    <linearGradient id="cobalt" x2="1" y2="1"><stop stop-color="#4782f5"/><stop offset="1" stop-color="#1043bd"/></linearGradient>
    <filter id="shade"><feDropShadow dx="0" dy="9" stdDeviation="14" flood-color="#263654" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1000" height="330" rx="22" fill="url(#paper)"/>
  <path d="M80 0v232M275 0v232M720 0v232M920 0v232" stroke="#dcd5c9" stroke-width="15" opacity=".42"/>
