<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img"><title>写入已提交，回应却失败</title><rect width="1120" height="560" rx="24" fill="#faf8f3"/><style>text{font-family:'Microsoft YaHei','Segoe UI',sans-serif;fill:#172744}.title{font-size:32px;font-weight:700}.head{font-size:25px;font-weight:600}.body{font-size:23px}.note{font-size:22px;fill:#6143a8}</style><text x="48" y="64" class="title">写入已提交，回应却失败</text><rect x="48" y="110" width="450" height="145" rx="18" fill="#e6edff"/><text x="72" y="158" class="head">数据库提交一行</text><text x="72" y="212" class="body">提交真实发生</text><path d="M514 182H582m-14-10 14 10-14 10" fill="none" stroke="#294fca" stroke-width="4"/><rect x="606" y="110" width="466" height="145" rx="18" fill="#fff0d7"/><text x="630" y="158" class="head">随后抛出异常</text><text x="630" y="212" class="body">错误不能撤销已提交记录</text><text x="48" y="321" class="head">最多一次尝试</text><text x="48" y="369" class="body">前身：2 行 → 候选：1 行</text><text x="596" y="321" class="head">最多三次尝试</text><text x="596" y="369" class="body">前身：6 行 → 候选：3 行</text><text x="48" y="495" class="note">减少重复 ≠ 业务只发生一次</text></svg>
