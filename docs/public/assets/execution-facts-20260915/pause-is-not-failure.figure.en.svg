<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img"><title>Preserve the observed cause</title><rect width="1120" height="560" rx="24" fill="#faf8f3"/><style>text{font-family:'Microsoft YaHei','Segoe UI',sans-serif;fill:#172744}.title{font-size:32px;font-weight:700}.head{font-size:25px;font-weight:600}.body{font-size:23px}.note{font-size:22px;fill:#6143a8}</style><text x="48" y="64" class="title">Preserve the observed cause</text><rect x="48" y="120" width="324" height="158" rx="18" fill="#e8efff"/><text x="68" y="165" class="head">Precheck: active</text><text x="68" y="223" class="body">Company pauses</text><path d="M374 198h18" stroke="#294fca" stroke-width="3"/><rect x="396" y="120" width="324" height="158" rx="18" fill="#ede8fa"/><text x="416" y="165" class="head">Read the block cause</text><text x="416" y="223" class="body">company_paused</text><path d="M722 198h18" stroke="#294fca" stroke-width="3"/><rect x="744" y="120" width="324" height="158" rx="18" fill="#e8efff"/><text x="764" y="165" class="head">Company resumes</text><text x="764" y="223" class="body">Keep pause cause; skip</text><rect x="48" y="335" width="1020" height="108" rx="16" fill="white" stroke="#cad4e8"/><text x="72" y="376" class="head">Active company exceeds budget</text><text x="72" y="417" class="body">Budget escalation still applies</text><text x="48" y="511" class="note">Later state cannot rewrite an earlier cause</text></svg>
