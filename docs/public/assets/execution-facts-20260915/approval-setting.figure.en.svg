<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img"><title>Two distinct checks</title><rect width="1120" height="560" rx="24" fill="#faf8f3"/><style>text{font-family:'Microsoft YaHei','Segoe UI',sans-serif;fill:#172744}.title{font-size:32px;font-weight:700}.head{font-size:25px;font-weight:600}.body{font-size:23px}.note{font-size:22px;fill:#6143a8}</style><text x="48" y="64" class="title">Two distinct checks</text><rect x="48" y="110" width="496" height="332" rx="18" fill="white" stroke="#cad4e8"/><text x="72" y="155" class="head">Is the setting valid?</text><rect x="72" y="186" width="448" height="64" rx="10" fill="#edf1ff"/><text x="90" y="227" class="body">String “always”</text><text x="72" y="307" class="body">Before: tool runs once</text><text x="72" y="377" class="body">Candidate: error; no call</text><rect x="576" y="110" width="496" height="332" rx="18" fill="white" stroke="#cad4e8"/><text x="600" y="155" class="head">Did the check give an answer?</text><rect x="600" y="186" width="448" height="64" rx="10" fill="#edf1ff"/><text x="618" y="227" class="body">No answer (None)</text><text x="600" y="307" class="body">Both versions: tool runs once</text><text x="48" y="510" class="note">Setting validation ≠ result validation</text></svg>
