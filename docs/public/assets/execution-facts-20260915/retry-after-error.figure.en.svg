<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img"><title>The write commits before the error</title><rect width="1120" height="560" rx="24" fill="#faf8f3"/><style>text{font-family:'Microsoft YaHei','Segoe UI',sans-serif;fill:#172744}.title{font-size:32px;font-weight:700}.head{font-size:25px;font-weight:600}.body{font-size:23px}.note{font-size:22px;fill:#6143a8}</style><text x="48" y="64" class="title">The write commits before the error</text><rect x="48" y="110" width="450" height="145" rx="18" fill="#e6edff"/><text x="72" y="158" class="head">Commit a database row</text><text x="72" y="212" class="body">Actual SQLite commit</text><path d="M514 182H582m-14-10 14 10-14 10" fill="none" stroke="#294fca" stroke-width="4"/><rect x="606" y="110" width="466" height="145" rx="18" fill="#fff0d7"/><text x="630" y="158" class="head">Then raise an exception</text><text x="630" y="212" class="body">The error does not undo the commit</text><text x="48" y="321" class="head">One allowed attempt</text><text x="48" y="369" class="body">Before: 2 rows → Candidate: 1</text><text x="596" y="321" class="head">Three allowed attempts</text><text x="596" y="369" class="body">Before: 6 rows → Candidate: 3</text><text x="48" y="495" class="note">Fewer repeats ≠ one business effect</text></svg>
