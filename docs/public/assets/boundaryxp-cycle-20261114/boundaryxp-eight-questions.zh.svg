<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
<title id="title">7+1：把任务里的八个问题问清楚</title>
<desc id="desc">以八轴轮廓展示输入、交付、动作、责任、资源、版本依据、完成停止与独立禁止边界。此图用于解释维度，不表达评分。</desc>
<defs><linearGradient id="boundaryFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d8e9ff"/><stop offset="1" stop-color="#eaf6f5"/></linearGradient></defs>
<rect x="1" y="1" width="1198" height="918" rx="24" fill="#faf8f4" stroke="#d8e0ec" stroke-width="2"/>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif">
<text x="48" y="66" fill="#182a46" font-size="32" font-weight="700">7+1：把任务里的八个问题问清楚</text>
<polygon points="600.00,215.00 766.17,283.83 835.00,450.00 766.17,616.17 600.00,685.00 433.83,616.17 365.00,450.00 433.83,283.83" fill="url(#boundaryFill)" stroke="#2857c5" stroke-width="3"/>
