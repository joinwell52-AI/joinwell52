<line x1="600" y1="450" x2="766.17" y2="616.17" stroke="#a9bcd8" stroke-width="1.5"/>
<line x1="600" y1="450" x2="600.00" y2="685.00" stroke="#a9bcd8" stroke-width="1.5"/>
<line x1="600" y1="450" x2="433.83" y2="616.17" stroke="#a9bcd8" stroke-width="1.5"/>
<line x1="600" y1="450" x2="365.00" y2="450.00" stroke="#a9bcd8" stroke-width="1.5"/>
<line x1="600" y1="450" x2="433.83" y2="283.83" stroke="#a9bcd8" stroke-width="1.5"/>
<polygon points="600.00,318.40 693.06,356.94 731.60,450.00 693.06,543.06 600.00,581.60 506.94,543.06 468.40,450.00 506.94,356.94" fill="none" stroke="#c7d5e8" stroke-width="1.3" stroke-dasharray="5 6"/>
<line x1="600.00" y1="215.00" x2="600" y2="182" stroke="#b5c3d8" stroke-width="1.5"/>
<circle cx="600.00" cy="215.00" r="8" fill="#2857c5" stroke="#faf8f4" stroke-width="3"/>
<text x="600" y="140" text-anchor="middle" fill="#183d83" font-size="28" font-weight="700">I · 输入范围</text>
<text x="600" y="173" text-anchor="middle" fill="#52657e" font-size="22">用哪些资料？</text>
<line x1="766.17" y1="283.83" x2="940" y2="274" stroke="#b5c3d8" stroke-width="1.5"/>
<circle cx="766.17" cy="283.83" r="8" fill="#2857c5" stroke="#faf8f4" stroke-width="3"/>
<text x="940" y="232" text-anchor="middle" fill="#183d83" font-size="28" font-weight="700">O · 交付</text>
<text x="940" y="265" text-anchor="middle" fill="#52657e" font-size="22">交出什么成果？</text>
<line x1="835.00" y1="450.00" x2="900" y2="450" stroke="#b5c3d8" stroke-width="1.5"/>
<circle cx="835.00" cy="450.00" r="8" fill="#2857c5" stroke="#faf8f4" stroke-width="3"/>
<text x="1025" y="450" text-anchor="middle" fill="#183d83" font-size="28" font-weight="700">A · 动作</text>
<text x="1025" y="483" text-anchor="middle" fill="#52657e" font-size="22">必须／可以做什么？</text>
<line x1="766.17" y1="616.17" x2="940" y2="645" stroke="#b5c3d8" stroke-width="1.5"/>
<circle cx="766.17" cy="616.17" r="8" fill="#2857c5" stroke="#faf8f4" stroke-width="3"/>
<text x="940" y="687" text-anchor="middle" fill="#183d83" font-size="28" font-weight="700">P · 责任</text>
<text x="940" y="720" text-anchor="middle" fill="#52657e" font-size="22">谁执行、复核、批准？</text>
<line x1="600.00" y1="685.00" x2="600" y2="743" stroke="#b5c3d8" stroke-width="1.5"/>
<circle cx="600.00" cy="685.00" r="8" fill="#2857c5" stroke="#faf8f4" stroke-width="3"/>
<text x="600" y="785" text-anchor="middle" fill="#183d83" font-size="28" font-weight="700">R · 资源</text>
<text x="600" y="818" text-anchor="middle" fill="#52657e" font-size="22">预算和时限是多少？</text>
<line x1="433.83" y1="616.17" x2="260" y2="645" stroke="#b5c3d8" stroke-width="1.5"/>
<circle cx="433.83" cy="616.17" r="8" fill="#2857c5" stroke="#faf8f4" stroke-width="3"/>
<text x="260" y="687" text-anchor="middle" fill="#183d83" font-size="28" font-weight="700">V · 版本依据</text>
<text x="260" y="720" text-anchor="middle" fill="#52657e" font-size="22">按什么规则和版本？</text>
<line x1="365.00" y1="450.00" x2="300" y2="450" stroke="#b5c3d8" stroke-width="1.5"/>
<circle cx="365.00" cy="450.00" r="8" fill="#2857c5" stroke="#faf8f4" stroke-width="3"/>
<text x="175" y="450" text-anchor="middle" fill="#183d83" font-size="28" font-weight="700">C · 完成停止</text>
<text x="175" y="483" text-anchor="middle" fill="#52657e" font-size="22">何时完成、何时停止？</text>
<line x1="433.83" y1="283.83" x2="260" y2="274" stroke="#d1a46f" stroke-width="1.5"/>
<circle cx="433.83" cy="283.83" r="8" fill="#b86a13" stroke="#faf8f4" stroke-width="3"/>
<text x="260" y="232" text-anchor="middle" fill="#8e4b0f" font-size="28" font-weight="700">B · 禁止边界</text>
<text x="260" y="265" text-anchor="middle" fill="#52657e" font-size="22">哪些事情不能做？</text>
<circle cx="600" cy="450" r="91" fill="#faf8f4" stroke="#d4deeb" stroke-width="2"/>
<text x="600" y="435" text-anchor="middle" fill="#182a46" font-size="28" font-weight="700">任务边界</text>
<text x="600" y="481" text-anchor="middle" fill="#2857c5" font-size="38" font-weight="700">7+1</text>
<line x1="48" y1="858" x2="1152" y2="858" stroke="#d8e0ec" stroke-width="1.5"/>
<text x="600" y="892" text-anchor="middle" fill="#596a81" font-size="21">条款由同一对象、条件、范围与原文依据连接。此图展示维度，不表示分数。</text>
</g>
</svg>
