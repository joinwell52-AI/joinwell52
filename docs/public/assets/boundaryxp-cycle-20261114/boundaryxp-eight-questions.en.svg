<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
<title id="title">7+1: eight questions to clarify a task</title>
<desc id="desc">An eight-axis outline for input, deliverables, actions, responsibility, resources, governing basis, completion and stopping, and prohibitions. This is a dimension map, not a score.</desc>
<defs><linearGradient id="boundaryFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d8e9ff"/><stop offset="1" stop-color="#eaf6f5"/></linearGradient></defs>
<rect x="1" y="1" width="1198" height="918" rx="24" fill="#faf8f4" stroke="#d8e0ec" stroke-width="2"/>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif">
<text x="48" y="66" fill="#182a46" font-size="32" font-weight="700">7+1: eight questions to clarify a task</text>
<polygon points="600.00,215.00 766.17,283.83 835.00,450.00 766.17,616.17 600.00,685.00 433.83,616.17 365.00,450.00 433.83,283.83" fill="url(#boundaryFill)" stroke="#2857c5" stroke-width="3"/>
<line x1="600" y1="450" x2="600.00" y2="215.00" stroke="#a9bcd8" stroke-width="1.5"/>
<line x1="600" y1="450" x2="766.17" y2="283.83" stroke="#a9bcd8" stroke-width="1.5"/>
<line x1="600" y1="450" x2="835.00" y2="450.00" stroke="#a9bcd8" stroke-width="1.5"/>
<line x1="600" y1="450" x2="766.17" y2="616.17" stroke="#a9bcd8" stroke-width="1.5"/>
<line x1="600" y1="450" x2="600.00" y2="685.00" stroke="#a9bcd8" stroke-width="1.5"/>
<line x1="600" y1="450" x2="433.83" y2="616.17" stroke="#a9bcd8" stroke-width="1.5"/>
<line x1="600" y1="450" x2="365.00" y2="450.00" stroke="#a9bcd8" stroke-width="1.5"/>
<line x1="600" y1="450" x2="433.83" y2="283.83" stroke="#a9bcd8" stroke-width="1.5"/>
<polygon points="600.00,318.40 693.06,356.94 731.60,450.00 693.06,543.06 600.00,581.60 506.94,543.06 468.40,450.00 506.94,356.94" fill="none" stroke="#c7d5e8" stroke-width="1.3" stroke-dasharray="5 6"/>
<line x1="600.00" y1="215.00" x2="600" y2="182" stroke="#b5c3d8" stroke-width="1.5"/>
<circle cx="600.00" cy="215.00" r="8" fill="#2857c5" stroke="#faf8f4" stroke-width="3"/>
<text x="600" y="140" text-anchor="middle" fill="#183d83" font-size="24" font-weight="700">I · Input scope</text>
<text x="600" y="173" text-anchor="middle" fill="#52657e" font-size="18">Which materials and objects?</text>
<line x1="766.17" y1="283.83" x2="940" y2="274" stroke="#b5c3d8" stroke-width="1.5"/>
<circle cx="766.17" cy="283.83" r="8" fill="#2857c5" stroke="#faf8f4" stroke-width="3"/>
<text x="940" y="232" text-anchor="middle" fill="#183d83" font-size="24" font-weight="700">O · Deliverables</text>
<text x="940" y="265" text-anchor="middle" fill="#52657e" font-size="18">What must be delivered?</text>
<line x1="835.00" y1="450.00" x2="900" y2="450" stroke="#b5c3d8" stroke-width="1.5"/>
<circle cx="835.00" cy="450.00" r="8" fill="#2857c5" stroke="#faf8f4" stroke-width="3"/>
<text x="1025" y="450" text-anchor="middle" fill="#183d83" font-size="24" font-weight="700">A · Actions</text>
<text x="1025" y="483" text-anchor="middle" fill="#52657e" font-size="18">What must or may be done?</text>
<line x1="766.17" y1="616.17" x2="940" y2="645" stroke="#b5c3d8" stroke-width="1.5"/>
<circle cx="766.17" cy="616.17" r="8" fill="#2857c5" stroke="#faf8f4" stroke-width="3"/>
<text x="940" y="687" text-anchor="middle" fill="#183d83" font-size="24" font-weight="700">P · Responsibility</text>
<text x="940" y="720" text-anchor="middle" fill="#52657e" font-size="18">Who acts, reviews or approves?</text>
<line x1="600.00" y1="685.00" x2="600" y2="743" stroke="#b5c3d8" stroke-width="1.5"/>
<circle cx="600.00" cy="685.00" r="8" fill="#2857c5" stroke="#faf8f4" stroke-width="3"/>
<text x="600" y="785" text-anchor="middle" fill="#183d83" font-size="24" font-weight="700">R · Resources</text>
<text x="600" y="818" text-anchor="middle" fill="#52657e" font-size="18">What budget and time limits?</text>
<line x1="433.83" y1="616.17" x2="260" y2="645" stroke="#b5c3d8" stroke-width="1.5"/>
<circle cx="433.83" cy="616.17" r="8" fill="#2857c5" stroke="#faf8f4" stroke-width="3"/>
<text x="260" y="687" text-anchor="middle" fill="#183d83" font-size="24" font-weight="700">V · Governing basis</text>
<text x="260" y="720" text-anchor="middle" fill="#52657e" font-size="18">Which rules and versions?</text>
<line x1="365.00" y1="450.00" x2="300" y2="450" stroke="#b5c3d8" stroke-width="1.5"/>
<circle cx="365.00" cy="450.00" r="8" fill="#2857c5" stroke="#faf8f4" stroke-width="3"/>
<text x="175" y="450" text-anchor="middle" fill="#183d83" font-size="24" font-weight="700">C · Completion / stop</text>
<text x="175" y="483" text-anchor="middle" fill="#52657e" font-size="18">When is work done or stopped?</text>
<line x1="433.83" y1="283.83" x2="260" y2="274" stroke="#d1a46f" stroke-width="1.5"/>
<circle cx="433.83" cy="283.83" r="8" fill="#b86a13" stroke="#faf8f4" stroke-width="3"/>
<text x="260" y="232" text-anchor="middle" fill="#8e4b0f" font-size="24" font-weight="700">B · Prohibitions</text>
<text x="260" y="265" text-anchor="middle" fill="#52657e" font-size="18">What must not happen?</text>
<circle cx="600" cy="450" r="91" fill="#faf8f4" stroke="#d4deeb" stroke-width="2"/>
<text x="600" y="435" text-anchor="middle" fill="#182a46" font-size="23" font-weight="700">Task boundary</text>
<text x="600" y="481" text-anchor="middle" fill="#2857c5" font-size="38" font-weight="700">7+1</text>
<line x1="48" y1="858" x2="1152" y2="858" stroke="#d8e0ec" stroke-width="1.5"/>
<text x="600" y="892" text-anchor="middle" fill="#596a81" font-size="18">Link requirements through shared objects, conditions, scope and source evidence. No scores are shown.</text>
</g>
</svg>
