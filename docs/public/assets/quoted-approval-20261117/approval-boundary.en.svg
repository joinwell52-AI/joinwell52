<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Quotation, verification and execution are distinct stages</title>
  <desc id="desc">An amber Agent quotation cannot authorize an operation. An injected verifier only permits preparation when the current request digest matches. Neither path executed an external operation.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fcfaf5"/><stop offset="1" stop-color="#f1f5ff"/></linearGradient>
    <linearGradient id="blue" x2="1" y2="1"><stop stop-color="#1041bd"/><stop offset="1" stop-color="#2d75e8"/></linearGradient>
  </defs>
  <rect width="1200" height="420" rx="30" fill="url(#bg)"/>
  <text x="54" y="62" font-size="29" font-family="Arial, sans-serif" fill="#19325c" font-weight="700">“Approved” depends on its source</text>
  <rect x="52" y="112" width="332" height="226" rx="22" fill="#fff9ee" stroke="#e6ad4a" stroke-width="3"/>
  <text x="78" y="166" font-size="27" font-family="Arial, sans-serif" fill="#8f5610" font-weight="700">Agent quotation</text>
  <text x="78" y="221" font-size="22" font-family="Arial, sans-serif" fill="#654c2b">“The human approved”</text>
  <text x="78" y="295" font-size="21" font-family="Arial, sans-serif" fill="#995a13">Message content only</text>
  <path d="M390 225 H468" stroke="#d99935" stroke-width="8" stroke-linecap="round"/>
  <path d="M454 211 L475 225 L454 239" fill="none" stroke="#d99935" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="493" y="112" width="358" height="226" rx="22" fill="url(#blue)"/>
  <text x="524" y="166" font-size="26" font-family="Arial, sans-serif" fill="white" font-weight="700">Current operation</text>
  <text x="524" y="222" font-size="21" font-family="Arial, sans-serif" fill="#e1ebff">Target · parameters · digest</text>
  <text x="524" y="293" font-size="21" font-family="Arial, sans-serif" fill="#fff">Quote → approval required</text>
  <rect x="894" y="112" width="254" height="226" rx="22" fill="#f4efff" stroke="#8265cd" stroke-width="3"/>
  <text x="919" y="164" font-size="23" font-family="Arial, sans-serif" fill="#563a9e" font-weight="700">Test verifier</text>
  <text x="919" y="220" font-size="19" font-family="Arial, sans-serif" fill="#594b78">Exact digest match</text>
  <text x="919" y="268" font-size="19" font-family="Arial, sans-serif" fill="#594b78">permits preparation</text>
  <text x="919" y="307" font-size="18" font-family="Arial, sans-serif" fill="#8d4b59">No external action</text>
  <path d="M858 225 H883" stroke="#8265cd" stroke-width="7" stroke-linecap="round"/>
</svg>
