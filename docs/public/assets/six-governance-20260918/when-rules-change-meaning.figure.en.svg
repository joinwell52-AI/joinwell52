<svg xmlns="http://www.w3.org/2000/svg" width="800" height="830" viewBox="0 0 800 830" role="img" aria-labelledby="title"><title id="title">One action evaluated with three histories</title><g font-family="Microsoft YaHei, Arial, sans-serif"><rect x="0" y="0" width="800" height="830" rx="20" fill="#faf9f5"/><text x="40" y="65" font-size="36" fill="#103da8" font-weight="700">Same IDs do not restore history</text><text x="40" y="111" font-size="28" fill="#17335b" font-weight="400">Same agent, task ID and send action</text><rect x="40" y="149" width="720" height="153" rx="20" fill="#eef3ff"/><text x="65" y="197" font-size="29" fill="#17335b" font-weight="700">Full history</text><text x="65" y="250" font-size="28" fill="#17335b" font-weight="400">Sensitive read + review</text><text x="575" y="250" font-size="33" fill="#103da8" font-weight="700">BLOCK</text><rect x="40" y="327" width="720" height="153" rx="20" fill="#fff0dc"/><text x="65" y="375" font-size="29" fill="#17335b" font-weight="700">New engine: partial history</text><text x="65" y="428" font-size="28" fill="#17335b" font-weight="400">Review only</text><text x="575" y="428" font-size="33" fill="#88500b" font-weight="700">ALLOW</text><rect x="40" y="505" width="720" height="153" rx="20" fill="#eef3ff"/><text x="65" y="553" font-size="29" fill="#17335b" font-weight="700">New engine: restored history</text><text x="65" y="606" font-size="28" fill="#17335b" font-weight="400">Sensitive read + review</text><text x="575" y="606" font-size="33" fill="#103da8" font-weight="700">BLOCK</text><text x="40" y="729" font-size="27" fill="#17335b" font-weight="400">Local missing-history controls; no actual sends.</text><text x="40" y="771" font-size="27" fill="#17335b" font-weight="400">kyvvu-engine 0.11.0 · original policy decisions</text><text x="40" y="812" font-size="27" fill="#17335b" font-weight="400">Does not demonstrate hosted recovery failure.</text></g></svg>
