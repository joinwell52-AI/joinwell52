<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 760" role="img" aria-labelledby="t d">
  <title id="t">同一句成功报告，三种不同证据</title><desc id="d">缺执行记录、失败进程和成功进程对应不同观察，均未自动批准。</desc>
  <rect width="390" height="760" rx="20" fill="#f8f5ef"/>
  <g font-family="Microsoft YaHei, sans-serif">
    <text x="22" y="42" font-size="20" fill="#193b81" font-weight="700">报告称：已批准、测试通过</text>
    <text x="22" y="69" font-size="14" fill="#596b87">固定报告，只改变执行记录</text>
    <rect x="18" y="91" width="354" height="169" rx="17" fill="#fff" stroke="#d2dce9"/>
    <circle cx="44" cy="120" r="9" fill="#c9953e"/><text x="63" y="126" font-size="18" fill="#253d68" font-weight="700">没有执行记录</text>
    <text x="40" y="164" font-size="16" fill="#4d5e7e">成功进程 0 · 缺证据</text><text x="40" y="194" font-size="16" fill="#9b5d1c">观察：高风险</text><text x="40" y="229" font-size="16" fill="#473f8f">验收：仍是草稿</text>
    <rect x="18" y="278" width="354" height="169" rx="17" fill="#fff" stroke="#d2dce9"/>
    <circle cx="44" cy="307" r="9" fill="#d07a40"/><text x="63" y="313" font-size="18" fill="#253d68" font-weight="700">测试进程失败</text>
    <text x="40" y="351" font-size="16" fill="#4d5e7e">失败进程 1 · 失败保留</text><text x="40" y="381" font-size="16" fill="#a75730">观察：高风险</text><text x="40" y="416" font-size="16" fill="#473f8f">验收：仍是草稿</text>
    <rect x="18" y="465" width="354" height="169" rx="17" fill="#fff" stroke="#d2dce9"/>
    <circle cx="44" cy="494" r="9" fill="#2458c5"/><text x="63" y="500" font-size="18" fill="#253d68" font-weight="700">测试进程成功</text>
    <text x="40" y="538" font-size="16" fill="#4d5e7e">外层进程成功 1</text><text x="40" y="568" font-size="16" fill="#2458c5">通过断言数：未核实</text><text x="40" y="603" font-size="16" fill="#473f8f">验收：仍是草稿</text>
    <rect x="18" y="657" width="354" height="76" rx="16" fill="#e8e5f7"/><text x="36" y="688" font-size="16" fill="#473f8f" font-weight="700">报告 ≠ 执行记录</text><text x="36" y="715" font-size="16" fill="#473f8f" font-weight="700">执行记录 ≠ REVIEW 决议</text>
  </g>
</svg>
