<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 760" role="img" aria-labelledby="t d">
  <title id="t">One success report, three evidence states</title><desc id="d">Missing evidence, a failed process, and a successful process produce different observations, but no automatic acceptance.</desc>
  <rect width="390" height="760" rx="20" fill="#f8f5ef"/>
  <g font-family="Arial, sans-serif">
    <text x="22" y="42" font-size="20" fill="#193b81" font-weight="700">Report: approved, tests passed</text>
    <text x="22" y="69" font-size="14" fill="#596b87">Same report; only evidence changes</text>
    <rect x="18" y="91" width="354" height="169" rx="17" fill="#fff" stroke="#d2dce9"/>
    <circle cx="44" cy="120" r="9" fill="#c9953e"/><text x="63" y="126" font-size="18" fill="#253d68" font-weight="700">No action record</text>
    <text x="40" y="164" font-size="16" fill="#4d5e7e">Successful processes: 0</text><text x="40" y="194" font-size="16" fill="#9b5d1c">Evidence gap · high risk</text><text x="40" y="229" font-size="16" fill="#473f8f">Acceptance: still draft</text>
    <rect x="18" y="278" width="354" height="169" rx="17" fill="#fff" stroke="#d2dce9"/>
    <circle cx="44" cy="307" r="9" fill="#d07a40"/><text x="63" y="313" font-size="18" fill="#253d68" font-weight="700">Test process failed</text>
    <text x="40" y="351" font-size="16" fill="#4d5e7e">Failed processes: 1</text><text x="40" y="381" font-size="16" fill="#a75730">Failure kept · high risk</text><text x="40" y="416" font-size="16" fill="#473f8f">Acceptance: still draft</text>
    <rect x="18" y="465" width="354" height="169" rx="17" fill="#fff" stroke="#d2dce9"/>
    <circle cx="44" cy="494" r="9" fill="#2458c5"/><text x="63" y="500" font-size="18" fill="#253d68" font-weight="700">Test process succeeded</text>
    <text x="40" y="538" font-size="16" fill="#4d5e7e">Outer process success: 1</text><text x="40" y="568" font-size="16" fill="#2458c5">Passing assertions: unknown</text><text x="40" y="603" font-size="16" fill="#473f8f">Acceptance: still draft</text>
    <rect x="18" y="657" width="354" height="76" rx="16" fill="#e8e5f7"/><text x="36" y="688" font-size="16" fill="#473f8f" font-weight="700">Report ≠ action record</text><text x="36" y="715" font-size="16" fill="#473f8f" font-weight="700">Action record ≠ REVIEW decision</text>
  </g>
</svg>
