<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" role="img" aria-labelledby="t d">
  <title id="t">One success report, three different evidence states</title><desc id="d">The report wording stays fixed. Missing evidence, a failed process, and a successful process produce different observations, but none automatically creates acceptance.</desc>
  <rect width="1200" height="530" rx="28" fill="#f8f5ef"/>
  <text x="56" y="65" font-size="27" font-family="Arial, sans-serif" fill="#193b81" font-weight="700">The report always says: approved, all tests passed</text>
  <text x="56" y="100" font-size="18" font-family="Arial, sans-serif" fill="#596b87">Only the execution record changes. Observation and acceptance stay separate.</text>
  <g font-family="Arial, sans-serif">
    <rect x="52" y="137" width="342" height="264" rx="20" fill="#fff" stroke="#d2dce9" stroke-width="2"/>
    <circle cx="83" cy="175" r="12" fill="#c9953e"/><text x="108" y="183" font-size="22" fill="#253d68" font-weight="700">No action record</text>
    <text x="78" y="237" font-size="19" fill="#4d5e7e">Successful processes: 0</text><text x="78" y="275" font-size="19" fill="#9b5d1c">Evidence gap · high risk</text>
    <path d="M78 307H366" stroke="#d9e0e8" stroke-width="2"/><text x="78" y="354" font-size="20" fill="#473f8f">Acceptance: still draft</text>
    <rect x="429" y="137" width="342" height="264" rx="20" fill="#fff" stroke="#d2dce9" stroke-width="2"/>
    <circle cx="460" cy="175" r="12" fill="#d07a40"/><text x="485" y="183" font-size="22" fill="#253d68" font-weight="700">Test process failed</text>
    <text x="455" y="237" font-size="19" fill="#4d5e7e">Failed processes: 1</text><text x="455" y="275" font-size="19" fill="#a75730">Failure kept · high risk</text>
    <path d="M455 307H743" stroke="#d9e0e8" stroke-width="2"/><text x="455" y="354" font-size="20" fill="#473f8f">Acceptance: still draft</text>
    <rect x="806" y="137" width="342" height="264" rx="20" fill="#fff" stroke="#d2dce9" stroke-width="2"/>
    <circle cx="837" cy="175" r="12" fill="#2458c5"/><text x="862" y="183" font-size="22" fill="#253d68" font-weight="700">Test process succeeded</text>
    <text x="832" y="237" font-size="19" fill="#4d5e7e">Outer process success: 1</text><text x="832" y="275" font-size="19" fill="#2458c5">Passing assertions: unverified</text>
    <path d="M832 307H1120" stroke="#d9e0e8" stroke-width="2"/><text x="832" y="354" font-size="20" fill="#473f8f">Acceptance: still draft</text>
    <rect x="52" y="433" width="1096" height="55" rx="15" fill="#e8e5f7"/><text x="80" y="469" font-size="21" fill="#473f8f" font-weight="700">Report = claim · Action record = observation · REVIEW = decision artifact</text>
  </g>
</svg>
