<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" role="img" aria-labelledby="title desc">
  <title id="title">What one synthetic failure retained</title>
  <desc id="desc">The recognized fake key was hidden; an unformatted fake sensitive value remained in the action row and long error file.</desc>
  <rect width="400" height="700" rx="22" fill="#f8f4ea"/>
  <text x="24" y="47" fill="#163d98" font-size="25" font-weight="700" font-family="Arial,sans-serif">One failure, two results</text>
  <text x="24" y="78" fill="#536171" font-size="16" font-family="Arial,sans-serif">Synthetic input; no command was run</text>
  <rect x="24" y="105" width="352" height="217" rx="20" fill="#fff" stroke="#b7caff" stroke-width="2"/>
  <text x="44" y="143" fill="#163d98" font-size="21" font-weight="700" font-family="Arial,sans-serif">One failed tool result</text>
  <circle cx="51" cy="183" r="8" fill="#2255cf"/><text x="72" y="190" fill="#243953" font-size="18" font-family="Arial,sans-serif">Known fake key</text>
  <rect x="247" y="164" width="98" height="34" rx="17" fill="#2255cf"/><text x="296" y="186" text-anchor="middle" fill="#fff" font-size="15" font-weight="700" font-family="Arial,sans-serif">Hidden</text>
  <path d="M44 214H356" stroke="#e0e1dc" stroke-width="2"/>
  <circle cx="51" cy="251" r="8" fill="#ad6814"/><text x="72" y="258" fill="#243953" font-size="18" font-family="Arial,sans-serif">Other fake value</text>
  <rect x="247" y="232" width="98" height="34" rx="17" fill="#ad6814"/><text x="296" y="254" text-anchor="middle" fill="#fff" font-size="15" font-weight="700" font-family="Arial,sans-serif">Retained</text>
  <text x="44" y="296" fill="#65717e" font-size="15" font-family="Arial,sans-serif">Pattern cannot infer the second value's privacy</text>
  <path d="M200 323v42m-10-11 10 12 10-12" fill="none" stroke="#557ad0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="24" y="404" fill="#163d98" font-size="22" font-weight="700" font-family="Arial,sans-serif">Two stored surfaces</text>
  <rect x="24" y="426" width="352" height="103" rx="17" fill="#e7eeff" stroke="#b7caff" stroke-width="2"/>
  <text x="44" y="463" fill="#163d98" font-size="21" font-weight="700" font-family="Arial,sans-serif">Command in action row</text>
  <text x="44" y="498" fill="#526278" font-size="17" font-family="Arial,sans-serif">Key hidden · other value retained</text>
  <rect x="24" y="548" width="352" height="103" rx="17" fill="#e7eeff" stroke="#b7caff" stroke-width="2"/>
  <text x="44" y="585" fill="#163d98" font-size="21" font-weight="700" font-family="Arial,sans-serif">Referenced error file</text>
  <text x="44" y="620" fill="#526278" font-size="17" font-family="Arial,sans-serif">Key hidden · other value retained</text>
</svg>
