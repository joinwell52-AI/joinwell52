<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" role="img" aria-labelledby="title desc">
  <title id="title">合成失败的信息留存</title>
  <desc id="desc">已识别假密钥被遮盖；非标准假敏感值进入动作记录和长错误文件。</desc>
  <rect width="400" height="700" rx="22" fill="#f8f4ea"/>
  <text x="24" y="47" fill="#163d98" font-size="25" font-weight="700" font-family="Microsoft YaHei,sans-serif">一次失败，两种结果</text>
  <text x="24" y="78" fill="#536171" font-size="16" font-family="Microsoft YaHei,sans-serif">合成输入；命令没有真正执行</text>
  <rect x="24" y="105" width="352" height="217" rx="20" fill="#fff" stroke="#b7caff" stroke-width="2"/>
  <text x="44" y="143" fill="#163d98" font-size="21" font-weight="700" font-family="Microsoft YaHei,sans-serif">同一条工具失败</text>
  <circle cx="51" cy="183" r="8" fill="#2255cf"/><text x="72" y="190" fill="#243953" font-size="18" font-family="Microsoft YaHei,sans-serif">已识别假密钥</text>
  <rect x="247" y="164" width="98" height="34" rx="17" fill="#2255cf"/><text x="296" y="187" text-anchor="middle" fill="#fff" font-size="16" font-weight="700" font-family="Microsoft YaHei,sans-serif">原值遮盖</text>
  <path d="M44 214H356" stroke="#e0e1dc" stroke-width="2"/>
  <circle cx="51" cy="251" r="8" fill="#ad6814"/><text x="72" y="258" fill="#243953" font-size="18" font-family="Microsoft YaHei,sans-serif">非标准假敏感值</text>
  <rect x="247" y="232" width="98" height="34" rx="17" fill="#ad6814"/><text x="296" y="255" text-anchor="middle" fill="#fff" font-size="16" font-weight="700" font-family="Microsoft YaHei,sans-serif">原值保留</text>
  <text x="44" y="296" fill="#65717e" font-size="15" font-family="Microsoft YaHei,sans-serif">格式规则识别前者，无法推知后者私密</text>
  <path d="M200 323v42m-10-11 10 12 10-12" fill="none" stroke="#557ad0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="24" y="404" fill="#163d98" font-size="22" font-weight="700" font-family="Microsoft YaHei,sans-serif">两个落盘位置</text>
  <rect x="24" y="426" width="352" height="103" rx="17" fill="#e7eeff" stroke="#b7caff" stroke-width="2"/>
  <text x="44" y="463" fill="#163d98" font-size="21" font-weight="700" font-family="Microsoft YaHei,sans-serif">动作记录中的命令</text>
  <text x="44" y="498" fill="#526278" font-size="17" font-family="Microsoft YaHei,sans-serif">假密钥已遮盖 · 非标准值仍在</text>
  <rect x="24" y="548" width="352" height="103" rx="17" fill="#e7eeff" stroke="#b7caff" stroke-width="2"/>
  <text x="44" y="585" fill="#163d98" font-size="21" font-weight="700" font-family="Microsoft YaHei,sans-serif">引用的长错误文件</text>
  <text x="44" y="620" fill="#526278" font-size="17" font-family="Microsoft YaHei,sans-serif">假密钥已遮盖 · 非标准值仍在</text>
</svg>
