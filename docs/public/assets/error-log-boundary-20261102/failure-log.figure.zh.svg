<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" role="img" aria-labelledby="title desc">
  <title id="title">一次失败，两种信息留存结果</title>
  <desc id="desc">合成工具失败进入格式脱敏，已识别格式的假密钥被遮盖，非标准假敏感标记保留在动作记录和长错误输出文件。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#eee8da"/></linearGradient>
    <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#123cb8"/><stop offset="1" stop-color="#2768df"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#18346f" flood-opacity=".10"/></filter>
  </defs>
  <rect width="960" height="650" rx="30" fill="url(#paper)"/>
  <path d="M48 126H912M48 422H912" stroke="#d9d6cc" stroke-width="2"/>
  <text x="55" y="66" fill="#153a8f" font-size="31" font-weight="700" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif">合成失败：同一条工具结果</text>
  <text x="55" y="102" fill="#4e5b6b" font-size="22" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif">输入含两种假值；命令没有真正执行</text>
  <rect x="55" y="154" width="382" height="205" rx="22" fill="#fff" stroke="#c5d6ff" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="94" cy="201" r="19" fill="#dce7ff"/><path d="M84 201l7 7 14-16" fill="none" stroke="#1a53d2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="126" y="209" fill="#153a8f" font-size="28" font-weight="700" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif">已识别格式的假密钥</text>
  <text x="82" y="270" fill="#536171" font-size="24" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif">格式规则能识别</text>
  <rect x="81" y="292" width="138" height="42" rx="21" fill="url(#blue)"/><text x="150" y="321" text-anchor="middle" fill="#fff" font-size="23" font-weight="700" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif">原值遮盖</text>
  <rect x="523" y="154" width="382" height="205" rx="22" fill="#fff" stroke="#e8c28d" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="562" cy="201" r="19" fill="#fff0d6"/><text x="562" y="209" text-anchor="middle" fill="#a56313" font-size="27" font-weight="700">?</text>
  <text x="594" y="209" fill="#805016" font-size="28" font-weight="700" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif">无固定格式的假敏感值</text>
  <text x="550" y="270" fill="#536171" font-size="24" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif">规则不知道它私密</text>
  <rect x="549" y="292" width="138" height="42" rx="21" fill="#a56313"/><text x="618" y="321" text-anchor="middle" fill="#fff" font-size="23" font-weight="700" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif">原值保留</text>
  <path d="M246 360v25h234m234-25v25H480m0 0v27" fill="none" stroke="#557ad0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="m469 400 11 13 11-13" fill="none" stroke="#557ad0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="55" y="469" fill="#153a8f" font-size="27" font-weight="700" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif">实际落盘的两个观察面</text>
  <rect x="55" y="493" width="410" height="112" rx="18" fill="#e8efff" stroke="#b2c8ff" stroke-width="2"/>
  <text x="82" y="536" fill="#173d9b" font-size="26" font-weight="700" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif">动作记录中的命令</text>
  <text x="82" y="579" fill="#5a6575" font-size="21" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif">假密钥已遮盖 · 非标准值仍在</text>
  <rect x="495" y="493" width="410" height="112" rx="18" fill="#e8efff" stroke="#b2c8ff" stroke-width="2"/>
  <text x="522" y="536" fill="#173d9b" font-size="26" font-weight="700" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif">引用的长错误输出文件</text>
  <text x="522" y="579" fill="#5a6575" font-size="21" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif">假密钥已遮盖 · 非标准值仍在</text>
</svg>
