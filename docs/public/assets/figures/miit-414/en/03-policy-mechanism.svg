<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#718398"/></marker></defs><rect width="1440" height="800" fill="#f8fafc"/><g font-family="Microsoft YaHei, sans-serif"><text x="64" y="70" fill="#2468b4" font-size="18" font-weight="700">414 / 03</text><text x="64" y="130" fill="#152a3e" font-size="40" font-weight="700">Organizing providers, collaboration, and demand</text><text x="64" y="178" fill="#64758a" font-size="23" font-weight="400">Pools support discovery; consortia support delivery; real scenarios create places to apply AI.</text><text x="64" y="258" fill="#2468b4" font-size="20" font-weight="700">TASK 1</text><text x="64" y="310" fill="#152a3e" font-size="33" font-weight="700">Map service providers</text><text x="64" y="368" fill="#152a3e" font-size="19" font-weight="400">Local survey → profiles → national pool</text><text x="64" y="413" fill="#64758a" font-size="22" font-weight="400">Make capabilities discoverable</text><path d="M473 303H498V303" fill="none" stroke="#718398" stroke-width="3" marker-end="url(#arrow)"/><text x="512" y="258" fill="#2468b4" font-size="20" font-weight="700">TASK 2</text><text x="512" y="310" fill="#152a3e" font-size="33" font-weight="700">Build service consortia</text><text x="512" y="368" fill="#152a3e" font-size="20" font-weight="400">Lead provider + supply-chain partners</text><text x="512" y="413" fill="#64758a" font-size="22" font-weight="400">Combine solutions and delivery</text><path d="M921 303H946V303" fill="none" stroke="#718398" stroke-width="3" marker-end="url(#arrow)"/><text x="960" y="258" fill="#2468b4" font-size="20" font-weight="700">TASK 3</text><text x="960" y="310" fill="#152a3e" font-size="33" font-weight="700">Connect with demand</text><text x="960" y="368" fill="#152a3e" font-size="22" font-weight="400">Real scenarios + reusable packages</text><text x="960" y="413" fill="#64758a" font-size="19" font-weight="400">Match needs with practical applications</text><rect x="64" y="465" width="1312" height="145" rx="16" fill="#e6eff8"/><text x="92" y="512" fill="#2468b4" font-size="23" font-weight="700">TASK 4  ·  Provide shared support</text><text x="92" y="560" fill="#152a3e" font-size="24" font-weight="400">Computing &amp; networks  /  Coding tools &amp; APIs  /  Trials  /  Talent &amp; FDEs</text><text x="64" y="669" fill="#64758a" font-size="23" font-weight="400">Ongoing tracking, expert guidance, and evaluation inform subsequent implementation.</text><path d="M64 724H1376" stroke="#d4dee7"/><text x="64" y="762" fill="#64758a" font-size="18" font-weight="400">Source: Document No. 414, four key tasks and implementation requirements; explanatory structure.</text></g></svg>
