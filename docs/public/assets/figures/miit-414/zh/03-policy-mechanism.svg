<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#718398"/></marker></defs><rect width="1440" height="800" fill="#f8fafc"/><g font-family="Microsoft YaHei, sans-serif"><text x="64" y="70" fill="#2468b4" font-size="18" font-weight="700">414 / 03</text><text x="64" y="130" fill="#152a3e" font-size="40" font-weight="700">从识别服务商，到组织可交付的供需关系</text><text x="64" y="178" fill="#64758a" font-size="23" font-weight="400">资源池解决“找谁”，服务团解决“怎样协作”，应用场景解决“在哪里形成价值”。</text><text x="64" y="258" fill="#2468b4" font-size="20" font-weight="700">任务一</text><text x="64" y="310" fill="#152a3e" font-size="33" font-weight="700">建立资源池</text><text x="64" y="368" fill="#152a3e" font-size="22" font-weight="400">地方摸排 → 建档 → 全国资源池</text><text x="64" y="413" fill="#64758a" font-size="22" font-weight="400">让服务供给可被识别和发现</text><path d="M473 303H498V303" fill="none" stroke="#718398" stroke-width="3" marker-end="url(#arrow)"/><text x="512" y="258" fill="#2468b4" font-size="20" font-weight="700">任务二</text><text x="512" y="310" fill="#152a3e" font-size="33" font-weight="700">组建服务团</text><text x="512" y="368" fill="#152a3e" font-size="22" font-weight="400">牵头服务商 + 上下游单位</text><text x="512" y="413" fill="#64758a" font-size="22" font-weight="400">形成一体化方案与集成交付</text><path d="M921 303H946V303" fill="none" stroke="#718398" stroke-width="3" marker-end="url(#arrow)"/><text x="960" y="258" fill="#2468b4" font-size="20" font-weight="700">任务三</text><text x="960" y="310" fill="#152a3e" font-size="33" font-weight="700">组织应用需求</text><text x="960" y="368" fill="#152a3e" font-size="22" font-weight="400">真实场景 + 可复用产品包</text><text x="960" y="413" fill="#64758a" font-size="22" font-weight="400">推动供需对接与应用落地</text><rect x="64" y="465" width="1312" height="145" rx="16" fill="#e6eff8"/><text x="92" y="512" fill="#2468b4" font-size="27" font-weight="700">任务四  ·  提供公共支撑</text><text x="92" y="560" fill="#152a3e" font-size="26" font-weight="400">算力与网络       编程工具与接口       试用通道       人才培养与 FDE</text><text x="64" y="669" fill="#64758a" font-size="23" font-weight="400">持续跟踪、专家指导与实施评估，推动行动结果反馈到后续工作。</text><path d="M64 724H1376" stroke="#d4dee7"/><text x="64" y="762" fill="#64758a" font-size="18" font-weight="400">依据：414号文四项重点任务与工作要求；组织关系为解释性示意。</text></g></svg>
