<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><title>Decision-evidence references</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#3263c4"/></marker></defs><rect width="1600" height="1000" fill="#f6f8fd"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="70" y="67" fill="#163c84" font-size="37" font-weight="700"><tspan x="70" dy="0">Traceable decisions do not give observers execution power</tspan></text><text x="70" y="110" fill="#637186" font-size="23" font-weight="400"><tspan x="70" dy="0">Stable case identity + current decision + bounded references · frozen-contract summary</tspan></text><rect x="570" y="155" width="500" height="150" rx="18" fill="#eaf1ff" stroke="#8eafe5" stroke-width="2"/><text x="600" y="194" fill="#194ca0" font-size="29" font-weight="700"><tspan x="600" dy="0">Effect facts + current authority</tspan></text><text x="600" y="239" fill="#19334f" font-size="23" font-weight="400"><tspan x="600" dy="0">Verify current revision / round</tspan><tspan x="600" dy="34.04">Operation authority where applicable</tspan></text><path d="M820 305V365" fill="none" stroke="#3263c4" stroke-width="3"  marker-end="url(#arrow)"/><rect x="70" y="365" width="400" height="180" rx="18" fill="#fff" stroke="#d3dce8" stroke-width="2"/><text x="100" y="405" fill="#19334f" font-size="29" font-weight="700"><tspan x="100" dy="0">Historical receipt</tspan></text><text x="100" y="451" fill="#19334f" font-size="22" font-weight="400"><tspan x="100" dy="0">Explains why the prior run began</tspan><tspan x="100" dy="32.56">No new execution permission</tspan></text><path d="M470 454H550" fill="none" stroke="#7954b9" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/><rect x="570" y="385" width="500" height="210" rx="18" fill="#153e87" stroke="#153e87" stroke-width="2"/><text x="600" y="432" fill="#ffffff" font-size="32" font-weight="700"><tspan x="600" dy="0">interruption case</tspan></text><text x="600" y="481" fill="#e8f0ff" font-size="23" font-weight="400"><tspan x="600" dy="0">case_id + interrupted_attempt_id</tspan><tspan x="600" dy="34.04">current evaluation revision + digest</tspan><tspan x="600" dy="34.04">records facts, authority, and disposition</tspan></text><path d="M1070 481H1138" fill="none" stroke="#3263c4" stroke-width="3"  marker-end="url(#arrow)"/><rect x="1160" y="385" width="370" height="210" rx="18" fill="#f1edfa" stroke="#b6a2d6" stroke-width="2"/><text x="1185" y="428" fill="#67459d" font-size="25" font-weight="700"><tspan x="1185" dy="0">Decision / blocking record</tspan></text><text x="1185" y="471" fill="#19334f" font-size="22" font-weight="400"><tspan x="1185" dy="0">not_admitted</tspan><tspan x="1185" dy="32.56">reexecute / reconcile_only</tspan><tspan x="1185" dy="32.56">hold_for_review</tspan></text><text x="1185" y="563" fill="#67459d" font-size="19" font-weight="400"><tspan x="1185" dy="0">Not every record permits a start</tspan></text><rect x="70" y="680" width="1000" height="145" rx="18" fill="#fff" stroke="#b6a2d6" stroke-width="2"/><text x="100" y="724" fill="#67459d" font-size="27" font-weight="700"><tspan x="100" dy="0">Optional: fact check / diagnostics / EVAL observation</tspan></text><text x="100" y="772" fill="#19334f" font-size="23" font-weight="400"><tspan x="100" dy="0">References, summaries, digests, reason codes only; no wake or dispatch power</tspan></text><path d="M820 680V615" fill="none" stroke="#7954b9" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/><rect x="1160" y="680" width="370" height="145" rx="18" fill="#fff4df" stroke="#e1b35d" stroke-width="2"/><text x="1185" y="724" fill="#895b0c" font-size="27" font-weight="700"><tspan x="1185" dy="0">Raw-text boundary</tspan></text><text x="1185" y="770" fill="#19334f" font-size="22" font-weight="400"><tspan x="1185" dy="0">Restricted storage and access</tspan><tspan x="1185" dy="32.56">No raw text in ordinary views</tspan></text><text x="70" y="887" fill="#4e5f75" font-size="22" font-weight="400"><tspan x="70" dy="0">Solid: admission inputs and decision record. Dashed: optional or historical references, never dispatch instructions.</tspan></text><text x="70" y="931" fill="#637186" font-size="21" font-weight="400"><tspan x="70" dy="0">Source: RUN-004: 57 pass / 0 fail / 0 skipped. Existing component boundaries, not new-feature end-to-end acceptance.</tspan></text></g></svg>
