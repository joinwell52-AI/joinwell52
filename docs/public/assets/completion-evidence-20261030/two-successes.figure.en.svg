<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title desc" font-family="Arial, 'Microsoft YaHei', sans-serif">
  <title id="title">Same-task and cross-task completion control</title>
  <desc id="desc">Writing and submitting A moves A to review. Writing A but submitting B leaves A active, while both session settlements say done.</desc>
  <defs>
    <linearGradient id="paper" x2="0" y2="1"><stop stop-color="#fffdfa"/><stop offset="1" stop-color="#f2eee8"/></linearGradient>
    <linearGradient id="blue" x2="0" y2="1"><stop stop-color="#3569df"/><stop offset="1" stop-color="#1241a9"/></linearGradient>
  </defs>
  <rect width="900" height="760" rx="36" fill="url(#paper)"/>
  <text x="54" y="76" font-size="39" font-weight="700" fill="#1c2942">Do both successes belong to one task?</text>
  <rect x="48" y="110" width="804" height="270" rx="30" fill="#ffffff" stroke="#d9dfec" stroke-width="2"/>
  <text x="78" y="166" font-size="34" font-weight="700" fill="#244783">Same-task control</text>
  <rect x="78" y="195" width="205" height="74" rx="17" fill="url(#blue)"/>
  <text x="180" y="244" text-anchor="middle" font-size="30" font-weight="700" fill="white">Write A</text>
  <text x="314" y="244" font-size="39" fill="#6680ba">→</text>
  <rect x="363" y="195" width="205" height="74" rx="17" fill="url(#blue)"/>
  <text x="465" y="244" text-anchor="middle" font-size="30" font-weight="700" fill="white">Submit A</text>
  <text x="599" y="244" font-size="39" fill="#6680ba">→</text>
  <rect x="648" y="195" width="176" height="74" rx="17" fill="#ebe5ff"/>
  <text x="736" y="244" text-anchor="middle" font-size="30" font-weight="700" fill="#5637a7">A: review</text>
  <text x="80" y="334" font-size="28" fill="#47566e">Session: done　·　Formal task: review</text>
  <rect x="48" y="404" width="804" height="270" rx="30" fill="#ffffff" stroke="#e4d8c7" stroke-width="2"/>
  <text x="78" y="460" font-size="34" font-weight="700" fill="#865c19">Cross-task control</text>
  <rect x="78" y="489" width="205" height="74" rx="17" fill="url(#blue)"/>
  <text x="180" y="538" text-anchor="middle" font-size="30" font-weight="700" fill="white">Write A</text>
  <text x="314" y="538" font-size="39" fill="#6680ba">→</text>
  <rect x="363" y="489" width="205" height="74" rx="17" fill="#e4a53d"/>
  <text x="465" y="538" text-anchor="middle" font-size="30" font-weight="700" fill="#282c38">Submit B</text>
  <text x="599" y="538" font-size="39" fill="#b27d32">→</text>
  <rect x="648" y="489" width="176" height="74" rx="17" fill="#fff0da"/>
  <text x="736" y="538" text-anchor="middle" font-size="30" font-weight="700" fill="#8b5815">A: active</text>
  <text x="80" y="628" font-size="28" fill="#47566e">Session: done　·　Formal task: active</text>
  <text x="450" y="722" text-anchor="middle" font-size="24" fill="#66728a">Controlled illustration · Session outcome ≠ task stage</text>
</svg>
