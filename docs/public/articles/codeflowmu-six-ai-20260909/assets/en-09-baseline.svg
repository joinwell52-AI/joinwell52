<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="466" viewBox="0 0 1200 466" role="img" aria-labelledby="title desc">
<title id="title">Repeat testing: preserve old evidence, verify the next baseline</title><desc id="desc">Proposed procedure; this does not claim every step was completed in the observed test. </desc>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
<defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#087e99"/></marker></defs>
<rect width="1200" height="466" rx="14" fill="#f3f7fa"/>
<text x="32" y="44.0" font-size="28" fill="#152b41" font-weight="700">Repeat testing: preserve old evidence, verify the next baseline</text><text x="32" y="77.0" font-size="17" fill="#52677c" font-weight="400">Proposed procedure; this does not claim every step was completed in the observed test.</text><rect x="32.0" y="112" width="362.6666666666667" height="137" rx="10" fill="white" stroke="#ccdce6"/><rect x="32.0" y="112" width="362.6666666666667" height="4" rx="2" fill="#087e99"/><text x="50.0" y="146.0" font-size="21" fill="#087e99" font-weight="700">1 · Export and verify</text><text x="50.0" y="188.0" font-size="17" fill="#52677c" font-weight="400">Chat, logs and EVAL outputs; validate</text><text x="50.0" y="211.8" font-size="17" fill="#52677c" font-weight="400">inventory and hashes.</text><path d="M397.6666666666667 181 L415.6666666666667 181" fill="none" stroke="#087e99" stroke-width="2" marker-end="url(#a)"/><rect x="418.6666666666667" y="112" width="362.6666666666667" height="137" rx="10" fill="white" stroke="#ccdce6"/><rect x="418.6666666666667" y="112" width="362.6666666666667" height="4" rx="2" fill="#087e99"/><text x="436.6666666666667" y="146.0" font-size="21" fill="#087e99" font-weight="700">2 · Initialize and check</text><text x="436.6666666666667" y="188.0" font-size="17" fill="#52677c" font-weight="400">Git, skills, configuration and</text><text x="436.6666666666667" y="211.8" font-size="17" fill="#52677c" font-weight="400">historical references.</text><path d="M784.3333333333334 181 L802.3333333333334 181" fill="none" stroke="#087e99" stroke-width="2" marker-end="url(#a)"/><rect x="805.3333333333334" y="112" width="362.6666666666667" height="137" rx="10" fill="white" stroke="#ccdce6"/><rect x="805.3333333333334" y="112" width="362.6666666666667" height="4" rx="2" fill="#087e99"/><text x="823.3333333333334" y="146.0" font-size="21" fill="#087e99" font-weight="700">3 · Switch and restart</text><text x="823.3333333333334" y="188.0" font-size="17" fill="#52677c" font-weight="400">Restart port 18766; check actual</text><text x="823.3333333333334" y="211.8" font-size="17" fill="#52677c" font-weight="400">models for every role.</text><rect x="32.0" y="271" width="362.6666666666667" height="137" rx="10" fill="white" stroke="#ccdce6"/><rect x="32.0" y="271" width="362.6666666666667" height="4" rx="2" fill="#087e99"/><text x="50.0" y="305.0" font-size="21" fill="#087e99" font-weight="700">4 · Run the same task</text><text x="50.0" y="347.0" font-size="17" fill="#52677c" font-weight="400">Record elapsed time, scope and human</text><text x="50.0" y="370.8" font-size="17" fill="#52677c" font-weight="400">intervention.</text><path d="M397.6666666666667 340 L415.6666666666667 340" fill="none" stroke="#087e99" stroke-width="2" marker-end="url(#a)"/><rect x="418.6666666666667" y="271" width="362.6666666666667" height="137" rx="10" fill="white" stroke="#ccdce6"/><rect x="418.6666666666667" y="271" width="362.6666666666667" height="4" rx="2" fill="#087e99"/><text x="436.6666666666667" y="305.0" font-size="21" fill="#087e99" font-weight="700">5 · Generate EVAL</text><text x="436.6666666666667" y="347.0" font-size="17" fill="#52677c" font-weight="400">Independently verify the batch and</text><text x="436.6666666666667" y="370.8" font-size="17" fill="#52677c" font-weight="400">material identity.</text><path d="M784.3333333333334 340 L802.3333333333334 340" fill="none" stroke="#087e99" stroke-width="2" marker-end="url(#a)"/><rect x="805.3333333333334" y="271" width="362.6666666666667" height="137" rx="10" fill="white" stroke="#ccdce6"/><rect x="805.3333333333334" y="271" width="362.6666666666667" height="4" rx="2" fill="#087e99"/><text x="823.3333333333334" y="305.0" font-size="21" fill="#087e99" font-weight="700">6 · Freeze and compare</text><text x="823.3333333333334" y="347.0" font-size="17" fill="#52677c" font-weight="400">Review after archiving; retain</text><text x="823.3333333333334" y="370.8" font-size="17" fill="#52677c" font-weight="400">unsuccessful runs.</text>
<text x="32" y="440.0" font-size="16" fill="#52677c" font-weight="400"></text></svg>