<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="515" viewBox="0 0 1200 515" role="img" aria-labelledby="title desc">
<title id="title">EVAL observations: six runs, different conclusions</title><desc id="desc">Panel and task risks come from independent analysis sections. They are not model performance scores. Risk ratings assess their stated evidence and scope; missing reports are retained as missing.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
<defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#087e99"/></marker></defs>
<rect width="1200" height="515" rx="14" fill="#f3f7fa"/>
<text x="32" y="44.0" font-size="28" fill="#152b41" font-weight="700">EVAL observations: six runs, different conclusions</text><text x="32" y="77.0" font-size="17" fill="#52677c" font-weight="400">Panel and task risks come from independent analysis sections. They are not model performance scores.</text><text x="32" y="126.0" font-size="19" fill="#087e99" font-weight="700">Run</text><text x="200" y="126.0" font-size="19" fill="#087e99" font-weight="700">Panel risk</text><text x="366" y="126.0" font-size="19" fill="#087e99" font-weight="700">Task risk</text><text x="540" y="126.0" font-size="19" fill="#087e99" font-weight="700">Key task-observation finding</text><path d="M32 190H1168" stroke="#dce5ee"/><text x="32" y="173.0" font-size="17" fill="#152b41" font-weight="400">Codex</text><text x="200" y="173.0" font-size="17" fill="#152b41" font-weight="400">Low</text><text x="366" y="173.0" font-size="17" fill="#152b41" font-weight="400">Medium</text><text x="540" y="173.0" font-size="17" fill="#152b41" font-weight="400">partial: inspection completed; verification gaps remain</text><path d="M32 241H1168" stroke="#dce5ee"/><text x="32" y="224.0" font-size="17" fill="#152b41" font-weight="400">Doubao</text><text x="200" y="224.0" font-size="17" fill="#152b41" font-weight="400">Medium</text><text x="366" y="224.0" font-size="17" fill="#b96618" font-weight="400">High</text><text x="540" y="224.0" font-size="17" fill="#152b41" font-weight="400">disputed: frozen material has a different run identity</text><path d="M32 292H1168" stroke="#dce5ee"/><text x="32" y="275.0" font-size="17" fill="#152b41" font-weight="400">DeepSeek</text><text x="200" y="275.0" font-size="17" fill="#152b41" font-weight="400">Low</text><text x="366" y="275.0" font-size="17" fill="#b96618" font-weight="400">High</text><text x="540" y="275.0" font-size="17" fill="#152b41" font-weight="400">disputed: morning Codex raw material was mixed in</text><path d="M32 343H1168" stroke="#dce5ee"/><text x="32" y="326.0" font-size="17" fill="#152b41" font-weight="400">Kimi</text><text x="200" y="326.0" font-size="17" fill="#152b41" font-weight="400">Missing</text><text x="366" y="326.0" font-size="17" fill="#152b41" font-weight="400">Missing</text><text x="540" y="326.0" font-size="17" fill="#152b41" font-weight="400">No successfully generated final EVAL pair obtained</text><path d="M32 394H1168" stroke="#dce5ee"/><text x="32" y="377.0" font-size="17" fill="#152b41" font-weight="400">Qwen</text><text x="200" y="377.0" font-size="17" fill="#152b41" font-weight="400">Medium</text><text x="366" y="377.0" font-size="17" fill="#b96618" font-weight="400">High</text><text x="540" y="377.0" font-size="17" fill="#152b41" font-weight="400">blocked: delivery; disputed: associated material</text><path d="M32 445H1168" stroke="#dce5ee"/><text x="32" y="428.0" font-size="17" fill="#152b41" font-weight="400">Cursor</text><text x="200" y="428.0" font-size="17" fill="#152b41" font-weight="400">Medium</text><text x="366" y="428.0" font-size="17" fill="#b96618" font-weight="400">High</text><text x="540" y="428.0" font-size="17" fill="#152b41" font-weight="400">disputed: recovery not correctly captured in frozen input</text>
<text x="32" y="489.0" font-size="16" fill="#52677c" font-weight="400">Risk ratings assess their stated evidence and scope; missing reports are retained as missing.</text></svg>