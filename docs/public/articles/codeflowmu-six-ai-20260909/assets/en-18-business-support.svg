<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="562" viewBox="0 0 1200 562" role="img" aria-labelledby="title desc">
<title id="title">How CodeFlowMu supports judgment after agents work</title><desc id="desc">Formal records preserve execution; verification, authorized decisions and independent observation have distinct roles. EVAL and diagnosis provide evidence for decisions; neither is an automatic task-approval gate.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
<defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#087e99"/></marker></defs>
<rect width="1200" height="562" rx="14" fill="#f3f7fa"/>
<text x="32" y="44.0" font-size="28" fill="#152b41" font-weight="700">How CodeFlowMu supports judgment after agents work</text><text x="32" y="77.0" font-size="17" fill="#52677c" font-weight="400">Formal records preserve execution; verification, authorized decisions and independent observation have distinct roles.</text><text x="28" y="161.0" font-size="18" fill="#52677c" font-weight="700">Delivery</text><rect x="144" y="117" width="328" height="109" rx="10" fill="white" stroke="#ccdce6"/><rect x="144" y="117" width="328" height="4" rx="2" fill="#087e99"/><text x="160" y="148.0" font-size="20" fill="#087e99" font-weight="700">Formal task and roles</text><text x="160" y="181.0" font-size="16" fill="#52677c" font-weight="400">TASK · parent/child links ·</text><text x="160" y="203.4" font-size="16" fill="#52677c" font-weight="400">session binding</text><path d="M474 169 L486 169" fill="none" stroke="#087e99" stroke-width="2" marker-end="url(#a)"/><rect x="490" y="117" width="328" height="109" rx="10" fill="white" stroke="#ccdce6"/><rect x="490" y="117" width="328" height="4" rx="2" fill="#087e99"/><text x="506" y="148.0" font-size="20" fill="#087e99" font-weight="700">Agents execute tools</text><text x="506" y="181.0" font-size="16" fill="#52677c" font-weight="400">Actions, results, errors and</text><text x="506" y="203.4" font-size="16" fill="#52677c" font-weight="400">timestamps</text><path d="M820 169 L832 169" fill="none" stroke="#087e99" stroke-width="2" marker-end="url(#a)"/><rect x="836" y="117" width="328" height="109" rx="10" fill="white" stroke="#ccdce6"/><rect x="836" y="117" width="328" height="4" rx="2" fill="#087e99"/><text x="852" y="148.0" font-size="20" fill="#087e99" font-weight="700">Formal report submission</text><text x="852" y="181.0" font-size="16" fill="#52677c" font-weight="400">REPORT · delivery confirmation ·</text><text x="852" y="203.4" font-size="16" fill="#52677c" font-weight="400">receipts</text><text x="28" y="295.0" font-size="18" fill="#52677c" font-weight="700">Judgment</text><rect x="144" y="251" width="328" height="109" rx="10" fill="white" stroke="#ccdce6"/><rect x="144" y="251" width="328" height="4" rx="2" fill="#087e99"/><text x="160" y="282.0" font-size="20" fill="#087e99" font-weight="700">Fact-check records</text><text x="160" y="315.0" font-size="16" fill="#52677c" font-weight="400">REVIEW-GATE · evidence and open</text><text x="160" y="337.4" font-size="16" fill="#52677c" font-weight="400">decisions</text><path d="M474 303 L486 303" fill="none" stroke="#087e99" stroke-width="2" marker-end="url(#a)"/><rect x="490" y="251" width="328" height="109" rx="10" fill="white" stroke="#ccdce6"/><rect x="490" y="251" width="328" height="4" rx="2" fill="#087e99"/><text x="506" y="282.0" font-size="20" fill="#087e99" font-weight="700">PM / ADMIN decisions</text><text x="506" y="315.0" font-size="16" fill="#52677c" font-weight="400">Child-task and root-task</text><text x="506" y="337.4" font-size="16" fill="#52677c" font-weight="400">acceptance</text><rect x="836" y="251" width="328" height="109" rx="10" fill="white" stroke="#ccdce6"/><rect x="836" y="251" width="328" height="4" rx="2" fill="#087e99"/><text x="852" y="282.0" font-size="20" fill="#087e99" font-weight="700">Independent EVAL</text><text x="852" y="315.0" font-size="16" fill="#52677c" font-weight="400">Analyzes evidence; does not</text><text x="852" y="337.4" font-size="16" fill="#52677c" font-weight="400">approve tasks</text><text x="28" y="429.0" font-size="18" fill="#52677c" font-weight="700">Recovery</text><rect x="144" y="385" width="328" height="109" rx="10" fill="white" stroke="#ccdce6"/><rect x="144" y="385" width="328" height="4" rx="2" fill="#087e99"/><text x="160" y="416.0" font-size="20" fill="#087e99" font-weight="700">Correlate the records</text><text x="160" y="449.0" font-size="16" fill="#52677c" font-weight="400">Task, Session, logs and complete</text><text x="160" y="471.4" font-size="16" fill="#52677c" font-weight="400">results</text><path d="M474 437 L486 437" fill="none" stroke="#087e99" stroke-width="2" marker-end="url(#a)"/><rect x="490" y="385" width="328" height="109" rx="10" fill="white" stroke="#ccdce6"/><rect x="490" y="385" width="328" height="4" rx="2" fill="#087e99"/><text x="506" y="416.0" font-size="20" fill="#087e99" font-weight="700">Record the diagnosis</text><text x="506" y="449.0" font-size="16" fill="#52677c" font-weight="400">ISSUE · confirmed facts and</text><text x="506" y="471.4" font-size="16" fill="#52677c" font-weight="400">unknown causes</text><path d="M820 437 L832 437" fill="none" stroke="#087e99" stroke-width="2" marker-end="url(#a)"/><rect x="836" y="385" width="328" height="109" rx="10" fill="white" stroke="#ccdce6"/><rect x="836" y="385" width="328" height="4" rx="2" fill="#087e99"/><text x="852" y="416.0" font-size="20" fill="#087e99" font-weight="700">Authorized recovery</text><text x="852" y="449.0" font-size="16" fill="#52677c" font-weight="400">Approval · cancellation · rerun ·</text><text x="852" y="471.4" font-size="16" fill="#52677c" font-weight="400">new receipts</text>
<text x="32" y="536.0" font-size="16" fill="#52677c" font-weight="400">EVAL and diagnosis provide evidence for decisions; neither is an automatic task-approval gate.</text></svg>