<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="307" viewBox="0 0 1200 307" role="img" aria-labelledby="title desc">
<title id="title">PMs chose different task relationships</title><desc id="desc">Structural summary; the diagram does not represent actual concurrency. Kimi created no downstream task in the preserved run.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
<defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#087e99"/></marker></defs>
<rect width="1200" height="307" rx="14" fill="#f3f7fa"/>
<text x="32" y="44.0" font-size="28" fill="#152b41" font-weight="700">PMs chose different task relationships</text><text x="32" y="77.0" font-size="17" fill="#52677c" font-weight="400">Structural summary; the diagram does not represent actual concurrency.</text><rect x="32.0" y="112" width="362.6666666666667" height="137" rx="10" fill="white" stroke="#ccdce6"/><rect x="32.0" y="112" width="362.6666666666667" height="4" rx="2" fill="#087e99"/><text x="50.0" y="146.0" font-size="21" fill="#087e99" font-weight="700">Codex / Doubao / DeepSeek</text><text x="50.0" y="188.0" font-size="17" fill="#52677c" font-weight="400">PM → DEV, OPS, QA. Three specialist</text><text x="50.0" y="211.8" font-size="17" fill="#52677c" font-weight="400">tasks, without explicit dependencies.</text><path d="M397.6666666666667 181 L415.6666666666667 181" fill="none" stroke="#087e99" stroke-width="2" marker-end="url(#a)"/><rect x="418.6666666666667" y="112" width="362.6666666666667" height="137" rx="10" fill="white" stroke="#ccdce6"/><rect x="418.6666666666667" y="112" width="362.6666666666667" height="4" rx="2" fill="#087e99"/><text x="436.6666666666667" y="146.0" font-size="21" fill="#087e99" font-weight="700">Qwen</text><text x="436.6666666666667" y="188.0" font-size="17" fill="#52677c" font-weight="400">PM → DEV and OPS. DEV → QA carried</text><text x="436.6666666666667" y="211.8" font-size="17" fill="#52677c" font-weight="400">informational_reference, yet QA</text><text x="436.6666666666667" y="235.6" font-size="17" fill="#52677c" font-weight="400">waited.</text><path d="M784.3333333333334 181 L802.3333333333334 181" fill="none" stroke="#087e99" stroke-width="2" marker-end="url(#a)"/><rect x="805.3333333333334" y="112" width="362.6666666666667" height="137" rx="10" fill="white" stroke="#ccdce6"/><rect x="805.3333333333334" y="112" width="362.6666666666667" height="4" rx="2" fill="#087e99"/><text x="823.3333333333334" y="146.0" font-size="21" fill="#087e99" font-weight="700">Cursor</text><text x="823.3333333333334" y="188.0" font-size="17" fill="#52677c" font-weight="400">QA 003 cancelled → QA 005 rerun. The</text><text x="823.3333333333334" y="211.8" font-size="17" fill="#52677c" font-weight="400">original task and authorized recovery</text><text x="823.3333333333334" y="235.6" font-size="17" fill="#52677c" font-weight="400">relationship were retained.</text>
<text x="32" y="281.0" font-size="16" fill="#52677c" font-weight="400">Kimi created no downstream task in the preserved run.</text></svg>